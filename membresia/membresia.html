<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch Premium</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, #302060 0%, #15112d 42%, #080817 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: rgba(20, 18, 45, 0.94);
      border: 1px solid rgba(214, 178, 78, 0.35);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      background: linear-gradient(135deg, #d9b85a, #8f6b20);
      box-shadow: 0 10px 30px rgba(217, 184, 90, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin: 12px 0 26px;
      color: #c9c5d9;
      line-height: 1.5;
    }

    .price {
      margin: 22px 0;
      font-size: 34px;
      font-weight: 700;
      color: #e7c86a;
    }

    .price span {
      font-size: 15px;
      font-weight: 400;
      color: #aaa6bd;
    }

    .benefits {
      text-align: left;
      margin: 28px 0;
      padding: 0;
      list-style: none;
    }

    .benefits li {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      color: #e8e5ef;
    }

    .benefits li::before {
      content: "✓";
      color: #e7c86a;
      font-weight: bold;
      margin-right: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      color: #17121f;
      background: linear-gradient(135deg, #f0d77b, #b99336);
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .status {
      min-height: 24px;
      margin-top: 18px;
      color: #c9c5d9;
      font-size: 14px;
      line-height: 1.4;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #aaa6bd;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }
  </style>
</head>

<body>

  <main class="container">
    <section class="card">

      <div class="icon">◆</div>

      <h1>EmiMatch Premium</h1>

      <p class="subtitle">
        Más posibilidades para conectar, conversar y conocer personas.
      </p>

      <div class="price">
        $10.000 ARS
        <span>/ mes</span>
      </div>

      <ul class="benefits">
        <li>Experiencia Premium de EmiMatch</li>
        <li>Más posibilidades de conexión</li>
        <li>Funciones Premium exclusivas</li>
        <li>Cuenta protegida y segura</li>
      </ul>

      <button id="premiumButton">
        Obtener Premium
      </button>

      <div id="premiumStatus" class="status"></div>

      <a class="back" href="../index.html">
        ← Volver a EmiMatch
      </a>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    const button = document.getElementById("premiumButton");
    const status = document.getElementById("premiumStatus");

    const SUPABASE_URL =
      "https://kngiadwaesdbmvwivdev.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    async function iniciarPremium() {
      button.disabled = true;
      status.textContent = "Comprobando tu cuenta...";

      try {
        const {
          data: sessionData,
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
          throw sessionError;
        }

        const session = sessionData?.session;

        if (!session) {
          status.textContent =
            "Necesitás iniciar sesión en EmiMatch para continuar.";

          button.disabled = false;
          return;
        }

        status.textContent =
          "Preparando tu membresía Premium...";

        const {
          data,
          error
        } = await supabaseClient.rpc(
          "prepare_premium_subscription"
        );

        if (error) {
          throw error;
        }

        if (!data || data.success !== true) {
          throw new Error(
            data?.error ||
            "No se pudo preparar la membresía."
          );
        }

        status.textContent =
          "Membresía Premium preparada correctamente. El pago todavía no se ha realizado.";

      } catch (error) {
        console.error(
          "Error Premium:",
          error
        );

        status.textContent =
          "No se pudo preparar Premium. Intentá nuevamente.";

      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener(
      "click",
      iniciarPremium
    );
  </script>

</body>
</html>
