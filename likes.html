<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Me gusta · EmiMatch</title>

  <meta
    name="description"
    content="Personas que mostraron interés en vos en EmiMatch."
  >

  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    :root {
      --bg: #070b18;
      --card: rgba(18, 24, 48, 0.88);
      --card-2: rgba(25, 31, 60, 0.92);
      --gold: #f5c76a;
      --gold-2: #ffd98a;
      --text: #ffffff;
      --muted: #aeb7d3;
      --danger: #ff6b81;
      --success: #64e6a6;
      --border: rgba(255,255,255,.09);
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(91, 73, 190, .22),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(245, 199, 106, .10),
          transparent 30%
        ),
        linear-gradient(180deg, #080c1c 0%, #050812 100%);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        calc(92px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .back {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      color: white;
      font-size: 20px;
    }

    .brand {
      flex: 1;
      text-align: center;
    }

    .brand strong {
      display: block;
      font-size: 18px;
      letter-spacing: -.3px;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .spacer {
      width: 44px;
    }

    .hero {
      padding: 22px;
      border-radius: 28px;
      background:
        linear-gradient(
          145deg,
          rgba(36, 43, 86, .92),
          rgba(12, 17, 38, .94)
        );
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(245,199,106,.10);
      border: 1px solid rgba(245,199,106,.20);
      font-size: 28px;
      margin-bottom: 15px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(25px, 6vw, 34px);
      line-height: 1.05;
      letter-spacing: -.8px;
    }

    .hero p {
      margin: 9px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .counter {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      color: var(--gold-2);
      font-size: 13px;
      font-weight: 700;
    }

    .status {
      display: none;
      padding: 14px 16px;
      margin-bottom: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #ffd6dc;
      border-color: rgba(255,107,129,.25);
      background: rgba(255,107,129,.08);
    }

    .likes-list {
      display: grid;
      gap: 14px;
    }

    .like-card {
      display: grid;
      grid-template-columns: 76px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-radius: 23px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 12px 35px rgba(0,0,0,.20);
      overflow: hidden;
    }

    .avatar-wrap {
      width: 76px;
      height: 76px;
      border-radius: 21px;
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          rgba(245,199,106,.18),
          rgba(83,71,170,.30)
        );
      border: 1px solid rgba(255,255,255,.10);
      flex-shrink: 0;
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 28px;
    }

    .like-info {
      min-width: 0;
    }

    .like-name {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .like-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .like-bio {
      margin-top: 8px;
      color: #cbd2e8;
      font-size: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action {
      min-width: 82px;
      min-height: 40px;
      padding: 9px 12px;
      border: 0;
      border-radius: 13px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      color: #07101f;
      background: var(--gold);
      box-shadow: 0 8px 20px rgba(245,199,106,.16);
    }

    .action.secondary {
      color: #e7ebf8;
      background: rgba(255,255,255,.07);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .action:disabled {
      opacity: .55;
      cursor: default;
    }

    .empty {
      text-align: center;
      padding: 42px 24px;
      border-radius: 25px;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--border);
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .empty h2 {
      margin: 0;
      font-size: 20px;
    }

    .empty p {
      margin: 8px auto 20px;
      max-width: 420px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .primary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 14px;
      background: var(--gold);
      color: #07101f;
      font-weight: 800;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 100;
      display: none;
      max-width: 560px;
      margin: auto;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(16,22,43,.96);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 15px 40px rgba(0,0,0,.40);
      color: white;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(16px);
    }

    .toast.show {
      display: block;
      animation: toastIn .2s ease-out;
    }

    .toast.error {
      border-color: rgba(255,107,129,.30);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 560px) {
      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .hero {
        padding: 19px;
        border-radius: 23px;
      }

      .like-card {
        grid-template-columns: 64px minmax(0, 1fr);
        align-items: start;
        padding: 12px;
      }

      .avatar-wrap {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }

      .actions {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .action {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="topbar">
      <a
        class="back"
        href="menu.html"
        aria-label="Volver"
      >‹</a>

      <div class="brand">
        <strong>EmiMatch</strong>
        <span>Personas interesadas en vos</span>
      </div>

      <div class="spacer"></div>
    </header>

    <section class="hero">
      <div class="hero-icon">✨</div>

      <h1>Me gusta</h1>

      <p>
        Acá aparecen las personas que mostraron interés en tu perfil.
        Podés conocerlas y decidir si también querés conectar.
      </p>

      <div class="counter">
        <span>♥</span>
        <span id="counter">0 personas</span>
      </div>
    </section>

    <div
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    ></div>

    <section
      id="likesList"
      class="likes-list"
      aria-live="polite"
    ></section>

  </main>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script src="assets/js/config.js"></script>

  <script src="https://esm.sh/@supabase/supabase-js@2"></script>

  <script>
    (() => {
      "use strict";

      const config = window.EMIMATCH_CONFIG || {};

      const supabaseUrl = config.supabaseUrl;
      const supabaseAnonKey = config.supabaseAnonKey;

      if (!supabaseUrl || !supabaseAnonKey) {
        console.error(
          "EmiMatch: faltan las credenciales de Supabase en config.js"
        );
        return;
      }

      const { createClient } = window.supabase;

      const db = createClient(
        supabaseUrl,
        supabaseAnonKey
      );

      let me = null;
      let toastTimer = null;

      const likesList = document.getElementById("likesList");
      const statusEl = document.getElementById("status");
      const counterEl = document.getElementById("counter");
      const toastEl = document.getElementById("toast");

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function notice(message, error = false) {
        clearTimeout(toastTimer);

        toastEl.textContent = message;
        toastEl.className = "toast show" + (
          error ? " error" : ""
        );

        toastTimer = setTimeout(() => {
          toastEl.className = "toast";
        }, 2800);
      }

      function setStatus(message, error = false) {
        if (!message) {
          statusEl.textContent = "";
          statusEl.className = "status";
          return;
        }

        statusEl.textContent = message;
        statusEl.className =
          "status show" + (error ? " error" : "");
      }

      function updateCounter(count) {
        counterEl.textContent =
          count === 1
            ? "1 persona"
            : `${count} personas`;
      }

      function normalizePhoto(url) {
        if (!url) return "";

        const value = String(url).trim();

        if (
          value.startsWith("http://") ||
          value.startsWith("https://") ||
          value.startsWith("data:")
        ) {
          return value;
        }

        return "";
      }

      function renderEmpty() {
        updateCounter(0);

        likesList.innerHTML = `
          <div class="empty">
            <div class="empty-icon">✨</div>

            <h2>Todavía no hay Me gusta</h2>

            <p>
              Cuando alguien muestre interés en tu perfil,
              aparecerá acá.
            </p>

            <a
              class="primary-link"
              href="descubrir.html"
            >
              Explorar perfiles
            </a>
          </div>
        `;
      }

      function renderLikes(profiles) {
        updateCounter(profiles.length);

        if (!profiles.length) {
          renderEmpty();
          return;
        }

        likesList.innerHTML = profiles.map(profile => {
          const id = escapeHtml(profile.id);
          const name = escapeHtml(
            profile.nombre || "Usuario de EmiMatch"
          );

          const age = Number(profile.edad);
          const ageText =
            Number.isFinite(age) && age > 0
              ? `${age} años`
              : "";

          const city = escapeHtml(
            profile.ciudad || ""
          );

          const meta = [ageText, city]
            .filter(Boolean)
            .join(" · ");

          const bio = escapeHtml(
            profile.descripcion ||
            profile.bio ||
            "Le interesó tu perfil."
          );

          const photo = normalizePhoto(
            profile.foto_url
          );

          const avatar = photo
            ? `
              <img
                class="avatar"
                src="${escapeHtml(photo)}"
                alt="Foto de ${name}"
                loading="lazy"
                onerror="this.parentElement.innerHTML='<div class=&quot;avatar-placeholder&quot;>👤</div>'"
              >
            `
            : `
              <div class="avatar-placeholder">
                👤
              </div>
            `;

          return `
            <article
              class="like-card"
              id="like-${id}"
            >

              <a
                class="avatar-wrap"
                href="perfil-usuario.html?id=${encodeURIComponent(profile.id)}"
                aria-label="Ver perfil de ${name}"
              >
                ${avatar}
              </a>

              <div class="like-info">

                <h2 class="like-name">
                  ${name}
                </h2>

                <div class="like-meta">
                  ${escapeHtml(meta || "Perfil de EmiMatch")}
                </div>

                <div class="like-bio">
                  ${bio}
                </div>

              </div>

              <div class="actions">

                <button
                  class="action"
                  type="button"
                  data-action="like"
                  data-id="${id}"
                >
                  ♥ Me gusta
                </button>

                <button
                  class="action secondary"
                  type="button"
                  data-action="dislike"
                  data-id="${id}"
                >
                  Pasar
                </button>

              </div>

            </article>
          `;
        }).join("");
      }

      async function loadLikes() {
        setStatus("Cargando personas...");

        const {
          data: authData,
          error: authError
        } = await db.auth.getUser();

        if (authError) {
          console.error(authError);
          setStatus(
            "No se pudo comprobar tu sesión.",
            true
          );
          return;
        }

        me = authData?.user || null;

        if (!me) {
          window.location.href = "index.html";
          return;
        }

        /*
         * Esta lista es un beneficio Premium.
         * La autorización se comprueba en Supabase,
         * no solamente ocultando elementos de la página.
         */
        const {
          data: premiumActive,
          error: premiumError
        } = await db.rpc("is_premium");

        if (premiumError) {
          console.error("Error comprobando Premium:", premiumError);
          setStatus("No se pudo verificar tu membresía. Intentá nuevamente.", true);
          return;
        }

        if (premiumActive !== true) {
          setStatus("");
          counterEl.textContent = "Exclusivo Premium";
          likesList.innerHTML = `
            <div class="empty">
              <div class="empty-icon">💎</div>
              <h2>Descubrí quién gusta de vos</h2>
              <p>
                Con EmiMatch Premium podés ver las personas que te dieron Me gusta
                y decidir si también querés conectar.
              </p>
              <a class="primary-link" href="membresia/membresia.html">
                Conocer Premium
              </a>
            </div>
          `;
          return;
        }

        /*
         * La función del servidor devuelve únicamente
         * los Me gusta recibidos por esta cuenta Premium.
         */
        const {
          data: receivedLikes,
          error: likesError
        } = await db.rpc("get_received_likes");

        if (likesError) {
          console.error(
            "Error cargando likes:",
            likesError
          );

          setStatus(
            "No se pudieron cargar los Me gusta. Revisá tu conexión y las políticas RLS de swipes.",
            true
          );

          updateCounter(0);
          return;
        }

        if (!receivedLikes?.length) {
          setStatus("");
          renderEmpty();
          return;
        }

        const ids = [
          ...new Set(
            receivedLikes
              .map(item => item.user_id)
              .filter(Boolean)
          )
        ];

        if (!ids.length) {
          setStatus("");
          renderEmpty();
          return;
        }

        const {
          data: profiles,
          error: profilesError
        } = await db
          .from("profiles")
          .select("*")
          .in("id", ids);

        if (profilesError) {
          console.error(
            "Error cargando perfiles:",
            profilesError
          );

          setStatus(
            "Los Me gusta se encontraron, pero no se pudieron cargar los perfiles.",
            true
          );

          return;
        }

        const byId = new Map(
          (profiles || []).map(profile => [
            profile.id,
            profile
          ])
        );

        const orderedProfiles = ids
          .map(id => byId.get(id))
          .filter(Boolean);

        setStatus("");
        renderLikes(orderedProfiles);
      }

      async function swipe(id, action) {
        if (!me) {
          notice(
            "Tu sesión no está disponible.",
            true
          );
          return;
        }

        if (
          action !== "like" &&
          action !== "dislike"
        ) {
          console.error(
            "Acción inválida:",
            action
          );
          return;
        }

        if (!id || id === me.id) {
          return;
        }

        const card = document.getElementById(
          "like-" + id
        );

        const buttons = card
          ? card.querySelectorAll("button")
          : [];

        buttons.forEach(button => {
          button.disabled = true;
        });

        /*
         * Guardamos la respuesta del usuario actual.
         */
        const {
          error: swipeError
        } = await db
          .from("swipes")
          .upsert(
            {
              user_id: me.id,
              target_user_id: id,
              action
            },
            {
              onConflict:
                "user_id,target_user_id"
            }
          );

        if (swipeError) {
          console.error(
            "Error guardando swipe:",
            swipeError
          );

          buttons.forEach(button => {
            button.disabled = false;
          });

          notice(
            "No se pudo guardar la acción. Revisá las políticas RLS de swipes.",
            true
          );

          return;
        }

        /*
         * Si nosotros también damos Like,
         * comprobamos si la otra persona ya
         * nos había dado Like.
         */
        if (action === "like") {
          const {
            data: other,
            error: otherError
          } = await db
            .from("swipes")
            .select("action")
            .eq("user_id", id)
            .eq("target_user_id", me.id)
            .eq("action", "like")
            .maybeSingle();

          if (otherError) {
            console.error(
              "Error comprobando Match:",
              otherError
            );

            buttons.forEach(button => {
              button.disabled = false;
            });

            notice(
              "Se guardó el Me gusta, pero no se pudo comprobar el Match.",
              true
            );

            return;
          }

          if (other?.action === "like") {
            const [a, b] = [
              me.id,
              id
            ].sort();

            const {
              data: existingMatch,
              error: matchCheckError
            } = await db
              .from("matches")
              .select("id")
              .eq("user1_id", a)
              .eq("user2_id", b)
              .maybeSingle();

            if (matchCheckError) {
              console.error(
                "Error comprobando Match:",
                matchCheckError
              );

              buttons.forEach(button => {
                button.disabled = false;
              });

              notice(
                "No se pudo comprobar el Match.",
                true
              );

              return;
            }

            if (!existingMatch) {
              const {
                error: matchError
              } = await db
                .from("matches")
                .insert({
                  user1_id: a,
                  user2_id: b
                });

              if (
                matchError &&
                matchError.code !== "23505"
              ) {
                console.error(
                  "Error creando Match:",
                  matchError
                );

                buttons.forEach(button => {
                  button.disabled = false;
                });

                notice(
                  "No se pudo crear el Match.",
                  true
                );

                return;
              }
            }

            notice("💕 ¡Hicieron Match!");

            setTimeout(() => {
              window.location.href =
                "conversacion.html?user=" +
                encodeURIComponent(id);
            }, 700);

            return;
          }

          notice("❤️ Me gusta enviado.");
        } else {
          notice("Perfil descartado.");
        }

        if (card) {
          card.remove();
        }

        const remaining =
          likesList.querySelectorAll(
            ".like-card"
          ).length;

        if (!remaining) {
          renderEmpty();
        } else {
          updateCounter(remaining);
        }
      }

      likesList.addEventListener(
        "click",
        event => {
          const button =
            event.target.closest(
              "button[data-action]"
            );

          if (!button) {
            return;
          }

          const id =
            button.dataset.id;

          const action =
            button.dataset.action;

          swipe(id, action);
        }
      );

      window.addEventListener(
        "pageshow",
        () => {
          loadLikes();
        }
      );

    })();
  </script>

</body>
</html>
