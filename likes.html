const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;


/* =========================
   INICIO
========================= */

async function iniciar() {

  try {

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (!session) {

      window.location.href =
        "./index.html";

      return;
    }


    usuarioActual =
      session.user;


    await cargarLikes();

    await cargarNotificaciones();

  }
  catch (error) {

    console.error(error);

    mostrarError(
      "No se pudo iniciar EmiMatch."
    );

  }

}


/* =========================
   CARGAR LIKES
========================= */

async function cargarLikes() {

  if (!usuarioActual) return;

  const contenido =
    document.getElementById(
      "contenido"
    );


  contenido.innerHTML = `

    <div class="estado-carga">
      ⏳ Buscando Me gustas...
    </div>

  `;


  try {

    const {
      data: likes,
      error
    } =
      await supabaseClient
        .from("swipes")
        .select(
          "user_id, target_user_id, created_at"
        )
        .eq(
          "target_user_id",
          usuarioActual.id
        )
        .eq(
          "action",
          "like"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      mostrarError(
        "No se pudieron cargar los Me gustas."
      );

      return;

    }


    if (
      !likes ||
      !likes.length
    ) {

      mostrarVacio();

      return;

    }


    const ids =
      [
        ...new Set(
          likes
            .map(
              like =>
                like.user_id
            )
            .filter(
              id =>
                id !== usuarioActual.id
            )
        )
      ];


    if (!ids.length) {

      mostrarVacio();

      return;

    }


    const {
      data: matches,
      error: errorMatches
    } =
      await supabaseClient
        .from("matches")
        .select(
          "user1_id, user2_id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (errorMatches) {

      console.error(
        errorMatches
      );

    }


    const idsMatch =
      new Set();


    (matches || []).forEach(
      match => {

        const otroUsuario =
          match.user1_id ===
          usuarioActual.id
            ? match.user2_id
            : match.user1_id;


        idsMatch.add(
          otroUsuario
        );

      }
    );


    const nuevosLikes =
      likes.filter(
        like =>
          !idsMatch.has(
            like.user_id
          )
      );


    if (
      !nuevosLikes.length
    ) {

      mostrarVacio();

      return;

    }


    const perfilIds =
      nuevosLikes.map(
        like =>
          like.user_id
      );


    const {
      data: perfiles,
      error: errorPerfiles
    } =
      await supabaseClient
        .from("profiles")
        .select(
          `
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          online
          `
        )
        .in(
          "id",
          perfilIds
        );


    if (errorPerfiles) {

      console.error(
        errorPerfiles
      );

      mostrarError(
        "No se pudieron cargar los perfiles."
      );

      return;

    }


    const {
      data: bloqueos,
      error: errorBloqueos
    } =
      await supabaseClient
        .from("user_blocks")
        .select(
          "blocker_id, blocked_id"
        )
        .or(
          `blocker_id.eq.${usuarioActual.id},blocked_id.eq.${usuarioActual.id}`
        );


    if (errorBloqueos) {

      console.error(
        errorBloqueos
      );

    }


    const bloqueados =
      new Set();


    (bloqueos || []).forEach(
      bloqueo => {

        if (
          bloqueo.blocker_id ===
          usuarioActual.id
        ) {

          bloqueados.add(
            bloqueo.blocked_id
          );

        }
        else {

          bloqueados.add(
            bloqueo.blocker_id
          );

        }

      }
    );


    const perfilesFinales =
      (perfiles || []).filter(
        perfil =>
          !bloqueados.has(
            perfil.id
          )
      );


    if (
      !perfilesFinales.length
    ) {

      mostrarVacio();

      return;

    }


    const mapa =
      new Map(
        perfilesFinales.map(
          perfil =>
            [
              perfil.id,
              perfil
            ]
        )
      );


    const ordenados =
      perfilIds
        .map(
          id =>
            mapa.get(id)
        )
        .filter(Boolean);


    mostrarLikes(
      ordenados
    );

  }
  catch (error) {

    console.error(error);

    mostrarError(
      "Ocurrió un error inesperado."
    );

  }

}


/* =========================
   MOSTRAR LIKES
========================= */

function mostrarLikes(
  perfiles
) {

  const contenido =
    document.getElementById(
      "contenido"
    );


  let html = `

    <div class="lista">

  `;


  perfiles.forEach(
    perfil => {

      const nombre =
        escaparHTML(
          perfil.nombre ||
          "Usuario"
        );


      const edad =
        perfil.edad
          ? `, ${perfil.edad}`
          : "";


      const ciudad =
        perfil.ciudad
          ? `📍 ${escaparHTML(
              perfil.ciudad
            )}`
          : "";


      const descripcion =
        escaparHTML(
          perfil.descripcion ||
          "Sin descripción."
        );


      let foto;


      if (
        perfil.foto_url
      ) {

        foto = `

          <img
            class="foto"
            src="${escaparHTML(
              perfil.foto_url
            )}"
            alt="Foto de ${nombre}"
            onerror="
              this.style.display='none';
              this.nextElementSibling.style.display='flex';
            "
          >

          <div
            class="foto-sin"
            style="display:none;"
          >
            👤
          </div>

        `;

      }
      else {

        foto = `

          <div class="foto-sin">
            👤
          </div>

        `;

      }


      html += `

        <div class="like-card">

          ${foto}

          <div class="info">

            <div class="nombre">

              ${nombre}${edad}

              ${
                perfil.online
                  ? `
                    <span
                      class="online"
 ></span>
                  `
                  : ""
              }

            </div>

            ${
              ciudad
                ? `
                  <div class="dato">
                    ${ciudad}
                  </div>
                `
                : ""
            }

            <div class="descripcion">
              ${descripcion}
            </div>

          </div>

          <div class="like-indicator">
            ❤️
          </div>

        </div>

      `;

    }
  );


  html += `
    </div>
  `;


  contenido.innerHTML =
    html;

}

   VACÍO
========================= */

function mostrarVacio() {

  document.getElementById(
    "contenido"
  ).innerHTML = `

    <div class="estado-vacio">

      <div class="emoji">
        ❤️
      </div>

      <h2>
        No hay Me gustas nuevos
      </h2>

      <p>
        Las personas bloqueadas y
        los matches existentes no
        aparecen acá.
      </p>

    </div>

  `;

}


/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  try {

    const {
      data: matches,
      error
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (error) {

      console.error(error);

      return;

    }


    if (
      !matches ||
      !matches.length
    ) {

      return;

    }


    const matchIds =
      matches.map(
        match =>
          match.id
      );


    const {
      data: mensajes,
      error: errorMensajes
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id"
        )
        .in(
          "match_id",
          matchIds
        )
        .neq(
          "sender_id",
          usuarioActual.id
        )
        .is(
          "read_at",
          null
        );


    if (errorMensajes) {

      console.error(
        errorMensajes
      );

      return;

    }


    const cantidad =
      mensajes
        ? mensajes.length
        : 0;


    const badge =
      document.getElementById(
        "badgeNotificaciones"
      );


    if (
      cantidad > 0
    ) {

      badge.textContent =
        cantidad > 99
          ? "99+"
          : cantidad;

      badge.style.display =
        "flex";

    }
    else {

      badge.style.display =
        "none";

    }

  }
  catch (error) {

    console.error(error);

  }

}


/* =========================
   ERROR
========================= */

function mostrarError(
  texto
) {

  document.getElementById(
    "contenido"
  ).innerHTML = `

    <div class="estado-vacio">

      <div class="emoji">
        ⚠️
      </div>

      <h2>
        Ocurrió un problema
      </h2>

      <p>
        ${escaparHTML(texto)}
      </p>

    </div>

  `;

}


/* =========================
   TOAST
========================= */

function mostrarToast(
  texto
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    texto;


  toast.classList.add(
    "mostrar"
  );


  setTimeout(
    () => {

      toast.classList.remove(
        "mostrar"
      );

    },
    2500
  );

}


/* =========================
   ESCAPAR HTML
========================= */

function escaparHTML(
  texto
) {

  return String(
    texto ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   ARRANCAR
========================= */

document.addEventListener(
  "DOMContentLoaded",
  iniciar
);

</script>
