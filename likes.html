<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Me gustas - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #07152f,
        #102b55
      );
      color: white;
      padding: 20px;
      padding-bottom: 105px;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
    }

    .cabecera {
      text-align: center;
      margin-bottom: 20px;
    }

    .cabecera h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .cabecera p {
      margin: 0;
      color: #cbd5e1;
    }

    .estado {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 13px;
      border-radius: 20px;
      background: rgba(34,197,94,.15);
      color: #4ade80;
      font-size: 14px;
    }

    .acciones-superiores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn-superior {
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
    }

    .btn-volver {
      background: rgba(255,255,255,.10);
      color: white;
    }

    .btn-actualizar {
      background: #d4af37;
      color: #07152f;
    }

    .estado-carga {
      text-align: center;
      padding: 35px 15px;
      color: #cbd5e1;
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .like-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: white;
      color: #172033;
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
    }

    .foto {
      width: 78px;
      height: 78px;
      min-width: 78px;
      border-radius: 50%;
      object-fit: cover;
      background: #e5e7eb;
      border: 3px solid #d4af37;
    }

    .foto-sin {
      width: 78px;
      height: 78px;
      min-width: 78px;
      border-radius: 50%;
      background: #e5e7eb;
      border: 3px solid #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .nombre {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .dato {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .descripcion {
      color: #475569;
      font-size: 13px;
      line-height: 1.35;
    }

    .online {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      margin-left: 5px;
    }

    .estado-vacio {
      background: rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 40px 20px;
      text-align: center;
      color: #cbd5e1;
    }

    .estado-vacio .emoji {
      font-size: 58px;
      margin-bottom: 12px;
    }

    .estado-vacio h2 {
      color: white;
      margin: 8px 0;
    }

    .estado-vacio p {
      margin: 0;
      line-height: 1.5;
    }

    .mensaje {
      text-align: center;
      min-height: 20px;
      margin-top: 15px;
      color: #cbd5e1;
    }

    /* NAV INFERIOR */

    .bottom-nav {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 72px;
      max-width: 500px;
      margin: auto;
      z-index: 1000;

      display: grid;
      grid-template-columns: repeat(5, 1fr);

      background: rgba(7,21,47,.96);

      border: 1px solid rgba(255,255,255,.14);

      border-radius: 22px;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.45);

      backdrop-filter: blur(14px);
    }

    .nav-item {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #cbd5e1;
      text-decoration: none;

      font-size: 11px;
      font-weight: bold;
    }

    .nav-item .icon {
      font-size: 22px;
      line-height: 22px;
    }

    .nav-item.activo {
      color: #d4af37;
    }

    .badge {
      position: absolute;
      top: 5px;
      right: 17%;

      min-width: 19px;
      height: 19px;

      padding: 2px 5px;

      border-radius: 20px;

      background: #ef4444;
      color: white;

      font-size: 11px;

      display: none;
      align-items: center;
      justify-content: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 95px;

      transform:
        translateX(-50%)
        translateY(20px);

      background: #111827;
      color: white;

      padding: 13px 18px;

      border-radius: 14px;

      opacity: 0;
      pointer-events: none;

      transition: .25s ease;

      z-index: 2000;

      max-width: 90%;
      text-align: center;
    }

    .toast.mostrar {
      opacity: 1;
      transform:
        translateX(-50%)
        translateY(0);
    }

    @media (max-width: 400px) {

      body {
        padding: 12px;
        padding-bottom: 100px;
      }

      .bottom-nav {
        left: 6px;
        right: 6px;
      }

      .nav-item {
        font-size: 10px;
      }

      .nav-item .icon {
        font-size: 20px;
      }

    }

  </style>

</head>

<body>

<div class="contenedor">

  <div class="cabecera">

    <h1>❤️ Me gustas</h1>

    <p>
      Personas a las que les gustaste
    </p>

    <div class="estado">
      🟢 En línea
    </div>

  </div>


  <div class="acciones-superiores">

    <a
      class="btn-superior btn-volver"
      href="./descubrir.html"
    >
      🔎 Descubrir
    </a>

    <button
      class="btn-superior btn-actualizar"
      onclick="cargarLikes()"
    >
      🔄 Actualizar
    </button>

  </div>


  <div
    id="contenido"
    class="estado-carga"
  >
    ⏳ Cargando Me gustas...
  </div>


  <div
    id="mensaje"
    class="mensaje"
  ></div>

</div>


<!-- NAV INFERIOR -->

<nav class="bottom-nav">

  <a
    class="nav-item"
    href="./perfil.html"
  >

    <span class="icon">
      👤
    </span>

    <span>
      Perfil
    </span>

  </a>


  <a
    class="nav-item"
    href="./descubrir.html"
  >

    <span class="icon">
      🔎
    </span>

    <span>
      Descubrir
    </span>

  </a>


  <a
    class="nav-item activo"
    href="./likes.html"
  >

    <span class="icon">
      ❤️
    </span>

    <span>
      Me gustas
    </span>

  </a>


  <a
    class="nav-item"
    href="./chat.html"
  >

    <span class="icon">
      💕
    </span>

    <span>
      Matches
    </span>

  </a>


  <a
    class="nav-item"
    href="./notificaciones.html"
  >

    <span class="icon">
      🔔
    </span>

    <span>
      Notificaciones
    </span>

    <span
      id="badgeNotificaciones"
      class="badge"
    >
      0
    </span>

  </a>

</nav>


<div
  id="toast"
  class="toast"
></div>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;


/* =========================
   INICIO
========================= */

async function iniciar() {

  try {

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (!session) {

      window.location.href =
        "./index.html";

      return;
    }


    usuarioActual =
      session.user;


    await cargarLikes();

    await cargarNotificaciones();

  }
  catch (error) {

    console.error(error);

    mostrarError(
      "No se pudo iniciar EmiMatch."
    );

  }

}


/* =========================
   CARGAR LIKES
========================= */

async function cargarLikes() {

  const contenido =
    document.getElementById(
      "contenido"
    );


  contenido.innerHTML = `

    <div class="estado-carga">
      ⏳ Buscando Me gustas...
    </div>

  `;


  try {

    /*
      Buscamos los likes recibidos:
      target_user_id = usuario actual
    */

    const {
      data: likes,
      error
    } =
      await supabaseClient
        .from("swipes")
        .select(
          "user_id, target_user_id, created_at"
        )
        .eq(
          "target_user_id",
          usuarioActual.id
        )
        .eq(
          "action",
          "like"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      mostrarError(
        "No se pudieron cargar los Me gustas."
      );

      return;

    }


    if (
      !likes ||
      !likes.length
    ) {

      mostrarVacio();

      return;

    }


    /*
      IDs de quienes dieron like
    */

    const ids =
      [
        ...new Set(
          likes
            .map(
              like =>
                like.user_id
            )
            .filter(
              id =>
                id !== usuarioActual.id
            )
        )
      ];


    if (!ids.length) {

      mostrarVacio();

      return;

    }


    /*
      Buscamos matches existentes
      para NO mostrar como
      "Me gusta" a alguien con
      quien ya hicimos Match.
    */

    const {
      data: matches,
      error: errorMatches
    } =
      await supabaseClient
        .from("matches")
        .select(
          "user1_id, user2_id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (errorMatches) {

      console.error(
        errorMatches
      );

    }


    const idsMatch =
      new Set();


    (matches || []).forEach(
      match => {

        const otroUsuario =
          match.user1_id ===
          usuarioActual.id
            ? match.user2_id
            : match.user1_id;


        idsMatch.add(
          otroUsuario
        );

      }
    );


    /*
      Quitamos los matches
    */

    const nuevosLikes =
      likes.filter(
        like =>
          !idsMatch.has(
            like.user_id
          )
      );


    if (
      !nuevosLikes.length
    ) {

      mostrarVacio();

      return;

    }


    /*
      Cargamos perfiles
    */

    const perfilIds =
      nuevosLikes.map(
        like =>
          like.user_id
      );


    const {
      data: perfiles,
      error: errorPerfiles
    } =
      await supabaseClient
        .from("profiles")
        .select(
          `
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          online
          `
        )
        .in(
          "id",
          perfilIds
        );


    if (errorPerfiles) {

      console.error(
        errorPerfiles
      );

      mostrarError(
        "No se pudieron cargar los perfiles."
      );

      return;

    }


    /*
      Seguridad:
      no mostrar bloqueados.
    */

    const {
      data: bloqueos,
      error: errorBloqueos
    } =
      await supabaseClient
        .from("user_blocks")
        .select(
          "blocker_id, blocked_id"
        )
        .or(
          `blocker_id.eq.${usuarioActual.id},blocked_id.eq.${usuarioActual.id}`
        );


    if (errorBloqueos) {

      console.error(
        errorBloqueos
      );

    }


    const bloqueados =
      new Set();


    (bloqueos || []).forEach(
      bloqueo => {

        if (
          bloqueo.blocker_id ===
          usuarioActual.id
        ) {

          bloqueados.add(
            bloqueo.blocked_id
          );

        }
        else {

          bloqueados.add(
            bloqueo.blocker_id
          );

        }

      }
    );


    const perfilesFinales =
      (perfiles || []).filter(
        perfil =>
          !bloqueados.has(
            perfil.id
          )
      );


    if (
      !perfilesFinales.length
    ) {

      mostrarVacio();

      return;

    }


    /*
      Ordenamos según el orden
      de los likes recibidos.
    */

    const mapa =
      new Map(
        perfilesFinales.map(
          perfil =>
            [
              perfil.id,
              perfil
            ]
        )
      );


    const ordenados =
      perfilIds
        .map(
          id =>
            mapa.get(id)
        )
        .filter(Boolean);


    mostrarLikes(
      ordenados
    );

  }
  catch (error) {

    console.error(error);

    mostrarError(
      "Ocurrió un error inesperado."
    );

  }

}


/* =========================
   MOSTRAR LIKES
========================= */

function mostrarLikes(
  perfiles
) {

  const contenido =
    document.getElementById(
      "contenido"
    );


  let html = `

    <div class="lista">

  `;


  perfiles.forEach(
    perfil => {

      const nombre =
        escaparHTML(
          perfil.nombre ||
          "Usuario"
        );


      const edad =
        perfil.edad
          ? `, ${perfil.edad}`
          : "";


      const ciudad =
        perfil.ciudad
          ? `📍 ${escaparHTML(
              perfil.ciudad
            )}`
          : "";


      const descripcion =
        escaparHTML(
          perfil.descripcion ||
          "Sin descripción."
        );


      let foto;


      if (
        perfil.foto_url
      ) {

        foto = `

          <img
            class="foto"
            src="${escaparHTML(
              perfil.foto_url
            )}"
            alt="Foto de ${nombre}"
            onerror="
              this.style.display='none';
              this.nextElementSibling.style.display='flex';
            "
          >

          <div
            class="foto-sin"
            style="display:none;"
          >
            👤
          </div>

        `;

      }
      else {

        foto = `

          <div class="foto-sin">
            👤
          </div>

        `;

      }


      html += `

        <div class="like-card">

          ${foto}

          <div class="info">

            <div class="nombre">

              ${nombre}${edad}

              ${
                perfil.online
                  ? `
                    <span
                      class="online"
                    ></span>
                  `
                  : ""
              }

            </div>

            ${
              ciudad
                ? `
                  <div class="dato">
                    ${ciudad}
                  </div>
                `
                : ""
            }

            <div class="descripcion">
              ${descripcion}
            </div>

          </div>

        </div>

      `;

    }
  );


  html += `
    </div>
  `;


  contenido.innerHTML =
    html;

}


/* =========================
   VACÍO
========================= */

function mostrarVacio() {

  document.getElementById(
    "contenido"
  ).innerHTML = `

    <div class="estado-vacio">

      <div class="emoji">
        ❤️
      </div>

      <h2>
        No hay Me gustas nuevos
      </h2>

      <p>
        Las personas bloqueadas y
        los matches existentes no
        aparecen acá.
      </p>

    </div>

  `;

}


/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  try {

    const {
      data: matches,
      error
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (error) {

      console.error(error);

      return;

    }


    if (
      !matches ||
      !matches.length
    ) {

      return;

    }


    const matchIds =
      matches.map(
        match =>
          match.id
      );


    const {
      data: mensajes,
      error: errorMensajes
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id"
        )
        .in(
          "match_id",
          matchIds
        )
        .neq(
          "sender_id",
          usuarioActual.id
        )
        .is(
          "read_at",
          null
        );


    if (errorMensajes) {

      console.error(
        errorMensajes
      );

      return;

    }


    const cantidad =
      mensajes
        ? mensajes.length
        : 0;


    const badge =
      document.getElementById(
        "badgeNotificaciones"
      );


    if (
      cantidad > 0
    ) {

      badge.textContent =
        cantidad > 99
          ? "99+"
          : cantidad;

      badge.style.display =
        "flex";

    }

  }
  catch (error) {

    console.error(error);

  }

}


/* =========================
   ERROR
========================= */

function mostrarError(
  texto
) {

  document.getElementById(
    "contenido"
  ).innerHTML = `

    <div class="estado-vacio">

      <div class="emoji">
        ⚠️
      </div>

      <h2>
        Ocurrió un problema
      </h2>

      <p>
        ${escaparHTML(texto)}
      </p>

    </div>

  `;

}


/* =========================
   TOAST
========================= */

function mostrarToast(
  texto
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    texto;


  toast.classList.add(
    "mostrar"
  );


  setTimeout(
    () => {

      toast.classList.remove(
        "mostrar"
      );

    },
    2500
  );

}


/* =========================
   ESCAPAR HTML
========================= */

function escaparHTML(
  texto
) {

  return String(
    texto ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   ARRANCAR
========================= */

document.addEventListener(
  "DOMContentLoaded",
  iniciar
);

</script>

</body>

    </html>
