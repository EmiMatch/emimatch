<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Consultas privadas — EmiMatch</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="assets/css/premium-refresh.css?v=20261014"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script>
<style>:root{color-scheme:dark;--g:#e4c36d;--g2:#ffe7a0;--m:#b8b4a8;--l:rgba(228,195,109,.22)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,rgba(228,195,109,.09),transparent 42%),#080808;color:#f7f3e9;font-family:Inter,system-ui,sans-serif}main{width:min(1000px,94%);margin:auto;padding:25px 0 60px}a{color:var(--g2);text-decoration:none}.head,.panel,.request{border:1px solid var(--l);border-radius:20px;background:linear-gradient(145deg,#171612,#0e0e0e);padding:20px;box-shadow:0 18px 45px #0005}.head{margin:18px 0}.muted{color:var(--m);font-size:14px;line-height:1.6}h1{margin:8px 0}h2{font-size:19px;margin:0 0 10px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.tools select,.request textarea,.request select{background:#0b0b0b;color:#fff;border:1px solid #4c432b;border-radius:10px;padding:11px;font:inherit}.tools select{flex:1;min-width:170px}.btn{border:1px solid #fff0be;border-radius:10px;padding:11px 15px;background:linear-gradient(135deg,#d1aa4f,#ffe8a3);color:#17120a;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.btn.secondary{background:#19170f;color:#ffe7a0;border-color:#5b4b27}.status{display:none;padding:12px;border-radius:10px;margin:12px 0;background:#171717}.status.show{display:block}.status.error{color:#ffc0c0;border:1px solid #8c4040}.status.success{color:#c6f4cf;border:1px solid #476e50}.request{margin-top:13px}.requesthead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-block;border:1px solid var(--l);border-radius:99px;padding:5px 9px;color:var(--g2);font-size:11px;white-space:nowrap}.request p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.details{font-size:12px;color:var(--m)}.request textarea{width:100%;min-height:110px;resize:vertical;margin-top:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:30px;color:var(--m)}@media(max-width:520px){.requesthead{display:block}.pill{margin-top:7px}main{padding-top:15px}}</style></head>
<body><main><a href="admin.html">← Volver al panel de administración</a><header class="head"><div style="color:#ffe7a0;font-size:12px;letter-spacing:.14em;text-transform:uppercase">EmiMatch · Administración privada</div><h1>Consultas de usuarios</h1><p class="muted">Solo una cuenta autorizada puede leer y responder solicitudes. Las respuestas aparecerán en el Centro de ayuda del usuario.</p><div class="tools"><select id="filter" aria-label="Filtrar consultas"><option value="todas">Todas las consultas</option><option value="recibida">Recibidas</option><option value="en_revision">En revisión</option><option value="respondida">Respondidas</option></select><button class="btn" id="refresh" type="button">Actualizar</button><button class="btn secondary" id="logout" type="button">Cerrar sesión</button></div></header><div id="status" class="status" role="status" aria-live="polite"></div><section class="panel"><h2 id="summary">Cargando consultas…</h2><div id="requests"><div class="empty">Verificando acceso administrativo…</div></div></section></main>
<script>"use strict";(()=>{const cfg=window.EMIMATCH_CONFIG,box=document.getElementById("requests"),summary=document.getElementById("summary"),filter=document.getElementById("filter"),refresh=document.getElementById("refresh"),logout=document.getElementById("logout"),statusBox=document.getElementById("status");let db,rows=[];
const txt=(tag,cls,val)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=val||"";return e},labels={recibida:"Recibida",en_revision:"En revisión",respondida:"Respondida"},cats={consulta:"Consulta general",sugerencia:"Sugerencia",problema:"Problema técnico",cuenta_premium:"Cuenta o Premium"};
function status(msg,type){statusBox.textContent=msg;statusBox.className="status show "+(type||"")}function date(v){const d=new Date(v);return isNaN(d.getTime())?"—":d.toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"})}
async function load(){refresh.disabled=true;try{const {data,error}=await db.from("support_requests").select("id,user_id,category,subject,message,status,admin_response,created_at,updated_at").order("created_at",{ascending:false}).limit(200);if(error)throw error;const all=data||[],ids=[...new Set(all.map(r=>r.user_id))];let names={};if(ids.length){const p=await db.from("profiles").select("id,nombre").in("id",ids);if(!p.error)(p.data||[]).forEach(x=>names[x.id]=x.nombre||"Perfil sin nombre")}rows=all.map(r=>({...r,name:names[r.user_id]||("Usuario "+r.user_id.slice(0,8))}));render();status("Consultas actualizadas correctamente.","success")}catch(e){console.error(e);status("No se pudieron cargar las consultas. Verificá que la migración esté aplicada.","error")}finally{refresh.disabled=false}}
function render(){const selected=filter.value,visible=rows.filter(r=>selected==="todas"||r.status===selected);summary.textContent=visible.length+" consulta(s) · "+rows.filter(r=>r.status!=="respondida").length+" pendientes de respuesta";box.replaceChildren();if(!visible.length){box.append(txt("div","empty","No hay consultas en esta categoría."));return}visible.forEach(r=>{const card=txt("article","request",""),head=txt("div","requesthead",""),title=txt("div","","");title.append(txt("h2","",r.subject),txt("div","details",r.name+" · "+r.user_id+" · "+date(r.created_at)));head.append(title,txt("span","pill",labels[r.status]||r.status));card.append(head,txt("p","details",(cats[r.category]||r.category)+" · Actualizada: "+date(r.updated_at)),txt("p","",r.message));if(r.admin_response)card.append(txt("div","details","Respuesta guardada: "+r.admin_response));const area=document.createElement("textarea");area.maxLength=3000;area.setAttribute("aria-label","Respuesta para "+r.subject);area.placeholder="Escribí una respuesta privada…";area.value=r.admin_response||"";const actions=txt("div","actions",""),state=document.createElement("select");state.setAttribute("aria-label","Estado de la consulta");[["recibida","Recibida"],["en_revision","En revisión"],["respondida","Respondida"]].forEach(([v,l])=>{const o=document.createElement("option");o.value=v;o.textContent=l;state.append(o)});state.value=r.status;const save=document.createElement("button");save.className="btn secondary";save.textContent="Guardar estado";save.addEventListener("click",async()=>{save.disabled=true;try{const {error}=await db.from("support_requests").update({status:state.value}).eq("id",r.id);if(error)throw error;status("Estado actualizado.","success");await load()}catch(e){console.error(e);status("No se pudo actualizar el estado.","error")}finally{save.disabled=false}});const send=document.createElement("button");send.className="btn";send.textContent=r.admin_response?"Actualizar respuesta":"Enviar respuesta";send.addEventListener("click",async()=>{const answer=area.value.trim();if(answer.length<2){status("Escribí una respuesta de al menos 2 caracteres.","error");return}send.disabled=true;try{const {error}=await db.from("support_requests").update({admin_response:answer,status:"respondida"}).eq("id",r.id);if(error)throw error;status("Respuesta guardada y visible para el usuario.","success");await load()}catch(e){console.error(e);status("No se pudo guardar la respuesta. Verificá que la migración esté aplicada.","error")}finally{send.disabled=false}});actions.append(state,save,send);card.append(area,actions);box.append(card)})}
async function init(){if(!cfg||!window.supabase){location.replace("index.html");return}db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey||cfg.supabaseAnonKey);const {data,error}=await db.auth.getSession();if(error||!data?.session?.user){location.replace("index.html");return}const a=await db.from("admin_users").select("user_id").eq("user_id",data.session.user.id).maybeSingle();if(a.error||!a.data){summary.textContent="Sin autorización";box.replaceChildren(txt("div","empty","Acceso denegado: sección exclusiva de administración."));filter.disabled=true;refresh.disabled=true;status("Tu cuenta no tiene permisos para gestionar consultas.","error");return}await load()}
filter.addEventListener("change",render);refresh.addEventListener("click",load);logout.addEventListener("click",async()=>{logout.disabled=true;const {error}=await db.auth.signOut();if(error){status("No se pudo cerrar la sesión.","error");logout.disabled=false;return}location.replace("index.html")});init().catch(e=>{console.error(e);status("No se pudo iniciar el panel de consultas.","error")})})();</script></body></html>
