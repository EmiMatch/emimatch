<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Perfil</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top left, rgba(126, 87, 194, .28), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255, 193, 7, .12), transparent 30%),
        linear-gradient(135deg, #07152f, #111b42 50%, #080d22);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 20px;
      background: rgba(5, 12, 35, .82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .header-content {
      max-width: 1050px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      color: #ffd54a;
      font-size: 23px;
      font-weight: 800;
    }

    .back-btn {
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.08);
      color: white;
      padding: 10px 15px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .container {
      width: min(100%, 1050px);
      margin: auto;
      padding: 30px 16px 60px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      min-height: 430px;
      display: flex;
      align-items: flex-end;
      padding: 30px;
      background:
        linear-gradient(to top, rgba(3,7,24,.96), rgba(3,7,24,.05)),
        #101a3d;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }

    .hero-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .82;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    .match-badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 8px 13px;
      border-radius: 999px;
      color: #241800;
      background: linear-gradient(135deg, #ffd54a, #ffb300);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .4px;
    }

    h1 {
      font-size: clamp(32px, 7vw, 54px);
      margin-bottom: 8px;
    }

    .location {
      color: #ddd;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.4fr .8fr;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,.065);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 40px rgba(0,0,0,.18);
    }

    .card h2 {
      color: #ffd54a;
      margin-bottom: 15px;
      font-size: 21px;
    }

    .description {
      color: #e6e8f1;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .interests {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .interest {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(124,77,255,.2);
      border: 1px solid rgba(164,126,255,.3);
      color: #eee;
      font-size: 13px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 15px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,.1);
      transition: .2s;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    .actions {
      display: grid;
      gap: 11px;
    }

    button.action {
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      color: white;
      font-weight: 800;
      font-size: 14px;
      transition: .2s;
    }

    button.action:hover {
      transform: translateY(-2px);
    }

    .chat {
      background: linear-gradient(135deg, #7c4dff, #512da8);
    }

    .matches {
      background: linear-gradient(135deg, #ffca28, #ff9800);
      color: #211700 !important;
    }

    .block {
      background: rgba(244,67,54,.15);
      border: 1px solid rgba(244,67,54,.35) !important;
    }

    .unblock {
      background: rgba(76,175,80,.16);
      border: 1px solid rgba(76,175,80,.35) !important;
    }

    .loading,
    .error {
      text-align: center;
      padding: 80px 20px;
      color: #cfd4e8;
    }

    .error strong {
      display: block;
      font-size: 22px;
      color: #ffb4b4;
      margin-bottom: 10px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translate(-50%, 120px);
      z-index: 999;
      padding: 14px 20px;
      border-radius: 14px;
      background: rgba(10,15,35,.95);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
      transition: .3s;
      opacity: 0;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .toast.success {
      border-color: rgba(76,175,80,.5);
    }

    .toast.error {
      border-color: rgba(244,67,54,.5);
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: 420px;
        padding: 22px;
      }

      .card {
        padding: 20px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <div class="logo">💕 EmiMatch</div>

    <button class="back-btn" onclick="history.back()">
      ← Volver
    </button>
  </div>
</header>

<main class="container">

  <div id="loading" class="loading">
    Cargando perfil...
  </div>

  <div id="error" class="error" style="display:none;">
    <strong>No se pudo cargar el perfil</strong>
    <span id="errorText"></span>
  </div>

  <section id="profilePage" style="display:none;">

    <div class="hero">

      <img
        id="heroPhoto"
        class="hero-photo"
        src=""
        alt="Foto de perfil"
      >

      <div class="hero-content">

        <div class="match-badge">
          ❤️ HICIERON MATCH
        </div>

        <h1 id="profileName">
          Usuario
        </h1>

        <div id="profileLocation" class="location">
          📍 —
        </div>

      </div>

    </div>

    <div class="grid">

      <div>

        <div class="card">
          <h2>💫 Sobre mí</h2>

          <div id="description" class="description">
            Sin descripción.
          </div>
        </div>

        <div class="card" style="margin-top:20px;">
          <h2>✨ Intereses</h2>

          <div id="interests" class="interests">
          </div>
        </div>

        <div class="card" style="margin-top:20px;">
          <h2>📸 Fotos</h2>

          <div id="gallery" class="gallery">
          </div>
        </div>

      </div>

      <aside>

        <div class="card">

          <h2>💜 Conexión</h2>

          <div class="actions">

            <button
              id="chatBtn"
              class="action chat"
            >
              💬 Enviar mensaje
            </button>

            <button
              class="action matches"
              onclick="window.location.href='matches.html'"
            >
              ❤️ Mis Matches
            </button>

            <button
              id="blockBtn"
              class="action block"
            >
              🚫 Bloquear usuario
            </button>

          </div>

        </div>

      </aside>

    </div>

  </section>

</main>

<div id="toast" class="toast"></div>

<script>
  const SUPABASE_URL =
    "https://kngiadwaesdbmvwivdev.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  let currentUser = null;
  let viewedUser = null;
  let isBlocked = false;

  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");
  const errorText = document.getElementById("errorText");
  const profilePage = document.getElementById("profilePage");

  const heroPhoto = document.getElementById("heroPhoto");
  const profileName = document.getElementById("profileName");
  const profileLocation = document.getElementById("profileLocation");
  const description = document.getElementById("description");
  const interests = document.getElementById("interests");
  const gallery = document.getElementById("gallery");
  const chatBtn = document.getElementById("chatBtn");
  const blockBtn = document.getElementById("blockBtn");

  function showToast(message, type = "") {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.className = `toast show ${type}`;

    setTimeout(() => {
      toast.className = "toast";
    }, 2800);
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getViewedUserId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("user");
  }

  async function loadSession() {
    const {
      data,
      error
    } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
      window.location.href = "index.html";
      return false;
    }

    currentUser = data.user;

    return true;
  }

  async function checkBlockStatus() {

    if (!currentUser || !viewedUser) {
      return;
    }

    const {
      data,
      error
    } = await supabaseClient
      .from("block")
      .select("id")
      .eq("user_id", currentUser.id)
      .eq("blocked_user_id", viewedUser.id)
      .maybeSingle();

    if (error) {
      console.error("Error comprobando bloqueo:", error);
      return;
    }

    isBlocked = !!data;

    updateBlockButton();
  }

  function updateBlockButton() {

    if (isBlocked) {

      blockBtn.textContent = "🔓 Desbloquear usuario";
      blockBtn.classList.remove("block");
      blockBtn.classList.add("unblock");

    } else {

      blockBtn.textContent = "🚫 Bloquear usuario";
      blockBtn.classList.remove("unblock");
      blockBtn.classList.add("block");

    }
  }

  async function loadProfile() {

    const userId = getViewedUserId();

    if (!userId) {
      throw new Error("No se especificó el usuario.");
    }

    if (userId === currentUser.id) {
      window.location.href = "perfil.html";
      return;
    }

    const {
      data,
      error
    } = await supabaseClient
      .from("profiles")
      .select(
        "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
      )
      .eq("id", userId)
      .single();

    if (error) {
      throw error;
    }

    if (!data) {
      throw new Error("El perfil no existe.");
    }

    viewedUser = data;

    profileName.textContent =
      `${data.nombre || "Usuario"}${data.edad ? ", " + data.edad : ""}`;

    profileLocation.textContent =
      data.ciudad
        ? `📍 ${data.ciudad}`
        : "📍 Ubicación no indicada";

    description.textContent =
      data.descripcion || "Esta persona todavía no agregó una descripción.";

    if (data.foto_url) {

      heroPhoto.src = data.foto_url;

    } else {

      heroPhoto.src =
        "https://placehold.co/900x700/101a3d/ffffff?text=💕+EmiMatch";

    }

    renderInterests(data.intereses);

    await loadGallery(data.id);

    await checkBlockStatus();

    profilePage.style.display = "block";
    loading.style.display = "none";
  }

  function renderInterests(value) {

    interests.innerHTML = "";

    if (!value || !value.trim()) {

      interests.innerHTML =
        `<span class="interest">Sin intereses indicados</span>`;

      return;
    }

    const list = value
      .split(",")
      .map(item => item.trim())
      .filter(Boolean);

    list.forEach(item => {

      const span = document.createElement("span");

      span.className = "interest";
      span.textContent = item;

      interests.appendChild(span);

    });
  }

  async function loadGallery(userId) {

    gallery.innerHTML = "";

    const {
      data,
      error
    } = await supabaseClient
      .storage
      .from("profile-photos")
      .list(userId, {
        limit: 20,
        sortBy: {
          column: "created_at",
          order: "asc"
        }
      });

    if (error) {

      console.error("Error cargando galería:", error);

      return;
    }

    const files = (data || [])
      .filter(file => file.name)
      .sort((a, b) =>
        new Date(a.created_at || 0) -
        new Date(b.created_at || 0)
      );

    if (!files.length) {

      gallery.innerHTML =
        `<span style="color:#aeb5cf;">No hay fotos adicionales.</span>`;

      return;
    }

    files.forEach(file => {

      const path =
        `${userId}/${file.name}`;

      const {
        data: publicData
      } = supabaseClient
        .storage
        .from("profile-photos")
        .getPublicUrl(path);

      if (!publicData?.publicUrl) {
        return;
      }

      const img =
        document.createElement("img");

      img.src = publicData.publicUrl;
      img.alt = "Foto de perfil";
      img.loading = "lazy";

      img.addEventListener("click", () => {
        window.open(
          publicData.publicUrl,
          "_blank"
        );
      });

      gallery.appendChild(img);

    });
  }

  async function toggleBlock() {

    if (!currentUser || !viewedUser) {
      return;
    }

    blockBtn.disabled = true;

    try {

      if (isBlocked) {

        const {
          error
        } = await supabaseClient
          .from("block")
          .delete()
          .eq("user_id", currentUser.id)
          .eq("blocked_user_id", viewedUser.id);

        if (error) {
          throw error;
        }

        isBlocked = false;

        updateBlockButton();

        showToast(
          "Usuario desbloqueado correctamente.",
          "success"
        );

      } else {

        const confirmed =
          confirm(
            `¿Querés bloquear a ${viewedUser.nombre || "este usuario"}?\n\nNo podrás continuar la conversación mientras esté bloqueado.`
          );

        if (!confirmed) {
          return;
        }

        const {
          error
        } = await supabaseClient
          .from("block")
          .insert({
            user_id: currentUser.id,
            blocked_user_id: viewedUser.id
          });

        if (error) {

          if (error.code === "23505") {
            isBlocked = true;
            updateBlockButton();

            showToast(
              "Este usuario ya estaba bloqueado.",
              "success"
            );

            return;
          }

          throw error;
        }

        isBlocked = true;

        updateBlockButton();

        showToast(
          "Usuario bloqueado correctamente.",
          "success"
        );

      }

    } catch (error) {

      console.error("Error de bloqueo:", error);

      showToast(
        "No se pudo actualizar el bloqueo.",
        "error"
      );

    } finally {

      blockBtn.disabled = false;

    }
  }

  chatBtn.addEventListener("click", () => {

    if (!viewedUser) {
      return;
    }

    if (isBlocked) {

      showToast(
        "Desbloqueá al usuario para enviarle mensajes.",
        "error"
      );

      return;
    }

    window.location.href =
      `chat.html?user=${encodeURIComponent(viewedUser.id)}`;

  });

  blockBtn.addEventListener(
    "click",
    toggleBlock
  );

  async function init() {

    try {

      const sessionOK =
        await loadSession();

      if (!sessionOK) {
        return;
      }

      await loadProfile();

    } catch (error) {

      console.error(error);

      loading.style.display = "none";
      errorBox.style.display = "block";

      errorText.textContent =
        error.message ||
        "Ocurrió un error inesperado.";

    }

  }

  init();
</script>

</body>
</html>
