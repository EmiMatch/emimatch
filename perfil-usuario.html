<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmiMatch - Perfil</title>
<link rel="stylesheet" href="assets/css/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="em-container" style="padding-top:24px">
  <div class="em-card" id="loading">Cargando perfil...</div>
  <div class="em-alert em-alert-danger" id="error" hidden></div>
  <section id="profile" hidden>
    <div class="em-card" style="overflow:hidden;padding:0">
      <img id="heroPhoto" alt="Foto de perfil" style="width:100%;height:min(65vw,430px);object-fit:cover;background:#101a3d">
      <div style="padding:22px">
        <div class="em-badge">❤️ PERFIL</div>
        <h1 id="name" style="margin:8px 0 4px"></h1>
        <p id="location" class="em-muted"></p>
      </div>
    </div>

    <div class="em-grid em-grid-2" style="margin-top:18px">
      <div>
        <article class="em-card"><h2>💫 Sobre mí</h2><p id="description" style="white-space:pre-wrap;line-height:1.7"></p></article>
        <article class="em-card" style="margin-top:18px"><h2>✨ Intereses</h2><div id="interests" class="em-flex"></div></article>
        <article class="em-card" style="margin-top:18px"><h2>📸 Fotos</h2><div id="gallery" class="em-grid em-grid-3"></div></article>
      </div>
      <aside>
        <article class="em-card"><h2>💜 Conexión</h2>
          <div style="display:grid;gap:10px">
            <button id="chatBtn" class="em-button em-button-primary">💬 Enviar mensaje</button>
            <a href="matches.html" class="em-button" style="text-align:center">❤️ Mis Matches</a>
            <button id="blockBtn" class="em-button">🚫 Bloquear usuario</button>
            <button id="reportBtn" class="em-button">🚨 Reportar usuario</button>
          </div>
        </article>
      </aside>
    </div>
  </section>
</main>

<div id="reportModal" class="em-modal" hidden>
  <div class="em-card" style="width:min(100%,520px);margin:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <h2>🚨 Reportar usuario</h2><button id="closeReport" class="em-button" type="button">×</button>
    </div>
    <p class="em-muted">Ayudanos a mantener EmiMatch seguro.</p>
    <label>Motivo<select id="reason" class="em-input" style="width:100%;margin-top:7px">
      <option value="">Seleccioná un motivo</option><option value="spam">Spam</option><option value="perfil_falso">Perfil falso</option><option value="acoso">Acoso</option><option value="contenido_inapropiado">Contenido inapropiado</option><option value="comportamiento_sospechoso">Comportamiento sospechoso</option><option value="otro">Otro</option>
    </select></label>
    <label style="display:block;margin-top:14px">Detalles<textarea id="details" class="em-input" maxlength="1000" rows="5" style="width:100%;margin-top:7px" placeholder="Información adicional (opcional)"></textarea></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><button id="cancelReport" class="em-button" type="button">Cancelar</button><button id="sendReport" class="em-button em-button-primary" type="button">🚨 Enviar reporte</button></div>
  </div>
</div>
<div id="toast" class="em-alert" hidden style="position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:9999;width:min(92%,460px)"></div>

<script src="assets/js/config.js"></script>
<script>
(() => {
'use strict';
const config=window.EMIMATCH_CONFIG;
if(!config){document.getElementById('error').textContent='No se pudo cargar la configuración de EmiMatch.';document.getElementById('error').hidden=false;return;}
const supabase=window.supabase.createClient(config.supabaseUrl,config.supabaseKey);
let currentUser=null,viewedUser=null,isBlocked=false;
const $=id=>document.getElementById(id);
function toast(msg,type=''){const el=$('toast');el.textContent=msg;el.className='em-alert '+(type?'em-alert-'+type:'');el.hidden=false;clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.hidden=true,2800)}
function fail(msg){$('loading').hidden=true;$('error').textContent=msg;$('error').hidden=false}
function viewedId(){return new URLSearchParams(location.search).get('id')||new URLSearchParams(location.search).get('user')}
async function session(){const {data,error}=await supabase.auth.getSession();if(error)throw error;if(!data.session){location.href='index.html';return false}currentUser=data.session.user;return true}
async function loadProfile(){const id=viewedId();if(!id)throw new Error('No se especificó el usuario.');if(id===currentUser.id){location.href='perfil.html';return}
const {data,error}=await supabase.from('profiles').select('id,nombre,edad,ciudad,descripcion,foto_url,intereses').eq('id',id).maybeSingle();if(error)throw error;if(!data)throw new Error('El perfil no existe.');viewedUser=data;
$('name').textContent=(data.nombre||'Usuario')+(data.edad?', '+data.edad:'');$('location').textContent=data.ciudad?'📍 '+data.ciudad:'📍 Ubicación no indicada';$('description').textContent=data.descripcion||'Esta persona todavía no agregó una descripción.';$('heroPhoto').src=data.foto_url||'https://placehold.co/900x600/101a3d/ffffff?text=💕+EmiMatch';
const interests=(data.intereses||'').split(',').map(x=>x.trim()).filter(Boolean);$('interests').innerHTML=interests.length?interests.map(x=>`<span class="em-badge">${escapeHtml(x)}</span>`).join(''):'<span class="em-muted">Sin intereses indicados</span>';
await Promise.all([checkBlock(),loadGallery(id)]);$('profile').hidden=false;$('loading').hidden=true;updateBlock();}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function checkBlock(){const {data,error}=await supabase.from('user_blocks').select('id').eq('blocker_id',currentUser.id).eq('blocked_id',viewedUser.id).maybeSingle();if(error)throw error;isBlocked=!!data}
function updateBlock(){$('blockBtn').textContent=isBlocked?'🔓 Desbloquear usuario':'🚫 Bloquear usuario';$('chatBtn').disabled=isBlocked}
async function toggleBlock(){const btn=$('blockBtn');btn.disabled=true;try{if(isBlocked){const {error}=await supabase.from('user_blocks').delete().eq('blocker_id',currentUser.id).eq('blocked_id',viewedUser.id);if(error)throw error;isBlocked=false;toast('Usuario desbloqueado correctamente.','success')}else{const {error}=await supabase.from('user_blocks').insert({blocker_id:currentUser.id,blocked_id:viewedUser.id});if(error)throw error;isBlocked=true;toast('Usuario bloqueado correctamente.','success')}updateBlock()}catch(e){console.error(e);toast('No se pudo actualizar el bloqueo.','danger')}finally{btn.disabled=false}}
async function loadGallery(id){const box=$('gallery');box.innerHTML='';const {data,error}=await supabase.storage.from('profile-photos').list(id,{limit:20,sortBy:{column:'created_at',order:'asc'}});if(error){console.warn('Galería:',error);return}const files=(data||[]).filter(x=>x.name);if(!files.length){box.innerHTML='<span class="em-muted">No hay fotos adicionales.</span>';return}files.forEach(file=>{const {data:u}=supabase.storage.from('profile-photos').getPublicUrl(`${id}/${file.name}`);if(!u?.publicUrl)return;const img=document.createElement('img');img.src=u.publicUrl;img.alt='Foto de perfil';img.loading='lazy';img.style='width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:pointer';img.onclick=()=>window.open(u.publicUrl,'_blank');box.appendChild(img)})}
async function openChat(){if(!viewedUser||isBlocked)return;location.href='chat.html?user='+encodeURIComponent(viewedUser.id)}
function openReport(){$('reason').value='';$('details').value='';$('reportModal').hidden=false}
function closeReport(){$('reportModal').hidden=true}
async function sendReport(){const reason=$('reason').value.trim(),details=$('details').value.trim();if(!reason){toast('Seleccioná un motivo para el reporte.','danger');return}const btn=$('sendReport');btn.disabled=true;try{const {error}=await supabase.from('reports').insert({reporter_id:currentUser.id,reported_id:viewedUser.id,reason,details:details||null});if(error)throw error;closeReport();toast('Reporte enviado correctamente.','success')}catch(e){console.error(e);toast('No se pudo enviar el reporte. Verificá la configuración de reportes.','danger')}finally{btn.disabled=false}}
$('chatBtn').onclick=openChat;$('blockBtn').onclick=toggleBlock;$('reportBtn').onclick=openReport;$('closeReport').onclick=closeReport;$('cancelReport').onclick=closeReport;$('sendReport').onclick=sendReport;$('reportModal').onclick=e=>{if(e.target===$('reportModal'))closeReport()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReport()});
(async()=>{try{if(await session())await loadProfile()}catch(e){console.error(e);fail(e.message||'No se pudo cargar el perfil.')}})();
})();
</script>
<script src="assets/js/app.js"></script>
<script src="assets/js/components.js"></script>
</body>
</html>
