<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10152f">

  <title>Editar perfil — EmiMatch</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    :root {
      --bg: #0b1024;
      --card: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.12);
      --text: #f7f8ff;
      --muted: #aeb5d0;
      --primary: #5865f2;
      --primary-2: #7459e8;
      --gold: #d9b45b;
      --danger: #ff5c72;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px 14px 40px;
      background:
        radial-gradient(
          circle at top left,
          rgba(88,101,242,.22),
          transparent 35%
        ),
        radial-gradient(
          circle at top right,
          rgba(217,180,91,.13),
          transparent 30%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .page {
      width: min(100%, 680px);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .back {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }

    .intro {
      margin-bottom: 22px;
    }

    .intro h2 {
      margin: 0 0 7px;
      font-size: 22px;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 15px;
      outline: none;
      padding: 13px 14px;
      background: rgba(255,255,255,.06);
      color: var(--text);
      font: inherit;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(88,101,242,.8);
      box-shadow: 0 0 0 3px rgba(88,101,242,.14);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.5;
    }

    input::placeholder,
    textarea::placeholder {
      color: #858dab;
    }

    .help {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    button,
    .button-link {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 16px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .save {
      color: white;
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );
    }

    .save:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .cancel {
      color: var(--text);
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
    }

    .status {
      min-height: 24px;
      margin-top: 15px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status.success {
      color: #9ee6bd;
    }

    .status.error {
      color: #ffadb8;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 45px 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .card {
        padding: 18px;
        border-radius: 22px;
      }

      .topbar h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="topbar">
      <h1>Editar perfil</h1>

      <a
        class="back"
        href="perfil.html"
      >
        ← Volver
      </a>
    </header>

    <section id="loading" class="card loading">
      Cargando tu perfil...
    </section>

    <section id="editor" class="card hidden">

      <div class="intro">
        <h2>Personalizá tu perfil</h2>

        <p>
          Actualizá la información que otras personas
          podrán ver en EmiMatch.
        </p>
      </div>

      <form id="profileForm">

        <div class="field">
          <label for="nombre">
            Nombre
          </label>

          <input
            id="nombre"
            name="nombre"
            type="text"
            maxlength="80"
            autocomplete="name"
            placeholder="Tu nombre"
          >
        </div>

        <div class="field">
          <label for="ciudad">
            Ciudad
          </label>

          <input
            id="ciudad"
            name="ciudad"
            type="text"
            maxlength="100"
            autocomplete="address-level2"
            placeholder="Buenos Aires"
          >
        </div>

        <div class="field">
          <label for="edad">
            Edad
          </label>

          <input
            id="edad"
            name="edad"
            type="number"
            min="18"
            max="100"
            inputmode="numeric"
            placeholder="31"
          >

          <div class="help">
            La edad debe estar entre 18 y 100 años.
          </div>
        </div>

        <div class="field">
          <label for="descripcion">
            Descripción
          </label>

          <textarea
            id="descripcion"
            name="descripcion"
            maxlength="500"
            placeholder="Contá algo sobre vos..."
          ></textarea>

          <div class="help">
            Máximo 500 caracteres.
          </div>
        </div>

        <div class="actions">

          <button
            id="saveButton"
            class="save"
            type="submit"
          >
            Guardar cambios
          </button>

          <a
            class="button-link cancel"
            href="perfil.html"
          >
            Cancelar
          </a>

        </div>

        <div
          id="status"
          class="status"
          aria-live="polite"
        ></div>

      </form>

    </section>

  </main>

  <script src="assets/js/config.js"></script>

  <script type="module">

    const loading = document.getElementById("loading");
    const editor = document.getElementById("editor");

    const form = document.getElementById("profileForm");
    const saveButton = document.getElementById("saveButton");

    const nombreInput = document.getElementById("nombre");
    const ciudadInput = document.getElementById("ciudad");
    const edadInput = document.getElementById("edad");
    const descripcionInput =
      document.getElementById("descripcion");

    const statusElement =
      document.getElementById("status");

    let client = null;
    let currentUser = null;

    function setStatus(message, type = "") {
      statusElement.textContent = message || "";
      statusElement.className = `status ${type}`;
    }

    function getConfig() {

      const config =
        window.EMIMATCH_CONFIG || {};

      if (
        !config.supabaseUrl ||
        !config.supabaseAnonKey
      ) {
        throw new Error(
          "Configuración de Supabase incompleta."
        );
      }

      return config;
    }

    async function createSupabaseClient() {

      const config = getConfig();

      const module = await import(
        "https://esm.sh/@supabase/supabase-js@2"
      );

      return module.createClient(
        config.supabaseUrl,
        config.supabaseAnonKey
      );
    }

    async function loadProfile() {

      try {

        client =
          await createSupabaseClient();

        const {
          data: {
            user
          },
          error: userError
        } = await client.auth.getUser();

        if (userError) {
          throw userError;
        }

        if (!user) {
          window.location.href =
            "index.html";
          return;
        }

        currentUser = user;

        const {
          data: profile,
          error: profileError
        } = await client
          .from("profiles")
          .select("*")
          .eq("id", user.id)
          .maybeSingle();

        if (profileError) {
          throw profileError;
        }

        if (!profile) {
          throw new Error(
            "No encontramos tu perfil."
          );
        }

        nombreInput.value =
          profile.nombre ||
          profile.name ||
          user.user_metadata?.nombre ||
          "";

        ciudadInput.value =
          profile.ciudad ||
          profile.city ||
          "";

        const age =
          profile.edad ??
          profile.age ??
          "";

        edadInput.value =
          age === null ||
          age === undefined
            ? ""
            : String(age);

        descripcionInput.value =
          profile.descripcion ||
          profile.bio ||
          "";

        loading.classList.add("hidden");
        editor.classList.remove("hidden");

      } catch (error) {

        console.error(
          "Error cargando editor:",
          error
        );

        loading.innerHTML = `
          <strong>No pudimos cargar tu perfil.</strong>
          <br><br>
          ${escapeHtml(
            error?.message ||
            "Error desconocido"
          )}
          <br><br>
          <a
            href="perfil.html"
            style="color:#fff;"
          >
            Volver al perfil
          </a>
        `;

      }
    }

    async function saveProfile(event) {

      event.preventDefault();

      if (!client || !currentUser) {
        setStatus(
          "La sesión todavía no está disponible.",
          "error"
        );
        return;
      }

      const nombre =
        nombreInput.value.trim();

      const ciudad =
        ciudadInput.value.trim();

      const descripcion =
        descripcionInput.value.trim();

      const edadTexto =
        edadInput.value.trim();

      if (!nombre) {
        setStatus(
          "Ingresá tu nombre.",
          "error"
        );
        nombreInput.focus();
        return;
      }

      let edad = null;

      if (edadTexto) {

        edad = Number(edadTexto);

        if (
          !Number.isInteger(edad) ||
          edad < 18 ||
          edad > 100
        ) {
          setStatus(
            "La edad debe estar entre 18 y 100 años.",
            "error"
          );
          edadInput.focus();
          return;
        }
      }

      saveButton.disabled = true;
      saveButton.textContent =
        "Guardando...";

      setStatus("");

      try {

        const {
          error
        } = await client
          .from("profiles")
          .update({
            nombre,
            ciudad,
            edad,
            descripcion
          })
          .eq("id", currentUser.id);

        if (error) {
          throw error;
        }

        setStatus(
          "Perfil actualizado correctamente.",
          "success"
        );

        setTimeout(() => {
          window.location.href =
            "perfil.html";
        }, 700);

      } catch (error) {

        console.error(
          "Error guardando perfil:",
          error
        );

        setStatus(
          error?.message ||
          "No pudimos guardar los cambios.",
          "error"
        );

        saveButton.disabled = false;
        saveButton.textContent =
          "Guardar cambios";
      }
    }

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }

    form.addEventListener(
      "submit",
      saveProfile
    );

    loadProfile();

  </script>

</body>
  </html>
