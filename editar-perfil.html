<script src="assets/js/config.js"></script>

<script>

"use strict";

const $ = id => document.getElementById(id);

let supabase = null;
let user = null;

const MAX_PHOTOS = 20;
const MAX_SIZE = 8 * 1024 * 1024;


/* =========================================
   MENSAJES
========================================= */

function showStatus(message, type = "") {

  const el = $("status");

  if (!el) return;

  el.textContent = message;
  el.className = "status " + type;
}


function albumStatus(message, type = "") {

  const el = $("albumStatus");

  if (!el) return;

  el.textContent = message;
  el.className = "album-status " + type;
}


function profilePhotoStatus(message, type = "") {

  const el = $("profilePhotoStatus");

  if (!el) return;

  el.textContent = message;
  el.className = "album-status " + type;
}


/* =========================================
   INICIAR SUPABASE
========================================= */

async function initSupabase() {

  try {

    const config = window.EMIMATCH_CONFIG;

    if (
      !config ||
      !config.supabaseUrl ||
      !(
        config.supabaseAnonKey ||
        config.supabaseKey
      )
    ) {

      throw new Error(
        "Configuración de Supabase incompleta."
      );

    }


    const anonKey =
      config.supabaseAnonKey ||
      config.supabaseKey;


    const module =
      await import(
        "https://esm.sh/@supabase/supabase-js@2"
      );


    supabase =
      module.createClient(
        config.supabaseUrl,
        anonKey
      );


    const {
      data,
      error
    } =
      await supabase.auth.getUser();


    if (error) {
      throw error;
    }


    user = data?.user || null;


    if (!user) {

      showStatus(
        "Tu sesión no está activa. Iniciá sesión nuevamente.",
        "error"
      );

      return false;
    }


    return true;


  } catch (error) {

    console.error(
      "Error inicializando Supabase:",
      error
    );


    showStatus(
      error.message ||
      "No pudimos conectar con Supabase.",
      "error"
    );


    return false;
  }
}


/* =========================================
   CARGAR PERFIL
========================================= */

async function loadProfile() {

  const {
    data,
    error
  } =
    await supabase
      .from("profiles")
      .select(
        "id,nombre,edad,ciudad,descripcion,foto_url"
      )
      .eq("id", user.id)
      .maybeSingle();


  if (error) {
    throw error;
  }


  if (!data) {
    return;
  }


  $("nombre").value =
    data.nombre || "";


  $("ciudad").value =
    data.ciudad || "";


  $("edad").value =
    data.edad ?? "";


  $("descripcion").value =
    data.descripcion || "";


  if (data.foto_url) {

    $("profilePhotoPreview").src =
      data.foto_url;

    $("profilePhotoPreview").style.display =
      "block";

    $("profilePhotoPlaceholder").style.display =
      "none";

  } else {

    $("profilePhotoPreview").style.display =
      "none";

    $("profilePhotoPlaceholder").style.display =
      "flex";
  }
}


/* =========================================
   GUARDAR DATOS DEL PERFIL
========================================= */

async function saveProfile(event) {

  event.preventDefault();


  const button =
    $("saveButton");


  button.disabled = true;


  showStatus(
    "Guardando cambios..."
  );


  try {

    const nombre =
      $("nombre").value.trim();


    const ciudad =
      $("ciudad").value.trim();


    const descripcion =
      $("descripcion").value.trim();


    const edadText =
      $("edad").value.trim();


    if (!nombre) {

      throw new Error(
        "Ingresá tu nombre."
      );
    }


    let edad = null;


    if (edadText) {

      edad =
        Number(edadText);


      if (
        !Number.isInteger(edad) ||
        edad < 18 ||
        edad > 100
      ) {

        throw new Error(
          "La edad debe estar entre 18 y 100."
        );
      }
    }


    const {
      error
    } =
      await supabase
        .from("profiles")
        .update({
          nombre,
          ciudad,
          edad,
          descripcion
        })
        .eq("id", user.id);


    if (error) {
      throw error;
    }


    showStatus(
      "✓ Perfil actualizado correctamente.",
      "success"
    );


  } catch (error) {

    console.error(
      "Guardar perfil:",
      error
    );


    showStatus(
      error.message ||
      "No pudimos guardar los cambios.",
      "error"
    );


  } finally {

    button.disabled = false;
  }
}


/* =========================================
   FOTO DE PERFIL
========================================= */

async function changeProfilePhoto(event) {

  const file =
    event.target.files?.[0];


  event.target.value = "";


  if (!file) {
    return;
  }


  try {

    profilePhotoStatus(
      "Preparando foto..."
    );


    if (
      ![
        "image/jpeg",
        "image/png",
        "image/webp"
      ].includes(file.type)
    ) {

      throw new Error(
        "Solo se permiten JPG, PNG o WebP."
      );
    }


    if (file.size > MAX_SIZE) {

      throw new Error(
        "La foto no puede superar los 8 MB."
      );
    }


    const {
      data:sessionData,
      error:sessionError
    } =
      await supabase.auth.getSession();


    if (sessionError) {
      throw sessionError;
    }


    if (!sessionData?.session) {

      throw new Error(
        "La sesión expiró. Iniciá sesión nuevamente."
      );
    }


    profilePhotoStatus(
      "Subiendo foto de perfil..."
    );


    const extension =
      file.type === "image/png"
        ? "png"
        : file.type === "image/webp"
          ? "webp"
          : "jpg";


    const path =
      `${user.id}/profile/${crypto.randomUUID()}.${extension}`;


    const {
      error:uploadError
    } =
      await supabase
        .storage
        .from("avatars")
        .upload(
          path,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          }
        );


    if (uploadError) {
      throw uploadError;
    }


    const {
      data:publicData
    } =
      supabase
        .storage
        .from("avatars")
        .getPublicUrl(path);


    const photoUrl =
      publicData?.publicUrl;


    if (!photoUrl) {

      throw new Error(
        "No se pudo obtener la URL de la foto."
      );
    }


    profilePhotoStatus(
      "Guardando foto..."
    );


    const {
      error:updateError
    } =
      await supabase
        .from("profiles")
        .update({
          foto_url: photoUrl
        })
        .eq("id", user.id);


    if (updateError) {

      await supabase
        .storage
        .from("avatars")
        .remove([path]);

      throw updateError;
    }


    $("profilePhotoPreview").src =
      photoUrl;


    $("profilePhotoPreview").style.display =
      "block";


    $("profilePhotoPlaceholder").style.display =
      "none";


    profilePhotoStatus(
      "✓ Foto de perfil guardada correctamente.",
      "success"
    );


  } catch (error) {

    console.error(
      "Foto de perfil:",
      error
    );


    profilePhotoStatus(
      error.message ||
      "No pudimos guardar la foto de perfil.",
      "error"
    );
  }
}
    
/* =========================================
   CARGAR ÁLBUM
========================================= */

async function loadAlbum() {

  albumStatus("Cargando fotos...");

  try {

    const {
      data,
      error
    } =
      await supabase
        .from("profile_photos")
        .select(
          "id,photo_url,created_at"
        )
        .eq("user_id", user.id)
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {
      throw error;
    }


    renderAlbum(data || []);

    albumStatus("");


  } catch (error) {

    console.error(
      "Cargar álbum:",
      error
    );


    albumStatus(
      error.message ||
      "No pudimos cargar las fotos.",
      "error"
    );
  }
}


/* =========================================
   MOSTRAR ÁLBUM
========================================= */

function renderAlbum(photos) {

  const grid =
    $("albumGrid");


  if (!grid) {
    return;
  }


  grid.innerHTML = "";


  if (!photos.length) {

    grid.innerHTML = `
      <div class="empty-album">
        🖼️<br>
        <strong>Tu álbum está vacío</strong><br>
        Agregá algunas fotos para completar tu perfil.
      </div>
    `;

    return;
  }


  for (const photo of photos) {

    const item =
      document.createElement("div");

    item.className =
      "album-item";


    const img =
      document.createElement("img");


    img.src =
      photo.photo_url;


    img.alt =
      "Foto del álbum";


    img.loading =
      "lazy";


    item.appendChild(img);


    const deleteButton =
      document.createElement("button");


    deleteButton.type =
      "button";


    deleteButton.className =
      "delete-photo";


    deleteButton.textContent =
      "🗑️";


    deleteButton.title =
      "Eliminar foto";


    deleteButton.addEventListener(
      "click",
      () => deletePhoto(photo)
    );


    item.appendChild(
      deleteButton
    );


    grid.appendChild(
      item
    );
  }
}


/* =========================================
   SUBIR FOTOS AL ÁLBUM
========================================= */

async function uploadPhotos(files) {

  const selected =
    Array.from(files || []);


  if (!selected.length) {
    return;
  }


  try {

    albumStatus(
      "Preparando fotos..."
    );


    /*
     * Contar fotos actuales
     */

    const {
      data:existing,
      error:countError
    } =
      await supabase
        .from("profile_photos")
        .select("id")
        .eq("user_id", user.id);


    if (countError) {
      throw countError;
    }


    const current =
      existing?.length || 0;


    if (current >= MAX_PHOTOS) {

      throw new Error(
        `Ya tenés el máximo de ${MAX_PHOTOS} fotos.`
      );
    }


    const available =
      MAX_PHOTOS - current;


    const photosToUpload =
      selected.slice(
        0,
        available
      );


    for (
      let i = 0;
      i < photosToUpload.length;
      i++
    ) {

      const file =
        photosToUpload[i];


      /*
       * Validar formato
       */

      if (
        ![
          "image/jpeg",
          "image/png",
          "image/webp"
        ].includes(file.type)
      ) {

        throw new Error(
          `${file.name}: solo JPG, PNG o WebP.`
        );
      }


      /*
       * Validar tamaño
       */

      if (file.size > MAX_SIZE) {

        throw new Error(
          `${file.name}: supera los 8 MB.`
        );
      }


      albumStatus(
        `Subiendo foto ${i + 1} de ${photosToUpload.length}...`
      );


      /*
       * Extensión
       */

      const extension =
        file.type === "image/png"
          ? "png"
          : file.type === "image/webp"
            ? "webp"
            : "jpg";


      /*
       * Ruta del álbum
       */

      const path =
        `${user.id}/album/${crypto.randomUUID()}.${extension}`;


      /*
       * Subir a Storage
       */

      const {
        error:uploadError
      } =
        await supabase
          .storage
          .from("avatars")
          .upload(
            path,
            file,
            {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type
            }
          );


      if (uploadError) {
        throw uploadError;
      }


      /*
       * Obtener URL pública
       */

      const {
        data:publicData
      } =
        supabase
          .storage
          .from("avatars")
          .getPublicUrl(path);


      const photoUrl =
        publicData?.publicUrl;


      if (!photoUrl) {

        throw new Error(
          "No se pudo obtener la URL pública de la foto."
        );
      }


      /*
       * Guardar solamente las columnas
       * que existen en profile_photos.
       */

      const {
        error:insertError
      } =
        await supabase
          .from("profile_photos")
          .insert({
            user_id: user.id,
            photo_url: photoUrl
          });


      if (insertError) {

        /*
         * Si falla la DB,
         * borrar el archivo recién subido.
         */

        await supabase
          .storage
          .from("avatars")
          .remove([
            path
          ]);


        throw insertError;
      }
    }


    albumStatus(
      photosToUpload.length === 1
        ? "✓ Foto agregada correctamente."
        : `✓ ${photosToUpload.length} fotos agregadas correctamente.`,
      "success"
    );


    await loadAlbum();


  } catch (error) {

    console.error(
      "Subir álbum:",
      error
    );


    albumStatus(
      error.message ||
      "No pudimos guardar las fotos.",
      "error"
    );
  }


  $("albumInput").value = "";
}


/* =========================================
   ELIMINAR FOTO
========================================= */

async function deletePhoto(photo) {

  const confirmed =
    confirm(
      "¿Querés eliminar esta foto del álbum?"
    );


  if (!confirmed) {
    return;
  }


  try {

    albumStatus(
      "Eliminando foto..."
    );


    /*
     * Primero eliminar registro de DB.
     *
     * No intentamos eliminar Storage porque
     * profile_photos ya no guarda storage_path.
     */

    const {
      error
    } =
      await supabase
        .from("profile_photos")
        .delete()
        .eq(
          "id",
          photo.id
        )
        .eq(
          "user_id",
          user.id
        );


    if (error) {
      throw error;
    }


    albumStatus(
      "✓ Foto eliminada correctamente.",
      "success"
    );


    await loadAlbum();


  } catch (error) {

    console.error(
      "Eliminar foto:",
      error
    );


    albumStatus(
      error.message ||
      "No pudimos eliminar la foto.",
      "error"
    );
  }
}


/* =========================================
   EVENTOS
========================================= */

$("profileForm")
  .addEventListener(
    "submit",
    saveProfile
  );


$("profilePhotoInput")
  .addEventListener(
    "change",
    changeProfilePhoto
  );


$("albumInput")
  .addEventListener(
    "change",
    event => {

      uploadPhotos(
        event.target.files
      );

    }
  );


$("backButton")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "perfil.html";

    }
  );


/* =========================================
   INICIAR
========================================= */

(async function start() {

  const connected =
    await initSupabase();


  if (!connected) {
    return;
  }


  try {

    await loadProfile();

    await loadAlbum();

    showStatus("");

  } catch (error) {

    console.error(
      "Inicio editar perfil:",
      error
    );


    showStatus(
      error.message ||
      "No pudimos cargar tu perfil.",
      "error"
    );
  }

})();

</script>

</body>
</html>
