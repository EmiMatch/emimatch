<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10152f">
<title>Editar perfil — EmiMatch</title>
<link rel="stylesheet" href="assets/css/app.css">

<style>
:root{
--bg:#0b1024;--card:rgba(255,255,255,.07);
--border:rgba(255,255,255,.12);--text:#fff;
--muted:#aeb5d0;--primary:#5865f2;--primary2:#7459e8
}
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;padding:18px 14px 40px;
background:radial-gradient(circle at top left,rgba(88,101,242,.22),transparent 35%),var(--bg);
color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif
}
.page{width:min(100%,680px);margin:auto}
.topbar{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:18px
}
.topbar h1{margin:0;font-size:24px}
.back{color:#fff;text-decoration:none;font-weight:700}
.card{
padding:22px;border:1px solid var(--border);border-radius:26px;
background:var(--card);backdrop-filter:blur(18px)
}
.hidden{display:none!important}
.loading{text-align:center;color:var(--muted);padding:45px 10px}
.intro{margin-bottom:22px}
.intro h2{margin:0 0 7px}
.intro p,.help{color:var(--muted);font-size:14px}
.field{margin-bottom:17px}
label{display:block;margin-bottom:7px;font-weight:800}
input,textarea{
width:100%;padding:13px 14px;border:1px solid var(--border);
border-radius:15px;background:rgba(255,255,255,.06);
color:#fff;font:inherit
}
textarea{min-height:130px;resize:vertical}
.actions{display:grid;gap:10px;margin-top:24px}
button,.button-link{
width:100%;min-height:50px;border:0;border-radius:16px;
padding:13px 16px;font:inherit;font-weight:800;
display:flex;align-items:center;justify-content:center;
text-align:center;text-decoration:none;cursor:pointer
}
.save{
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:#fff
}
.cancel{
background:rgba(255,255,255,.06);color:#fff;
border:1px solid var(--border)
}
.status,.album-status{
text-align:center;min-height:24px;margin-top:12px
}
.success{color:#9ee6bd}
.error{color:#ffadb8}

/* ALBUM */
.album{
margin-top:28px;padding:20px;border-radius:22px;
border:1px solid var(--border);
background:rgba(255,255,255,.04)
}
.album-head{
display:flex;justify-content:space-between;
align-items:center;margin-bottom:15px
}
.album h2{margin:0;font-size:20px}
.album p{
margin:5px 0 0;color:var(--muted);font-size:13px
}
#albumCount{
padding:7px 10px;border-radius:99px;
background:rgba(255,255,255,.08);font-size:12px
}
.upload{
width:100%;min-height:48px;padding:13px;border-radius:15px;
display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#7654d8,#a14fbc);
color:#fff;font-weight:800;cursor:pointer
}
.album-grid{
display:grid;grid-template-columns:repeat(3,1fr);
gap:8px;margin-top:14px
}
.album-item{
position:relative;aspect-ratio:1;overflow:hidden;
border-radius:14px;background:rgba(255,255,255,.06)
}
.album-item img{
width:100%;height:100%;object-fit:cover
}
.delete{
position:absolute;right:6px;bottom:6px;
width:34px;height:34px;border:0;border-radius:50%;
background:rgba(0,0,0,.75);color:#fff
}
.empty{
grid-column:1/-1;text-align:center;
color:var(--muted);padding:30px 10px
}
@media(max-width:480px){
.card,.album{padding:17px}
}
</style>
</head>

<body>

<main class="page">

<header class="topbar">
<h1>Editar perfil</h1>
<a class="back" href="perfil.html">← Volver</a>
</header>

<section id="loading" class="card loading">
Cargando tu perfil...
</section>

<section id="editor" class="card hidden">

<div class="intro">
<h2>Personalizá tu perfil</h2>
<p>
Actualizá la información que otras personas podrán ver en EmiMatch.
</p>
</div>

<form id="profileForm">

<div class="field">
<label for="nombre">Nombre</label>
<input id="nombre" type="text" maxlength="80"
placeholder="Tu nombre">
</div>

<div class="field">
<label for="ciudad">Ciudad</label>
<input id="ciudad" type="text" maxlength="100"
placeholder="Buenos Aires">
</div>

<div class="field">
<label for="edad">Edad</label>
<input id="edad" type="number" min="18" max="100"
placeholder="31">
<div class="help">
La edad debe estar entre 18 y 100 años.
</div>
</div>

<div class="field">
<label for="descripcion">Descripción</label>
<textarea id="descripcion" maxlength="500"
placeholder="Contá algo sobre vos..."></textarea>
<div class="help">
Máximo 500 caracteres.
</div>
</div>

<div class="actions">
<button id="saveButton" class="save" type="submit">
Guardar cambios
</button>

<a class="button-link cancel" href="perfil.html">
Cancelar
</a>
</div>

<div id="status" class="status"></div>

</form>

<section class="album">

<div class="album-head">

<div>
<h2>📸 Mi álbum</h2>
<p>Agregá fotos para mostrar más de vos.</p>
</div>

<span id="albumCount">0 fotos</span>

</div>

<label class="upload" for="albumInput">
➕ Agregar fotos
</label>

<input
id="albumInput"
type="file"
accept="image/jpeg,image/png,image/webp"
multiple
hidden
>

<div id="albumStatus" class="album-status"></div>

<div id="albumGrid" class="album-grid">

<div class="empty">
🖼️<br>
<strong>Tu álbum está vacío</strong>
</div>

</div>

</section>

</section>

</main>

<script src="assets/js/config.js"></script>

<script type="module">

const $=id=>document.getElementById(id);

let supabase;
let user;

const MAX_PHOTOS=20;
const MAX_SIZE=8*1024*1024;

function albumStatus(text,type=""){
const el=$("albumStatus");
if(!el)return;
el.textContent=text;
el.className="album-status "+type;
}

async function init(){

try{

const config=window.EMIMATCH_CONFIG;

if(!config?.supabaseUrl||
!config?.supabaseAnonKey){

throw new Error(
"Configuración de Supabase incompleta."
);

}

const {createClient}=await import(
"https://esm.sh/@supabase/supabase-js@2"
);

supabase=createClient(
config.supabaseUrl,
config.supabaseAnonKey
);

const {data,error}=
await supabase.auth.getUser();

if(error)throw error;

user=data.user;

if(!user){
location.href="index.html";
return;
}

const {data:profile,error:profileError}=
await supabase
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();

if(profileError)throw profileError;

if(!profile){
throw new Error("No encontramos tu perfil.");
}

$("nombre").value=profile.nombre||"";
$("ciudad").value=profile.ciudad||"";
$("edad").value=profile.edad??"";
$("descripcion").value=profile.descripcion||"";

$("loading").classList.add("hidden");
$("editor").classList.remove("hidden");

await loadAlbum();

}catch(error){

console.error(error);

$("loading").innerHTML=
"<strong>No pudimos cargar tu perfil.</strong><br><br>"+
(error.message||"Error desconocido");

}

}

async function saveProfile(event){

event.preventDefault();

const nombre=$("nombre").value.trim();
const ciudad=$("ciudad").value.trim();
const descripcion=$("descripcion").value.trim();
const edadText=$("edad").value.trim();

if(!nombre){
$("status").textContent="Ingresá tu nombre.";
return;
}

let edad=null;

if(edadText){

edad=Number(edadText);

if(!Number.isInteger(edad)||
edad<18||edad>100){

$("status").textContent=
"La edad debe estar entre 18 y 100 años.";

return;
}

}

$("saveButton").disabled=true;
$("saveButton").textContent="Guardando...";

try{

const {error}=await supabase
.from("profiles")
.update({
nombre,
ciudad,
edad,
descripcion
})
.eq("id",user.id);

if(error)throw error;

$("status").textContent=
"Perfil actualizado correctamente.";

setTimeout(
()=>location.href="perfil.html",
700
);

}catch(error){

$("status").textContent=
error.message||
"No pudimos guardar los cambios.";

$("saveButton").disabled=false;
$("saveButton").textContent=
"Guardar cambios";

}

}

async function loadAlbum(){

albumStatus("Cargando fotos...");

try{

const {data,error}=await supabase
.from("profile_photos")
.select(
"id,photo_url,storage_path,is_primary,created_at"
)
.eq("user_id",user.id)
.order("is_primary",{ascending:false})
.order("created_at",{ascending:true});

if(error)throw error;

renderAlbum(data||[]);

albumStatus("");

}catch(error){

console.error("Álbum:",error);

albumStatus(
error.message||
"No pudimos cargar las fotos.",
"error"
);

}

}

function renderAlbum(photos){

$("albumCount").textContent=
`${photos.length} ${
photos.length===1?"foto":"fotos"
}`;

const grid=$("albumGrid");

grid.innerHTML="";

if(!photos.length){

grid.innerHTML=
`<div class="empty">
🖼️<br>
<strong>Tu álbum está vacío</strong>
</div>`;

return;
}

photos.forEach(photo=>{

const item=
document.createElement("div");

item.className="album-item";

const img=
document.createElement("img");

img.src=photo.photo_url;
img.alt="Foto del álbum";
img.loading="lazy";

const del=
document.createElement("button");

del.className="delete";
del.type="button";
del.textContent="🗑️";

del.onclick=
()=>deletePhoto(photo);

item.append(img,del);

grid.appendChild(item);

});

}
     $("albumInput").addEventListener("change",async e=>{

const files=[...e.target.files];

if(!files.length)return;

await uploadPhotos(files);

e.target.value="";

});

async function uploadPhotos(files){

try{

const {data:existing,error}=await supabase
.from("profile_photos")
.select("id")
.eq("user_id",user.id);

if(error)throw error;

const current=existing?.length||0;

if(current>=MAX_PHOTOS){

albumStatus(
`Máximo ${MAX_PHOTOS} fotos.`,
"error"
);

return;
}

files=files.slice(
0,
MAX_PHOTOS-current
);

for(let i=0;i<files.length;i++){

const file=files[i];

if(![
"image/jpeg",
"image/png",
"image/webp"
].includes(file.type)){

throw new Error(
"Solo se permiten JPG, PNG o WebP."
);

}

if(file.size>MAX_SIZE){

throw new Error(
`${file.name} supera los 8 MB.`
);

}

albumStatus(
`Subiendo foto ${i+1} de ${files.length}...`
);

const ext=
file.type==="image/png"
?"png":
file.type==="image/webp"
?"webp":
"jpg";

const path=
`${user.id}/album/${crypto.randomUUID()}.${ext}`;

const {error:uploadError}=
await supabase
.storage
.from("avatars")
.upload(
path,
file,
{
cacheControl:"3600",
upsert:false,
contentType:file.type
}
);

if(uploadError)throw uploadError;

const {data:publicData}=
supabase
.storage
.from("avatars")
.getPublicUrl(path);

const {error:insertError}=
await supabase
.from("profile_photos")
.insert({
user_id:user.id,
photo_url:publicData.publicUrl,
storage_path:path,
is_primary:false
});

if(insertError){

await supabase
.storage
.from("avatars")
.remove([path]);

throw insertError;

}

}

albumStatus(
files.length===1
?"Foto agregada correctamente."
:`${files.length} fotos agregadas correctamente.`,
"success"
);

await loadAlbum();

}catch(error){

console.error("Upload:",error);

albumStatus(
error.message||
"No pudimos subir la foto.",
"error"
);

}

}

async function deletePhoto(photo){

if(!confirm(
"¿Querés eliminar esta foto del álbum?"
))return;

try{

albumStatus("Eliminando foto...");

if(photo.storage_path){

await supabase
.storage
.from("avatars")
.remove([
photo.storage_path
]);

}

const {error}=await supabase
.from("profile_photos")
.delete()
.eq("id",photo.id)
.eq("user_id",user.id);

if(error)throw error;

albumStatus(
"Foto eliminada correctamente.",
"success"
);

await loadAlbum();

}catch(error){

console.error("Delete:",error);

albumStatus(
error.message||
"No pudimos eliminar la foto.",
"error"
);

}

}

$("profileForm").addEventListener(
"submit",
saveProfile
);

init();

</script>

</body>
</html>
