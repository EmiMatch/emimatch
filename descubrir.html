<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;
let usuarioDenuncia = null;


// ==========================================
// SESIÓN
// ==========================================

async function obtenerSesion() {

  const {
    data: { session },
    error
  } = await supabaseClient.auth.getSession();

  if (error) {
    throw error;
  }

  if (!session) {

    window.location.href =
      "index.html";

    return null;
  }

  return session;
}


// ==========================================
// BLOQUEADOS
// ==========================================

async function obtenerBloqueados() {

  const { data, error } =
    await supabaseClient
      .from("user_blocks")
      .select(
        "blocker_id,blocked_id"
      )
      .or(
        `blocker_id.eq.${usuarioActual.id},blocked_id.eq.${usuarioActual.id}`
      );

  if (error) {
    throw error;
  }

  const resultado =
    new Set();

  (data || []).forEach(row => {

    if (
      row.blocker_id ===
      usuarioActual.id
    ) {

      resultado.add(
        row.blocked_id
      );

    }

    if (
      row.blocked_id ===
      usuarioActual.id
    ) {

      resultado.add(
        row.blocker_id
      );

    }

  });

  return resultado;
}


// ==========================================
// CARGAR PERFILES
// ==========================================

async function cargarPerfiles() {

  const estado =
    document.getElementById(
      "estado"
    );

  const lista =
    document.getElementById(
      "lista"
    );

  estado.innerHTML =
    "⏳ Cargando perfiles...";

  lista.innerHTML = "";


  try {

    const session =
      await obtenerSesion();

    if (!session) return;

    usuarioActual =
      session.user;


    const bloqueados =
      await obtenerBloqueados();


    // --------------------------------------
    // SWIPES PROPIOS
    // --------------------------------------

    const {
      data: misSwipes,
      error: errorSwipes
    } =
      await supabaseClient
        .from("swipes")
        .select(
          "target_user_id"
        )
        .eq(
          "user_id",
          usuarioActual.id
        );


    if (errorSwipes) {
      throw errorSwipes;
    }


    const yaVistos =
      new Set(
        (misSwipes || []).map(
          row =>
            row.target_user_id
        )
      );


    // --------------------------------------
    // PERFILES
    // --------------------------------------

    const {
      data: perfiles,
      error: errorPerfiles
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .neq(
          "id",
          usuarioActual.id
        );


    if (errorPerfiles) {
      throw errorPerfiles;
    }


    let resultados =
      perfiles || [];


    // --------------------------------------
    // FILTROS
    // --------------------------------------

    const edadMin =
      parseInt(
        document.getElementById(
          "edadMin"
        ).value
      ) || 18;

    const edadMax =
      parseInt(
        document.getElementById(
          "edadMax"
        ).value
      ) || 80;

    const ciudad =
      document.getElementById(
        "ciudad"
      ).value
        .trim()
        .toLowerCase();

    const intereses =
      document.getElementById(
        "intereses"
      ).value
        .trim()
        .toLowerCase();

    const soloOnline =
      document.getElementById(
        "soloOnline"
      ).checked;


    resultados =
      resultados.filter(perfil => {

        // Bloqueados
        if (
          bloqueados.has(
            perfil.id
          )
        ) {
          return false;
        }


        // Ya vistos
        if (
          yaVistos.has(
            perfil.id
          )
        ) {
          return false;
        }


        // Edad
        const edad =
          Number(
            perfil.edad
          );

        if (
          edad &&
          (
            edad < edadMin ||
            edad > edadMax
          )
        ) {
          return false;
        }


        // Ciudad
        if (
          ciudad &&
          !String(
            perfil.ciudad || ""
          )
            .toLowerCase()
            .includes(ciudad)
        ) {
          return false;
        }


        // Intereses
        if (
          intereses &&
          !String(
            perfil.intereses || ""
          )
            .toLowerCase()
            .includes(intereses)
        ) {
          return false;
        }


        // Online
        if (
          soloOnline &&
          perfil.online !== true
        ) {
          return false;
        }


        return true;

      });


    estado.innerHTML = "";


    if (
      resultados.length === 0
    ) {

      estado.innerHTML =
        `<div class="estado">
          💕 No encontramos perfiles con estos filtros.
        </div>`;

      return;
    }


    resultados.forEach(
      perfil =>
        crearCard(perfil)
    );


  } catch (error) {

    console.error(
      "ERROR DESCUBRIR:",
      error
    );


    estado.innerHTML =
      `<div class="error">

        ❌ No se pudieron cargar los perfiles.

        <br><br>

        <strong>
          ${escapeHTML(
            error.message || ""
          )}
        </strong>

        <br><br>

        Revisá la consola si el problema continúa.

      </div>`;

  }

}

    "Usuario";


  const edad =
    perfil.edad
      ? `, ${perfil.edad}`
      : "";


  const ciudad =
    perfil.ciudad
      ? `📍 ${perfil.ciudad}`
      : "";


  const descripcion =
    perfil.descripcion ||
    "Sin descripción.";


  const intereses =
