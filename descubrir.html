<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      padding-bottom: 105px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #07152f, #102b55);
    }

    .contenedor {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .cabecera {
      text-align: center;
      margin-bottom: 18px;
    }

    .cabecera h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .cabecera p {
      margin: 0;
      color: #cbd5e1;
    }

    .estado {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 13px;
      border-radius: 20px;
      background: rgba(34,197,94,.15);
      color: #4ade80;
      font-size: 14px;
    }

    .filtros {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 18px;
      backdrop-filter: blur(10px);
    }

    .filtros h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .filtro-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .filtro {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      outline: none;
      background: white;
      color: #172033;
      font-size: 14px;
    }

    .btn-filtros {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #d4af37;
      color: #07152f;
      font-weight: bold;
      cursor: pointer;
    }

    #contenido {
      min-height: 120px;
    }

    .cargando {
      padding: 35px 15px;
      text-align: center;
      color: #cbd5e1;
    }

    .perfil-card {
      overflow: hidden;
      background: white;
      color: #172033;
      border-radius: 25px;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
    }

    .foto-perfil,
    .foto-sin {
      width: 100%;
      height: 390px;
    }

    .foto-perfil {
      display: block;
      object-fit: cover;
      background: #e5e7eb;
    }

    .foto-sin {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#e5e7eb,#cbd5e1);
      font-size: 110px;
    }

    .info {
      padding: 20px;
    }

    .nombre {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 27px;
      font-weight: bold;
    }

    .online {
      width: 11px;
      height: 11px;
      display: inline-block;
      border-radius: 50%;
      background: #22c55e;
    }

    .dato {
      margin-top: 7px;
      color: #64748b;
    }

    .descripcion {
      margin-top: 15px;
      line-height: 1.5;
      color: #334155;
    }

    .intereses {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .interes {
      padding: 7px 10px;
      border-radius: 20px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 13px;
    }

    .acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 20px 20px;
    }

    .accion {
      padding: 15px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .pasar {
      background: #fee2e2;
      color: #b91c1c;
    }

    .like {
      background: #fce7f3;
      color: #be185d;
    }

    .accion:disabled {
      opacity: .5;
    }

    .sin-perfiles,
    .error {
      padding: 30px 20px;
      border-radius: 22px;
      text-align: center;
      background: rgba(255,255,255,.08);
      color: #cbd5e1;
    }

    .sin-perfiles .emoji,
    .error .emoji {
      font-size: 55px;
    }

    .boton-secundario {
      margin-top: 15px;
      padding: 11px 18px;
      border: none;
      border-radius: 12px;
      background: #d4af37;
      color: #07152f;
      font-weight: bold;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 95px;
      z-index: 3000;
      transform: translate(-50%,20px);
      opacity: 0;
      pointer-events: none;
      padding: 13px 18px;
      border-radius: 14px;
      background: #111827;
      color: white;
      transition: .25s;
      max-width: 90%;
      text-align: center;
    }

    .toast.mostrar {
      opacity: 1;
      transform: translate(-50%,0);
    }

    .bottom-nav {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 2000;
      height: 72px;
      max-width: 500px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(5,1fr);
      background: rgba(7,21,47,.97);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(0,0,0,.45);
      backdrop-filter: blur(14px);
    }

    .nav-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 11px;
      font-weight: bold;
    }

    .nav-item.activo {
      color: #d4af37;
    }

    .icon {
      font-size: 22px;
    }

    .badge {
      position: absolute;
      top: 5px;
      right: 17%;
      min-width: 19px;
      height: 19px;
      padding: 2px 5px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: #ef4444;
      color: white;
      font-size: 11px;
    }

    @media (max-width:400px) {
      body {
        padding: 12px;
        padding-bottom: 100px;
      }

      .foto-perfil,
      .foto-sin {
        height: 350px;
      }

      .nav-item {
        font-size: 10px;
      }

      .icon {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<div class="contenedor">

  <div class="cabecera">
    <h1>🔎 Descubrir</h1>
    <p>Encontrá personas compatibles con vos</p>

    <div class="estado">
      🟢 En línea
    </div>
  </div>

  <div class="filtros">

    <h3>🎯 Filtros</h3>

    <div class="filtro-grid">

      <input
        id="edadMin"
        class="filtro"
        type="number"
        min="18"
        max="100"
        placeholder="Edad mínima"
      >

      <input
        id="edadMax"
        class="filtro"
        type="number"
        min="18"
        max="100"
        placeholder="Edad máxima"
      >

      <input
        id="ciudadFiltro"
        class="filtro"
        type="text"
        placeholder="Ciudad"
      >

      <select
        id="estadoFiltro"
        class="filtro"
      >
        <option value="todos">Todos</option>
        <option value="online">🟢 En línea</option>
      </select>

    </div>

    <button
      class="btn-filtros"
      onclick="aplicarFiltros()"
    >
      🔎 Aplicar filtros
    </button>

  </div>

  <div id="contenido">

    <div class="cargando">
      🚀 EMI-2026 · Iniciando Descubrir...
    </div>

  </div>

</div>


<nav class="bottom-nav">

  <a class="nav-item" href="./perfil.html">
    <span class="icon">👤</span>
    <span>Perfil</span>
  </a>

  <a class="nav-item activo" href="./descubrir.html">
    <span class="icon">🔎</span>
    <span>Descubrir</span>
  </a>

  <a class="nav-item" href="./likes.html">
    <span class="icon">❤️</span>
    <span>Me gustas</span>
  </a>

  <a class="nav-item" href="./chat.html">
    <span class="icon">💕</span>
    <span>Matches</span>
  </a>

  <a class="nav-item" href="./notificaciones.html">
    <span class="icon">🔔</span>
    <span>Notificaciones</span>
    <span id="badgeNotificaciones" class="badge">0</span>
  </a>

</nav>


<div id="toast" class="toast"></div>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;
let perfiles = [];
let perfilesFiltrados = [];
let indiceActual = 0;
let bloqueados = new Set();
let swipesRealizados = new Set();


/* =========================
   INICIO
========================= */

async function iniciar() {

  try {

    mostrarCarga(
      "🔐 Verificando sesión..."
    );

    const resultado =
      await supabaseClient.auth.getSession();

    if (resultado.error) {

      console.error(
        resultado.error
      );

      mostrarError(
        "No se pudo verificar la sesión."
      );

      return;
    }

    const session =
      resultado.data.session;

    if (!session) {

      window.location.href =
        "./index.html";

      return;
    }

    usuarioActual =
      session.user;

    await cargarPerfiles();

    cargarBloqueadosYSwipes();

    cargarNotificaciones();

  }

  catch (error) {

    console.error(
      "Error al iniciar:",
      error
    );

    mostrarError(
      "No se pudo iniciar Descubrir."
    );

  }

}


/* =========================
   PERFILES
========================= */

async function cargarPerfiles() {

  try {

    mostrarCarga(
      "🔎 Buscando personas..."
    );

    const resultado =
      await supabaseClient
        .from("profiles")
        .select(`
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          intereses,
          online,
          last_seen,
          created_at
        `)
        .neq(
          "id",
          usuarioActual.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (resultado.error) {

      console.error(
        "Error profiles:",
        resultado.error
      );

      mostrarError(
        "No se pudieron cargar los perfiles."
      );

      return;
    }


    perfiles =
      resultado.data || [];


    /*
      Primero mostramos perfiles.
      Después quitamos bloqueados y swipes.
      Así Descubrir no queda bloqueado
      si alguna tabla secundaria tiene
      un problema de permisos.
    */

    await cargarBloqueadosYSwipes();


    perfiles =
      perfiles.filter(
        perfil => {

          if (
            bloqueados.has(
              perfil.id
            )
          ) {
            return false;
          }

          if (
            swipesRealizados.has(
              perfil.id
            )
          ) {
            return false;
          }

          return true;

        }
      );


    aplicarFiltros();

  }

  catch (error) {

    console.error(
      "Error cargando perfiles:",
      error
    );

    mostrarError(
      "Error inesperado al buscar perfiles."
    );

  }

}


/* =========================
   BLOQUEADOS + SWIPES
========================= */

async function cargarBloqueadosYSwipes() {

  bloqueados =
    new Set();

  swipesRealizados =
    new Set();


  try {

    const resultadoBloqueos =
      await supabaseClient
        .from("user_blocks")
        .select(
          "blocker_id, blocked_id"
        )
        .or(
          `blocker_id.eq.${usuarioActual.id},blocked_id.eq.${usuarioActual.id}`
        );


    if (!resultadoBloqueos.error) {

      (resultadoBloqueos.data || [])
        .forEach(
          bloqueo => {

            if (
              bloqueo.blocker_id ===
              usuarioActual.id
            ) {

              bloqueados.add(
                bloqueo.blocked_id
              );

            }
            else {

              bloqueados.add(
                bloqueo.blocker_id
              );

            }

          }
        );

    }
    else {

      console.warn(
        "Bloqueos no disponibles:",
        resultadoBloqueos.error
      );

    }

  }
  catch (error) {

    console.warn(
      "Error bloqueos:",
      error
    );

  }


  try {

    const resultadoSwipes =
      await supabaseClient
        .from("swipes")
        .select(
          "target_user_id"
        )
        .eq(
          "user_id",
          usuarioActual.id
        );


    if (!resultadoSwipes.error) {

      swipesRealizados =
        new Set(
          (resultadoSwipes.data || [])
            .map(
              swipe =>
                swipe.target_user_id
            )
        );

    }
    else {

      console.warn(
        "Swipes no disponibles:",
        resultadoSwipes.error
      );

    }

  }
  catch (error) {

    console.warn(
      "Error swipes:",
      error
    );

  }

}


/* =========================
   FILTROS
========================= */

function aplicarFiltros() {

  const edadMin =
    parseInt(
      document.getElementById(
        "edadMin"
      ).value
    ) || 18;


  const edadMax =
    parseInt(
      document.getElementById(
        "edadMax"
      ).value
    ) || 100;


  const ciudad =
    document.getElementById(
      "ciudadFiltro"
    ).value
      .trim()
      .toLowerCase();


  const estado =
    document.getElementById(
      "estadoFiltro"
    ).value;


  perfilesFiltrados =
    perfiles.filter(
      perfil => {

        const edad =
          Number(
            perfil.edad
          );


        if (
          edad &&
          (
            edad < edadMin ||
            edad > edadMax
          )
        ) {

          return false;

        }


        if (
          ciudad &&
          !String(
            perfil.ciudad || ""
          )
          .toLowerCase()
          .includes(
            ciudad
          )
        ) {

          return false;

        }


        if (
          estado === "online" &&
          !perfil.online
        ) {

          return false;

        }


        return true;

      }
    );


  indiceActual = 0;

  mostrarPerfil();

}


/* =========================
   MOSTRAR PERFIL
========================= */

function mostrarPerfil() {

  const contenido =
    document.getElementById(
      "contenido"
    );


  if (
    !perfilesFiltrados.length
  ) {

    contenido.innerHTML = `

      <div class="sin-perfiles">

        <div class="emoji">
          🔎
        </div>

        <h2>
          No hay perfiles disponibles
        </h2>

        <p>
          No encontramos más personas
          que mostrarte.
        </p>

        <button
          class="boton-secundario"
          onclick="limpiarFiltros()"
        >
          🧹 Limpiar filtros
        </button>

      </div>

    `;

    return;

  }


  if (
    indiceActual >=
    perfilesFiltrados.length
  ) {

    contenido.innerHTML = `

      <div class="sin-perfiles">

        <div class="emoji">
          🎉
        </div>

        <h2>
          ¡Ya viste todos los perfiles!
        </h2>

        <p>
          Volvé más tarde para conocer
          nuevas personas.
        </p>

      </div>

    `;

    return;

  }


  const perfil =
    perfilesFiltrados[
      indiceActual
    ];


  const nombre =
    escaparHTML(
      perfil.nombre ||
      "Usuario"
    );


  const edad =
    perfil.edad
      ? `, ${escaparHTML(perfil.edad)}`
      : "";


  const ciudad =
    perfil.ciudad
      ? `📍 ${escaparHTML(perfil.ciudad)}`
      : "";


  const descripcion =
    escaparHTML(
      perfil.descripcion ||
      "Sin descripción."
    );


  let interesesHTML = "";


  if (
    perfil.intereses
  ) {

    interesesHTML =
      String(
        perfil.intereses
      )
      .split(",")
      .map(
        interes =>
          interes.trim()
      )
      .filter(Boolean)
      .map(
        interes => `
          <span class="interes">
            ${escaparHTML(interes)}
          </span>
        `
      )
      .join("");

  }


  let fotoHTML = "";


  if (
    perfil.foto_url
  ) {

    fotoHTML = `

      <img
        class="foto-perfil"
        src="${escaparHTML(perfil.foto_url)}"
        alt="Foto de ${nombre}"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      >

      <div
        class="foto-sin"
        style="display:none;"
      >
        👤
      </div>

    `;

  }
  else {

    fotoHTML = `

      <div class="foto-sin">
        👤
      </div>

    `;

  }


  contenido.innerHTML = `

    <div class="perfil-card">

      ${fotoHTML}

      <div class="info">

        <div class="nombre">

          ${nombre}${edad}

          ${
            perfil.online
              ? `<span class="online"></span>`
              : ""
          }

        </div>

        ${
          ciudad
            ? `
              <div class="dato">
                ${ciudad}
              </div>
            `
            : ""
        }

        <div class="descripcion">
          ${descripcion}
        </div>

        ${
          interesesHTML
            ? `
              <div class="intereses">
                ${interesesHTML}
              </div>
            `
            : ""
        }

      </div>

      <div class="acciones">

        <button
          class="accion pasar"
          onclick="registrarSwipe('pass')"
        >
          ❌ Pasar
        </button>

        <button
          class="accion like"
          onclick="registrarSwipe('like')"
        >
          ❤️ Me gusta
        </button>

      </div>

    </div>

  `;

}


/* =========================
   SWIPE
========================= */

async function registrarSwipe(
  accion
) {

  if (
    !usuarioActual ||
    indiceActual >=
    perfilesFiltrados.length
  ) {
    return;
  }


  const perfil =
    perfilesFiltrados[
      indiceActual
    ];


  const botones =
    document.querySelectorAll(
      ".accion"
    );


  botones.forEach(
    boton =>
      boton.disabled = true
  );


  try {

    const resultado =
      await supabaseClient
        .from("swipes")
        .insert({
          user_id:
            usuarioActual.id,

          target_user_id:
            perfil.id,

          action:
            accion
        });


    if (resultado.error) {

      console.error(
        "Error swipe:",
        resultado.error
      );


      if (
        resultado.error.code ===
        "23505"
      ) {

        swipesRealizados.add(
          perfil.id
        );

        indiceActual++;

        mostrarPerfil();

        return;

      }


      botones.forEach(
        boton =>
          boton.disabled = false
      );


      mostrarToast(
        "No se pudo guardar la acción."
      );

      return;

    }


    swipesRealizados.add(
      perfil.id
    );


    if (
      accion === "like"
    ) {

      await comprobarMatch(
        perfil.id
      );

    }
    else {

      mostrarToast(
        "❌ Perfil pasado"
      );

    }


    indiceActual++;

    mostrarPerfil();

  }
  catch (error) {

    console.error(
      error
    );

    botones.forEach(
      boton =>
        boton.disabled = false
    );

    mostrarToast(
      "Ocurrió un error."
    );

  }

}


/* =========================
   MATCH
========================= */

async function comprobarMatch(
  targetId
) {

  try {

    const resultado =
      await supabaseClient
        .from("matches")
        .select("id")
        .or(
          `and(user1_id.eq.${usuarioActual.id},user2_id.eq.${targetId}),and(user1_id.eq.${targetId},user2_id.eq.${usuarioActual.id})`
        )
        .limit(1);


    if (
      resultado.error
    ) {

      mostrarToast(
        "❤️ Me gusta enviado"
      );

      return;

    }


    if (
      resultado.data &&
      resultado.data.length
    ) {

      mostrarToast(
        "💕 ¡Es un Match! Ya pueden hablar."
      );

    }
    else {

      mostrarToast(
        "❤️ Me gusta enviado"
      );

    }

  }
  catch {

    mostrarToast(
      "❤️ Me gusta enviado"
    );

  }

}


/* =========================
   NOTIFICACIONES
==========
