<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #111827,
          #1e3a8a
        );

      color: white;

      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
    }

    .subtitulo {
      text-align: center;
      color: #dbeafe;
      margin-bottom: 20px;
    }

    .volver {
      width: 100%;
      border: none;
      border-radius: 12px;

      padding: 13px;
      margin-bottom: 18px;

      background: rgba(255,255,255,.12);

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    .card {
      background: white;
      color: #111827;

      border-radius: 24px;

      overflow: hidden;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);
    }

    .foto {
      width: 100%;
      height: 420px;

      object-fit: cover;

      display: block;

      background: #e5e7eb;
    }

    .sin-foto {
      width: 100%;
      height: 420px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #dbeafe,
          #e5e7eb
        );

      font-size: 90px;
    }

    .datos {
      padding: 22px;
    }

    .nombre {
      font-size: 28px;
      font-weight: bold;
    }

    .info {
      margin-top: 8px;

      color: #4b5563;

      font-size: 16px;
    }

    .descripcion {
      margin-top: 15px;

      line-height: 1.5;

      color: #374151;
    }

    .intereses {
      margin-top: 15px;

      padding: 12px;

      background: #f3f4f6;

      border-radius: 12px;

      color: #374151;
    }

    .acciones {
      display: flex;

      gap: 15px;

      padding: 20px;

      background: #f9fafb;
    }

    .accion {
      flex: 1;

      border: none;

      border-radius: 50px;

      padding: 16px;

      font-size: 28px;

      cursor: pointer;

      transition:
        transform .15s,
        opacity .15s;
    }

    .accion:active {
      transform: scale(.92);
    }

    .accion:disabled {
      opacity: .5;
      cursor: wait;
    }

    .pasar {
      background: #e5e7eb;
    }

    .like {
      background: #fee2e2;
    }

    .mensaje {
      background: white;

      color: #111827;

      border-radius: 24px;

      padding: 40px 20px;

      text-align: center;
    }

    .mensaje-icono {
      font-size: 70px;
    }

    .cargando {
      text-align: center;

      padding: 50px 10px;

      font-size: 18px;
    }

    .error {
      margin-top: 15px;

      padding: 15px;

      border-radius: 12px;

      background: #fee2e2;

      color: #991b1b;

      display: none;
    }

  </style>

</head>


<body>


<div class="contenedor">

  <h1>🔎 Descubrir</h1>

  <div class="subtitulo">
    Encontrá nuevas personas
  </div>


  <button
    class="volver"
    onclick="volver()">

    ← Volver

  </button>


  <div id="contenido">

    <div class="cargando">
      Cargando perfiles...
    </div>

  </div>


  <div
    id="error"
    class="error">
  </div>


</div>



<script>


/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* ==================================================
   VARIABLES
================================================== */

let usuarioActual = null;

let perfiles = [];

let indice = 0;

let procesando = false;



/* ==================================================
   INICIAR
================================================== */

async function iniciar() {

  try {

    const {
      data: {
        session
      },
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      mostrarError(
        "Error de sesión: " +
        error.message
      );

      return;
    }


    if (!session) {

      window.location.href =
        "./index.html";

      return;
    }


    usuarioActual =
      session.user;


    await cargarPerfiles();


  } catch (error) {

    console.error(error);

    mostrarError(
      "No se pudo iniciar Descubrir."
    );

  }

}



/* ==================================================
   CARGAR PERFILES
================================================== */

async function cargarPerfiles() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(`
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          intereses,
          created_at
        `)
        .neq(
          "id",
          usuarioActual.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      mostrarError(
        "Error cargando perfiles: " +
        error.message
      );

      return;
    }


    perfiles = data || [];


    /*
      Buscamos los perfiles que
      ya fueron marcados por este usuario.
    */

    const {
      data: swipes,
      error: swipesError
    } =
      await supabaseClient
        .from("swipes")
        .select(
          "target_user_id"
        )
        .eq(
          "user_id",
          usuarioActual.id
        );


    if (swipesError) {

      console.error(
        "Error cargando swipes:",
        swipesError
      );

    } else {

      const vistos =
        new Set(
          (swipes || []).map(
            swipe =>
              swipe.target_user_id
          )
        );


      perfiles =
        perfiles.filter(
          perfil =>
            !vistos.has(
              perfil.id
            )
        );

    }


    indice = 0;

    mostrarPerfil();


  } catch (error) {

    console.error(error);

    mostrarError(
      "Error cargando perfiles."
    );

  }

}



/* ==================================================
   MOSTRAR PERFIL
================================================== */

function mostrarPerfil() {

  const contenido =
    document.getElementById(
      "contenido"
    );


  if (
    !perfiles.length ||
    indice >= perfiles.length
  ) {

    contenido.innerHTML = `

      <div class="mensaje">

        <div class="mensaje-icono">
          💕
        </div>

        <h2>
          No hay más perfiles
        </h2>

        <p>
          Por ahora viste todos los
          perfiles disponibles.
        </p>

        <button
          class="volver"
          onclick="volver()"
          style="
            background:#1e3a8a;
            margin-top:15px;
          ">

          Volver al perfil

        </button>

      </div>

    `;

    return;
  }


  const perfil =
    perfiles[indice];


  let fotoHTML;


  if (perfil.foto_url) {

    fotoHTML = `

      <img
        class="foto"
        src="${escaparHTML(
          perfil.foto_url
        )}"
        alt="Foto de perfil"
        onerror="
          this.style.display='none';
          document
            .getElementById('sinFoto')
            .style.display='flex';
        "
      >

      <div
        id="sinFoto"
        class="sin-foto"
        style="display:none;">

        👤

      </div>

    `;

  } else {

    fotoHTML = `

      <div class="sin-foto">

        👤

      </div>

    `;

  }


  contenido.innerHTML = `

    <div class="card">

      ${fotoHTML}


      <div class="datos">

        <div class="nombre">

          ${
            escaparHTML(
              perfil.nombre ||
              "Usuario"
            )
          }

          ${
            perfil.edad
              ? ", " +
                escaparHTML(
                  perfil.edad
                )
              : ""
          }

        </div>


        ${
          perfil.ciudad
            ? `
              <div class="info">

                📍
                ${escaparHTML(
                  perfil.ciudad
                )}

              </div>
            `
            : ""
        }


        ${
          perfil.descripcion
            ? `
              <div class="descripcion">

                ${escaparHTML(
                  perfil.descripcion
                )}

              </div>
            `
            : ""
        }


        ${
          perfil.intereses
            ? `
              <div class="intereses">

                ❤️
                ${escaparHTML(
                  perfil.intereses
                )}

              </div>
            `
            : ""
        }

      </div>


      <div class="acciones">

        <button
          id="btnPasar"
          class="accion pasar"
          onclick="pasarPerfil()">

          ❌

        </button>


        <button
          id="btnLike"
          class="accion like"
          onclick="darLike()">

          ❤️

        </button>

      </div>

    </div>

  `;

}



/* ==================================================
   LIKE
================================================== */

async function darLike() {

  if (procesando) return;


  const perfil =
    perfiles[indice];


  if (
    !perfil ||
    !usuarioActual
  ) {

    return;
  }


  procesando = true;


  bloquearBotones(true);


  try {

    /*
      Primero comprobamos si ya existe.
      Esto evita duplicate key.
    */

    const {
      data: existente,
      error: buscarError
    } =
      await supabaseClient
        .from("swipes")
        .select("id, action")
        .eq(
          "user_id",
          usuarioActual.id
        )
        .eq(
          "target_user_id",
          perfil.id
        )
        .maybeSingle();


    if (buscarError) {

      console.error(
        buscarError
      );

      mostrarError(
        "No se pudo comprobar el Like: " +
        buscarError.message
      );

      return;
    }


    /*
      Si ya existe un registro,
      no intentamos insertarlo nuevamente.
    */

    if (!existente) {

      const {
        error
      } =
        await supabaseClient
          .from("swipes")
          .insert({

            user_id:
              usuarioActual.id,

            target_user_id:
              perfil.id,

            action:
              "like"

          });


      if (error) {

        /*
          Si otro intento creó el registro
          simultáneamente, simplemente
          continuamos.
        */

        if (
          !String(
            error.message
          )
          .toLowerCase()
          .includes(
            "duplicate"
          )
        ) {

          console.error(error);

          mostrarError(
            "No se pudo guardar el Like: " +
            error.message
          );

          return;
        }

      }

    }


    /*
      Pasamos al siguiente perfil.
    */

    indice++;

    mostrarPerfil();


  } catch (error) {

    console.error(error);

    mostrarError(
      "Ocurrió un error al registrar el Like."
    );

  } finally {

    procesando = false;

    bloquearBotones(false);

  }

}



/* ==================================================
   PASAR PERFIL
================================================== */

async function pasarPerfil() {

  if (procesando) return;


  const perfil =
    perfiles[indice];


  if (
    !perfil ||
    !usuarioActual
  ) {

    return;
  }


  procesando = true;


  bloquearBotones(true);


  try {

    /*
      Comprobamos si ya existe.
    */

    const {
      data: existente,
      error: buscarError
    } =
      await supabaseClient
        .from("swipes")
        .select("id, action")
        .eq(
          "user_id",
          usuarioActual.id
        )
        .eq(
          "target_user_id",
          perfil.id
        )
        .maybeSingle();


    if (buscarError) {

      console.error(
        buscarError
      );

      mostrarError(
        "No se pudo comprobar el perfil: " +
        buscarError.message
      );

      return;
    }


    if (!existente) {

      const {
        error
      } =
        await supabaseClient
          .from("swipes")
          .insert({

            user_id:
              usuarioActual.id,

            target_user_id:
              perfil.id,

            action:
              "pass"

          });


      if (error) {

        if (
          !String(
            error.message
          )
          .toLowerCase()
          .includes(
            "duplicate"
          )
        ) {

          console.error(error);

          mostrarError(
            "No se pudo guardar la acción: " +
            error.message
          );

          return;
        }

      }

    }


    indice++;

    mostrarPerfil();


  } catch (error) {

    console.error(error);

    mostrarError(
      "Ocurrió un error."
    );

  } finally {

    procesando = false;

    bloquearBotones(false);

  }

}



/* ==================================================
   BLOQUEAR BOTONES
================================================== */

function bloquearBotones(
  estado
) {

  const like =
    document.getElementById(
      "btnLike"
    );

  const pasar =
    document.getElementById(
      "btnPasar"
    );


  if (like) {

    like.disabled =
      estado;

  }


  if (pasar) {

    pasar.disabled =
      estado;

  }

}



/* ==================================================
   ESCAPAR HTML
================================================== */

function escaparHTML(
  valor
) {

  return String(valor)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* ==================================================
   ERROR
================================================== */

function mostrarError(
  mensaje
) {

  const elemento =
    document.getElementById(
      "error"
    );


  elemento.textContent =
    mensaje;


  elemento.style.display =
    "block";

}



/* ==================================================
   VOLVER
================================================== */

function volver() {

  window.location.href =
    "./perfil.html";

}



/* ==================================================
   INICIAR
================================================== */

iniciar();

</script>

</body>

</html>
