<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EmiMatch · Descubrir</title>

<meta
  name="description"
  content="Descubrí nuevas personas y conectá con ellas en EmiMatch."
>

<meta
  name="theme-color"
  content="#06122b"
>

<link
  rel="icon"
  href="favicon.svg"
  type="image/svg+xml"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

:root{
  --azul:#06122b;
  --azul2:#102d59;
  --dorado:#d4af37;
  --dorado2:#f4df91;
  --blanco:#ffffff;
  --muted:#b8c4d8;
  --rosa:#e11d48;
  --rosa2:#be123c;
  --verde:#22c55e;
  --rojo:#ef4444;
  --texto:#111827;
  --gris:#64748b;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  padding-bottom:105px;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--blanco);

  background:
    radial-gradient(
      circle at 90% 0%,
      rgba(212,175,55,.18),
      transparent 32%
    ),
    radial-gradient(
      circle at 0% 40%,
      rgba(124,58,237,.15),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      var(--azul),
      var(--azul2)
    );
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* =========================
   HEADER
========================= */

header{
  padding:25px 16px 18px;
  text-align:center;
}

.logo{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:29px;
  font-weight:900;
}

.logo-icon{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      var(--dorado),
      #f7df86
    );

  box-shadow:
    0 8px 25px
    rgba(212,175,55,.2);

  font-size:22px;
}

.logo-text{
  color:var(--dorado);
}

header p{
  margin:9px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* =========================
   CONTENEDOR
========================= */

.contenedor{
  width:calc(100% - 20px);
  max-width:560px;
  margin:auto;
}

/* =========================
   FILTROS
========================= */

.filtros{
  padding:17px;

  border-radius:24px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 18px 45px
    rgba(0,0,0,.25);

  backdrop-filter:blur(14px);
}

.filtros-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:15px;
}

.filtros-titulo{
  display:flex;
  align-items:center;
  gap:10px;
}

.filtros-icono{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  background:
    rgba(212,175,55,.15);

  font-size:20px;
}

.filtros h2{
  margin:0;
  font-size:17px;
}

.filtros-sub{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px;
}

.fila{
  display:flex;
  gap:10px;
}

.campo{
  flex:1;
}

.campo-label{
  display:block;

  margin:
    0 0 6px 3px;

  color:var(--muted);

  font-size:10px;
  font-weight:800;
}

input,
select{
  width:100%;
  height:47px;

  padding:0 13px;

  border:0;
  outline:0;

  border-radius:14px;

  background:#ffffff;
  color:#111827;

  font-size:14px;
}

input:focus,
select:focus{
  box-shadow:
    0 0 0 3px
    rgba(212,175,55,.28);
}

.ciudad{
  margin-top:11px;
}

.btn-filtro{
  width:100%;
  height:48px;

  margin-top:12px;

  border:0;
  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      var(--dorado),
      #f1d36a
    );

  color:var(--azul);

  font-size:14px;
  font-weight:900;

  box-shadow:
    0 8px 22px
    rgba(212,175,55,.2);
}

.btn-filtro:active{
  transform:scale(.98);
}

/* =========================
   CONTADOR
========================= */

.contador{
  min-height:20px;

  margin:
    15px 0 10px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
  font-weight:700;
}

/* =========================
   ESTADOS
========================= */

.cargando,
.mensaje,
.error{
  margin-top:15px;

  padding:
    35px 22px;

  border-radius:24px;

  text-align:center;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.1);
}

.cargando{
  color:var(--muted);
}

.mensaje-icon{
  font-size:45px;
}

.mensaje h2{
  margin:
    10px 0 7px;

  font-size:21px;
}

.mensaje p{
  margin:0;

  color:var(--muted);

  line-height:1.55;

  font-size:13px;
}

.error{
  background:
    rgba(239,68,68,.12);

  border-color:
    rgba(239,68,68,.4);
}

.error h3{
  margin:0;
}

.error-detalle{
  margin-top:10px;

  color:#fecaca;

  font-size:11px;

  line-height:1.5;

  word-break:break-word;
}

/* =========================
   TARJETA
========================= */

.tarjeta{
  overflow:hidden;

  background:#ffffff;

  color:var(--texto);

  border-radius:28px;

  box-shadow:
    0 25px 65px
    rgba(0,0,0,.4);

  animation:
    aparecer .25s ease;
}

@keyframes aparecer{

  from{
    opacity:0;
    transform:
      translateY(12px)
      scale(.99);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

.foto-wrapper{
  position:relative;

  width:100%;
  height:470px;

  overflow:hidden;

  background:#e5e7eb;
}

.foto{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.sin-foto{
  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 30% 20%,
      #fff1a8,
      transparent 28%
    ),
    linear-gradient(
      135deg,
      #b58b22,
      #f4df91
    );

  font-size:90px;
}

.foto-overlay{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:190px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.68)
    );

  pointer-events:none;
}

.estado{
  position:absolute;

  top:15px;
  left:15px;

  display:inline-flex;

  align-items:center;

  gap:6px;

  padding:
    8px 11px;

  border-radius:999px;

  background:
    rgba(0,0,0,.55);

  color:#ffffff;

  font-size:10px;

  font-weight:800;

  backdrop-filter:
    blur(8px);
}

.estado-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#94a3b8;
}

.estado.online .estado-dot{
  background:
    var(--verde);

  box-shadow:
    0 0 0 3px
    rgba(34,197,94,.18);
}

.ubicacion-foto{
  position:absolute;

  left:18px;
  bottom:18px;

  color:#ffffff;

  font-size:12px;
  font-weight:700;

  z-index:2;
}

.datos{
  padding:
    20px 20px 14px;
}

.nombre{
  font-size:27px;

  line-height:1.15;

  font-weight:900;

  letter-spacing:-.4px;
}

.info{
  display:flex;

  align-items:center;

  gap:6px;

  margin-top:8px;

  color:var(--gris);

  font-size:13px;
}

.descripcion{
  margin-top:15px;

  color:#303846;

  font-size:14px;

  line-height:1.6;
}

.intereses{
  margin-top:13px;

  padding:
    11px 12px;

  border-radius:13px;

  background:#f8fafc;

  color:#173d7a;

  font-size:12px;

  font-weight:700;

  line-height:1.5;
}

/* =========================
   ACCIONES
========================= */

.acciones{
  display:flex;

  gap:12px;

  padding:
    4px 20px 17px;
}

.accion{
  flex:1;

  height:59px;

  border:0;

  border-radius:18px;

  font-size:24px;

  font-weight:900;

  transition:
    .15s ease;
}

.accion:active{
  transform:scale(.94);
}

.btn-no{
  background:#f1f5f9;

  color:#334155;

  box-shadow:
    inset 0 0 0 1px
    #e2e8f0;
}

.btn-si{
  background:
    linear-gradient(
      135deg,
      var(--rosa),
      var(--rosa2)
    );

  color:#ffffff;

  box-shadow:
    0 9px 22px
    rgba(225,29,72,.25);
}

.accion small{
  display:block;

  margin-top:-1px;

  font-size:9px;

  opacity:.72;
}

.btn-bloquear{
  width:
    calc(100% - 40px);

  height:42px;

  margin:
    0 20px 20px;

  border:
    1px solid #fecaca;

  border-radius:13px;

  background:#fff7f8;

  color:var(--rosa2);

  font-size:12px;

  font-weight:800;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  left:50%;
  bottom:91px;

  z-index:3000;

  display:none;

  transform:
    translateX(-50%);

  width:max-content;

  max-width:
    calc(100% - 28px);

  padding:
    12px 17px;

  border-radius:14px;

  background:#111827;

  color:#ffffff;

  font-size:13px;

  font-weight:700;

  text-align:center;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.35);
}

/* =========================
   MATCH OVERLAY
========================= */

.match-overlay{
  position:fixed;

  inset:0;

  z-index:5000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(3,8,24,.88);

  backdrop-filter:
    blur(12px);
}

.match-box{
  position:relative;

  width:100%;

  max-width:430px;

  padding:
    30px 22px 24px;

  border:
    1px solid
    rgba(212,175,55,.4);

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      #0b1b3d,
      #172c5c
    );

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.65);

  text-align:center;

  animation:
    matchEntrada .35s ease;
}

@keyframes matchEntrada{

  from{
    opacity:0;
    transform:
      scale(.82)
      translateY(20px);
  }

  to{
    opacity:1;
    transform:
      scale(1)
      translateY(0);
  }

}

.match-corazon{
  font-size:62px;

  animation:
    latido 1s
    infinite;
}

@keyframes latido{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.18);
  }

}

.match-box h2{
  margin:
    8px 0 5px;

  color:var(--dorado2);

  font-size:31px;

  font-weight:900;
}

.match-box p{
  margin:
    0 0 22px;

  color:#d7e0f0;

  font-size:14px;
}

.match-fotos{
  display:flex;

  justify-content:center;

  align-items:center;

  gap:18px;

  margin-bottom:24px;
}

.match-foto{
  width:105px;
  height:105px;

  border-radius:50%;

  overflow:hidden;

  border:
    4px solid
    var(--dorado);

  background:
    linear-gradient(
      135deg,
      #b58b22,
      #f4df91
    );

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:42px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.35);
}

.match-foto img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.match-plus{
  color:var(--dorado2);

  font-size:30px;

  font-weight:900;
}

.match-botones{
  display:flex;

  flex-direction:column;

  gap:10px;
}

.match-boton{
  width:100%;

  min-height:52px;

  border:0;

  border-radius:15px;

  font-size:14px;

  font-weight:900;
}

.match-chat{
  background:
    linear-gradient(
      135deg,
      var(--dorado),
      #f4df91
    );

  color:#06122b;
}

.match-seguir{
  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.18);

  color:#ffffff;
}

.match-cerrar{
  position:absolute;

  top:12px;
  right:14px;

  width:34px;
  height:34px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.08);

  color:#ffffff;

  font-size:18px;
}

/* =========================
   NAV
========================= */

.nav{
  position:fixed;

  left:9px;
  right:9px;
  bottom:9px;

  height:68px;

  z-index:1000;

  display:flex;

  align-items:center;

  justify-content:space-around;

  padding:0 4px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius:23px;

  background:
    rgba(5,17,38,.97);

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.5);

  backdrop-filter:
    blur(15px);
}

.nav a{
  position:relative;

  min-width:54px;

  color:#aebbd0;

  text-decoration:none;

  text-align:center;

  font-size:9px;

  font-weight:700;
}

.nav a span{
  display:block;

  margin-bottom:3px;

  font-size:21px;
}

.nav a.activo{
  color:var(--dorado);
}

.badge{
  position:absolute;

  top:-5px;
  right:0;

  display:none;

  align-items:center;
  justify-content:center;

  min-width:18px;
  height:18px;

  padding:
    0 4px;

  border-radius:999px;

  background:
    var(--rojo);

  color:#ffffff;

  font-size:9px;

  font-weight:900;

  border:
    2px solid
    var(--azul);
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:700px){

  .contenedor{
    max-width:570px;
  }

  .foto-wrapper{
    height:510px;
  }

}

@media(max-width:380px){

  .contenedor{
    width:
      calc(100% - 16px);
  }

  .foto-wrapper{
    height:390px;
  }

  .nombre{
    font-size:24px;
  }

  .nav a{
    min-width:47px;
    font-size:8px;
  }

  .nav a span{
    font-size:19px;
  }

  .match-foto{
    width:88px;
    height:88px;
  }

  .match-box h2{
    font-size:27px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">

    <div class="logo-icon">
      💕
    </div>

    <div class="logo-text">
      EmiMatch
    </div>

  </div>

  <p>
    Descubrí personas que podrían conectar con vos
  </p>

</header>

<main class="contenedor">

  <section class="filtros">

    <div class="filtros-top">

      <div class="filtros-titulo">

        <div class="filtros-icono">
          🎯
        </div>

        <div>

          <h2>
            Buscar perfiles
          </h2>

          <div class="filtros-sub">
            Personalizá tu búsqueda

    <div class="fila">

      <div class="campo">

        </label>

        <input

          type="number"
          min="18"
          max="100"
          placeholder="18"
        >

      </div>

      <div class="campo">

        <label class="campo-label">
          EDAD MÁXIMA
        </label>

        <input
          id="edadMax"
          type="number"
          min="18"
          max="100"
          placeholder="100"
        >

      </div>

    </div>

    <div class="ciudad">

      <label class="campo-label">

      </label>

      <select id="ciudad">

        <option value="">

      </select>

    </div>

    <button

<div

></div>

<!-- =========================
     MATCH MODAL
========================= -->

<div
  id="matchOverlay"
  class="match-overlay"
>

  <div class="match-box">

    <button
      class="match-cerrar"
      type="button"

    >

</div>

<nav class="nav">

  <a

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

let supabaseClient = null;

try{

  if(
    !window.supabase ||
    !window.supabase.createClient
  ){

    throw new Error(
      "La librería de Supabase no se pudo cargar."
    );

  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

}catch(error){

  console.error(
    "SUPABASE:",
    error
  );

}

/* =========================
   VARIABLES
========================= */

let usuarioActual = null;

let perfiles = [];

let perfilesFiltrados = [];

let indiceActual = 0;

let bloqueados =
  new Set();

let swipesRealizados =
  new Set();

let perfilMatchActual =
  null;

let matchActualId =
  null;

/* =========================
   ELEMENTOS
========================= */

const $ = id =>
  document.getElementById(id);

const contenido =
  $("contenido");

const contador =
  $("contador");

const ciudadSelect =
  $("ciudad");

const edadMin =
  $("edadMin");

const edadMax =
  $("edadMax");

const toast =
  $("toast");

const badge =
  $("badge");

const matchOverlay =
  $("matchOverlay");

const matchFotoUsuario =
  $("matchFotoUsuario");

const matchFotoPerfil =
  $("matchFotoPerfil");

const matchChat =
  $("matchChat");

/* =========================
   INICIO SEGURO
========================= */

let iniciando = false;

async function iniciar(){

  if(iniciando){
    return;
  }

  iniciando = true;

  try{

    if(!supabaseClient){

      throw new Error(
        "No se pudo conectar con Supabase."
      );

    }

    contenido.innerHTML = `
      <div class="cargando">
        🔐 Verificando sesión...
      </div>
    `;

    const resultado =
      await supabaseClient.auth.getSession();

    if(resultado.error){

      throw resultado.error;

    }

    const session =
      resultado.data?.session;

    if(!session){

      window.location.replace(
        "index.html"
      );

      return;

    }

    usuarioActual =
      session.user;

    await cargarPerfiles();

    await cargarNotificaciones();

  }catch(error){

    console.error(
      "ERROR INICIAR:",
      error
    );

    mostrarError(
      "No se pudo iniciar Descubrir.",
      error
    );

  }finally{

    iniciando = false;

  }

}

   INICIALIZACIÓN
========================= */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    iniciar,
    {
      once:true
    }
  );

}else{

  iniciar();

}

========================= */

async function cargarPerfiles(){

  contenido.innerHTML = `
    <div class="cargando">
      🔎 Buscando personas...
    </div>
  `;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        nombre,
        edad,
        ciudad,
        descripcion,
        foto_url,
        intereses,
        online,
        last_seen
      `)
      .neq(
        "id",
        usuarioActual.id
      );

  if(error){

    throw error;

  }

  perfiles =
    data || [];

  await cargarBloqueados();

  await cargarSwipes();

  prepararCiudades();

  aplicarFiltros();

}

/* =========================
   BLOQUEADOS
========================= */

async function cargarBloqueados(){

  bloqueados =
    new Set();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_blocks")
      .select(
        "blocked_id"
      )
      .eq(
        "blocker_id",
        usuarioActual.id
      );

  if(error){

    console.warn(
      "BLOQUEOS:",
      error
    );

    return;

  }

  (data || []).forEach(
    item => {

      bloqueados.add(
        item.blocked_id
      );

    }
  );

}
