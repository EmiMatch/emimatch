<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    .discover {
      max-width: 650px;
      margin: auto;
      padding: 24px 16px;
    }

    .discover-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .discover-head h1 {
      margin: 0;
    }

    .discover-head p {
      margin: 4px 0 0;
      color: var(--em-muted);
    }

    .filters {
      display: none;
      margin-bottom: 16px;
    }

    .filters.open {
      display: block;
    }

    .profile-card {
      overflow: hidden;
      padding: 0;
    }

    .profile-photo {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      padding: 20px;
    }

    .profile-info h2 {
      margin: 0;
    }

    .profile-city {
      color: var(--em-muted);
      margin: 5px 0 15px;
    }

    .interests {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .interest {
      padding: 6px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,.08);
      font-size: 13px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 20px 0;
    }

    .action {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      font-size: 22px;
    }

    .action-pass {
      background: #432b38;
    }

    .action-info {
      background: #293c58;
    }

    .action-like {
      background: #61304f;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
    }

    .error {
      margin-top: 15px;
      color: var(--em-danger);
      text-align: center;
      word-break: break-word;
    }

    .match {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,.78);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .match.open {
      display: flex;
    }

    .match-box {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .match-photo {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin: 12px 0;
    }

    .match-actions {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<main class="discover">

  <!-- CABECERA -->

  <header class="discover-head">

    <div>
      <h1>💕 Descubrir</h1>
      <p>Encontrá nuevas conexiones.</p>
    </div>

    <button
      id="filterButton"
      class="em-btn em-btn-secondary"
      type="button"
      aria-label="Filtros">
      ⚙️
    </button>

  </header>

  <!-- FILTROS -->

  <section id="filters" class="filters em-card">

    <div class="em-grid em-grid-2">

      <label>
        Edad mínima

        <input
          id="minAge"
          class="em-input"
          type="number"
          min="18"
          max="100"
          value="18">
      </label>

      <label>
        Edad máxima

        <input
          id="maxAge"
          class="em-input"
          type="number"
          min="18"
          max="100"
          value="100">
      </label>

    </div>

    <label>
      Ciudad

      <input
        id="city"
        class="em-input"
        type="text"
        placeholder="Todas las ciudades">
    </label>

    <button
      id="applyFilters"
      class="em-btn em-btn-primary"
      type="button">
      Aplicar filtros
    </button>

  </section>

  <!-- ESTADO -->

  <section
    id="status"
    class="em-card empty">
    🔎 Buscando perfiles...
  </section>

  <!-- PERFIL -->

  <section
    id="profile"
    class="em-card profile-card"
    style="display:none">

    <img
      id="profilePhoto"
      class="profile-photo"
      src="https://placehold.co/600x700?text=EmiMatch"
      alt="Foto de perfil">

    <div class="profile-info">

      <h2 id="profileName"></h2>

      <div
        id="profileCity"
        class="profile-city">
      </div>

      <p id="profileDescription"></p>

      <div
        id="interests"
        class="interests">
      </div>

      <button
        id="blockButton"
        class="em-btn em-btn-secondary"
        type="button"
        style="margin-top:16px">
        🚫 Bloquear
      </button>

    </div>

  </section>

  <!-- ACCIONES -->

  <div
    id="actions"
    class="actions"
    style="display:none">

    <button
      id="passButton"
      class="action action-pass"
      type="button"
      aria-label="Pasar">
      ❌
    </button>

    <button
      id="infoButton"
      class="action action-info"
      type="button"
      aria-label="Información">
      ℹ️
    </button>

    <button
      id="likeButton"
      class="action action-like"
      type="button"
      aria-label="Me gusta">
      ❤️
    </button>

  </div>

  <!-- ERROR -->

  <div
    id="error"
    class="error">
  </div>

</main>

<!-- MATCH -->

<div
  id="matchModal"
  class="match">

  <div class="em-card match-box">

    <h2>💕 ¡Hicieron Match!</h2>

    <p>
      Los dos se dieron Like.
    </p>

    <img
      id="matchPhoto"
      class="match-photo"
      src="https://placehold.co/200x200?text=💕"
      alt="Foto del Match">

    <div class="match-actions">

      <button
        id="chatButton"
        class="em-btn em-btn-primary"
        type="button">
        💬 Enviar mensaje
      </button>

      <button
        id="continueButton"
        class="em-btn em-btn-secondary"
        type="button">
        Seguir descubriendo
      </button>

    </div>

  </div>

</div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>

<script>

(() => {

  "use strict";

  const config = window.EMIMATCH_CONFIG;

  const status = document.getElementById("status");
  const profile = document.getElementById("profile");
  const actions = document.getElementById("actions");
  const errorBox = document.getElementById("error");

  if (!config) {

    status.textContent =
      "⚠️ No se pudo cargar la configuración de EmiMatch.";

    return;
  }

  const db = window.supabase.createClient(
    config.supabaseUrl,
    config.supabaseKey
  );

  let currentUser = null;
  let profiles = [];
  let currentProfile = null;

  const $ = id =>
    document.getElementById(id);

  function showError(message) {

    console.error(
      "EmiMatch / Descubrir:",
      message
    );

    errorBox.textContent =
      "⚠️ " + message;
  }

  function clearError() {
    errorBox.textContent = "";
  }

  function showLoading() {

    status.style.display = "block";
    profile.style.display = "none";
    actions.style.display = "none";

    status.textContent =
      "🔎 Buscando perfiles...";

    clearError();
  }

  function showEmpty() {

    status.style.display = "block";
    profile.style.display = "none";
    actions.style.display = "none";

    status.innerHTML =
      "💕 <strong>No hay más perfiles disponibles.</strong><br>" +
      "<small>Probá cambiando los filtros.</small>";
  }

  function showProfile(person) {

    currentProfile = person;

    status.style.display = "none";
    profile.style.display = "block";
    actions.style.display = "flex";

    $("profilePhoto").src =
      person.foto_url ||
      "https://placehold.co/600x700?text=EmiMatch";

    $("profileName").textContent =
      `${person.nombre || "Usuario"}${person.edad ? ", " + person.edad : ""}`;

    $("profileCity").textContent =
      person.ciudad ||
      "Ciudad no indicada";

    $("profileDescription").textContent =
      person.descripcion ||
      "Sin descripción.";

    $("interests").innerHTML = "";

    if (person.intereses) {

      person.intereses
        .split(",")
        .map(item => item.trim())
        .filter(Boolean)
        .slice(0, 8)
        .forEach(item => {

          const tag =
            document.createElement("span");

          tag.className = "interest";
          tag.textContent = item;

          $("interests").appendChild(tag);

        });
    }
  }

  async function loadProfiles() {

    showLoading();

    const minAge =
      Number($("minAge").value) || 18;

    const maxAge =
      Number($("maxAge").value) || 100;

    const city =
      $("city").value.trim();

    try {

      /* 1. BLOQUEOS */

      const {
        data: blocks,
        error: blocksError
      } = await db
        .from("user_blocks")
        .select("blocked_user_id")
        .eq("user_id", currentUser.id);

      if (blocksError) {

        throw new Error(
          "user_blocks: " +
          blocksError.message
        );
      }

      const blockedIds =
        new Set(
          (blocks || [])
            .map(row => row.blocked_user_id)
        );

      /* 2. SWIPES */

      const {
        data: swipes,
        error: swipesError
      } = await db
        .from("swipes")
        .select("target_user_id")
        .eq("user_id", currentUser.id);

      if (swipesError) {

        throw new Error(
          "swipes: " +
          swipesError.message
        );
      }

      const swipedIds =
        new Set(
          (swipes || [])
            .map(row => row.target_user_id)
        );

      /* 3. PERFILES */

      let query =
        db
          .from("profiles")
          .select(`
            id,
            nombre,
            edad,
            ciudad,
            descripcion,
            foto_url,
            intereses,
            created_at
          `)
          .neq("id", currentUser.id)
          .gte("edad", minAge)
          .lte("edad", maxAge)
          .order(
            "created_at",
            { ascending: false }
          );

      if (city) {

        query =
          query.ilike(
            "ciudad",
            `%${city}%`
          );
      }

      const {
        data: people,
        error: profilesError
      } = await query;

      if (profilesError) {

        throw new Error(
          "profiles: " +
          profilesError.message
        );
      }

      /* 4. FILTRADO LOCAL */

      profiles =
        (people || []).filter(person =>
          !blockedIds.has(person.id) &&
          !swipedIds.has(person.id)
        );

      if (!profiles.length) {

        showEmpty();
        return;
      }

      showProfile(
        profiles[0]
      );

    } catch (error) {

      status.style.display = "block";
      profile.style.display = "none";
      actions.style.display = "none";

      status.textContent =
        "No se pudieron cargar los perfiles.";

      showError(
        error.message ||
        "Error desconocido."
      );
    }
  }

  async function saveSwipe(action) {

    if (!currentProfile)
      return;

    const target =
      currentProfile;

    try {

      const {
        error: swipeError
      } = await db
        .from("swipes")
        .insert({
          user_id: currentUser.id,
          target_user_id: target.id,
          action: action
        });

      if (swipeError) {

        throw new Error(
          "No se pudo guardar el swipe: " +
          swipeError.message
        );
      }

      profiles.shift();

      /* LIKE */

      if (action === "like") {

        const {
          data: reverseLike,
          error: reverseError
        } = await db
          .from("swipes")
          .select("id")
          .eq(
            "user_id",
            target.id
          )
          .eq(
            "target_user_id",
            currentUser.id
          )
          .eq(
            "action",
            "like"
          )
          .maybeSingle();

        if (reverseError) {

          console.error(
            "Reverse Like:",
            reverseError
          );

        }

        if (reverseLike) {

          await createMatch(
            target.id
          );

        }

      }

      if (profiles.length) {

        showProfile(
          profiles[0]
        );

      } else {

        showEmpty();

      }

    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        "No se pudo guardar la acción."
      );
    }
  }

  async function createMatch(targetId) {

    try {

      /* Buscar Match existente */

      const {
        data: direct
      } = await db
        .from("matches")
        .select("id")
        .eq(
          "user1_id",
          currentUser.id
        )
        .eq(
          "user2_id",
          targetId
        )
        .maybeSingle();

      const {
        data: reverse
      } = await db
        .from("matches")
        .select("id")
        .eq(
          "user1_id",
          targetId
        )
        .eq(
          "user2_id",
          currentUser.id
        )
        .maybeSingle();

      if (!direct && !reverse) {

        const {
          error: matchError
        } = await db
          .from("matches")
          .insert({
            user1_id:
              currentUser.id,
            user2_id:
              targetId
          });

        if (matchError) {

          console.error(
            "Crear Match:",
            matchError
          );

          return;
        }
      }

      $("matchPhoto").src =
        currentProfile.foto_url ||
        "https://placehold.co/200x200?text=💕";

      $("matchModal")
        .classList
        .add("open");

      $("chatButton").onclick =
        () => {

          window.location.href =
            "conversacion.html?user=" +
            encodeURIComponent(
              targetId
            );

        };

    } catch (error) {

      console.error(
        "Match:",
        error
      );
    }
  }

  async function blockUser() {

    if (!currentProfile)
      return;

    if (
      !confirm(
        "¿Querés bloquear este perfil?"
      )
    ) {
      return;
    }

    try {

      const {
        error
      } = await db
        .from("user_blocks")
        .insert({
          user_id:
            currentUser.id,
          blocked_user_id:
            currentProfile.id
        });

      if (error) {

        throw new Error(
          "No se pudo bloquear: " +
          error.message
        );
      }

      profiles.shift();

      if (profiles.length) {

        showProfile(
          profiles[0]
        );

      } else {

        showEmpty();

      }

    } catch (error) {

      console.error(error);

      showError(
        error.message
      );
    }
  }

  /* FILTROS */

  $("filterButton").addEventListener(
    "click",
    () => {

      $("filters")
        .classList
        .toggle("open");

    }
  );

  $("applyFilters").addEventListener(
    "click",
    loadProfiles
  );

  /* PASS */

  $("passButton").addEventListener(
    "click",
    () => saveSwipe("pass")
  );

  /* LIKE */

  $("likeButton").addEventListener(
    "click",
    () => saveSwipe("like")
  );

  /* INFO */

  $("infoButton").addEventListener(
    "click",
    () => {

      if (!currentProfile)
        return;

      alert(
        `${currentProfile.nombre || "Usuario"}\n\n` +
        `${currentProfile.descripcion || "Sin descripción."}`
      );

    }
  );

  /* BLOQUEAR */

  $("blockButton").addEventListener(
    "click",
    blockUser
  );

  /* CERRAR MATCH */

  $("continueButton").addEventListener(
    "click",
    () => {

      $("matchModal")
        .classList
        .remove("open");

    }
  );

  /* INICIO */

  async function init() {

    try {

      const {
        data,
        error
      } = await db.auth.getSession();

      if (error) {

        throw new Error(
          "Sesión: " +
          error.message
        );
      }

      currentUser =
        data.session?.user;

      if (!currentUser) {

        window.location.href =
          "index.html";

        return;
      }

      await loadProfiles();

    } catch (error) {

      console.error(error);

      status.textContent =
        "No se pudo iniciar Descubrir.";

      showError(
        error.message
      );
    }
  }

  init();

})();
</script>

<script src="assets/js/app.js"></script>
<script src="assets/js/components.js"></script>

</body>
  </html>
