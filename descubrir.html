<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #071a3d, #123b78);
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      opacity: .9;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .volver {
      display: block;
      text-decoration: none;
      background: white;
      color: #123b78;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .filtros {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    .filtros h2 {
      margin-top: 0;
      color: #123b78;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .fila {
      display: flex;
      gap: 10px;
    }

    .fila > div {
      flex: 1;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }

    .check input {
      width: auto;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
      font-size: 15px;
    }

    .btn-principal {
      width: 100%;
      background: #123b78;
      color: white;
      margin-top: 15px;
    }

    .btn-limpiar {
      width: 100%;
      background: #eee;
      color: #333;
      margin-top: 8px;
    }

    #estado {
      text-align: center;
      padding: 18px;
      font-weight: bold;
    }

    .error {
      background: #ffe8e8;
      color: #a40000;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
      margin-bottom: 20px;
    }

    .foto {
      width: 100%;
      height: 360px;
      object-fit: cover;
      background: #ddd;
    }

    .contenido {
      padding: 18px;
    }

    .nombre {
      font-size: 25px;
      font-weight: bold;
      color: #123b78;
    }

    .ciudad {
      color: #666;
      margin-top: 5px;
    }

    .descripcion {
      margin-top: 12px;
      line-height: 1.5;
    }

    .intereses {
      margin-top: 12px;
      color: #555;
    }

    .acciones {
      display: flex;
      gap: 12px;
      padding: 0 18px 18px;
    }

    .btn-pasar {
      flex: 1;
      background: #eee;
    }

    .btn-like {
      flex: 1;
      background: #d4af37;
      color: white;
    }

    .online {
      display: inline-block;
      background: #e2f8e8;
      color: #16833b;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 13px;
      margin-top: 10px;
    }

    .offline {
      display: inline-block;
      background: #eee;
      color: #666;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 13px;
      margin-top: 10px;
    }

    .sin-resultados {
      background: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .match {
      background: linear-gradient(135deg, #071a3d, #123b78);
      color: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 20px;
    }

    .match button {
      background: #d4af37;
      color: white;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>🔎 Descubrir</h1>
  <p>Encontrá personas compatibles con vos</p>
</header>

<div class="container">

  <a href="perfil.html" class="volver">
    ← Volver a mi perfil
  </a>

  <div class="filtros">

    <h2>🎯 Filtrar perfiles</h2>

    <div class="fila">

      <div>
        <label>Edad mínima</label>
        <input
          type="number"
          id="edadMin"
          value="18"
          min="18"
          max="100"
        >
      </div>

      <div>
        <label>Edad máxima</label>
        <input
          type="number"
          id="edadMax"
          value="80"
          min="18"
          max="100"
        >
      </div>

    </div>

    <label>📍 Ciudad</label>

    <input
      type="text"
      id="ciudadFiltro"
      placeholder="Ej: Buenos Aires"
    >

    <label>❤️ Intereses</label>

    <input
      type="text"
      id="interesesFiltro"
      placeholder="Ej: fútbol, música, viajes"
    >

    <div class="check">

      <input
        type="checkbox"
        id="soloOnline"
      >

      <label
        for="soloOnline"
        style="margin:0;"
      >
        🟢 Mostrar solamente personas online
      </label>

    </div>

    <button
      class="btn-principal"
      onclick="aplicarFiltros()"
    >
      🔎 Aplicar filtros
    </button>

    <button
      class="btn-limpiar"
      onclick="limpiarFiltros()"
    >
      🧹 Limpiar
    </button>

  </div>

  <div id="estado">
    ⏳ Cargando EmiMatch...
  </div>

  <div id="resultado"></div>

</div>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

let supabaseClient;

let usuarioActual = null;

let perfiles = [];

let indiceActual = 0;


/* =========================
   INICIAR SUPABASE
========================= */

function iniciarSupabase() {

  if (
    typeof window.supabase === "undefined"
  ) {

    mostrarError(
      "No se pudo cargar Supabase. Revisá tu conexión a Internet."
    );

    return false;
  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  return true;
}


/* =========================
   MOSTRAR ERROR
========================= */

function mostrarError(mensaje) {

  document.getElementById("estado").innerHTML =
    "";

  document.getElementById("resultado").innerHTML =

    `<div class="error">
      ❌ ${mensaje}
    </div>`;

}


/* =========================
   INICIO
========================= */

async function iniciarEmiMatch() {

  try {

    document.getElementById("estado").innerHTML =
      "⏳ Verificando sesión...";


    if (!iniciarSupabase()) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      mostrarError(
        "Error al verificar la sesión: " +
        error.message
      );

      return;
    }


    if (!data.session) {

      document.getElementById("estado").innerHTML =
        "";

      document.getElementById("resultado").innerHTML =

        `<div class="error">
          🔐 Tenés que iniciar sesión para descubrir perfiles.
          <br><br>
          <a href="index.html">
            Iniciar sesión
          </a>
        </div>`;

      return;
    }


    usuarioActual =
      data.session.user;


    document.getElementById("estado").innerHTML =
      "⏳ Cargando perfiles...";


    await cargarPerfiles();

  }

  catch (error) {

    console.error(error);

    mostrarError(
      "Error inesperado: " +
      error.message
    );

  }

}


/* =========================
   CARGAR PERFILES
========================= */

async function cargarPerfiles() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .neq("id", usuarioActual.id);


    if (error) {

      console.error(error);

      mostrarError(
        "No se pudieron cargar los perfiles: " +
        error.message
      );

      return;
    }


    perfiles = data || [];


    /* =========================
       BLOQUEADOS
    ========================= */

    const {
      data: bloqueos,
      error: errorBloqueos
    } =
      await supabaseClient
        .from("user_blocks")
        .select("blocker_id, blocked_id");


    if (!errorBloqueos && bloqueos) {

      const bloqueados =
        new Set();

      bloqueos.forEach(b => {

        if (
          b.blocker_id === usuarioActual.id
        ) {

          bloqueados.add(
            b.blocked_id
          );

        }

        if (
          b.blocked_id === usuarioActual.id
        ) {

          bloqueados.add(
            b.blocker_id
          );

        }

      });


      perfiles =
        perfiles.filter(
          p => !bloqueados.has(p.id)
        );

    }


    /* =========================
       SWIPES
    ========================= */

    const {
      data: swipes,
      error: errorSwipes
    } =
      await supabaseClient
        .from("swipes")
        .select(
          "target_user_id, action"
        )
        .eq(
          "user_id",
          usuarioActual.id
        );


    if (!errorSwipes && swipes) {

      const yaVistos =
        new Set(
          swipes.map(
            s => s.target_user_id
          )
        );


      perfiles =
        perfiles.filter(
          p => !yaVistos.has(p.id)
        );

    }


    indiceActual = 0;

    aplicarFiltros();

  }

  catch (error) {

    console.error(error);

    mostrarError(
      "Error cargando perfiles: " +
      error.message
    );

  }

}


/* =========================
   FILTROS
========================= */

function aplicarFiltros() {

  if (!perfiles.length) {

    mostrarSinResultados(
      "No hay perfiles disponibles."
    );

    return;
  }


  const edadMin =
    parseInt(
      document.getElementById(
        "edadMin"
      ).value
    ) || 18;


  const edadMax =
    parseInt(
      document.getElementById(
        "edadMax"
      ).value
    ) || 100;


  const ciudad =
    document.getElementById(
      "ciudadFiltro"
    ).value
      .trim()
      .toLowerCase();


  const intereses =
    document.getElementById(
      "interesesFiltro"
    ).value
      .trim()
      .toLowerCase();


  const soloOnline =
    document.getElementById(
      "soloOnline"
    ).checked;


  const filtrados =
    perfiles.filter(p => {

      const edad =
        Number(p.edad) || 0;


      if (
        edad < edadMin ||
        edad > edadMax
      ) {

        return false;

      }


      if (
        ciudad &&
        !String(
          p.ciudad || ""
        )
        .toLowerCase()
        .includes(ciudad)
      ) {

        return false;

      }


      if (intereses) {

        const textoIntereses =
          String(
            p.intereses || ""
          )
          .toLowerCase();


        if (
          !textoIntereses.includes(
            intereses
          )
        ) {

          return false;

        }

      }


      if (
        soloOnline &&
        p.online !== true
      ) {

        return false;

      }


      return true;

    });


  if (!filtrados.length) {

    mostrarSinResultados(
      "No encontramos perfiles con esos filtros."
    );

    return;

  }


  indiceActual = 0;

  mostrarPerfil(
    filtrados
  );

}


/* =========================
   MOSTRAR PERFIL
========================= */

function mostrarPerfil(lista) {

  if (
    indiceActual >=
    lista.length
  ) {

    mostrarSinResultados(
      "Ya viste todos los perfiles disponibles."
    );

    return;

  }


  const p =
    lista[indiceActual];


  const foto =
    p.foto_url ||
    "https://via.placeholder.com/600x600?text=EmiMatch";


  const estadoOnline =
    p.online === true
      ? `<span class="online">🟢 En línea</span>`
      : `<span class="offline">⚪ Desconectado</span>`;


  document.getElementById(
    "estado"
  ).innerHTML =
    `Perfil ${indiceActual + 1} de ${lista.length}`;


  document.getElementById(
    "resultado"
  ).innerHTML =

    `
    <div class="card">

      <img
        class="foto"
        src="${foto}"
        alt="Foto de ${p.nombre || "usuario"}"
        onerror="this.src='https://via.placeholder.com/600x600?text=EmiMatch'"
      >

      <div class="contenido">

        <div class="nombre">

          ${escapeHtml(
            p.nombre || "Sin nombre"
          )}

          ${p.edad
            ? ", " + escapeHtml(p.edad)
            : ""
          }

        </div>

        <div class="ciudad">

          📍 ${escapeHtml(
            p.ciudad || "Sin ciudad"
          )}

        </div>

        ${estadoOnline}

        <div class="descripcion">

          ${escapeHtml(
            p.descripcion ||
            "Sin descripción."
          )}

        </div>

        <div class="intereses">

          ❤️ ${escapeHtml(
            p.intereses ||
            "Sin intereses indicados."
          )}

        </div>

      </div>

      <div class="acciones">

        <button
          class="btn-pasar"
          onclick="pasar()"
        >
          ❌ Pasar
        </button>

        <button
          class="btn-like"
          onclick="darLike()"
        >
          ❤️ Me gusta
        </button>

      </div>

    </div>
    `;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(valor) {

  return String(valor)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================
   PASAR
========================= */

async function pasar() {

  await registrarSwipe(
    "pass"
  );

}


/* =========================
   LIKE
========================= */

async function darLike() {

  await registrarSwipe(
    "like"
  );

}


/* =========================
   REGISTRAR SWIPE
========================= */

async function registrarSwipe(
  accion
) {

  if (!usuarioActual) {
    return;
  }


  const tarjetas =
    document.querySelectorAll(
      ".card"
    );


  if (!tarjetas.length) {
    return;
  }


  const estadoAnterior =
    document.getElementById(
      "estado"
    ).innerHTML;


  document.getElementById(
    "estado"
  ).innerHTML =
    "⏳ Guardando...";


  const nombre =
    document.querySelector(
      ".nombre"
    )?.innerText || "";


  const perfilActual =
    perfiles[
      indiceActual
    ];


  if (!perfilActual) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("swipes")
      .upsert(
        {
          user_id:
            usuarioActual.id,

          target_user_id:
            perfilActual.id,

          action:
            accion
        },
        {
          onConflict:
            "user_id,target_user_id"
        }
      );


  if (error) {

    console.error(error);

    document.getElementById(
      "estado"
    ).innerHTML =
      estadoAnterior;

    mostrarError(
      "No se pudo guardar la acción: " +
      error.message
    );

    return;

  }


  if (
    accion === "like"
  ) {

    const {
      data: match
    } =
      await supabaseClient
        .from("matches")
        .select("id")
        .or(
          `and(user1_id.eq.${usuarioActual.id},user2_id.eq.${perfilActual.id}),and(user1_id.eq.${perfilActual.id},user2_id.eq.${usuarioActual.id})`
        )
        .limit(1);


    if (
      match &&
      match.length
    ) {

      mostrarMatch(
        perfilActual
      );

      return;

    }

  }


  indiceActual++;

  avanzar();

}


/* =========================
   SIGUIENTE
========================= */

function avanzar() {

  const ciudad =
    document.getElementById(
      "ciudadFiltro"
    ).value
      .trim()
      .toLowerCase();


  const intereses =
    document.getElementById(
      "interesesFiltro"
    ).value
      .trim()
      .toLowerCase();


  const edadMin =
    parseInt(
      document.getElementById(
        "edadMin"
      ).value
    ) || 18;


  const edadMax =
    parseInt(
      document.getElementById(
        "edadMax"
      ).value
    ) || 100;


  const soloOnline =
    document.getElementById(
      "soloOnline"
    ).checked;


  const filtrados =
    perfiles.filter(p => {

      const edad =
        Number(p.edad) || 0;


      if (
        edad < edadMin ||
        edad > edadMax
      ) {
        return false;
      }


      if (
        ciudad &&
        !String(
          p.ciudad || ""
        )
        .toLowerCase()
        .includes(ciudad)
      ) {
        return false;
      }


      if (
        intereses &&
        !String(
          p.intereses || ""
        )
        .toLowerCase()
        .includes(intereses)
      ) {
        return false;
      }


      if (
        soloOnline &&
        p.online !== true
      ) {
        return false;
      }


      return true;

    });


  mostrarPerfil(
    filtrados
  );

}


/* =========================
   MATCH
========================= */

function mostrarMatch(
  perfil
) {

  document.getElementById(
    "estado"
  ).innerHTML =
    "";

  document.getElementById(
    "resultado"
  ).innerHTML =

    `
    <div class="match">

      <h2>💕 ¡Es un Match!</h2>

      <p>
        Vos y
        <strong>
          ${escapeHtml(
            perfil.nombre || "esta persona"
          )}
        </strong>
        se gustan.
      </p>

      <button
        onclick="window.location.href='chat.html'"
      >
        💬 Ver mis Matches
      </button>

      <br>

      <button
        onclick="continuarDescubriendo()"
      >
        🔎 Seguir descubriendo
      </button>

    </div>
    `;

}


/* =========================
   CONTINUAR
========================= */

function continuarDescubriendo() {

  indiceActual++;

  avanzar();

}


/* =========================
   SIN RESULTADOS
========================= */

function mostrarSinResultados(
  mensaje
) {

  document.getElementById(
    "estado"
  ).innerHTML =
    "";

  document.getElementById(
    "resultado"
  ).innerHTML =

    `
    <div class="sin-resultados">

      <h2>🔎</h2>

      <p>
        ${escapeHtml(
          mensaje
        )}
      </p>

      <button
        class="btn-principal"
        onclick="limpiarFiltros()"
      >
        🧹 Limpiar filtros
      </button>

    </div>
    `;

}


/* =========================
   LIMPIAR FILTROS
========================= */

function limpiarFiltros() {

  document.getElementById(
    "edadMin"
  ).value = 18;


  document.getElementById(
    "edadMax"
  ).value = 80;


  document.getElementById(
    "ciudadFiltro"
  ).value = "";


  document.getElementById(
    "interesesFiltro"
  ).value = "";


  document.getElementById(
    "soloOnline"
  ).checked = false;


  indiceActual = 0;

  aplicarFiltros();

}


/* =========================
   INICIAR
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    iniciarEmiMatch();

  }
);

</script>

</body>
</html>
