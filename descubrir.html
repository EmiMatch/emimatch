<body>

<div class="contenedor">

  <div class="encabezado">
    <div>
      <div class="titulo">🔎 Descubrir</div>
      <div class="subtitulo">Encontrá nuevas personas</div>
    </div>

    <button class="boton-volver" onclick="volver()">
      ← Volver
    </button>
  </div>

  <div id="contenido">
    <div class="cargando">
      Cargando perfiles...
    </div>
  </div>

</div>

<script>

const SUPABASE_URL = "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let usuarioActual = null;
let perfiles = [];
let indiceActual = 0;


/* =========================
   INICIO
========================= */

async function iniciar() {

  try {

    const {
      data: { session },
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      mostrarMensaje("Error al comprobar la sesión.");
      return;
    }

    if (!session) {
      window.location.href = "./index.html";
      return;
    }

    usuarioActual = session.user;

    await cargarPerfiles();

  } catch (error) {

    console.error(error);

    mostrarMensaje(
      "Ocurrió un error al cargar Descubrir."
    );

  }
}


/* =========================
   CARGAR PERFILES
========================= */

async function cargarPerfiles() {

  const { data, error } = await supabaseClient
    .from("profiles")
    .select(`
      id,
      nombre,
      edad,
      ciudad,
      descripcion,
      foto_url,
      intereses
    `)
    .neq("id", usuarioActual.id)
    .order("created_at", { ascending: false });

  if (error) {

    console.error(error);

    mostrarMensaje(
      "No se pudieron cargar los perfiles."
    );

    return;
  }

  perfiles = data || [];

  indiceActual = 0;

  mostrarPerfil();

}


/* =========================
   MOSTRAR PERFIL
========================= */

function mostrarPerfil() {

  const contenido =
    document.getElementById("contenido");

  if (!perfiles.length) {

    contenido.innerHTML = `
      <div class="mensaje">

        💕<br><br>

        <strong>No hay más perfiles por ahora.</strong>

        <br><br>

        Volvé más tarde para descubrir nuevas personas.
