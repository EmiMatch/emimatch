<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #102c5c);
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 18px;
      text-align: center;
      background: rgba(0, 0, 0, 0.25);
    }

    header h1 {
      margin: 0;

    }

    header p {
      margin: 8px 0 0;

    .contenedor {
      width: 100%;

    .volver {
      width: 100%;
      border: 0;

    label {

      display: none;

      background: white;
      color: #111;

      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .menu-opciones button {
      width: 100%;
      border: 0;
      background: white;
      padding: 14px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .info {
      padding: 18px;
    }

    .nombre {
      font-size: 24px;
      font-weight: bold;
    }

    .datos {
      margin-top: 7px;
      color: #cbd6e8;
    }

    .descripcion {
      margin-top: 13px;
      line-height: 1.5;
      color: #edf1f8;
    }

    .intereses {
      margin-top: 13px;
      color: #d4af37;
      line-height: 1.5;
    }

    .online-badge,
    .offline-badge {
      display: inline-block;
      margin-top: 9px;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .online-badge {
      background: rgba(46,204,113,0.18);
      color: #5cff9b;
    }

    .offline-badge {
      background: rgba(255,255,255,0.12);
      color: #cbd6e8;
    }

    .acciones {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .accion {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .accion:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .like {
      background: #d4af37;
      color: #111;
    }

    .pass {
      background: #e74c3c;
      color: white;
    }

    .modal-fondo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: white;
      color: #111;
      border-radius: 18px;
      padding: 20px;
    }

    .modal h2 {
      margin-top: 0;
    }

    .modal select,
    .modal textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .modal textarea {
      min-height: 100px;
      resize: vertical;
    }

    .modal-botones {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .modal-botones button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancelar {
      background: #ddd;
    }

    .confirmar {
      background: #d4af37;
      color: #111;
    }

    @media (max-width: 500px) {
      .foto {
        height: 340px;
      }

      .fila {
        flex-direction: column;
        gap: 0;
      }

      .botones {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🔎 Descubrir</h1>
  <p>Encontrá personas compatibles con vos</p>
</header>

<div class="contenedor">

  <button
    class="volver"
    type="button"
    onclick="window.location.href='perfil.html'">
    ← Volver a mi perfil
  </button>

  <div class="filtros">

    <h2>🎯 Filtrar perfiles</h2>

    <div class="fila">

      <div>
        <label for="edadMin">Edad mínima</label>

        <input
          id="edadMin"
          type="number"
          min="18"
          max="100"
          value="18">
      </div>

      <div>
        <label for="edadMax">Edad máxima</label>

        <input
          id="edadMax"
          type="number"
          min="18"
          max="100"
          value="80">
      </div>

    </div>

    <label for="ciudad">📍 Ciudad</label>

    <input
      id="ciudad"
      type="text"
      placeholder="Buenos Aires">

    <label for="intereses">❤️ Intereses</label>

    <input
      id="intereses"
      type="text"
      placeholder="Ej: fútbol, música, viajes">

    <label class="online">

      <input
        id="soloOnline"
        type="checkbox">

      <span>
        🟢 Mostrar solamente personas online
      </span>

    </label>

    <div class="botones">

      <button
        id="btnAplicar"
        class="boton aplicar"
        type="button">
        🔎 Aplicar filtros
      </button>

      <button
        id="btnLimpiar"
        class="boton limpiar"
        type="button">
        🧹 Limpiar
      </button>

    </div>

  </div>

  <div id="estado" class="estado">
    ⏳ Cargando EmiMatch...
  </div>

  <div id="lista"></div>

</div>

<div
  id="modalFondo"
  class="modal-fondo">

  <div class="modal">

    <h2>⚠️ Denunciar usuario</h2>

    <p>
      Seleccioná el motivo de la denuncia.
    </p>

    <select id="motivo">

      <option value="Acoso">
        Acoso
      </option>

      <option value="Perfil falso">
        Perfil falso
      </option>

      <option value="Contenido inapropiado">
        Contenido inapropiado
      </option>

      <option value="Estafa">
        Estafa
      </option>

      <option value="Comportamiento ofensivo">
        Comportamiento ofensivo
      </option>

      <option value="Otro">
        Otro
      </option>

    </select>

    <textarea
      id="detalles"
      placeholder="Detalles adicionales (opcional)">
    </textarea>

    <div class="modal-botones">

      <button
        id="btnCancelar"
        class="cancelar"
        type="button">
        Cancelar

        id="btnDenunciar"

        Denunciar
      </button>

    </div>

  </div>

<script>

"use strict";

/* ===============================
   SUPABASE
================================ */

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

/* ===============================
   VARIABLES
================================ */

let usuarioActual = null;

let usuarioDenuncia = null;

/* ===============================
   ELEMENTOS
================================ */

const estado =
  document.getElementById("estado");

const lista =
  document.getElementById("lista");

const edadMinInput =
  document.getElementById("edadMin");

const edadMaxInput =
  document.getElementById("edadMax");

const ciudadInput =
  document.getElementById("ciudad");

const interesesInput =
  document.getElementById("intereses");

const soloOnlineInput =
  document.getElementById("soloOnline");

/* ===============================
   ESCAPAR HTML
================================ */

function escapeHTML(valor) {

  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

/* ===============================
   SESIÓN
================================ */

async function obtenerSesion() {

  const resultado =
    await supabaseClient.auth.getSession();

  if (resultado.error) {
    throw resultado.error;
  }

  const session =
    resultado.data?.session;

  if (!session) {

    window.location.href =
      "index.html";

    return null;
  }

  return session;
}

/* ===============================
   BLOQUEADOS
================================ */

async function obtenerBloqueados() {

  const resultado =
    await supabaseClient
      .from("user_blocks")
      .select(
        "blocker_id, blocked_id"
      )
      .or(
        `blocker_id.eq.${usuarioActual.id},blocked_id.eq.${usuarioActual.id}`
      );

  if (resultado.error) {
    throw resultado.error;
  }

  const bloqueados =
    new Set();

  (resultado.data || [])
    .forEach(row => {

      if (
        row.blocker_id ===
        usuarioActual.id
      ) {

        bloqueados.add(
          row.blocked_id
        );
      }

      if (
        row.blocked_id ===
        usuarioActual.id
      ) {

        bloqueados.add(
          row.blocker_id
        );
      }

    });

  return bloqueados;
}

/* ===============================
   CARGAR PERFILES
================================ */

async function cargarPerfiles() {

  estado.innerHTML =
    "⏳ Cargando perfiles...";

  lista.innerHTML = "";

  try {

    const session =
      await obtenerSesion();

    if (!session) {
      return;
    }

    usuarioActual =
      session.user;

    const bloqueados =
      await obtenerBloqueados();

    const resultadoSwipes =
      await supabaseClient
        .from("swipes")
        .select(
          "target_user_id"
        )
        .eq(
          "user_id",
          usuarioActual.id
        );

    if (resultadoSwipes.error) {
      throw resultadoSwipes.error;
    }

    const yaVistos =
      new Set(
        (resultadoSwipes.data || [])
          .map(
            row =>
              row.target_user_id
          )
      );

    const resultadoPerfiles =
      await supabaseClient
        .from("profiles")
        .select("*")
        .neq(
          "id",
          usuarioActual.id
        );

    if (resultadoPerfiles.error) {
      throw resultadoPerfiles.error;
    }

    let perfiles =
      resultadoPerfiles.data || [];

    const edadMin =
      Number(
        edadMinInput.value
      ) || 18;

    const edadMax =
      Number(
        edadMaxInput.value
      ) || 80;

    const ciudad =
      ciudadInput.value
        .trim()
        .toLowerCase();

    const intereses =
      interesesInput.value
        .trim()
        .toLowerCase();

    const soloOnline =
      soloOnlineInput.checked;

    const interesesBuscados =
      intereses
        .split(",")
        .map(
          item =>
            item.trim()
        )
        .filter(Boolean);

    perfiles =
      perfiles.filter(
        perfil => {

          if (
            bloqueados.has(
              perfil.id
            )
          ) {
            return false;
          }

          if (
            yaVistos.has(
              perfil.id
            )
          ) {
            return false;
          }

          const edad =
            Number(
              perfil.edad
            );

          if (
            Number.isFinite(edad)
          ) {

            if (
              edad < edadMin ||
              edad > edadMax
            ) {
              return false;
            }

          }

          if (ciudad) {

            const ciudadPerfil =
              String(
                perfil.ciudad || ""
              ).toLowerCase();

            if (
              !ciudadPerfil.includes(
                ciudad
              )
            ) {
              return false;
            }
          }

          if (
            interesesBuscados.length
          ) {

            const interesesPerfil =
              String(
                perfil.intereses || ""
              ).toLowerCase();

            const coincide =
              interesesBuscados.some(
                interes =>
                  interesesPerfil.includes(
                    interes
                  )
              );

            if (!coincide) {
              return false;
            }
          }

          if (
            soloOnline &&
            perfil.online !== true
          ) {
            return false;
          }

          return true;

        }
      );

    estado.innerHTML = "";

    if (
      perfiles.length === 0
    ) {

      estado.innerHTML = `
        💕 <strong>
        No encontramos perfiles nuevos.
        </strong>

        <br><br>

        Probá cambiar los filtros
        o volvé más tarde.
      `;

      return;
    }

    perfiles.forEach(
      perfil =>
        crearCard(perfil)
    );

  } catch (error) {

    console.error(
      "EMIMATCH ERROR:",
      error
    );

    estado.innerHTML = `
      <div class="error">

        ❌ <strong>
        No se pudieron cargar
        los perfiles.
        </strong>

        <br><br>

        ${escapeHTML(
          error?.message ||
          "Error desconocido."
        )}

      </div>
    `;
  }
}

/* ===============================
   CREAR TARJETA
================================ */

function crearCard(perfil) {

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "card";

  card.dataset.userId =
    perfil.id;

  const foto =
    perfil.foto_url ||
    "https://via.placeholder.com/600x600?text=EmiMatch";

  const nombre =
    perfil.nombre ||
    "Usuario";

  const edad =
    perfil.edad
      ? `, ${perfil.edad}`
      : "";

  const ciudad =
    perfil.ciudad ||
    "Ciudad no indicada";

  const descripcion =
    perfil.descripcion ||
    "Sin descripción.";

  const intereses =
    perfil.intereses ||
    "Sin intereses indicados.";

  const online =
    perfil.online === true;

  card.innerHTML = `

    <div class="menu">

      <button
        class="menu-btn"
        type="button"
        data-menu>
        ⋮
      </button>

      <div
        class="menu-opciones">

        <button
          type="button"
          data-bloquear>
          🚫 Bloquear usuario
        </button>

        <button
          type="button"
          data-denunciar>
          ⚠️ Denunciar usuario
        </button>

      </div>

    </div>

    <img
      class="foto"
      src="${escapeHTML(foto)}"
      alt="Foto de ${escapeHTML(nombre)}"
      onerror="
        this.onerror=null;
        this.src='https://via.placeholder.com/600x600?text=EmiMatch';
      ">

    <div class="info">

      <div class="nombre">

        ${escapeHTML(nombre)}
        ${escapeHTML(edad)}

      </div>

      <div class="datos">

        📍 ${escapeHTML(ciudad)}

      </div>

      ${
        online

        ? `
          <span class="online-badge">
            🟢 En línea
          </span>
        `

        : `
          <span class="offline-badge">
            ⚪ Desconectado
          </span>
        `
      }

      <div class="descripcion">

        ${escapeHTML(descripcion)}

      </div>

      <div class="intereses">

        ❤️ ${escapeHTML(intereses)}

      </div>

      <div class="acciones">

        <button
          type="button"
          class="accion pass"
          data-action="pass">

          ❌ Pasar

        </button>

        <button
          type="button"
          class="accion like"
          data-action="like">

          ❤️ Me gusta

        </button>

      </div>

    </div>

  `;

  lista.appendChild(card);
}

/* ===============================
   SWIPE
================================ */

async function registrarSwipe(
  targetUserId,
  action,
  boton
) {

  if (!usuarioActual) {

    alert(
      "La sesión todavía no está lista."
    );

    return;
  }

  boton.disabled = true;

  const resultado =
    await supabaseClient
      .from("swipes")
      .insert({

        user_id:
          usuarioActual.id,

        target_user_id:
          targetUserId,

        action:
          action

      });

  if (
    resultado.error &&
    resultado.error.code !== "23505"
  ) {

    console.error(
      resultado.error
    );

    alert(
      "No se pudo registrar la acción."
    );

    boton.disabled = false;

    return;
  }

  if (
    action === "like"
  ) {

    const match =
      await supabaseClient
        .from("matches")
        .select("id")
        .or(
          `and(user1_id.eq.${usuarioActual.id},user2_id.eq.${targetUserId}),and(user1_id.eq.${targetUserId},user2_id.eq.${usuarioActual.id})`
        )
        .limit(1);

    if (
      !match.error &&
      match.data &&
      match.data.length > 0
    ) {

      alert(
        "💕 ¡Es un Match!"
      );

    } else {

      alert(
        "❤️ Me gusta enviado."
      );

    }

  }

  const card =
    boton.closest(".card");

  if (card) {
    card.remove();
  }
}

/* ===============================
   BLOQUEAR
================================ */

async function bloquearUsuario(
  targetUserId,
  card
) {

  const confirmar =
    confirm(
      "¿Querés bloquear a este usuario?"
    );

  if (!confirmar) {
    return;
  }

  const resultado =
    await supabaseClient
      .from("user_blocks")
      .insert({

        blocker_id:
          usuarioActual.id,

        blocked_id:
          targetUserId

      });

  if (
    resultado.error &&
    resultado.error.code !== "23505"
  ) {

    alert(
      "No se pudo bloquear:\n" +
      resultado.error.message
    );

    return;
  }

  card.remove();

  alert(
    "🚫 Usuario bloqueado."
  );
}

/* ===============================
   DENUNCIA
=============================
