<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
    }

    .subtitulo {
      text-align: center;
      color: #dbeafe;
      margin-bottom: 20px;
    }

    .boton-volver {
      display: block;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 18px;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .card {
      background: white;
      color: #111827;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .foto {
      width: 100%;
      height: 420px;
      object-fit: cover;
      background: #e5e7eb;
      display: block;
    }

    .sin-foto {
      width: 100%;
      height: 420px;
      background: linear-gradient(135deg, #dbeafe, #e5e7eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
    }

    .datos {
      padding: 22px;
    }

    .nombre {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .info {
      color: #4b5563;
      margin: 6px 0;
      font-size: 16px;
    }

    .descripcion {
      margin-top: 16px;
      line-height: 1.5;
    }

    .intereses {
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      background: #f3f4f6;
      color: #374151;
    }

    .acciones {
      display: flex;
      gap: 15px;
      padding: 20px;
      background: #f9fafb;
    }

    .accion {
      flex: 1;
      border: none;
      border-radius: 50px;
      padding: 16px;
      font-size: 25px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .accion:active {
      transform: scale(0.94);
    }

    .pasar {
      background: #e5e7eb;
    }

    .like {
      background: #fee2e2;
    }

    .mensaje {
      text-align: center;
      padding: 35px 20px;
      background: white;
      color: #111827;
      border-radius: 24px;
      font-size: 18px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    .cargando {
      text-align: center;
      padding: 50px 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>🔎 Descubrir</h1>

  <div class="subtitulo">
    Encontrá nuevas personas
  </div>

  <button class="boton-volver" onclick="volver()">
    ← Volver
  </button>

  <div id="contenido">
    <div class="cargando">
      Cargando perfiles...
    </div>
  </div>

  <div id="error" class="error"></div>

</div>

<script>

const SUPABASE_URL = "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;
let perfiles = [];
let indice = 0;
let procesando = false;


/* =========================
   INICIAR
========================= */

async function iniciar() {

  try {

    const {
      data: { session },
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      mostrarError(sessionError.message);
      return;
    }

    if (!session) {
      window.location.href = "./index.html";
      return;
    }

    usuarioActual = session.user;

    await cargarPerfiles();

  } catch (error) {

    console.error(error);

    mostrarError(
      "No se pudo iniciar Descubrir."
    );

  }

}


/* =========================
   CARGAR PERFILES
========================= */

async function cargarPerfiles() {

  const { data, error } = await supabaseClient
    .from("profiles")
    .select(`
      id,
      nombre,
      edad,
      ciudad,
      descripcion,
      foto_url,
      intereses,
      created_at
    `)
    .neq("id", usuarioActual.id)
    .order("created_at", {
      ascending: false
    });

  if (error) {

    console.error(error);

    mostrarError(
      "No se pudieron cargar los perfiles: " +
      error.message
    );

    return;
  }

  perfiles = data || [];

  /*
    Quitamos perfiles que ya fueron
    marcados como like o pass.
  */

  await filtrarPerfilesYaVistos();

  indice = 0;

  mostrarPerfil();

}


/* =========================
   FILTRAR PERFILES VISTOS
========================= */

async function filtrarPerfilesYaVistos() {

  const {
    data,
    error
  } = await supabaseClient
    .from("swipes")
    .select("target_user_id")
    .eq("user_id", usuarioActual.id);

  if (error) {

    console.error(
      "No se pudieron consultar swipes:",
      error
    );

    return;
  }

  const vistos = new Set(
    (data || []).map(
      item => item.target_user_id
    )
  );

  perfiles = perfiles.filter(
    perfil => !vistos.has(perfil.id)
  );

}


/* =========================
   MOSTRAR PERFIL
========================= */

function mostrarPerfil() {

  const contenido =
    document.getElementById("contenido");

  if (indice >= perfiles.length) {

    contenido.innerHTML = `
      <div class="mensaje">
        <div style="font-size:60px;">💕</div>

        <h2>No hay más perfiles</h2>

        <p>
          Por ahora viste todos los perfiles disponibles.
        </p>

        <button
          class="boton-volver"
          onclick="volver()"
          style="background:#1e3a8a;">
          Volver al perfil
        </button>
      </div>
    `;

    return;
  }

  const perfil = perfiles[indice];

  const foto = perfil.foto_url
    ? `
      <img
        class="foto"
        src="${escaparHTML(perfil.foto_url)}"
        alt="Foto de ${escaparHTML(perfil.nombre || "usuario")}"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      >

      <div
        class="sin-foto"
        style="display:none;">
        👤
      </div>
    `
    : `
      <div class="sin-foto">
        👤
      </div>
    `;

  contenido.innerHTML = `

    <div class="card">

      ${foto}

      <div class="datos">

        <div class="nombre">
          ${escaparHTML(perfil.nombre || "Usuario")}
          ${perfil.edad ? ", " + escaparHTML(perfil.edad) : ""}
        </div>

        ${
          perfil.ciudad
            ? `
              <div class="info">
                📍 ${escaparHTML(perfil.ciudad)}
              </div>
            `
            : ""
        }

        ${
          perfil.descripcion
            ? `
              <div class="descripcion">
                ${escaparHTML(perfil.descripcion)}
              </div>
            `
            : ""
        }

        ${
          perfil.intereses
            ? `
              <div class="intereses">
                ❤️ ${escaparHTML(perfil.intereses)}
              </div>
            `
            : ""
        }

      </div>

      <div class="acciones">

        <button
          class="accion pasar"
          onclick="pasarPerfil()"
          aria-label="Pasar">
          ❌
        </button>

        <button
          class="accion like"
          onclick="darLike()"
          aria-label="Me gusta">
          ❤️
        </button>

      </div>

    </div>

  `;

}


/* =========================
   LIKE
========================= */

async function darLike() {

  if (procesando) return;

  const perfil = perfiles[indice];

  if (!perfil || !usuarioActual) return;

  procesando = true;

  try {

    const { error } =
      await supabaseClient
        .from("swipes")
        .insert({
          user_id: usuarioActual.id,
          target_user_id: perfil.id,
          action: "like"
        });

    if (error) {

      console.error(error);

      mostrarError(
        "No se pudo registrar el ❤️: " +
        error.message
      );

      procesando = false;
      return;
    }

    indice++;

    mostrarPerfil();

  } catch (error) {

    console.error(error);

    mostrarError(
      "Ocurrió un error al registrar el Like."
    );

  }

  procesando = false;

}


/* =========================
   PASAR
========================= */

async function pasarPerfil() {

  if (procesando) return;

  const perfil = perfiles[indice];

  if (!perfil || !usuarioActual) return;

  procesando = true;

  try {

    const { error } =
      await supabaseClient
        .from("swipes")
        .insert({
          user_id: usuarioActual.id,
          target_user_id: perfil.id,
          action: "pass"
        });

    if (error) {

      console.error(error);

      mostrarError(
        "No se pudo registrar la acción: " +
        error.message
      );

      procesando = false;
      return;
    }

    indice++;

    mostrarPerfil();

  } catch (error) {

    console.error(error);

    mostrarError(
      "Ocurrió un error al pasar el perfil."
    );

  }

  procesando = false;

}


/* =========================
   ESCAPAR HTML
========================= */

function escaparHTML(valor) {

  return String(valor)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================
   ERROR
========================= */

function mostrarError(mensaje) {

  const elemento =
    document.getElementById("error");

  elemento.textContent = mensaje;

  elemento.style.display = "block";

}


/* =========================
   VOLVER
========================= */

function volver() {

  window.location.href =
    "./perfil.html";

}


/* =========================
   INICIAR
========================= */

iniciar();

</script>

</body>
</html>
