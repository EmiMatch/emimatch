<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #102b55);
      color: white;
      padding: 20px;
    }

    .contenedor {
      max-width: 430px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
    }

    .subtitulo {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .volver {
      display: inline-block;
      color: white;
      text-decoration: none;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .card {
      background: white;
      color: #172033;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .foto {
      width: 100%;
      height: 390px;
      object-fit: cover;
      display: block;
      background: #e5e7eb;
    }

    .sinFoto {
      height: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e5e7eb;
      color: #64748b;
      font-size: 70px;
    }

    .info {
      padding: 20px;
    }

    .nombre {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .datos {
      color: #64748b;
      margin-bottom: 12px;
    }

    .descripcion {
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .intereses {
      color: #475569;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .botones {
      display: flex;
      gap: 12px;
      padding: 0 20px 20px;
    }

    button {
      flex: 1;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .pasar {
      background: #e5e7eb;
      color: #334155;
    }

    .like {
      background: #ec4899;
      color: white;
    }

    .reiniciar {
      width: 100%;
      margin-top: 18px;
      background: #d4af37;
      color: #07152f;
    }

    .mensaje {
      text-align: center;
      padding: 30px 15px;
      background: rgba(255,255,255,.08);
      border-radius: 20px;
      line-height: 1.6;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .volverPerfil {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: white;
      text-decoration: none;
    }

    .cargando {
      text-align: center;
      padding: 40px;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <a class="volver" href="./perfil.html">← Volver</a>

  <h1>🔎 Descubrir</h1>
  <div class="subtitulo">Encontrá nuevas personas</div>

  <div id="contenido">
    <div class="cargando">
      Cargando perfiles...
    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let usuarioActual = null;
let perfiles = [];
let indiceActual = 0;


// ================================
// INICIAR
// ================================

async function iniciar() {

  const {
    data: { session },
    error
  } = await supabaseClient.auth.getSession();

  if (error || !session) {
    window.location.replace("./index.html");
    return;
  }

  usuarioActual = session.user;

  await cargarPerfiles();
}


// ================================
// CARGAR PERFILES
// ================================

async function cargarPerfiles() {

  const contenido =
    document.getElementById("contenido");

  contenido.innerHTML =
    `<div class="cargando">Cargando perfiles...</div>`;

  const { data: todos, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .neq("id", usuarioActual.id)
      .order("created_at", { ascending: false });

  if (error) {

    contenido.innerHTML = `
      <div class="mensaje">
        <div class="emoji">⚠️</div>
        <h2>Error</h2>
        <p>No se pudieron cargar los perfiles.</p>
      </div>
    `;

    console.error(error);
    return;
  }


  const { data: swipes, error: errorSwipes } =
    await supabaseClient
      .from("swipes")
      .select("target_user_id")
      .eq("user_id", usuarioActual.id);


  if (errorSwipes) {

    console.error(errorSwipes);

    perfiles = todos || [];

  } else {

    const vistos = new Set(
      (swipes || []).map(
        s => s.target_user_id
      )
    );

    perfiles = (todos || []).filter(
      perfil => !vistos.has(perfil.id)
    );
  }


  indiceActual = 0;

  mostrarPerfil();
}


// ================================
// MOSTRAR PERFIL
// ================================

function mostrarPerfil() {

  const contenido =
    document.getElementById("contenido");

  if (indiceActual >= perfiles.length) {

    contenido.innerHTML = `

      <div class="mensaje">

        <div class="emoji">💕</div>

        <h2>No hay más perfiles</h2>

        <p>
          Por ahora viste todos los perfiles disponibles.
        </p>

        <button
          class="reiniciar"
          onclick="reiniciarPerfiles()">
          🔄 Reiniciar perfiles
        </button>

      </div>

      <a
        class="volverPerfil"
        href="./perfil.html">
        Volver al perfil
      </a>

    `;

    return;
  }


  const perfil = perfiles[indiceActual];


  let fotoHTML = "";

  if (perfil.foto_url) {

    fotoHTML = `
      <img
        class="foto"
        src="${escapeHTML(perfil.foto_url)}"
        alt="Foto de ${escapeHTML(perfil.nombre || "usuario")}"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      >

      <div
        class="sinFoto"
        style="display:none;">
        👤
      </div>
    `;

  } else {

    fotoHTML = `
      <div class="sinFoto">
        👤
      </div>
    `;
  }


  contenido.innerHTML = `

    <div class="card">

      ${fotoHTML}

      <div class="info">

        <div class="nombre">
          ${escapeHTML(perfil.nombre || "Sin nombre")}
          ${perfil.edad ? ", " + escapeHTML(perfil.edad) : ""}
        </div>

        ${
          perfil.ciudad
          ? `<div class="datos">
              📍 ${escapeHTML(perfil.ciudad)}
             </div>`
          : ""
        }

        ${
          perfil.descripcion
          ? `<div class="descripcion">
              ${escapeHTML(perfil.descripcion)}
             </div>`
          : ""
        }

        ${
          perfil.intereses
          ? `<div class="intereses">
              ❤️ ${escapeHTML(perfil.intereses)}
             </div>`
          : ""
        }

      </div>


      <div class="botones">

        <button
          class="pasar"
          onclick="pasarPerfil()">
          ❌ Pasar
        </button>

        <button
          class="like"
          onclick="darLike()">
          ❤️ Me gusta
        </button>

      </div>

    </div>

  `;
}


// ================================
// LIKE
// ================================

async function darLike() {

  if (!usuarioActual) return;

  const perfil =
    perfiles[indiceActual];

  if (!perfil) return;


  const { data: existente } =
    await supabaseClient
      .from("swipes")
      .select("id")
      .eq("user_id", usuarioActual.id)
      .eq("target_user_id", perfil.id)
      .maybeSingle();


  if (existente) {

    indiceActual++;
    mostrarPerfil();
    return;
  }


  const { error } =
    await supabaseClient
      .from("swipes")
      .insert({
        user_id: usuarioActual.id,
        target_user_id: perfil.id,
        action: "like"
      });


  if (error) {

    console.error(error);

    alert(
      "No se pudo registrar el Me gusta."
    );

    return;
  }


  indiceActual++;

  mostrarPerfil();
}


// ================================
// PASS
// ================================

async function pasarPerfil() {

  if (!usuarioActual) return;

  const perfil =
    perfiles[indiceActual];

  if (!perfil) return;


  const { data: existente } =
    await supabaseClient
      .from("swipes")
      .select("id")
      .eq("user_id", usuarioActual.id)
      .eq("target_user_id", perfil.id)
      .maybeSingle();


  if (!existente) {

    const { error } =
      await supabaseClient
        .from("swipes")
        .insert({
          user_id: usuarioActual.id,
          target_user_id: perfil.id,
          action: "pass"
        });


    if (error) {

      console.error(error);

      alert(
        "No se pudo registrar el perfil."
      );

      return;
    }
  }


  indiceActual++;

  mostrarPerfil();
}


// ================================
// REINICIAR
// ================================

async function reiniciarPerfiles() {

  if (!usuarioActual) return;


  const confirmar =
    confirm(
      "¿Querés volver a mostrar todos los perfiles?"
    );

  if (!confirmar) return;


  const { error } =
    await supabaseClient
      .from("swipes")
      .delete()
      .eq("user_id", usuarioActual.id);


  if (error) {

    console.error(error);

    alert(
      "No se pudieron reiniciar los perfiles."
    );

    return;
  }


  await cargarPerfiles();
}


// ================================
// SEGURIDAD HTML
// ================================

function escapeHTML(valor) {

  return String(valor)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


// ================================
// INICIAR APP
// ================================

iniciar();

</script>

</body>
</html>
