<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fb, #e8eef8);
      color: #1f2937;
    }

    header {
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      text-align: center;
      padding: 24px 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    .contenedor {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 15px;
    }

    .volver {
      display: block;
      text-decoration: none;
      color: #1e3a8a;
      font-weight: bold;
      margin: 5px 0 15px;
    }

    /* FILTROS */

    .filtros {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    .filtros h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .campo {
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .campo input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    .campo input:focus {
      border-color: #2563eb;
    }

    .fila {
      display: flex;
      gap: 10px;
    }

    .fila .campo {
      flex: 1;
    }

    .online-filtro {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: bold;
      margin: 10px 0 16px;
      cursor: pointer;
    }

    .online-filtro input {
      width: 20px;
      height: 20px;
    }

    .botones {
      display: flex;
      gap: 10px;
    }

    .boton {
      flex: 1;
      border: none;
      padding: 13px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:disabled {
      opacity: .6;
      cursor: wait;
    }

    .aplicar {
      background: #2563eb;
      color: white;
    }

    .limpiar {
      background: #e5e7eb;

    }

    .contador {
      text-align: center;
      font-weight: bold;
      color: #374151;
      margin: 15px 0;
    }

    /* CARD */

    .card {
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,.13);
      margin-bottom: 20px;
    }

    .foto {
      width: 100%;
      height: 390px;
      object-fit: cover;
      display: block;
      background: #e5e7eb;
    }

    .sin-foto {
      height: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      background: linear-gradient(135deg,#dbeafe,#e5e7eb);
    }

    .contenido {
      padding: 19px;
    }

    .cabecera-perfil {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .nombre {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .datos {
      color: #6b7280;
      margin-bottom: 10px;
    }

    .estado-online {
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .estado-offline {
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .descripcion {
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .intereses {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .acciones {
      display: flex;
      gap: 12px;
    }

    .accion {
      flex: 1;
      border: none;
      border-radius: 13px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .accion:disabled {
      opacity: .5;
    }

    .pasar {
      background: #fee2e2;
      color: #b91c1c;
    }

    .like {
      background: #dcfce7;
      color: #15803d;
    }

    /* MENU OPCIONES */

    .boton-opciones {
      border: none;
      background: #f3f4f6;
      color: #111827;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .menu-opciones {
      display: none;
      background: #f9fafb;
      border-radius: 13px;
      margin: 12px 0 15px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .menu-opciones.visible {
      display: block;
    }

    .opcion {
      width: 100%;
      border: none;
      background: transparent;
      padding: 14px;
      text-align: left;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .opcion:hover {
      background: #e5e7eb;
    }

    .opcion-bloquear {
      color: #b91c1c;
    }

    .opcion-denunciar {
      color: #92400e;
    }

    /* ESTADOS */

    .estado {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    .estado-icono {
      font-size: 55px;
      margin-bottom: 8px;
    }

    .estado h2 {
      margin: 8px 0;
    }

    .estado p {
      color: #6b7280;
      line-height: 1.5;
    }

    .reiniciar {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 13px;
      border-radius: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .error-detalle {
      background: #fff1f2;
      color: #9f1239;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-size: 13px;
      word-break: break-word;
      text-align: left;
    }

    .cargando {
      padding: 30px;
      text-align: center;
      font-weight: bold;
    }

    /* MODAL DENUNCIA */

    .modal-fondo {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0,0,0,.6);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-fondo.visible {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .modal h2 {
      margin-top: 0;
    }

    .motivo {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      margin: 12px 0;
      font-size: 15px;
    }

    .detalles-denuncia {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .modal-botones {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .modal-boton {
      flex: 1;
      border: none;
      padding: 13px;
      border-radius: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancelar {
      background: #e5e7eb;
      color: #111827;
    }

    .enviar-denuncia {
      background: #dc2626;
      color: white;
    }

    .modal-boton:disabled {
      opacity: .6;
    }

    @media (max-width: 500px) {

      .foto,
      .sin-foto {
        height: 330px;
      }

      .fila {
        flex-direction: column;
        gap: 0;
      }

    }
  </style>
</head>

<body>

<header>
  <h1>🔎 Descubrir</h1>
  <p>Encontrá personas compatibles con vos</p>
</header>

<div class="contenedor">

  <a href="perfil.html" class="volver">
    ← Volver a mi perfil
  </a>

  <!-- FILTROS -->

  <div class="filtros">

    <h2>🎯 Filtrar perfiles</h2>

    <div class="fila">

      <div class="campo">
        <label for="edadMin">
          Edad mínima
        </label>

        <input
          type="number"
          id="edadMin"
          min="18"
          max="100"
          value="18"
        >
      </div>

      <div class="campo">
        <label for="edadMax">
          Edad máxima
        </label>

        <input
          type="number"
          id="edadMax"
          min="18"
          max="100"
          value="80"
        >
      </div>

    </div>

    <div class="campo">

      <label for="ciudad">
        📍 Ciudad
      </label>

      <input
        type="text"
        id="ciudad"
        placeholder="Ej: Buenos Aires"
      >

    </div>

    <div class="campo">

      <label for="intereses">
        ❤️ Intereses
      </label>

      <input
        type="text"
        id="intereses"
        placeholder="Ej: fútbol, música, viajes"
      >

    </div>

    <label class="online-filtro">

      <input
        type="checkbox"
        id="soloOnline"
      >

      🟢 Mostrar solamente personas online

    </label>

    <div class="botones">

      <button
        id="btnAplicar"
        class="boton aplicar"
        type="button"
      >
        🔎 Aplicar filtros
      </button>

        id="btnLimpiar"
        class="boton limpiar"

      >
        🧹 Limpiar
      </button>

    </div>

  <div
    id="contador"
    class="contador"
  ></div>

  <div id="resultado">

    <div class="cargando">

  </div>

</div>


<!-- MODAL DENUNCIA -->

<div
  id="modalDenuncia"
  class="modal-fondo"
>

  <div class="modal">

    <h2>
      ⚠️ Denunciar usuario
    </h2>

    <p>
      Seleccioná el motivo de la denuncia.
    </p>

    <select
      id="motivoDenuncia"
      class="motivo"
    >

      <option value="">
        Seleccioná un motivo
      </option>

      <option value="Acoso">
        🚫 Acoso
      </option>

      <option value="Perfil falso">
        🤥 Perfil falso
      </option>

      <option value="Contenido inapropiado">
        ⚠️ Contenido inapropiado
      </option>

      <option value="Estafa">
        💰 Estafa
      </option>

        😡 Comportamiento ofensivo
      </option>

      <option value="Otro">
        📝 Otro
      </option>

    ></textarea>

        id="btnCancelarDenuncia"

        type="button"
      >
        Cancelar
      </button>

      <button
        id="btnEnviarDenuncia"

        type="button"
      >
        ⚠️ Enviar denuncia
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;

let perfiles = [];

let perfilesMostrados = [];

let usuarioParaDenunciar = null;


// ========================================
// INICIAR
// ========================================

async function iniciar() {

  try {

    const {
      data: {
        session
      },
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if (error) {
      throw error;
    }


    if (!session) {

      window.location.href =
        "index.html";

      return;
    }


    usuarioActual =
      session.user;


    await cargarPerfiles();


  } catch (error) {

    console.error(error);

    mostrarError(
      "No se pudo iniciar Descubrir.",
      error
    );

  }

}


// ========================================
// FILTROS
// ========================================

function obtenerFiltros() {

  let edadMin =
    parseInt(
      document.getElementById(
        "edadMin"
      ).value,
      10
    );


  let edadMax =
    parseInt(
      document.getElementById(
        "edadMax"
      ).value,
      10
    );


  const ciudad =
    document
      .getElementById("ciudad")
      .value
      .trim();


  const intereses =
    document
      .getElementById("intereses")
      .value
      .trim();


  const soloOnline =
    document
      .getElementById("soloOnline")
      .checked;


  if (
    isNaN(edadMin) ||
    edadMin < 18
  ) {
    edadMin = 18;
  }


  if (
    isNaN(edadMax) ||
    edadMax > 100
  ) {
    edadMax = 100;
  }


  return {
    edadMin,
    edadMax,
    ciudad,
    intereses,
    soloOnline
  };

}


// ========================================
// CARGAR PERFILES
// ========================================

async function cargarPerfiles() {

  const resultado =
    document.getElementById(
      "resultado"
    );


  const contador =
    document.getElementById(
      "contador"
    );


  resultado.innerHTML = `
    <div class="cargando">
      ⏳ Buscando perfiles...
    </div>
  `;


  contador.textContent = "";


  const filtros =
    obtenerFiltros();


  if (
    filtros.edadMin >
    filtros.edadMax
  ) {

    resultado.innerHTML = `
      <div class="estado">

        <div class="estado-icono">
          ⚠️
        </div>

        <h2>
          Rango de edad incorrecto
        </h2>

        <p>
          La edad mínima no puede ser
          mayor que la edad máxima.
        </p>

      </div>
    `;

    return;
  }


  try {

    // ====================================
    // SWIPES DEL USUARIO
    // ====================================

    const {
      data: swipes,
      error: errorSwipes
    } =
      await supabaseClient
        .from("swipes")
        .select(
          "target_user_id"
        )
        .eq(
          "user_id",
          usuarioActual.id
        );


    if (errorSwipes) {
      throw errorSwipes;
    }


    const vistos =
      new Set(
        (swipes || []).map(
          item =>
            item.target_user_id
        )
      );


    // ====================================
    // BLOQUEOS REALIZADOS
    // ====================================

    const {
      data: bloqueados,
      error: errorBloqueos
    } =
      await supabaseClient
        .from("user_blocks")
        .select(
          "blocked_id"
        )
        .eq(
          "blocker_id",
          usuarioActual.id
        );


    if (errorBloqueos) {
      throw errorBloqueos;
    }


    const idsBloqueados =
      new Set(
        (bloqueados || []).map(
          item =>
            item.blocked_id
        )
      );


    // ====================================
    // CONSULTA DE PERFILES
    // ====================================

    let consulta =
      supabaseClient
        .from("profiles")
        .select(`
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          intereses,
          online,
          last_seen
        `)
        .neq(
          "id",
          usuarioActual.id
        )
        .gte(
          "edad",
          filtros.edadMin
        )
        .lte(
          "edad",
          filtros.edadMax
        );


    // CIUDAD

    if (
      filtros.ciudad !== ""
    ) {

      consulta =
        consulta.ilike(
          "ciudad",
          `%${filtros.ciudad}%`
        );

    }


    // INTERESES

    if (
      filtros.intereses !== ""
    ) {

      consulta =
        consulta.ilike(
          "intereses",
          `%${filtros.intereses}%`
        );

    }


    // ONLINE

    if (
      filtros.soloOnline
    ) {

      consulta =
        consulta.eq(
          "online",
          true
        );

    }


    const {
      data,
      error
    } =
      await consulta;


    if (error) {
      throw error;
    }


    // ====================================
    // FILTRAR VISTOS Y BLOQUEADOS
    // ====================================

    perfiles =
      (data || []).filter(
        perfil => {

          const yaVisto =
            vistos.has(
              perfil.id
            );

          const estaBloqueado =
            idsBloqueados.has(
              perfil.id
            );

          return (
            !yaVisto &&
            !estaBloqueado
          );

        }
      );


    perfilesMostrados =
      [...perfiles];


    actualizarContador();

    mostrarPerfilActual();


  } catch (error) {

    console.error(
      "Error cargando perfiles:",
      error
    );


    mostrarError(
      "No se pudieron cargar los perfiles.",
      error
    );

  }

}


// ========================================
// MOSTRAR PERFIL
// ========================================

function mostrarPerfilActual() {

  const resultado =
    document.getElementById(
      "resultado"
    );


  if (
    !perfilesMostrados.length
  ) {

    resultado.innerHTML = `

      <div class="estado">

        <div class="estado-icono">
          💕
        </div>

        <h2>
          No encontramos más perfiles
        </h2>

        <p>
          Probá modificando los filtros
          para encontrar más personas.
        </p>

        <button
          id="btnReiniciar"
          class="reiniciar"
          type="button"
        >
          🔄 Reiniciar perfiles
        </button>

      </div>

    `;


    document
      .getElementById(
        "btnReiniciar"
      )
      .addEventListener(
        "click",
        reiniciarPerfiles
      );


    return;
  }


  const perfil =
    perfilesMostrados[0];


  resultado.innerHTML =
    crearCard(
      perfil
    );


  document
    .getElementById(
      "btnLike"
    )
    .addEventListener(
      "click",
      function() {

        darLike(
          perfil.id
        );

      }
    );


  document
    .getElementById(
      "btnPasar"
    )
    .addEventListener(
      "click",
      function() {

        pasar(
          perfil.id
        );

      }
    );


  document
    .getElementById(
      "btnOpciones"
    )
    .addEventListener(
      "click",
      function() {

        const menu =
          document.getElementById(
            "menuOpciones"
          );

        menu.classList.toggle(
          "visible"
        );

      }
    );


  document
    .getElementById(
      "btnBloquear"
    )
    .addEventListener(
      "click",
      function() {

        bloquearUsuario(
          perfil.id
        );

      }
    );


  document
    .getElementById(
      "btnDenunciar"
    )
    .addEventListener(
      "click",
      function() {

        abrirDenuncia(
          perfil.id
        );

      }
    );

}


// ========================================
// CREAR CARD
// ========================================

function crearCard(perfil) {

  let fotoHTML;


  if (
    perfil.foto_url
  ) {

    fotoHTML = `
      <img
        class="foto"
        src="${escaparHTML(
          perfil.foto_url
        )}"
        alt="Foto de perfil"
      >
    `;

  } else {

    fotoHTML = `
      <div class="sin-foto">
        👤
      </div>
    `;

  }


  const estadoHTML =
    perfil.online === true

      ? `
        <div class="estado-online">
          🟢 En línea
        </div>
      `

      : `
        <div class="estado-offline">
          ⚪ Desconectado
        </div>
      `;


  const datos = [];


  if (perfil.edad) {

    datos.push(
      `${perfil.edad} años`
    );

  }


  if (perfil.ciudad) {

    datos.push(
      escaparHTML(
        perfil.ciudad
      )
    );

  }


  return `

    <div class="card">

      ${fotoHTML}

      <div class="contenido">

        <div class="cabecera-perfil">

          <div>

            <div class="nombre">
              ${escaparHTML(
                perfil.nombre ||
                "Sin nombre"
              )}
            </div>

            <div class="datos">
              ${datos.join("
