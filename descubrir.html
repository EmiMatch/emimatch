<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EmiMatch · Descubrir</title>

  <meta
    name="description"
    content="Descubrí nuevos perfiles y conectá con personas en EmiMatch."
  >

  <meta
    name="theme-color"
    content="#06122b"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --azul: #06122b;
      --azul2: #102d59;
      --dorado: #d4af37;
      --dorado-claro: #f4df91;
      --blanco: #ffffff;
      --muted: #b8c4d8;
      --rosa: #e11d48;
      --rosa2: #be123c;
      --verde: #22c55e;
      --rojo: #ef4444;
      --card: #ffffff;
      --texto: #111827;
      --gris: #64748b;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 110px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: var(--blanco);

      background:
        radial-gradient(
          circle at top right,
          rgba(212,175,55,.16),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          var(--azul),
          var(--azul2)
        );
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      text-align: center;
      padding: 28px 16px 20px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      font-size: 30px;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .logo span {
      color: var(--dorado);
    }

    header p {
      margin: 8px 0 0;

      color: var(--muted);

      font-size: 14px;
    }

    /* =========================
       CONTENEDOR
    ========================= */

    .contenedor {
      width: calc(100% - 24px);
      max-width: 540px;

      margin: auto;
    }

    /* =========================
       FILTROS
    ========================= */

    .filtros {

      padding: 18px;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.11),
          rgba(255,255,255,.055)
        );

      border:
        1px solid
        rgba(255,255,255,.12);

      box-shadow:
        0 18px 45px
        rgba(0,0,0,.22);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .filtros-titulo {

      display: flex;
      align-items: center;

      gap: 9px;

      margin-bottom: 15px;
    }

    .filtros-titulo .icono {

      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        rgba(212,175,55,.15);

      font-size: 20px;
    }

    .filtros h3 {

      margin: 0;

      font-size: 17px;
    }

    .filtros-subtitulo {

      margin:
        -7px 0 15px 47px;

      color: var(--muted);

      font-size: 12px;
    }

    .fila {

      display: flex;

      gap: 10px;
    }

    .campo {
      flex: 1;
    }

    .campo-label {

      display: block;

      margin:
        0 0 6px 3px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 700;
    }

    input,
    select {

      width: 100%;
      height: 48px;

      border: 0;
      border-radius: 14px;

      padding: 0 14px;

      background:
        rgba(255,255,255,.96);

      color: #111827;

      font-size: 14px;

      outline: none;
    }

    input:focus,
    select:focus {

      box-shadow:
        0 0 0 3px
        rgba(212,175,55,.28);
    }

    .ciudad-wrapper {
      margin-top: 11px;
    }

    .btn-filtro {

      width: 100%;
      height: 49px;

      margin-top: 12px;

      border: 0;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--dorado),
          #f0cf62
        );

      color: var(--azul);

      font-size: 15px;
      font-weight: 900;

      box-shadow:
        0 8px 22px
        rgba(212,175,55,.20);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .btn-filtro:active {
      transform: scale(.98);
    }

    /* =========================
       CONTADOR
    ========================= */

    .contador {

      min-height: 18px;

      margin:
        16px 0 11px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }

    /* =========================
       ESTADOS
    ========================= */

    .cargando,
    .mensaje,
    .error {

      padding: 34px 22px;

      border-radius: 24px;

      margin-top: 18px;

      text-align: center;

      background:
        rgba(255,255,255,.08);

      border:
        1px solid
        rgba(255,255,255,.10);

      box-shadow:
        0 15px 40px
        rgba(0,0,0,.18);
    }

    .cargando {
      color: var(--muted);
    }

    .mensaje h2 {

      margin:
        12px 0 8px;

      font-size: 22px;
    }

    .mensaje p {

      margin: 0;

      color: var(--muted);

      line-height: 1.55;

      font-size: 14px;
    }

    .error {

      background:
        rgba(220,38,38,.16);

      border-color:
        rgba(239,68,68,.55);
    }

    .error h3 {

      margin: 0;

      font-size: 17px;
    }

    .error-detalle {

      margin-top: 11px;

      color: #fecaca;

      font-size: 12px;

      line-height: 1.5;

      word-break: break-word;
    }

    /* =========================
       TARJETA
    ========================= */

    .tarjeta {

      overflow: hidden;

      background:
        var(--card);

      color:
        var(--texto);

      border-radius:
        28px;

      box-shadow:
        0 25px 65px
        rgba(0,0,0,.38);

      animation:
        aparecer .25s ease;
    }

    @keyframes aparecer {

      from {
        opacity: 0;
        transform:
          translateY(10px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }

    }

    .foto-wrapper {

      position: relative;

      width: 100%;
      height: 455px;

      overflow: hidden;

      background:
        #e5e7eb;
    }

    .foto,
    .sin-foto {

      width: 100%;
      height: 100%;

      display: block;
    }

    .foto {

      object-fit:
        cover;
    }

    .sin-foto {

      display: flex;

      align-items: center;
      justify-content: center;

      background:

        radial-gradient(
          circle at 30% 20%,
          #f7e9a9,
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #c69d2c,
          #f4df91
        );

      font-size:
        86px;
    }

    .foto-overlay {

      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 150px;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,.62)
        );

      pointer-events: none;
    }

    .estado {

      position: absolute;

      top: 15px;
      right: 15px;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding:
        8px 11px;

      border-radius:
        999px;

      background:
        rgba(0,0,0,.56);

      color:
        white;

      font-size:
        11px;

      font-weight:
        800;

      backdrop-filter:
        blur(8px);
    }

    .estado-dot {

      width: 8px;
      height: 8px;

      border-radius:
        50%;

      background:
        #94a3b8;
    }

    .estado.online
    .estado-dot {

      background:
        var(--verde);

      box-shadow:
        0 0 0 3px
        rgba(34,197,94,.18);
    }

    .datos {

      padding:
        21px 20px 16px;
    }

    .nombre {

      font-size:
        27px;

      line-height:
        1.15;

      font-weight:
        900;

      letter-spacing:
        -.4px;
    }

    .info {

      display:
        flex;

      align-items:
        center;

      gap: 5px;

      margin-top:
        8px;

      color:
        var(--gris);

      font-size:
        13px;
    }

    .descripcion {

      margin-top:
        16px;

      color:
        #303846;

      font-size:
        14px;

      line-height:
        1.6;
    }

    .intereses {

      margin-top:
        14px;

      padding:
        11px 12px;

      border-radius:
        13px;

      background:
        #f8fafc;

      color:
        #173d7a;

      font-size:
        13px;

      font-weight:
        700;

      line-height:
        1.45;
    }

    /* =========================
       ACCIONES
    ========================= */

    .acciones {

      display:
        flex;

      gap:
        14px;

      padding:
        2px 20px 18px;
    }

    .acciones button {

      width:
        50%;

      height:
        58px;

      border:
        0;

      border-radius:
        18px;

      font-size:
        25px;

      font-weight:
        900;

      transition:
        transform .12s ease,
        box-shadow .12s ease;
    }

    .acciones button:active {

      transform:
        scale(.94);
    }

    .btn-no {

      background:
        #f1f5f9;

      color:
        #334155;

      box-shadow:
        inset 0 0 0 1px
        #e2e8f0;
    }

    .btn-si {

      background:
        linear-gradient(
          135deg,
          var(--rosa),
          var(--rosa2)
        );

      color:
        white;

      box-shadow:
        0 9px 22px
        rgba(225,29,72,.25);
    }

    .acciones button::after {

      display:
        block;

      margin-top:
        -2px;

      font-size:
        10px;

      font-weight:
        700;

      opacity:
        .72;
    }

    .btn-no::after {
      content:
        "Pasar";
    }

    .btn-si::after {
      content:
        "Me gusta";
    }

    /* =========================
       BLOQUEAR
    ========================= */

    .btn-bloquear {

      display:
        block;

      width:
        calc(100% - 40px);

      margin:
        0 20px 20px;

      height:
        43px;

      border:
        1px solid
        #fecaca;

      border-radius:
        13px;

      background:
        #fff7f8;

      color:
        var(--rosa2);

      font-size:
        13px;

      font-weight:
        800;
    }

    .btn-bloquear:active {

      transform:
        scale(.98);
    }

    /* =========================
       TOAST
    ========================= */

    .toast {

      position:
        fixed;

      left:
        50%;

      bottom:
        94px;

      display:
        none;

      z-index:
        1200;

      transform:
        translateX(-50%);

      width:
        max-content;

      max-width:
        calc(100% - 30px);

      padding:
        13px 19px;

      border-radius:
        15px;

      background:
        #111827;

      color:
        white;

      font-size:
        14px;

      font-weight:
        700;

      text-align:
        center;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.35);
    }

    /* =========================
       NAVEGACIÓN
    ========================= */

    .nav {

      position:
        fixed;

      left:
        9px;

      right:
        9px;

      bottom:
        9px;

      height:
        68px;

      padding:
        0 4px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-around;

      z-index:
        1000;

      background:
        rgba(5,17,38,.97);

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius:
        23px;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,.48);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);
    }

    .nav a {

      position:
        relative;

      min-width:
        54px;

      color:
        #aebbd0;

      text-decoration:
        none;

      text-align:
        center;

      font-size:
        10px;

      font-weight:
        600;
    }

    .nav a span {

      display:
        block;

      margin-bottom:
        3px;

      font-size:
        21px;

      transition:
        transform .15s ease;
    }

    .nav a.activo {

      color:
        var(--dorado);
    }

    .nav a.activo span {

      transform:
        translateY(-1px)
        scale(1.08);
    }

    .badge {

      position:
        absolute;

      top:
        -5px;

      right:
        1px;

      display:
        none;

      align-items:
        center;

      justify-content:
        center;

      min-width:
        18px;

      height:
        18px;

      padding:
        0 4px;

      border-radius:
        999px;

      background:
        var(--rojo);

      color:
        white;

      font-size:
        9px;

      font-weight:
        900;

      border:
        2px solid
        #06122b;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (min-width: 700px) {

      .contenedor {
        max-width:
          560px;
      }

      .foto-wrapper {
        height:
          500px;
      }

    }

    @media (max-width: 380px) {

      header {
        padding-top:
          23px;
      }

      .logo {
        font-size:
          27px;
      }

      .contenedor {
        width:
          calc(100% - 18px);
      }

      .filtros {
        padding:
          15px;
      }

      .foto-wrapper {
        height:
          365px;
      }

      .nombre {
        font-size:
          24px;
      }

      .acciones button {
        height:
          54px;
      }

      .nav a {
        min-width:
          47px;

        font-size:
          9px;
      }

      .nav a span {
        font-size:
          19px;
      }

    }

  </style>

</head>

<body>

<header>

  <div class="logo">
    💕 <span>EmiMatch</span>
  </div>

  <p>
    Descubrí nuevas personas y conectá
  </p>

</header>


<main class="contenedor">

  <section class="filtros">

    <div class="filtros-titulo">

      <div class="icono">
        🎯
      </div>

      <div>
        <h3>
          Buscar perfiles
        </h3>
      </div>

    </div>


    <div class="filtros-subtitulo">
      Personalizá tu búsqueda
    </div>


    <div class="fila">

      <div class="campo">

        <label class="campo-label">
          EDAD MÍNIMA
        </label>

        <input
          id="edadMin"
          type="number"
          min="18"
          max="100"
          placeholder="18"
        >

      </div>


      <div class="campo">

        <label class="campo-label">
          EDAD MÁXIMA
        </label>

        <input
          id="edadMax"
          type="number"
          min="18"
          max="100"
          placeholder="100"
        >

      </div>

    </div>


    <div class="ciudad-wrapper">

      <label class="campo-label">
        CIUDAD
      </label>

      <select id="ciudad">

        <option value="">
          Todas las ciudades
        </option>

      </select>

    </div>


    <button
      id="btnFiltros"
      class="btn-filtro"
    >
      🔎 Aplicar filtros
    </button>

  </section>


  <div
    id="contador"
    class="contador"
  ></div>


  <div id="contenido">

    <div class="cargando">
      🔐 Verificando sesión...
    </div>

  </div>

</main>


<div
  id="toast"
  class="toast"
></div>


<nav class="nav">

  <a href="perfil.html">

    <span>
      👤
    </span>

    Perfil

  </a>


  <a
    href="descubrir.html"
    class="activo"
  >

    <span>
      🔎
    </span>

    Descubrir

  </a>


  <a href="likes.html">

    <span>
      ❤️
    </span>

    Me gustas

  </a>


  <a href="chat.html">

    <span>
      💕
    </span>

    Matches

  </a>


  <a href="notificaciones.html">

    <span>
      🔔
    </span>

    Notificaciones

    <b
      id="badge"
      class="badge"
    >
      0
    </b>

  </a>

</nav>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;

let perfiles = [];

let perfilesFiltrados = [];

let indiceActual = 0;

let bloqueados = new Set();

let swipesRealizados = new Set();


const $ =
  id =>
    document.getElementById(id);


const contenido =
  $("contenido");

const contador =
  $("contador");

const ciudadSelect =
  $("ciudad");

const edadMin =
  $("edadMin");

const edadMax =
  $("edadMax");

const toast =
  $("toast");


document.addEventListener(
  "DOMContentLoaded",
  iniciar
);


$("btnFiltros").addEventListener(
  "click",
  aplicarFiltros
);


/* =========================
   INICIAR
========================= */

async function iniciar() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if (error) {
      throw error;
    }


    if (!data.session) {

      window.location.href =
        "index.html";

      return;

    }


    usuarioActual =
      data.session.user;


    await cargarPerfiles();

    await cargarNotificaciones();


  } catch (error) {

    console.error(error);

    mostrarError(
      "No se pudo iniciar Descubrir.",
      error
    );

  }

}


/* =========================
   CARGAR PERFILES
========================= */

async function cargarPerfiles() {

  contenido.innerHTML = `
    <div class="cargando">
      🔎 Buscando personas...
    </div>
  `;


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(`
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          intereses,
          online,
          last_seen
        `);


    if (error) {
      throw error;
    }


    perfiles =
      data || [];


    await cargarBloqueados();

    await cargarSwipes();

    prepararCiudades();

    aplicarFiltros();


  } catch (error) {

    console.error(error);

    mostrarError(
      "No se pudieron cargar los perfiles.",
      error
    );

  }

}


/* =========================
   BLOQUEADOS
========================= */

async function cargarBloqueados() {

  bloqueados =
    new Set();


  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_blocks")
      .select("blocked_id")
      .eq(
        "blocker_id",
        usuarioActual.id
      );


  if (error) {

    console.warn(
      "Bloqueos:",
      error
    );

    return;

  }


  (data || []).forEach(
    item => {

      bloqueados.add(
        item.blocked_id
      );

    }
  );

}


/* =========================
   SWIPES
========================= */

async function cargarSwipes() {

  swipesRealizados =
    new Set();


  const {
    data,
    error
  } =
    await supabaseClient
      .from("swipes")
      .select("target_user_id")
      .eq(
        "user_id",
        usuarioActual.id
      );


  if (error) {

    console.warn(
      "Swipes:",
      error
    );

    return;

  }


  (data || []).forEach(
    item => {

      swipesRealizados.add(
        item.target_user_id
      );

    }
  );

}


/* =========================
   CIUDADES
========================= */

function prepararCiudades() {

  const ciudades =
    [
      ...new Set(
        perfiles
          .map(
            perfil =>
              perfil.ciudad
          )
          .filter(Boolean)
      )
    ]
    .sort(
      (a, b) =>
        a.localeCompare(b)
    );


  ciudadSelect.innerHTML = `
    <option value="">
      Todas las ciudades
    </option>
  `;


  ciudades.forEach(
    ciudad => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        ciudad;

      option.textContent =
        ciudad;


      ciudadSelect.appendChild(
        option
      );

    }
  );

}


/* =========================
   FILTROS
========================= */

function aplicarFiltros() {

  let min =
    edadMin.value
      ? Number(
          edadMin.value
        )
      : 18;


  let max =
    edadMax.value
      ? Number(
          edadMax.value
        )
      : 100;


  if (min < 18) {
    min = 18;
  }

  if (max > 100) {
    max = 100;
  }


  if (min > max) {

    mostrarToast(
      "La edad mínima no puede ser mayor que la máxima."
    );

    return;

  }


  const ciudad =
    ciudadSelect.value;


  perfilesFiltrados =
    perfiles.filter(
      perfil => {

        if (
          perfil.id ===
          usuarioActual.id
        ) {
          return false;
        }


        if (
          bloqueados.has(
            perfil.id
          )
        ) {
          return false;
        }


        if (
          swipesRealizados.has(
            perfil.id
          )
        ) {
          return false;
        }


        if (
          perfil.edad !== null &&
          perfil.edad !== undefined &&
          perfil.edad !== ""
        ) {

          const edad =
            Number(
              perfil.edad
            );


          if (
            edad < min ||
            edad > max
          ) {
            return false;
          }

        }


        if (
          ciudad &&
          perfil.ciudad !== ciudad
        ) {
          return false;
        }


        return true;

      }
    );


  indiceActual =
    0;


  actualizarContador();

  mostrarPerfil();

}


/* =========================
   CONTADOR
========================= */

function actualizarContador() {

  if (
    perfilesFiltrados.length === 0
  ) {

    contador.textContent =
      "";

    return;

  }


  contador.textContent =
    `👥 ${perfilesFiltrados.length} perfil${
      perfilesFiltrados.length === 1
        ? ""
        : "es"
    } disponible${
      perfilesFiltrados.length === 1
        ? ""
        : "s"
    }`;

}


/* =========================
   MOSTRAR PERFIL
========================= */

function mostrarPerfil() {

  if (
    indiceActual >=
    perfilesFiltrados.length
  ) {

    contador.textContent =
      "";

    contenido.innerHTML = `

      <div class="mensaje">

        <div style="font-size:55px;">
          💕
        </div>

        <h2>
          No hay más perfiles
        </h2>

        <p>
          Probá cambiar los filtros
          o volvé más tarde para
          descubrir nuevas personas.
        </p>

      </div>

    `;

    return;

  }


  const perfil =
    perfilesFiltrados[
      indiceActual
    ];


  const nombre =
    escapar(
      perfil.nombre ||
      "Usuario"
    );


  const edad =
    perfil.edad
      ? `, ${perfil.edad}`
      : "";


  const ciudad =
    perfil.ciudad
      ? escapar(
          perfil.ciudad
        )
      : "";


  const descripcion =
    perfil.descripcion
      ? escapar(
          perfil.descripcion
        )
      : "Sin descripción";


  const intereses =
    perfil.intereses
      ? escapar(
          perfil.intereses
        )
      : "";


  const online =
    perfil.online === true;


  let fotoHTML =
    `
      <div class="sin-foto">
        👤
      </div>
    `;


  if (
    perfil.foto_url
  ) {

    fotoHTML =
      `
        <img
          class="foto"
          src="${escapar(perfil.foto_url)}"
          alt="Foto de ${nombre}"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        >

        <div
          class="sin-foto"
          style="display:none;"
        >
          👤
        </div>
      `;

  }


  const interesesHTML =
    intereses
      ? `
        <div class="intereses">
          ✨ ${intereses}
        </div>
      `
      : "";


  contenido.innerHTML = `

    <article class="tarjeta">

      <div class="foto-wrapper">

        ${fotoHTML}

        <div class="foto-overlay"></div>

        <div
          class="estado ${online ? "online" : ""}"
        >

          <span class="estado-dot"></span>

          ${
            online
              ? "En línea"
              : "Desconectado"
          }

        </div>

      </div>


      <div class="datos">

        <div class="nombre">
          ${nombre}${edad}
        </div>


        ${
          ciudad
            ? `
              <div class="info">
                📍 ${ciudad}
              </div>
            `
            : ""
        }


        <div class="descripcion">
          ${descripcion}
        </div>


        ${interesesHTML}

      </div>


      <div class="acciones">

        <button
          id="btnNo"
          class="btn-no"
          type="button"
        >
          ✕
        </button>


        <button
          id="btnSi"
          class="btn-si"
          type="button"
        >
          ❤️
        </button>

      </div>


      <button
        id="btnBloquear"
        class="btn-bloquear"
        type="button"
      >
        🚫 Bloquear perfil
      </button>

    </article>

  `;


  $("btnNo").addEventListener(
    "click",
    () =>
      registrarSwipe(
        perfil,
        "pass"
      )
  );


  $("btnSi").addEventListener(
    "click",
    () =>
      registrarSwipe(
        perfil,
        "like"
      )
  );


  $("btnBloquear").addEventListener(
    "click",
    () =>
      bloquearPerfil(
        perfil
      )
  );

}


/* =========================
   SWIPE
========================= */

async function registrarSwipe(
  perfil,
  accion
) {

  const btnNo =
    $("btnNo");

  const btnSi =
    $("btnSi");


  if (btnNo) {
    btnNo.disabled = true;
  }

  if (btnSi) {
    btnSi.disabled = true;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("swipes")
        .upsert(
          {
            user_id:
              usuarioActual.id,

            target_user_id:
              perfil.id,

            action:
              accion
          },
          {
            onConflict:
              "user_id,target_user_id"
          }
        );


    if (error) {
      throw error;
    }


    swipesRealizados.add(
      perfil.id
    );


    if (
      accion === "like"
    ) {

      const {
        data: match
      } =
        await buscarMatch(
          perfil.id
        );


      if (match) {

        mostrarToast(
          `💕 ¡Match con ${
            perfil.nombre ||
            "esta persona"
          }!`
        );

      } else {

        mostrarToast(
          "❤️ Me gusta enviado"
        );

      }

    } else {

      mostrarToast(
        "Pasaste este perfil"
      );

    }


    indiceActual++;

    actualizarContador();

    setTimeout(
      mostrarPerfil,
      180
    );


  } catch (error) {

    console.error(
      "Swipe:",
      error
    );


    mostrarToast(
      "❌ No se pudo guardar la acción."
    );


    if (btnNo) {
      btnNo.disabled = false;
    }

    if (btnSi) {
      btnSi.disabled = false;
    }

  }

}


/* =========================
   BUSCAR MATCH
========================= */

async function buscarMatch(
  targetId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id"
      )
      .or(
        `and(user1_id.eq.${usuarioActual.id},user2_id.eq.${targetId}),and(user1_id.eq.${targetId},user2_id.eq.${usuarioActual.id})`
      )
      .limit(1);


  if (error) {

    console.warn(
      "Match:",
      error
    );

    return null;

  }


  return data &&
    data.length
    ? data[0]
    : null;

}


/* =========================
   BLOQUEAR
========================= */

async function bloquearPerfil(
  perfil
) {

  const confirmar =
    confirm(
      `¿Querés bloquear a ${
        perfil.nombre ||
        "este perfil"
      }?`
    );


  if (!confirmar) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("user_blocks")
        .insert(
          {
            blocker_id:
              usuarioActual.id,

            blocked_id:
              perfil.id
          }
        );


    if (
      error &&
      error.code !== "23505"
    ) {

      throw error;

    }


    bloqueados.add(
      perfil.id
    );


    swipesRealizados.add(
      perfil.id
    );


    mostrarToast(
      "🚫 Perfil bloqueado"
    );


    indiceActual++;

    actualizarContador();


    setTimeout(
      mostrarPerfil,
      180
    );


  } catch (error) {

    console.error(
      "Bloquear:",
      error
    );


    mostrarToast(
      "❌ No se pudo bloquear el perfil."
    );

  }

}


/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  const badge =
    $("badge");


  if (!badge) {
    return;
  }


  try {

    const {
      data: matches,
      error: matchError
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (matchError) {
      throw matchError;
    }


    if (
      !matches ||
      matches.length === 0
    ) {

      badge.style.display =
        "none";

      return;

    }


    let totalNoLeidos =
      0;


    for (
      const match of matches
    ) {

      const {
        data: mensajes,
        error
      } =
        await supabaseClient
          .from("messages")
          .select("id")
          .eq(
            "match_id",
            match.id
          )
          .neq(
            "sender_id",
            usuarioActual.id
          )
          .is(
            "read_at",
            null
          );


      if (error) {
        continue;
      }


      totalNoLeidos +=
        mensajes?.length || 0;

    }


    if (
      totalNoLeidos > 0
    ) {

      badge.textContent =
        totalNoLeidos > 99
          ? "99+"
          : totalNoLeidos;


      badge.style.display =
        "flex";

    } else {

      badge.style.display =
        "none";

    }


  } catch (error) {

    console.warn(
      "Notificaciones:",
      error
    );

  }

}


/* =========================
   TOAST
========================= */

let toastTimer =
  null;


function mostrarToast(
  texto
) {

  if (!toast) {
    return;
  }


  toast.textContent =
    texto;


  toast.style.display =
    "block";


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.style.display =
          "none";

      },
      2200
    );

}


/* =========================
   ERROR
========================= */

function mostrarError(
  titulo,
  error
) {

  const detalle =
    error &&
    error.message
      ? escapar(
          error.message
        )
      : "";


  contenido.innerHTML = `

    <div class="error">

      <h3>
        ❌ ${escapar(titulo)}
      </h3>

      ${
        detalle
          ? `
            <div class="error-detalle">
              ${detalle}
            </div>
          `
          : ""
      }

    </div>

  `;

}


/* =========================
   ESCAPAR HTML
========================= */

function escapar(
  valor
) {

  return String(
    valor ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
