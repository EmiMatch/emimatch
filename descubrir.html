/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

let supabaseClient = null;

let usuarioActual = null;

let perfiles = [];

let indiceActual = 0;

let perfilMatchActual = null;


/* =====================================
   ELEMENTOS
===================================== */

const estado =
document.getElementById("estado");

const contenido =
document.getElementById("contenido");

const perfilesDiv =
document.getElementById("perfiles");


/* =====================================
   CONECTAR
===================================== */

function conectarSupabase(){

  if(
    typeof window.supabase === "undefined"
  ){

    mostrarError(
      "Supabase no se pudo cargar."
    );

    return false;
  }

  if(
    typeof window.supabase.createClient !==
    "function"
  ){

    mostrarError(
      "La biblioteca de Supabase no está disponible."
    );

    return false;
  }

  try{

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    return true;

  }catch(error){

    mostrarError(
      "No se pudo conectar con Supabase.",
      error
    );

    return false;
  }
}


/* =====================================
   INICIO
===================================== */

async function iniciar(){

  estado.style.display = "block";

  contenido.style.display = "none";

  estado.textContent =
    "🔄 Conectando con EmiMatch...";


  if(!conectarSupabase()){

    return;
  }


  estado.textContent =
    "🔄 Verificando sesión...";


  try{

    /*
      IMPORTANTE:
      obtenemos la sesión directamente.
    */

    const respuesta =
      await supabaseClient.auth.getSession();


    console.log(
      "EmiMatch sesión:",
      respuesta
    );


    if(respuesta.error){

      throw respuesta.error;
    }


    if(
      !respuesta.data ||
      !respuesta.data.session
    ){

      estado.innerHTML =
      "⚠️ No hay una sesión activa.<br><br>" +
      "Redirigiendo al inicio...";

      setTimeout(
        function(){

          window.location.replace(
            "index.html"
          );

        },
        1200
      );

      return;
    }


    usuarioActual =
      respuesta.data.session.user;


    console.log(
      "Usuario conectado:",
      usuarioActual.id
    );


    estado.style.display =
      "none";

    contenido.style.display =
      "block";


    await cargarPerfiles();

    await cargarNotificaciones();


  }catch(error){

    console.error(
      "ERROR SESIÓN:",
      error
    );

    mostrarError(
      "No se pudo verificar la sesión.",
      error
    );
  }
}


/* =====================================
   CARGAR PERFILES
===================================== */

async function cargarPerfiles(){

  perfilesDiv.innerHTML =
  `
  <div class="estado">
    🔄 Buscando perfiles...
  </div>
  `;

  indiceActual = 0;


  const edadMin =
    Number(
      document.getElementById("edadMin").value
    ) || 18;


  const edadMax =
    Number(
      document.getElementById("edadMax").value
    ) || 100;


  const ciudad =
    document
      .getElementById("ciudadFiltro")
      .value
      .trim()
      .toLowerCase();


  try{

    /* BLOQUEOS */

    const bloqueos =
      await supabaseClient
        .from("user_blocks")
        .select(
          "blocker_id,blocked_id"
        )
        .or(
          "blocker_id.eq." +
          usuarioActual.id +
          ",blocked_id.eq." +
          usuarioActual.id
        );


    if(bloqueos.error){

      throw bloqueos.error;
    }


    const bloqueados =
      new Set();


    (bloqueos.data || [])
      .forEach(function(item){

        if(
          item.blocker_id ===
          usuarioActual.id
        ){

          bloqueados.add(
            item.blocked_id
          );
        }

        if(
          item.blocked_id ===
          usuarioActual.id
        ){

          bloqueados.add(
            item.blocker_id
          );
        }

      });


    /* SWIPES */

    const swipes =
      await supabaseClient
        .from("swipes")
        .select(
          "target_user_id"
        )
        .eq(
          "user_id",
          usuarioActual.id
        );


    if(swipes.error){

      throw swipes.error;
    }


    const vistos =
      new Set(
        (swipes.data || [])
          .map(function(item){

            return item.target_user_id;

          })
      );


    /* PERFILES */

    const resultado =
      await supabaseClient
        .from("profiles")
        .select(
          "id,nombre,edad,ciudad,descripcion,foto_url,intereses,created_at"
        )
        .neq(
          "id",
          usuarioActual.id
        )
        .gte(
          "edad",
          edadMin
        )
        .lte(
          "edad",
          edadMax
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(resultado.error){

      throw resultado.error;
    }


    perfiles =
      (resultado.data || [])
      .filter(function(perfil){

        if(
          bloqueados.has(
            perfil.id
          )
        ){

          return false;
        }


        if(
          vistos.has(
            perfil.id
          )
        ){

          return false;
        }


        if(
          ciudad &&
          !String(
            perfil.ciudad || ""
          )
          .toLowerCase()
          .includes(ciudad)
        ){

          return false;
        }


        return true;

      });


    mostrarPerfil();


  }catch(error){

    console.error(
      "ERROR PERFILES:",
      error
    );

    mostrarError(
      "No se pudieron cargar los perfiles.",
      error
    );
  }
}


/* =====================================
   MOSTRAR PERFIL
===================================== */

function mostrarPerfil(){

  if(
    indiceActual >=
    perfiles.length
  ){

    perfilesDiv.innerHTML =
    `
    <div class="vacio">

      <h2>💙 No hay más perfiles</h2>

      <p>
        Probá cambiar los filtros
        o volvé más tarde.
      </p>

    </div>
    `;

    return;
  }


  const perfil =
    perfiles[indiceActual];


  const foto =
    perfil.foto_url ||
    "https://via.placeholder.com/600x500?text=EmiMatch";


  perfilesDiv.innerHTML =
  `
  <div class="card">

    <img
      class="foto"
      src="${escapar(foto)}"
      alt="Foto"
      onerror="this.src='https://via.placeholder.com/600x500?text=EmiMatch'"
    >

    <div class="info">

      <div class="nombre">

        ${escapar(
          perfil.nombre ||
          "Sin nombre"
        )}

        ${
          perfil.edad
          ?
          ", " +
          escapar(perfil.edad)
          :
          ""
        }

      </div>

      <div class="ciudad">

        📍
        ${escapar(
          perfil.ciudad ||
          "Sin ciudad"
        )}

      </div>

      ${
        perfil.descripcion
        ?
        `
        <div class="descripcion">
          ${escapar(
            perfil.descripcion
          )}
        </div>
        `
        :
        ""
      }

      ${
        perfil.intereses
        ?
        `
        <div class="intereses">
          ❤️
          ${escapar(
            perfil.intereses
          )}
        </div>
        `
        :
        ""
      }

      <div class="acciones">

        <button
          class="btn-pasar"
          onclick="registrarSwipe('pass')"
        >
          ❌ Pasar
        </button>

        <button
          class="btn-like"
          onclick="registrarSwipe('like')"
        >
          ❤️ Like
        </button>

      </div>

      <button
        class="btn-bloquear"
        onclick="bloquearUsuario()"
      >
        🚫 Bloquear
      </button>

    </div>

  </div>
  `;
}


/* =====================================
   SWIPE
===================================== */

async function registrarSwipe(
  accion
){

  if(
    !usuarioActual ||
    indiceActual >=
    perfiles.length
  ){

    return;
  }


  const perfil =
    perfiles[indiceActual];


  try{

    const resultado =
      await supabaseClient
        .from("swipes")
        .insert({

          user_id:
          usuarioActual.id,

          target_user_id:
          perfil.id,

          action:
          accion

        });


    if(resultado.error){

      if(
        resultado.error.code ===
        "23505"
      ){

        indiceActual++;

        mostrarPerfil();

        return;
      }

      throw resultado.error;
    }


    if(
      accion === "like"
    ){

      const match =
        await comprobarMatch(
          perfil.id
        );


      indiceActual++;


      if(match){

        await prepararMatch(
          perfil
        );

        document.getElementById(
          "modalMatch"
        ).style.display =
        "flex";

        return;
      }

    }else{

      indiceActual++;

    }


    mostrarPerfil();


  }catch(error){

    console.error(
      "ERROR SWIPE:",
      error
    );

    alert(
      "No se pudo guardar la acción."
    );
  }
}


/* =====================================
   MATCH
===================================== */

async function comprobarMatch(
  perfilId
){

  try{

    const a =
      await supabaseClient
        .from("matches")
        .select("id")
        .eq(
          "user1_id",
          usuarioActual.id
        )
        .eq(
          "user2_id",
          perfilId
        )
        .limit(1);


    if(a.error){

      throw a.error;
    }


    if(
      a.data &&
      a.data.length
    ){

      return true;
    }


    const b =
      await supabaseClient
        .from("matches")
        .select("id")
        .eq(
          "user1_id",
          perfilId
        )
        .eq(
          "user2_id",
          usuarioActual.id
        )
        .limit(1);


    if(b.error){

      throw b.error;
    }


    return !!(
      b.data &&
      b.data.length
    );


  }catch(error){

    console.error(
      "ERROR MATCH:",
      error
    );

    return false;
  }
}


/* =====================================
   PREPARAR MATCH
===================================== */

async function prepararMatch(
  perfil
){

  perfilMatchActual =
    perfil;


  let miFoto =
    "https://via.placeholder.com/200?text=Yo";


  try{

    const resultado =
      await supabaseClient
        .from("profiles")
        .select("foto_url")
        .eq(
          "id",
          usuarioActual.id
        )
        .maybeSingle();


    if(
      !resultado.error &&
      resultado.data &&
      resultado.data.foto_url
    ){

      miFoto =
        resultado.data.foto_url;
    }

  }catch(error){

    console.error(
      error
    );
  }


  document.getElementById(
    "fotoMiMatch"
  ).src =
  miFoto;


  document.getElementById(
    "fotoOtroMatch"
  ).src =
  perfil.foto_url ||
  "https://via.placeholder.com/200?text=Match";
}

document.getElementById(

/* =====================================
   BLOQUEAR
===================================== */

async function bloquearUsuario(){

  if(
    !usuarioActual ||
    indiceActual >=
    perfiles.length
  ){

    return;
  }


  const perfil =
    perfiles[indiceActual];


  if(
    !confirm(
      "¿Querés bloquear a este usuario?"
    )
  ){

    return;
  }


  try{

    const resultado =
      await supabaseClient
        .from("user_blocks")
        .insert({

          blocker_id:
          usuarioActual.id,

          blocked_id:
          perfil.id

        });


    if(
      resultado.error &&
      resultado.error.code !==
      "23505"
    ){

      throw resultado.error;
    }


    indiceActual++;

    mostrarPerfil();


  }catch(error){

    console.error(
      "ERROR BLOQUEO:",
      error
    );

    alert(
      "No se pudo bloquear al usuario."
    );
  }
}


/* =====================================
   NOTIFICACIONES
===================================== */

async function cargarNotificaciones(){

  try{

    const badge =
      document.getElementById(
        "badgeNotificaciones"
      );


    const resultado =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .or(
          "user1_id.eq." +
          usuarioActual.id +
          ",user2_id.eq." +
          usuarioActual.id
        );


    if(resultado.error){

      throw resultado.error;
    }


    const ids =
      (resultado.data || [])
      .map(function(item){

        return item.id;

      });


    if(!ids.length){

      badge.style.display =
      "none";

      return;
    }


    const mensajes =
      await supabaseClient
        .from("messages")
        .select(
          "id,match_id,sender_id,read_at"
        )
        .in(
          "match_id",
          ids
        )
        .neq(
          "sender_id",
          usuarioActual.id
        )
        .is(
          "read_at",
          null
        );


    if(mensajes.error){

      throw mensajes.error;
    }


    const cantidad =
      mensajes.data?.length || 0;


    if(cantidad){

      badge.textContent =
        cantidad > 99
        ?
        "99+"
        :
        cantidad;

      badge.style.display =
        "inline-block";

    }else{

      badge.style.display =
        "none";
    }


  }catch(error){

    console.error(
      "ERROR NOTIFICACIONES:",
      error
    );
  }
}
