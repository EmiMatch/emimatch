const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

let supabaseClient = null;
let usuarioActual = null;
let perfiles = [];
let indiceActual = 0;
let perfilMatchActual = null;


/* =========================
   ELEMENTOS
========================= */

const estado =
  document.getElementById("estado");

const contenido =
  document.getElementById("contenido");

const perfilesDiv =
  document.getElementById("perfiles");

const filtrarButton =
  document.getElementById("filtrarButton");

const modalMatch =
  document.getElementById("modalMatch");

const continuarButton =
  document.getElementById("continuarButton");

const chatMatchButton =
  document.getElementById("chatMatchButton");


/* =========================
   INICIAR SUPABASE
========================= */

function conectarSupabase() {

  try {

    if (
      !window.supabase ||
      !window.supabase.createClient
    ) {

      mostrarError(
        "No se pudo cargar Supabase."
      );

      return false;
    }

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    return true;

  } catch (error) {

    console.error(
      "ERROR SUPABASE:",
      error
    );

    mostrarError(
      "Error al conectar con EmiMatch.",
      error
    );

    return false;
  }
}


/* =========================
   INICIAR APP
========================= */

async function iniciar() {

  estado.style.display = "block";

  estado.textContent =
    "🔄 Verificando sesión...";

  contenido.style.display = "none";

  if (!conectarSupabase()) {
    return;
  }

  try {

    const respuesta =
      await supabaseClient.auth.getSession();

    if (respuesta.error) {

      console.error(
        "ERROR SESIÓN:",
        respuesta.error
      );

      mostrarError(
        "No se pudo verificar la sesión.",
        respuesta.error
      );

      return;
    }

    const session =
      respuesta.data?.session;

    if (!session) {

      estado.textContent =
        "⚠️ Tu sesión terminó. Redirigiendo...";

      setTimeout(() => {

        window.location.replace(
          "index.html"
        );

      }, 800);

      return;
    }

    usuarioActual =
      session.user;

    estado.style.display =
      "none";

    contenido.style.display =
      "block";

    await cargarPerfiles();

    await cargarNotificaciones();

  } catch (error) {

    console.error(
      "ERROR AL INICIAR:",
      error
    );

    mostrarError(
      "No se pudo iniciar Descubrir.",
      error
    );
  }
}


/* =========================
   CARGAR PERFILES
========================= */

async function cargarPerfiles() {

  perfilesDiv.innerHTML = `
    <div class="estado">
      🔄 Buscando perfiles...
    </div>
  `;

  indiceActual = 0;

  const edadMin =
    parseInt(
      document.getElementById("edadMin").value
    ) || 18;

  const edadMax =
    parseInt(
      document.getElementById("edadMax").value
    ) || 100;

  const ciudad =
    document
      .getElementById("ciudadFiltro")
      .value
      .trim()
      .toLowerCase();


  try {

    /* =========================
       BLOQUEADOS
    ========================= */

    const bloqueos =
      await supabaseClient
        .from("user_blocks")
        .select("blocker_id,blocked_id")
        .or(
          `blocker_id.eq.${usuarioActual.id},blocked_id.eq.${usuarioActual.id}`
        );

    if (bloqueos.error) {
      throw bloqueos.error;
    }

    const usuariosBloqueados =
      new Set();

    (bloqueos.data || [])
      .forEach(item => {

        if (
          item.blocker_id ===
          usuarioActual.id
        ) {
          usuariosBloqueados.add(
            item.blocked_id
          );
        }

        if (
          item.blocked_id ===
          usuarioActual.id
        ) {
          usuariosBloqueados.add(
            item.blocker_id
          );
        }

      });


    /* =========================
       SWIPES
    ========================= */

    const swipes =
      await supabaseClient
        .from("swipes")
        .select("target_user_id")
        .eq(
          "user_id",
          usuarioActual.id
        );

    if (swipes.error) {
      throw swipes.error;
    }

    const usuariosVistos =
      new Set(
        (swipes.data || [])
          .map(
            item =>
              item.target_user_id
          )
      );


    /* =========================
       PERFILES
    ========================= */

    const respuesta =
      await supabaseClient
        .from("profiles")
        .select(
          "id,nombre,edad,ciudad,descripcion,foto_url,intereses,created_at"
        )
        .neq(
          "id",
          usuarioActual.id
        )
        .gte(
          "edad",
          edadMin
        )
        .lte(
          "edad",
          edadMax
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (respuesta.error) {
      throw respuesta.error;
    }

    perfiles =
      (respuesta.data || [])
        .filter(perfil => {

          if (
            usuariosBloqueados.has(
              perfil.id
            )
          ) {
            return false;
          }

          if (
            usuariosVistos.has(
              perfil.id
            )
          ) {
            return false;
          }

          if (
            ciudad &&
            !String(
              perfil.ciudad || ""
            )
              .toLowerCase()
              .includes(ciudad)
          ) {
            return false;
          }

          return true;

        });


    mostrarPerfilActual();

  } catch (error) {

    console.error(
      "ERROR CARGANDO PERFILES:",
      error
    );

    mostrarError(
      "No se pudieron cargar los perfiles.",
      error
    );
  }
}


/* =========================
   MOSTRAR PERFIL
========================= */

function mostrarPerfilActual() {

  if (
    indiceActual >=
    perfiles.length
  ) {

    perfilesDiv.innerHTML = `
      <div class="vacio">
        <h2>💙 No hay más perfiles</h2>
        <p>
          Probá cambiar los filtros
          o volvé más tarde.
        </p>
      </div>
    `;

    return;
  }

  const perfil =
    perfiles[indiceActual];

  const foto =
    perfil.foto_url ||
    "https://via.placeholder.com/600x500?text=EmiMatch";

  perfilesDiv.innerHTML = `

    <div class="card">

      <img
        class="foto"
        src="${escapar(foto)}"
        alt="Foto de ${escapar(perfil.nombre || "usuario")}"
        onerror="this.src='https://via.placeholder.com/600x500?text=EmiMatch'"
      >

      <div class="info">

        <div class="nome">
          ${escapar(perfil.nombre || "Sin nombre")}
          ${perfil.edad ? `, ${escapar(perfil.edad)}` : ""}
        </div>

        <div class="cidade">
          📍 ${escapar(perfil.ciudad || "Sin ciudad")}
        </div>

        ${
          perfil.descripcion
          ?
          `
          <div class="descripcion">
            ${escapar(perfil.descripcion)}
          </div>
          `
          :
          ""
        }

        ${
          perfil.intereses
          ?
          `
          <div class="intereses">
            ❤️ ${escapar(perfil.intereses)}
          </div>
          `
          :
          ""
        }

        <div class="acciones">

          <button
            class="btn-pasar"
            onclick="registrarSwipe('pass')"
          >
            ❌ Pasar
          </button>

          <button
            class="btn-like"
            onclick="registrarSwipe('like')"
          >
            ❤️ Like
          </button>

        </div>

        <button
          class="btn-bloquear"
          onclick="bloquearUsuario()"
        >
          🚫 Bloquear
        </button>

      </div>

    </div>
  `;
}


/* =========================
   LIKE / PASS
========================= */

async function registrarSwipe(accion) {

  if (
    !usuarioActual ||
    indiceActual >= perfiles.length
  ) {
    return;
  }

  const perfil =
    perfiles[indiceActual];

  try {

    const resultado =
      await supabaseClient
        .from("swipes")
        .insert({
          user_id:
            usuarioActual.id,

          target_user_id:
            perfil.id,

          action:
            accion
        });

    if (resultado.error) {

      /* Swipe duplicado */

      if (
        resultado.error.code ===
        "23505"
      ) {

        indiceActual++;

        mostrarPerfilActual();

        return;
      }

      throw resultado.error;
    }


    /* =========================
       SI FUE LIKE
    ========================= */

    if (accion === "like") {

      const huboMatch =
        await comprobarMatch(
          perfil.id
        );

      indiceActual++;

      if (huboMatch) {

        await prepararModalMatch(
          perfil
        );

        mostrarMatch();

        return;
      }

      mostrarPerfilActual();

      return;
    }


    /* =========================
       PASS
    ========================= */

    indiceActual++;

    mostrarPerfilActual();

  } catch (error) {

    console.error(
      "ERROR SWIPE:",
      error
    );

    alert(
      "No se pudo guardar la acción. Intentá nuevamente."
    );
  }
}


/* =========================
   COMPROBAR MATCH
========================= */

async function comprobarMatch(
  perfilId
) {

  try {

    const resultado =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .eq(
          "user1_id",
          usuarioActual.id
        )
        .eq(
          "user2_id",
          perfilId
        )
        .limit(1);

    if (resultado.error) {
      throw resultado.error;
    }

    if (
      resultado.data &&
      resultado.data.length > 0
    ) {
      return true;
    }


    const resultado2 =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .eq(
          "user1_id",
          perfilId
        )
        .eq(
          "user2_id",
          usuarioActual.id
        )
        .limit(1);

    if (resultado2.error) {
      throw resultado2.error;
    }

    return !!(
      resultado2.data &&
      resultado2.data.length
    );

  } catch (error) {

    console.error(
      "ERROR COMPROBANDO MATCH:",
      error
    );

    return false;
  }
}


/* =========================
   PREPARAR MATCH
========================= */

async function prepararModalMatch(
  perfil
) {

  perfilMatchActual =
    perfil;

  let miFoto =
    "https://via.placeholder.com/200?text=Yo";

  try {

    const resultado =
      await supabaseClient
        .from("profiles")
        .select("foto_url")
        .eq(
          "id",
          usuarioActual.id
        )
        .single();

    if (
      !resultado.error &&
      resultado.data &&
      resultado.data.foto_url
    ) {

      miFoto =
        resultado.data.foto_url;
    }

  } catch (error) {

    console.error(
      "ERROR FOTO USUARIO:",
      error
    );
  }

  document.getElementById(
    "fotoMiMatch"
  ).src = miFoto;

  document.getElementById(
    "fotoOtroMatch"
  ).src =
    perfil.foto_url ||
    "https://via.placeholder.com/200?text=Match";
}


/* =========================
   MOSTRAR MATCH
========================= */

function mostrarMatch() {

  modalMatch.style.display =
    "flex";
}


/* =========================
   CONTINUAR
========================= */

continuarButton.onclick =
function() {

  modalMatch.style.display =
    "none";

  mostrarPerfilActual();
};


/* =========================
   IR AL CHAT
========================= */

chatMatchButton.onclick =
function() {

  if (!perfilMatchActual) {
    return;
  }

  window.location.href =
    "conversacion.html?user=" +
    encodeURIComponent(
      perfilMatchActual.id
    );
};


/* =========================
   BLOQUEAR
========================= */

async function bloquearUsuario() {

  if (
    !usuarioActual ||
    indiceActual >= perfiles.length
  ) {
    return;
  }

  const perfil =
    perfiles[indiceActual];

  const confirmar =
    confirm(
      "¿Querés bloquear a este usuario?"
    );

  if (!confirmar) {
    return;
  }

  try {

    const resultado =
      await supabaseClient
        .from("user_blocks")
        .insert({
          blocker_id:
            usuarioActual.id,

          blocked_id:
            perfil.id
        });

    if (resultado.error) {

      if (
        resultado.error.code !==
        "23505"
      ) {
        throw resultado.error;
      }
    }

    indiceActual++;

    mostrarPerfilActual();

  } catch (error) {

    console.error(
      "ERROR BLOQUEANDO:",
      error
    );

    alert(
        "No se pudo bloquear al usuario."
    );
  }
}


/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  const badge =
    document.getElementById(
      "badgeNotificaciones"
    );

  try {

    const matches =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );

    if (matches.error) {
      throw matches.error;
    }

    const ids =
      (matches.data || [])
        .map(match => match.id);

    if (!ids.length) {

      badge.style.display =
        "none";

      return;
    }

    const mensajes =
      await supabaseClient
        .from("messages")
        .select(
          "id,match_id,sender_id,read_at"
        )
        .in(
          "match_id",
          ids
        )
        .neq(
          "sender_id",
          usuarioActual.id
        )
        .is(
          "read_at",
          null
        );

    if (mensajes.error) {
      throw mensajes.error;
    }

    const cantidad =
      mensajes.data?.length || 0;

    if (cantidad > 0) {

      badge.textContent =
        cantidad > 99
          ? "99+"
          : cantidad;

      badge.style.display =
        "inline-block";

    } else {

      badge.style.display =
        "none";
    }

  } catch (error) {

    console.error(
      "ERROR NOTIFICACIONES:",
      error
    );
  }
}


/* =========================
   FILTROS
========================= */

filtrarButton.onclick =
async function() {

  await cargarPerfiles();

};


/* =========================
   CERRAR MODAL
========================= */

modalMatch.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      modalMatch
    ) {

      modalMatch.style.display =
        "none";

      mostrarPerfilActual();
    }

  }
);


/* =========================
   ESCAPAR HTML
========================= */

function escapar(valor) {

  return String(
    valor ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}


/* =========================
   ERROR
========================= */

function mostrarError(
  titulo,
  error = null
) {

  estado.style.display =
    "block";

  contenido.style.display =
    "none";

  estado.innerHTML = `

    <div class="error">

      <h3>
        ⚠️ ${escapar(titulo)}
      </h3>

      ${
        error
        ?
        `
        <div class="error-detalle">
          ${escapar(
            error.message ||
            String(error)
          )}
        </div>
        `
        :
        ""
      }

      <button
        onclick="location.reload()"
        style="
          margin-top:15px;
          background:#d9ad45;
          color:#111827;
        "
      >
        🔄 Reintentar
      </button>

    </div>
  `;
    }
    
/* =========================
   ARRANQUE SEGURO
========================= */

if (
  document.readyState ===
  "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    iniciar
  );

} else {

  iniciar();

}

</script>

</body>
</html>
