<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #07152f;
      color: white;
      padding: 25px;
    }

    .box {
      background: #102a55;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
      line-height: 1.7;
      word-break: break-word;
    }

    .ok {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }
  </style>
</head>

<body>

<h2>🔎 Diagnóstico EmiMatch</h2>

<div class="box" id="resultado">
  Iniciando...
</div>

<script>

const resultado = document.getElementById("resultado");

function escribir(texto, clase = "") {
  resultado.innerHTML +=
    `<div class="${clase}">${texto}</div>`;
}


async function diagnostico() {

  resultado.innerHTML = "";

  escribir("1️⃣ JavaScript funcionando", "ok");


  const SUPABASE_URL =
    "https://kngiadwaesdbmvwivdev.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


  try {

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    escribir("2️⃣ Supabase cargado", "ok");


    const {
      data: { session },
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (sessionError) {

      escribir(
        "❌ Error de sesión: " +
        sessionError.message,
        "error"
      );

      return;
    }


    if (!session) {

      escribir(
        "❌ No hay sesión iniciada.",
        "error"
      );

      return;
    }


    escribir(
      "3️⃣ Sesión activa",
      "ok"
    );


    escribir(
      "Usuario: " +
      session.user.id,
      "ok"
    );


    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .limit(10);


    if (error) {

      escribir(
        "❌ Error leyendo profiles:",
        "error"
      );

      escribir(
        error.message,
        "error"
      );

      escribir(
        "Código: " + error.code,
        "error"
      );

      escribir(
        "Detalles: " +
        (error.details || "ninguno"),
        "error"
      );

      return;
    }


    escribir(
      "4️⃣ Tabla profiles accesible",
      "ok"
    );


    escribir(
      "Perfiles encontrados: " +
      (data ? data.length : 0),
      "ok"
    );


    if (data && data.length > 0) {

      escribir(
        "5️⃣ Primer perfil:",
        "ok"
      );

      escribir(
        JSON.stringify(data[0], null, 2)
          .replace(/\n/g, "<br>"),
        "ok"
      );

    } else {

      escribir(
        "⚠️ La tabla profiles está vacía.",
        "error"
      );

    }

  } catch (error) {

    escribir(
      "❌ Error inesperado:",
      "error"
    );

    escribir(
      error.message,
      "error"
    );

  }

}


diagnostico();

</script>

</body>
</html>
