<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EmiMatch - Descubrí nuevas conexiones.">
  <meta name="theme-color" content="#08111f">

  <title>EmiMatch - Descubrir</title>

  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    body {
      margin: 0;
      background: #08111f;
      color: #fff;
    }

    .discover-page {
      max-width: 700px;
      margin: auto;
      padding: 90px 15px 120px;
    }

    .discover-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .discover-title h1 {
      margin: 0;
      font-size: 26px;
    }

    .discover-title p {
      margin: 5px 0 0;
      color: #9ca9bd;
      font-size: 14px;
    }

    .filter-btn {
      width: 45px;
      height: 45px;
      border: 0;
      border-radius: 50%;
      background: #18243a;
      color: #fff;
      cursor: pointer;
      font-size: 19px;
    }

    .filters {
      display: none;
      padding: 16px;
      margin-bottom: 16px;
      background: #111d30;
      border: 1px solid #26344b;
      border-radius: 18px;
    }

    .filters.show {
      display: block;
    }

    .filters label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .filters input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #30415c;
      border-radius: 12px;
      background: #0a1424;
      color: #fff;
      outline: none;
    }

    .profile-card {
      overflow: hidden;
      background: #111d30;
      border: 1px solid #26344b;
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,.32);
    }

    .profile-photo {
      position: relative;
      height: 430px;
      background: #162238;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badges {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 7px 10px;
      border-radius: 20px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(8px);
      font-size: 12px;
    }

    .photo-overlay {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 60px 20px 20px;
      background: linear-gradient(
        transparent,
        rgba(0,0,0,.9)
      );
    }

    .profile-name {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
    }

    .profile-city {
      margin-top: 5px;
      color: #d5dbea;
      font-size: 14px;
    }

    .profile-info {
      padding: 18px;
    }

    .profile-description {
      margin: 0 0 14px;
      color: #d3d9e5;
      line-height: 1.5;
      font-size: 14px;
    }

    .interests {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .interest {
      padding: 7px 10px;
      border-radius: 20px;
      background: #1b2a42;
      color: #e6ebf5;
      font-size: 12px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 20px;
    }

    .action {
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: #1a2940;
      color: #fff;
      cursor: pointer;
      font-size: 22px;
    }

    .action.pass {
      background: #252f42;
    }

    .action.like {
      background: #d7aa3f;
      color: #111;
    }

    .action.block {
      background: #7f1d1d;
    }

    .message {
      margin: 15px 0;
      padding: 13px;
      border-radius: 13px;
      background: #111d30;
      border: 1px solid #26344b;
      color: #d9e1ee;
      font-size: 14px;
    }

    .message.error {
      border-color: #7f1d1d;
      color: #fecaca;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      background: #111d30;
      border: 1px solid #26344b;
      border-radius: 22px;
    }

    .empty-icon {
      margin-bottom: 10px;
      font-size: 42px;
    }

    .empty h2 {
      margin: 0 0 8px;
    }

    .empty p {
      margin: 0;
      color: #9ca9bd;
      font-size: 14px;
      line-height: 1.5;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.78);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
      padding: 25px;
      border: 1px solid #30415c;
      border-radius: 25px;
      background: #111d30;
      text-align: center;
    }

    .modal-box h2 {
      margin: 8px 0;
    }

    .modal-box p {
      color: #aebbd0;
      font-size: 14px;
    }

    .modal-box button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 0;
      border-radius: 13px;
      background: #d7aa3f;
      color: #111;
      font-weight: 800;
      cursor: pointer;
    }

    .modal-box .secondary {
      background: #26344b;
      color: #fff;
    }

    @media (max-width: 600px) {
      .discover-page {
        padding-right: 12px;
        padding-left: 12px;
      }

      .profile-photo {
        height: 390px;
      }

      .action {
        width: 54px;
        height: 54px;
      }
    }
  </style>
</head>

<body>

  <main class="discover-page">

    <div class="discover-top">

      <div class="discover-title">
        <h1>💕 Descubrir</h1>
        <p>Encontrá nuevas conexiones.</p>
      </div>

      <button
        id="filterButton"
        class="filter-btn"
        type="button"
        aria-label="Abrir filtros">
        ⚙️
      </button>

    </div>

    <section
      id="filters"
      class="filters">

      <label for="minAge">
        Edad mínima
      </label>

      <input
        id="minAge"
        type="number"
        min="18"
        max="100"
        value="18">

      <label for="maxAge">
        Edad máxima
      </label>

      <input
        id="maxAge"
        type="number"
        min="18"
        max="100"
        value="60">

      <label for="cityFilter">
        Ciudad
      </label>

      <input
        id="cityFilter"
        type="text"
        placeholder="Ej: La Plata">

      <button
        id="applyFilters"
        class="em-btn em-btn-primary"
        type="button">
        Aplicar filtros
      </button>

    </section>

    <div id="status"></div>

    <section id="profileContainer"></section>

  </main>

  <!-- =====================================================
       MODAL MATCH
  ====================================================== -->

  <div
    id="matchModal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="matchTitle"
    aria-describedby="matchText">

    <div class="modal-box match-modal-box">

      <div
        class="match-animation"
        aria-hidden="true">

        <div class="match-heart match-heart-back">
          ♥
        </div>

        <div class="match-heart match-heart-front">
          ♥
        </div>

      </div>

      <h2 id="matchTitle">
        ¡Hicieron Match!
      </h2>

      <p id="matchText">
        Los dos se dieron Like.
      </p>

      <div
        id="matchPersonName"
        class="match-person-name">
        💕 Nueva conexión
      </div>

      <button
        id="chatButton"
        class="match-primary-button"
        type="button">
        💬 Enviar mensaje
      </button>

      <button
        id="closeMatch"
        class="match-secondary-button"
        type="button">
        🔎 Seguir descubriendo
      </button>

    </div>

  </div>

  <!-- =====================================================
       ESTILOS DEL MODAL MATCH
  ====================================================== -->

  <style>

    .match-modal-box {
      position: relative;
      overflow: hidden;
      padding: 30px 22px 24px;
      text-align: center;

      background:
        radial-gradient(
          circle at top,
          rgba(215,170,63,.16),
          transparent 45%
        ),
        #111d30;
    }

    .match-modal-box::before,
    .match-modal-box::after {
      content: "♥";
      position: absolute;
      color: rgba(215,170,63,.12);
      pointer-events: none;
    }

    .match-modal-box::before {
      top: 15px;
      left: 20px;
      font-size: 35px;
      transform: rotate(-18deg);
    }

    .match-modal-box::after {
      right: 20px;
      bottom: 80px;
      font-size: 28px;
      transform: rotate(18deg);
    }

    .match-animation {
      position: relative;
      width: 105px;
      height: 90px;
      margin: 0 auto 10px;
    }

    .match-heart {
      position: absolute;
      top: 8px;
      left: 50%;
      transform-origin: center;
      font-size: 68px;
      line-height: 1;
    }

    .match-heart-back {
      color: #9b7a28;
      transform:
        translateX(-62%)
        rotate(-14deg);
      opacity: .8;
    }

    .match-heart-front {
      color: #d7aa3f;
      transform:
        translateX(-38%)
        rotate(14deg);
      text-shadow:
        0 8px 30px rgba(215,170,63,.35);
    }

    .match-modal-box h2 {
      position: relative;
      z-index: 2;
      margin: 8px 0;
      color: #ffffff;
      font-size: 29px;
      font-weight: 900;
    }

    .match-modal-box #matchText {
      position: relative;
      z-index: 2;
      margin: 0 auto 12px;
      max-width: 310px;
      color: #b9c5d8;
      font-size: 14px;
      line-height: 1.55;
    }

    .match-person-name {
      position: relative;
      z-index: 2;
      display: inline-block;
      margin: 5px auto 18px;
      padding: 8px 14px;
      border: 1px solid rgba(215,170,63,.28);
      border-radius: 30px;
      background: rgba(215,170,63,.08);
      color: #f3d47f;
      font-size: 13px;
      font-weight: 700;
    }

    .match-primary-button,
    .match-secondary-button {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      padding: 13px 16px;
      box-sizing: border-box;
      border: 0;
      border-radius: 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform .2s ease,
        opacity .2s ease;
    }

    .match-primary-button {
      background: linear-gradient(
        135deg,
        #d7aa3f,

    }

    @media (max-width: 480px) {

        border-radius: 22px;
      }

        width: 90px;
        height: 78px;
      }

      .match-heart {

      }

      .match-modal-box h2 {
        font-size: 25px;

  </style>

  <!-- =====================================================
       SUPABASE
  ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIGURACIÓN CENTRAL -->

  <script src="assets/js/config.js"></script>

  <!-- =====================================================
       LÓGICA DE DESCUBRIR
  ====================================================== -->

  <script>

    (() => {

      "use strict";

      let db = null;
      let currentUser = null;

      let profiles = [];
      let currentIndex = 0;
      let currentProfile = null;

      const $ = id =>
        document.getElementById(id);

      /* ===================================================
         SEGURIDAD HTML
      =================================================== */

      function escapeHTML(value) {

        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      }

      /* ===================================================
         MENSAJES
      =================================================== */

      function showStatus(
        message,
        error = false
      ) {

        if (!message) {

          $("status").innerHTML = "";

          return;

        }

        $("status").innerHTML =
          '<div class="message ' +
          (error ? "error" : "") +
          '">' +
          escapeHTML(message) +
          "</div>";

      }

      /* ===================================================
         FOTO
      =================================================== */

      function getPhoto(profile) {

        return (
          profile.foto_url ||
          "https://placehold.co/700x900/111d30/d7aa3f?text=EmiMatch"
        );

      }

      /* ===================================================
         INTERESES
      =================================================== */

      function getInterests(profile) {

        if (!profile.intereses) {
          return [];
        }

        if (
          Array.isArray(profile.intereses)
        ) {

          return profile.intereses;

        }

        return String(profile.intereses)
          .split(",")
          .map(
            item => item.trim()
          )
          .filter(Boolean);

      }

      /* ===================================================
         SIN PERFILES
      =================================================== */

      function renderEmpty() {

        $("profileContainer").innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              💫
            </div>

            <h2>
              No hay más perfiles
            </h2>

            <p>
              Probá ampliar el rango de edad
              o cambiar la ciudad para descubrir
              nuevas personas.
            </p>

          </div>

        `;

      }

      /* ===================================================
         MOSTRAR PERFIL
      =================================================== */

      function renderProfile() {

        if (
          !profiles.length ||
          currentIndex >= profiles.length
        ) {

          renderEmpty();

          return;

        }

        currentProfile =
          profiles[currentIndex];

        const interests =
          getInterests(
            currentProfile
          );

        const interestsHTML =
          interests
            .slice(0, 8)
            .map(
              interest =>
                `<span class="interest">
                  ${escapeHTML(interest)}
                </span>`
            )
            .join("");

        $("profileContainer").innerHTML = `

          <article class="profile-card">

            <div class="profile-photo">

              <img
                src="${escapeHTML(
                  getPhoto(
                    currentProfile
                  )
                )}"
                alt="Foto de ${escapeHTML(
                  currentProfile.nombre ||
                  "Usuario"
                )}"
                loading="lazy"
                onerror="
                  this.src='https://placehold.co/700x900/111d30/d7aa3f?text=EmiMatch';
                "
              >

              <div class="badges">

                <span class="badge">
                  💚 Disponible
                </span>

              </div>

              <div class="photo-overlay">

                <h2 class="profile-name">

                  ${escapeHTML(
                    currentProfile.nombre ||
                    "Usuario"
                  )}

                  ${
                    currentProfile.edad
                      ? ", " +
                        escapeHTML(
                          currentProfile.edad
                        )
                      : ""
                  }

                </h2>

                <div class="profile-city">

                  📍
                  ${escapeHTML(
                    currentProfile.ciudad ||
                    "Argentina"
                  )}

                </div>

              </div>

            </div>

            <div class="profile-info">

              <p class="profile-description">

                ${
                  currentProfile.descripcion
                    ? escapeHTML(
                        currentProfile.descripcion
                      )
                    : "Conocé más sobre esta persona en su perfil."
                }

              </p>

              <div class="interests">

                ${interestsHTML}

              </div>

            </div>

            <div class="actions">

              <button
                id="passButton"
                class="action pass"
                type="button"
                aria-label="Pasar"
                title="Pasar">

                ✕

              </button>

              <button
                id="blockButton"
                class="action block"
                type="button"
                aria-label="Bloquear"
                title="Bloquear">

                🚫

              </button>

              <button
                id="likeButton"
                class="action like"
                type="button"
                aria-label="Me gusta"
                title="Me gusta">

                ♥

              </button>

            </div>

          </article>

        `;

        $("passButton")
          .addEventListener(
            "click",
            () => swipe("pass")
          );

        $("likeButton")
          .addEventListener(
            "click",
            () => swipe("like")
          );

        $("blockButton")
          .addEventListener(
            "click",
            blockCurrentProfile
          );

      }

      /* ===================================================
         INICIALIZAR
      =================================================== */

      async function initialize() {

        if (
          !window.EMIMATCH_CONFIG
        ) {

          showStatus(
            "No se encontró la configuración de EmiMatch.",
            true
          );

          return;

        }

        if (
          !window.supabase ||
          !window.supabase.createClient
        ) {

          showStatus(
            "No se pudo cargar Supabase.",
            true
          );

          return;

        }

        db =
          window.supabase.createClient(
            window.EMIMATCH_CONFIG.supabaseUrl,
            window.EMIMATCH_CONFIG.supabaseKey
          );

        const {
          data,
          error
        } =
          await db.auth.getSession();

        if (error) {

          showStatus(
            "Error de sesión: " +
            error.message,
            true
          );

          return;

        }

        if (
          !data ||
          !data.session
        ) {

          window.location.replace(
            "index.html"
          );

          return;

        }

        currentUser =
          data.session.user;

        await loadProfiles();

      }

      /* ===================================================
         CARGAR PERFILES
      =================================================== */

      async function loadProfiles() {

        showStatus(
          "Buscando perfiles..."
        );

        currentIndex = 0;
        currentProfile = null;

        let minAge =
          Number(
            $("minAge").value
          ) || 18;

        let maxAge =
          Number(
            $("maxAge").value
          ) || 100;

        minAge =
          Math.max(
            18,
            Math.min(
              100,
              minAge
            )
          );

        maxAge =
          Math.max(
            18,
            Math.min(
              100,
              maxAge
            )
          );

        if (minAge > maxAge) {

          const temporary =
            minAge;

          minAge =
            maxAge;

          maxAge =
            temporary;

          $("minAge").value =
            minAge;

          $("maxAge").value =
            maxAge;

        }

        const city =
          $("cityFilter")
            .value
            .trim();

        /* ===============================================
           BLOQUEOS
        =============================================== */

        const {
          data: blocks,
          error: blocksError
        } =
          await db
            .from("user_blocks")
            .select(
              "blocked_id"
            )
            .eq(
              "blocker_id",
              currentUser.id
            );

        if (blocksError) {

          showStatus(
            "No se pudieron cargar los bloqueos: " +
            blocksError.message,
            true
          );

          return;

        }

        const blockedIds =
          new Set(
            (blocks || [])
              .map(
                row =>
                  row.blocked_id
              )
              .filter(Boolean)
          );

        /* ===============================================
           SWIPES
        =============================================== */

        const {
          data: swipes,
          error: swipesError
        } =
          await db
            .from("swipes")
            .select(
              "target_user_id, type"
            )
            .eq(
              "user_id",
              currentUser.id
            );

        if (swipesError) {

          showStatus(
            "No se pudieron cargar tus acciones: " +
            swipesError.message,
            true
          );

          return;

        }

        const swipedIds =
          new Set(
            (swipes || [])
              .map(
                row =>
                  row.target_user_id
              )
              .filter(Boolean)
          );

        /* ===============================================
           PROFILES
        =============================================== */

        let query =
          db
            .from("profiles")
            .select("*")
            .neq(
              "id",
              currentUser.id
            )
            .gte(
              "edad",
              minAge
            )
            .lte(
              "edad",
              maxAge
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );

        if (city) {

          query =
            query.ilike(
              "ciudad",
              "%" +
              city +
              "%"
            );

        }

        const {
          data,
          error
        } =
          await query;

        if (error) {

          showStatus(
            "No se pudieron cargar los perfiles: " +
            error.message,
            true
          );

          return;

        }

        /* ===============================================
           FILTRAR
        =============================================== */

        profiles =
          (data || [])
            .filter(
              profile => {

                if (
                  blockedIds.has(
                    profile.id
                  )
                ) {

                  return false;

                }

                if (
                  swipedIds.has(
                    profile.id
                  )
                ) {

                  return false;

                }

                return true;

              }
            );

        showStatus("");

        renderProfile();

      }

      /* ===================================================
         LIKE / PASS
      =================================================== */

      async function swipe(type) {

        if (
          !currentProfile
        ) {

          return;

        }

        const targetId =
          currentProfile.id;

        const {
          error
        } =
          await db
            .from("swipes")
            .upsert(
              {
                user_id:
                  currentUser.id,

                target_user_id:
                  targetId,

                type:
                  type
              },
              {
                onConflict:
                  "user_id,target_user_id"
              }
            );

        if (error) {

          showStatus(
            "No se pudo guardar la acción: " +
            error.message,
            true
          );

          return;

        }

        if (
          type === "like"
        ) {

          await checkMatch(
            targetId
          );

        }

        currentIndex++;

        renderProfile();

      }

      /* ===================================================
