<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descubrir - EmiMatch</title>

  <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>

<main class="em-container" style="padding-top:24px;max-width:650px">

  <!-- ENCABEZADO -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div>
      <h1 style="margin:0">💕 Descubrir</h1>
      <p class="em-muted" style="margin:4px 0 0">
        Encontrá nuevas conexiones.
      </p>
    </div>

    <button id="filterBtn" class="em-btn em-btn-secondary">
      ⚙️
    </button>
  </div>

  <!-- FILTROS -->
  <section id="filters" class="em-card" style="display:none;margin-bottom:16px">

    <div class="em-grid em-grid-2">

      <label>
        Edad mínima
        <input
          id="minAge"
          class="em-input"
          type="number"
          min="18"
          max="100"
          value="18">
      </label>

      <label>
        Edad máxima
        <input
          id="maxAge"
          class="em-input"
          type="number"
          min="18"
          max="100"
          value="100">
      </label>

    </div>

    <label>
      Ciudad
      <input
        id="city"
        class="em-input"
        type="text"
        placeholder="Todas las ciudades">
    </label>

    <button id="applyFilters" class="em-btn em-btn-primary">
      Aplicar filtros
    </button>

  </section>

  <!-- ESTADO -->
  <section id="status" class="em-card" style="text-align:center">
    🔎 Buscando perfiles...
  </section>

  <!-- PERFIL -->
  <section id="profile" class="em-card" style="display:none;padding:0;overflow:hidden">

    <img
      id="photo"
      src="https://placehold.co/600x700?text=EmiMatch"
      alt="Foto de perfil"
      style="width:100%;height:420px;object-fit:cover">

    <div style="padding:20px">

      <h2 id="name" style="margin:0"></h2>

      <p id="cityText" class="em-muted"></p>

      <p id="description"></p>

      <div id="interests" style="display:flex;flex-wrap:wrap;gap:7px"></div>

      <button
        id="block"
        class="em-btn em-btn-secondary"
        style="margin-top:16px">
        🚫 Bloquear
      </button>

    </div>

  </section>

  <!-- ACCIONES -->
  <div
    id="actions"
    style="display:none;justify-content:center;gap:20px;margin:20px 0">

    <button
      id="pass"
      class="em-btn em-btn-secondary"
      style="font-size:22px;border-radius:50%;width:60px;height:60px">
      ❌
    </button>

    <button
      id="info"
      class="em-btn em-btn-secondary"
      style="font-size:22px;border-radius:50%;width:60px;height:60px">
      ℹ️
    </button>

    <button
      id="like"
      class="em-btn em-btn-primary"
      style="font-size:22px;border-radius:50%;width:60px;height:60px">
      ❤️
    </button>

  </div>

</main>

<!-- MATCH -->
<div
  id="match"
  style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px">

  <div class="em-card" style="max-width:400px;width:100%;text-align:center">

    <h2>💕 ¡Hicieron Match!</h2>

    <p>
      Los dos se dieron Like.
    </p>

    <img
      id="matchPhoto"
      src=""
      alt="Match"
      style="
        width:100px;
        height:100px;
        object-fit:cover;
        border-radius:50%">

    <div style="display:grid;gap:10px;margin-top:20px">

      <button id="chat" class="em-btn em-btn-primary">
        💬 Enviar mensaje
      </button>

      <button id="continue" class="em-btn em-btn-secondary">
        Seguir descubriendo
      </button>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>

<script>
(() => {

  "use strict";

  const config = window.EMIMATCH_CONFIG;

  if (!config) {
    document.getElementById("status").textContent =
      "Error: no se pudo cargar EmiMatch.";
    return;
  }

  const db = window.supabase.createClient(
    config.supabaseUrl,
    config.supabaseKey
  );

  let user;
  let list = [];
  let current;

  const $ = id => document.getElementById(id);

  const show = (id, value) => {
    $(id).style.display = value;
  };

  async function load() {

    show("status", "block");
    show("profile", "none");
    show("actions", "none");

    $("status").textContent = "🔎 Buscando perfiles...";

    const min = Number($("minAge").value) || 18;
    const max = Number($("maxAge").value) || 100;
    const city = $("city").value.trim();

    try {

      const { data: blocks, error: blockError } =
        await db
          .from("user_blocks")
          .select("blocked_user_id")
          .eq("user_id", user.id);

      if (blockError) throw blockError;

      const blocked = new Set(
        (blocks || []).map(x => x.blocked_user_id)
      );

      const { data: swipes, error: swipeError } =
        await db
          .from("swipes")
          .select("target_user_id")
          .eq("user_id", user.id);

      if (swipeError) throw swipeError;

      const swiped = new Set(
        (swipes || []).map(x => x.target_user_id)
      );

      let query = db
        .from("profiles")
        .select(`
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          intereses
        `)
        .neq("id", user.id)
        .gte("edad", min)
        .lte("edad", max)
        .order("created_at", { ascending:false });

      if (city) {
        query = query.ilike("ciudad", `%${city}%`);
      }

      const { data, error } = await query;

      if (error) throw error;

      list = (data || []).filter(p =>
        !blocked.has(p.id) &&
        !swiped.has(p.id)
      );

      next();

    } catch (error) {

      console.error(error);

      $("status").textContent =
        "No se pudieron cargar los perfiles.";

    }
  }

  function next() {

    if (!list.length) {

      show("status", "block");
      show("profile", "none");
      show("actions", "none");

      $("status").textContent =
        "💕 No hay más perfiles disponibles.";

      return;
    }

    current = list[0];

    $("photo").src =
      current.foto_url ||
      "https://placehold.co/600x700?text=EmiMatch";

    $("name").textContent =
      `${current.nombre || "Usuario"}${current.edad ? ", " + current.edad : ""}`;

    $("cityText").textContent =
      current.ciudad || "Ciudad no indicada";

    $("description").textContent =
      current.descripcion || "Sin descripción.";

    $("interests").innerHTML = "";

    if (current.intereses) {

      current.intereses
        .split(",")
        .map(x => x.trim())
        .filter(Boolean)
        .slice(0,8)
        .forEach(item => {

          const tag = document.createElement("span");

          tag.textContent = item;

          tag.style.padding = "6px 10px";
          tag.style.borderRadius = "20px";
          tag.style.background = "rgba(255,255,255,.08)";
          tag.style.fontSize = "13px";

          $("interests").appendChild(tag);

        });
    }

    show("status", "none");
    show("profile", "block");
    show("actions", "flex");
  }

  async function swipe(action) {

    if (!current) return;

    const target = current;

    try {

      const { error } = await db
        .from("swipes")
        .insert({
          user_id:user.id,
          target_user_id:target.id,
          action
        });

      if (error) throw error;

      list.shift();

      if (action === "like") {

        const { data: reverse } =
          await db
            .from("swipes")
            .select("id")
            .eq("user_id",target.id)
            .eq("target_user_id",user.id)
            .eq("action","like")
            .maybeSingle();

        if (reverse) {

          const { data: existing } =
            await db
              .from("matches")
              .select("id")
              .or(
                `and(user1_id.eq.${user.id},user2_id.eq.${target.id}),and(user1_id.eq.${target.id},user2_id.eq.${user.id})`
              )
              .maybeSingle();

          if (!existing) {

            await db
              .from("matches")
              .insert({
                user1_id:user.id,
                user2_id:target.id
              });

          }

          $("matchPhoto").src =
            target.foto_url ||
            "https://placehold.co/200?text=💕";

          $("match").style.display = "flex";

          $("chat").onclick = () => {
            location.href =
              `conversacion.html?user=${encodeURIComponent(target.id)}`;
          };

        }

      }

      next();

    } catch(error) {

      console.error(error);

      alert(
        "No se pudo guardar la acción. Revisá los permisos de Supabase."
      );

    }
  }

  async function block() {

    if (!current) return;

    if (!confirm("¿Querés bloquear este perfil?")) return;

    try {

      const { error } = await db
        .from("user_blocks")
        .insert({
          user_id:user.id,
          blocked_user_id:current.id
        });

      if (error) throw error;

      list.shift();

      next();

    } catch(error) {

      console.error(error);

      alert("No se pudo bloquear el perfil.");

    }
  }

  $("filterBtn").onclick = () => {

    $("filters").style.display =
      $("filters").style.display === "none"
        ? "block"
        : "none";

  };

  $("applyFilters").onclick = load;

  $("pass").onclick = () => swipe("pass");

  $("like").onclick = () => swipe("like");

  $("block").onclick = block;

  $("info").onclick = () => {

    if (!current) return;

    alert(
      `${current.nombre || "Usuario"}\n\n` +
      `${current.descripcion || "Sin descripción."}`
    );

  };

  $("continue").onclick = () => {
    $("match").style.display = "none";
  };

  async function init() {

    const { data } = await db.auth.getSession();

    user = data.session?.user;

    if (!user) {

      location.href = "index.html";
      return;

    }

    await load();

  }

  init();

})();
</script>

<script src="assets/js/app.js"></script>
<script src="assets/js/components.js"></script>

</body>
</html>
