/* HEADER */

header{

.logo{

.logo-icon{

}

.logo-text{

}

header p{

}

/* CONTENEDOR */

.contenedor{
  width:calc(100% - 20px);
  max-width:560px;
  margin:auto;
}

/* FILTROS */

.filtros{
  padding:17px;
  border-radius:24px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 45px rgba(0,0,0,.25);
  backdrop-filter:blur(14px);
}

.filtros-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.filtros-titulo{
  display:flex;
  align-items:center;
  gap:10px;
}

.filtros-icono{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:rgba(212,175,55,.15);
  font-size:20px;
}

.filtros h2{
  margin:0;
  font-size:17px;
}

.filtros-sub{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px;
}

.fila{
  display:flex;
  gap:10px;
}

.campo{
  flex:1;
}

.campo-label{
  display:block;
  margin:0 0 6px 3px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

input,
select{
  width:100%;
  height:47px;
  padding:0 13px;
  border:0;
  outline:0;
  border-radius:14px;
  background:#fff;
  color:#111827;
  font-size:14px;
}

input:focus,
select:focus{
  box-shadow:0 0 0 3px rgba(212,175,55,.28);
}

.ciudad{
  margin-top:11px;
}

.btn-filtro{
  width:100%;
  height:48px;
  margin-top:12px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,var(--dorado),#f1d36a);
  color:var(--azul);
  font-size:14px;
  font-weight:900;
  box-shadow:0 8px 22px rgba(212,175,55,.2);
}

.btn-filtro:active{
  transform:scale(.98);
}

/* CONTADOR */

.contador{
  min-height:20px;
  margin:15px 0 10px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

/* ESTADOS */

.cargando,
.mensaje,
.error{
  margin-top:15px;
  padding:35px 22px;
  border-radius:24px;
  text-align:center;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
}

.cargando{
  color:var(--muted);
}

.mensaje-icon{
  font-size:45px;
}

.mensaje h2{
  margin:10px 0 7px;
  font-size:21px;
}

.mensaje p{
  margin:0;
  color:var(--muted);
  line-height:1.55;
  font-size:13px;
}

.error{
  background:rgba(239,68,68,.12);
  border-color:rgba(239,68,68,.4);
}

.error h3{

}

.error-detalle{
  margin-top:10px;

  font-size:11px;

}

/* TARJETA */

.tarjeta{
  overflow:hidden;
  background:#fff;
  color:var(--texto);
  border-radius:28px;
  box-shadow:0 25px 65px rgba(0,0,0,.4);
  animation:aparecer .25s ease;
}

@keyframes aparecer{
  from{
    opacity:0;
    transform:translateY(12px) scale(.99);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.foto-wrapper{
  position:relative;
  width:100%;
  height:470px;
  overflow:hidden;
  background:#e5e7eb;
}

.foto{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.sin-foto{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 30% 20%,#fff1a8,transparent 28%),
    linear-gradient(135deg,#b58b22,#f4df91);
  font-size:90px;
}

.foto-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:190px;
  background:linear-gradient(transparent,rgba(0,0,0,.68));
  pointer-events:none;
}

.estado{
  position:absolute;
  top:15px;
  left:15px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 11px;
  border-radius:999px;
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:10px;
  font-weight:800;
  backdrop-filter:blur(8px);
}

.estado-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#94a3b8;
}

.estado.online .estado-dot{
  background:var(--verde);
  box-shadow:0 0 0 3px rgba(34,197,94,.18);
}

.ubicacion-foto{
  position:absolute;
  left:18px;
  bottom:18px;
  color:white;
  font-size:12px;
  font-weight:700;
  z-index:2;
}

.datos{
  padding:20px 20px 14px;
}

.nombre{
  font-size:27px;
  line-height:1.15;
  font-weight:900;
  letter-spacing:-.4px;
}

.info{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  color:var(--gris);
  font-size:13px;
}

.descripcion{
  margin-top:15px;
  color:#303846;
  font-size:14px;
  line-height:1.6;
}

.intereses{
  margin-top:13px;
  padding:11px 12px;
  border-radius:13px;
  background:#f8fafc;
  color:#173d7a;
  font-size:12px;
  font-weight:700;
  line-height:1.5;
}

/* ACCIONES */

.acciones{
  display:flex;

  padding:4px 20px 17px;
}

.accion{
  flex:1;
  height:59px;
  border:0;
  border-radius:18px;
  font-size:24px;
  font-weight:900;
  transition:.15s ease;
}

.accion:active{
  transform:scale(.94);
}

.btn-no{
  background:#f1f5f9;
  color:#334155;
  box-shadow:inset 0 0 0 1px #e2e8f0;
}

.btn-si{
  background:linear-gradient(135deg,var(--rosa),var(--rosa2));
  color:#fff;
  box-shadow:0 9px 22px rgba(225,29,72,.25);
}

.accion small{
  display:block;
  margin-top:-1px;
  font-size:9px;
  opacity:.72;
}

.btn-bloquear{
  width:calc(100% - 40px);
  height:42px;
  margin:0 20px 20px;
  border:1px solid #fecaca;
  border-radius:13px;
  background:#fff7f8;
  color:var(--rosa2);
  font-size:12px;
  font-weight:800;
}

.btn-bloquear:active{
  transform:scale(.98);
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:91px;
  z-index:2000;
  display:none;
  transform:translateX(-50%);
  width:max-content;
  max-width:calc(100% - 28px);
  padding:12px 17px;
  border-radius:14px;
  background:#111827;
  color:#fff;
  font-size:13px;
  font-weight:700;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

/* NAV */

.nav{
  position:fixed;
  left:9px;
  right:9px;
  bottom:9px;
  height:68px;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 4px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:23px;
  background:rgba(5,17,38,.97);
  box-shadow:0 10px 35px rgba(0,0,0,.5);
  backdrop-filter:blur(15px);
}

.nav a{

  text-decoration:none;

}

.nav a span{
  display:block;
  margin-bottom:3px;
  font-size:21px;
}

.nav a.activo{
  color:var(--dorado);
}

.badge{
  position:absolute;
  top:-5px;
  right:0;
  display:none;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:18px;
  padding:0 4px;
  border-radius:999px;
  background:var(--rojo);
  color:#fff;
  font-size:9px;
  font-weight:900;

}

/* DESKTOP */

@media(min-width:700px){
  .contenedor{
    max-width:570px;
  }

  .foto-wrapper{
    height:510px;
  }
}

@media(max-width:380px){
  .contenedor{
    width:calc(100% - 16px);
  }

  .foto-wrapper{
    height:390px;
  }

  .nombre{
    font-size:24px;
  }

  .nav a{
    min-width:47px;
    font-size:8px;
  }

  .nav a span{
    font-size:19px;
  }
}

</div>

  </div>  <div class="fila"><div class="campo">

    Notificaciones
    <b id="badge" class="badge">0</b>
  </a></nav><script>
const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let usuarioActual = null;
let perfiles = [];
let perfilesFiltrados = [];
let indiceActual = 0;
let bloqueados = new Set();
let swipesRealizados = new Set();

const $ = id =>
  document.getElementById(id);

const contenido = $("contenido");
const contador = $("contador");
const ciudadSelect = $("ciudad");
const edadMin = $("edadMin");
const edadMax = $("edadMax");
const toast = $("toast");

document.addEventListener(
  "DOMContentLoaded",
  iniciar
);

$("btnFiltros").addEventListener(
  "click",
  aplicarFiltros
);

/* =========================
   INICIAR
========================= */

async function iniciar(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if(error){
      throw error;
    }

    if(!data.session){

      window.location.href =
        "index.html";

      return;
    }

    usuarioActual =
      data.session.user;

    await cargarPerfiles();
    await cargarNotificaciones();

  }catch(error){

    console.error(error);

    mostrarError(
      "No se pudo iniciar Descubrir.",
      error
    );
  }
}

/* =========================
   PERFILES
========================= */

async function cargarPerfiles(){

  contenido.innerHTML = `
    <div class="cargando">
      🔎 Buscando personas...
    </div>
  `;

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(`
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          intereses,
          online,
          last_seen
        `);

    if(error){
      throw error;
    }

    perfiles =
      data || [];

    await cargarBloqueados();
    await cargarSwipes();

    prepararCiudades();
    aplicarFiltros();

  }catch(error){

    console.error(error);

    mostrarError(
      "No se pudieron cargar los perfiles.",
      error
    );
  }
}

/* =========================
   BLOQUEADOS
========================= */

async function cargarBloqueados(){

  bloqueados =
    new Set();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_blocks")
      .select("blocked_id")
      .eq(
        "blocker_id",
        usuarioActual.id
      );

  if(error){

    console.warn(
      "Bloqueos:",
      error
    );

    return;
  }

  (data || []).forEach(item => {

    bloqueados.add(
      item.blocked_id
    );

  });
}

/* =========================
   SWIPES
========================= */

async function cargarSwipes(){

  swipesRealizados =
    new Set();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("swipes")
      .select("target_user_id")
      .eq(
        "user_id",
        usuarioActual.id
      );

  if(error){

    console.warn(
      "Swipes:",
      error
    );

    return;
  }

  (data || []).forEach(item => {

    swipesRealizados.add(
      item.target_user_id
    );

  });
}

/* =========================
   CIUDADES
========================= */

function prepararCiudades(){

  const ciudades =
    [
      ...new Set(
        perfiles
          .map(
            perfil => perfil.ciudad
          )
          .filter(Boolean)
      )
    ]
    .sort(
      (a,b) =>
        a.localeCompare(b)
    );

  ciudadSelect.innerHTML = `
    <option value="">
      Todas las ciudades
    </option>
  `;

  ciudades.forEach(ciudad => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      ciudad;

    option.textContent =
      ciudad;

    ciudadSelect.appendChild(
      option
    );
  });
}

/* =========================
   FILTROS
========================= */

function aplicarFiltros(){

  const min =
    parseInt(
      edadMin.value,
      10
    );

  const max =
    parseInt(
      edadMax.value,
      10
    );

  const ciudad =
    ciudadSelect.value
      .trim()
      .toLowerCase();

  if(
    !Number.isNaN(min) &&
    !Number.isNaN(max) &&
    min > max
  ){

    mostrarToast(
      "La edad mínima no puede ser mayor que la máxima."
    );

    return;
  }

  perfilesFiltrados =
    perfiles.filter(perfil => {

      if(
        perfil.id ===
        usuarioActual.id
      ){
        return false;
      }

      if(
        bloqueados.has(
          perfil.id
        )
      ){
        return false;
      }

      if(
        swipesRealizados.has(
          perfil.id
        )
      ){
        return false;
      }

      if(
        !Number.isNaN(min) &&
        (
          perfil.edad == null ||
          perfil.edad < min
        )
      ){
        return false;
      }

      if(
        !Number.isNaN(max) &&
        (
          perfil.edad == null ||
          perfil.edad > max
        )
      ){
        return false;
      }

      if(
        ciudad &&
        String(
          perfil.ciudad || ""
        )
        .trim()
        .toLowerCase() !== ciudad
      ){
        return false;
      }

      return true;
    });

  indiceActual = 0;

  actualizarContador();

  mostrarPerfilActual();
}

/* =========================
   CONTADOR
========================= */

function actualizarContador(){

  const total =
    perfilesFiltrados.length;

  if(total === 0){

    contador.textContent =
      "";

    return;
  }

  contador.textContent =
    `${total} perfil${total === 1 ? "" : "es"} disponible${total === 1 ? "" : "s"}`;
}

/* =========================
   PERFIL ACTUAL
========================= */

function mostrarPerfilActual(){

  if(
    indiceActual >=
    perfilesFiltrados.length
  ){

    contenido.innerHTML = `
      <div class="mensaje">

        <div class="mensaje-icon">
          💕
        </div>

        <h2>
          No hay más perfiles
        </h2>

        <p>
          Probá cambiar los filtros
          o volvé más tarde para
          descubrir nuevas personas.
        </p>

      </div>
    `;

    contador.textContent =
      "No quedan perfiles para mostrar.";

    return;
  }

  const perfil =
    perfilesFiltrados[
      indiceActual
    ];

  const online =
    perfil.online === true;

  const foto =
    perfil.foto_url &&
    String(
      perfil.foto_url
    ).trim();

  const nombre =
    escapar(
      perfil.nombre ||
      "Usuario"
    );

  const ciudad =
    escapar(
      perfil.ciudad ||
      "Ciudad no indicada"
    );

  const descripcion =
    escapar(
      perfil.descripcion ||
      "Sin descripción."
    );

  const intereses =
    escapar(
      perfil.intereses ||
      "Sin intereses indicados."
    );

  contenido.innerHTML = `

    <article class="tarjeta">

      <div class="foto-wrapper">

        ${
          foto
          ?
          `
          <img
            class="foto"
            src="${escapar(foto)}"
            alt="Foto de ${nombre}"
            loading="eager"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
          >
          <div
            class="sin-foto"
            style="display:none;"
          >
            👤
          </div>
          `
          :
          `
          <div class="sin-foto">
            👤
          </div>
          `
        }

        <div class="foto-overlay"></div>

        <div class="estado ${online ? "online" : ""}">

          <span class="estado-dot"></span>

          ${
            online
            ? "En línea"
            : "No disponible"
          }

        </div>

        <div class="ubicacion-foto">
          📍 ${ciudad}
        </div>

      </div>

      <div class="datos">

        <div class="nombre">
          ${nombre}${perfil.edad ? `, ${perfil.edad}` : ""}
        </div>

        <div class="info">
          📍 ${ciudad}
        </div>

        <div class="descripcion">
          ${descripcion}
        </div>

        <div class="intereses">
          ❤️ ${intereses}
        </div>

      </div>

      <div class="acciones">

        <button
          class="accion btn-no"
          onclick="registrarSwipe('pass')"
        >
          ❌
          <small>Pasar</small>
        </button>

        <button
          class="accion btn-si"
          onclick="registrarSwipe('like')"
        >
          ❤️
          <small>Me gusta</small>
        </button>

      </div>

      <button
        class="btn-bloquear"
        onclick="bloquearPerfil()"
      >
        🚫 Bloquear perfil
      </button>

    </article>
  `;

  actualizarContador();
}

/* =========================
   LIKE / PASS
========================= */

async function registrarSwipe(action){

  const perfil =
    perfilesFiltrados[
      indiceActual
    ];

  if(!perfil){
    return;
  }

  const botones =
    document.querySelectorAll(
      ".accion"
    );

  botones.forEach(
    boton =>
      boton.disabled = true
  );

  try{

    const {
      error
    } =
      await supabaseClient
        .from("swipes")
        .upsert(
          {
            user_id:
              usuarioActual.id,

            target_user_id:
              perfil.id,

            action:
              action
          },
          {
            onConflict:
              "user_id,target_user_id"
          }
        );

    if(error){
      throw error;
    }

    swipesRealizados.add(
      perfil.id
    );

    if(action === "like"){

      await comprobarMatch(
        perfil.id
      );
    }

    indiceActual++;

    actualizarContador();

    mostrarPerfilActual();

  }catch(error){

    console.error(error);

    mostrarToast(
      "No se pudo guardar tu elección."
      );

    botones.forEach(
      boton =>
        boton.disabled = false
    );
  }
}

/* =========================
   MATCH
========================= */

async function comprobarMatch(
  otroUsuarioId
){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("matches")
        .select("id")
        .or(
          `and(user1_id.eq.${usuarioActual.id},user2_id.eq.${otroUsuarioId}),and(user1_id.eq.${otroUsuarioId},user2_id.eq.${usuarioActual.id})`
        )
        .limit(1);

    if(error){
      console.warn(
        "Match:",
        error
      );
      return;
    }

    if(
      data &&
      data.length
    ){

      mostrarToast(
        "💕 ¡Es un Match! Pueden comenzar a hablar."
      );

      return;
    }

    mostrarToast(
      "❤️ Me gusta enviado"
    );

  }catch(error){

    console.warn(
      "Comprobar match:",
      error
    );
  }
}

/* =========================
   BLOQUEAR
========================= */

async function bloquearPerfil(){

  const perfil =
    perfilesFiltrados[
      indiceActual
    ];

  if(!perfil){
    return;
  }

  const confirmar =
    confirm(
      `¿Querés bloquear a ${
        perfil.nombre || "este usuario"
      }?`
    );

  if(!confirmar){
    return;
  }

  try{

    const {
      error
    } =
      await supabaseClient
        .from("user_blocks")
        .insert({
          blocker_id:
            usuarioActual.id,

          blocked_id:
            perfil.id
        });

    if(error){

      if(
        error.code ===
        "23505"
      ){

        mostrarToast(
          "Este usuario ya está bloqueado."
        );

      }else{

        throw error;
      }

    }else{

      bloqueados.add(
        perfil.id
      );

      swipesRealizados.add(
        perfil.id
      );

      mostrarToast(
        "🚫 Perfil bloqueado"
      );
    }

    indiceActual++;

    mostrarPerfilActual();

  }catch(error){

    console.error(error);

    mostrarToast(
      "No se pudo bloquear el perfil."
    );
  }
}

/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones(){

  try{

    const {
      data: matches,
      error: matchError
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );

    if(matchError){
      throw matchError;
    }

    if(
      !matches ||
      matches.length === 0
    ){

      actualizarBadge(0);

      return;
    }

    const matchIds =
      matches.map(
        match => match.id
      );

    const {
      data: mensajes,
      error: mensajesError
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id,match_id,sender_id,read_at"
        )
        .in(
          "match_id",
          matchIds
        )
        .neq(
          "sender_id",
          usuarioActual.id
        )
        .is(
          "read_at",
          null
        );

    if(mensajesError){
      throw mensajesError;
    }

    actualizarBadge(
      mensajes
        ? mensajes.length
        : 0
    );

  }catch(error){

    console.warn(
      "Notificaciones:",
      error
    );

    actualizarBadge(0);
  }
}

/* =========================
   BADGE
========================= */

function actualizarBadge(
  cantidad
){

  const badge =
    $("badge");

  if(!badge){
    return;
  }

  if(cantidad > 0){

    badge.style.display =
      "flex";

    badge.textContent =
      cantidad > 99
      ? "99+"
      : cantidad;

  }else{

    badge.style.display =
      "none";
  }
}

/* =========================
   TOAST
========================= */

let toastTimer = null;

function mostrarToast(
  mensaje
){

  toast.textContent =
    mensaje;

  toast.style.display =
    "block";

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {
        toast.style.display =
          "none";
      },
      2600
    );
}

/* =========================
   ERROR
========================= */

function mostrarError(
  titulo,
  error
){

  contenido.innerHTML = `

    <div class="error">

      <h3>
        ⚠️ ${escapar(titulo)}
      </h3>

      ${
        error
        ?
        `
        <div class="error-detalle">
          ${escapar(
            error.message ||
            String(error)
          )}
        </div>
        `
        :
        ""
      }

    </div>
  `;
}

/* =========================
   SEGURIDAD HTML
========================= */

function escapar(valor){

  return String(
    valor ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}
