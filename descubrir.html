<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #102c5c);
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 22px 18px;
      text-align: center;
      background: rgba(0, 0, 0, 0.25);

    .volver {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;

    .fila {

    .fila > div {
      flex: 1;
    }

    label {

      font-size: 14px;

    .foto {

      height: 380px;
      object-fit: cover;
      display: block;
      background: #172a4e;
    }

    .info {
      padding: 18px;
    }

    .nombre {
      font-size: 24px;
      font-weight: bold;
    }

    .datos {
      margin-top: 7px;
      color: #cbd6e8;
    }

    .descripcion {
      margin-top: 13px;
      line-height: 1.5;
    }

    .intereses {
      margin-top: 13px;
      color: #d4af37;
      line-height: 1.5;
    }

    .online-badge,
    .offline-badge {
      display: inline-block;
      margin-top: 9px;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .online-badge {
      background: rgba(46,204,113,.18);
      color: #5cff9b;
    }

    .offline-badge {
      background: rgba(255,255,255,.12);
      color: #cbd6e8;
    }

    .acciones {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .accion {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .accion:disabled {
      opacity: .5;
    }

    .like {
      background: #d4af37;
      color: #111;
    }

    .pass {
      background: #e74c3c;
      color: #fff;
    }

    .menu {
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 10;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.75);
      color: #fff;
      font-size: 23px;
      cursor: pointer;
    }

    .menu-opciones {
      display: none;
      position: absolute;
      right: 0;
      top: 48px;
      width: 220px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .menu-opciones button {
      width: 100%;
      border: 0;
      background: #fff;
      color: #111;
      padding: 14px;
      text-align: left;
      cursor: pointer;
    }

    .modal-fondo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: #fff;
      color: #111;
      border-radius: 18px;
      padding: 20px;
    }

    .modal select,
    .modal textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .modal textarea {
      min-height: 100px;
      resize: vertical;
    }

    .modal-botones {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .modal-botones button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancelar {
      background: #ddd;
    }

    .confirmar {
      background: #d4af37;
      color: #111;
    }

    @media (max-width: 500px) {
      .foto {
        height: 340px;
      }

      .fila,
      .botones {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🔎 Descubrir</h1>
  <p>Encontrá personas compatibles con vos</p>
</header>

<div class="contenedor">

  <button
    class="volver"
    type="button"
    onclick="window.location.href='perfil.html'">
    ← Volver a mi perfil
  </button>

  <div class="filtros">

    <h2>🎯 Filtrar perfiles</h2>

    <div class="fila">

      <div>
        <label for="edadMin">
          Edad mínima
        </label>

        <input
          id="edadMin"
          type="number"
          min="18"
          max="100"
          value="18">
      </div>

      <div>
        <label for="edadMax">
          Edad máxima
        </label>

        <input
          id="edadMax"
          type="number"
          min="18"
          max="100"
          value="80">
      </div>

    </div>

    <label for="ciudad">
      📍 Ciudad
    </label>

    <input
      id="ciudad"
      type="text"
      placeholder="Buenos Aires">

    <label for="intereses">
      ❤️ Intereses
    </label>

    <input
      id="intereses"
      type="text"
      placeholder="Ej: fútbol, música, viajes">

    <label class="online">

      <input
        id="soloOnline"
        type="checkbox">

      🟢 Mostrar solamente personas online

    </label>

    <div class="botones">

      <button
        id="btnAplicar"
        class="boton aplicar"
        type="button">
        🔎 Aplicar filtros
      </button>

      <button
        id="btnLimpiar"
        class="boton limpiar"
        type="button">
        🧹 Limpiar
      </button>

    </div>

  </div>

  <div id="estado" class="estado">
    ⏳ Cargando EmiMatch...
  </div>

  <div id="lista"></div>

</div>

<!-- MODAL DENUNCIA -->

<div
  id="modalFondo"
  class="modal-fondo">

  <div class="modal">

    <h2>⚠️ Denunciar usuario</h2>

    <p>
      Seleccioná el motivo.
    </p>

    <select id="motivo">

      <option value="Acoso">
        Acoso
      </option>

      <option value="Perfil falso">
        Perfil falso
      </option>

      <option value="Contenido inapropiado">
        Contenido inapropiado
      </option>

      <option value="Estafa">
        Estafa
      </option>

      <option value="Comportamiento ofensivo">
        Comportamiento ofensivo
      </option>

      <option value="Otro">
        Otro
      </option>

    </select>

    <textarea
      id="detalles"
      placeholder="Detalles adicionales (opcional)">
    </textarea>

    <div class="modal-botones">

      <button
        id="btnCancelar"
        class="cancelar"
        type="button">
        Cancelar
      </button>

      <button
        id="btnDenunciar"
        class="confirmar"
        type="button">
        Denunciar
      </button>

    </div>

  </div>

</div>

<script>

"use strict";

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;
let usuarioDenuncia = null;

/* ==========================================
   ELEMENTOS
========================================== */

const estado =
  document.getElementById("estado");

const lista =
  document.getElementById("lista");

const edadMin =
  document.getElementById("edadMin");

const edadMax =
  document.getElementById("edadMax");

const ciudad =
  document.getElementById("ciudad");

const intereses =
  document.getElementById("intereses");

const soloOnline =
  document.getElementById("soloOnline");

/* ==========================================
   ESCAPAR HTML
========================================== */

function escapar(valor) {

  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

/* ==========================================
   OBTENER SESIÓN
========================================== */

async function obtenerSesion() {

  const resultado =
    await supabaseClient.auth.getSession();

  if (resultado.error) {
    throw resultado.error;
  }

  if (!resultado.data.session) {

    window.location.href =
      "index.html";

    return null;
  }

  return resultado.data.session;
}

/* ==========================================
   OBTENER BLOQUEADOS
========================================== */

async function obtenerBloqueados() {

  const resultado =
    await supabaseClient
      .from("user_blocks")
      .select(
        "blocker_id,blocked_id"
      )
      .or(
        "blocker_id.eq." +
        usuarioActual.id +
        ",blocked_id.eq." +
        usuarioActual.id
      );

  if (resultado.error) {
    throw resultado.error;
  }

  const set =
    new Set();

  for (
    const fila of resultado.data || []
  ) {

    if (
      fila.blocker_id ===
      usuarioActual.id
    ) {

      set.add(
        fila.blocked_id
      );
    }

    if (
      fila.blocked_id ===
      usuarioActual.id
    ) {

      set.add(
        fila.blocker_id
      );
    }

  }

  return set;
}

/* ==========================================
   CARGAR PERFILES
========================================== */

async function cargarPerfiles() {

  estado.innerHTML =
    "⏳ Cargando perfiles...";

  lista.innerHTML = "";

  try {

    const session =
      await obtenerSesion();

    if (!session) {
      return;
    }

    usuarioActual =
      session.user;

    /* BLOQUEADOS */

    const bloqueados =
      await obtenerBloqueados();

    /* SWIPES */

    const swipes =
      await supabaseClient
        .from("swipes")
        .select(
          "target_user_id"
        )
        .eq(
          "user_id",
          usuarioActual.id
        );

    if (swipes.error) {
      throw swipes.error;
    }

    const vistos =
      new Set(
        (swipes.data || [])
          .map(
            fila =>
              fila.target_user_id
          )
      );

    /* PERFILES */

    const perfilesResultado =
      await supabaseClient
        .from("profiles")
        .select("*")
        .neq(
          "id",
          usuarioActual.id
        );

    if (perfilesResultado.error) {
      throw perfilesResultado.error;
    }

    const perfiles =
      perfilesResultado.data || [];

    /* FILTROS */

    const minimo =
      Number(edadMin.value) || 18;

    const maximo =
      Number(edadMax.value) || 80;

    const ciudadBuscada =
      ciudad.value
        .trim()
        .toLowerCase();

    const interesesBuscados =
      intereses.value
        .trim()
        .toLowerCase()
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);

    const mostrarOnline =
      soloOnline.checked;

    /* APLICAR */

    const disponibles =
      perfiles.filter(
        perfil => {

          if (
            bloqueados.has(
              perfil.id
            )
          ) {
            return false;
          }

          if (
            vistos.has(
              perfil.id
            )
          ) {
            return false;
          }

          const edadPerfil =
            Number(
              perfil.edad
            );

          if (
            Number.isFinite(
              edadPerfil
            )
          ) {

            if (
              edadPerfil < minimo ||
              edadPerfil > maximo
            ) {

              return false;
            }
          }

          if (ciudadBuscada) {

            const ciudadPerfil =
              String(
                perfil.ciudad || ""
              ).toLowerCase();

            if (
              !ciudadPerfil.includes(
                ciudadBuscada
              )
            ) {

              return false;
            }
          }

          if (
            interesesBuscados.length
          ) {

            const interesesPerfil =
              String(
                perfil.intereses || ""
              ).toLowerCase();

            const coincide =
              interesesBuscados.some(
                interes =>
                  interesesPerfil.includes(
                    interes
                  )
              );

            if (!coincide) {
              return false;
            }
          }

          if (
            mostrarOnline &&
            perfil.online !== true
          ) {

            return false;
          }

          return true;
        }
      );

    estado.innerHTML = "";

    if (
      disponibles.length === 0
    ) {

      estado.innerHTML = `
        💕 <strong>
        No encontramos perfiles nuevos.
        </strong>

        <br><br>

        Probá cambiar los filtros
        o volvé más tarde.
      `;

      return;
    }

    disponibles.forEach(
      crearTarjeta
    );

  } catch (error) {

    console.error(
      "EmiMatch:",
      error
    );

    estado.innerHTML = `
      <div class="error">

        ❌ <strong>
        Error al cargar perfiles
        </strong>

        <br><br>

        ${escapar(
          error.message ||
          "Error desconocido"
        )}

      </div>
    `;
  }
}

/* ==========================================
   CREAR TARJETA
========================================== */

function crearTarjeta(perfil) {

  const card =
    document.createElement("div");

  card.className =
    "card";

  card.dataset.userId =
    perfil.id;

  const nombre =
    escapar(
      perfil.nombre ||
      "Usuario"
    );

  const edad =
    perfil.edad
      ? ", " + escapar(perfil.edad)
      : "";

  const ciudadPerfil =
    escapar(
      perfil.ciudad ||
      "Ciudad no indicada"
    );

  const descripcion =
    escapar(
      perfil.descripcion ||
      "Sin descripción."
    );

  const interesesPerfil =
    escapar(
      perfil.intereses ||
      "Sin intereses indicados."
    );

  const foto =
    escapar(
      perfil.foto_url ||
      "https://via.placeholder.com/600x600?text=EmiMatch"
    );

  const online =
    perfil.online === true;

  card.innerHTML = `

    <div class="menu">

      <button
        class="menu-btn"
        type="button"
        data-menu>
        ⋮
      </button>

      <div class="menu-opciones">

        <button
          type="button"
          data-bloquear>
          🚫 Bloquear usuario
        </button>

        <button
          type="button"
          data-denunciar>
          ⚠️ Denunciar usuario
        </button>

      </div>

    </div>

    <img
      class="foto"
      src="${foto}"
      alt="Foto de ${nombre}"
      onerror="
        this.onerror=null;
        this.src='https://via.placeholder.com/600x600?text=EmiMatch';
      ">

    <div class="info">

      <div class="nombre">
        ${nombre}${edad}
      </div>

      <div class="datos">
        📍 ${ciudadPerfil}
      </div>

      ${
        online

        ? `
          <span class="online-badge">
            🟢 En línea
          </span>
        `

        : `
          <span class="offline-badge">
            ⚪ Desconectado
          </span>
        `
      }

      <div class="descripcion">
        ${descripcion}
      </div>

      <div class="intereses">
        ❤️ ${interesesPerfil}
      </div>

      <div class="acciones">

        <button
          class="accion pass"
          type="button"
          data-action="pass">
          ❌ Pasar
        </button>

        <button
          class="accion like"
          type="button"
          data-action="like">
          ❤️ Me gusta
        </button>

      </div>

    </div>
  `;

  lista.appendChild(card);
}

/* ==========================================
   LIKE / PASS
========================================== */

async function registrarSwipe(
  targetId,
  action,
  boton
) {

  boton.disabled = true;

  const resultado =
    await supabaseClient
      .from("swipes")
      .insert({

        user_id:
          usuarioActual.id,

        target_user_id:
          targetId,

        action:
          action

      });

  if (
    resultado.error &&
    resultado.error.code !== "23505"
  ) {

    console.error(
      resultado.error
    );

    alert(
      "No se pudo registrar la acción."
    );

    boton.disabled = false;

    return;
  }

  if (
    action === "like"
  ) {

    const match =
      await supabaseClient
        .from("matches")
        .select("id")
        .or(
          "and(user1_id.eq." +
          usuarioActual.id +
          ",user2_id.eq." +
          targetId +
          "),and(user1_id.eq." +
          targetId +
          ",user2_id.eq." +
          usuarioActual.id +
          ")"
        )
        .limit(1);

    if (
      !match.error &&
      match.data &&
      match.data.length > 0
    ) {

      alert(
        "💕 ¡Es un Match!"
      );

    } else {

      alert(
        "❤️ Me gusta enviado."
      );
    }
  }

  const card =
    boton.closest(".card");

  if (card) {
    card.remove();
  }
}

/* ==========================================
   BLOQUEAR
========================================== */

async function bloquearUsuario(
  targetId,
  card
) {

  if (
    !confirm(
      "¿Querés bloquear a este usuario?"
    )
  ) {
    return;
  }

  const resultado =
    await supabaseClient
      .from("user_blocks")
      .insert({

        blocker_id:
          usuarioActual.id,

        blocked_id:
          targetId

      });

  if (
    resultado.error &&
    resultado.error.code !== "23505"
  ) {

    alert(
      "No se pudo bloquear:\n" +
      resultado.error.message
    );

    return;
  }

  card.remove();

  alert(
    "🚫 Usuario bloqueado."
  );
}

/* ==========================================
   ABRIR DENUNCIA
========================================== */

function abrirDenuncia(
  targetId
) {

  usuarioDenuncia =
    targetId;

  document.getElementById(
    "modalFondo"
  ).style.display =
    "flex";
}

/* =============================
