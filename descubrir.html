<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Descubrir - EmiMatch</title>

<link rel="stylesheet" href="assets/css/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>

<style>
.discovery{
  max-width:620px;
  margin:auto;
  padding:24px 14px 30px;
}

.discovery-hero{
  text-align:center;
  margin:8px 0 22px;
}

.discovery-hero .icon{
  width:58px;
  height:58px;
  margin:0 auto 12px;
  display:grid;
  place-items:center;
  border-radius:18px;
  background:linear-gradient(135deg,var(--em-primary),var(--em-accent));
  color:#07111f;
  font-size:27px;
  box-shadow:0 12px 30px #0004;
}

.discovery-hero h1{
  margin:0;
  font-size:1.8rem;
}

.discovery-hero p{
  margin:7px 0 0;
  color:var(--em-muted);
}

.filters{
  padding:17px;
  margin-bottom:18px;
  border:1px solid #ffffff0d;
}

.filters-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.filters-head h3{
  margin:0;
}

.filter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.filter-city{
  margin-top:10px;
}

.filter-action{
  width:100%;
  margin-top:12px;
}

.profile-card{
  overflow:hidden;
  border:1px solid #ffffff10;
  box-shadow:0 18px 45px #0005;
}

.profile-photo-wrap{
  position:relative;
  background:#0c1829;
}

.profile-photo{
  width:100%;
  height:470px;
  display:block;
  object-fit:cover;
}

.profile-gradient{
  position:absolute;
  inset:auto 0 0;
  height:150px;
  background:linear-gradient(transparent,#07111fee);
  pointer-events:none;
}

.profile-info{
  position:relative;
  padding:20px;
  margin-top:-42px;
}

.profile-name{
  font-size:1.65rem;
  font-weight:900;
  line-height:1.2;
}

.profile-city{
  color:var(--em-muted);
  margin:6px 0 14px;
}

.profile-description{
  line-height:1.55;
  margin-bottom:14px;
}

.interests{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:18px;
}

.interest{
  padding:6px 10px;
  border-radius:999px;
  background:#ffffff0a;
  border:1px solid #ffffff10;
  color:var(--em-text);
  font-size:.78rem;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1.25fr;
  gap:10px;
}

.action-pass,
.action-like,
.action-block{
  border:0;
  min-height:48px;
  border-radius:14px;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
}

.action-pass{
  background:#ffffff0b;
  color:var(--em-text);
  border:1px solid #ffffff12;
}

.action-like{
  background:linear-gradient(135deg,#f472b6,#db2777);
  color:#fff;
  box-shadow:0 10px 25px #db277733;
}

.action-pass:hover,
.action-like:hover,
.action-block:hover{
  transform:translateY(-1px);
}

.action-block{
  width:100%;
  margin-top:10px;
  min-height:40px;
  background:transparent;
  color:#fca5a5;
  font-size:.82rem;
}

.state{
  padding:35px 20px;
  text-align:center;
}

.state-icon{
  font-size:38px;
  margin-bottom:8px;
}

.state h3{
  margin:0 0 7px;
}

.state p{
  color:var(--em-muted);
  margin:0;
  line-height:1.5;
}

.match-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  place-items:center;
  padding:18px;
  background:#020611dd;
  backdrop-filter:blur(8px);
}

.match-box{
  width:min(410px,100%);
  padding:28px 20px;
  text-align:center;
  border:1px solid #ffffff15;
}

.match-icon{
  font-size:42px;
  margin-bottom:5px;
}

.match-box h2{
  margin:0;
}

.match-box p{
  color:var(--em-muted);
}

.match-photos{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin:22px 0;
}

.match-photos img{
  width:92px;
  height:92px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid var(--em-primary);
  box-shadow:0 8px 25px #0005;
}

.match-heart{
  font-size:24px;
}

.match-box button{
  width:100%;
  margin-top:9px;
}

@media(max-width:500px){
  .discovery{
    padding:18px 12px 25px;
  }

  .profile-photo{
    height:390px;
  }

  .filter-grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<main class="discovery">

  <header class="discovery-hero">
    <div class="icon">💕</div>
    <h1>Descubrir</h1>
    <p>Personas que podrían conectar con vos.</p>
  </header>

  <section class="em-card filters">

    <div class="filters-head">
      <h3>🔎 Filtros</h3>
      <span class="em-badge">Preferencias</span>
    </div>

    <div class="filter-grid">

      <div>
        <label for="edadMin">Edad mínima</label>
        <input
          id="edadMin"
          class="em-input"
          type="number"
          min="18"
          max="100"
          value="18">
      </div>

      <div>
        <label for="edadMax">Edad máxima</label>
        <input
          id="edadMax"
          class="em-input"
          type="number"
          min="18"
          max="100"
          value="100">
      </div>

    </div>

    <div class="filter-city">
      <label for="ciudadFiltro">Ciudad</label>
      <input
        id="ciudadFiltro"
        class="em-input"
        type="text"
        placeholder="Ej. Buenos Aires">
    </div>

    <button
      id="filtrarButton"
      class="em-btn em-btn-primary filter-action">
      🔎 Aplicar filtros
    </button>

  </section>

  <section id="estado" class="em-card state">
    <div class="state-icon">✨</div>
    <h3>Buscando personas</h3>
    <p>Estamos preparando tus perfiles...</p>
  </section>

  <section id="perfiles"></section>

</main>

<!-- MATCH -->

<div id="modalMatch" class="match-modal">

  <div class="em-card match-box">

    <div class="match-icon">💕</div>

    <h2>¡Hay Match!</h2>

    <p>Los dos se dieron Like.</p>

    <div class="match-photos">

      <img id="fotoMiMatch" alt="Tu foto">

      <span class="match-heart">❤️</span>

      <img id="fotoOtroMatch" alt="Foto del match">

    </div>

    <button
      id="chatMatchButton"
      class="em-btn em-btn-primary">
      💬 Enviar mensaje
    </button>

    <button
      id="continuarButton"
      class="em-btn">
      🔎 Seguir descubriendo
    </button>

  </div>

</div>

<script>
(() => {

"use strict";

const config = window.EMIMATCH_CONFIG;

if(!config || !window.supabase){

  document.getElementById("estado").innerHTML = `
    <div class="state-icon">⚠️</div>
    <h3>No se pudo iniciar EmiMatch</h3>
    <p>Actualizá la página e intentá nuevamente.</p>
  `;

  return;
}

const supabase = window.supabase.createClient(
  config.supabaseUrl,
  config.supabaseKey
);

const $ = id => document.getElementById(id);

let user = null;
let perfiles = [];
let index = 0;
let currentProfile = null;


/* UTILIDADES */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function placeholder(text="EmiMatch"){

  return "https://placehold.co/700x700/111827/ffffff?text=" +
    encodeURIComponent(text);
}


/* SESIÓN */

async function init(){

  try{

    const {data,error} =
      await supabase.auth.getSession();

    if(error) throw error;

    if(!data.session){

      window.location.href = "index.html";
      return;
    }

    user = data.session.user;

    await loadProfiles();

  }catch(error){

    console.error(error);

    showState(
      "⚠️ No se pudieron cargar los perfiles."
    );
  }
}


/* PERFILES */

async function loadProfiles(){

  showState(`
    <div class="state-icon">✨</div>
    <h3>Buscando personas</h3>
    <p>Estamos preparando tus perfiles...</p>
  `);

  index = 0;

  const min =
    Number($("edadMin").value) || 18;

  const max =
    Number($("edadMax").value) || 100;

  const city =
    $("ciudadFiltro").value.trim().toLowerCase();

  try{

    const [
      blocksResult,
      swipesResult,
      profilesResult
    ] = await Promise.all([

      supabase
        .from("user_blocks")
        .select("blocker_id,blocked_id")
        .or(
          `blocker_id.eq.${user.id},blocked_id.eq.${user.id}`
        ),

      supabase
        .from("swipes")
        .select("target_user_id")
        .eq("user_id",user.id),

      supabase
        .from("profiles")
        .select(
          "id,nombre,edad,ciudad,descripcion,foto_url,intereses,created_at"
        )
        .neq("id",user.id)
        .gte("edad",min)
        .lte("edad",max)
        .order("created_at",{ascending:false})
        .limit(50)

    ]);

    if(blocksResult.error)
      throw blocksResult.error;

    if(swipesResult.error)
      throw swipesResult.error;

    if(profilesResult.error)
      throw profilesResult.error;

    const blocked = new Set();

    (blocksResult.data || []).forEach(item => {

      if(item.blocker_id === user.id)
        blocked.add(item.blocked_id);

      if(item.blocked_id === user.id)
        blocked.add(item.blocker_id);

    });

    const swiped = new Set(
      (swipesResult.data || [])
        .map(item => item.target_user_id)
    );

    perfiles =
      (profilesResult.data || [])
      .filter(profile => {

        if(blocked.has(profile.id))
          return false;

        if(swiped.has(profile.id))
          return false;

        if(
          city &&
          !String(profile.ciudad || "")
            .toLowerCase()
            .includes(city)
        )
          return false;

        return true;
      });

    renderProfile();

  }catch(error){

    console.error(
      "Error cargando perfiles:",
      error
    );

    showState(
      "⚠️ No se pudieron cargar los perfiles."
    );
  }
}


/* MOSTRAR */

function renderProfile(){

  if(index >= perfiles.length){

    showState(`
      <div class="state-icon">💙</div>
      <h3>No hay más perfiles</h3>
      <p>
        Probá cambiar los filtros o volvé más tarde.
      </p>
    `);

    return;
  }

  const profile = perfiles[index];

  currentProfile = profile;

  $("estado").style.display = "none";

  const interests =
    String(profile.intereses || "")
      .split(",")
      .map(item => item.trim())
      .filter(Boolean)
      .slice(0,8);

  const interestHTML = interests.length
    ? `
      <div class="interests">
        ${interests.map(item =>
          `<span class="interest">${escapeHTML(item)}</span>`
        ).join("")}
      </div>
    `
    : "";

  $("perfiles").innerHTML = `

    <article class="em-card profile-card">

      <div class="profile-photo-wrap">

        <img
          class="profile-photo"
          src="${escapeHTML(
            profile.foto_url || placeholder()
          )}"
          alt="Foto de ${escapeHTML(
            profile.nombre || "usuario"
          )}"
          onerror="this.src='${placeholder()}'">

        <div class="profile-gradient"></div>

      </div>

      <div class="profile-info">

        <div class="profile-name">
          ${escapeHTML(profile.nombre || "Sin nombre")}
          ${profile.edad
            ? ", " + escapeHTML(profile.edad)
            : ""}
        </div>

        <div class="profile-city">
          📍 ${escapeHTML(
            profile.ciudad || "Sin ciudad"
          )}
        </div>

        ${
          profile.descripcion
          ? `
            <div class="profile-description">
              ${escapeHTML(profile.descripcion)}
            </div>
          `
          : ""
        }

        ${interestHTML}

        <div class="actions">

          <button
            class="action-pass"
            id="passButton">
            ❌ Pasar
          </button>

          <button
            class="action-like"
            id="likeButton">
            ❤️ Me gusta
          </button>

        </div>

        <button
          class="action-block"
          id="blockButton">
          🚫 Bloquear este perfil
        </button>

      </div>

    </article>
  `;

  $("passButton").onclick =
    () => swipe("pass");

  $("likeButton").onclick =
    () => swipe("like");

  $("blockButton").onclick =
    blockUser;
}


/* SWIPE */

async function swipe(action){

  if(!currentProfile)
    return;

  const target = currentProfile;

  $("passButton").disabled = true;
  $("likeButton").disabled = true;

  try{

    const {error} =
      await supabase
        .from("swipes")
        .insert({
          user_id:user.id,
          target_user_id:target.id,
          action
        });

    if(error && error.code !== "23505")
      throw error;

    index++;

    if(action === "like"){

      const isMatch =
        await checkMatch(target.id);

      if(isMatch){

        await prepareMatch(target);

        $("modalMatch").style.display = "grid";

        return;
      }
    }

    renderProfile();

  }catch(error){

    console.error(error);

    alert("No se pudo guardar la acción.");

    renderProfile();
  }
}


/* MATCH */

async function checkMatch(targetId){

  const [direct,reverse] =
    await Promise.all([

      supabase
        .from("matches")
        .select("id")
        .eq("user1_id",user.id)
        .eq("user2_id",targetId)
        .limit(1),

      supabase
        .from("matches")
        .select("id")
        .eq("user1_id",targetId)
        .eq("user2_id",user.id)
        .limit(1)

    ]);

  if(direct.error || reverse.error)
    return false;

  return Boolean(
    direct.data?.length ||
    reverse.data?.length
  );
}


/* MATCH MODAL */

async function prepareMatch(profile){

  const {data} =
    await supabase
      .from("profiles")
      .select("foto_url")
      .eq("id",user.id)
      .maybeSingle();

  $("fotoMiMatch").src =
    data?.foto_url || placeholder("Yo");

  $("fotoOtroMatch").src =
    profile.foto_url || placeholder("Match");
}


/* BLOQUEAR */

async function blockUser(){

  if(!currentProfile)
    return;

  if(!confirm(
    "¿Querés bloquear a este usuario?"
  ))
    return;

  try{

    const {error} =
      await supabase
        .from("user_blocks")
        .insert({
          blocker_id:user.id,
          blocked_id:currentProfile.id
        });

    if(error && error.code !== "23505")
      throw error;

    index++;

    renderProfile();

  }catch(error){

    console.error(error);

    alert(
      "No se pudo bloquear al usuario."
    );
  }
}


/* ESTADO */

function showState(html){

  $("estado").style.display = "block";
  $("estado").innerHTML = html;
  $("perfiles").innerHTML = "";
}


/* FILTROS */

$("filtrarButton").onclick =
  loadProfiles;


/* MODAL */

$("continuarButton").onclick = () => {

  $("modalMatch").style.display = "none";

  renderProfile();
};

$("chatMatchButton").onclick = () => {

  if(!currentProfile)
    return;

  window.location.href =
    "conversacion.html?user=" +
    encodeURIComponent(
      currentProfile.id
    );
};


/* INICIO */

init();

})();
</script>

<script src="assets/js/app.js"></script>
<script src="assets/js/components.js"></script>

</body>
</html>
