<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fb, #e8eef8);
      color: #1f2937;
    }

    header {
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      text-align: center;
      padding: 24px 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    .contenedor {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 15px;
    }

    .volver {
      display: block;
      text-decoration: none;
      color: #1e3a8a;
      font-weight: bold;
      margin: 5px 0 15px;
    }

    .filtros {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    .filtros h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .campo {
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .campo input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    .campo input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,.1);
    }

    .fila {
      display: flex;
      gap: 10px;
    }

    .fila .campo {
      flex: 1;
    }

    .online-filtro {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: bold;
      margin: 10px 0 16px;
      cursor: pointer;
    }

    .online-filtro input {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .botones {
      display: flex;
      gap: 10px;
    }

    .boton {
      flex: 1;
      border: none;
      padding: 13px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:disabled {
      opacity: .6;
      cursor: wait;
    }

    .aplicar {
      background: #2563eb;
      color: white;
    }

    .limpiar {
      background: #e5e7eb;
      color: #111827;
    }

    .contador {
      text-align: center;
      font-weight: bold;
      color: #374151;
      margin: 15px 0;
    }

    .estado {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    .estado-icono {
      font-size: 55px;
      margin-bottom: 8px;
    }

    .estado h2 {
      margin: 8px 0;
    }

    .estado p {
      color: #6b7280;
      line-height: 1.5;
    }

    .card {
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,.13);
      margin-bottom: 20px;
    }

    .foto {
      width: 100%;
      height: 390px;
      object-fit: cover;
      display: block;
      background: #e5e7eb;
    }

    .sin-foto {
      height: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      background: linear-gradient(135deg,#dbeafe,#e5e7eb);
    }

    .contenido {
      padding: 19px;
    }

    .nombre {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .datos {
      color: #6b7280;
      margin-bottom: 10px;
    }

    .estado-online {
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .estado-offline {
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .descripcion {
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .intereses {
      background: #f3f4f6;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .acciones {
      display: flex;
      gap: 12px;
    }

    .accion {
      flex: 1;
      border: none;
      border-radius: 13px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .accion:disabled {
      opacity: .5;
    }

    .pasar {
      background: #fee2e2;
      color: #b91c1c;
    }

    .like {
      background: #dcfce7;
      color: #15803d;
    }

    .reiniciar {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 13px;
      border-radius: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .error-detalle {
      background: #fff1f2;
      color: #9f1239;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-size: 13px;
      word-break: break-word;
      text-align: left;
    }

    .cargando {
      padding: 30px;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .foto,
      .sin-foto {
        height: 330px;
      }

      .fila {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🔎 Descubrir</h1>
  <p>Encontrá personas compatibles con vos</p>
</header>

<div class="contenedor">

  <a href="perfil.html" class="volver">
    ← Volver a mi perfil
  </a>

  <!-- FILTROS -->

  <div class="filtros">

    <h2>🎯 Filtrar perfiles</h2>

    <div class="fila">

      <div class="campo">
        <label for="edadMin">
          Edad mínima
        </label>

        <input
          type="number"
          id="edadMin"
          min="18"
          max="100"
          value="18"
        >
      </div>

      <div class="campo">
        <label for="edadMax">
          Edad máxima
        </label>

        <input
          type="number"
          id="edadMax"
          min="18"
          max="100"
          value="80"
        >
      </div>

    </div>

    <div class="campo">

      <label for="ciudad">
        📍 Ciudad
      </label>

      <input
        type="text"
        id="ciudad"
        placeholder="Ej: Buenos Aires"
      >

    </div>

    <div class="campo">

      <label for="intereses">
        ❤️ Intereses
      </label>

      <input
        type="text"
        id="intereses"
        placeholder="Ej: fútbol, música, viajes"
      >

    </div>

    <label class="online-filtro">

      <input
        type="checkbox"
        id="soloOnline"
      >

      🟢 Mostrar solamente personas online

    </label>

    <div class="botones">

      <button
        id="btnAplicar"
        class="boton aplicar"
        type="button"
      >
        🔎 Aplicar filtros
      </button>

      <button
        id="btnLimpiar"
        class="boton limpiar"
        type="button"
      >
        🧹 Limpiar
      </button>

    </div>

  </div>

  <div
    id="contador"
    class="contador"
  ></div>

  <div id="resultado">

    <div class="cargando">
      ⏳ Cargando perfiles...
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let usuarioActual = null;

let perfiles = [];

let perfilesMostrados = [];


// ========================================
// INICIAR
// ========================================

async function iniciar() {

  try {

    const {
      data: {
        session
      },
      error
    } =
      await supabaseClient.auth.getSession();

    if (error) {

      mostrarError(
        "No se pudo comprobar la sesión.",
        error
      );

      return;
    }

    if (!session) {

      window.location.href =
        "index.html";

      return;
    }

    usuarioActual =
      session.user;

    await cargarPerfiles();

  } catch (error) {

    console.error(error);

    mostrarError(
      "Ocurrió un error al iniciar Descubrir.",
      error
    );

  }

}


// ========================================
// OBTENER VALORES DE FILTROS
// ========================================

function obtenerFiltros() {

  let edadMin =
    parseInt(
      document.getElementById("edadMin").value,
      10
    );

  let edadMax =
    parseInt(
      document.getElementById("edadMax").value,
      10
    );

  const ciudad =
    document
      .getElementById("ciudad")
      .value
      .trim();

  const intereses =
    document
      .getElementById("intereses")
      .value
      .trim();

  const soloOnline =
    document
      .getElementById("soloOnline")
      .checked;


  if (
    isNaN(edadMin) ||
    edadMin < 18
  ) {

    edadMin = 18;

  }


  if (
    isNaN(edadMax) ||
    edadMax > 100
  ) {

    edadMax = 100;

  }


  return {
    edadMin,
    edadMax,
    ciudad,
    intereses,
    soloOnline
  };

}


// ========================================
// CARGAR PERFILES
// ========================================

async function cargarPerfiles() {

  const resultado =
    document.getElementById("resultado");

  const contador =
    document.getElementById("contador");


  resultado.innerHTML = `
    <div class="cargando">
      ⏳ Buscando perfiles...
    </div>
  `;

  contador.textContent = "";


  const filtros =
    obtenerFiltros();


  // Validar edades

  if (
    filtros.edadMin >
    filtros.edadMax
  ) {

    resultado.innerHTML = `
      <div class="estado">

        <div class="estado-icono">
          ⚠️
        </div>

        <h2>Rango incorrecto</h2>

        <p>
          La edad mínima no puede ser
          mayor que la edad máxima.
        </p>

      </div>
    `;

    return;
  }


  try {

    // ====================================
    // OBTENER SWIPES
    // ====================================

    const {
      data: swipes,
      error: errorSwipes
    } =
      await supabaseClient
        .from("swipes")
        .select("target_user_id")
        .eq(
          "user_id",
          usuarioActual.id
        );


    if (errorSwipes) {

      throw errorSwipes;

    }


    const vistos =
      new Set(
        (swipes || []).map(
          item =>
            item.target_user_id
        )
      );


    // ====================================
    // CONSULTA DE PERFILES
    // ====================================

    let consulta =
      supabaseClient
        .from("profiles")
        .select(`
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          intereses,
          online,
          last_seen
        `)
        .neq(
          "id",
          usuarioActual.id
        )
        .gte(
          "edad",
          filtros.edadMin
        )
        .lte(
          "edad",
          filtros.edadMax
        );


    // ====================================
    // FILTRO CIUDAD
    // ====================================

    if (filtros.ciudad !== "") {

      consulta =
        consulta.ilike(
          "ciudad",
          `%${filtros.ciudad}%`
        );

    }


    // ====================================
    // FILTRO INTERESES
    // ====================================

    if (filtros.intereses !== "") {

      consulta =
        consulta.ilike(
          "intereses",
          `%${filtros.intereses}%`
        );

    }


    // ====================================
    // SOLO ONLINE
    // ====================================

    if (filtros.soloOnline) {

      consulta =
        consulta.eq(
          "online",
          true
        );

    }


    // ====================================
    // EJECUTAR CONSULTA
    // ====================================

    const {
      data,
      error
    } =
      await consulta;


    if (error) {

      throw error;

    }


    // ====================================
    // QUITAR PERFILES YA VISTOS
    // ====================================

    perfiles =
      (data || []).filter(
        perfil =>
          !vistos.has(
            perfil.id
          )
      );


    perfilesMostrados =
      [...perfiles];


    actualizarContador();

    mostrarPerfilActual();


  } catch (error) {

    console.error(
      "ERROR CARGANDO PERFILES:",
      error
    );

    mostrarError(
      "No se pudieron cargar los perfiles.",
      error
    );

  }

}


// ========================================
// MOSTRAR PERFIL
// ========================================

function mostrarPerfilActual() {

  const resultado =
    document.getElementById(
      "resultado"
    );


  if (
    !perfilesMostrados.length
  ) {

    resultado.innerHTML = `
      <div class="estado">

        <div class="estado-icono">
          💕
        </div>

        <h2>
          No encontramos más perfiles
        </h2>

        <p>
          Probá modificando los filtros
          para encontrar más personas.
        </p>

        <button
          id="btnReiniciar"
          class="reiniciar"
          type="button"
        >
          🔄 Reiniciar perfiles
        </button>

      </div>
    `;

    document
      .getElementById("btnReiniciar")
      .addEventListener(
        "click",
        reiniciarPerfiles
      );

    return;
  }


  resultado.innerHTML =
    crearCard(
      perfilesMostrados[0]
    );


  const botonLike =
    document.getElementById(
      "btnLike"
    );

  const botonPasar =
    document.getElementById(
      "btnPasar"
    );


  botonLike.addEventListener(
    "click",
    function() {

      darLike(
        perfilesMostrados[0].id
      );

    }
  );


  botonPasar.addEventListener(
    "click",
    function() {

      pasar(
        perfilesMostrados[0].id
      );

    }
  );

}


// ========================================
// CREAR TARJETA
// ========================================

function crearCard(perfil) {

  let fotoHTML;


  if (perfil.foto_url) {

    fotoHTML = `
      <img
        class="foto"
        src="${escaparHTML(
          perfil.foto_url
        )}"
        alt="Foto de perfil"
      >
    `;

  } else {

    fotoHTML = `
      <div class="sin-foto">
        👤
      </div>
    `;

  }


  const estadoHTML =
    perfil.online === true

      ? `
        <div class="estado-online">
          🟢 En línea
        </div>
      `

      : `
        <div class="estado-offline">
          ⚪ Desconectado
        </div>
      `;


  const datos = [];

  if (perfil.edad) {

    datos.push(
      `${perfil.edad} años`
    );

  }

  if (perfil.ciudad) {

    datos.push(
      escaparHTML(
        perfil.ciudad
      )
    );

  }


  return `

    <div class="card">

      ${fotoHTML}

      <div class="contenido">

        <div class="nombre">
          ${escaparHTML(
            perfil.nombre ||
            "Sin nombre"
          )}
        </div>

        <div class="datos">
          ${datos.join(" · ")}
        </div>

        ${estadoHTML}

        ${
          perfil.descripcion
            ? `
              <div class="descripcion">
                ${escaparHTML(
                  perfil.descripcion
                )}
              </div>
            `
            : ""
        }

        ${
          perfil.intereses
            ? `
              <div class="intereses">
                ❤️
                <strong>
                  Intereses:
                </strong>
                ${escaparHTML(
                  perfil.intereses
                )}
              </div>
            `
            : ""
        }

        <div class="acciones">

          <button
            id="btnPasar"
            class="accion pasar"
            type="button"
          >
            ❌ Pasar
          </button>

          <button
            id="btnLike"
            class="accion like"
            type="button"
          >
            ❤️ Me gusta
          </button>

        </div>

      </div>

    </div>

  `;

}


// ========================================
// LIKE
// ========================================

async function darLike(usuarioId) {

  const boton =
    document.getElementById(
      "btnLike"
    );


  if (boton) {

    boton.disabled = true;

    boton.textContent =
      "⏳ Enviando...";

  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("swipes")
        .insert({
          user_id:
            usuarioActual.id,

          target_user_id:
            usuarioId,

          action:
            "like"
        });


    if (error) {

      throw error;

    }


    quitarPerfilActual();

    mostrarPerfilActual();


  } catch (error) {

    console.error(error);

    if (boton) {

      boton.disabled = false;

      boton.textContent =
        "❤️ Me gusta";

    }


    if (
      error.code === "23505"
    ) {

      alert(
        "Ya habías interactuado con esta persona."
      );

    } else {

      alert(
        "No se pudo registrar el Me gusta."
      );

    }

  }

}


// ========================================
// PASAR
// ========================================

async function pasar(usuarioId) {

  const boton =
    document.getElementById(
      "btnPasar"
    );


  if (boton) {

    boton.disabled = true;

    boton.textContent =
      "⏳ Guardando...";

  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("swipes")
        .insert({
          user_id:
            usuarioActual.id,

          target_user_id:
            usuarioId,

          action:
            "pass"
        });


    if (error) {

      throw error;

    }


    quitarPerfilActual();

    mostrarPerfilActual();


  } catch (error) {

    console.error(error);

    if (boton) {

      boton.disabled = false;

      boton.textContent =
        "❌ Pasar";

    }


    if (
      error.code === "23505"
    ) {

      alert(
        "Ya habías interactuado con esta persona."
      );

    } else {

      alert(
        "No se pudo registrar la acción."
      );

    }

  }

}


// ========================================
// QUITAR PERFIL ACTUAL
// ========================================

function quitarPerfilActual() {

  if (
    perfilesMostrados.length
  ) {

    perfilesMostrados.shift();

  }

  actualizarContador();

}


// ========================================
// CONTADOR
// ========================================

function actualizarContador() {

  const contador =
    document.getElementById(
      "contador"
    );


  const cantidad =
    perfilesMostrados.length;


  if (cantidad === 0) {

    contador.textContent = "";

  } else if (cantidad === 1) {

    contador.textContent =
      "1 perfil disponible";

  } else {

    contador.textContent =
      `${cantidad} perfiles disponibles`;

  }

}


// ========================================
// APLICAR FILTROS
// ========================================

async function aplicarFiltros() {

  const boton =
    document.getElementById(
      "btnAplicar"
    );


  boton.disabled = true;

  boton.textContent =
    "⏳ Buscando...";


  try {

    await cargarPerfiles();

  } catch (error) {

    console.error(error);

    mostrarError(
      "No se pudieron aplicar los filtros.",
      error
    );

  } finally {

    boton.disabled = false;

    boton.textContent =
      "🔎 Aplicar filtros";

  }

}


// ========================================
// LIMPIAR FILTROS
// ========================================

async function limpiarFiltros() {

  document.getElementById(
    "edadMin"
  ).value = 18;


  document.getElementById(
    "edadMax"
  ).value = 80;


  document.getElementById(
    "ciudad"
  ).value = "";


  document.getElementById(
    "intereses"
  ).value = "";


  document.getElementById(
    "soloOnline"
  ).checked = false;


  await cargarPerfiles();

}


// ========================================
// REINICIAR PERFILES
// ===========================
