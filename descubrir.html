<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #111827,
        #1e3a8a
      );
      color: white;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
    }

    .subtitulo {
      text-align: center;
      color: #dbeafe;
      margin-bottom: 20px;
    }

    .volver {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 18px;
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 16px;
    }

    .card {
      background: white;
      color: #111827;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .foto {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }

    .sin-foto {
      width: 100%;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e5e7eb;
      font-size: 90px;
    }

    .datos {
      padding: 22px;
    }

    .nombre {
      font-size: 28px;
      font-weight: bold;
    }

    .info {
      margin-top: 8px;
      color: #4b5563;
    }

    .descripcion {
      margin-top: 15px;
      line-height: 1.5;
    }

    .intereses {
      margin-top: 15px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 12px;
    }

    .acciones {
      display: flex;
      gap: 15px;
      padding: 20px;
      background: #f9fafb;
    }

    .accion {
      flex: 1;
      border: none;
      border-radius: 50px;
      padding: 16px;
      font-size: 26px;
      cursor: pointer;
    }

    .pasar {
      background: #e5e7eb;
    }

    .like {
      background: #fee2e2;
    }

    .mensaje {
      background: white;
      color: #111827;
      border-radius: 24px;
      padding: 40px 20px;
      text-align: center;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <h1>🔎 Descubrir</h1>

  <div class="subtitulo">
    Encontrá nuevas personas
  </div>

  <button
    class="volver"
    onclick="volver()">
    ← Volver
  </button>

  <div id="contenido">
    Cargando perfiles...
  </div>

</div>


<script>

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let usuarioActual = null;

let perfiles = [];

let indice = 0;


/* =========================
   INICIAR
========================= */

async function iniciar() {

  const {
    data: {
      session
    },
    error
  } =
  await supabaseClient.auth.getSession();


  if (error) {

    mostrarMensaje(
      "Error de sesión: " +
      error.message
    );

    return;
  }


  if (!session) {

    window.location.href =
      "./index.html";

    return;
  }


  usuarioActual =
    session.user;


  cargarPerfiles();

}


/* =========================
   CARGAR PERFILES
========================= */

async function cargarPerfiles() {

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(`
      id,
      nombre,
      edad,
      ciudad,
      descripcion,
      foto_url,
      intereses,
      created_at
    `)
    .neq(
      "id",
      usuarioActual.id
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);

    mostrarMensaje(
      "Error cargando perfiles: " +
      error.message
    );

    return;
  }


  perfiles = data || [];

  indice = 0;

  mostrarPerfil();

}


/* =========================
   MOSTRAR PERFIL
========================= */

function mostrarPerfil() {

  const contenido =
    document.getElementById(
      "contenido"
    );


  if (
    !perfiles.length ||
    indice >= perfiles.length
  ) {

    contenido.innerHTML = `

      <div class="mensaje">

        <div
          style="font-size:70px;">
          💕
        </div>

        <h2>
          No hay más perfiles
        </h2>

        <p>
          Por ahora no hay más personas
          para descubrir.
        </p>

      </div>

    `;

    return;
  }


  const perfil =
    perfiles[indice];


  let fotoHTML = "";


  if (perfil.foto_url) {

    fotoHTML = `

      <img
        class="foto"
        src="${perfil.foto_url}"
        alt="Foto de perfil">

    `;

  } else {

    fotoHTML = `

      <div class="sin-foto">
        👤
      </div>

    `;

  }


  contenido.innerHTML = `

    <div class="card">

      ${fotoHTML}

      <div class="datos">

        <div class="nombre">

          ${perfil.nombre || "Usuario"}

          ${
            perfil.edad
              ? ", " + perfil.edad
              : ""
          }

        </div>


        ${
          perfil.ciudad
            ? `
              <div class="info">
                📍 ${perfil.ciudad}
              </div>
            `
            : ""
        }


        ${
          perfil.descripcion
            ? `
              <div class="descripcion">
                ${perfil.descripcion}
              </div>
            `
            : ""
        }


        ${
          perfil.intereses
            ? `
              <div class="intereses">
                ❤️ ${perfil.intereses}
              </div>
            `
            : ""
        }

      </div>


      <div class="acciones">

        <button
          class="accion pasar"
          onclick="pasarPerfil()">

          ❌

        </button>


        <button
          class="accion like"
          onclick="darLike()">

          ❤️

        </button>

      </div>

    </div>

  `;

}


/* =========================
   LIKE
========================= */

async function darLike() {

  const perfil =
    perfiles[indice];


  if (!perfil) return;


  const {
    error
  } =
  await supabaseClient
    .from("swipes")
    .insert({

      user_id:
        usuarioActual.id,

      target_user_id:
        perfil.id,

      action:
        "like"

    });


  if (error) {

    alert(
      "Error: " +
      error.message
    );

    console.error(error);

    return;
  }


  indice++;

  mostrarPerfil();

}


/* =========================
   PASAR
========================= */

async function pasarPerfil() {

  const perfil =
    perfiles[indice];


  if (!perfil) return;


  const {
    error
  } =
  await supabaseClient
    .from("swipes")
    .insert({

      user_id:
        usuarioActual.id,

      target_user_id:
        perfil.id,

      action:
        "pass"

    });


  if (error) {

    alert(
      "Error: " +
      error.message
    );

    console.error(error);

    return;
  }


  indice++;

  mostrarPerfil();

}


/* =========================
   MENSAJE
========================= */

function mostrarMensaje(texto) {

  document.getElementById(
    "contenido"
  ).innerHTML = `

    <div class="mensaje">
      ${texto}
    </div>

  `;

}


/* =========================
   VOLVER
========================= */

function volver() {

  window.location.href =
    "./perfil.html";

}


/* =========================
   ARRANCAR
========================= */

iniciar();

</script>

</body>

</html>
