  <style>

    * {

    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          135deg,
          #07152f,
          #102b55
        );
      color: white;
      padding: 20px;
      padding-bottom: 105px;
    }

    .contenedor {
      max-width: 500px;

    }

    .cabecera {
      text-align: center;
      margin-bottom: 18px;
    }

    .cabecera h1 {
      margin: 5px 0;

    }

    .cabecera p {
      margin: 0;
      color: #cbd5e1;
    }

    .estado {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 13px;
      border-radius: 20px;
      background: rgba(34,197,94,.15);
      color: #4ade80;
      font-size: 14px;
    }

    .filtros {
      background: rgba(255,255,255,.08);

      border-radius: 20px;
      padding: 15px;

      backdrop-filter: blur(10px);
    }

    .filtros h3 {

      font-size: 16px;

    .filtro-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

    .filtro {

      border-radius: 12px;

      border-color: #d4af37;

      margin-top: 10px;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: #d4af37;
      color: #07152f;
      font-weight: bold;
      cursor: pointer;

      text-align: center;

      color: #cbd5e1;
    }

    .perfil-card {
      background: white;
      color: #172033;
      border-radius: 25px;

      box-shadow: 0 18px 40px rgba(0,0,0,.35);

    .foto-perfil {

      height: 390px;

    .nombre {

      font-weight: bold;

    .online {

      height: 11px;

    }

      margin-top: 14px;
      display: flex;

    .interes {
      padding: 7px 10px;
      border-radius: 20px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 13px;
    }

    .acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 20px 20px;
    }

    .accion {
      border: none;
      border-radius: 16px;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .pasar {
      background: #fee2e2;
      color: #b91c1c;
    }

    .like {
      background: #fce7f3;
      color: #be185d;
    }

    .accion:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .mensaje {
      text-align: center;
      margin: 15px 0;
      min-height: 20px;
      color: #cbd5e1;
    }

    .sin-perfiles {
      background: rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 35px 20px;
      text-align: center;
      color: #cbd5e1;
    }

    .sin-perfiles .emoji {
      font-size: 55px;
      margin-bottom: 12px;

    .limpiar {
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      background: rgba(255,255,255,.12);
      color: white;
      cursor: pointer;
    }

    /* NAV INFERIOR */

    .bottom-nav {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 72px;
      max-width: 500px;
      margin: auto;
      z-index: 1000;

      display: grid;
      grid-template-columns:
        repeat(5, 1fr);

      background:
        rgba(7,21,47,.96);

      border:
        1px solid rgba(255,255,255,.14);

      border-radius: 22px;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.45);

      backdrop-filter: blur(14px);
    }

    .nav-item {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #cbd5e1;
      text-decoration: none;

      font-size: 11px;
      font-weight: bold;
    }

    .nav-item .icon {
      font-size: 22px;
      line-height: 22px;
    }

    .nav-item.activo {
      color: #d4af37;
    }

    .badge {
      position: absolute;

      top: 5px;
      right: 17%;

      min-width: 19px;
      height: 19px;

      padding: 2px 5px;

      border-radius: 20px;

      background: #ef4444;
      color: white;

      font-size: 11px;

      display: none;
      align-items: center;
      justify-content: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 95px;

      transform:
        translateX(-50%)
        translateY(20px);

      background: #111827;
      color: white;

      padding: 13px 18px;

      border-radius: 14px;

      opacity: 0;
      pointer-events: none;

      transition:
        .25s ease;

      z-index: 2000;

      max-width: 90%;
      text-align: center;
    }

    .toast.mostrar {
      opacity: 1;
      transform:
        translateX(-50%)
        translateY(0);
    }

    @media (max-width: 400px) {

      body {
        padding: 12px;
        padding-bottom: 100px;
      }

      .foto-perfil,
      .foto-sin {
        height: 350px;
      }

      .bottom-nav {
        left: 6px;
        right: 6px;
      }

      .nav-item {
        font-size: 10px;
      }

      .nav-item .icon {
        font-size: 20px;
      }

    }

  </style>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;

let perfiles = [];

let perfilesFiltrados = [];

let indiceActual = 0;

let bloqueados = new Set();

let swipesRealizados = new Set();


/* =========================
   INICIO
========================= */

async function iniciar() {

  try {

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (!session) {

      window.location.href =
        "./index.html";

      return;
    }


    usuarioActual =
      session.user;


    await cargarBloqueados();

    await cargarSwipes();

    await cargarPerfiles();

    await cargarNotificaciones();

  }

  catch (error) {

    console.error(error);

    mostrarError(
      "No se pudo iniciar EmiMatch."
    );

  }

}


/* =========================
   BLOQUEADOS
========================= */

async function cargarBloqueados() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_blocks")
      .select(
        "blocker_id, blocked_id"
      )
      .or(
        `blocker_id.eq.${usuarioActual.id},blocked_id.eq.${usuarioActual.id}`
      );


  if (error) {

    console.error(
      "Error cargando bloqueados:",
      error
    );

    return;
  }


  bloqueados =
    new Set();


  (data || []).forEach(
    bloqueo => {

      if (
        bloqueo.blocker_id ===
        usuarioActual.id
      ) {

        bloqueados.add(
          bloqueo.blocked_id
        );

      }
      else {

        bloqueados.add(
          bloqueo.blocker_id
        );

      }

    }
  );

}


/* =========================
   SWIPES
========================= */

async function cargarSwipes() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("swipes")
      .select(
        "target_user_id, action"
      )
      .eq(
        "user_id",
        usuarioActual.id
      );


  if (error) {

    console.error(
      "Error cargando swipes:",
      error
    );

    return;
  }


  swipesRealizados =
    new Set(
      (data || []).map(
        swipe =>
          swipe.target_user_id
      )
    );

}


/* =========================
   PERFILES
========================= */

async function cargarPerfiles() {

  mostrarCarga(
    "⏳ Buscando personas..."
  );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        `
        id,
        nombre,
        edad,
        ciudad,
        descripcion,
        foto_url,
        intereses,
        online,
        last_seen
        `
      )
      .neq(
        "id",
        usuarioActual.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    mostrarError(
      "No se pudieron cargar los perfiles."
    );

    return;
  }


  perfiles =
    (data || []).filter(
      perfil => {

        if (
          bloqueados.has(
            perfil.id
          )
        ) {

          return false;
        }


        if (
          swipesRealizados.has(
            perfil.id
          )
        ) {

          return false;
        }


        return true;

      }
    );


  aplicarFiltros();

}


/* =========================
   FILTROS
========================= */

function aplicarFiltros() {

  const edadMin =
    parseInt(
      document.getElementById(
        "edadMin"
      ).value
    ) || 18;


  const edadMax =
    parseInt(
      document.getElementById(
        "edadMax"
      ).value
    ) || 100;


  const ciudad =
    document.getElementById(
      "ciudadFiltro"
    ).value
      .trim()
      .toLowerCase();


  const estado =
    document.getElementById(
      "estadoFiltro"
    ).value;


  perfilesFiltrados =
    perfiles.filter(
      perfil => {

        const edad =
          Number(
            perfil.edad
          );


        if (
          edad &&
          (
            edad < edadMin ||
            edad > edadMax
          )
        ) {

          return false;

        }


        if (
          ciudad &&
          !String(
            perfil.ciudad || ""
          )
            .toLowerCase()
            .includes(
              ciudad
            )
        ) {

          return false;

        }


        if (
          estado === "online" &&
          !perfil.online
        ) {

          return false;

        }


        return true;

      }
    );


  indiceActual = 0;

  mostrarPerfil();

}


/* =========================
   MOSTRAR PERFIL
========================= */

function mostrarPerfil() {

  const contenido =
    document.getElementById(
      "contenido"
    );


  if (
    !perfilesFiltrados.length ||
    indiceActual >=
      perfilesFiltrados.length
  ) {

    contenido.innerHTML = `

      <div class="sin-perfiles">

        <div class="emoji">
          🔎
        </div>

        <h2>
          No hay perfiles disponibles.
        </h2>

        <p>
          Probá cambiar los filtros
          o volvé más tarde.
        </p>

        <button
          class="limpiar"
          onclick="limpiarFiltros()"
        >
          🧹 Limpiar filtros
        </button>

      </div>

    `;

    return;
  }


  const perfil =
    perfilesFiltrados[
      indiceActual
    ];


  const nombre =
    escaparHTML(
      perfil.nombre ||
      "Usuario"
    );


  const edad =
    perfil.edad
      ? `, ${perfil.edad}`
      : "";


  const ciudad =
    perfil.ciudad
      ? `📍 ${escaparHTML(
          perfil.ciudad
        )}`
      : "";


  const descripcion =
    escaparHTML(
      perfil.descripcion ||
      "Sin descripción."
    );


  let interesesHTML = "";


  if (
    perfil.intereses
  ) {

    const intereses =
      String(
        perfil.intereses
      )
        .split(",")
        .map(
          item =>
            item.trim()
        )
        .filter(Boolean);


    interesesHTML =
      intereses
        .map(
          interes =>
            `
              <span class="interes">
                ${escaparHTML(
                  interes
                )}
              </span>
            `
        )
        .join("");

  }


  let fotoHTML;


  if (
    perfil.foto_url
  ) {

    fotoHTML = `

      <img
        class="foto-perfil"
        src="${escaparHTML(
          perfil.foto_url
        )}"
        alt="Foto de ${nombre}"
        onerror="
          this.style.display='none';
          document.getElementById('fotoSin').style.display='flex';
        "
      >

      <div
        id="fotoSin"
        class="foto-sin"
        style="display:none;"
      >
        👤
      </div>

    `;

  }
  else {

    fotoHTML = `

      <div class="foto-sin">
        👤
      </div>

    `;

  }


  contenido.innerHTML = `

    <div class="perfil-card">

      ${fotoHTML}

      <div class="info">

        <div class="nombre">

          ${nombre}${edad}

          ${
            perfil.online
              ? '<span class="online"></span>'
              : ''
          }

        </div>

        ${
          ciudad
            ? `
              <div class="dato">
                ${ciudad}
              </div>
            `
            : ''
        }

        <div class="descripcion">
          ${descripcion}
        </div>

        ${
          interesesHTML
            ? `
              <div class="intereses">
                ${interesesHTML}
              </div>
            `
            : ''
        }

      </div>


      <div class="acciones">

        <button
          class="accion pasar"
          onclick="registrarSwipe('pass')"
        >
          ❌ Pasar
        </button>

        <button
          class="accion like"
          onclick="registrarSwipe('like')"
        >
          ❤️ Me gusta
        </button>

      </div>

    </div>

  `;

}


/* =========================
   SWIPE
========================= */

async function registrarSwipe(
  accion
) {

  if (
    indiceActual >=
    perfilesFiltrados.length
  ) {

    return;

  }


  const perfil =
    perfilesFiltrados[
      indiceActual
    ];


  const botones =
    document.querySelectorAll(
      ".accion"
    );


  botones.forEach(
    boton =>
      boton.disabled = true
  );


  const {
    error
  } =
    await supabaseClient
      .from("swipes")
      .insert({

        user_id:
          usuarioActual.id,

        target_user_id:
          perfil.id,

        action:
          accion

      });


  if (error) {

    console.error(error);

    botones.forEach(
      boton =>
        boton.disabled = false
    );

    mostrarToast(
      "No se pudo guardar la acción."
    );

    return;

  }


  swipesRealizados.add(
    perfil.id
  );


  if (
    accion === "like"
  ) {

    await comprobarMatch(
      perfil.id
    );

  }


  indiceActual++;

  mostrarPerfil();

}


/* =========================
   MATCH
========================= */

async function comprobarMatch(
  targetId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id"
      )
      .or(
        `and(user1_id.eq.${usuarioActual.id},user2_id.eq.${targetId}),and(user1_id.eq.${targetId},user2_id.eq.${usuarioActual.id})`
      )
      .limit(1);


  if (error) {

    console.error(
      "Error comprobando match:",
      error
    );

    return;

  }


  if (
    data &&
    data.length
  ) {

    mostrarToast(
      "💕 ¡Es un Match! Ya pueden hablar."
    );

  }
  else {

    mostrarToast(
      "❤️ Me gusta enviado"
    );

  }

}


/* =========================
   LIMPIAR FILTROS
========================= */

function limpiarFiltros() {

  document.getElementById(
    "edadMin"
  ).value = "";

  document.getElementById(
    "edadMax"
  ).value = "";

  document.getElementById(
    "ciudadFiltro"
  ).value = "";

  document.getElementById(
    "estadoFiltro"
  ).value = "todos";


  aplicarFiltros();

}


/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  try {

    const {
      data: matches,
      error
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id, user1_id, user2_id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (error) {

      console.error(
        "Error matches:",
        error
      );

      return;

    }


    if (
      !matches ||
      !matches.length
    ) {

      return;

    }


    const matchIds =
      matches.map(
        match =>
          match.id
      );


    const {
      data: mensajes,
      error: errorMensajes
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id"
        )
        .in(
          "match_id",
          matchIds
        )
        .neq(
          "sender_id",
          usuarioActua
