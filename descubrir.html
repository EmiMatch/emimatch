<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Descubrir</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #102b5c);
      color: white;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      text-align: center;
      padding: 25px 15px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
    }

    .contenedor {
      width: 92%;
      max-width: 500px;
      margin: auto;
    }

    .filtros {
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .filtros h3 {
      margin-top: 0;
    }

    .fila {
      display: flex;
      gap: 10px;
    }

    input,
    select,
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
    }

    input,
    select {
      background: white;
      color: #111;
    }

    .btn-filtro {
      margin-top: 12px;
      background: #d4af37;
      color: #07152f;
      font-weight: bold;
      cursor: pointer;
    }

    .tarjeta {
      background: white;
      color: #111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .foto {
      width: 100%;
      height: 390px;
      object-fit: cover;
      background: #ddd;
      display: block;
    }

    .sin-foto {
      width: 100%;
      height: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#d4af37,#f5e6a8);
      color: #07152f;
      font-size: 80px;
    }

    .datos {
      padding: 20px;
    }

    .nombre {
      font-size: 25px;
      font-weight: bold;
    }

    .info {
      color: #555;
      margin-top: 6px;
    }

    .descripcion {
      margin-top: 15px;
      line-height: 1.5;
    }

    .intereses {
      margin-top: 12px;
      color: #173d7a;
      font-weight: bold;
    }

    .acciones {
      display: flex;
      gap: 15px;
      padding: 0 20px 20px;
    }

    .btn-no {
      background: #e5e7eb;
      color: #111;
      font-size: 30px;
      cursor: pointer;
    }

    .btn-si {
      background: #e11d48;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    .cargando,
    .mensaje {
      background: rgba(255,255,255,.1);
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      margin-top: 20px;
    }

    .error {
      background: rgba(220,38,38,.2);
      border: 1px solid #ef4444;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-top: 20px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      background: #111827;
      color: white;
      padding: 13px 20px;
      border-radius: 12px;
      display: none;
      z-index: 1000;
    }

    .nav {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 65px;
      background: rgba(7,21,47,.97);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 900;
      box-shadow: 0 5px 25px rgba(0,0,0,.4);
    }

    .nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 11px;
      text-align: center;
    }

    .nav a span {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }

    .nav a.activo {
      color: #d4af37;
    }

    .badge {
      position: absolute;
      top: 8px;
      right: 18px;
      background: #ef4444;
      color: white;
      min-width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 11px;
      display: none;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>

<header>
  <h1>🔎 Descubrir</h1>
  <p>Encontrá personas compatibles con vos</p>
</header>

<div class="contenedor">

  <div class="filtros">
    <h3>🎯 Filtros</h3>

    <div class="fila">
      <input
        type="number"
        id="edadMin"
        placeholder="Edad mín."
        min="18"
        max="100"
      >

      <input
        type="number"
        id="edadMax"
        placeholder="Edad máx."
        min="18"
        max="100"
      >
    </div>

    <select id="ciudad" style="margin-top:10px;">
      <option value="">Todas las ciudades</option>
    </select>

    <button
      class="btn-filtro"
      id="btnFiltros"
    >
      🔎 Aplicar filtros
    </button>
  </div>

  <div id="contenido">
    <div class="cargando">
      🚀 EMI-2026 · Iniciando Descubrir...
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<nav class="nav">

  <a href="perfil.html">
    <span>👤</span>
    Perfil
  </a>

  <a href="descubrir.html" class="activo">
    <span>🔎</span>
    Descubrir
  </a>

  <a href="likes.html">
    <span>❤️</span>
    Me gustas
  </a>

  <a href="chat.html">
    <span>💕</span>
    Matches
  </a>

  <a href="notificaciones.html" style="position:relative;">
    <span>🔔</span>
    Notificaciones
    <b id="badge" class="badge">0</b>
  </a>

</nav>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let usuarioActual = null;
let perfiles = [];
let perfilesFiltrados = [];
let indiceActual = 0;

let bloqueados = new Set();
let swipesRealizados = new Set();

const contenido =
  document.getElementById("contenido");

const ciudadSelect =
  document.getElementById("ciudad");

const edadMin =
  document.getElementById("edadMin");

const edadMax =
  document.getElementById("edadMax");

const toast =
  document.getElementById("toast");


// ==========================================
// INICIO
// ==========================================

document.addEventListener(
  "DOMContentLoaded",
  iniciar
);


async function iniciar() {

  try {

    contenido.innerHTML = `
      <div class="cargando">
        🔐 Verificando sesión...
      </div>
    `;

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    if (!data.session) {

      window.location.href = "index.html";
      return;

    }

    usuarioActual =
      data.session.user;

    await cargarPerfiles();

  } catch (error) {

    console.error(
      "Error al iniciar:",
      error
    );

    mostrarError(
      "No se pudo iniciar Descubrir.",
      error
    );

  }

}


// ==========================================
// CARGAR PERFILES
// ==========================================

async function cargarPerfiles() {

  contenido.innerHTML = `
    <div class="cargando">
      🔎 Buscando personas...
    </div>
  `;

  try {

    const resultado =
      await supabaseClient
        .from("profiles")
        .select(`
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          intereses,
          online,
          last_seen
        `);

    if (resultado.error) {
      throw resultado.error;
    }

    perfiles =
      resultado.data || [];

    await cargarBloqueados();

    await cargarSwipes();

    prepararCiudades();

    aplicarFiltros();

  } catch (error) {

    console.error(
      "Error perfiles:",
      error
    );

    mostrarError(
      "No se pudieron cargar los perfiles.",
      error
    );

  }

}


// ==========================================
// BLOQUEADOS
// ==========================================

async function cargarBloqueados() {

  bloqueados =
    new Set();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_blocks")
      .select("blocked_id")
      .eq(
        "blocker_id",
        usuarioActual.id
      );

  if (error) {

    console.warn(
      "No se pudieron cargar bloqueos:",
      error
    );

    return;
  }

  (data || []).forEach(item => {

    bloqueados.add(
      item.blocked_id
    );

  });

}


// ==========================================
// SWIPES
// ==========================================

async function cargarSwipes() {

  swipesRealizados =
    new Set();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("swipes")
      .select(
        "target_user_id"
      )
      .eq(
        "user_id",
        usuarioActual.id
      );

  if (error) {

    console.warn(
      "No se pudieron cargar swipes:",
      error
    );

    return;
  }

  (data || []).forEach(item => {

    swipesRealizados.add(
      item.target_user_id
    );

  });

}


// ==========================================
// CIUDADES
// ==========================================

function prepararCiudades() {

  const ciudades =
    [...new Set(
      perfiles
        .map(p => p.ciudad)
        .filter(Boolean)
    )]
    .sort();

  ciudadSelect.innerHTML =
    `<option value="">Todas las ciudades</option>`;

  ciudades.forEach(ciudad => {

    const option =
      document.createElement("option");

    option.value = ciudad;
    option.textContent = ciudad;

    ciudadSelect.appendChild(
      option
    );

  });

}


// ==========================================
// FILTROS
// ==========================================

document
  .getElementById("btnFiltros")
  .addEventListener(
    "click",
    aplicarFiltros
  );


function aplicarFiltros() {

  const min =
    edadMin.value
      ? Number(edadMin.value)
      : 0;

  const max =
    edadMax.value
      ? Number(edadMax.value)
      : 999;

  const ciudad =
    ciudadSelect.value;

  perfilesFiltrados =
    perfiles.filter(perfil => {

      // No mostrar al propio usuario
      if (
        perfil.id ===
        usuarioActual.id
      ) {
        return false;
      }

      // No mostrar bloqueados
      if (
        bloqueados.has(
          perfil.id
        )
      ) {
        return false;
      }

      // No mostrar personas
      // ya evaluadas
      if (
        swipesRealizados.has(
          perfil.id
        )
      ) {
        return false;
      }

      // Edad
      if (
        perfil.edad != null &&
        (
          Number(perfil.edad) < min ||
          Number(perfil.edad) > max
        )
      ) {
        return false;
      }

      // Ciudad
      if (
        ciudad &&
        perfil.ciudad !== ciudad
      ) {
        return false;
      }

      return true;

    });

  indiceActual = 0;

  mostrarPerfil();

}


// ==========================================
// MOSTRAR PERFIL
// ==========================================

function mostrarPerfil() {

  if (
    indiceActual >=
    perfilesFiltrados.length
  ) {

    contenido.innerHTML = `
      <div class="mensaje">
        <div style="font-size:55px;">
          💙
        </div>

        <h2>No hay más perfiles</h2>

        <p>
          Probá cambiar los filtros
          o volvé más tarde.
        </p>
      </div>
    `;

    return;
  }

  const perfil =
    perfilesFiltrados[
      indiceActual
    ];

  let fotoHTML = "";

  if (perfil.foto_url) {

    fotoHTML = `
      <img
        class="foto"
        src="${escapar(perfil.foto_url)}"
        alt="Foto de ${escapar(perfil.nombre || "usuario")}"
        onerror="this.outerHTML='<div class=&quot;sin-foto&quot;>👤</div>'"
      >
    `;

  } else {

    fotoHTML = `
      <div class="sin-foto">
        👤
      </div>
    `;

  }

  const online =
    perfil.online
      ? "🟢 En línea"
      : "⚪ Desconectado";

  contenido.innerHTML = `

    <div class="tarjeta">

      ${fotoHTML}

      <div class="datos">

        <div class="nombre">
          ${escapar(
            perfil.nombre ||
            "Usuario"
          )}
          ${perfil.edad
            ? ", " + perfil.edad
            : ""}
        </div>

        <div class="info">
          📍 ${
            escapar(
              perfil.ciudad ||
              "Sin ciudad"
            )
          }
        </div>

        <div class="info">
          ${online}
        </div>

        ${
          perfil.descripcion
          ? `
            <div class="descripcion">
              ${escapar(
                perfil.descripcion
              )}
            </div>
          `
          : ""
        }

        ${
          perfil.intereses
          ? `
            <div class="intereses">
              ❤️ ${
                escapar(
                  perfil.intereses
                )
              }
            </div>
          `
          : ""
        }

      </div>

      <div class="acciones">

        <button
          class="btn-no"
          id="btnNo"
          title="Pasar"
        >
          ✕
        </button>

        <button
          class="btn-si"
          id="btnSi"
          title="Me gusta"
        >
          ❤️
        </button>

      </div>

    </div>
  `;

  document
    .getElementById("btnNo")
    .addEventListener(
      "click",
      () => registrarSwipe(
        perfil,
        "pass"
      )
    );

  document
    .getElementById("btnSi")
    .addEventListener(
      "click",
      () => registrarSwipe(
        perfil,
        "like"
      )
    );

}


// ==========================================
// SWIPE
// ==========================================

async function registrarSwipe(
  perfil,
  accion
) {

  const botones =
    document.querySelectorAll(
      ".acciones button"
    );

  botones.forEach(
    boton =>
      boton.disabled = true
  );

  try {

    const {
      error
    } =
      await supabaseClient
        .from("swipes")
        .insert({
          user_id:
            usuarioActual.id,

          target_user_id:
            perfil.id,

          action:
            accion
        });

    if (error) {

      // Si ya existe ese swipe,
      // simplemente continuamos.
      if (
        error.code !== "23505"
      ) {
        throw error;
      }

    }

    swipesRealizados.add(
      perfil.id
    );

    if (accion === "like") {

      const {
        data: likesReciprocos,
        error: errorLike
      } =
        await supabaseClient
          .from("swipes")
          .select("id")
          .eq(
            "user_id",
            perfil.id
          )
          .eq(
            "target_user_id",
            usuarioActual.id
          )
          .eq(
            "action",
            "like"
          )
          .limit(1);

      if (
        !errorLike &&
        likesReciprocos &&
        likesReciprocos.length > 0
      ) {

        mostrarToast(
          "💕 ¡Es un Match!"
        );

        setTimeout(
          () => {
            siguientePerfil();
          },
          1000
        );

        return;

      }

      mostrarToast(
        "❤️ ¡Me gusta enviado!"
      );

    }

    siguientePerfil();

  } catch (error) {

    console.error(
      "Error swipe:",
      error
    );

    mostrarToast(
      "⚠️ No se pudo guardar la acción"
    );

    botones.forEach(
      boton =>
        boton.disabled = false
    );

  }

}


// ==========================================
// SIGUIENTE
// ==========================================

function siguientePerfil() {

  indiceActual++;

  mostrarPerfil();

}


// ==========================================
// NOTIFICACIONES
// ==========================================

async function cargarNotificaciones() {

  try {

    const {
      data: matches
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );

    if (
      !matches ||
      matches.length === 0
    ) {

      actualizarBadge(0);
      return;

    }

    const matchIds =
      matches.map(
        m => m.id
      );

    const {
      data: mensajes
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id,match_id,sender_id,read_at"
        )
        .in(
          "match_id",
          matchIds
        )
        .neq(
          "sender_id",
          usuarioActual.id
        )
        .is(
          "read_at",
          null
        );

    actualizarBadge(
      mensajes
        ? mensajes.length
        : 0
    );

  } catch (error) {

    console.warn(
      "Notificaciones:",
      error
    );

  }

}


// ==========================================
// BADGE
// ==========================================

function actualizarBadge(
  cantidad
) {

  const badge =
    document.getElementById(
      "badge"
    );

  if (!badge) {
    return;
  }

  if (cantidad > 0) {

    badge.textContent =
      cantidad > 9
        ? "9+"
        : cantidad;

    badge.style.display =
      "flex";

  } else {

    badge.style.display =
      "none";

  }

}


// ==========================================
// TOAST
// ==========================================

function mostrarToast(
  mensaje
) {

  toast.textContent =
    mensaje;

  toast.style.display =
    "block";

  setTimeout(
    () => {
      toast.style.display =
        "none";
    },
    2200
  );

}


// ==========================================
// ERROR
// ==========================================

function mostrarError(
  mensaje,
  error
) {

  console.error(
    error
  );

  contenido.innerHTML = `

    <div class="error">

      <div style="font-size:45px;">
        ⚠️
      </div>

      <h2>
        Ocurrió un problema
      </h2>

      <p>
        ${escapar(mensaje)}
      </p>

      <button
        class="btn-filtro"
        onclick="location.reload()"
      >
        🔄 Intentar nuevamente
      </button>

    </div>

  `;

}


// ==========================================
// SEGURIDAD HTML
// ==========================================

function escapar(
  valor
) {

  return String(
    valor ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


// ==========================================
// CARGAR NOTIFICACIONES
// ==========================================

setTimeout(
  () => {

    if (usuarioActual) {
      cargarNotificaciones();
    }

  },
  1500
);

</script>

</body>
</html>
