<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Descubrir - EmiMatch</title>

<link rel="stylesheet" href="assets/css/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>

<style>
.discovery{
  max-width:680px;
  margin:auto;
  padding:25px 16px;
}

.discovery-title{
  text-align:center;
  margin:10px 0 22px;
}

.discovery-title h1{
  margin:0;
}

.discovery-title p{
  color:var(--em-muted,#94a3b8);
  margin:7px 0 0;
}

.filters{
  padding:16px;
  margin-bottom:18px;
}

.filter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.profile-card{
  overflow:hidden;
}

.profile-photo{
  width:100%;
  height:420px;
  object-fit:cover;
  display:block;
  background:#111827;
}

.profile-info{
  padding:20px;
}

.profile-name{
  font-size:1.55rem;
  font-weight:900;
}

.profile-city{
  color:var(--em-muted,#94a3b8);
  margin:5px 0 15px;
}

.profile-description{
  line-height:1.6;
  margin-bottom:12px;
}

.profile-interests{
  color:var(--em-muted,#94a3b8);
  margin-bottom:18px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.pass{
  background:#ffffff12;
  color:var(--em-text,#fff);
}

.like{
  background:linear-gradient(135deg,#ec4899,#db2777);
  color:#fff;
}

.block{
  width:100%;
  margin-top:10px;
  background:#ef444415;
  color:#fca5a5;
}

.state{
  text-align:center;
  padding:25px 15px;
}

.match-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  place-items:center;
  padding:20px;
  background:#000b;
}

.match-box{
  width:min(420px,100%);
  text-align:center;
  padding:25px;
}

.match-photos{
  display:flex;
  justify-content:center;
  gap:15px;
  margin:20px 0;
}

.match-photos img{
  width:95px;
  height:95px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid var(--em-primary,#f5c451);
}

.match-box button{
  width:100%;
  margin-top:10px;
}

@media(max-width:500px){
  .filter-grid{
    grid-template-columns:1fr;
  }

  .profile-photo{
    height:360px;
  }
}
</style>
</head>

<body>

<main class="discovery">

  <header class="discovery-title">
    <h1>💕 Descubrir</h1>
    <p>Conocé nuevas personas y encontrá conexiones.</p>
  </header>

  <section class="em-card filters">

    <h3>🔎 Filtros</h3>

    <div class="filter-grid">

      <div>
        <label for="edadMin">Edad mínima</label>
        <input
          id="edadMin"
          class="em-input"
          type="number"
          min="18"
          max="100"
          value="18">
      </div>

      <div>
        <label for="edadMax">Edad máxima</label>
        <input
          id="edadMax"
          class="em-input"
          type="number"
          min="18"
          max="100"
          value="100">
      </div>

    </div>

    <div style="margin-top:12px">
      <label for="ciudadFiltro">Ciudad</label>
      <input
        id="ciudadFiltro"
        class="em-input"
        type="text"
        placeholder="Ej. Buenos Aires">
    </div>

    <button
      id="filtrarButton"
      class="em-btn em-btn-primary"
      style="width:100%;margin-top:12px">
      🔎 Aplicar filtros
    </button>

  </section>

  <section id="estado" class="em-card state">
    🔄 Cargando perfiles...
  </section>

  <section id="perfiles"></section>

</main>

<!-- MATCH -->

<div id="modalMatch" class="match-modal">

  <div class="em-card match-box">

    <h2>💕 ¡Hay Match!</h2>

    <p>Los dos se dieron Like.</p>

    <div class="match-photos">

      <img id="fotoMiMatch" alt="Tu foto">

      <img id="fotoOtroMatch" alt="Foto del match">

    </div>

    <button
      id="chatMatchButton"
      class="em-btn em-btn-primary">
      💬 Enviar mensaje
    </button>

    <button
      id="continuarButton"
      class="em-btn">
      🔎 Seguir descubriendo
    </button>

  </div>

</div>

<script>
(() => {

"use strict";

const config = window.EMIMATCH_CONFIG;

if (!config || !window.supabase) {
  document.getElementById("estado").textContent =
    "⚠️ No se pudo iniciar EmiMatch.";
  return;
}

const supabase = window.supabase.createClient(
  config.supabaseUrl,
  config.supabaseKey
);

const $ = id => document.getElementById(id);

let user = null;
let perfiles = [];
let index = 0;
let currentProfile = null;


/* =========================
   UTILIDADES
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function placeholder(text="EmiMatch") {

  return "https://placehold.co/700x700/111827/ffffff?text=" +
    encodeURIComponent(text);
}


/* =========================
   SESIÓN
========================= */

async function init() {

  try {

    const {data,error} =
      await supabase.auth.getSession();

    if(error) throw error;

    if(!data.session) {

      window.location.href = "index.html";
      return;
    }

    user = data.session.user;

    await loadProfiles();

  } catch(error) {

    console.error(error);

    showState(
      "❌ No se pudieron cargar los perfiles."
    );
  }
}


/* =========================
   CARGAR PERFILES
========================= */

async function loadProfiles() {

  showState("🔄 Buscando personas...");

  index = 0;

  const min =
    Number($("edadMin").value) || 18;

  const max =
    Number($("edadMax").value) || 100;

  const city =
    $("ciudadFiltro").value
      .trim()
      .toLowerCase();

  try {

    /*
     * Las consultas se realizan en paralelo
     * para reducir el tiempo de espera.
     */

    const [
      blocksResult,
      swipesResult,
      profilesResult
    ] = await Promise.all([

      supabase
        .from("user_blocks")
        .select("blocker_id,blocked_id")
        .or(
          `blocker_id.eq.${user.id},blocked_id.eq.${user.id}`
        ),

      supabase
        .from("swipes")
        .select("target_user_id")
        .eq("user_id",user.id),

      supabase
        .from("profiles")
        .select(
          "id,nombre,edad,ciudad,descripcion,foto_url,intereses,created_at"
        )
        .neq("id",user.id)
        .gte("edad",min)
        .lte("edad",max)
        .order("created_at",{ascending:false})
        .limit(50)

    ]);

    if(blocksResult.error)
      throw blocksResult.error;

    if(swipesResult.error)
      throw swipesResult.error;

    if(profilesResult.error)
      throw profilesResult.error;


    const blocked = new Set();

    (blocksResult.data || []).forEach(item => {

      if(item.blocker_id === user.id)
        blocked.add(item.blocked_id);

      if(item.blocked_id === user.id)
        blocked.add(item.blocker_id);

    });


    const swiped = new Set(
      (swipesResult.data || [])
        .map(item => item.target_user_id)
    );


    perfiles =
      (profilesResult.data || [])
      .filter(profile => {

        if(blocked.has(profile.id))
          return false;

        if(swiped.has(profile.id))
          return false;

        if(
          city &&
          !String(profile.ciudad || "")
            .toLowerCase()
            .includes(city)
        )
          return false;

        return true;
      });


    renderProfile();

  } catch(error) {

    console.error(
      "Error cargando perfiles:",
      error
    );

    showState(
      "⚠️ No se pudieron cargar los perfiles."
    );
  }
}


/* =========================
   MOSTRAR PERFIL
========================= */

function renderProfile() {

  if(index >= perfiles.length) {

    showState(`
      <h3>💙 No hay más perfiles</h3>
      <p>
        Probá cambiar los filtros o
        volvé más tarde.
      </p>
    `);

    return;
  }

  const profile = perfiles[index];

  currentProfile = profile;

  $("estado").style.display = "none";

  $("perfiles").innerHTML = `

    <article class="em-card profile-card">

      <img
        class="profile-photo"
        src="${escapeHTML(
          profile.foto_url || placeholder()
        )}"
        alt="Foto de ${escapeHTML(profile.nombre || "usuario")}"
        onerror="this.src='${placeholder()}'">

      <div class="profile-info">

        <div class="profile-name">
          ${escapeHTML(profile.nombre || "Sin nombre")}
          ${profile.edad ? ", " + escapeHTML(profile.edad) : ""}
        </div>

        <div class="profile-city">
          📍 ${escapeHTML(profile.ciudad || "Sin ciudad")}
        </div>

        ${
          profile.descripcion
          ? `
            <div class="profile-description">
              ${escapeHTML(profile.descripcion)}
            </div>
          `
          : ""
        }

        ${
          profile.intereses
          ? `
            <div class="profile-interests">
              ❤️ ${escapeHTML(profile.intereses)}
            </div>
          `
          : ""
        }

        <div class="actions">

          <button
            class="em-btn pass"
            id="passButton">
            ❌ Pasar
          </button>

          <button
            class="em-btn like"
            id="likeButton">
            ❤️ Like
          </button>

        </div>

        <button
          class="em-btn block"
          id="blockButton">
          🚫 Bloquear
        </button>

      </div>

    </article>
  `;


  $("passButton").onclick =
    () => swipe("pass");

  $("likeButton").onclick =
    () => swipe("like");

  $("blockButton").onclick =
    blockUser;
}


/* =========================
   SWIPE
========================= */

async function swipe(action) {

  if(!currentProfile)
    return;

  const target = currentProfile;

  $("passButton").disabled = true;
  $("likeButton").disabled = true;

  try {

    const {error} =
      await supabase
        .from("swipes")
        .insert({
          user_id:user.id,
          target_user_id:target.id,
          action
        });

    if(error && error.code !== "23505")
      throw error;


    index++;

    if(action === "like") {

      const isMatch =
        await checkMatch(target.id);

      if(isMatch) {

        await prepareMatch(target);

        $("modalMatch").style.display =
          "grid";

        return;
      }
    }

    renderProfile();

  } catch(error) {

    console.error(error);

    alert(
      "No se pudo guardar la acción."
    );

    renderProfile();
  }
}


/* =========================
   MATCH
========================= */

async function checkMatch(targetId) {

  const [
    direct,
    reverse
  ] = await Promise.all([

    supabase
      .from("matches")
      .select("id")
      .eq("user1_id",user.id)
      .eq("user2_id",targetId)
      .limit(1),

    supabase
      .from("matches")
      .select("id")
      .eq("user1_id",targetId)
      .eq("user2_id",user.id)
      .limit(1)

  ]);

  if(direct.error || reverse.error)
    return false;

  return Boolean(
    direct.data?.length ||
    reverse.data?.length
  );
}


/* =========================
   PREPARAR MATCH
========================= */

async function prepareMatch(profile) {

  const {data} =
    await supabase
      .from("profiles")
      .select("foto_url")
      .eq("id",user.id)
      .maybeSingle();

  $("fotoMiMatch").src =
    data?.foto_url || placeholder("Yo");

  $("fotoOtroMatch").src =
    profile.foto_url || placeholder("Match");
}


/* =========================
   BLOQUEAR
========================= */

async function blockUser() {

  if(!currentProfile)
    return;

  if(!confirm(
    "¿Querés bloquear a este usuario?"
  ))
    return;

  try {

    const {error} =
      await supabase
        .from("user_blocks")
        .insert({
          blocker_id:user.id,
          blocked_id:currentProfile.id
        });

    if(error && error.code !== "23505")
      throw error;

    index++;

    renderProfile();

  } catch(error) {

    console.error(error);

    alert(
      "No se pudo bloquear al usuario."
    );
  }
}


/* =========================
   ESTADO
========================= */

function showState(html) {

  $("estado").style.display = "block";
  $("estado").innerHTML = html;
  $("perfiles").innerHTML = "";
}


/* =========================
   FILTROS
========================= */

$("filtrarButton").onclick =
  loadProfiles;


/* =========================
   MODAL MATCH
========================= */

$("continuarButton").onclick =
() => {

  $("modalMatch").style.display =
    "none";

  renderProfile();
};


$("chatMatchButton").onclick =
() => {

  if(!currentProfile)
    return;

  window.location.href =
    "conversacion.html?user=" +
    encodeURIComponent(
      currentProfile.id
    );
};


/* =========================
   INICIAR
========================= */

init();

})();
</script>

<script src="assets/js/app.js"></script>
<script src="assets/js/components.js"></script>

</body>
</html>
