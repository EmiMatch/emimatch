<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmiMatch - Descubrir</title>

  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    body {
      margin: 0;
      background: #08111f;
      color: #fff;
    }

    .discover-page {
      max-width: 700px;
      margin: auto;
      padding: 90px 16px 120px;
    }

    .discover-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .discover-top h1 {
      margin: 0;
      font-size: 25px;
    }

    .discover-top p {
      margin: 5px 0 0;
      color: #9ca9bd;
      font-size: 14px;
    }

    .filter-btn {
      width: 45px;
      height: 45px;
      border: 0;
      border-radius: 50%;
      background: #18243a;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .filters {
      display: none;
      background: #111d30;
      border: 1px solid #26344b;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .filters.show {
      display: block;
    }

    .filters label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .filters input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #30415c;
      background: #0a1424;
      color: #fff;
    }

    .profile-card {
      overflow: hidden;
      background: #111d30;
      border: 1px solid #26344b;
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    .profile-photo {
      position: relative;
      height: 430px;
      background: #162238;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 55px 20px 20px;
      background: linear-gradient(
        transparent,
        rgba(0,0,0,.88)
      );
    }

    .profile-name {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
    }

    .profile-city {
      margin-top: 5px;
      color: #d5dbea;
      font-size: 14px;
    }

    .badges {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 7px 10px;
      border-radius: 20px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(8px);
      font-size: 12px;
    }

    .profile-info {
      padding: 18px;
    }

    .profile-description {
      color: #d3d9e5;
      line-height: 1.5;
      font-size: 14px;
      margin: 0 0 14px;
    }

    .interests {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .interest {
      padding: 7px 10px;
      border-radius: 20px;
      background: #1b2a42;
      color: #e6ebf5;
      font-size: 12px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 20px;
    }

    .action {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      font-size: 22px;
      background: #1a2940;
      color: #fff;
    }

    .action.like {
      background: #d7aa3f;
      color: #111;
    }

    .action.pass {
      background: #252f42;
    }

    .action.block {
      background: #7f1d1d;
    }

    .message {
      margin: 15px 0;
      padding: 13px;
      border-radius: 13px;
      background: #111d30;
      border: 1px solid #26344b;
      color: #d9e1ee;
      font-size: 14px;
    }

    .error {
      border-color: #7f1d1d;
      color: #fecaca;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: #111d30;
      border: 1px solid #26344b;
      border-radius: 22px;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .empty h2 {
      margin: 0 0 8px;
    }

    .empty p {
      color: #9ca9bd;
      font-size: 14px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      background: #111d30;
      border: 1px solid #30415c;
      border-radius: 25px;
      padding: 25px;
      text-align: center;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .modal-box button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 13px;
      background: #d7aa3f;
      color: #111;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .discover-page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .profile-photo {
        height: 390px;
      }

      .action {
        width: 54px;
        height: 54px;
      }
    }
  </style>
</head>

<body>

  <main class="discover-page">

    <div class="discover-top">
      <div>
        <h1>💕 Descubrir</h1>
        <p>Encontrá nuevas conexiones.</p>
      </div>

      <button
        class="filter-btn"
        id="filterButton"
        type="button"
        aria-label="Filtros">
        ⚙️
      </button>
    </div>

    <section class="filters" id="filters">

      <label for="minAge">Edad mínima</label>
      <input
        id="minAge"
        type="number"
        min="18"
        max="100"
        value="18">

      <label for="maxAge">Edad máxima</label>
      <input
        id="maxAge"
        type="number"
        min="18"
        max="100"
        value="60">

      <label for="cityFilter">Ciudad</label>
      <input
        id="cityFilter"
        type="text"
        placeholder="Ej: La Plata">

      <button
        id="applyFilters"
        class="em-btn em-btn-primary"
        type="button">
        Aplicar filtros
      </button>

    </section>

    <div id="status"></div>

    <section id="profileContainer"></section>

  </main>

  <div class="modal" id="matchModal">
    <div class="modal-box">
      <div style="font-size:50px;">💕</div>
      <h2>¡Hicieron Match!</h2>
      <p id="matchText">
        Los dos se dieron Like.
      </p>

      <button id="chatButton" type="button">
        💬 Enviar mensaje
      </button>

      <button
        id="closeMatch"
        type="button"
        style="background:#26344b;color:#fff;">
        Seguir descubriendo
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>

  <script>
    (() => {
      "use strict";

      let db = null;
      let currentUser = null;
      let profiles = [];
      let currentIndex = 0;
      let currentProfile = null;

      const $ = (id) => document.getElementById(id);

      function showStatus(message, error = false) {
        $("status").innerHTML =
          '<div class="message ' +
          (error ? "error" : "") +
          '">' +
          message +
          "</div>";
      }

      function escapeHTML(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function getPhoto(profile) {
        return profile.foto_url ||
          "https://placehold.co/700x900/111d30/d7aa3f?text=EmiMatch";
      }

      function getInterests(profile) {
        if (!profile.intereses) return [];

        if (Array.isArray(profile.intereses)) {
          return profile.intereses;
        }

        return String(profile.intereses)
          .split(",")
          .map(x => x.trim())
          .filter(Boolean);
      }

      function renderEmpty() {
        $("profileContainer").innerHTML = `
          <div class="empty">
            <div class="empty-icon">💫</div>
            <h2>No hay más perfiles</h2>
            <p>
              Probá ampliar el rango de edad
              o cambiar la ciudad.
            </p>
          </div>
        `;
      }

      function renderProfile() {
        if (!profiles.length || currentIndex >= profiles.length) {
          renderEmpty();
          return;
        }

        currentProfile = profiles[currentIndex];

        const interests = getInterests(currentProfile);

        const interestsHTML = interests
          .slice(0, 8)
          .map(
            interest =>
              `<span class="interest">${escapeHTML(interest)}</span>`
          )
          .join("");

        $("profileContainer").innerHTML = `
          <article class="profile-card">

            <div class="profile-photo">

              <img
                src="${escapeHTML(getPhoto(currentProfile))}"
                alt="Foto de ${escapeHTML(currentProfile.nombre)}"
                onerror="this.src='https://placehold.co/700x900/111d30/d7aa3f?text=EmiMatch';">

              <div class="badges">
                <span class="badge">💚 Disponible</span>
              </div>

              <div class="photo-overlay">
                <h2 class="profile-name">
                  ${escapeHTML(currentProfile.nombre)}
                  ${currentProfile.edad ? ", " + escapeHTML(currentProfile.edad) : ""}
                </h2>

                <div class="profile-city">
                  📍 ${escapeHTML(currentProfile.ciudad || "Argentina")}
                </div>
              </div>

            </div>

            <div class="profile-info">

              ${
                currentProfile.descripcion
                  ? `<p class="profile-description">
                      ${escapeHTML(currentProfile.descripcion)}
                    </p>`
                  : `<p class="profile-description">
                      Conocé más sobre esta persona en su perfil.
                    </p>`
              }

              <div class="interests">
                ${interestsHTML}
              </div>

            </div>

            <div class="actions">

              <button
                class="action pass"
                id="passButton"
                type="button"
                title="Pasar">
                ✕
              </button>

              <button
                class="action"
                id="blockButton"
                type="button"
                title="Bloquear">
                🚫
              </button>

              <button
                class="action like"
                id="likeButton"
                type="button"
                title="Me gusta">
                ♥
              </button>

            </div>

          </article>
        `;

        $("passButton").addEventListener(
          "click",
          () => swipe("pass")
        );

        $("likeButton").addEventListener(
          "click",
          () => swipe("like")
        );

        $("blockButton").addEventListener(
          "click",
          blockCurrentProfile
        );
      }

      async function initialize() {

        if (!window.EMIMATCH_CONFIG) {
          showStatus(
            "No se encontró la configuración de EmiMatch.",
            true
          );
          return;
        }

        db = window.supabase.createClient(
          window.EMIMATCH_CONFIG.supabaseUrl,
          window.EMIMATCH_CONFIG.supabaseKey
        );

        const {
          data: {
            session
          },
          error: sessionError
        } = await db.auth.getSession();

        if (sessionError) {
          showStatus(
            "Error de sesión: " +
            escapeHTML(sessionError.message),
            true
          );
          return;
        }

        if (!session) {
          window.location.href = "index.html";
          return;
        }

        currentUser = session.user;

        await loadProfiles();
      }

      async function loadProfiles() {

        showStatus("Buscando perfiles...");

        currentIndex = 0;

        const minAge =
          Number($("minAge").value) || 18;

        const maxAge =
          Number($("maxAge").value) || 100;

        const city =
          $("cityFilter").value.trim();

        /*
          IMPORTANTE:

          No consultamos user_blocks directamente.

          La versión anterior fallaba porque asumía
          que existía user_blocks.blocked_user_id.

          Primero cargamos los perfiles y luego usamos
          las relaciones disponibles para evitar que
          una columna inexistente rompa Descubrir.
        */

        let query = db
          .from("profiles")
          .select("*")
          .neq("id", currentUser.id)
          .gte("edad", minAge)
          .lte("edad", maxAge)
          .order("created_at", {
            ascending: false
          });

        if (city) {
          query = query.ilike(
            "ciudad",
            "%" + city + "%"
          );
        }

        const {
          data,
          error
        } = await query;

        if (error) {
          showStatus(
            "profiles: " +
            escapeHTML(error.message),
            true
          );

          $("profileContainer").innerHTML = "";
          return;
        }

        profiles = data || [];

        /*
          Quitamos perfiles con los que ya hubo swipe.

          Si la tabla swipes todavía tiene problemas de
          permisos/RLS, no destruimos toda la pantalla:
          mostramos los perfiles disponibles.
        */

        const {
          data: swipes,
          error: swipesError
        } = await db
          .from("swipes")
          .select("target_user_id")
          .eq("user_id", currentUser.id);

        if (!swipesError && swipes) {

          const swipedIds = new Set(
            swipes.map(
              swipe => swipe.target_user_id
            )
          );

          profiles = profiles.filter(
            profile =>
              !swipedIds.has(profile.id)
          );
        }

        if (swipesError) {
          console.warn(
            "EmiMatch: no se pudieron cargar los swipes:",
            swipesError.message
          );
        }

        showStatus("");

        renderProfile();
      }

      async function swipe(type) {

        if (!currentProfile) return;

        const targetId =
          currentProfile.id;

        const {
          error
        } = await db
          .from("swipes")
          .upsert(
            {
              user_id: currentUser.id,
              target_user_id: targetId,
              type: type
            },
            {
              onConflict:
                "user_id,target_user_id"
            }
          );

        if (error) {
          showStatus(
            "No se pudo guardar la acción: " +
            escapeHTML(error.message),
            true
          );
          return;
        }

        if (type === "like") {
          await checkMatch(targetId);
        }

        currentIndex++;
        renderProfile();
      }

      async function checkMatch(targetId) {

        const {
          data,
          error
        } = await db
          .from("swipes")
          .select("id")
          .eq("user_id", targetId)
          .eq("target_user_id", currentUser.id)
          .eq("type", "like")
          .maybeSingle();

        if (error) {
          console.warn(
            "No se pudo comprobar el match:",
            error.message
          );
          return;
        }

        if (!data) return;

        const {
          data: existingMatch
        } = await db
          .from("matches")
          .select("id")
          .or(
            "and(user1_id.eq." +
            currentUser.id +
            ",user2_id.eq." +
            targetId +
            "),and(user1_id.eq." +
            targetId +
            ",user2_id.eq." +
            currentUser.id +
            ")"
          )
          .maybeSingle();

        if (!existingMatch) {

          const {
            error: matchError
          } = await db
            .from("matches")
            .insert({
              user1_id: currentUser.id,
              user2_id: targetId
            });

          if (matchError) {
            console.warn(
              "No se pudo crear el match:",
              matchError.message
            );
          }
        }

        $("matchText").textContent =
          "Vos y " +
          (currentProfile.nombre || "esta persona") +
          " se dieron Like.";

        $("matchModal").classList.add("show");

        $("chatButton").onclick = () => {
          window.location.href =
            "conversacion.html?user=" +
            encodeURIComponent(targetId);
        };
      }

      async function blockCurrentProfile() {

        if (!currentProfile) return;

        const confirmed =
          window.confirm(
            "¿Querés bloquear a " +
            (currentProfile.nombre || "esta persona") +
            "?"
          );

        if (!confirmed) return;

        /*
          No usamos una columna inventada.

          El bloqueo queda representado por un swipe
          especial para que Descubrir no vuelva a mostrar
          a esta persona.

          Esto evita romper la aplicación mientras
          verificamos el esquema real de user_blocks.
        */

        const {
          error
        } = await db
          .from("swipes")
          .upsert(
            {
              user_id: currentUser.id,
              target_user_id: currentProfile.id,
              type: "block"
            },
            {
              onConflict:
                "user_id,target_user_id"
            }
          );

        if (error) {
          showStatus(
            "No se pudo bloquear: " +
            escapeHTML(error.message),
            true
          );
          return;
        }

        currentIndex++;
        renderProfile();
      }

      $("filterButton").addEventListener(
        "click",
        () => {
          $("filters").classList.toggle("show");
        }
      );

      $("applyFilters").addEventListener(
        "click",
        loadProfiles
      );

      $("closeMatch").addEventListener(
        "click",
        () => {
          $("matchModal").classList.remove("show");
        }
      );

      initialize();

    })();
  </script>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/components.js"></script>

</body>
</html>
