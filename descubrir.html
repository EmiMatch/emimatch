<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EmiMatch - Descubrí nuevas conexiones.">
  <meta name="theme-color" content="#08111f">

  <title>EmiMatch - Descubrir</title>

  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    body {
      margin: 0;
      background: #08111f;
      color: #fff;
    }

    .discover-page {
      max-width: 700px;
      margin: auto;
      padding: 90px 15px 120px;
    }

    .discover-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .discover-title h1 {
      margin: 0;
      font-size: 26px;
    }

    .discover-title p {
      margin: 5px 0 0;
      color: #9ca9bd;
      font-size: 14px;
    }

    .filter-btn {
      width: 45px;
      height: 45px;
      border: 0;
      border-radius: 50%;
      background: #18243a;
      color: #fff;
      cursor: pointer;
      font-size: 19px;
    }

    .filters {
      display: none;
      padding: 16px;
      margin-bottom: 16px;
      background: #111d30;
      border: 1px solid #26344b;
      border-radius: 18px;
    }

    .filters.show {
      display: block;
    }

    .filters label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .filters input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #30415c;
      border-radius: 12px;
      background: #0a1424;
      color: #fff;
      outline: none;
    }

    .profile-card {
      overflow: hidden;
      background: #111d30;
      border: 1px solid #26344b;
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(0,0,0,.32);
    }

    .profile-photo {
      position: relative;
      height: 430px;
      background: #162238;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badges {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 7px 10px;
      border-radius: 20px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(8px);
      font-size: 12px;
    }

    .photo-overlay {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 60px 20px 20px;
      background: linear-gradient(
        transparent,
        rgba(0,0,0,.9)
      );
    }

    .profile-name {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
    }

    .profile-city {
      margin-top: 5px;
      color: #d5dbea;
      font-size: 14px;
    }

    .profile-info {
      padding: 18px;
    }

    .profile-description {
      margin: 0 0 14px;
      color: #d3d9e5;
      line-height: 1.5;
      font-size: 14px;
    }

    .interests {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .interest {
      padding: 7px 10px;
      border-radius: 20px;
      background: #1b2a42;
      color: #e6ebf5;
      font-size: 12px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 20px;
    }

    .action {
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: #1a2940;
      color: #fff;
      cursor: pointer;
      font-size: 22px;
    }

    .action.pass {
      background: #252f42;
    }

    .action.like {
      background: #d7aa3f;
      color: #111;
    }

    .action.block {
      background: #7f1d1d;
    }

    .message {
      margin: 15px 0;
      padding: 13px;
      border-radius: 13px;
      background: #111d30;
      border: 1px solid #26344b;
      color: #d9e1ee;
      font-size: 14px;
    }

    .message.error {
      border-color: #7f1d1d;
      color: #fecaca;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      background: #111d30;
      border: 1px solid #26344b;
      border-radius: 22px;
    }

    .empty-icon {
      margin-bottom: 10px;
      font-size: 42px;
    }

    .empty h2 {
      margin: 0 0 8px;
    }

    .empty p {
      margin: 0;
      color: #9ca9bd;
      font-size: 14px;
      line-height: 1.5;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.78);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
      padding: 25px;
      border: 1px solid #30415c;
      border-radius: 25px;
      background: #111d30;
      text-align: center;
    }

    .modal-box h2 {
      margin: 8px 0;
    }

    .modal-box p {
      color: #aebbd0;
      font-size: 14px;
    }

    .modal-box button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 0;
      border-radius: 13px;
      background: #d7aa3f;
      color: #111;
      font-weight: 800;
      cursor: pointer;
    }

    .modal-box .secondary {
      background: #26344b;
      color: #fff;
    }

    @media (max-width: 600px) {
      .discover-page {
        padding-right: 12px;
        padding-left: 12px;
      }

      .profile-photo {
        height: 390px;
      }

      .action {
        width: 54px;
        height: 54px;
      }
    }
  </style>
</head>

<body>

  <main class="discover-page">

    <div class="discover-top">

      <div class="discover-title">
        <h1>💕 Descubrir</h1>
        <p>Encontrá nuevas conexiones.</p>
      </div>

      <button
        id="filterButton"
        class="filter-btn"
        type="button"
        aria-label="Abrir filtros">
        ⚙️
      </button>

    </div>

    <section
      id="filters"
      class="filters">

      <label for="minAge">
        Edad mínima
      </label>

      <input
        id="minAge"
        type="number"
        min="18"
        max="100"
        value="18">

      <label for="maxAge">
        Edad máxima
      </label>

      <input
        id="maxAge"
        type="number"
        min="18"
        max="100"
        value="60">

      <label for="cityFilter">
        Ciudad
      </label>

      <input
        id="cityFilter"
        type="text"
        placeholder="Ej: La Plata">

      <button
        id="applyFilters"
        class="em-btn em-btn-primary"
        type="button">
        Aplicar filtros
      </button>

    </section>

    <div id="status"></div>

    <section id="profileContainer"></section>

  </main>

  <!-- MODAL MATCH -->
