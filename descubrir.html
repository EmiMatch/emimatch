<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch · Descubrir</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --azul: #07152f;
      --azul2: #102b5c;
      --dorado: #d4af37;
      --blanco: #ffffff;
      --muted: #cbd5e1;
      --rosa: #e11d48;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 92px;
      font-family: Arial, sans-serif;
      color: var(--blanco);
      background: linear-gradient(135deg, var(--azul), var(--azul2));
    }

    header {
      text-align: center;
      padding: 26px 16px 18px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .contenedor {
      width: 92%;
      max-width: 520px;
      margin: auto;
    }

    .filtros {
      padding: 18px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,.16);
    }

    .filtros h3 {
      margin: 0 0 14px;
    }

    .fila {
      display: flex;
      gap: 10px;
    }

    input,
    select,
    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 13px;
      font-size: 15px;
    }

    input,
    select {
      background: #fff;
      color: #111;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-filtro {
      margin-top: 11px;
      background: var(--dorado);
      color: var(--azul);
    }

    .contador {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 14px 0;
    }

    .cargando,
    .mensaje,
    .error {
      padding: 28px 20px;
      border-radius: 20px;
      text-align: center;
      margin-top: 18px;
      background: rgba(255,255,255,.09);
    }

    .error {
      background: rgba(220,38,38,.18);
      border: 1px solid rgba(239,68,68,.7);
    }

    .error-detalle {
      font-size: 12px;
      color: #fecaca;
      margin-top: 10px;
      word-break: break-word;
    }

    .tarjeta {
      overflow: hidden;
      background: #fff;
      color: #111;
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(0,0,0,.35);
    }

    .foto,
    .sin-foto {
      width: 100%;
      height: 430px;
      display: block;
    }

    .foto {
      object-fit: cover;
      background: #ddd;
    }

    .sin-foto {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        #d4af37,
        #f5e6a8
      );
      font-size: 82px;
    }

    .datos {
      padding: 20px;
    }

    .nombre {
      font-size: 26px;
      font-weight: 800;
    }

    .info {
      margin-top: 7px;
      color: #5b6472;
    }

    .descripcion {
      margin-top: 15px;
      line-height: 1.55;
      color: #30343b;
    }

    .intereses {
      margin-top: 13px;
      color: #173d7a;
      font-weight: 700;
    }

    .acciones {
      display: flex;
      gap: 14px;
      padding: 0 20px 20px;
    }

    .acciones button {
      height: 58px;
      font-size: 28px;
    }

    .btn-no {
      background: #eef0f3;
      color: #111;
    }

    .btn-si {
      background: var(--rosa);
      color: #fff;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 105px;
      transform: translateX(-50%);
      display: none;
      z-index: 1200;
      background: #111827;
      color: #fff;
      padding: 13px 20px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,.3);
      max-width: 90%;
      text-align: center;
    }

    .nav {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 65px;
      padding: 0 5px;
      background: rgba(7,21,47,.98);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 21px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }

    .nav a {
      position: relative;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 10px;
      text-align: center;
      min-width: 55px;
    }

    .nav a span {
      display: block;
      font-size: 21px;
      margin-bottom: 2px;
    }

    .nav a.activo {
      color: var(--dorado);
    }

    .badge {
      position: absolute;
      top: -5px;
      right: 2px;
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 50%;
      background: #ef4444;
      color: #fff;
      font-size: 10px;
    }

    @media (max-width: 380px) {
      .nav a {
        font-size: 9px;
        min-width: 48px;
      }

      .nav a span {
        font-size: 18px;
      }

      .foto,
      .sin-foto {
        height: 350px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">💕 EmiMatch</div>
  <p>Descubrí nuevas personas y conectá</p>
</header>

<main class="contenedor">

  <section class="filtros">

    <h3>🎯 Buscar perfiles</h3>

    <div class="fila">

      <input
        id="edadMin"
        type="number"
        min="18"
        max="100"
        placeholder="Edad mín."
      >

      <input
        id="edadMax"
        type="number"
        min="18"
        max="100"
        placeholder="Edad máx."
      >

    </div>

    <select
      id="ciudad"
      style="margin-top:10px"
    >
      <option value="">
        Todas las ciudades
      </option>
    </select>

    <button
      id="btnFiltros"
      class="btn-filtro"
    >
      🔎 Aplicar filtros
    </button>

  </section>

  <div
    id="contador"
    class="contador"
  ></div>

  <div id="contenido">

    <div class="cargando">
      🔐 Verificando sesión...
    </div>

  </div>

</main>

<div
  id="toast"
  class="toast"
></div>

<nav class="nav">

  <a href="perfil.html">
    <span>👤</span>
    Perfil
  </a>

  <a
    href="descubrir.html"
    class="activo"
  >
    <span>🔎</span>
    Descubrir
  </a>

  <a href="likes.html">
    <span>❤️</span>
    Me gustas
  </a>

  <a href="chat.html">
    <span>💕</span>
    Matches
  </a>

  <a href="notificaciones.html">

    <span>🔔</span>
    Notificaciones

    <b
      id="badge"
      class="badge"
    >
      0
    </b>

  </a>

</nav>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;

let perfiles = [];

let perfilesFiltrados = [];

let indiceActual = 0;

let bloqueados = new Set();

let swipesRealizados = new Set();


const $ = id =>
  document.getElementById(id);


const contenido =
  $("contenido");

const contador =
  $("contador");

const ciudadSelect =
  $("ciudad");

const edadMin =
  $("edadMin");

const edadMax =
  $("edadMax");

const toast =
  $("toast");


document.addEventListener(
  "DOMContentLoaded",
  iniciar
);


$("btnFiltros").addEventListener(
  "click",
  aplicarFiltros
);


// ==========================================
// INICIAR
// ==========================================

async function iniciar() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {
      throw error;
    }


    if (!data.session) {

      location.href =
        "index.html";

      return;

    }


    usuarioActual =
      data.session.user;


    await cargarPerfiles();

    await cargarNotificaciones();


  } catch (error) {

    console.error(
      error
    );

    mostrarError(
      "No se pudo iniciar Descubrir.",
      error
    );

  }

}


// ==========================================
// CARGAR PERFILES
// ==========================================

async function cargarPerfiles() {

  contenido.innerHTML = `
    <div class="cargando">
      🔎 Buscando personas...
    </div>
  `;


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(`
          id,
          nombre,
          edad,
          ciudad,
          descripcion,
          foto_url,
          intereses,
          online,
          last_seen
        `);


    if (error) {
      throw error;
    }


    perfiles =
      data || [];


    await cargarBloqueados();

    await cargarSwipes();

    prepararCiudades();

    aplicarFiltros();


  } catch (error) {

    console.error(
      error
    );

    mostrarError(
      "No se pudieron cargar los perfiles.",
      error
    );

  }

}


// ==========================================
// BLOQUEADOS
// ==========================================

async function cargarBloqueados() {

  bloqueados =
    new Set();


  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_blocks")
      .select(
        "blocked_id"
      )
      .eq(
        "blocker_id",
        usuarioActual.id
      );


  if (error) {

    console.warn(
      "Bloqueos:",
      error
    );

    return;

  }


  (data || []).forEach(
    item => {

      bloqueados.add(
        item.blocked_id
      );

    }
  );

}


// ==========================================
// SWIPES
// ==========================================

async function cargarSwipes() {

  swipesRealizados =
    new Set();


  const {
    data,
    error
  } =
    await supabaseClient
      .from("swipes")
      .select(
        "target_user_id"
      )
      .eq(
        "user_id",
        usuarioActual.id
      );


  if (error) {

    console.warn(
      "Swipes:",
      error
    );

    return;

  }


  (data || []).forEach(
    item => {

      swipesRealizados.add(
        item.target_user_id
      );

    }
  );

}


// ==========================================
// CIUDADES
// ==========================================

function prepararCiudades() {

  const ciudades =
    [
      ...new Set(
        perfiles
          .map(
            perfil =>
              perfil.ciudad
          )
          .filter(Boolean)
      )
    ]
    .sort(
      (a,b) =>
        a.localeCompare(b)
    );


  ciudadSelect.innerHTML = `
    <option value="">
      Todas las ciudades
    </option>
  `;


  ciudades.forEach(
    ciudad => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        ciudad;

      option.textContent =
        ciudad;


      ciudadSelect.appendChild(
        option
      );

    }
  );

}


// ==========================================
// FILTROS
// ==========================================

function aplicarFiltros() {

  const min =
    edadMin.value
      ? Number(
          edadMin.value
        )
      : 18;


  const max =
    edadMax.value
      ? Number(
          edadMax.value
        )
      : 100;


  const ciudad =
    ciudadSelect.value;


  perfilesFiltrados =
    perfiles.filter(
      perfil => {

        if (
          perfil.id ===
          usuarioActual.id
        ) {
          return false;
        }


        if (
          bloqueados.has(
            perfil.id
          )
        ) {
          return false;
        }


        if (
          swipesRealizados.has(
            perfil.id
          )
        ) {
          return false;
        }


        if (
          perfil.edad !== null &&
          perfil.edad !== undefined &&
          perfil.edad !== ""
        ) {

          const edad =
            Number(
              perfil.edad
            );


          if (
            edad < min ||
            edad > max
          ) {
            return false;
          }

        }


        if (
          ciudad &&
          perfil.ciudad !== ciudad
        ) {
          return false;
        }


        return true;

      }
    );


  indiceActual = 0;

  actualizarContador();

  mostrarPerfil();

}


// ==========================================
// CONTADOR
// ==========================================

function actualizarContador() {

  if (
    perfilesFiltrados.length === 0
  ) {

    contador.textContent =
      "";

    return;

  }


  contador.textContent =
    `👥 ${
      perfilesFiltrados.length
    } perfil${
      perfilesFiltrados.length === 1
        ? ""
        : "es"
    } disponible${
      perfilesFiltrados.length === 1
        ? ""
        : "s"
    }`;

}


// ==========================================
// MOSTRAR PERFIL
// ==========================================

function mostrarPerfil() {

  if (
    indiceActual >=
    perfilesFiltrados.length
  ) {

    contador.textContent =
      "";


    contenido.innerHTML = `

      <div class="mensaje">

        <div
          style="font-size:58px"
        >
          💙
        </div>

        <h2>
          Por ahora no hay más perfiles
        </h2>

        <p>
          Probá ampliar el rango
          de edad o cambiar la ciudad
          para descubrir nuevas personas.
        </p>

      </div>

    `;

    return;

  }


  const perfil =
    perfilesFiltrados[
      indiceActual
    ];


  const foto =
    perfil.foto_url

      ? `

        <img
          class="foto"
          src="${escapar(
            perfil.foto_url
          )}"
          alt="Foto de ${
            escapar(
              perfil.nombre ||
              "usuario"
            )
          }"
          onerror="
            this.outerHTML =
            '<div class=&quot;sin-foto&quot;>👤</div>'
          "
        >

      `

      : `

        <div class="sin-foto">
          👤
        </div>

      `;


  contenido.innerHTML = `

    <article class="tarjeta">

      ${foto}

      <div class="datos">

        <div class="nombre">

          ${escapar(
            perfil.nombre ||
            "Usuario"
          )}

          ${
            perfil.edad
              ? ", " +
                escapar(
                  perfil.edad
                )
              : ""
          }

        </div>


        <div class="info">

          📍 ${
            escapar(
              perfil.ciudad ||
              "Sin ciudad"
            )
          }

        </div>


        <div class="info">

          ${
            perfil.online
              ? "🟢 En línea"
              : "⚪ Desconectado"
          }

        </div>


        ${
          perfil.descripcion

            ? `

              <div class="descripcion">

                ${escapar(
                  perfil.descripcion
                )}

              </div>

            `

            : ""
        }


        ${
          perfil.intereses

            ? `

              <div class="intereses">

                ❤️ ${
                  escapar(
                    perfil.intereses
                  )
                }

              </div>

            `

            : ""
        }

      </div>


      <div class="acciones">

        <button
          class="btn-no"
          id="btnNo"
          title="Pasar"
          aria-label="Pasar"
        >
          ✕
        </button>


        <button
          class="btn-si"
          id="btnSi"
          title="Me gusta"
          aria-label="Me gusta"
        >
          ❤️
        </button>

      </div>

    </article>

  `;


  $("btnNo").addEventListener(
    "click",
    () =>
      registrarSwipe(
        perfil,
        "pass"
      )
  );


  $("btnSi").addEventListener(
    "click",
    () =>
      registrarSwipe(
        perfil,
        "like"
      )
  );

}


// ==========================================
// REGISTRAR SWIPE
// ==========================================

async function registrarSwipe(
  perfil,
  accion
) {

  const botones =
    document.querySelectorAll(
      ".acciones button"
    );


  botones.forEach(
    boton =>
      boton.disabled = true
  );


  try {

    const {
      error
    } =
      await supabaseClient
        .from("swipes")
        .insert({

          user_id:
            usuarioActual.id,

          target_user_id:
            perfil.id,

          action:
            accion

        });


    if (
      error &&
      error.code !==
      "23505"
    ) {

      throw error;

    }


    swipesRealizados.add(
      perfil.id
    );


    if (
      accion ===
      "like"
    ) {

      const {
        data
      } =
        await supabaseClient
          .from("swipes")
          .select("id")
          .eq(
            "user_id",
            perfil.id
          )
          .eq(
            "target_user_id",
            usuarioActual.id
          )
          .eq(
            "action",
            "like"
          )
          .limit(1);


      if (
        data &&
        data.length
      ) {

        mostrarToast(
          "💕 ¡Es un Match!"
        );


        setTimeout(
          () => {

            indiceActual++;

            actualizarContador();

            mostrarPerfil();

          },
          900
        );


        return;

      }


      mostrarToast(
        "❤️ ¡Me gusta enviado!"
      );

    }


    indiceActual++;

    actualizarContador();


    setTimeout(
      mostrarPerfil,
      250
    );


  } catch (error) {

    console.error(
      error
    );


    mostrarToast(
      "⚠️ No se pudo guardar la acción"
    );


    botones.forEach(
      boton =>
        boton.disabled = false
    );

  }

}


// ==========================================
// NOTIFICACIONES
// ==========================================

async function cargarNotificaciones() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .select("id")
        .neq(
          "sender_id",
          usuarioActual.id
        )
        .is(
          "read_at",
          null
        )
        .limit(50);


    if (error) {
      throw error;
    }


    const badge =
      $("badge");


    const total =
      (data || []).length;


    if (
      total > 0
    ) {

      badge.textContent =
        total > 99
          ? "99+"
          : total;


      badge.style.display =
        "flex";

    } else {

      badge.style.display =
        "none";

    }


  } catch (error) {

    console.warn(
      "Notificaciones:",
      error
    );

  }

}


// ==========================================
// TOAST
// ==========================================

function mostrarToast(
  texto
) {

  toast.textContent =
    texto;


  toast.style.display =
    "block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(
      () => {

        toast.style.display =
          "none";

      },
      2200
    );

}


// ==========================================
// ERROR
// ==========================================

function mostrarError(
  mensaje,
  error
) {

  contenido.innerHTML = `

    <div class="error">

      <h3>
        ⚠️ ${
          escapar(
            mensaje
          )
        }
      </h3>

      <div class="error-detalle">

        ${
          escapar(
            error?.message ||
            "Intentá nuevamente."
          )
        }

      </div>

    </div>

  `;

}


// ==========================================
// SEGURIDAD HTML
// ==========================================

function escapar(
  valor
) {

  return String(
    valor ?? ""
  ).replace(
    /[&<>"']/g,
    caracter => ({

      "&":
        "&amp;",

      "<":
        "&lt;",

      ">":
        "&gt;",

      '"':
        "&quot;",

      "'":
        "&#039;"

    }[caracter])
  );

}

</script>

</body>
</html>
