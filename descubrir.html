<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Descubrir - EmiMatch</title>

  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    .discover {
      max-width: 650px;
      margin: auto;
      padding: 24px 16px;
    }

    .discover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .discover-header h1 {
      margin: 0;
      font-size: 28px;
    }

    .discover-header p {
      margin: 4px 0 0;
      color: var(--em-muted);
      font-size: 14px;
    }

    .filters {
      display: none;
      margin-bottom: 16px;
    }

    .filters.open {
      display: block;
    }

    .profile-card {
      overflow: hidden;
      padding: 0;
    }

    .profile-photo {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      padding: 18px;
    }

    .profile-info h2 {
      margin: 0 0 6px;
    }

    .profile-city {
      color: var(--em-muted);
      margin-bottom: 12px;
    }

    .interests {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .interest {
      padding: 6px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,.08);
      font-size: 13px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 20px 0;
    }

    .action {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      font-size: 23px;
    }

    .pass {
      background: #442b35;
    }

    .info {
      background: #293b57;
    }

    .like {
      background: #5a304d;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
    }

    .empty h2 {
      margin-bottom: 8px;
    }

    .empty p {
      color: var(--em-muted);
    }

    .match-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .match-modal.show {
      display: flex;
    }

    .match-box {
      width: 100%;
      max-width: 400px;
      text-align: center;
      padding: 28px;
    }

    .match-box img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      margin: 10px;
    }

    .match-buttons {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .error {
      text-align: center;
      padding: 20px;
      color: var(--em-danger);
    }
  </style>
</head>

<body>

  <main class="discover">

    <div class="discover-header">
      <div>
        <h1>💕 Descubrir</h1>
        <p>Encontrá personas compatibles con vos.</p>
      </div>

      <button
        id="filterButton"
        class="em-btn em-btn-secondary"
        type="button">
        ⚙️ Filtros
      </button>
    </div>

    <section id="filters" class="filters em-card">

      <label class="em-label">
        Edad mínima
        <input
          id="minAge"
          class="em-input"
          type="number"
          min="18"
          max="100"
          value="18">
      </label>

      <label class="em-label">
        Edad máxima
        <input
          id="maxAge"
          class="em-input"
          type="number"
          min="18"
          max="100"
          value="100">
      </label>

      <label class="em-label">
        Ciudad
        <input
          id="city"
          class="em-input"
          type="text"
          placeholder="Todas las ciudades">
      </label>

      <button
        id="applyFilters"
        class="em-btn em-btn-primary"
        type="button">
        Aplicar filtros
      </button>

    </section>

    <section id="loading" class="em-card empty">
      <h2>🔎 Buscando perfiles...</h2>
      <p>Un momento.</p>
    </section>

    <section id="profileArea" style="display:none;">

      <article class="em-card profile-card">

        <img
          id="profilePhoto"
          class="profile-photo"
          src="https://placehold.co/600x700?text=EmiMatch"
          alt="Foto de perfil">

        <div class="profile-info">

          <h2 id="profileName">Perfil</h2>

          <div id="profileCity" class="profile-city"></div>

          <p id="profileDescription"></p>

          <div id="interests" class="interests"></div>

          <button
            id="blockButton"
            class="em-btn em-btn-secondary"
            type="button">
            🚫 Bloquear
          </button>

        </div>

      </article>

      <div class="actions">

        <button
          id="passButton"
          class="action pass"
          type="button"
          aria-label="Pasar">
          ❌
        </button>

        <button
          id="infoButton"
          class="action info"
          type="button"
          aria-label="Información">
          ℹ️
        </button>

        <button
          id="likeButton"
          class="action like"
          type="button"
          aria-label="Me gusta">
          ❤️
        </button>

      </div>

    </section>

    <section id="empty" class="em-card empty" style="display:none;">
      <h2>💕 No hay más perfiles</h2>
      <p>
        Probá cambiando los filtros o volvé a intentarlo más tarde.
      </p>
    </section>

    <div id="error" class="error"></div>

  </main>

  <!-- MATCH -->

  <div id="matchModal" class="match-modal">

    <div class="em-card match-box">

      <h2>💕 ¡Hicieron Match!</h2>

      <p>
        Los dos se dieron Like.
      </p>

      <div>
        <img id="matchPhoto" src="" alt="Match">
      </div>

      <div class="match-buttons">

        <button
          id="chatButton"
          class="em-btn em-btn-primary"
          type="button">
          💬 Enviar mensaje
        </button>

        <button
          id="continueButton"
          class="em-btn em-btn-secondary"
          type="button">
          Seguir descubriendo
        </button>

      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets/js/config.js"></script>

  <script>
    (() => {
      "use strict";

      const config = window.EMIMATCH_CONFIG;

      if (!config) {
        document.getElementById("error").textContent =
          "No se pudo cargar la configuración de EmiMatch.";
        return;
      }

      const supabase = window.supabase.createClient(
        config.supabaseUrl,
        config.supabaseKey
      );

      let currentUser = null;
      let profiles = [];
      let currentProfile = null;

      const $ = id => document.getElementById(id);

      const loading = $("loading");
      const profileArea = $("profileArea");
      const empty = $("empty");
      const error = $("error");

      function escapeHTML(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function showError(message) {
        error.textContent = message;
      }

      function showProfile(profile) {
        currentProfile = profile;

        loading.style.display = "none";
        empty.style.display = "none";
        profileArea.style.display = "block";

        $("profilePhoto").src =
          profile.foto_url ||
          "https://placehold.co/600x700?text=EmiMatch";

        $("profileName").textContent =
          `${profile.nombre || "Usuario"}${profile.edad ? ", " + profile.edad : ""}`;

        $("profileCity").textContent =
          profile.ciudad || "Ciudad no indicada";

        $("profileDescription").textContent =
          profile.descripcion || "Sin descripción.";

        const interests = $("interests");

        interests.innerHTML = "";

        if (profile.intereses) {
          profile.intereses
            .split(",")
            .map(x => x.trim())
            .filter(Boolean)
            .slice(0, 10)
            .forEach(interest => {
              const span = document.createElement("span");
              span.className = "interest";
              span.textContent = interest;
              interests.appendChild(span);
            });
        }
      }

      function showEmpty() {
        loading.style.display = "none";
        profileArea.style.display = "none";
        empty.style.display = "block";
      }

      async function loadProfiles() {

        loading.style.display = "block";
        profileArea.style.display = "none";
        empty.style.display = "none";
        showError("");

        const minAge = Number($("minAge").value || 18);
        const maxAge = Number($("maxAge").value || 100);
        const city = $("city").value.trim();

        try {

          const { data: blocks, error: blockError } =
            await supabase
              .from("user_blocks")
              .select("blocked_user_id")
              .eq("user_id", currentUser.id);

          if (blockError) throw blockError;

          const blocked = new Set(
            (blocks || []).map(x => x.blocked_user_id)
          );

          const { data: swipes, error: swipeError } =
            await supabase
              .from("swipes")
              .select("target_user_id")
              .eq("user_id", currentUser.id);

          if (swipeError) throw swipeError;

          const alreadySwiped = new Set(
            (swipes || []).map(x => x.target_user_id)
          );

          let query = supabase
            .from("profiles")
            .select(`
              id,
              nombre,
              edad,
              ciudad,
              descripcion,
              foto_url,
              intereses
            `)
            .neq("id", currentUser.id)
            .gte("edad", minAge)
            .lte("edad", maxAge)
            .order("created_at", { ascending: false });

          if (city) {
            query = query.ilike("ciudad", `%${city}%`);
          }

          const { data, error: profileError } = await query;

          if (profileError) throw profileError;

          profiles = (data || []).filter(profile =>
            !blocked.has(profile.id) &&
            !alreadySwiped.has(profile.id)
          );

          if (!profiles.length) {
            showEmpty();
            return;
          }

          showProfile(profiles[0]);

        } catch (err) {

          console.error(err);

          loading.style.display = "none";
          profileArea.style.display = "none";
          empty.style.display = "none";

          showError(
            "No se pudieron cargar los perfiles. Revisá la conexión o los permisos de Supabase."
          );
        }
      }

      async function swipe(action) {

        if (!currentProfile) return;

        const target = currentProfile;

        try {

          const { error: insertError } =
            await supabase
              .from("swipes")
              .insert({
                user_id: currentUser.id,
                target_user_id: target.id,
                action
              });

          if (insertError) throw insertError;

          if (action === "like") {

            const { data: reverse, error: reverseError } =
              await supabase
                .from("swipes")
                .select("id")
                .eq("user_id", target.id)
                .eq("target_user_id", currentUser.id)
                .eq("action", "like")
                .maybeSingle();

            if (reverseError) throw reverseError;

            if (reverse) {

              const { data: directMatch } =
                await supabase
                  .from("matches")
                  .select("id")
                  .eq("user1_id", currentUser.id)
                  .eq("user2_id", target.id)
                  .maybeSingle();

              const { data: reverseMatch } =
                await supabase
                  .from("matches")
                  .select("id")
                  .eq("user1_id", target.id)
                  .eq("user2_id", currentUser.id)
                  .maybeSingle();

              if (!directMatch && !reverseMatch) {

                const { error: matchError } =
                  await supabase
                    .from("matches")
                    .insert({
                      user1_id: currentUser.id,
                      user2_id: target.id
                    });

                if (matchError) {
                  console.error(matchError);
                }
              }

              $("matchPhoto").src =
                target.foto_url ||
                "https://placehold.co/200x200?text=💕";

              $("matchModal").classList.add("show");

              $("chatButton").onclick = () => {
                window.location.href =
                  `conversacion.html?user=${encodeURIComponent(target.id)}`;
              };
            }
          }

          profiles.shift();

          if (profiles.length) {
            showProfile(profiles[0]);
          } else {
            showEmpty();
          }

        } catch (err) {

          console.error(err);

          showError(
            "No se pudo guardar la acción. Revisá los permisos de Supabase."
          );
        }
      }

      async function blockUser() {

        if (!currentProfile) return;

        const confirmed = confirm(
          "¿Querés bloquear este perfil?"
        );

        if (!confirmed) return;

        try {

          const { error: blockError } =
            await supabase
              .from("user_blocks")
              .insert({
                user_id: currentUser.id,
                blocked_user_id: currentProfile.id
              });

          if (blockError) throw blockError;

          profiles.shift();

          if (profiles.length) {
            showProfile(profiles[0]);
          } else {
            showEmpty();
          }

        } catch (err) {

          console.error(err);

          showError(
            "No se pudo bloquear el perfil."
          );
        }
      }

      $("filterButton").onclick = () => {
        $("filters").classList.toggle("open");
      };

      $("applyFilters").onclick = loadProfiles;

      $("passButton").onclick = () => swipe("pass");

      $("likeButton").onclick = () => swipe("like");

      $("infoButton").onclick = () => {

        if (!currentProfile) return;

        alert(
          `${currentProfile.nombre || "Usuario"}\n\n` +
          `${currentProfile.descripcion || "Sin descripción."}`
        );
      };

      $("blockButton").onclick = blockUser;

      $("continueButton").onclick = () => {
        $("matchModal").classList.remove("show");
      };

      async function init() {

        const { data, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError) {
          showError("No se pudo verificar la sesión.");
          loading.style.display = "none";
          return;
        }

        currentUser = data.session?.user;

        if (!currentUser) {
          window.location.href = "index.html";
          return;
        }

        await loadProfiles();
      }

      init();

    })();
  </script>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/components.js"></script>

</body>
</html>
