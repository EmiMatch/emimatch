const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let usuarioActual = null;


/* =========================
   INICIAR
========================= */

async function iniciar() {

  try {

    const {
      data: { session },
      error
    } =
      await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    if (!session) {

      document.getElementById(
        "estado"
      ).innerHTML =
        "🔐<br><br>Necesitás iniciar sesión.";

      return;
    }

    usuarioActual =
      session.user;

    await cargarNotificaciones();

  } catch (error) {

    console.error(error);

    document.getElementById(
      "estado"
    ).innerHTML =
      "❌<br><br>" +
      "No se pudieron cargar las notificaciones.<br><br>" +
      "<small>" +
      escapar(error.message) +
      "</small>";
  }
}


/* =========================
   CARGAR NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  if (!usuarioActual) return;

  const estado =
    document.getElementById("estado");

  const lista =
    document.getElementById("lista");

  estado.style.display =
    "block";

  estado.innerHTML =
    "⏳<br><br>Cargando notificaciones...";

  lista.innerHTML = "";

  try {

    const {
      data: matches,
      error: errorMatches
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .or(
          "user1_id.eq." +
          usuarioActual.id +
          ",user2_id.eq." +
          usuarioActual.id
        );

    if (errorMatches) {
      throw errorMatches;
    }

    if (
      !matches ||
      matches.length === 0
    ) {

      estado.innerHTML =
        "🔔<br><br>" +
        "No tenés notificaciones todavía.";

      actualizarBadge(0);

      return;
    }

    let todas = [];

    for (const match of matches) {

      const otroUsuario =
        match.user1_id ===
        usuarioActual.id
          ? match.user2_id
          : match.user1_id;

      const {
        data: mensajes,
        error: errorMensajes
      } =
        await supabaseClient
          .from("messages")
          .select(
            "id,match_id,sender_id,content,created_at,read_at,delivered_at"
          )
          .eq(
            "match_id",
            match.id
          )
          .eq(
            "sender_id",
            otroUsuario
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          )
          .limit(20);

      if (errorMensajes) {

        console.error(
          errorMensajes
        );

        continue;
      }

      if (
        !mensajes ||
        mensajes.length === 0
      ) {
        continue;
      }

      const {
        data: perfil,
        error: errorPerfil
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,nombre,edad,ciudad,foto_url,online"
          )
          .eq(
            "id",
            otroUsuario
          )
          .maybeSingle();

      if (errorPerfil) {
        console.error(
          errorPerfil
        );
      }

      for (
        const mensaje of mensajes
      ) {

        todas.push({
          mensaje: mensaje,
          perfil: perfil,
          otroUsuario: otroUsuario
        });

      }
    }

    todas.sort(
      function(a, b) {

        return new Date(
          b.mensaje.created_at
        ) -
        new Date(
          a.mensaje.created_at
        );

      }
    );

    if (todas.length === 0) {

      estado.innerHTML =
        "🔔<br><br>" +
        "No tenés mensajes nuevos.";

      actualizarBadge(0);

      return;
    }

    estado.style.display =
      "none";

    let noLeidas = 0;

    todas.forEach(
      function(item) {

        const mensaje =
          item.mensaje;

        const perfil =
          item.perfil;

        if (!mensaje.read_at) {
          noLeidas++;
        }

        const nombre =
          perfil &&
          perfil.nombre
            ? perfil.nombre
            : "Usuario";

        const foto =
          perfil &&
          perfil.foto_url
            ? `
              <img
                class="foto"
                src="${escapar(
                  perfil.foto_url
                )}"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >

              <div
                class="foto-placeholder"
                style="display:none;"
              >
                👤
              </div>
            `
            : `
              <div class="foto-placeholder">
                👤
              </div>
            `;

        const texto =
          mensaje.content || "";

        const hora =
          tiempoRelativo(
            mensaje.created_at
          );

        const punto =
          mensaje.read_at
            ? ""
            : `<div class="punto"></div>`;

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "notificacion";

        div.innerHTML = `

          ${foto}

          <div class="info">

            <div class="nombre">
              ${escapar(nombre)}
              ${
                perfil &&
                perfil.online
                  ? " 🟢"
                  : ""
              }
            </div>

            <div class="mensaje">
              ${escapar(texto)}
            </div>

            <div class="hora">
              ${hora}
            </div>

          </div>

          ${punto}

        `;

        div.onclick =
          function() {

            abrirConversacion(
              mensaje.id,
              item.otroUsuario
            );

          };

        lista.appendChild(div);

      }
    );

    actualizarBadge(
      noLeidas
    );

  } catch (error) {

    console.error(error);

    estado.style.display =
      "block";

    estado.innerHTML =
      "❌<br><br>" +
      "Error cargando notificaciones.<br><br>" +
      "<small>" +
      escapar(error.message) +
      "</small>";
  }
}


/* =========================
   ABRIR CONVERSACIÓN
========================= */

async function abrirConversacion(
  mensajeId,
  otroUsuario
) {

  try {

    await supabaseClient
      .from("messages")
      .update({
        delivered_at:
          new Date().toISOString(),
        read_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        mensajeId
      )
      .eq(
        "sender_id",
        otroUsuario
      );

  } catch (error) {

    console.error(error);

  }

  window.location.href =
    "conversacion.html?user=" +
    encodeURIComponent(
      otroUsuario
    );
}


/* =========================
   MARCAR TODAS
========================= */

async function marcarTodasLeidas() {

  if (!usuarioActual) return;

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .select("id")
        .neq(
          "sender_id",
          usuarioActual.id
        )
        .is(
          "read_at",
          null
        );

    if (error) {
      throw error;
    }

    if (
      !data ||
      data.length === 0
    ) {

      actualizarBadge(0);

      return;
    }

    const ids =
      data.map(
        function(m) {
          return m.id;
        }
      );

    await supabaseClient
      .from("messages")
      .update({
        read_at:
          new Date().toISOString(),
        delivered_at:
          new Date().toISOString()
      })
      .in(
        "id",
        ids
      );

    await cargarNotificaciones();

  } catch (error) {

    console.error(error);

    alert(
      "No se pudieron marcar las notificaciones."
    );
  }
}


/* =========================
   BADGE
========================= */

function actualizarBadge(
  numero
) {

  const badge =
    document.getElementById(
      "badge"
    );

  if (!badge) return;

  if (numero > 0) {

    badge.style.display =
      "flex";

    badge.textContent =
      numero > 99
        ? "99+"
        : numero;

  } else {

    badge.style.display =
      "none";
  }
}


/* =========================
   TIEMPO
========================= */

function tiempoRelativo(
  fecha
) {

  const ahora =
    new Date();

  const fechaMensaje =
    new Date(fecha);

  const segundos =
    Math.floor(
      (
        ahora -
        fechaMensaje
      ) / 1000
    );

  if (segundos < 60) {
    return "Ahora";
  }

  const minutos =
    Math.floor(
      segundos / 60
    );

  if (minutos < 60) {
    return (
      "Hace " +
      minutos +
      " min"
    );
  }

  const horas =
    Math.floor(
      minutos / 60
    );

  if (horas < 24) {
    return (
      "Hace " +
      horas +
      " h"
    );
  }

  const dias =
    Math.floor(
      horas / 24
    );

  if (dias < 7) {
    return (
      "Hace " +
      dias +
      " d"
    );
  }

  return fechaMensaje.toLocaleDateString(
    "es-AR",
    {
      day: "2-digit",
      month: "2-digit"
    }
  );
}


/* =========================
   ESCAPAR HTML
========================= */

function escapar(
  texto
) {

  return String(
    texto ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================
   REALTIME
========================= */

let canal = null;

function activarRealtime() {

  canal =
    supabaseClient
      .channel(
        "notificaciones-emimatch"
      )

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        function() {

          cargarNotificaciones();

        }
      )

      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "messages"
        },
        function() {

          cargarNotificaciones();

        }
      )

      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "messages"
        },
        function() {

          cargarNotificaciones();

        }
      )

      .subscribe();
}


window.addEventListener(
  "beforeunload",
  function() {

    if (canal) {

      supabaseClient
        .removeChannel(
          canal
        );
    }

  }
);


/* =========================
   INICIAR
========================= */

iniciar();

setTimeout(
  activarRealtime,
  1500
);

</script>
