<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let canalMensajes = null;

let cargando = false;


/* =====================================================
   ELEMENTOS
===================================================== */

const lista =
  document.getElementById(
    "lista"
  );

const btnActualizar =
  document.getElementById(
    "btnActualizar"
  );

const navBadge =
  document.getElementById(
    "navBadge"
  );

const headerCount =
  document.getElementById(
    "headerCount"
  );


/* =====================================================
   INICIO
===================================================== */

async function iniciar() {

  try {

    mostrarCargando();


    const {
      data: {
        session
      },
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if (error) {
      throw error;
    }


    if (!session) {

      window.location.href =
        "index.html";

      return;
    }


    usuarioActual =
      session.user;


    await cargarNotificaciones();

    activarRealtime();


  } catch (error) {

    console.error(
      "Error al iniciar:",
      error
    );


    mostrarError(
      "No se pudieron cargar las notificaciones."
    );
  }
}


/* =====================================================
   CARGAR NOTIFICACIONES
===================================================== */

async function cargarNotificaciones() {

  if (
    !usuarioActual ||
    cargando
  ) {
    return;
  }


  cargando = true;

  btnActualizar.disabled =
    true;


  try {

    mostrarCargando();


    /*
      Buscar los Matches
    */

    const {
      data: matches,
      error: matchError
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (matchError) {
      throw matchError;
    }


    if (
      !matches ||
      matches.length === 0
    ) {

      mostrarVacio();

      actualizarContadores(0);

      return;
    }


    /*
      Construir las notificaciones
    */

    const resultados = [];


    for (
      const match of matches
    ) {

      const otroId =
        match.user1_id ===
        usuarioActual.id
          ? match.user2_id
          : match.user1_id;


      /*
        Buscar solamente mensajes
        enviados por la otra persona.
      */

      const {
        data: mensajes,
        error: mensajesError
      } =
        await supabaseClient
          .from("messages")
          .select(
            "id,match_id,sender_id,content,created_at,delivered_at,read_at"
          )
          .eq(
            "match_id",
            match.id
          )
          .eq(
            "sender_id",
            otroId
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          )
          .limit(30);


      if (mensajesError) {

        console.error(
          "Error mensajes:",
          mensajesError
        );

        continue;
      }


      if (
        !mensajes ||
        mensajes.length === 0
      ) {
        continue;
      }


      /*
        Buscar perfil
      */

      const {
        data: perfil,
        error: perfilError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,nombre,foto_url,online"
          )
          .eq(
            "id",
            otroId
          )
          .single();


      if (perfilError) {

        console.error(
          "Error perfil:",
          perfilError
        );

        continue;
      }


      /*
        Agregar cada mensaje
      */

      for (
        const mensaje of mensajes
      ) {

        resultados.push({

          id:
            mensaje.id,

          matchId:
            match.id,

          mensaje,

          perfil

        });
      }
    }


    /*
      Ordenar más nuevo primero
    */

    resultados.sort(
      (a, b) => {

        return (
          new Date(
            b.mensaje.created_at
          ) -
          new Date(
            a.mensaje.created_at
          )
        );

      }
    );


    /*
      Si no hay mensajes
    */

    if (
      resultados.length === 0
    ) {

      mostrarVacio();

      actualizarContadores(0);

      return;
    }


    /*
      Mostrar
    */

    renderizarNotificaciones(
      resultados
    );


    /*
      Contar no leídas
    */

    const noLeidas =
      resultados.filter(
        item =>
          !item.mensaje.read_at
      ).length;


    actualizarContadores(
      noLeidas
    );


  } catch (error) {

    console.error(
      "Error cargando:",
      error
    );


    mostrarError(
      "No se pudieron cargar las notificaciones."
    );


  } finally {

    cargando = false;

    btnActualizar.disabled =
      false;
  }
}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizarNotificaciones(
  resultados
) {

  lista.innerHTML = "";


  resultados.forEach(
    item => {

      const mensaje =
        item.mensaje;

      const perfil =
        item.perfil;


      const noLeida =
        !mensaje.read_at;


      const tarjeta =
        document.createElement(
          "div"
        );


      tarjeta.className =
        "notificacion" +
        (
          noLeida
            ? " no-leida"
            : ""
        );


      /*
        Foto segura
      */

      const foto =
        perfil.foto_url ||
        "https://via.placeholder.com/100";


      /*
        Nombre seguro
      */

      const nombre =
        escapar(
          perfil.nombre ||
          "Usuario"
        );


      /*
        Mensaje seguro
      */

      const contenido =
        escapar(
          mensaje.content ||
          ""
        );


      /*
        Hora
      */

      const fecha =
        new Date(
          mensaje.created_at
        );


      const fechaTexto =
        formatearFecha(
          fecha
        );


      tarjeta.innerHTML = `

        <img
          class="avatar"
          src="${foto}"
          alt="Foto"
          onerror="
            this.src='https://via.placeholder.com/100'
          "
        >

        <div class="contenido">

          <div class="nombre">

            ${nombre}

            ${
              perfil.online
                ? '<span class="online"></span>'
                : ''
            }

          </div>

          <div class="mensaje">
            💬 ${contenido}
          </div>

          <div class="hora">
            ${fechaTexto}
          </div>

        </div>

        ${
          noLeida
            ? '<span class="indicador"></span>'
            : ''
        }

      `;


      /*
        Al tocar:
        marcar como leído
        y abrir conversación.
      */

      tarjeta.addEventListener(
        "click",
        () => {

          abrirConversacion(
            perfil.id,
            mensaje.id
          );

        }
      );


      lista.appendChild(
        tarjeta
      );

    }
  );
}


/* =====================================================
   ABRIR CONVERSACIÓN
===================================================== */

async function abrirConversacion(
  usuarioId,
  mensajeId
) {

  try {

    const ahora =
      new Date().toISOString();


    /*
      Marcar mensaje leído.
    */

    await supabaseClient
      .from("messages")
      .update({

        delivered_at:
          ahora,

        read_at:
          ahora

      })
      .eq(
        "id",
        mensajeId
      )
      .eq(
        "sender_id",
        usuarioId
      );


  } catch (error) {

    console.error(
      "No se pudo marcar leído:",
      error
    );
  }


  /*
    Abrir conversación.
  */

  window.location.href =
    "conversacion.html?user=" +
    encodeURIComponent(
      usuarioId
    );
}


/* =====================================================
   MARCAR TODAS COMO LEÍDAS
===================================================== */

async function marcarTodasLeidas() {

  if (!usuarioActual) {
    return;
  }


  try {

    const {
      data: matches,
      error
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (error) {
      throw error;
    }


    if (
      !matches ||
      matches.length === 0
    ) {

      actualizarContadores(0);

      return;
    }


    const ahora =
      new Date().toISOString();


    /*
      Marcar solamente mensajes
      recibidos y todavía no leídos.
    */

    for (
      const match of matches
    ) {

      const {
        error:
          updateError
      } =
        await supabaseClient
          .from("messages")
          .update({

            delivered_at:
              ahora,

            read_at:
              ahora

          })
          .eq(
            "match_id",
            match.id
          )
          .neq(
            "sender_id",
            usuarioActual.id
          )
          .is(
            "read_at",
            null
          );


      if (updateError) {

        console.error(
          "Error marcando:",
          updateError
        );
      }
    }


    /*
      Recargar
    */

    await cargarNotificaciones();


  } catch (error) {

    console.error(
      error
    );


    alert(
      "No se pudieron marcar las notificaciones."
    );
  }
}


/* =====================================================
   REALTIME
===================================================== */

function activarRealtime() {

  if (
    !usuarioActual
  ) {
    return;
  }


  /*
    Evitar canales duplicados.
  */

  if (canalMensajes) {

    supabaseClient
      .removeChannel(
        canalMensajes
      );
  }


  canalMensajes =
    supabaseClient
      .channel(
        "notificaciones-" +
        usuarioActual.id +
        "-" +
        Date.now()
      )


      .on(

        "postgres_changes",

        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },

        payload => {

          const mensaje =
            payload.new;


          /*
            Solo nos interesan
            mensajes recibidos.
          */

          if (
            mensaje &&
            mensaje.sender_id !==
            usuarioActual.id
          ) {

            cargarNotificaciones();
          }

        }

      )


      .on(

        "postgres_changes",

        {
          event: "UPDATE",
          schema: "public",
          table: "messages"
        },

        payload => {

          const mensaje =
            payload.new;


          if (
            mensaje &&
            mensaje.sender_id !==
            usuarioActual.id
          ) {

            cargarNotificaciones();
          }

        }

      )


      .subscribe(
        status => {

          console.log(
            "Realtime notificaciones:",
            status
          );

        }
      );
}


/* =====================================================
   CONTADORES
===================================================== */

function actualizarContadores(
  cantidad
) {

  const valor =
    Number(cantidad) || 0;


  /*
    Header
  */

  if (
    valor > 0
  ) {

    headerCount.textContent =
      valor > 99
        ? "99+"
        : valor;

    headerCount.style.display =
      "flex";

  } else {

    headerCount.style.display =
      "none";
  }


  /*
    Navegación
  */

  if (
    valor > 0
  ) {

    navBadge.textContent =
      valor > 99
        ? "99+"
        : valor;

    navBadge.style.display =
      "flex";

  } else {

    navBadge.style.display =
      "none";
  }
}


/* =====================================================
   ESTADO CARGANDO
===================================================== */

function mostrarCargando() {

  lista.innerHTML = `

    <div class="estado">

      <div class="spinner">
        ⏳
      </div>

      <p>
        Cargando notificaciones...
      </p>

    </div>

  `;
}


/* =====================================================
   ESTADO VACÍO
========================
