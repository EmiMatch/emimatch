<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notificaciones - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #06152f, #0b2348);
      color: white;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(4, 18, 42, 0.97);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 18px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bell {
      font-size: 25px;
    }

    .badge {
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 20px;
      background: #ff315c;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .intro {
      margin-bottom: 15px;
    }

    .intro h2 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .intro p {
      margin: 0;
      color: #b8c6dc;
      font-size: 14px;
    }

    .notification {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 13px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }

    .notification:hover {
      background: rgba(255,255,255,0.13);
      transform: translateY(-1px);
    }

    .notification.unread {
      border-left: 4px solid #ff315c;
      background: rgba(255,49,92,0.10);
    }

    .avatar {
      width: 55px;
      height: 55px;
      min-width: 55px;
      border-radius: 50%;
      object-fit: cover;
      background: #17335f;
      border: 2px solid rgba(255,255,255,0.15);
    }

    .avatar-placeholder {
      width: 55px;
      height: 55px;
      min-width: 55px;
      border-radius: 50%;
      background: #17335f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .notification-content {
      flex: 1;
      min-width: 0;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
    }

    .name {
      font-weight: bold;
      font-size: 16px;
    }

    .online {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22d36b;
    }

    .message {
      color: #d8e1ef;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .time {
      color: #8fa1bd;
      font-size: 11px;
      margin-top: 5px;
    }

    .unread-dot {
      width: 11px;
      height: 11px;
      background: #ff315c;
      border-radius: 50%;
      position: absolute;
      right: 13px;
      top: 13px;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      color: #aebed5;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty h3 {
      margin: 0 0 8px;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #b8c6dc;
    }

    .error {
      background: rgba(255,49,92,0.12);
      border: 1px solid rgba(255,49,92,0.3);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      color: #ffb4c3;
      margin-top: 20px;
    }

    .refresh {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px;
      background: #173b73;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
