<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notificaciones - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #071a3d, #0b2454);
      color: white;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      padding: 22px 18px;
      text-align: center;
      background: rgba(0,0,0,.18);
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .75;
      font-size: 14px;
    }

    .acciones {
      display: flex;
      gap: 10px;
      padding: 15px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn {
      flex: 1;
      background: white;
      color: #09204a;
    }

    .contenedor {
      padding: 0 15px;
    }

    .estado {
      text-align: center;
      padding: 40px 20px;
      opacity: .8;
    }

    .notificacion {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .foto {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #193b72;
    }

    .foto-placeholder {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      background: #193b72;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .nombre {
      font-weight: bold;
      font-size: 16px;
    }

    .mensaje {
      margin-top: 4px;
      opacity: .85;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hora {
      margin-top: 5px;
      font-size: 12px;
      opacity: .55;
    }

    .punto {
      width: 11px;
      height: 11px;
      background: #ff3158;
      border-radius: 50%;
      flex-shrink: 0;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(4,14,35,.97);
      border-top: 1px solid rgba(255,255,255,.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-size: 11px;
      text-align: center;
      opacity: .85;
      position: relative;
    }

    nav a span {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .badge {
      position: absolute;
      top: -5px;
      right: 4px;
      background: #ff3158;
      color: white;
      border-radius: 20px;
      min-width: 17px;
      height: 17px;
      padding: 2px 5px;
      font-size: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🔔 Notificaciones</h1>
  <p>Mensajes y actividad reciente</p>
</header>

<div class="acciones">
  <button class="btn" onclick="cargarNotificaciones()">
    🔄 Actualizar
  </button>

  <button class="btn" onclick="marcarTodasLeidas()">
    ✓✓ Marcar leídas
  </button>
</div>

<div class="contenedor">

  <div id="estado" class="estado">
    ⏳<br><br>
    Cargando notificaciones...
  </div>

  <div id="lista"></div>

</div>

<nav>

  <a href="perfil.html">
    <span>👤</span>
    Perfil
  </a>

  <a href="descubrir.html">
    <span>🔎</span>
    Descubrir
  </a>

  <a href="likes.html">
    <span>❤️</span>
    Me gustas
  </a>

  <a href="chat.html">
    <span>💕</span>
    Matches
  </a>

  <a href="notificaciones.html">
    <span>🔔</span>
    Notificaciones
    <b id="badge" class="badge" style="display:none;">0</b>
  </a>

</nav>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let usuarioActual = null;


/* =========================
   INICIAR
========================= */

async function iniciar() {

  try {

    const {
      data: { session },
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    if (!session) {

      document.getElementById("estado").innerHTML =
        "🔐<br><br>Necesitás iniciar sesión.";

      return;
    }

    usuarioActual = session.user;

    await cargarNotificaciones();

  } catch (error) {

    console.error(error);

    document.getElementById("estado").innerHTML =
      "❌<br><br>No se pudieron cargar las notificaciones.<br><br>" +
      "<small>" + escapar(error.message) + "</small>";
  }
}


/* =========================
   CARGAR NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  if (!usuarioActual) return;

  const estado =
    document.getElementById("estado");

  const lista =
    document.getElementById("lista");

  estado.style.display = "block";

  estado.innerHTML =
    "⏳<br><br>Cargando notificaciones...";

  lista.innerHTML = "";

  try {

    /*
      Primero obtenemos los matches
    */

    const { data: matches, error: errorMatches } =
      await supabaseClient
        .from("matches")
        .select("id,user1_id,user2_id")
        .or(
          "user1_id.eq." +
          usuarioActual.id +
          ",user2_id.eq." +
          usuarioActual.id
        );

    if (errorMatches) {
      throw errorMatches;
    }

    if (!matches || matches.length === 0) {

      estado.innerHTML =
        "🔔<br><br>No tenés notificaciones todavía.";

      actualizarBadge(0);

      return;
    }


    /*
      Buscamos los mensajes de esos matches
    */

    let todas = [];

    for (const match of matches) {

      const otroUsuario =
        match.user1_id === usuarioActual.id
          ? match.user2_id
          : match.user1_id;


      const { data: mensajes, error: errorMensajes } =
        await supabaseClient
          .from("messages")
          .select(
            "id,match_id,sender_id,content,created_at,read_at,delivered_at"
          )
          .eq("match_id", match.id)
          .eq("sender_id", otroUsuario)
          .order("created_at", { ascending: false })
          .limit(20);


      if (errorMensajes) {
        console.error(errorMensajes);
        continue;
      }


      if (!mensajes || mensajes.length === 0) {
        continue;
      }


      /*
        Perfil del usuario
      */

      const { data: perfil, error: errorPerfil } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,nombre,edad,ciudad,foto_url,online"
          )
          .eq("id", otroUsuario)
          .maybeSingle();


      if (errorPerfil) {
        console.error(errorPerfil);
      }


      for (const mensaje of mensajes) {

        todas.push({

          mensaje: mensaje,

          perfil: perfil,

          otroUsuario: otroUsuario

        });

      }

    }


    /*
      Ordenar por fecha
    */

    todas.sort(function(a, b) {

      return new Date(
        b.mensaje.created_at
      ) - new Date(
        a.mensaje.created_at
      );

    });


    if (todas.length === 0) {

      estado.innerHTML =
        "🔔<br><br>No tenés mensajes nuevos.";

      actualizarBadge(0);

      return;
    }


    /*
      Mostrar
    */

    estado.style.display = "none";

    let noLeidas = 0;

    todas.forEach(function(item) {

      const mensaje = item.mensaje;
      const perfil = item.perfil;

      if (!mensaje.read_at) {
        noLeidas++;
      }


      const nombre =
        perfil && perfil.nombre
          ? perfil.nombre
          : "Usuario";


      const foto =
        perfil && perfil.foto_url
          ? `
            <img
              class="foto"
              src="${escapar(perfil.foto_url)}"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >
            <div
              class="foto-placeholder"
              style="display:none;"
            >
              👤
            </div>
          `
          : `
            <div class="foto-placeholder">
              👤
            </div>
          `;


      const texto =
        mensaje.content || "";


      const hora =
        tiempoRelativo(mensaje.created_at);


      const punto =
        mensaje.read_at
          ? ""
          : `<div class="punto"></div>`;


      const div =
        document.createElement("div");

      div.className = "notificacion";

      div.innerHTML = `

        ${foto}

        <div class="info">

          <div class="nombre">
            ${escapar(nombre)}
            ${perfil && perfil.online ? " 🟢" : ""}
          </div>

          <div class="mensaje">
            ${escapar(texto)}
          </div>

          <div class="hora">
            ${hora}
          </div>

        </div>

        ${punto}

      `;


      div.onclick = function() {

        abrirConversacion(
          mensaje.id,
          item.otroUsuario
        );

      };


      lista.appendChild(div);

    });


    actualizarBadge(noLeidas);


  } catch (error) {

    console.error(error);

    estado.style.display = "block";

    estado.innerHTML =
      "❌<br><br>" +
      "Error cargando notificaciones.<br><br>" +
      "<small>" +
      escapar(error.message) +
      "</small>";

  }

}


/* =========================
   ABRIR CONVERSACIÓN
========================= */

async function abrirConversacion(
  mensajeId,
  otroUsuario
) {

  try {

    await supabaseClient
      .from("messages")
      .update({
        delivered_at: new Date().toISOString(),
        read_at: new Date().toISOString()
      })
      .eq("id", mensajeId)
      .eq("sender_id", otroUsuario);

  } catch (error) {

    console.error(error);

  }

  window.location.href =
    "conversacion.html?user=" +
    encodeURIComponent(otroUsuario);

}


/* =========================
   MARCAR TODAS
========================= */

async function marcarTodasLeidas() {

  if (!usuarioActual) return;

  try {

    /*
      Primero buscamos mensajes recibidos
    */

    const { data, error } =
      await supabaseClient
        .from("messages")
        .select("id")
        .neq("sender_id", usuarioActual.id)
        .is("read_at", null);

    if (error) {
      throw error;
    }

    if (!data || data.length === 0) {

      actualizarBadge(0);

      return;
    }


    const ids =
      data.map(function(m) {
        return m.id;
      });


    await supabaseClient
      .from("messages")
      .update({
        read_at: new Date().toISOString(),
        delivered_at: new Date().toISOString()
      })
      .in("id", ids);


    await cargarNotificaciones();


  } catch (error) {

    console.error(error);

    alert(
      "No se pudieron marcar las notificaciones."
    );

  }

}


/* =========================
   BADGE
========================= */

function actualizarBadge(numero) {

  const badge =
    document.getElementById("badge");

  if (!badge) return;

  if (numero > 0) {

    badge.style.display = "block";

    badge.textContent =
      numero > 99
        ? "99+"
        : numero;

  } else {

    badge.style.display = "none";

  }

}


/* =========================
   TIEMPO
========================= */

function tiempoRelativo(fecha) {

  const ahora =
    new Date();

  const fechaMensaje =
    new Date(fecha);

  const segundos =
    Math.floor(
      (ahora - fechaMensaje) / 1000
    );

  if (segundos < 60) {
    return "Ahora";
  }

  const minutos =
    Math.floor(segundos / 60);

  if (minutos < 60) {
    return "Hace " + minutos + " min";
  }

  const horas =
    Math.floor(minutos / 60);

  if (horas < 24) {
    return "Hace " + horas + " h";
  }

  const dias =
    Math.floor(horas / 24);

  if (dias < 7) {
    return "Hace " + dias + " d";
  }

  return fechaMensaje.toLocaleDateString(
    "es-AR",
    {
      day: "2-digit",
      month: "2-digit"
    }
  );

}


/* =========================
   ESCAPAR HTML
========================= */

function escapar(texto) {

  return String(texto ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   REALTIME
========================= */

let canal = null;

function activarRealtime() {

  canal =
    supabaseClient
      .channel("notificaciones-emimatch")

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        function() {

          cargarNotificaciones();

        }
      )

      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "messages"
        },
        function() {

          cargarNotificaciones();

        }
      )

      .subscribe();

}


window.addEventListener(
  "beforeunload",
  function() {

    if (canal) {

      supabaseClient
        .removeChannel(canal);

    }

  }
);


/* =========================
   INICIAR
========================= */

iniciar();

setTimeout(
  activarRealtime,
  1500
);

</script>

</body>
</html>
