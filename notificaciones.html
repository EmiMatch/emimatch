<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmiMatch - Notificaciones</title>
<meta name="theme-color" content="#07152f">
<link rel="stylesheet" href="assets/css/app.css">
<style>
body{margin:0;background:#071225;color:#fff;font-family:Arial,sans-serif}.page{max-width:760px;margin:auto;padding:90px 16px 120px}h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#aab6ca;margin-bottom:20px}.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}.tools button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:#263653;color:#fff}.tools .primary{background:#d8ad42;color:#071225}.status,.notice{background:#101d34;border:1px solid #263653;border-radius:18px;padding:18px;margin-bottom:12px}.notice{display:flex;gap:13px;align-items:center;cursor:pointer}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid #d8ad42;flex:none}.info{flex:1;min-width:0}.name{font-weight:800}.msg{margin-top:5px;color:#d8deea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{margin-top:5px;color:#8e9ab0;font-size:12px}.dot{width:10px;height:10px;border-radius:50%;background:#ff3f70;flex:none}.empty{text-align:center;color:#aab6ca;padding:35px 15px}@media(max-width:480px){.page{padding-top:80px}.notice{padding:13px}.avatar{width:52px;height:52px}}
</style>
</head>
<body>
<main class="page">
<h1>🔔 Notificaciones</h1>
<div class="sub">Mensajes y actividad reciente</div>
<div class="tools"><button class="primary" id="refresh">🔄 Actualizar</button><button id="readAll">✓✓ Marcar mensajes leídos</button></div>
<div id="status" class="status">Cargando notificaciones...</div>
<section id="list"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script>
"use strict";
let client,user,channel;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const ago=d=>{const s=Math.max(0,Math.floor((Date.now()-new Date(d))/1000));if(s<60)return"Ahora";const m=Math.floor(s/60);if(m<60)return`Hace ${m} min`;const h=Math.floor(m/60);if(h<24)return`Hace ${h} h`;const day=Math.floor(h/24);return day<7?`Hace ${day} d`:new Date(d).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})};
async function start(){if(!window.EMIMATCH_CONFIG){$("status").textContent="Error: falta config.js";return}client=window.supabase.createClient(EMIMATCH_CONFIG.supabaseUrl,EMIMATCH_CONFIG.supabaseKey);const {data:{session}}=await client.auth.getSession();if(!session){location.href="index.html";return}user=session.user;await load();activateRealtime()}
async function load(){
 $("status").textContent="Cargando notificaciones...";$("list").innerHTML="";
 const {data:matches,error:me}=await client.from("matches").select("id,user1_id,user2_id,created_at").or(`user1_id.eq.${user.id},user2_id.eq.${user.id}`).order("created_at",{ascending:false});
 if(me){$("status").textContent="Error al cargar notificaciones: "+me.message;return}
 const rows=[];
 for(const match of matches||[]){
  const other=match.user1_id===user.id?match.user2_id:match.user1_id;
  const {data:messages,error:msgError}=await client.from("messages").select("id,match_id,sender_id,content,created_at,read_at").eq("match_id",match.id).neq("sender_id",user.id).order("created_at",{ascending:false}).limit(20);
  if(msgError)continue;
  if(!messages?.length)continue;
  const {data:profile}=await client.from("profiles").select("id,nombre,foto_url").eq("id",other).maybeSingle();
  messages.forEach(message=>rows.push({message,profile,other}));
 }
 rows.sort((a,b)=>new Date(b.message.created_at)-new Date(a.message.created_at));
 if(!rows.length){$("status").style.display="block";$("status").innerHTML="🔔 No tenés mensajes recibidos todavía.";return}
 $("status").style.display="none";
 rows.forEach(x=>render(x));
}
function render(x){const p=x.profile||{};const unread=!x.message.read_at;const el=document.createElement("article");el.className="notice";const photo=p.foto_url?`<img class="avatar" src="${esc(p.foto_url)}" alt="Foto de ${esc(p.nombre||"Usuario")}" onerror="this.src='https://placehold.co/120x120?text=EmiMatch'">`:`<img class="avatar" src="https://placehold.co/120x120?text=EmiMatch" alt="Foto">`;el.innerHTML=`${photo}<div class="info"><div class="name">${esc(p.nombre||"Usuario")}</div><div class="msg">${esc(x.message.content||"")}</div><div class="time">${ago(x.message.created_at)}</div></div>${unread?'<span class="dot" aria-label="No leído"></span>':''}`;el.onclick=()=>openConversation(x.message.id,x.other);$("list").appendChild(el)}
async function openConversation(messageId,other){await client.from("messages").update({read_at:new Date().toISOString()}).eq("id",messageId).eq("sender_id",other);location.href=`conversacion.html?user=${encodeURIComponent(other)}`}
async function readAll(){const now=new Date().toISOString();const {data,error}=await client.from("messages").select("id,match_id").neq("sender_id",user.id).is("read_at",null);if(error){alert("No se pudieron marcar los mensajes como leídos.");return}const ids=(data||[]).map(x=>x.id);if(ids.length)await client.from("messages").update({read_at:now}).in("id",ids);await load()}
function activateRealtime(){if(channel)client.removeChannel(channel);channel=client.channel("emimatch-notificaciones").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{if(payload.new?.sender_id!==user.id)load()}).subscribe()}
$("refresh").onclick=load;$("readAll").onclick=readAll;start();
</script>
<script src="assets/js/app.js"></script>
<script src="assets/js/components.js"></script>
</body>
</html>
