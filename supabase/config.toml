
[functions.premium-create]
enabled = true
verify_jwt = true
import_map = "./functions/premium-create/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/premium-create/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/premium-create/*.html" ]


[functions.premium-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/premium-webhook/index.ts"
