<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Restablecé tu contraseña de EmiMatch de forma segura."
  >

  <title>EmiMatch - Restablecer contraseña</title>

  <link rel="stylesheet" href="assets/css/app.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <main class="em-shell">

    <section
      class="em-card"
      style="
        max-width: 520px;
        margin: 0 auto;
        padding: 32px;
      "
    >

      <div style="text-align:center;">

        <div
          class="em-brand"
          style="
            justify-content:center;
            margin-bottom:12px;
          "
        >
          <span class="em-brand-mark">♥</span>
          <span>EmiMatch</span>
        </div>

        <h1
          style="
            margin:0 0 10px;
            font-size:clamp(28px, 6vw, 38px);
          "
        >
          Nueva contraseña
        </h1>

        <p class="em-muted">
          Creá una nueva contraseña para volver a acceder a tu cuenta.
        </p>

      </div>


      <div
        id="message"
        class="em-alert"
        style="display:none; margin-top:20px;"
      ></div>


      <form
        id="resetForm"
        style="margin-top:24px;"
      >

        <div class="em-field">

          <label for="password">
            Nueva contraseña
          </label>

          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="Mínimo 6 caracteres"
            required
          >

        </div>


        <div class="em-field">

          <label for="confirmPassword">
            Repetir contraseña
          </label>

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="Repetí tu contraseña"
            required
          >

        </div>


        <button
          id="resetButton"
          type="submit"
          class="em-btn em-btn-primary"
          style="width:100%; margin-top:8px;"
        >
          Cambiar contraseña
        </button>

      </form>


      <div
        id="backLogin"
        style="
          text-align:center;
          margin-top:22px;
        "
      >

        <a href="index.html">
          Volver al inicio de sesión
        </a>

      </div>

    </section>

  </main>


  <footer class="em-footer">

    <div class="em-container">

      <strong>EmiMatch</strong>

      <span>
        Conexiones que empiezan de verdad.
      </span>

    </div>

  </footer>


  <script>
    const SUPABASE_URL =
      "https://kngiadwaesdbmvwivdev.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const form =
      document.getElementById("resetForm");

    const button =
      document.getElementById("resetButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type = "info") {

      message.textContent = text;

      message.className =
        "em-alert em-alert-" + type;

      message.style.display = "block";
    }


    async function checkRecoverySession() {

      const {
        data,
        error
      } = await client.auth.getSession();


      if (error) {

        console.error(
          "Error obteniendo sesión:",
          error
        );

        showMessage(
          "No pudimos validar el enlace de recuperación.",
          "error"
        );

        form.style.display = "none";

        return false;
      }


      if (!data.session) {

        showMessage(
          "El enlace de recuperación no es válido, ya venció o ya fue utilizado. Solicitá un nuevo enlace desde el inicio de sesión.",
          "error"
        );

        form.style.display = "none";

        return false;
      }


      return true;
    }


    client.auth.onAuthStateChange(
      async (event, session) => {

        console.log(
          "Estado de autenticación:",
          event
        );


        if (
          event === "PASSWORD_RECOVERY" &&
          session
        ) {

          form.style.display = "block";

          message.style.display = "none";
        }

      }
    );


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const password =
          document.getElementById(
            "password"
          ).value.trim();


        const confirmPassword =
          document.getElementById(
            "confirmPassword"
          ).value.trim();


        if (password.length < 6) {

          showMessage(
            "La contraseña debe tener al menos 6 caracteres.",
            "error"
          );

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "Las contraseñas no coinciden.",
            "error"
          );

          return;
        }


        button.disabled = true;

        button.textContent =
          "Guardando...";


        const {
          error
        } = await client.auth.updateUser({
          password: password
        });


        if (error) {

          console.error(
            "Error cambiando contraseña:",
            error
          );

          showMessage(
            error.message ||
            "No pudimos cambiar la contraseña.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Cambiar contraseña";

          return;
        }


        showMessage(
          "Contraseña actualizada correctamente. Ya podés iniciar sesión.",
          "success"
        );


        form.reset();

        button.textContent =
          "Contraseña actualizada";


        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 1800);

      }
    );


    checkRecoverySession();
  </script>


  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/analytics.js"></script>

</body>
</html>
