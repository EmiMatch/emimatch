<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmiMatch - Mis Matches</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
body{margin:0;background:#071225;color:#fff;font-family:Arial,sans-serif}.page{max-width:760px;margin:auto;padding:90px 16px 120px}h1{text-align:center;margin:0 0 20px}.status,.empty,.match{background:#101d34;border:1px solid #263653;border-radius:18px;padding:18px;margin-bottom:14px}.match{display:flex;align-items:center;gap:14px}.match img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid #d8ad42;flex:none}.info{flex:1;min-width:0}.info h2{font-size:18px;margin:0 0 5px}.muted{color:#aab6ca}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.actions a{display:inline-block;padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:bold}.chat{background:#d8ad42;color:#071225}.profile{background:#263653;color:#fff}@media(max-width:480px){.match{align-items:flex-start}.match img{width:62px;height:62px}.info h2{font-size:16px}}
</style>
</head>
<body>
<main class="page">
<h1>💕 Mis Matches</h1>
<div id="status" class="status">Cargando matches...</div>
<section id="list"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script>
"use strict";
let client,user;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
async function start(){
 if(!window.EMIMATCH_CONFIG){$("status").textContent="Error: falta config.js";return}
 client=window.supabase.createClient(EMIMATCH_CONFIG.supabaseUrl,EMIMATCH_CONFIG.supabaseKey);
 const {data:{session}}=await client.auth.getSession();
 if(!session){location.href="index.html";return}
 user=session.user;await loadMatches();
}
async function loadMatches(){
 const r=await client.from("matches").select("id,user1_id,user2_id,created_at").or(`user1_id.eq.${user.id},user2_id.eq.${user.id}`).order("created_at",{ascending:false});
 if(r.error){$("status").textContent="Error al cargar matches: "+r.error.message;return}
 const rows=r.data||[];
 if(!rows.length){$("status").textContent="Todavía no tenés matches.";$("list").innerHTML='<div class="empty">💕 Cuando haya un match aparecerá acá.</div>';return}
 const ids=rows.map(m=>m.user1_id===user.id?m.user2_id:m.user1_id);
 const p=await client.from("profiles").select("id,nombre,edad,ciudad,foto_url").in("id",ids);
 if(p.error){$("status").textContent="Error al cargar perfiles: "+p.error.message;return}
 const byId=Object.fromEntries((p.data||[]).map(x=>[x.id,x]));
 $("status").textContent=rows.length+" match"+(rows.length===1?"":"es");
 $("list").innerHTML=rows.map(m=>{
  const id=m.user1_id===user.id?m.user2_id:m.user1_id,x=byId[id];if(!x)return "";
  const photo=x.foto_url||"https://placehold.co/200x200?text=EmiMatch";
  return `<article class="match"><img src="${esc(photo)}" alt="Foto de ${esc(x.nombre)}"><div class="info"><h2>${esc(x.nombre)}, ${esc(x.edad)}</h2><div class="muted">📍 ${esc(x.ciudad||"Sin ciudad")}</div><div class="actions"><a class="chat" href="conversacion.html?user=${encodeURIComponent(x.id)}">💬 Enviar mensaje</a><a class="profile" href="perfil-usuario.html?id=${encodeURIComponent(x.id)}">👤 Ver perfil</a></div></div></article>`;
 }).join("");
}
start();
</script>
<script src="assets/js/app.js"></script>
<script src="assets/js/components.js"></script>
</body>
</html>
