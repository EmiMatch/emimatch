<style>

:root{
  --bg:#071225;
  --surface:#101d34;
  --surface2:#152642;
  --gold:#d8ad42;
  --text:#fff;
  --muted:#9eabc0;
  --border:rgba(255,255,255,.08);
  --pink:#ff4f87;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at top,
      rgba(76,29,149,.18),
      transparent 40%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

.messages-page{
  width:100%;
  max-width:680px;
  margin:0 auto;
  min-height:100vh;
  padding:18px 14px 110px;
}

/* HEADER */

.messages-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 4px 20px;
}

.back{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  font-size:22px;
}

.header-icon{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      rgba(216,173,66,.22),
      rgba(76,29,149,.28)
    );

  border:1px solid rgba(216,173,66,.25);

  font-size:24px;
}

.header-text{
  flex:1;
  min-width:0;
}

.header-text h1{
  margin:0;
  font-size:24px;
  font-weight:800;
}

.header-text p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* ACTIONS */

.actions{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.action-btn{
  flex:1;
  min-height:42px;
  border:1px solid var(--border);
  border-radius:13px;
  background:rgba(255,255,255,.05);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.action-btn:active{
  transform:scale(.98);
}

.action-btn.primary{
  background:
    linear-gradient(
      135deg,
      #d8ad42,
      #b98c25
    );

  color:#071225;
  border:0;
}

/* STATUS */

.status{
  text-align:center;
  padding:26px 16px;
  border-radius:20px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  color:var(--muted);
  line-height:1.5;
}

/* CONVERSATIONS */

.conversations{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.conversation{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      rgba(16,29,52,.98),
      rgba(21,38,66,.94)
    );

  border:1px solid var(--border);
  cursor:pointer;

  transition:
    transform .15s ease,
    border-color .15s ease,
    background .15s ease;
}

.conversation:hover{
  border-color:
    rgba(216,173,66,.25);
}

.conversation:active{
  transform:scale(.985);
}

/* AVATAR */

.avatar-wrap{
  position:relative;
  flex:none;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:#1d3150;
  border:
    2px solid
    rgba(216,173,66,.35);
}

.online-dot{
  position:absolute;
  right:1px;
  bottom:2px;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#38d996;
  border:3px solid #101d34;
  display:none;
}

/* INFO */

.conversation-info{
  flex:1;
  min-width:0;
}

.top-line{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.name{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:15px;
  font-weight:800;
}

.time{
  flex:none;
  color:#8290a8;
  font-size:11px;
}

.preview-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:5px;
  min-width:0;
}

.preview{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#aebbd0;
  font-size:13px;
}

.preview.unread{
  color:#fff;
  font-weight:700;
}

.you{
  color:#7f8ca3;
  font-size:12px;
}

.unread-count{
  min-width:22px;
  height:22px;
  padding:0 6px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50px;
  background:var(--pink);
  color:#fff;
  font-size:11px;
  font-weight:800;

  box-shadow:
    0 5px 15px
    rgba(255,79,135,.22);
}
  .empty-state{
  text-align:center;
  padding:42px 20px;
  border-radius:22px;
  background:
    linear-gradient(
      145deg,
      rgba(16,29,52,.96),
      rgba(21,38,66,.90)
    );
  border:1px solid var(--border);
}

.empty-icon{
  font-size:48px;
  margin-bottom:12px;
}

.empty-state h2{
  margin:0 0 8px;
  font-size:20px;
}

.empty-state p{
  margin:0 auto 20px;
  max-width:420px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}

.discover-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:0 20px;
  border-radius:14px;
  text-decoration:none;
  background:
    linear-gradient(
      135deg,
      #d8ad42,
      #b98c25
    );
  color:#071225;
  font-weight:800;
}

/* FOOTER */

.bottom-space{
  height:20px;
}

/* RESPONSIVE */

@media(max-width:420px){

  .messages-page{
    padding-left:10px;
    padding-right:10px;
  }

  .header-text h1{
    font-size:21px;
  }

  .header-icon{
    width:44px;
    height:44px;
  }

  .avatar{
    width:54px;
    height:54px;
  }

  .conversation{
    padding:11px;
  }

}

/* LOADING */

.loading{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.spinner{
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.15);
  border-top-color:var(--gold);
  animation:
    spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

</style>

<script>

"use strict";

/* =========================================================
   EMIMATCH — MIS MENSAJES
   PARTE 3/7
   ========================================================= */

let client = null;
let currentUser = null;
let realtimeChannel = null;

const statusEl =
  document.getElementById("status");

const conversationsEl =
  document.getElementById("conversations");

const emptyStateEl =
  document.getElementById("emptyState");

const refreshButton =
  document.getElementById("refreshButton");

const readAllButton =
  document.getElementById("readAllButton");


/* =========================================================
   CONFIGURACIÓN SUPABASE
   ========================================================= */

function getSupabaseConfig(){

  const config =
    window.EMIMATCH_CONFIG || {};

  const supabaseUrl =
    config.supabaseUrl ||
    "";

  const supabaseKey =
    config.supabaseKey ||
    config.supabaseAnonKey ||
    "";

  return {
    supabaseUrl,
    supabaseKey
  };
}


/* =========================================================
   CREAR CLIENTE
   ========================================================= */

function initSupabase(){

  const {
    supabaseUrl,
    supabaseKey
  } = getSupabaseConfig();

  if(
    !supabaseUrl ||
    !supabaseKey
  ){

    throw new Error(
      "Configuración de Supabase incompleta."
    );
  }

  client =
    window.supabase.createClient(
      supabaseUrl,
      supabaseKey
    );
}


/* =========================================================
   UTILIDADES
   ========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatTime(dateValue){

  if(!dateValue){
    return "";
  }

  const date =
    new Date(dateValue);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";
  }

  const now =
    new Date();

  const sameDay =
    date.toDateString() ===
    now.toDateString();

  if(sameDay){

    return date.toLocaleTimeString(
      "es-AR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }

  const yesterday =
    new Date(now);

  yesterday.setDate(
    yesterday.getDate() - 1
  );

  if(
    date.toDateString() ===
    yesterday.toDateString()
  ){

    return "Ayer";
  }

  return date.toLocaleDateString(
    "es-AR",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );
}


function getInitials(name){

  const clean =
    String(name || "EmiMatch")
      .trim();

  if(!clean){
    return "🫰";
  }

  const parts =
    clean
      .split(/\s+/)
      .filter(Boolean);

  if(parts.length === 1){

    return parts[0]
      .substring(0,2)
      .toUpperCase();
  }

  return (
    parts[0][0] +
    parts[1][0]
  ).toUpperCase();
}


function getAvatarUrl(profile){

  if(
    profile &&
    profile.foto_url
  ){

    return profile.foto_url;
  }

  return "";
}


function getOtherUser(match){

  if(
    match.user1_id ===
    currentUser.id
  ){

    return match.user2_id;
  }

  return match.user1_id;
}


/* =========================================================
   ESTADOS DE LA PÁGINA
   ========================================================= */

function showLoading(){

  statusEl.hidden = false;

  statusEl.innerHTML = `
    <div class="loading">

      <span class="spinner"></span>

      <span>
        Cargando conversaciones...
      </span>

    </div>
  `;

  conversationsEl.hidden = true;
  emptyStateEl.hidden = true;
}


function showError(message){

  statusEl.hidden = false;

  statusEl.innerHTML = `
    <div>
      ⚠️ ${escapeHtml(message)}
    </div>
  `;

  conversationsEl.hidden = true;
  emptyStateEl.hidden = true;
}


function hideStatus(){

  statusEl.hidden = true;
}


/* =========================================================
   SESIÓN
   ========================================================= */

async function loadSession(){

  const {
    data,
    error
  } =
    await client.auth.getSession();

  if(error){

    throw error;
  }

  currentUser =
    data?.session?.user || null;

  if(!currentUser){

    window.location.href =
      "index.html";

    return false;
  }

  return true;
}
  async function loadMatches(){

  const {
    data,
    error
  } = await client
    .from("matches")
    .select(
      "id,user1_id,user2_id,created_at"
    )
    .or(
      `user1_id.eq.${currentUser.id},user2_id.eq.${currentUser.id}`
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );

  if(error){

    throw error;
  }

  return data || [];
}


/* =========================================================
   ÚLTIMO MENSAJE
   ========================================================= */

async function getLastMessage(matchId){

  const {
    data,
    error
  } = await client
    .from("messages")
    .select(
      "id,match_id,sender_id,content,created_at,read_at"
    )
    .eq(
      "match_id",
      matchId
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(1);

  if(error){

    throw error;
  }

  return data?.[0] || null;
}


/* =========================================================
   MENSAJES NO LEÍDOS
   ========================================================= */

async function getUnreadCount(matchId){

  const {
    count,
    error
  } = await client
    .from("messages")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "match_id",
      matchId
    )
    .neq(
      "sender_id",
      currentUser.id
    )
    .is(
      "read_at",
      null
    );

  if(error){

    throw error;
  }

  return count || 0;
}


/* =========================================================
   PERFIL DEL OTRO USUARIO
   ========================================================= */

async function getProfile(userId){

  const {
    data,
    error
  } = await client
    .from("profiles")
    .select(
      "id,nombre,foto_url"
    )
    .eq(
      "id",
      userId
    )
    .maybeSingle();

  if(error){

    throw error;
  }

  return data || {
    id:userId,
    nombre:"Usuario",
    foto_url:""
  };
}


/* =========================================================
   CREAR DATOS DE CONVERSACIONES
   ========================================================= */

async function buildConversations(){

  const matches =
    await loadMatches();

  const conversations = [];

  for(
    const match of matches
  ){

    const otherUserId =
      getOtherUser(match);

    if(!otherUserId){
      continue;
    }

    const [
      lastMessage,
      unreadCount,
      profile
    ] =
      await Promise.all([
        getLastMessage(match.id),
        getUnreadCount(match.id),
        getProfile(otherUserId)
      ]);

    /*
     * No mostramos matches que todavía
     * no tienen ningún mensaje.
     */
    if(!lastMessage){
      continue;
    }

    conversations.push({

      match,

      otherUserId,

      profile,

      lastMessage,

      unreadCount

    });
  }

  conversations.sort(
    (a,b) => {

      const dateA =
        new Date(
          a.lastMessage.created_at
        ).getTime();

      const dateB =
        new Date(
          b.lastMessage.created_at
        ).getTime();

      return dateB - dateA;
    }
  );

  return conversations;
}


/* =========================================================
   PREPARAR TEXTO DE PREVISUALIZACIÓN
   ========================================================= */

function getMessagePreview(
  message
){

  if(!message){
    return "";
  }

  const content =
    String(
      message.content || ""
    ).trim();

  if(content){
    return content;
  }

  return "📎 Contenido multimedia";
}


/* =========================================================
   AVATAR
   ========================================================= */

function renderAvatar(profile){

  const name =
    escapeHtml(
      profile?.nombre ||
      "Usuario"
    );

  const url =
    getAvatarUrl(profile);

  if(url){

    return `
      <img
        class="avatar"
        src="${escapeHtml(url)}"
        alt="${name}"
        loading="lazy"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="avatar"
        style="
          display:none;
          align-items:center;
          justify-content:center;
          font-weight:800;
          color:#d8ad42;
        "
      >
        ${escapeHtml(
          getInitials(
            profile?.nombre
          )
        )}
      </div>
    `;
  }

  return `
    <div
      class="avatar"
      style="
        display:flex;
        align-items:center;
        justify-content:center;
        font-weight:800;
        color:#d8ad42;
      "
    >
      ${escapeHtml(
        getInitials(
          profile?.nombre
        )
      )}
    </div>
  `;
  }
  function renderConversations(
  conversations
){

  conversationsEl.innerHTML = "";

  if(
    !conversations ||
    conversations.length === 0
  ){

    conversationsEl.hidden = true;
    emptyStateEl.hidden = false;
    hideStatus();

    return;
  }

  emptyStateEl.hidden = true;
  conversationsEl.hidden = false;
  hideStatus();


  conversations.forEach(
    item => {

      const profile =
        item.profile || {};

      const message =
        item.lastMessage || {};

      const name =
        profile.nombre ||
        "Usuario";

      const preview =
        getMessagePreview(
          message
        );

      const unread =
        Number(
          item.unreadCount || 0
        );

      const isMine =
        message.sender_id ===
        currentUser.id;

      const conversation =
        document.createElement("article");

      conversation.className =
        "conversation";

      conversation.tabIndex = 0;

      conversation.dataset.userId =
        item.otherUserId;


      const avatar =
        renderAvatar(profile);


      const unreadHtml =
        unread > 0
          ? `
            <span
              class="unread-count"
              aria-label="${unread} mensajes sin leer"
            >
              ${
                unread > 99
                  ? "99+"
                  : unread
              }
            </span>
          `
          : "";


      const previewClass =
        unread > 0
          ? "preview unread"
          : "preview";


      const youHtml =
        isMine
          ? `
            <span class="you">
              Vos:
            </span>
          `
          : "";


      conversation.innerHTML = `

        <div class="avatar-wrap">

          ${avatar}

          <span
            class="online-dot"
          ></span>

        </div>


        <div class="conversation-info">

          <div class="top-line">

            <span class="name">
              ${escapeHtml(name)}
            </span>

            <span class="time">
              ${escapeHtml(
                formatTime(
                  message.created_at
                )
              )}
            </span>

          </div>


          <div class="preview-row">

            ${youHtml}

            <span
              class="${previewClass}"
            >
              ${escapeHtml(preview)}
            </span>

            ${unreadHtml}

          </div>

        </div>

      `;


      conversation.addEventListener(
        "click",
        () => {

          openConversation(
            item.otherUserId,
            item.match?.id
          );

        }
      );


      conversation.addEventListener(
        "keydown",
        event => {

          if(
            event.key === "Enter" ||
            event.key === " "
          ){

            event.preventDefault();

            openConversation(
              item.otherUserId,
              item.match?.id
            );

          }

        }
      );


      conversationsEl.appendChild(
        conversation
      );

    }
  );
}


/* =========================================================
   ABRIR CONVERSACIÓN
   ========================================================= */

async function openConversation(
  userId,
  matchId
){

  if(!userId){
    return;
  }

  // Marcar los mensajes recibidos antes de salir de la lista.
  // Así el contador queda actualizado incluso si el chat tarda en cargar.
  if(currentUser && matchId){
    try{
      const { data, error } = await client
        .from("messages")
        .update({ read_at: new Date().toISOString() })
        .eq("match_id", matchId)
        .neq("sender_id", currentUser.id)
        .is("read_at", null)
        .select("id");

      if(error){
        console.warn("No se pudieron marcar mensajes como leídos al abrir el chat:", error);
      } else {
        console.log("Mensajes marcados como leídos al abrir:", data?.length || 0);
      }
    }catch(error){
      console.warn("Error marcando mensajes al abrir el chat:", error);
    }
  }

  window.location.href =
    `conversacion.html?user=${encodeURIComponent(userId)}`;
}


/* =========================================================
   CARGAR Y MOSTRAR
   ========================================================= */

async function loadConversations(){

  showLoading();

  try{

    const conversations =
      await buildConversations();

    renderConversations(
      conversations
    );

  }catch(error){

    console.error(
      "Error cargando mensajes:",
      error
    );

    showError(
      "No se pudieron cargar tus conversaciones."
    );

  }

}


/* =========================================================
   MARCAR TODOS COMO LEÍDOS
   ========================================================= */

async function markAllAsRead(){

  if(!currentUser){
    return;
  }

  readAllButton.disabled = true;

  const originalText =
    readAllButton.textContent;

  readAllButton.textContent =
    "✓ Marcando...";

  try{

    const matches =
      await loadMatches();

    const now =
      new Date().toISOString();

    for(const match of matches){

      const {
        error
      } = await client
        .from("messages")
        .update({
          read_at: now
        })
        .eq(
          "match_id",
          match.id
        )
        .neq(
          "sender_id",
          currentUser.id
        )
        .is(
          "read_at",
          null
        );

      if(error){
        console.warn(
          "No se pudieron marcar mensajes del match:",
          match.id,
          error
        );
      }

    }

    await loadConversations();

  }catch(error){

    console.error(
      "Error marcando mensajes como leídos:",
      error
    );

  }finally{

    readAllButton.disabled =
      false;

    readAllButton.textContent =
      originalText;

  }

}
  /* =========================================================
   ACTUALIZAR
   ========================================================= */

refreshButton.addEventListener(
  "click",
  async () => {

    refreshButton.disabled = true;

    const originalText =

    refreshButton.textContent =

);


/* =========================================================
   LEER TODO
   ========================================================= */

readAllButton.addEventListener(

  }
);


/* =========================================================
   REALTIME — MENSAJES
   ========================================================= */

function subscribeToMessages(){

  if(!client){
    return;
  }

  if(realtimeChannel){

    try{

      client.removeChannel(
        realtimeChannel
      );

    }catch(error){

      console.warn(
        "No se pudo quitar canal anterior:",
        error
      );

    }

  }


  realtimeChannel =
    client
      .channel(
        "emimatch-messages-inbox"
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        async payload => {

          console.log(
            "Nuevo mensaje:",
            payload.new
          );

          await loadConversations();

        }
      )

      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"messages"
        },
        async payload => {

          console.log(
            "Mensaje actualizado:",
            payload.new
          );

          await loadConversations();

        }
      )

      .subscribe(
        status => {

          console.log(
            "Realtime mensajes:",
            status
          );

        }
      );

}


/* =========================================================
   INICIALIZACIÓN
   ========================================================= */

async function init(){

  try{

    initSupabase();

    const authenticated =
      await loadSession();

    if(!authenticated){
      return;
    }

    await loadConversations();

    subscribeToMessages();

  }catch(error){

    console.error(
      "Error iniciando Mis mensajes:",
      error
    );

    showError(
      error?.message ||
      "No se pudo iniciar Mis mensajes."
    );

  }

}


/* =========================================================
   LIMPIEZA
   ========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(
      client &&
      realtimeChannel
    ){

      try{

        client.removeChannel(
          realtimeChannel
        );

      }catch(error){

        console.warn(
          "Error cerrando Realtime:",
          error
        );

      }

    }

  }
);


/* =========================================================
   INICIAR
   ========================================================= */

init();

</script>
