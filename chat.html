    .match::before {
      content: "";

    .avatar,

      font-weight: 700;
    }

    .flecha {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      color: #64748b;
      font-size: 25px;
      line-height: 1;
    }

    .nav {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 68px;
      padding: 5px;
      border-radius: 22px;
      background: rgba(5,13,32,.96);
      border: 1px solid rgba(255,255,255,.08);
      display: flex;
      justify-content: space-around;
      align-items: center;

      box-shadow: 0 12px 35px rgba(0,0,0,.45);

    .nav a {
      position: relative;
      flex: 1;
      color: #9aa8be;

    .nav a span {

    @media (min-width: 601px) {

      .avatar,

      .nombre {

      .flecha {

      }

      .nav a {
        font-size: 8px;
      }

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;


const contenido =
  document.getElementById(
    "contenido"
  );


// ==========================================
// INICIAR
// ==========================================

document.addEventListener(
  "DOMContentLoaded",
  iniciar
);


async function iniciar() {

  contenido.innerHTML = `
    <div class="estado">
      🔐 Verificando sesión...
    </div>
  `;


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {
      throw error;
    }


    if (!data.session) {

      contenido.innerHTML = `
        <div class="estado">
          ⚠️ No hay una sesión activa.
          <br><br>
          <button
            class="btn"
            onclick="location.href='index.html'"
          >
            🔐 Iniciar sesión
          </button>
        </div>
      `;

      return;

    }


    usuarioActual =
      data.session.user;


    await cargarMatches();

  } catch (error) {

    console.error(
      error
    );

    contenido.innerHTML = `

      <div class="estado">

        ⚠️ Error al iniciar Matches.

        <br><br>

        <small>
          ${escapar(
            error.message ||
            "Error desconocido"
          )}
        </small>

        <br><br>

        <button
          class="btn"
          onclick="location.reload()"
        >
          🔄 Reintentar
        </button>

      </div>

    `;

  }

}


// ==========================================
// CARGAR MATCHES
// ==========================================

async function cargarMatches() {

  if (!usuarioActual) {

    const {
      data
    } =
      await supabaseClient.auth.getSession();

    if (
      !data.session
    ) {

      location.href =
        "index.html";

      return;

    }

    usuarioActual =
      data.session.user;

  }


  contenido.innerHTML = `

    <div class="estado">
      🔎 Buscando tus Matches...
    </div>

  `;


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id,created_at"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (error) {
      throw error;
    }


    const lista =
      data || [];


    if (
      lista.length === 0
    ) {

      contenido.innerHTML = `

        <div class="estado">

          <div style="font-size:60px;">
            💕
          </div>

          <h2>
            Todavía no tenés Matches
          </h2>

          <p>
            Andá a Descubrir y
            enviá algunos ❤️
          </p>

          <button
            class="btn"
            onclick="location.href='descubrir.html'"
          >
            🔎 Descubrir personas
          </button>

        </div>

      `;

      return;

    }


    contenido.innerHTML = "";


    for (
      const match
      of lista
    ) {

      const otroId =
        match.user1_id ===
        usuarioActual.id
          ? match.user2_id
          : match.user1_id;


      const {
        data: perfil,
        error:
          errorPerfil
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,nombre,edad,ciudad,foto_url,online"
          )
          .eq(
            "id",
            otroId
          )
          .maybeSingle();


      if (errorPerfil) {

        console.warn(
          errorPerfil
        );

        continue;

      }


      if (!perfil) {
        continue;
      }


      crearTarjeta(
        match,
        perfil
      );

    }


    if (
      contenido.children.length === 0
    ) {

      contenido.innerHTML = `

        <div class="estado">

          ⚠️

          <h3>
            Encontramos el Match,
            pero no pudimos cargar
            el perfil.
          </h3>

        </div>

      `;

    }

  } catch (error) {

    console.error(
      "Error Matches:",
      error
    );


    contenido.innerHTML = `

      <div class="estado">

        <div style="font-size:50px;">
          ⚠️
        </div>

        <h2>
          Error cargando Matches
        </h2>

        <p>
          ${escapar(
            error.message ||
            "Error desconocido"
          )}
        </p>

        <button
          class="btn"
          onclick="cargarMatches()"
        >
          🔄 Reintentar
        </button>

      </div>

    `;

  }

}


// ==========================================
// TARJETA
// ==========================================

function crearTarjeta(
  match,
  perfil
) {

  const tarjeta =
    document.createElement(
      "div"
    );


  tarjeta.className =
    "match";


  let avatar;


  if (
    perfil.foto_url
  ) {

    avatar = `

      <img
        class="avatar"
        src="${escapar(
          perfil.foto_url
        )}"
        alt="Foto"
        onerror="
          this.outerHTML =
          '<div class=&quot;avatar-vacio&quot;>👤</div>'
        "
      >

    `;

  } else {

    avatar = `

      <div class="avatar-vacio">
        👤
      </div>

    `;

  }


  tarjeta.innerHTML = `

    ${avatar}

    <div class="datos">

      <div class="nombre">

        ${escapar(
          perfil.nombre ||
          "Usuario"
        )}

        ${
          perfil.edad
            ? ", " +
              escapar(
                perfil.edad
              )
            : ""
        }

      </div>


      ${
        perfil.ciudad
          ? `
            <div class="ciudad">
              📍 ${escapar(
                perfil.ciudad
              )}
            </div>
          `
          : ""
      }


      ${
        perfil.online
          ? `
            <div class="online">
              🟢 En línea
            </div>
          `
          : ""
      }

    </div>


    <div class="flecha">
      ›
    </div>

  `;


  tarjeta.addEventListener(
    "click",
    () => {

      location.href =
        `conversacion.html?user=${encodeURIComponent(
          perfil.id
        )}`;

    }
  );


  contenido.appendChild(
    tarjeta
  );

}


// ==========================================
// ESCAPAR
// ==========================================

function escapar(
  valor
) {

  return String(
    valor ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
