<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .header {
      background: #111b3a;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      width: 95%;
      max-width: 700px;
      margin: 20px auto;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #111b3a;
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .match {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .match:last-child {
      border-bottom: none;
    }

    .match:hover {
      background: #f7f8fc;
    }

    .match img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .match-info {
      flex: 1;
    }

    .match-info strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .match-info span {
      color: #777;
      font-size: 14px;
    }

    #chatSection {
      display: none;
    }

    #matchesSection {
      display: block;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .chat-header img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 20px;
    }

    #messages {
      height: 420px;
      overflow-y: auto;
      background: #f1f3f8;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      max-width: 80%;
      padding: 10px 13px;
      margin-bottom: 10px;
      border-radius: 14px;
      word-wrap: break-word;
      clear: both;
    }

    .mine {
      background: #111b3a;
      color: white;
      float: right;
      border-bottom-right-radius: 4px;
    }

    .theirs {
      background: white;
      color: #222;
      float: left;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      display: block;
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    #sendButton {
      width: 90px;
      border: none;
      border-radius: 10px;
      background: #111b3a;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    .error {
      background: #ffe8e8;
      color: #b00020;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>💕 EmiMatch</h1>
  </div>

  <div class="container">

    <!-- ============================= -->
    <!-- LISTA DE MATCHES -->
    <!-- ============================= -->

    <div id="matchesSection" class="card">

      <h2>💕 Mis Matches</h2>

      <p>
        Elegí una persona para comenzar a conversar.
      </p>

      <div id="matchesList">
        <div class="loading">
          Cargando matches...
        </div>
      </div>

      <a href="perfil.html" class="btn">
        ← Volver a mi Perfil
      </a>

    </div>


    <!-- ============================= -->
    <!-- CHAT -->
    <!-- ============================= -->

    <div id="chatSection" class="card">

      <div class="chat-header">

        <img
          id="chatPhoto"
          src="https://via.placeholder.com/100"
          alt="Foto"
        >

        <div>
          <h2 id="chatName">
            Chat
          </h2>
        </div>

      </div>


      <div id="messages">

        <div class="loading">
          Cargando mensajes...
        </div>

      </div>


      <div class="input-area">

        <input
          type="text"
          id="messageInput"
          placeholder="Escribí un mensaje..."
          autocomplete="off"
        >

        <button id="sendButton">
          Enviar
        </button>

      </div>


      <a href="chat.html" class="btn">
        ← Volver a mis Matches
      </a>

    </div>

  </div>


<script>

  // ==========================================
  // CONFIGURACIÓN SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://kngiadwaesdbmvwivdev.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // ==========================================
  // VARIABLES
  // ==========================================

  let currentUser = null;

  let currentMatchId = null;

  let currentOtherUserId = null;

  let realtimeChannel = null;


  // ==========================================
  // INICIO
  // ==========================================

  document.addEventListener(
    "DOMContentLoaded",
    iniciar
  );


  async function iniciar() {

    const {
      data: {
        session
      }
    } = await supabaseClient.auth.getSession();


    if (!session) {

      window.location.href =
        "index.html";

      return;

    }


    currentUser =
      session.user;


    const params =
      new URLSearchParams(
        window.location.search
      );


    const userId =
      params.get("user");


    if (userId) {

      await abrirChat(userId);

    } else {

      await cargarMatches();

    }

  }


  // ==========================================
  // CARGAR MATCHES
  // ==========================================

  async function cargarMatches() {

    document.getElementById(
      "matchesSection"
    ).style.display = "block";


    document.getElementById(
      "chatSection"
    ).style.display = "none";


    const matchesList =
      document.getElementById(
        "matchesList"
      );


    matchesList.innerHTML =
      '<div class="loading">Cargando matches...</div>';


    try {

      const {
        data: matches,
        error
      } = await supabaseClient
        .from("matches")
        .select("*")
        .or(
          `user1_id.eq.${currentUser.id},user2_id.eq.${currentUser.id}`
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.error(error);

        matchesList.innerHTML =
          '<div class="error">Error al cargar los matches: ' +
          error.message +
          '</div>';

        return;

      }


      if (!matches || matches.length === 0) {

        matchesList.innerHTML =
          '<div class="empty">💔 Todavía no tenés matches.</div>';

        return;

      }


      matchesList.innerHTML = "";


      for (const match of matches) {

        const otherUserId =
          match.user1_id === currentUser.id
            ? match.user2_id
            : match.user1_id;


        const {
          data: profile,
          error: profileError
        } = await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "id",
            otherUserId
          )
          .maybeSingle();


        if (profileError) {

          console.error(
            profileError
          );

          continue;

        }


        if (!profile) {

          continue;

        }


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "match";


        const photo =
          profile.photo_url ||
          "https://via.placeholder.com/100";


        const name =
          profile.name ||
          "Usuario";


        const age =
          profile.age
            ? `, ${profile.age}`
            : "";


        const city =
          profile.city ||
          "";


        div.innerHTML = `

          <img
            src="${escapeHtml(photo)}"
            alt="Foto de ${escapeHtml(name)}"
          >

          <div class="match-info">

            <strong>
              ${escapeHtml(name)}${age}
            </strong>

            <span>
              ${escapeHtml(city)}
            </span>

          </div>

          <div>
            💬
          </div>

        `;


        div.addEventListener(
          "click",
          function() {

            window.location.href =
              "chat.html?user=" +
              encodeURIComponent(
                otherUserId
              );

          }
        );


        matchesList.appendChild(
          div
        );

      }


      if (
        matchesList.children.length === 0
      ) {

        matchesList.innerHTML =
          '<div class="empty">No se pudieron cargar los perfiles de tus matches.</div>';

      }

    } catch (error) {

      console.error(error);

      matchesList.innerHTML =
        '<div class="error">Ocurrió un error inesperado.</div>';

    }

  }


  // ==========================================
  // ABRIR CHAT
  // ==========================================

  async function abrirChat(
    otherUserId
  ) {

    document.getElementById(
      "matchesSection"
    ).style.display = "none";


    document.getElementById(
      "chatSection"
    ).style.display = "block";


    currentOtherUserId =
      otherUserId;


    try {

      // --------------------------------------
      // BUSCAR MATCH
      // --------------------------------------

      const {
        data: match,
        error: matchError
      } = await buscarMatch(
        otherUserId
      );


      if (
        matchError ||
        !match
      ) {

        document.getElementById(
          "messages"
        ).innerHTML =
          '<div class="error">No se encontró el match entre estos usuarios.</div>';

        return;

      }


      currentMatchId =
        match.id;


      // --------------------------------------
      // PERFIL DEL OTRO USUARIO
      // --------------------------------------

      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "id",
          otherUserId
        )
        .maybeSingle();


      if (profileError) {

        console.error(
          profileError
        );

      }


      if (profile) {

        document.getElementById(
          "chatName"
        ).textContent =
          profile.name ||
          "Usuario";


        document.getElementById(
          "chatPhoto"
        ).src =
          profile.photo_url ||
          "https://via.placeholder.com/100";

      }


      // --------------------------------------
      // CARGAR MENSAJES
      // --------------------------------------

      await cargarMensajes();


      // --------------------------------------
      // ACTIVAR REALTIME
      // --------------------------------------

      activarRealtime();

    } catch (error) {

      console.error(error);

      document.getElementById(
        "messages"
      ).innerHTML =
        '<div class="error">No se pudo abrir el chat.</div>';

    }

  }


  // ==========================================
  // BUSCAR MATCH
  // ==========================================

  async function buscarMatch(
    otherUserId
  ) {

    const {
      data: match1,
      error: error1
    } = await supabaseClient
      .from("matches")
      .select("*")
      .eq(
        "user1_id",
        currentUser.id
      )
      .eq(
        "user2_id",
        otherUserId
      )
      .maybeSingle();


    if (match1) {

      return {
        data: match1,
        error: null
      };

    }


    const {
      data: match2,
      error: error2
    } = await supabaseClient
      .from("matches")
      .select("*")
      .eq(
        "user1_id",
        otherUserId
      )
      .eq(
        "user2_id",
        currentUser.id
      )
      .maybeSingle();


    if (match2) {

      return {
        data: match2,
        error: null
      };

    }


    return {
      data: null,
      error:
        error1 ||
        error2 ||
        new Error(
          "Match no encontrado"
        )
    };

  }


  // ==========================================
  // CARGAR MENSAJES
  // ==========================================

  async function cargarMensajes() {

    const messagesDiv =
      document.getElementById(
        "messages"
      );


    messagesDiv.innerHTML =
      '<div class="loading">Cargando mensajes...</div>';


    if (!currentMatchId) {

      return;

    }


    const {
      data: messages,
      error
    } = await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "match_id",
        currentMatchId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


    if (error) {

      console.error(error);

      messagesDiv.innerHTML =
        '<div class="error">Error al cargar mensajes: ' +
        error.message +
        '</div>';

      return;

    }


    messagesDiv.innerHTML = "";


    if (
      !messages ||
      messages.length === 0
    ) {

      messagesDiv.innerHTML =
        '<div class="empty">💬 Todavía no hay mensajes.<br>¡Sé el primero en escribir!</div>';

      return;

    }


    messages.forEach(
      mostrarMensaje
    );


    scrollMensajes();

  }


  // ==========================================
  // MOSTRAR MENSAJE
  // ==========================================

  function mostrarMensaje(
    message
  ) {

    const messagesDiv =
      document.getElementById(
        "messages"
      );


    // Evitar duplicados
    const existing =
      document.querySelector(
        `[data-message-id="${message.id}"]`
      );


    if (existing) {

      return;

    }


    const div =
      document.createElement(
        "div"
      );


    div.classList.add(
      "message"
    );


    if (
      message.sender_id ===
      currentUser.id
    ) {

      div.classList.add(
        "mine"
      );

    } else {

      div.classList.add(
        "theirs"
      );

    }


    const fecha =
      message.created_at
        ? new Date(
            message.created_at
          ).toLocaleTimeString(
            "es-AR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        : "";


    div.dataset.messageId =
      message.id;


    div.innerHTML = `

      ${escapeHtml(
        message.content
      )}

      <span class="message-time">
        ${fecha}
      </span>

    `;


    messagesDiv.appendChild(
      div
    );


    scrollMensajes();

  }


  // ==========================================
  // ENVIAR MENSAJE
  // ==========================================

  document.getElementById(
    "sendButton"
  ).addEventListener(
    "click",
    enviarMensaje
  );


  document.getElementById(
    "messageInput"
  ).addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        enviarMensaje();

      }

    }
  );


  async function enviarMensaje() {

    const input =
      document.getElementById(
        "messageInput"
      );


    const content =
      input.value.trim();


    if (!content) {

      return;

    }


    if (!currentMatchId) {

      alert(
        "No se encontró el match."
      );

      return;

    }


    const button =
      document.getElementById(
        "sendButton"
      );


    button.disabled =
      true;


    try {

      const {
        data,
        error
      } = await supabaseClient
        .from("messages")
        .insert({

          match_id:
            currentMatchId,

          sender_id:
            currentUser.id,

          content:
            content

        })
        .select()
        .single();


      if (error) {

        console.error(error);

        alert(
          "No se pudo enviar el mensaje: " +
          error.message
        );

        return;

      }


      input.value =
        "";


      mostrarMensaje(
        data
      );


      input.focus();

    } catch (error) {

      console.error(error);

      alert(
        "Ocurrió un error al enviar el mensaje."
      );

    } finally {

      button.disabled =
        false;

    }

  }


  // ==========================================
  // REALTIME
  // ==========================================

  function activarRealtime() {

    if (
      realtimeChannel
    ) {

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }


    realtimeChannel =
      supabaseClient
        .channel(
          "chat-" +
          currentMatchId
        )
        .on(

          "postgres_changes",

          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter:
              "match_id=eq." +
              currentMatchId
          },

          function(payload) {

            mostrarMensaje(
              payload.new
            );

          }

        )
        .subscribe();

  }


  // ==========================================
  // SCROLL
  // ==========================================

  function scrollMensajes() {

    const messagesDiv =
      document.getElementById(
        "messages"
      );


    messagesDiv.scrollTop =
      messagesDiv.scrollHeight;

  }


  // ==========================================
  // SEGURIDAD HTML
  // ==========================================

  function escapeHtml(
    text
  ) {

    if (
      text === null ||
      text === undefined
    ) {

      return "";

    }


    return String(text)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>

</body>
</html>
