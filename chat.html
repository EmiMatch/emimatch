<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EmiMatch - Chat</title>

  <link
    rel="stylesheet"
    href="assets/css/app.css"
  >

  <style>
    body {
      margin: 0;
      background: var(--em-bg, #071426);
      color: var(--em-text, #fff);
    }

    .chat-page {
      max-width: 760px;
      margin: 0 auto;
      min-height: calc(100vh - 90px);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      box-sizing: border-box;
    }

    .chat-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      background: var(--em-surface, #10213a);
      margin-bottom: 12px;
    }

    .back-btn {
      text-decoration: none;
      font-size: 22px;
      color: inherit;
    }

    .chat-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      background: #1d3150;
    }

    .chat-user {
      min-width: 0;
      flex: 1;
    }

    .chat-user strong {
      display: block;
      font-size: 16px;
    }

    .chat-user span {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: var(--em-muted, #9aa8bb);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 4px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 55vh;
    }

    .message {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 16px;
      word-break: break-word;
      line-height: 1.4;
      font-size: 14px;
    }

    .message.mine {
      align-self: flex-end;
      background: var(--em-primary, #d4af37);
      color: #071426;
      border-bottom-right-radius: 5px;
    }

    .message.theirs {
      align-self: flex-start;
      background: var(--em-surface, #10213a);
      color: var(--em-text, #fff);
      border-bottom-left-radius: 5px;
    }

    .message small {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      opacity: .65;
      text-align: right;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--em-muted, #9aa8bb);
      padding: 30px 10px;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-radius: 18px;
      background: var(--em-surface, #10213a);
    }

    .composer textarea {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      resize: none;
      border: 0;
      outline: 0;
      border-radius: 13px;
      padding: 11px 12px;
      box-sizing: border-box;
      background: rgba(255,255,255,.08);
      color: #fff;
      font: inherit;
    }

    .composer button {
      border: 0;
      border-radius: 13px;
      padding: 0 17px;
      cursor: pointer;
      background: var(--em-primary, #d4af37);
      color: #071426;
      font-weight: 700;
    }

    .composer button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: var(--em-muted, #9aa8bb);
      font-size: 13px;
      padding: 20px;
    }

    .error {
      color: #ff8b8b;
    }

    /* PREMIUM */

    .premium-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      background: rgba(3, 10, 24, .78);
      backdrop-filter: blur(8px);
    }

    .premium-card {
      width: 100%;
      max-width: 390px;
      position: relative;
      box-sizing: border-box;
      padding: 30px 24px 24px;
      text-align: center;
      border-radius: 26px;
      background:
        linear-gradient(
          145deg,
          #10213a,
          #182442
        );
      border: 1px solid rgba(212,175,55,.35);
      box-shadow:
        0 25px 70px rgba(0,0,0,.45);
    }

    .premium-close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
    }

    .premium-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(212,175,55,.12);
      border: 1px solid rgba(212,175,55,.35);
      font-size: 32px;
    }

    .premium-card h2 {
      margin: 0 0 10px;
      color: #fff;
      font-size: 25px;
    }

    .premium-subtitle {
      margin: 0 auto 10px;
      color: #fff;
      font-size: 15px;
      line-height: 1.5;
    }

    .premium-text {
      margin: 0 auto 18px;
      color: #aebbd0;
      font-size: 14px;
      line-height: 1.55;
    }

    .premium-benefits {
      display: grid;
      gap: 9px;
      margin-bottom: 20px;
      text-align: left;
      color: #fff;
      font-size: 14px;
    }

    .premium-price {
      margin-bottom: 18px;
    }

    .premium-price strong {
      display: block;
      color: #d4af37;
      font-size: 24px;
    }

    .premium-price span {
      color: #9aa8bb;
      font-size: 12px;
    }

    .premium-button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 15px;
      background: #d4af37;
      color: #071426;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    .premium-later {
      margin-top: 12px;
      border: 0;
      background: transparent;
      color: #9aa8bb;
      font-size: 13px;
      cursor: pointer;
    }

    @media (max-width: 480px) {

      .chat-page {
        padding: 12px 10px;
      }

      .message {
        max-width: 86%;
      }

      .composer button {
        padding: 0 14px;
      }

      .premium-card {
        padding: 28px 20px 22px;
      }
    }
  </style>
</head>

<body>

  <main class="chat-page">

    <header class="chat-top">

      <a
        href="chat.html"
        class="back-btn"
        aria-label="Volver"
      >←</a>

      <img
        id="userAvatar"
        class="chat-avatar"
        src="https://placehold.co/100x100?text=🫰"
        alt="Foto de perfil"
      >

      <div class="chat-user">

        <strong id="userName">
          Cargando...
        </strong>

        <span id="userStatus">
          Conversación
        </span>

      </div>

    </header>

    <section
      id="messages"
      class="messages"
    >
      <div class="status">
        Cargando conversación...
      </div>
    </section>

    <form
      id="composer"
      class="composer"
    >

      <textarea
        id="messageInput"
        placeholder="Escribí un mensaje..."
        maxlength="1000"
        autocomplete="off"
      ></textarea>

      <button
        id="sendButton"
        type="submit"
      >
        Enviar
      </button>

    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets/js/config.js"></script>

  <script>
    (() => {

      "use strict";

      const config =
        window.EMIMATCH_CONFIG;

      if (!config) {
        console.error(
          "EmiMatch: falta config.js"
        );
        return;
      }

      const supabase =
        window.supabase.createClient(
          config.supabaseUrl,
          config.supabaseKey
        );

      const messagesBox =
        document.getElementById("messages");

      const input =
        document.getElementById("messageInput");

      const sendButton =
        document.getElementById("sendButton");

      const userName =
        document.getElementById("userName");

      const userAvatar =
        document.getElementById("userAvatar");

      const userStatus =
        document.getElementById("userStatus");

      const composer =
        document.getElementById("composer");

      let currentUser = null;
      let otherUserId = null;
      let matchId = null;
      let realtimeChannel = null;

      const params =
        new URLSearchParams(
          window.location.search
        );

      otherUserId =
        params.get("user");

      function escapeHTML(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatTime(date) {
        return new Date(date).toLocaleTimeString(
          "es-AR",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );
      }

      function showStatus(
        text,
        isError = false
      ) {
        messagesBox.innerHTML =
          '<div class="status ' +
          (isError ? "error" : "") +
          '">' +
          escapeHTML(text) +
          "</div>";
      }

      function scrollToBottom() {
        messagesBox.scrollTop =
          messagesBox.scrollHeight;
      }

      function renderMessages(messages) {

        if (
          !messages ||
          messages.length === 0
        ) {
          messagesBox.innerHTML =
            '<div class="empty">' +
            "Todavía no hay mensajes.<br>" +
            "¡Comenzá la conversación! 🫰" +
            "</div>";
          return;
        }

        messagesBox.innerHTML =
          messages.map(message => {

            const mine =
              message.sender_id ===
              currentUser.id;

            return `
              <div
                class="message ${mine ? "mine" : "theirs"}"
                data-message-id="${escapeHTML(message.id)}"
              >
                ${escapeHTML(message.content)}

                <small>
                  ${formatTime(message.created_at)}
                </small>
              </div>
            `;

          }).join("");

        scrollToBottom();
      }

      async function loadProfile() {

        const {
          data,
          error
        } = await supabase
          .from("profiles")
          .select(
            "id,nombre,foto_url"
          )
          .eq(
            "id",
            otherUserId
          )
          .maybeSingle();

        if (error) {
          throw error;
        }

        if (data) {

          userName.textContent =
            data.nombre ||
            "Usuario";

          userAvatar.src =
            data.foto_url ||
            "https://placehold.co/100x100?text=🫰";

          userStatus.textContent =
            "Conectados en EmiMatch";
        }
      }

      async function findMatch() {

        const [
          first,
          second
        ] = await Promise.all([

          supabase
            .from("matches")
            .select("id")
            .eq(
              "user1_id",
              currentUser.id
            )
            .eq(
              "user2_id",
              otherUserId
            )
            .maybeSingle(),

          supabase
            .from("matches")
            .select("id")
            .eq(
              "user1_id",
              otherUserId
            )
            .eq(
              "user2_id",
              currentUser.id
            )
            .maybeSingle()

        ]);

        if (first.error) {
          throw first.error;
        }

        if (second.error) {
          throw second.error;
        }

        const match =
          first.data ||
          second.data;

        if (!match) {
          throw new Error(
            "No existe un match válido con este usuario."
          );
        }

        matchId =
          match.id;
      }

      async function loadMessages() {

        const {
          data,
          error
        } = await supabase
          .from("messages")
          .select(
            "id,match_id,sender_id,content,created_at"
          )
          .eq(
            "match_id",
            matchId
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );

        if (error) {
          throw error;
        }

        renderMessages(
          data || []
        );
      }
      /*
       * =========================
       * DETECTAR LÍMITE PREMIUM
       * =========================
       */

      function isFreeMessageLimitError(error) {

        const values = [
          error?.message,
          error?.details,
          error?.hint,
          error?.error,
          error?.statusText
        ];

        const text =
          values
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

        const code =
          String(
            error?.code || ""
          ).toUpperCase();

        return (
          text.includes("free_message_limit") ||
          text.includes("free message limit") ||
          text.includes("free-message-limit") ||
          text.includes("límite de 5 mensajes") ||
          text.includes("limite de 5 mensajes") ||
          text.includes("alcanzaste el límite") ||
          text.includes("alcanzaste el limite") ||
          code === "P0001"
        );
      }

      /*
       * =========================
       * INVITACIÓN PREMIUM
       * =========================
       */

      function showPremiumLimitPrompt() {

        const overlay =
          document.createElement("div");

        overlay.className =
          "premium-overlay";

        overlay.innerHTML = `

          <div
            class="premium-card"
            role="dialog"
            aria-modal="true"
            aria-labelledby="premiumTitle"
          >

            <button
              type="button"
              class="premium-close"
              id="premiumClose"
              aria-label="Cerrar"
            >
              ×
            </button>

            <div class="premium-icon">
              🫰
            </div>

            <h2 id="premiumTitle">
              Seguí conectando
            </h2>

            <p class="premium-subtitle">
              Llegaste al límite de mensajes gratuitos de hoy.
            </p>

            <p class="premium-text">
              Tu conversación puede seguir con
              <strong>EmiMatch Premium</strong>.
            </p>

            <div class="premium-benefits">

              <div>
                🫰 Mensajes ilimitados
              </div>

              <div>
                ✨ Más oportunidades de conectar
              </div>

              <div>
                💎 Experiencia Premium
              </div>

            </div>

            <div class="premium-price">

              <strong>
                $10.000 ARS
              </strong>

              <span>
                por mes
              </span>

            </div>

            <button
              type="button"
              class="premium-button"
              id="goPremiumButton"
            >
              ✨ Conocer EmiMatch Premium
            </button>

            <button
              type="button"
              class="premium-later"
              id="closePremiumButton"
            >
              Ahora no
            </button>

          </div>
        `;

        document.body.appendChild(
          overlay
        );

        const close = () => {

          overlay.remove();

          input.focus();
        };

        overlay
          .querySelector("#premiumClose")
          .addEventListener(
            "click",
            close
          );

        overlay
          .querySelector("#closePremiumButton")
          .addEventListener(
            "click",
            close
          );

        overlay
          .querySelector("#goPremiumButton")
          .addEventListener(
            "click",
            () => {

              window.location.href =
                "membresia/membresia.html";

            }
          );

        overlay.addEventListener(
          "click",
          event => {

            if (
              event.target === overlay
            ) {
              close();
            }

          }
        );
      }

      /*
       * =========================
       * ENVIAR MENSAJE
       * =========================
       */

      async function sendMessage() {

        const content =
          input.value.trim();

        if (
          !content ||
          !matchId
        ) {
          return;
        }

        sendButton.disabled =
          true;

        try {

          /*
           * Comprobamos primero
           * el límite gratuito.
           */

          const {
            data: limitData,
            error: limitError
          } = await supabase.rpc(
            "can_send_message"
          );

          if (limitError) {

            console.error(
              "EmiMatch - error de límite:",
              limitError
            );

            if (
              isFreeMessageLimitError(
                limitError
              )
            ) {

              showPremiumLimitPrompt();

              return;
            }

            alert(
              "No se pudo comprobar el límite de mensajes. Intentá nuevamente."
            );

            return;
          }

          /*
           * Sesión no autenticada.
           */

          if (
            limitData?.reason ===
            "not_authenticated"
          ) {

            alert(
              "Tu sesión expiró. Iniciá sesión nuevamente."
            );

            window.location.href =
              "index.html";

            return;
          }

          /*
           * Límite de mensajes alcanzado.
           */

          if (
            !limitData?.allowed
          ) {

            showPremiumLimitPrompt();

            return;
          }

          /*
           * Enviar mensaje normalmente.
           */

          const {
            data,
            error
          } = await supabase
            .from("messages")
            .insert({

              match_id:
                matchId,

              sender_id:
                currentUser.id,

              content:
                content

            })
            .select()
            .single();

          if (error) {

            console.error(
              "EmiMatch Chat:",
              error
            );

            /*
             * Protección adicional:
             * nunca mostrar
             * free_message_limit.
             */

            if (
              isFreeMessageLimitError(
                error
              )
            ) {

              showPremiumLimitPrompt();

              return;
            }

            alert(
              "No se pudo enviar el mensaje. Intentá nuevamente."
            );

            return;
          }

          /*
           * Limpiar campo.
           */

          input.value =
            "";

          /*
           * Mostrar inmediatamente
           * el mensaje enviado.
           */

          if (data) {

            const empty =
              messagesBox.querySelector(
                ".empty"
              );

            if (empty) {
              messagesBox.innerHTML =
                "";
            }

            const existing =
              messagesBox.querySelector(
                '[data-message-id="' +
                data.id +
                '"]'
              );

            if (!existing) {

              const div =
                document.createElement(
                  "div"
                );

              div.className =
                "message mine";

              div.dataset.messageId =
                data.id;

              div.innerHTML =
                escapeHTML(
                  data.content
                ) +
                "<small>" +
                formatTime(
                  data.created_at
                ) +
                "</small>";

              messagesBox.appendChild(
                div
              );

              scrollToBottom();
            }
          }

        } catch (error) {

          console.error(
            "EmiMatch Chat - error:",
            error
          );

          /*
           * Última protección.
           */

          if (
            isFreeMessageLimitError(
              error
            )
          ) {

            showPremiumLimitPrompt();

            return;
          }

          alert(
            "No se pudo enviar el mensaje. Intentá nuevamente."
          );

        } finally {

          sendButton.disabled =
            false;

        }
      }

      /*
       * =========================
       * REALTIME
       * =========================
       */

      function startRealtime() {

        if (
          realtimeChannel
        ) {

          supabase.removeChannel(
            realtimeChannel
          );
        }

        realtimeChannel =
          supabase
            .channel(
              "chat-" +
              matchId
            )
            .on(
              "postgres_changes",
              {
                event: "INSERT",
                schema: "public",
                table: "messages",
                filter:
                  "match_id=eq." +
                  matchId
              },
              payload => {

                const message =
                  payload.new;

                if (
                  !message ||
                  !message.id
                ) {
                  return;
                }

                const existing =
                  messagesBox.querySelector(
                    '[data-message-id="' +
                    message.id +
                    '"]'
                  );

                if (existing) {
                  return;
                }

                const empty =
                  messagesBox.querySelector(
                    ".empty"
                  );

                if (empty) {

                  messagesBox.innerHTML =
                    "";
                }

                const div =
                  document.createElement(
                    "div"
                  );

                const mine =
                  message.sender_id ===
                  currentUser.id;

                div.className =
                  "message " +
                  (
                    mine
                      ? "mine"
                      : "theirs"
                  );

                div.dataset.messageId =
                  message.id;

                div.innerHTML =
                  escapeHTML(
                    message.content
                  ) +
                  "<small>" +
                  formatTime(
                    message.created_at
                  ) +
                  "</small>";

                messagesBox.appendChild(
                  div
                );

                scrollToBottom();
              }
            )
            .subscribe();
      }

      /*
       * =========================
       * FORMULARIO
       * =========================
       */

      composer.addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          await sendMessage();

        }
      );

      /*
       * =========================
       * INICIO DEL CHAT
       * =========================
       */

      async function initializeChat() {

        try {

          if (
            !otherUserId
          ) {

            showStatus(
              "No se indicó el usuario de la conversación.",
              true
            );

            return;
          }

          const {
            data: sessionData,
            error: sessionError
          } = await supabase.auth.getSession();

          if (sessionError) {
            throw sessionError;
          }

          currentUser =
            sessionData.session?.user ||
            null;

          if (!currentUser) {

            alert(
              "Tu sesión expiró. Iniciá sesión nuevamente."
            );

            window.location.href =
              "index.html";

            return;
          }

          if (
            currentUser.id ===
            otherUserId
          ) {

            showStatus(
              "No podés iniciar una conversación con tu propia cuenta.",
              true
            );

            return;
          }

          await Promise.all([

            loadProfile(),

            findMatch()

          ]);

          await loadMessages();

          startRealtime();

          input.focus();

        } catch (error) {

          console.error(
            "EmiMatch Chat - inicialización:",
            error
          );

          showStatus(
            error?.message ||
            "No se pudo cargar la conversación.",
            true
          );

        }
      }

      /*
       * =========================
       * INICIAR CHAT
       * =========================
       */

      initializeChat();

    })();
  </script>

</body>
</html>
