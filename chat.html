<script>


const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;


/* =========================
   INICIO
========================= */

async function iniciar() {

  try {

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (!session) {

      window.location.href =
        "./index.html";

      return;
    }


    usuarioActual =
      session.user;


    await cargarMatches();

    await cargarNotificaciones();


    /* ACTUALIZACIÓN EN TIEMPO REAL */

    supabaseClient
      .channel(
        "chat-matches"
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "messages"
        },
        async () => {

          await cargarMatches();

          await cargarNotificaciones();

        }
      )
      .subscribe();


    /*
      Respaldo de actualización
      por si Realtime tarda.
    */

    setInterval(
      async () => {

        await cargarMatches();

        await cargarNotificaciones();

      },
      5000
    );

  }
  catch (error) {

    console.error(error);

    mostrarError(
      "No se pudo iniciar EmiMatch."
    );

  }

}


/* =========================
   MATCHES
========================= */

async function cargarMatches() {

  const contenido =
    document.getElementById(
      "contenido"
    );


  contenido.innerHTML = `

    <div class="estado-carga">
      ⏳ Cargando tus Matches...
    </div>

  `;


  try {

    /*
      1. Obtener matches
    */

    const {
      data: matches,
      error
    } =
      await supabaseClient
        .from("matches")
        .select(
          `
          id,
          user1_id,
          user2_id
          `
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (error) {

      console.error(error);

      mostrarError(
        "No se pudieron cargar tus Matches."
      );

      return;

    }


    if (
      !matches ||
      !matches.length
    ) {

      mostrarVacio();

      return;

    }


    /*
      2. Obtener bloqueos
    */

    const {
      data: bloqueos,
      error: errorBloqueos
    } =
      await supabaseClient
        .from("user_blocks")
        .select(
          "blocker_id, blocked_id"
        )
        .or(
          `blocker_id.eq.${usuarioActual.id},blocked_id.eq.${usuarioActual.id}`
        );


    if (errorBloqueos) {

      console.error(
        errorBloqueos
      );

    }


    const bloqueados =
      new Set();


    (bloqueos || []).forEach(
      bloqueo => {

        if (
          bloqueo.blocker_id ===
          usuarioActual.id
        ) {

          bloqueados.add(
            bloqueo.blocked_id
          );

        }
        else {

          bloqueados.add(
            bloqueo.blocker_id
          );

        }

      }
    );


    /*
      3. Determinar el otro usuario
    */

    const datosMatches =
      matches
        .map(
          match => {

            const otroId =
              match.user1_id ===
              usuarioActual.id
                ? match.user2_id
                : match.user1_id;


            return {
              ...match,
              otroId
            };

          }
        )
        .filter(
          match =>
            !bloqueados.has(
              match.otroId
            )
        );


    if (
      !datosMatches.length
    ) {

      mostrarVacio();

      return;

    }


    /*
      4. Obtener perfiles
    */

    const idsUsuarios =
      datosMatches.map(
        match =>
          match.otroId
      );


    const {
      data: perfiles,
      error: errorPerfiles
    } =
      await supabaseClient
        .from("profiles")
        .select(
          `
          id,
          nombre,
          edad,
          ciudad,
          foto_url,
          online,
          last_seen
          `
        )
        .in(
          "id",
          idsUsuarios
        );


    if (errorPerfiles) {

      console.error(
        errorPerfiles
      );

      mostrarError(
        "No se pudieron cargar los perfiles."
      );

      return;

    }


    const mapaPerfiles =
      new Map(
        (perfiles || []).map(
          perfil =>
            [
              perfil.id,
              perfil
            ]
        )
      );


    /*
      5. Obtener mensajes
    */

    const matchIds =
      datosMatches.map(
        match =>
          match.id
      );


    const {
      data: mensajes,
      error: errorMensajes
    } =
      await supabaseClient
        .from("messages")
        .select(
          `
          id,
          match_id,
          sender_id,
          content,
          created_at,
          read_at
          `
        )
        .in(
          "match_id",
          matchIds
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (errorMensajes) {

      console.error(
        errorMensajes
      );

    }


    /*
      6. Construir datos
    */

    const datosFinales =
      datosMatches
        .map(
          match => {

            const perfil =
              mapaPerfiles.get(
                match.otroId
              );


            if (!perfil) {

              return null;

            }


            const mensajesMatch =
              (mensajes || [])
                .filter(
                  mensaje =>
                    mensaje.match_id ===
                    match.id
                );


            const ultimoMensaje =
              mensajesMatch[0] ||
              null;


            const noLeidos =
              mensajesMatch.filter(
                mensaje =>
                  mensaje.sender_id !==
                    usuarioActual.id &&
                  !mensaje.read_at
              ).length;


            return {

              match,
              perfil,
              ultimoMensaje,
              noLeidos

            };

          }
        )
        .filter(Boolean);


    /*
      Ordenar:
      primero los que tienen
      mensaje más reciente.
    */

    datosFinales.sort(
      (
        a,
        b
      ) => {

        const fechaA =
          a.ultimoMensaje
            ? new Date(
                a.ultimoMensaje.created_at
              ).getTime()
            : 0;


        const fechaB =
          b.ultimoMensaje
            ? new Date(
                b.ultimoMensaje.created_at
              ).getTime()
            : 0;


        return fechaB - fechaA;

      }
    );


    mostrarMatches(
      datosFinales
    );

  }
  catch (error) {

    console.error(error);

    mostrarError(
      "Ocurrió un error inesperado."
    );

  }

}


/* =========================
   MOSTRAR MATCHES
========================= */

function mostrarMatches(
  datos
) {

  const contenido =
    document.getElementById(
      "contenido"
    );


  if (
    !datos.length
  ) {

    mostrarVacio();

    return;

  }


  let html = `

    <div class="lista">

  `;


  datos.forEach(
    item => {

      const perfil =
        item.perfil;


      const match =
        item.match;


      const nombre =
        escaparHTML(
          perfil.nombre ||
          "Usuario"
        );


      const edad =
        perfil.edad
          ? `, ${perfil.edad}`
          : "";


      const ciudad =
        perfil.ciudad
          ? `📍 ${escaparHTML(
              perfil.ciudad
            )}`
          : "";


      let foto;


      if (
        perfil.foto_url
      ) {

        foto = `

          <img
            class="foto"
            src="${escaparHTML(
              perfil.foto_url
            )}"
            alt="Foto de ${nombre}"
            onerror="
              this.style.display='none';
              this.nextElementSibling.style.display='flex';
            "
          >

          <div
            class="foto-sin"
            style="display:none;"
          >
            👤
          </div>

        `;

      }
      else {

        foto = `

          <div class="foto-sin">
            👤
          </div>

        `;

      }


      let mensajeHTML;


      if (
        item.ultimoMensaje
      ) {

        const contenidoMensaje =
          escaparHTML(
            item.ultimoMensaje.content
          );


        const prefijo =
          item.ultimoMensaje.sender_id ===
          usuarioActual.id
            ? "Vos: "
            : "";


        mensajeHTML = `

          <div class="ultimo-mensaje">

            ${prefijo}${contenidoMensaje}

          </div>

        `;

      }
      else {

        mensajeHTML = `

          <div
            class="ultimo-mensaje sin-mensaje"
          >
            💬 Comenzá la conversación
          </div>

        `;

      }


      html += `

        <a
          class="match-card"
          href="./conversacion.html?user=${encodeURIComponent(
            perfil.id
          )}"
        >

          ${foto}

          <div class="info">

            <div class="nombre">

              ${nombre}${edad}

              ${
                perfil.online
                  ? `
                    <span
                      class="online"
                    ></span>
                  `
                  : ""
              }

            </div>

            ${
              ciudad
                ? `
                  <div class="dato">
                    ${ciudad}
                  </div>
                `
                : ""
            }

            ${mensajeHTML}

          </div>


          ${
            item.noLeidos > 0
              ? `
                <span
                  class="badge"
                  style="display:flex;"
                >
                  ${
                    item.noLeidos > 99
                      ? "99+"
                      : item.noLeidos
                  }
                </span>
              `
              : ""
          }


          <span class="flecha">
            ›
          </span>

        </a>

      `;

    }
  );


  html += `
    </div>
  `;


  contenido.innerHTML =
    html;

}


/* =========================
   ESTADO VACÍO
========================= */

function mostrarVacio() {

  document.getElementById(
    "contenido"
  ).innerHTML = `

    <div class="estado-vacio">

      <div class="emoji">
        💕
      </div>

      <h2>
        Todavía no tenés Matches
      </h2>

      <p>
        Seguí descubriendo personas
        y cuando haya un Like mutuo,
        aparecerá acá.
      </p>

    </div>

  `;

}


/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  try {

    const {
      data: matches,
      error
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (error) {

      console.error(error);

      return;

    }


    if (
      !matches ||
      !matches.length
    ) {

      return;

    }


    const matchIds =
      matches.map(
        match =>
          match.id
      );


    const {
      data: mensajes,
      error: errorMensajes
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id"
        )
        .in(
          "match_id",
          matchIds
        )
        .neq(
          "sender_id",
          usuarioActual.id
        )
        .is(
          "read_at",
          null
        );


    if (errorMensajes) {

      console.error(
        errorMensajes
      );

      return;

    }


    const cantidad =
      mensajes
        ? mensajes.length
        : 0;


    const badge =
      document.getElementById(
        "badgeNotificaciones"
      );


    if (
      cantidad > 0
    ) {

      badge.textContent =
        cantidad > 99
          ? "99+"
          : cantidad;

      badge.style.display =
        "flex";

    }
    else {

      badge.style.display =
        "none";

    }
