<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EmiMatch - Mis Matches</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.status {
  background: white;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.match {
  background: white;
  padding: 15px;
  border-radius: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  cursor: pointer;
  transition: .2s;
}

.match:active {
  transform: scale(.98);
}

.match img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  background: #ddd;
}

.match-info {
  flex: 1;
}

.match-info h3 {
  margin: 0 0 6px;
  font-size: 19px;
}

.match-info p {
  margin: 4px 0;
  color: #666;
}

.arrow {
  font-size: 25px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 16px;
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
  <h1>💕 Mis Matches</h1>
</header>

<div class="container">

  <div id="status" class="status">
    🔄 Cargando matches...
  </div>

  <div id="matches"></div>

  <button onclick="volverPerfil()">
    ← Volver al perfil
  </button>

</div>

<script>

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function cargarMatches() {

  const status =
    document.getElementById("status");

  const container =
    document.getElementById("matches");

  try {

    status.className = "status";

    status.innerHTML =
      "🔄 Comprobando sesión...";


    const {
      data: sessionData,
      error: sessionError
    } = await supabaseClient.auth.getSession();


    if (sessionError) {
      throw new Error(
        sessionError.message
      );
    }


    const session =
      sessionData.session;


    if (!session) {

      status.className =
        "status error";

      status.innerHTML =
        "❌ No hay una sesión iniciada.";

      return;
    }


    const userId =
      session.user.id;


    console.log(
      "Usuario actual:",
      userId
    );


    status.innerHTML =
      "🔎 Buscando tus matches...";


    const {
      data: matches,
      error: matchesError
    } = await supabaseClient
      .from("matches")
      .select("*")
      .or(
        `user1_id.eq.${userId},user2_id.eq.${userId}`
      );


    console.log(
      "Matches encontrados:",
      matches
    );


    if (matchesError) {

      throw new Error(
        "Error consultando matches: " +
        matchesError.message
      );
    }


    if (!matches ||
        matches.length === 0) {

      status.innerHTML =
        "💕 Todavía no tenés matches.";

      return;
    }


    status.className =
      "status success";

    status.innerHTML =
      "💕 Encontramos " +
      matches.length +
      " match" +
      (matches.length === 1 ? "" : "es") +
      ".";


    container.innerHTML = "";


    for (const match of matches) {

      const otherUserId =
        match.user1_id === userId
          ? match.user2_id
          : match.user1_id;


      console.log(
        "Buscando usuario:",
        otherUserId
      );


      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select(
          "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
        )
        .eq("id", otherUserId)
        .maybeSingle();


      console.log(
        "Perfil encontrado:",
        profile
      );


      if (profileError) {

        const errorBox =
          document.createElement("div");

        errorBox.className =
          "status error";

        errorBox.innerHTML =
          "❌ Error cargando perfil:<br>" +
          escapar(profileError.message);

        container.appendChild(errorBox);

        continue;
      }


      if (!profile) {

        const errorBox =
          document.createElement("div");

        errorBox.className =
          "status error";

        errorBox.innerHTML =
          "⚠️ No se encontró el perfil.";

        container.appendChild(errorBox);

        continue;
      }


      const card =
        document.createElement("div");

      card.className =
        "match";


      const foto =
        profile.foto_url ||
        "https://via.placeholder.com/150";


      const nombre =
        profile.nombre ||
        "Usuario";


      const edad =
        profile.edad
          ? profile.edad + " años"
          : "";


      const ciudad =
        profile.ciudad ||
        "";


      card.innerHTML = `

        <img
          src="${escapar(foto)}"
          alt="Foto de ${escapar(nombre)}"
        >

        <div class="match-info">

          <h3>
            ${escapar(nombre)}
          </h3>

          <p>
            ${escapar(edad)}
          </p>

          <p>
            📍 ${escapar(ciudad)}
          </p>

        </div>

        <div class="arrow">
          ›
        </div>

      `;


      card.addEventListener(
        "click",
        function() {

          console.log(
            "ABRIENDO CONVERSACIÓN:",
            otherUserId
          );


          const url =
            "./conversacion.html?user=" +
            encodeURIComponent(
              otherUserId
            );


          console.log(
            "URL:",
            url
          );


          window.location.assign(url);

        }
      );


      container.appendChild(card);

    }

  } catch (error) {

    console.error(
      "ERROR GENERAL:",
      error
    );


    status.className =
      "status error";


    status.innerHTML =
      "❌ ERROR:<br><br>" +
      escapar(error.message);

  }

}


function escapar(texto) {

  return String(texto || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function volverPerfil() {

  window.location.href =
    "./perfil.html";

}


cargarMatches();

</script>

</body>
</html>
