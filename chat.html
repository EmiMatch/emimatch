<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mis Matches - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #102c5c);
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      margin: 7px 0 0;
      color: #cbd5e8;
      font-size: 14px;
    }

    .contenedor {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }

    .barra {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-volver {
      background: white;
      color: #102c5c;
    }

    .btn-notificaciones {
      background: #d4af37;
      color: #111;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -7px;
      right: -5px;
      min-width: 21px;
      height: 21px;
      padding: 3px 6px;
      background: #e53935;
      color: white;
      border-radius: 20px;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .match {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 13px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .match:hover {
      background: rgba(255,255,255,0.15);
      transform: translateY(-1px);
    }

    .foto {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      background: #1b315b;
      flex-shrink: 0;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .nombre {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .ultimo {
      color: #cbd5e8;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hora {
      color: #91a0ba;
      font-size: 12px;
      margin-top: 5px;
    }

    .vacio {
      text-align: center;
      padding: 55px 20px;
      background: rgba(255,255,255,0.07);
      border-radius: 20px;
      color: #d6deed;
    }

    .emoji {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .cargando {
      text-align: center;
      padding: 45px;
      color: #d5deeb;
    }

    .error {
      background: rgba(244,67,54,0.15);
      border: 1px solid rgba(244,67,54,0.4);
      color: #ffd5d2;
      padding: 15px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .sin-mensaje {
      color: #9eacc4;
      font-style: italic;
    }

    @media(max-width:500px) {

      .contenedor {
        padding: 15px;
      }

      .match {
        padding: 11px;
      }

      .foto {
        width: 60px;
        height: 60px;
      }

    }

  </style>

</head>

<body>

<header>

  <h1>💕 Mis Matches</h1>

  <p>Personas con las que hiciste Match</p>

</header>


<div class="contenedor">

  <div class="barra">

    <button
      class="btn btn-volver"
      onclick="window.location.href='perfil.html'">
      ← Mi perfil
    </button>

    <button
      class="btn btn-notificaciones"
      onclick="window.location.href='notificaciones.html'">

      🔔 Notificaciones

      <span
        id="badgeNotificaciones"
        class="badge">
        0
      </span>

    </button>

  </div>


  <div id="estado"></div>

  <div id="listaMatches"></div>

</div>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;


// ==========================================
// SESIÓN
// ==========================================

async function obtenerSesion() {

  const {
    data: { session },
    error
  } = await supabaseClient.auth.getSession();

  if (error) {
    console.error(error);
    return null;
  }

  if (!session) {

    window.location.href =
      "index.html";

    return null;
  }

  return session;
}


// ==========================================
// OBTENER BLOQUEOS
// ==========================================

async function obtenerBloqueos() {

  const { data, error } =
    await supabaseClient
      .from("user_blocks")
      .select("blocker_id, blocked_id")
      .or(
        `blocker_id.eq.${usuarioActual.id},blocked_id.eq.${usuarioActual.id}`
      );

  if (error) {

    console.error(
      "Error obteniendo bloqueos:",
      error
    );

    return [];
  }


  const bloqueados =
    new Set();


  (data || []).forEach(bloqueo => {

    if (
      bloqueo.blocker_id ===
      usuarioActual.id
    ) {

      bloqueados.add(
        bloqueo.blocked_id
      );

    }


    if (
      bloqueo.blocked_id ===
      usuarioActual.id
    ) {

      bloqueados.add(
        bloqueo.blocker_id
      );

    }

  });


  return Array.from(
    bloqueados
  );
}


// ==========================================
// CARGAR MATCHES
// ==========================================

async function cargarMatches() {

  const lista =
    document.getElementById(
      "listaMatches"
    );

  const estado =
    document.getElementById(
      "estado"
    );


  lista.innerHTML = "";

  estado.innerHTML =
    `<div class="cargando">
      ⏳ Cargando tus Matches...
    </div>`;


  try {

    const session =
      await obtenerSesion();

    if (!session) return;


    usuarioActual =
      session.user;


    // --------------------------------------
    // BLOQUEOS
    // --------------------------------------

    const bloqueados =
      await obtenerBloqueos();


    // --------------------------------------
    // MATCHES
    // --------------------------------------

    const {
      data: matches,
      error
    } =
      await supabaseClient
        .from("matches")
        .select("*")
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {
      throw error;
    }


    if (
      !matches ||
      matches.length === 0
    ) {

      estado.innerHTML = "";

      mostrarVacio(
        "💕",
        "Todavía no tenés Matches",
        "Cuando haya un Match aparecerá acá."
      );

      await cargarNotificaciones();

      return;
    }


    let cantidad =
      0;


    // --------------------------------------
    // PROCESAR MATCHES
    // --------------------------------------

    for (
      const match of matches
    ) {

      const otroUsuario =
        match.user1_id ===
        usuarioActual.id
          ? match.user2_id
          : match.user1_id;


      // ------------------------------------
      // BLOQUEADO
      // ------------------------------------

      if (
        bloqueados.includes(
          otroUsuario
        )
      ) {

        continue;
      }


      // ------------------------------------
      // PERFIL
      // ------------------------------------

      const {
        data: perfil,
        error: errorPerfil
      } =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "id",
            otroUsuario
          )
          .maybeSingle();


      if (errorPerfil) {

        console.error(
          errorPerfil
        );

        continue;
      }


      if (!perfil) {
        continue;
      }


      // ------------------------------------
      // ÚLTIMO MENSAJE
      // ------------------------------------

      const {
        data: mensajes,
        error: errorMensajes
      } =
        await supabaseClient
          .from("messages")
          .select(
            "content,created_at,sender_id"
          )
          .eq(
            "match_id",
            match.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          )
          .limit(1);


      if (errorMensajes) {

        console.error(
          errorMensajes
        );

      }


      const ultimo =
        mensajes &&
        mensajes.length > 0
          ? mensajes[0]
          : null;


      crearMatchCard(
        match,
        perfil,
        ultimo
      );


      cantidad++;

    }


    estado.innerHTML = "";


    if (cantidad === 0) {

      mostrarVacio(
        "🚫",
        "No tenés Matches visibles",
        "Los usuarios bloqueados no aparecen en esta sección."
      );

    }


    await cargarNotificaciones();


  } catch (error) {

    console.error(error);


    estado.innerHTML =
      `<div class="error">
        ❌ No se pudieron cargar tus Matches.
        <br><br>
        ${escapeHTML(
          error.message || ""
        )}
      </div>`;

  }

}


// ==========================================
// CARD MATCH
// ==========================================

function crearMatchCard(
  match,
  perfil,
  ultimo
) {

  const lista =
    document.getElementById(
      "listaMatches"
    );


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "match";


  card.onclick = function() {

    window.location.href =
      `conversacion.html?user=${encodeURIComponent(
        perfil.id
      )}`;

  };


  const foto =
    perfil.foto_url ||
    "https://via.placeholder.com/200?text=EmiMatch";


  const nombre =
    perfil.nombre ||
    "Usuario";


  let textoMensaje =
    "Todavía no hay mensajes.";


  if (ultimo) {

    textoMensaje =
      ultimo.sender_id ===
      usuarioActual.id
        ? `Vos: ${ultimo.content}`
        : ultimo.content;

  }


  card.innerHTML = `

    <img
      class="foto"
      src="${escapeHTML(foto)}"
      alt="Foto"
      onerror="
        this.src='https://via.placeholder.com/200?text=EmiMatch'
      "
    >

    <div class="info">

      <div class="nombre">
        ${escapeHTML(nombre)}
      </div>

      <div class="ultimo ${
        ultimo
          ? ""
          : "sin-mensaje"
      }">

        ${escapeHTML(
          textoMensaje
        )}

      </div>

      ${
        ultimo
          ? `
            <div class="hora">
              ${formatearFecha(
                ultimo.created_at
              )}
            </div>
          `
          : ""
      }

    </div>

  `;


  lista.appendChild(
    card
  );

}


// ==========================================
// NOTIFICACIONES
// ==========================================

async function cargarNotificaciones() {

  if (!usuarioActual) return;


  const badge =
    document.getElementById(
      "badgeNotificaciones"
    );


  try {

    const bloqueados =
      await obtenerBloqueos();


    const { data: matches } =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (!matches) {

      badge.style.display =
        "none";

      return;
    }


    let total =
      0;


    for (
      const match of matches
    ) {

      const otroUsuario =
        match.user1_id ===
        usuarioActual.id
          ? match.user2_id
          : match.user1_id;


      if (
        bloqueados.includes(
          otroUsuario
        )
      ) {

        continue;
      }


      const {
        count,
        error
      } =
        await supabaseClient
          .from("messages")
          .select(
            "id",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "match_id",
            match.id
          )
          .neq(
            "sender_id",
            usuarioActual.id
          )
          .is(
            "read_at",
            null
          );


      if (!error && count) {

        total += count;

      }

    }


    if (total > 0) {

      badge.textContent =
        total > 99
          ? "99+"
          : total;

      badge.style.display =
        "flex";

    } else {

      badge.style.display =
        "none";

    }

  } catch (error) {

    console.error(
      "Error notificaciones:",
      error
    );

  }

}


// ==========================================
// VACÍO
// ==========================================

function mostrarVacio(
  emoji,
  titulo,
  texto
) {

  const lista =
    document.getElementById(
      "listaMatches"
    );


  lista.innerHTML = `

    <div class="vacio">

      <div class="emoji">
        ${emoji}
      </div>

      <h2>
        ${titulo}
      </h2>

      <p>
        ${texto}
      </p>

    </div>

  `;

}


// ==========================================
// FECHA
// ==========================================

function formatearFecha(
  fecha
) {

  if (!fecha) return "";

  const date =
    new Date(fecha);


  return date.toLocaleString(
    "es-AR",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


// ==========================================
// SEGURIDAD
// ==========================================

function escapeHTML(
  valor
) {

  return String(
    valor ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


// ==========================================
// REALTIME
// ==========================================

supabaseClient
  .channel(
    "chat-matches-live"
  )
  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "messages"
    },
    async () => {

      await cargarMatches();

    }
  )
  .subscribe();


// ==========================================
// INICIO
// ==========================================

cargarMatches();

</script>

</body>
</html>
