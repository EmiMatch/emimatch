<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Chat</title>

  <meta
    name="description"
    content="Chat privado de EmiMatch."
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #050816;
      --bg2: #0b1228;
      --card: rgba(255,255,255,.065);
      --card2: rgba(255,255,255,.09);
      --border: rgba(255,255,255,.11);

      --gold: #d9ad45;
      --gold-light: #f6dc87;

      --purple: #7c3aed;
      --purple-light: #a855f7;

      --pink: #ec4899;

      --white: #ffffff;
      --text: #e8edf7;
      --muted: #94a3b8;

      --success: #22c55e;
      --danger: #ef4444;

      --shadow:
        0 25px 70px rgba(0,0,0,.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(124,58,237,.25),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 90%,
          rgba(236,72,153,.14),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          var(--bg),
          var(--bg2)
        );

      color: var(--text);
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      height: 76px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 22px;

      background:
        rgba(5,8,22,.84);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      border-bottom:
        1px solid var(--border);

      box-shadow:
        0 10px 40px rgba(0,0,0,.25);

      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      color: var(--white);
      text-decoration: none;
      font-weight: 900;
      font-size: 21px;
      letter-spacing: -.5px;
    }

    .brand-heart {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--pink)
        );

      box-shadow:
        0 8px 28px rgba(124,58,237,.35);

      font-size: 19px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;

      border: 1px solid var(--border);
      border-radius: 13px;

      background: rgba(255,255,255,.055);

      color: var(--white);

      display: grid;
      place-items: center;

      transition: .2s ease;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,.1);
      transform: translateY(-1px);
    }

    /* =========================
       CHAT HEADER
    ========================= */

    .chat-header {
      height: 82px;
      flex-shrink: 0;

      display: flex;
      align-items: center;

      gap: 13px;

      padding: 10px 18px;

      background:
        rgba(13,22,48,.72);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-bottom:
        1px solid var(--border);

      position: relative;
      z-index: 5;
    }

    .back-btn {
      width: 42px;
      height: 42px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: rgba(255,255,255,.05);

      color: white;

      display: grid;
      place-items: center;

      font-size: 20px;

      transition: .2s;
    }

    .back-btn:hover {
      background: rgba(255,255,255,.1);
    }

    .profile-avatar {
      width: 53px;
      height: 53px;

      border-radius: 50%;

      object-fit: cover;

      border:
        2px solid rgba(217,173,69,.75);

      box-shadow:
        0 0 0 4px rgba(217,173,69,.08),
        0 8px 25px rgba(0,0,0,.35);

      background:
        linear-gradient(
          135deg,
          #1e293b,
          #111827
        );
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      color: white;
      font-size: 16px;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-status {
      margin-top: 4px;

      display: flex;
      align-items: center;
      gap: 6px;

      color: var(--muted);

      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 10px rgba(34,197,94,.75);
    }

    .status-dot.offline {
      background: #64748b;
      box-shadow: none;
    }

    .match-badge {
      padding: 7px 11px;

      border-radius: 999px;

      color: var(--gold-light);

      background:
        rgba(217,173,69,.09);

      border:
        1px solid rgba(217,173,69,.22);

      font-size: 11px;
      font-weight: 800;

      white-space: nowrap;
    }

    /* =========================
       MESSAGES
    ========================= */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding:
        25px
        max(18px, calc((100vw - 900px) / 2))
        30px;

      scroll-behavior: smooth;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(124,58,237,.07),
          transparent 40%
        );
    }

    .messages::-webkit-scrollbar {
      width: 7px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.12);
      border-radius: 20px;
    }

    .welcome {
      max-width: 430px;

      margin:
        25px auto
        28px;

      padding: 20px;

      text-align: center;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid var(--border);

      border-radius: 22px;

      box-shadow:
        0 15px 45px rgba(0,0,0,.18);

      animation: fadeIn .45s ease;
    }

    .welcome-icon {
      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      margin: 0 auto 10px;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          rgba(124,58,237,.25),
          rgba(236,72,153,.18)
        );

      font-size: 23px;
    }

    .welcome h2 {
      color: white;
      font-size: 17px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .date-divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 20px 0;

      color: #718096;

      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .date-divider::before,
    .date-divider::after {
      content: "";
      flex: 1;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.1),
          transparent
        );
    }

    .message-row {
      display: flex;

      margin-bottom: 8px;

      animation: messageIn .25s ease;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: min(72%, 520px);

      padding:
        11px
        14px
        8px;

      border-radius: 18px;

      position: relative;

      box-shadow:
        0 8px 25px rgba(0,0,0,.12);
    }

    .mine .message-bubble {
      color: white;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #9333ea
        );

      border-bottom-right-radius: 5px;
    }

    .theirs .message-bubble {
      color: #e5e7eb;

      background:
        rgba(255,255,255,.075);

      border:
        1px solid rgba(255,255,255,.08);

      border-bottom-left-radius: 5px;
    }

    .message-content {
      font-size: 14px;
      line-height: 1.45;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;

      gap: 4px;

      margin-top: 4px;

      font-size: 9px;

      opacity: .65;
    }

    .message-check {
      font-size: 11px;
    }

    /* =========================
       TYPING
    ========================= */

    .typing {
      min-height: 28px;

      padding: 0
        max(18px, calc((100vw - 900px) / 2));

      color: var(--muted);

      font-size: 11px;
    }

    .typing.hidden {
      visibility: hidden;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-area {
      flex-shrink: 0;

      padding:
        12px
        max(18px, calc((100vw - 900px) / 2))
        16px;

      background:
        rgba(5,8,22,.9);

      border-top:
        1px solid var(--border);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .composer {
      display: flex;
      align-items: flex-end;

      gap: 9px;

      padding: 7px;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid rgba(255,255,255,.1);

      border-radius: 19px;

      box-shadow:
        0 15px 40px rgba(0,0,0,.25);
    }

    .composer textarea {
      flex: 1;

      min-height: 42px;
      max-height: 120px;

      resize: none;

      border: none;
      outline: none;

      background: transparent;

      color: white;

      padding:
        11px
        10px;

      line-height: 1.4;

      font-size: 14px;
    }

    .composer textarea::placeholder {
      color: #718096;
    }

    .send-btn {
      width: 45px;
      height: 45px;

      flex-shrink: 0;

      border: none;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--pink)
        );

      color: white;

      font-size: 18px;

      display: grid;
      place-items: center;

      box-shadow:
        0 8px 25px rgba(124,58,237,.3);

      transition:
        transform .2s,
        opacity .2s;
    }

    .send-btn:hover {
      transform: translateY(-2px);
    }

    .send-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .composer-hint {
      text-align: center;

      color: #64748b;

      font-size: 9px;

      margin-top: 7px;
    }

    /* =========================
       LOADING
    ========================= */

    .loading-screen {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          #050816,
          #0b1228
        );

      transition: opacity .3s;
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 52px;
      height: 52px;

      border-radius: 50%;

      border:
        3px solid rgba(255,255,255,.08);

      border-top-color: var(--gold);

      animation:
        spin .8s linear infinite;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 95px;

      transform:
        translate(-50%, 20px);

      opacity: 0;

      pointer-events: none;

      z-index: 200;

      max-width:
        calc(100% - 30px);

      padding:
        11px
        15px;

      border-radius: 13px;

      background:
        rgba(15,23,42,.94);

      border:
        1px solid var(--border);

      color: white;

      font-size: 12px;

      box-shadow:
        0 15px 45px rgba(0,0,0,.35);

      transition: .25s;
    }

    .toast.show {
      opacity: 1;
      transform:
        translate(-50%, 0);
    }

    .toast.error {
      border-color:
        rgba(239,68,68,.3);
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      body {
        background:
          linear-gradient(
            135deg,
            var(--bg),
            var(--bg2)
          );
      }

      .topbar {
        height: 62px;
        padding: 0 13px;
      }

      .brand {
        font-size: 18px;
      }

      .brand-heart {
        width: 36px;
        height: 36px;
      }

      .chat-header {
        height: 70px;
        padding: 8px 10px;
      }

      .back-btn {
        width: 38px;
        height: 38px;
      }

      .profile-avatar {
        width: 45px;
        height: 45px;
      }

      .match-badge {
        display: none;
      }

      .messages {
        padding:
          16px
          12px
          18px;
      }

      .message-bubble {
        max-width: 82%;
      }

      .composer-area {
        padding:
          9px
          10px
          11px;
      }

      .composer-hint {
        display: none;
      }

      .toast {
        bottom: 82px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOADING
  ========================= -->

  <div
    id="loadingScreen"
    class="loading-screen"
  >
    <div class="loader"></div>
  </div>


  <div class="app">

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

      <a
        href="matches.html"
        class="brand"
      >
        <span class="brand-heart">💕</span>
        <span>EmiMatch</span>
      </a>

      <div class="top-actions">

        <button
          id="logoutBtn"
          class="icon-btn"
          title="Cerrar sesión"
          aria-label="Cerrar sesión"
        >
          🚪
        </button>

      </div>

    </header>


    <!-- =========================
         CHAT HEADER
    ========================= -->

    <section class="chat-header">

      <button
        id="backBtn"
        class="back-btn"
        aria-label="Volver"
      >
        ←
      </button>

      <img
        id="profileAvatar"
        class="profile-avatar"
        src="https://placehold.co/200x200/111827/ffffff?text=💕"
        alt="Foto de perfil"
      >

      <div class="user-info">

        <div
          id="userName"
          class="user-name"
        >
          Cargando...
        </div>

        <div class="user-status">

          <span
            id="statusDot"
            class="status-dot"
          ></span>

          <span id="statusText">
            Conexión segura
          </span>

        </div>

      </div>

      <div class="match-badge">
        ❤️ MATCH
      </div>

    </section>


    <!-- =========================
         MESSAGES
    ========================= -->

    <main
      id="messages"
      class="messages"
    >

      <div
        id="welcome"
        class="welcome"
      >

        <div class="welcome-icon">
          💕
        </div>

        <h2>
          ¡Hicieron Match!
        </h2>

        <p>
          Este es el comienzo de una nueva conexión.
          Enviá un mensaje y empezá la conversación.
        </p>

      </div>

    </main>


    <!-- =========================
         TYPING
    ========================= -->

    <div
      id="typing"
      class="typing hidden"
    >
      Escribiendo...
    </div>


    <!-- =========================
         COMPOSER
    ========================= -->

    <footer class="composer-area">

      <div class="composer">

        <textarea
          id="messageInput"
          rows="1"
          maxlength="1000"
          placeholder="Escribí un mensaje..."
          autocomplete="off"
        ></textarea>

        <button
          id="sendBtn"
          class="send-btn"
          disabled
          aria-label="Enviar mensaje"
          title="Enviar mensaje"
        >
          ➤
        </button>

      </div>

      <div class="composer-hint">
        Enter para enviar · Shift + Enter para nueva línea
      </div>

    </footer>

  </div>


  <!-- =========================
       TOAST
  ========================= -->

  <div
    id="toast"
    class="toast"
  ></div>


  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://kngiadwaesdbmvwivdev.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loadingScreen =
      document.getElementById("loadingScreen");

    const messagesContainer =
      document.getElementById("messages");

    const welcome =
      document.getElementById("welcome");

    const profileAvatar =
      document.getElementById("profileAvatar");

    const userName =
      document.getElementById("userName");

    const statusDot =
      document.getElementById("statusDot");

    const statusText =
      document.getElementById("statusText");

    const messageInput =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const backBtn =
      document.getElementById("backBtn");

    const toast =
      document.getElementById("toast");


    /* =====================================================
       STATE
    ===================================================== */

    let currentUser = null;
    let otherUser = null;

    let realtimeChannel = null;

    let loadedMessageIds = new Set();

    let sendingMessage = false;


    /* =====================================================
       HELPERS
    ===================================================== */

    function showToast(
      message,
      isError = false
    ) {

      toast.textContent = message;

      toast.classList.toggle(
        "error",
        isError
      );

      toast.classList.add("show");

      clearTimeout(
        showToast.timeout
      );

      showToast.timeout =
        setTimeout(() => {

          toast.classList.remove(
            "show"
          );

        }, 2800);
    }


    function escapeHtml(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value ?? "";

      return div.innerHTML;
    }


    function formatTime(dateString) {

      const date =
        new Date(dateString);

      return date.toLocaleTimeString(
        "es-AR",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }


    function formatDate(dateString) {

      const date =
        new Date(dateString);

      const today =
        new Date();
