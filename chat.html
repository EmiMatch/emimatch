<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat | EmiMatch</title>
  <meta name="description" content="Chat privado de EmiMatch.">
  <meta name="theme-color" content="#111827">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      min-height: 100vh;
      color: #fff;

      background:
        radial-gradient(
          circle at top left,
          rgba(124, 58, 237, 0.20),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #07152f 0%,
          #111827 50%,
          #241044 100%
        );
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(14px);

      border-bottom:
        1px solid rgba(255,255,255,0.08);
    }

    .header-content {
      max-width: 900px;
      margin: auto;
      padding: 13px 18px;

      display: flex;
      align-items: center;
      gap: 13px;
    }

    .back {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);

      font-size: 20px;
    }

    .user-photo {
      width: 42px;
      height: 42px;

      border-radius: 50%;
      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #312e81,
          #7c3aed
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;

      flex-shrink: 0;
    }

    .user-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      min-width: 0;
    }

    .user-name {
      font-size: 16px;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-status {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 2px;
    }

    /* CHAT */

    main {
      max-width: 900px;
      margin: auto;

      height:
        calc(100vh - 68px);

      padding: 14px;
    }

    .chat-container {
      height: 100%;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.09);

      border-radius: 22px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.25);

      backdrop-filter: blur(14px);
    }

    /* MESSAGES */

    #messagesContainer {
      flex: 1;

      overflow-y: auto;

      padding: 22px 18px;

      display: flex;
      flex-direction: column;
      gap: 9px;

      scroll-behavior: smooth;
    }

    .loading {
      margin: auto;

      text-align: center;

      color: #94a3b8;
    }

    .loading-heart {
      font-size: 40px;
      margin-bottom: 10px;

      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }

    .empty-chat {
      margin: auto;

      max-width: 330px;

      text-align: center;

      color: #94a3b8;

      line-height: 1.6;
      font-size: 13px;
    }

    .empty-chat-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message {
      max-width: min(75%, 520px);

      padding: 10px 13px;

      border-radius: 17px;

      font-size: 14px;
      line-height: 1.45;

      word-break: break-word;
    }

    .mine .message {
      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #a855f7
        );

      border-bottom-right-radius: 5px;
    }

    .theirs .message {
      background:
        rgba(255,255,255,0.09);

      border:
        1px solid rgba(255,255,255,0.08);

      border-bottom-left-radius: 5px;
    }

    .message-time {
      display: block;

      margin-top: 4px;

      font-size: 9px;

      opacity: 0.65;

      text-align: right;
    }

    /* INPUT */

    .composer {
      padding: 12px;

      border-top:
        1px solid rgba(255,255,255,0.08);

      background:
        rgba(15,23,42,0.45);
    }

    .composer-form {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    #messageInput {
      flex: 1;

      min-width: 0;

      border:
        1px solid rgba(255,255,255,0.10);

      background:
        rgba(15,23,42,0.85);

      color: #fff;

      outline: none;

      border-radius: 999px;

      padding: 12px 16px;

      font-size: 14px;
    }

    #messageInput::placeholder {
      color: #64748b;
    }

    #messageInput:focus {
      border-color:
        rgba(217,173,69,0.65);

      box-shadow:
        0 0 0 3px rgba(217,173,69,0.08);
    }

    #sendButton {
      width: 46px;
      height: 46px;

      flex-shrink: 0;

      border: 0;
      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #d9ad45,
          #f1cf78
        );

      color: #111827;

      cursor: pointer;

      font-size: 18px;
      font-weight: 900;

      transition: 0.2s ease;
    }

    #sendButton:hover {
      transform: translateY(-2px);
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
    }

    /* ERROR */

    .error-box {
      margin: 12px;

      padding: 12px 14px;

      border-radius: 12px;

      background:
        rgba(239,68,68,0.12);

      border:
        1px solid rgba(239,68,68,0.25);

      color: #fecaca;

      font-size: 12px;

      line-height: 1.5;
    }

    @media (max-width: 600px) {
      main {
        height:
          calc(100vh - 68px);

        padding: 7px;
      }

      .chat-container {
        border-radius: 16px;
      }

      #messagesContainer {
        padding: 16px 12px;
      }

      .message {
        max-width: 84%;
      }

      .user-name {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="header-content">

      <a
        href="matches.html"
        class="back"
        aria-label="Volver"
      >
        ←
      </a>

      <div
        id="userPhoto"
        class="user-photo"
      >
        💕
      </div>

      <div class="user-info">

        <div
          id="userName"
          class="user-name"
        >
          Cargando...
        </div>

        <div
          id="userStatus"
          class="user-status"
        >
          Conectando...
        </div>

      </div>

    </div>

  </header>


  <main>

    <div class="chat-container">

      <div
        id="messagesContainer"
      >

        <div class="loading">

          <div class="loading-heart">
            💕
          </div>

          <p>
            Cargando conversación...
          </p>

        </div>

      </div>


      <div
        id="errorContainer"
      ></div>


      <div class="composer">

        <form
          id="messageForm"
          class="composer-form"
        >

          <input
            type="text"
            id="messageInput"
            maxlength="1000"
            autocomplete="off"
            placeholder="Escribí un mensaje..."
          >

          <button
            type="submit"
            id="sendButton"
            aria-label="Enviar mensaje"
          >
            ➤
          </button>

        </form>

      </div>

    </div>

  </main>


  <script>

    /* ==========================================
       SUPABASE
       ========================================== */

    const SUPABASE_URL =
      "https://kng...supabase.co";

    const SUPABASE_ANON_KEY =
      "PEGÁ_ACÁ_TU_ANON_KEY";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* ==========================================
       ELEMENTOS
       ========================================== */

    const messagesContainer =
      document.getElementById(
        "messagesContainer"
      );

    const messageInput =
      document.getElementById(
        "messageInput"
      );

    const messageForm =
      document.getElementById(
        "messageForm"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const userName =
      document.getElementById(
        "userName"
      );

    const userPhoto =
      document.getElementById(
        "userPhoto"
      );

    const userStatus =
      document.getElementById(
        "userStatus"
      );

    const errorContainer =
      document.getElementById(
        "errorContainer"
      );


    /* ==========================================
       ESTADO
       ========================================== */

    let currentUser = null;
    let otherUserId = null;
    let channel = null;


    /* ==========================================
       UTILIDADES
       ========================================== */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function showError(message) {

      errorContainer.innerHTML = `
        <div class="error-box">
          ⚠️ ${escapeHtml(message)}
        </div>
      `;

    }


    function clearError() {

      errorContainer.innerHTML = "";

    }


    function formatTime(dateValue) {

      if (!dateValue) {
        return "";
      }

      const date =
        new Date(dateValue);

      return date.toLocaleTimeString(
        "es-AR",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* ==========================================
       OBTENER ID DESDE LA URL
       ========================================== */

    function getOtherUserId() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return params.get("user");

    }


    /* ==========================================
       INICIAR
       ========================================== */

    async function init() {

      otherUserId =
        getOtherUserId();


      if (!otherUserId) {

        showError(
          "No se encontró el usuario de esta conversación."
        );

        userName.textContent =
          "Conversación";

        userStatus.textContent =
          "Falta seleccionar un match";

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getSession();


      if (error || !data.session) {

        window.location.href =
          "index.html";

        return;

      }


      currentUser =
        data.session.user;


      if (
        currentUser.id ===
        otherUserId
      ) {

        showError(
          "No podés iniciar un chat con tu propio perfil."
        );

        return;

      }


      await loadOtherProfile();

      await loadMessages();

      subscribeToMessages();

      messageInput.focus();

    }


    /* ==========================================
       PERFIL DEL MATCH
       ========================================== */

    async function loadOtherProfile() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(`
            id,
            nombre,
            foto_url
          `)
          .eq(
            "id",
            otherUserId
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Error perfil:",
          error
        );

        showError(
          "No pudimos cargar el perfil."
        );

        return;

      }


      if (!data) {

        userName.textContent =
          "Usuario EmiMatch";

        userStatus.textContent =
          "Match";

        return;

      }


      userName.textContent =
        data.nombre ||
        "Usuario EmiMatch";


      userStatus.textContent =
        "💕 Match";


      if (data.foto_url) {

        userPhoto.innerHTML = `
          <img
            src="${escapeHtml(
              data.foto_url
            )}"
            alt="Foto"
            onerror="
              this.style.display='none';
            "
          >
        `;

      }

    }


    /* ==========================================
       CARGAR MENSAJES
       ========================================== */

    async function loadMessages() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select("*")
          .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Error cargando mensajes:",
          error
        );

        messagesContainer.innerHTML = "";

        showError(
          "No pudimos cargar los mensajes: " +
          error.message
        );

        return;

      }


      renderMessages(
        data || []
      );

    }


    /* ==========================================
       MOSTRAR MENSAJES
       ========================================== */

    function renderMessages(
      messages
    ) {

      if (
        !messages ||
        messages.length === 0
      ) {

        messagesContainer.innerHTML = `

          <div class="empty-chat">

            <div class="empty-chat-icon">
              💕
            </div>

            <p>
              Todavía no hay mensajes.
              <br>
              ¡Animate a dar el primer paso!
            </p>

          </div>

        `;

        return;

      }


      messagesContainer.innerHTML =
        messages
          .map(message => {

            const mine =
              message.sender_id ===
              currentUser.id;


            return `

              <div
                class="message-row ${
                  mine
                    ? "mine"
                    : "theirs"
                }"
              >

                <div class="message">

                  ${escapeHtml(
                    message.content ||
                    ""
                  )}

                  <span class="message-time">
                    ${formatTime(
                      message.created_at
                    )}
                  </span>

                </div>

              </div>

            `;

          })
          .join("");


      scrollToBottom();

    }


    /* ==========================================
       ENVIAR MENSAJE
       ========================================== */

    messageForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const content =
          messageInput.value.trim();


        if (!content) {
          return;
        }


        if (
          !currentUser ||
          !otherUserId
        ) {
          return;
        }


        sendButton.disabled = true;

        clearError();


        const {
          error
        } =
          await supabaseClient
            .from("messages")
            .insert({

              sender_id:
                currentUser.id,

              receiver_id:
                otherUserId,

              content:
                content

            });


        if (error) {

          console.error(
            "Error enviando mensaje:",
            error
          );

          showError(
            "No pudimos enviar el mensaje: " +
            error.message
          );

          sendButton.disabled =
            false;

          return;

        }


        messageInput.value = "";

        sendButton.disabled =
          false;

        messageInput.focus();

      }
    );


    /* ==========================================
       ACTUALIZACIÓN EN TIEMPO REAL
       ========================================== */

    function subscribeToMessages() {

      channel =
        supabaseClient
          .channel(
            "emimatch-chat-" +
            currentUser.id +
            "-" +
            otherUserId
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages"
            },
            payload => {

              const message =
                payload.new;


              const belongsToChat =
                (
                  message.sender_id ===
                    currentUser.id &&
                  message.receiver_id ===
                    otherUserId
                ) ||
                (
                  message.sender_id ===
                    otherUserId &&
                  message.receiver_id ===
                    currentUser.id
                );


              if (!belongsToChat) {
                return;
              }


              addMessage(
                message
              );

            }
          )
          .subscribe();

    }


    /* ==========================================
       AGREGAR MENSAJE NUEVO
       ========================================== */

    function addMessage(
      message
    ) {

      const empty =
        messagesContainer.querySelector(
          ".empty-chat"
        );


      if (empty) {
        empty.remove();
      }


      const mine =
        message.sender_id ===
        currentUser.id;


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row " +
        (
          mine
            ? "mine"
            : "theirs"
        );


      row.innerHTML = `

        <div class="message">

          ${escapeHtml(
            message.content || ""
          )}

          <span class="message-time">
            ${formatTime(
              message.created_at
            )}
          </span>

        </div>

      `;


      messagesContainer.appendChild(
        row
      );


      scrollToBottom();

    }


    /* ==========================================
       SCROLL
       ========================================== */

    function scrollToBottom() {

      messagesContainer.scrollTop =
        messagesContainer.scrollHeight;

    }


    /* ==========================================
       LIMPIAR CANAL
       ========================================== */

    window.addEventListener(
      "beforeunload",
      () => {

        if (channel) {

          supabaseClient
            .removeChannel(
              channel
            );

        }

      }
    );


    /* ==========================================
       START
       ========================================== */

    init();

  </script>

</body>
  </html>
