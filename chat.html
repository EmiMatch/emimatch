<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EmiMatch - Matches</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.status {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.match {
  background: white;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  cursor: pointer;
}

.match img {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  object-fit: cover;
  background: #ddd;
}

.match-info {
  flex: 1;
}

.match-info h3 {
  margin: 0 0 5px;
}

.match-info p {
  margin: 3px 0;
  color: #666;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #111827;
  color: white;
  font-size: 16px;
  margin-top: 10px;
}

.error {
  color: #b91c1c;
  background: #fee2e2;
}

.success {
  color: #166534;
  background: #dcfce7;
}
</style>
</head>

<body>

<header>
  <h1>💕 Mis Matches</h1>
</header>

<div class="container">

  <div id="status" class="status">
    Cargando matches...
  </div>

  <div id="matches"></div>

  <button onclick="volverPerfil()">← Volver al perfil</button>

</div>

<script>

const SUPABASE_URL = "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function cargarMatches() {

  const status = document.getElementById("status");
  const container = document.getElementById("matches");

  try {

    status.className = "status";
    status.innerHTML = "🔄 Comprobando sesión...";

    const {
      data: sessionData,
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      throw new Error(
        "Error de sesión: " + sessionError.message
      );
    }

    const session = sessionData.session;

    if (!session) {

      status.className = "status error";

      status.innerHTML =
        "❌ No hay una sesión iniciada.<br><br>" +
        "Volvé a iniciar sesión.";

      return;
    }

    const userId = session.user.id;

    console.log("Usuario actual:", userId);

    status.innerHTML =
      "🔎 Buscando tus matches...";


    // BUSCAR MATCHES
    const {
      data: matches,
      error: matchesError
    } = await supabaseClient
      .from("matches")
      .select("*")
      .or(
        `user1_id.eq.${userId},user2_id.eq.${userId}`
      );

    console.log("Matches:", matches);
    console.log("Error matches:", matchesError);

    if (matchesError) {

      throw new Error(
        "Error consultando matches: " +
        matchesError.message
      );
    }


    if (!matches || matches.length === 0) {

      status.className = "status";

      status.innerHTML =
        "💕 No tenés matches todavía.";

      return;
    }


    status.className = "status success";

    status.innerHTML =
      "💕 Encontramos " +
      matches.length +
      " match" +
      (matches.length === 1 ? "" : "es") +
      ".";


    container.innerHTML = "";


    for (const match of matches) {

      const otherUserId =
        match.user1_id === userId
          ? match.user2_id
          : match.user1_id;


      console.log(
        "Buscando perfil:",
        otherUserId
      );


      // BUSCAR PERFIL
      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select(
          "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
        )
        .eq("id", otherUserId)
        .maybeSingle();


      console.log(
        "Perfil:",
        profile
      );

      console.log(
        "Error perfil:",
        profileError
      );


      if (profileError) {

        const errorBox =
          document.createElement("div");

        errorBox.className =
          "status error";

        errorBox.innerHTML =
          "❌ Error al cargar perfil:<br>" +
          profileError.message;

        container.appendChild(errorBox);

        continue;
      }


      if (!profile) {

        const errorBox =
          document.createElement("div");

        errorBox.className =
          "status error";

        errorBox.innerHTML =
          "⚠️ El match existe, pero no se encontró " +
          "el perfil del usuario.";

        container.appendChild(errorBox);

        continue;
      }


      const card =
        document.createElement("div");

      card.className = "match";


      const foto =
        profile.foto_url ||
        "https://via.placeholder.com/100";


      card.innerHTML = `
        <img
          src="${escapar(foto)}"
          alt="Foto"
        >

        <div class="match-info">

          <h3>
            ${escapar(profile.nombre || "Usuario")}
          </h3>

          <p>
            ${profile.edad ? escapar(profile.edad) + " años" : ""}
          </p>

          <p>
            📍 ${escapar(profile.ciudad || "")}
          </p>

        </div>
      `;


      card.onclick = function() {

        window.location.href =
          "chat.html?user=" +
          encodeURIComponent(otherUserId);

      };


      container.appendChild(card);

    }

  } catch (error) {

    console.error(error);

    status.className =
      "status error";

    status.innerHTML =
      "❌ ERROR:<br><br>" +
      escapar(error.message);

  }

}


function escapar(texto) {

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function volverPerfil() {

  window.location.href =
    "perfil.html";

}


cargarMatches();

</script>

</body>
</html>
