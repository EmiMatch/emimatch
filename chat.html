<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Matches</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 90px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg,#07152f,#102b5c);
    }

    header {
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #cbd5e1;
    }

    .contenedor {
      width: 92%;
      max-width: 550px;
      margin: auto;
    }

    .acciones {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn {
      flex: 1;
      background: #d4af37;
      color: #07152f;
    }

    .btn-secundario {
      background: #374151;
      color: white;
    }

    .estado {
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      background: rgba(255,255,255,.08);
    }

    .match {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      margin-bottom: 15px;
      background: white;
      color: #111;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,.3);
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .avatar-vacio {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #d4af37;
      font-size: 35px;
      flex-shrink: 0;
    }

    .datos {
      flex: 1;
    }

    .nombre {
      font-size: 19px;
      font-weight: bold;
    }

    .ciudad {
      color: #666;
      margin-top: 5px;
      font-size: 14px;
    }

    .online {
      color: #16a34a;
      margin-top: 5px;
      font-size: 13px;
    }

    .flecha {
      font-size: 28px;
      color: #999;
    }

    .nav {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 65px;
      border-radius: 20px;
      background: rgba(7,21,47,.97);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav a {
      color: #cbd5e1;
      text-decoration: none;
      text-align: center;
      font-size: 10px;
    }

    .nav a span {
      display: block;
      font-size: 21px;
    }

    .nav .activo {
      color: #d4af37;
    }
  </style>
</head>

<body>

<header>

  <h1>💕 Mis Matches</h1>

  <p>
    Tus conexiones en EmiMatch
  </p>

</header>


<div class="contenedor">

  <div class="acciones">

    <button
      class="btn"
      onclick="location.href='descubrir.html'"
    >
      🔎 Descubrir
    </button>

    <button
      class="btn btn-secundario"
      onclick="cargarMatches()"
    >
      🔄 Actualizar
    </button>

  </div>


  <div id="contenido">

    <div class="estado">
      🚀 EMI-2026 · Iniciando Matches...
    </div>

  </div>

</div>


<nav class="nav">

  <a href="perfil.html">
    <span>👤</span>
    Perfil
  </a>

  <a href="descubrir.html">
    <span>🔎</span>
    Descubrir
  </a>

  <a href="likes.html">
    <span>❤️</span>
    Me gustas
  </a>

  <a
    href="chat.html"
    class="activo"
  >
    <span>💕</span>
    Matches
  </a>

  <a href="notificaciones.html">
    <span>🔔</span>
    Notificaciones
  </a>

</nav>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;


const contenido =
  document.getElementById(
    "contenido"
  );


// ==========================================
// INICIAR
// ==========================================

document.addEventListener(
  "DOMContentLoaded",
  iniciar
);


async function iniciar() {

  contenido.innerHTML = `
    <div class="estado">
      🔐 Verificando sesión...
    </div>
  `;


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {
      throw error;
    }


    if (!data.session) {

      contenido.innerHTML = `
        <div class="estado">
          ⚠️ No hay una sesión activa.
          <br><br>
          <button
            class="btn"
            onclick="location.href='index.html'"
          >
            🔐 Iniciar sesión
          </button>
        </div>
      `;

      return;

    }


    usuarioActual =
      data.session.user;


    await cargarMatches();

  } catch (error) {

    console.error(
      error
    );

    contenido.innerHTML = `

      <div class="estado">

        ⚠️ Error al iniciar Matches.

        <br><br>

        <small>
          ${escapar(
            error.message ||
            "Error desconocido"
          )}
        </small>

        <br><br>

        <button
          class="btn"
          onclick="location.reload()"
        >
          🔄 Reintentar
        </button>

      </div>

    `;

  }

}


// ==========================================
// CARGAR MATCHES
// ==========================================

async function cargarMatches() {

  if (!usuarioActual) {

    const {
      data
    } =
      await supabaseClient.auth.getSession();

    if (
      !data.session
    ) {

      location.href =
        "index.html";

      return;

    }

    usuarioActual =
      data.session.user;

  }


  contenido.innerHTML = `

    <div class="estado">
      🔎 Buscando tus Matches...
    </div>

  `;


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id,created_at"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (error) {
      throw error;
    }


    const lista =
      data || [];


    if (
      lista.length === 0
    ) {

      contenido.innerHTML = `

        <div class="estado">

          <div style="font-size:60px;">
            💕
          </div>

          <h2>
            Todavía no tenés Matches
          </h2>

          <p>
            Andá a Descubrir y
            enviá algunos ❤️
          </p>

          <button
            class="btn"
            onclick="location.href='descubrir.html'"
          >
            🔎 Descubrir personas
          </button>

        </div>

      `;

      return;

    }


    contenido.innerHTML = "";


    for (
      const match
      of lista
    ) {

      const otroId =
        match.user1_id ===
        usuarioActual.id
          ? match.user2_id
          : match.user1_id;


      const {
        data: perfil,
        error:
          errorPerfil
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,nombre,edad,ciudad,foto_url,online"
          )
          .eq(
            "id",
            otroId
          )
          .maybeSingle();


      if (errorPerfil) {

        console.warn(
          errorPerfil
        );

        continue;

      }


      if (!perfil) {
        continue;
      }


      crearTarjeta(
        match,
        perfil
      );

    }


    if (
      contenido.children.length === 0
    ) {

      contenido.innerHTML = `

        <div class="estado">

          ⚠️

          <h3>
            Encontramos el Match,
            pero no pudimos cargar
            el perfil.
          </h3>

        </div>

      `;

    }

  } catch (error) {

    console.error(
      "Error Matches:",
      error
    );


    contenido.innerHTML = `

      <div class="estado">

        <div style="font-size:50px;">
          ⚠️
        </div>

        <h2>
          Error cargando Matches
        </h2>

        <p>
          ${escapar(
            error.message ||
            "Error desconocido"
          )}
        </p>

        <button
          class="btn"
          onclick="cargarMatches()"
        >
          🔄 Reintentar
        </button>

      </div>

    `;

  }

}


// ==========================================
// TARJETA
// ==========================================

function crearTarjeta(
  match,
  perfil
) {

  const tarjeta =
    document.createElement(
      "div"
    );


  tarjeta.className =
    "match";


  let avatar;


  if (
    perfil.foto_url
  ) {

    avatar = `

      <img
        class="avatar"
        src="${escapar(
          perfil.foto_url
        )}"
        alt="Foto"
        onerror="
          this.outerHTML =
          '<div class=&quot;avatar-vacio&quot;>👤</div>'
        "
      >

    `;

  } else {

    avatar = `

      <div class="avatar-vacio">
        👤
      </div>

    `;

  }


  tarjeta.innerHTML = `

    ${avatar}

    <div class="datos">

      <div class="nombre">

        ${escapar(
          perfil.nombre ||
          "Usuario"
        )}

        ${
          perfil.edad
            ? ", " +
              escapar(
                perfil.edad
              )
            : ""
        }

      </div>


      ${
        perfil.ciudad
          ? `
            <div class="ciudad">
              📍 ${escapar(
                perfil.ciudad
              )}
            </div>
          `
          : ""
      }


      ${
        perfil.online
          ? `
            <div class="online">
              🟢 En línea
            </div>
          `
          : ""
      }

    </div>


    <div class="flecha">
      ›
    </div>

  `;


  tarjeta.addEventListener(
    "click",
    () => {

      location.href =
        `conversacion.html?user=${encodeURIComponent(
          perfil.id
        )}`;

    }
  );


  contenido.appendChild(
    tarjeta
  );

}


// ==========================================
// ESCAPAR
// ==========================================

function escapar(
  valor
) {

  return String(
    valor ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
