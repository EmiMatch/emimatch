<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .header {
      background: #111b3a;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      width: 95%;
      max-width: 700px;
      margin: 20px auto;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #111b3a;
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .match {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .match:hover {
      background: #f7f8fc;
    }

    .match img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .match-info {
      flex: 1;
    }

    .match-info strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .match-info span {
      color: #777;
      font-size: 14px;
    }

    #chatSection {
      display: none;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .chat-header img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .chat-header p {
      margin: 4px 0 0;
      color: #777;
      font-size: 13px;
    }

    #messages {
      height: 420px;
      overflow-y: auto;
      background: #f1f3f8;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      max-width: 80%;
      padding: 10px 13px;
      margin-bottom: 10px;
      border-radius: 14px;
      word-wrap: break-word;
      clear: both;
    }

    .mine {
      background: #111b3a;
      color: white;
      float: right;
      border-bottom-right-radius: 4px;
    }

    .theirs {
      background: white;
      color: #222;
      float: left;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      display: block;
      font-size: 10px;
      opacity: .7;
      margin-top: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    #sendButton {
      width: 90px;
      border: none;
      border-radius: 10px;
      background: #111b3a;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    #sendButton:disabled {
      opacity: .5;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    .error {
      background: #ffe8e8;
      color: #b00020;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>💕 EmiMatch</h1>
</div>

<div class="container">

  <!-- =============================== -->
  <!-- MIS MATCHES -->
  <!-- =============================== -->

  <div id="matchesSection" class="card">

    <h2>💕 Mis Matches</h2>

    <p>
      Elegí una persona para comenzar una conversación.
    </p>

    <div id="matchesList">
      <div class="loading">
        Cargando matches...
      </div>
    </div>

    <a href="perfil.html" class="btn">
      ← Volver a mi Perfil
    </a>

  </div>


  <!-- =============================== -->
  <!-- CHAT -->
  <!-- =============================== -->

  <div id="chatSection" class="card">

    <div class="chat-header">

      <img
        id="chatPhoto"
        src="https://via.placeholder.com/100"
        alt="Foto"
      >

      <div>
        <h2 id="chatName">Usuario</h2>
        <p id="chatInfo"></p>
      </div>

    </div>


    <div id="messages">

      <div class="loading">
        Cargando mensajes...
      </div>

    </div>


    <div class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="Escribí un mensaje..."
        autocomplete="off"
      >

      <button id="sendButton">
        Enviar
      </button>

    </div>


    <!-- IMPORTANTE:
         vuelve a chat.html
         NO a matches.html -->

    <a href="chat.html" class="btn">
      ← Volver a mis Matches
    </a>

  </div>

</div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://kngiadwaesdbmvwivdev.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  let currentUser = null;

  let currentMatchId = null;

  let currentOtherUserId = null;

  let realtimeChannel = null;


  // ==========================================
  // INICIO
  // ==========================================

  document.addEventListener(
    "DOMContentLoaded",
    iniciar
  );


  async function iniciar() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      window.location.href =
        "index.html";

      return;

    }


    currentUser =
      session.user;


    const params =
      new URLSearchParams(
        window.location.search
      );


    const userId =
      params.get("user");


    if (userId) {

      await abrirChat(userId);

    } else {

      await cargarMatches();

    }

  }


  // ==========================================
  // CARGAR MATCHES
  // ==========================================

  async function cargarMatches() {

    document.getElementById(
      "matchesSection"
    ).style.display = "block";


    document.getElementById(
      "chatSection"
    ).style.display = "none";


    const lista =
      document.getElementById(
        "matchesList"
      );


    lista.innerHTML =
      '<div class="loading">Cargando matches...</div>';


    const {
      data: matches,
      error
    } =
      await supabaseClient
        .from("matches")
        .select("*")
        .or(
          `user1_id.eq.${currentUser.id},user2_id.eq.${currentUser.id}`
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      lista.innerHTML =
        `<div class="error">
          Error al cargar matches:
          ${escapeHtml(error.message)}
        </div>`;

      return;

    }


    if (
      !matches ||
      matches.length === 0
    ) {

      lista.innerHTML =
        '<div class="empty">💔 Todavía no tenés matches.</div>';

      return;

    }


    lista.innerHTML = "";


    for (
      const match of matches
    ) {

      const otherUserId =
        match.user1_id === currentUser.id
          ? match.user2_id
          : match.user1_id;


      const {
        data: profile,
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,Nombre,Edad,Ciudad,Foto_url"
          )
          .eq(
            "id",
            otherUserId
          )
          .maybeSingle();


      if (profileError) {

        console.error(
          "Error perfil:",
          profileError
        );

        continue;

      }


      if (!profile) {

        console.log(
          "No existe perfil para:",
          otherUserId
        );

        continue;

      }


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "match";


      const foto =
        profile.Foto_url ||
        "https://via.placeholder.com/100";


      const nombre =
        profile.Nombre ||
        "Usuario";


      const edad =
        profile.Edad
          ? ", " + profile.Edad
          : "";


      const ciudad =
        profile.Ciudad ||
        "Sin ciudad";


      div.innerHTML = `

        <img
          src="${escapeHtml(foto)}"
          alt="Foto"
        >

        <div class="match-info">

          <strong>
            ${escapeHtml(nombre)}${edad}
          </strong>

          <span>
            📍 ${escapeHtml(ciudad)}
          </span>

        </div>

        <div>
          💬
        </div>

      `;


      div.addEventListener(
        "click",
        function() {

          window.location.href =
            "chat.html?user=" +
            encodeURIComponent(
              otherUserId
            );

        }
      );


      lista.appendChild(
        div
      );

    }


    if (
      lista.children.length === 0
    ) {

      lista.innerHTML =
        '<div class="empty">No se encontraron los perfiles de tus matches.</div>';

    }

  }


  // ==========================================
  // ABRIR CHAT
  // ==========================================

  async function abrirChat(
    otherUserId
  ) {

    document.getElementById(
      "matchesSection"
    ).style.display = "none";


    document.getElementById(
      "chatSection"
    ).style.display = "block";


    currentOtherUserId =
      otherUserId;


    const {
      data: match,
      error: matchError
    } =
      await buscarMatch(
        otherUserId
      );


    if (
      matchError ||
      !match
    ) {

      document.getElementById(
        "messages"
      ).innerHTML =
        '<div class="error">No se encontró el match.</div>';

      return;

    }


    currentMatchId =
      match.id;


    // ======================================
    // PERFIL
    // ======================================

    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,Nombre,Edad,Ciudad,Descripción,Foto_url,Intereses"
        )
        .eq(
          "id",
          otherUserId
        )
        .maybeSingle();


    if (profileError) {

      console.error(
        profileError
      );

    }


    if (profile) {

      document.getElementById(
        "chatName"
      ).textContent =
        profile.Nombre ||
        "Usuario";


      document.getElementById(
        "chatPhoto"
      ).src =
        profile.Foto_url ||
        "https://via.placeholder.com/100";


      let info = "";


      if (profile.Edad) {

        info +=
          profile.Edad +
          " años";

      }


      if (profile.Ciudad) {

        if (info) {

          info +=
            " · ";

        }

        info +=
          "📍 " +
          profile.Ciudad;

      }


      document.getElementById(
        "chatInfo"
      ).textContent =
        info;

    }


    await cargarMensajes();

    activarRealtime();

  }


  // ==========================================
  // BUSCAR MATCH
  // ==========================================

  async function buscarMatch(
    otherUserId
  ) {

    const {
      data: match1
    } =
      await supabaseClient
        .from("matches")
        .select("*")
        .eq(
          "user1_id",
          currentUser.id
        )
        .eq(
          "user2_id",
          otherUserId
        )
        .maybeSingle();


    if (match1) {

      return {
        data: match1,
        error: null
      };

    }


    const {
      data: match2
    } =
      await supabaseClient
        .from("matches")
        .select("*")
        .eq(
          "user1_id",
          otherUserId
        )
        .eq(
          "user2_id",
          currentUser.id
        )
        .maybeSingle();


    if (match2) {

      return {
        data: match2,
        error: null
      };

    }


    return {
      data: null,
      error:
        new Error(
          "Match no encontrado"
        )
    };

  }


  // ==========================================
  // CARGAR MENSAJES
  // ==========================================

  async function cargarMensajes() {

    const contenedor =
      document.getElementById(
        "messages"
      );


    contenedor.innerHTML =
      '<div class="loading">Cargando mensajes...</div>';


    const {
      data: messages,
      error
    } =
      await supabaseClient
        .from("messages")
        .select("*")
        .eq(
          "match_id",
          currentMatchId
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(error);

      contenedor.innerHTML =
        `<div class="error">
          Error al cargar mensajes:
          ${escapeHtml(error.message)}
        </div>`;

      return;

    }


    contenedor.innerHTML = "";


    if (
      !messages ||
      messages.length === 0
    ) {

      contenedor.innerHTML =
        '<div class="empty">💬 Todavía no hay mensajes.<br>¡Sé el primero en escribir!</div>';

      return;

    }


    messages.forEach(
      mostrarMensaje
    );


    scrollMensajes();

  }


  // ==========================================
  // MOSTRAR MENSAJE
  // ==========================================

  function mostrarMensaje(
    message
  ) {

    const contenedor =
      document.getElementById(
        "messages"
      );


    if (
      document.querySelector(
        `[data-message-id="${message.id}"]`
      )
    ) {

      return;

    }


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "message " +
      (
        message.sender_id === currentUser.id
          ? "mine"
          : "theirs"
      );


    div.dataset.messageId =
      message.id;


    const hora =
      message.created_at
        ? new Date(
            message.created_at
          ).toLocaleTimeString(
            "es-AR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        : "";


    div.innerHTML = `

      ${escapeHtml(
        message.content
      )}

      <span class="message-time">
        ${hora}
      </span>

    `;


    contenedor.appendChild(
      div
    );


    scrollMensajes();

  }


  // ==========================================
  // ENVIAR
  // ==========================================

  document.getElementById(
    "sendButton"
  ).addEventListener(
    "click",
    enviarMensaje
  );


  document.getElementById(
    "messageInput"
  ).addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        enviarMensaje();

      }

    }
  );


  async function enviarMensaje() {

    const input =
      document.getElementById(
        "messageInput"
      );


    const contenido =
      input.value.trim();


    if (!contenido) {

      return;

    }


    if (!currentMatchId) {

      alert(
        "No se encontró el match."
      );

      return;

    }


    const boton =
      document.getElementById(
        "sendButton"
      );


    boton.disabled =
      true;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({

          match_id:
            currentMatchId,

          sender_id:
            currentUser.id,

          content:
            contenido

        })
        .select()
        .single();


    if (error) {

      console.error(error);

      alert(
        "No se pudo enviar el mensaje: " +
        error.message
      );

      boton.disabled =
        false;

      return;

    }


    input.value = "";


    mostrarMensaje(
      data
    );


    input.focus();


    boton.disabled =
      false;

  }


  // ==========================================
  // REALTIME
  // ==========================================

  function activarRealtime() {

    if (realtimeChannel) {

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }


    realtimeChannel =
      supabaseClient
        .channel(
          "chat-" +
          currentMatchId
        )
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter:
              "match_id=eq." +
              currentMatchId
          },
          function(payload) {

            mostrarMensaje(
              payload.new
            );

          }
        )
        .subscribe();

  }


  // ==========================================
  // SCROLL
  // ==========================================

  function scrollMensajes() {

    const contenedor =
      document.getElementById(
        "messages"
      );


    contenedor.scrollTop =
      contenedor.scrollHeight;

  }


  // ==========================================
  // SEGURIDAD
  // ==========================================

  function escapeHtml(
    texto
  ) {

    if (
      texto === null ||
      texto === undefined
    ) {

      return "";
    }


    return String(texto)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>

</body>
  </html>
