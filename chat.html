<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Mis Matches</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #102b5c);
      color: white;
      min-height: 100vh;
      padding-bottom: 95px;
    }

    header {
      text-align: center;
      padding: 25px 15px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #cbd5e1;
      margin: 8px 0;
    }

    .contenedor {
      width: 92%;
      max-width: 550px;
      margin: auto;
    }

    .acciones {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-descubrir {
      background: #d4af37;
      color: #07152f;
    }

    .btn-actualizar {
      background: #374151;
      color: white;
    }

    .cargando,
    .vacio,
    .error {
      margin-top: 20px;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      background: rgba(255,255,255,.08);
    }

    .error {
      border: 1px solid #ef4444;
      background: rgba(220,38,38,.15);
    }

    .match {
      background: white;
      color: #111;
      border-radius: 18px;
      margin-bottom: 14px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
    }

    .match:active {
      transform: scale(.98);
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      background: #d4af37;
      flex-shrink: 0;
    }

    .avatar-placeholder {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg,#d4af37,#f5e6a8);
      color: #07152f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }

    .datos {
      flex: 1;
      min-width: 0;
    }

    .nombre {
      font-size: 18px;
      font-weight: bold;
    }

    .ciudad {
      color: #666;
      font-size: 13px;
      margin-top: 4px;
    }

    .ultimo {
      color: #555;
      font-size: 14px;
      margin-top: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hora {
      color: #888;
      font-size: 11px;
      margin-top: 5px;
    }

    .flecha {
      font-size: 24px;
      color: #999;
    }

    .online {
      color: #16a34a;
      font-size: 12px;
      margin-top: 4px;
    }

    .badge {
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #e11d48;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      margin-left: auto;
    }

    .nav {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 65px;
      background: rgba(7,21,47,.97);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 900;
      box-shadow: 0 5px 25px rgba(0,0,0,.4);
    }

    .nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 10px;
      text-align: center;
    }

    .nav a span {
      display: block;
      font-size: 21px;
      margin-bottom: 2px;
    }

    .nav a.activo {
      color: #d4af37;
    }

    .nav-notificacion {
      position: relative;
    }

    .nav-badge {
      position: absolute;
      top: 2px;
      right: 7px;
      min-width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }

    .toast {
      position: fixed;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: white;
      padding: 13px 20px;
      border-radius: 12px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>

<body>

<header>
  <h1>💕 Mis Matches</h1>
  <p>Tus conexiones en EmiMatch</p>
</header>

<div class="contenedor">

  <div class="acciones">

    <button
      class="btn btn-descubrir"
      onclick="location.href='descubrir.html'"
    >
      🔎 Descubrir
    </button>

    <button
      class="btn btn-actualizar"
      id="btnActualizar"
    >
      🔄 Actualizar
    </button>

  </div>

  <div id="contenido">

    <div class="cargando">
      ⏳ Cargando tus Matches...
    </div>

  </div>

</div>

<div
  id="toast"
  class="toast"
></div>


<nav class="nav">

  <a href="perfil.html">
    <span>👤</span>
    Perfil
  </a>

  <a href="descubrir.html">
    <span>🔎</span>
    Descubrir
  </a>

  <a href="likes.html">
    <span>❤️</span>
    Me gustas
  </a>

  <a
    href="chat.html"
    class="activo"
  >
    <span>💕</span>
    Matches
  </a>

  <a
    href="notificaciones.html"
    class="nav-notificacion"
  >
    <span>🔔</span>
    Notificaciones
    <b
      id="navBadge"
      class="nav-badge"
    >0</b>
  </a>

</nav>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;

let matches = [];

let intervalo = null;


const contenido =
  document.getElementById(
    "contenido"
  );

const btnActualizar =
  document.getElementById(
    "btnActualizar"
  );

const toast =
  document.getElementById(
    "toast"
  );


// ==========================================
// INICIO
// ==========================================

document.addEventListener(
  "DOMContentLoaded",
  iniciar
);


async function iniciar() {

  try {

    contenido.innerHTML = `
      <div class="cargando">
        🔐 Verificando sesión...
      </div>
    `;

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    if (!data.session) {

      location.href =
        "index.html";

      return;

    }

    usuarioActual =
      data.session.user;

    await cargarMatches();

    await cargarBadge();

    iniciarRealtime();

    iniciarActualizacionAutomatica();

  } catch (error) {

    console.error(
      "Error:",
      error
    );

    mostrarError(
      "No se pudo cargar la sección Matches.",
      error
    );

  }

}


// ==========================================
// CARGAR MATCHES
// ==========================================

async function cargarMatches() {

  contenido.innerHTML = `
    <div class="cargando">
      🔎 Buscando tus Matches...
    </div>
  `;

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("matches")
        .select(`
          id,
          user1_id,
          user2_id,
          created_at
        `)
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );

    if (error) {
      throw error;
    }

    const lista =
      data || [];

    if (
      lista.length === 0
    ) {

      mostrarVacio();

      return;

    }


    const resultados = [];


    for (
      const match
      of lista
    ) {

      const otroUsuario =
        match.user1_id ===
        usuarioActual.id
          ? match.user2_id
          : match.user1_id;


      const perfil =
        await obtenerPerfil(
          otroUsuario
        );


      if (!perfil) {
        continue;
      }


      const ultimoMensaje =
        await obtenerUltimoMensaje(
          match.id
        );


      const noLeidos =
        await obtenerNoLeidos(
          match.id
        );


      resultados.push({

        match: match,

        perfil: perfil,

        ultimoMensaje:
          ultimoMensaje,

        noLeidos:
          noLeidos

      });

    }


    matches =
      resultados;


    // Ordenar por mensaje más reciente
    matches.sort(
      (a,b) => {

        const fechaA =
          a.ultimoMensaje
            ? new Date(
                a.ultimoMensaje.created_at
              ).getTime()
            : new Date(
                a.match.created_at
              ).getTime();

        const fechaB =
          b.ultimoMensaje
            ? new Date(
                b.ultimoMensaje.created_at
              ).getTime()
            : new Date(
                b.match.created_at
              ).getTime();

        return fechaB - fechaA;

      }
    );


    mostrarMatches();

  } catch (error) {

    console.error(
      "Error matches:",
      error
    );

    mostrarError(
      "No se pudieron cargar tus Matches.",
      error
    );

  }

}


// ==========================================
// PERFIL
// ==========================================

async function obtenerPerfil(
  userId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        nombre,
        edad,
        ciudad,
        foto_url,
        descripcion,
        intereses,
        online,
        last_seen
      `)
      .eq(
        "id",
        userId
      )
      .maybeSingle();

  if (error) {

    console.warn(
      "Perfil:",
      error
    );

    return null;

  }

  return data;

}


// ==========================================
// ÚLTIMO MENSAJE
// ==========================================

async function obtenerUltimoMensaje(
  matchId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(`
        id,
        content,
        sender_id,
        created_at,
        read_at,
        delivered_at
      `)
      .eq(
        "match_id",
        matchId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      )
      .limit(1)
      .maybeSingle();

  if (error) {

    console.warn(
      "Último mensaje:",
      error
    );

    return null;

  }

  return data;

}


// ==========================================
// NO LEÍDOS
// ==========================================

async function obtenerNoLeidos(
  matchId
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(
        "id"
      )
      .eq(
        "match_id",
        matchId
      )
      .neq(
        "sender_id",
        usuarioActual.id
      )
      .is(
        "read_at",
        null
      );

  if (error) {

    console.warn(
      "No leídos:",
      error
    );

    return 0;

  }

  return (
    data
      ? data.length
      : 0
  );

}


// ==========================================
// MOSTRAR MATCHES
// ==========================================

function mostrarMatches() {

  if (
    !matches ||
    matches.length === 0
  ) {

    mostrarVacio();

    return;

  }


  contenido.innerHTML = "";


  matches.forEach(
    item => {

      const perfil =
        item.perfil;

      const mensaje =
        item.ultimoMensaje;


      let fotoHTML;


      if (
        perfil.foto_url
      ) {

        fotoHTML = `

          <img
            class="avatar"
            src="${escapar(
              perfil.foto_url
            )}"
            alt="Foto"
            onerror="
              this.outerHTML =
              '<div class=&quot;avatar-placeholder&quot;>👤</div>'
            "
          >

        `;

      } else {

        fotoHTML = `

          <div class="avatar-placeholder">
            👤
          </div>

        `;

      }


      const nombre =
        `${escapar(
          perfil.nombre ||
          "Usuario"
        )}${
          perfil.edad
            ? ", " +
              escapar(
                perfil.edad
              )
            : ""
        }`;


      const ciudad =
        perfil.ciudad
          ? `📍 ${escapar(
              perfil.ciudad
            )}`
          : "";


      const estado =
        perfil.online
          ? `<div class="online">🟢 En línea</div>`
          : "";


      let textoMensaje =
        "💕 Nuevo Match";

      if (
        mensaje
      ) {

        textoMensaje =
          mensaje.sender_id ===
          usuarioActual.id
            ? `Vos: ${escapar(
                mensaje.content
              )}`
            : escapar(
                mensaje.content
              );

      }


      const hora =
        mensaje
          ? formatearFecha(
              mensaje.created_at
            )
          : formatearFecha(
              item.match.created_at
            );


      const badge =
        item.noLeidos > 0
          ? `
            <div class="badge">
              ${
                item.noLeidos > 9
                  ? "9+"
                  : item.noLeidos
              }
            </div>
          `
          : "";


      const elemento =
        document.createElement(
          "div"
        );


      elemento.className =
        "match";


      elemento.innerHTML = `

        ${fotoHTML}

        <div class="datos">

          <div class="nombre">
            ${nombre}
          </div>

          <div class="ciudad">
            ${ciudad}
          </div>

          ${estado}

          <div class="ultimo">
            ${textoMensaje}
          </div>

          <div class="hora">
            ${hora}
          </div>

        </div>

        ${badge}

        <div class="flecha">
          ›
        </div>

      `;


      elemento.addEventListener(
        "click",
        () => {

          location.href =
            `conversacion.html?user=${encodeURIComponent(
              perfil.id
            )}`;

        }
      );


      contenido.appendChild(
        elemento
      );

    }
  );

}


// ==========================================
// VACÍO
// ==========================================

function mostrarVacio() {

  contenido.innerHTML = `

    <div class="vacio">

      <div style="font-size:60px;">
        💕
      </div>

      <h2>
        Todavía no tenés Matches
      </h2>

      <p>
        Descubrí personas,
        enviá un ❤️ y esperá
        un Like de vuelta.
      </p>

      <button
        class="btn btn-descubrir"
        onclick="location.href='descubrir.html'"
      >
        🔎 Descubrir personas
      </button>

    </div>

  `;

}


// ==========================================
// ACTUALIZAR
// ==========================================

btnActualizar.addEventListener(
  "click",
  async () => {

    btnActualizar.disabled =
      true;

    btnActualizar.textContent =
      "⏳ Cargando...";

    await cargarMatches();

    await cargarBadge();

    btnActualizar.disabled =
      false;

    btnActualizar.textContent =
      "🔄 Actualizar";

  }
);


// ==========================================
// REALTIME
// ==========================================

function iniciarRealtime() {

  supabaseClient
    .channel(
      "chat-matches-" +
      usuarioActual.id
    )
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "messages"
      },
      async () => {

        await cargarMatches();

        await cargarBadge();

      }
    )
    .subscribe();

}


// ==========================================
// ACTUALIZACIÓN AUTOMÁTICA
// ==========================================

function iniciarActualizacionAutomatica() {

  if (intervalo) {
    clearInterval(
      intervalo
    );
  }

  intervalo =
    setInterval(
      async () => {

        await cargarMatches();

        await cargarBadge();

      },
      5000
    );

}


// ==========================================
// BADGE
// ==========================================

async function cargarBadge() {

  try {

    const {
      data: matches
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id"
        )
        .or(
          `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
        );


    if (
      !matches ||
      matches.length === 0
    ) {

      actualizarBadge(
        0
      );

      return;

    }


    const ids =
      matches.map(
        match =>
          match.id
      );


    const {
      data: mensajes,
      error
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id"
        )
        .in(
          "match_id",
          ids
        )
        .neq(
          "sender_id",
          usuarioActual.id
        )
        .is(
          "read_at",
          null
        );


    if (error) {

      actualizarBadge(
        0
      );

      return;

    }


    actualizarBadge(
      mensajes
        ? mensajes.length
        : 0
    );

  } catch (error) {

    console.warn(
      "Badge:",
      error
    );

  }

}


function actualizarBadge(
  cantidad
) {

  const badge =
    document.getElementById(
      "navBadge"
    );

  if (!badge) {
    return;
  }


  if (
    cantidad > 0
  ) {

    badge.textContent =
      cantidad > 9
        ? "9+"
        : cantidad;

    badge.style.display =
      "flex";

  } else {

    badge.style.display =
      "none";

  }

}


// ==========================================
// FECHA
// ==========================================

function formatearFecha(
  fecha
) {

  if (!fecha) {
    return "";
  }

  const date =
    new Date(
      fecha
    );

  const ahora =
    new Date();

  const diferencia =
    ahora.getTime() -
    date.getTime();


  const minutos =
    Math.floor(
      diferencia /
      60000
    );


  if (
    minutos < 1
  ) {
    return "Ahora";
  }


  if (
    minutos < 60
  ) {

    return (
      `Hace ${minutos} min`
    );

  }


  const horas =
    Math.floor(
      minutos / 60
    );


  if (
    horas < 24
  ) {

    return (
      `Hace ${horas} h`
    );

  }


  return date.toLocaleDateString(
    "es-AR",
    {
      day: "2-digit",
      month: "2-digit"
    }
  );

}


// ==========================================
// ERROR
// ==========================================

function mostrarError(
  mensaje,
  error
) {

  console.error(
    error
  );


  const detalle =
    error &&
    error.message
      ? error.message
      : "";


  contenido.innerHTML = `

    <div class="error">

      <div style="font-size:50px;">
        ⚠️
      </div>

      <h2>
        Ocurrió un problema
      </h2>

      <p>
        ${escapar(
          mensaje
        )}
      </p>

      ${
        detalle
          ? `
            <div style="
              font-size:12px;
              margin-top:12px;
              word-break:break-word;
              color:#fecaca;
            ">
              ${escapar(
                detalle
              )}
            </div>
          `
          : ""
      }


      <button
        class="btn btn-descubrir"
        style="margin-top:15px;"
        onclick="location.reload()"
      >
        🔄 Intentar nuevamente
      </button>

    </div>

  `;

}


// ==========================================
// SEGURIDAD HTML
// ==========================================

function escapar(
  valor
) {

  return String(
    valor ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
