<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EmiMatch - Mis Matches</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0b1020,#172554);
  color:#222;
  min-height:100vh;
}

.header{
  background:rgba(0,0,0,.3);
  color:white;
  padding:20px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:27px;
}

.header span{
  color:#ff4f9a;
}

.container{

  max-width:700px;
  margin:20px auto;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
  margin-bottom:20px;
}

.card h2{
  margin-top:0;
}

.match{

  align-items:center;
  gap:15px;
  padding:15px 5px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  transition:.2s;
}

.match:hover{
  background:#f7f7f7;
}

.match img{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  border:3px solid #ff4f9a;
}

.match-info{
  flex:1;
}

.match-info strong{
  display:block;
  font-size:18px;
  margin-bottom:5px;
}

.match-info span{
  color:#777;
  font-size:14px;
}

.match-icon{
  font-size:25px;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#777;
}

.loading{
  text-align:center;
  padding:25px;
  color:#777;
}

.error{
  background:#ffe8e8;
  color:#b00020;
  padding:14px;
  border-radius:10px;
  margin-top:15px;
  word-break:break-word;
}

.btn{
  display:block;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#111b3a;
  color:white;
  text-decoration:none;
  text-align:center;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}

#chatSection{
  display:none;
}

.chat-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.chat-header img{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff4f9a;
}

.chat-header h2{
  margin:0;
  font-size:21px;
}

.chat-header p{
  margin:5px 0 0;
  color:#777;
  font-size:14px;
}

#messages{
  height:420px;
  overflow-y:auto;
  background:#f1f3f8;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

.message{
  max-width:80%;
  padding:10px 13px;
  margin-bottom:10px;
  border-radius:15px;
  word-wrap:break-word;
  clear:both;
}

.mine{
  background:#111b3a;
  color:white;
  float:right;
  border-bottom-right-radius:4px;
}

.theirs{
  background:white;
  color:#222;
  float:left;
  border-bottom-left-radius:4px;
}

.message-time{
  display:block;
  font-size:10px;
  opacity:.7;
  margin-top:4px;
}

.input-area{
  display:flex;
  gap:8px;
}

#messageInput{
  flex:1;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

#sendButton{
  width:90px;
  border:none;
  border-radius:10px;
  background:#ff4f9a;
  color:white;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

#sendButton:disabled{
  opacity:.5;
}

</style>
</head>
