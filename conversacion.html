      );

    }

      data: sessionData,

    .from("profiles")
    .select(

      "No se encontró el perfil."

      : "";


  if (profile.foto_url) {

    document.getElementById(
      "profilePhoto"
    ).src =
      profile.foto_url;

  }

}
