<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Conversación</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #071a3d, #123b78);
      color: white;
      padding: 18px;
      text-align: center;
    }

    .caja {
      background: white;
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.1);
      text-align: center;
    }

    .foto {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      margin-bottom: 15px;
    }

    .nombre {
      font-size: 24px;
      font-weight: bold;
    }

    .datos {
      margin-top: 8px;
      color: #666;
    }

    .descripcion {
      margin-top: 20px;
      line-height: 1.5;
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

    .id {
      margin-top: 20px;
      background: #f0f2f5;
      padding: 10px;
      border-radius: 8px;
      word-break: break-all;
      font-size: 12px;
      color: #777;
    }

    .volver {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 18px;
      background: #123b78;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>💕 EmiMatch</h1>
  <div>Conversación</div>
</header>

<div class="caja">

  <p id="estado">
    🔄 Cargando perfil...
  </p>

  <img
    id="foto"
    class="foto"
    src="https://via.placeholder.com/110"
    alt="Foto de perfil"
  >

  <div
    id="nombre"
    class="nombre">
  </div>

  <div
    id="datos"
    class="datos">
  </div>

  <div
    id="descripcion"
    class="descripcion">
  </div>

  <div
    id="idUsuario"
    class="id">
  </div>

  <a
    href="./chat.html"
    class="volver">
    ← Volver a Matches
  </a>

</div>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function cargarPerfil() {

  const estado =
    document.getElementById("estado");


  try {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const otherUserId =
      params.get("user");


    if (!otherUserId) {

      throw new Error(
        "No se recibió el usuario del Match."
      );

    }


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (sessionError) {
      throw sessionError;
    }


    if (!sessionData.session) {

      throw new Error(
        "No hay una sesión activa."
      );

    }


    estado.textContent =
      "🔄 Buscando perfil...";


    const {
      data: perfil,
      error
    } =
      await supabaseClient

        .from("profiles")

        .select(
          "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
        )

        .eq("id", otherUserId)

        .maybeSingle();


    if (error) {
      throw error;
    }


    if (!perfil) {

      throw new Error(
        "No se encontró el perfil del usuario."
      );

    }


    document.getElementById("nombre")
      .textContent =
        perfil.nombre || "Usuario";


    let datos = "";


    if (perfil.edad) {

      datos +=
        perfil.edad + " años";

    }


    if (perfil.ciudad) {

      if (datos) {
        datos += " • ";
      }

      datos += perfil.ciudad;

    }


    document.getElementById("datos")
      .textContent =
        datos;


    document.getElementById("descripcion")
      .textContent =
        perfil.descripcion ||
        "Sin descripción";


    document.getElementById("idUsuario")
      .textContent =
        "ID: " + perfil.id;


    if (perfil.foto_url) {

      document.getElementById("foto")
        .src =
        perfil.foto_url;

    }


    estado.textContent =
      "✅ Perfil cargado correctamente.";

    estado.className =
      "ok";


  } catch (error) {

    console.error(error);

    estado.textContent =
      "❌ " + error.message;

    estado.className =
      "error";

  }

}


cargarPerfil();

</script>

</body>
</html>
