<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conversación - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
    }

    .app {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111b3d;
      color: white;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .volver {
      border: none;
      background: transparent;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    .foto-header {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .datos-header {
      flex: 1;
      min-width: 0;
    }

    .nombre {
      font-size: 17px;
      font-weight: bold;
    }

    .estado {
      font-size: 12px;
      margin-top: 3px;
      color: #b9c2d9;
    }

    .estado.online {
      color: #55e68a;
    }

    #mensajes {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #eef1f7;
      min-height: calc(100vh - 130px);
    }

    .cargando {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    .mensaje {
      display: flex;
      margin-bottom: 10px;
    }

    .mensaje.mio {
      justify-content: flex-end;
    }

    .mensaje.otro {
      justify-content: flex-start;
    }

    .burbuja {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .mio .burbuja {
      background: #111b3d;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .otro .burbuja {
      background: white;
      color: #222;
      border-bottom-left-radius: 5px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .hora {
      display: block;
      font-size: 10px;
      margin-top: 4px;
      opacity: .65;
      text-align: right;
    }

    .check {
      font-size: 11px;
      margin-left: 4px;
    }

    .check.leido {
      color: #4da6ff;
    }

    .escribiendo {
      height: 20px;
      padding-left: 15px;
      font-size: 12px;
      color: #777;
      background: #eef1f7;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      position: sticky;
      bottom: 0;
    }

    #mensajeInput {
      flex: 1;
      border: 1px solid #ccd2df;
      border-radius: 22px;
      padding: 12px 15px;
      font-size: 15px;
      outline: none;
    }

    #mensajeInput:focus {
      border-color: #111b3d;
    }

    #btnEnviar {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #111b3d;
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    #btnEnviar:disabled {
      opacity: .5;
    }

    .error {
      color: #c62828;
      background: #ffebee;
      padding: 15px;
      margin: 20px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">

    <button class="volver" onclick="volver()">‹</button>

    <img
      id="fotoPerfil"
      class="foto-header"
      src=""
      alt="Foto"
    >

    <div class="datos-header">

      <div
        id="nombrePerfil"
        class="nombre"
      >
        Cargando...
      </div>

      <div
        id="estadoPerfil"
        class="estado"
      >
        Conectando...
      </div>

    </div>

  </div>


  <div id="mensajes">

    <div class="cargando">
      Cargando conversación...
    </div>

  </div>


  <div
    id="escribiendo"
    class="escribiendo"
  ></div>


  <div class="input-area">

    <input
      id="mensajeInput"
      type="text"
      placeholder="Escribí un mensaje..."
      autocomplete="off"
    >

    <button
      id="btnEnviar"
      onclick="enviarMensaje()"
    >
      ➤
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;
let otroUsuario = null;
let matchActual = null;
let canalMensajes = null;
let canalTyping = null;
let canalPerfil = null;

let escribiendoTimer = null;


/* =========================
   INICIO
========================= */

async function iniciar() {

  try {

    console.log("EMIMATCH: iniciando conversación...");

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    if (!data.session) {

      console.log("No hay sesión.");

      window.location.href = "./index.html";

      return;
    }

    usuarioActual =
      data.session.user;

    console.log(
      "Usuario actual:",
      usuarioActual.id
    );


    const parametros =
      new URLSearchParams(
        window.location.search
      );

    otroUsuario =
      parametros.get("user");


    console.log(
      "Usuario de la conversación:",
      otroUsuario
    );


    if (!otroUsuario) {

      mostrarError(
        "No se encontró el usuario de la conversación."
      );

      return;
    }


    await cargarPerfil();

    await buscarMatch();

    if (!matchActual) {

      mostrarError(
        "No se encontró el match entre estos usuarios."
      );

      return;
    }


    await cargarMensajes();

    await marcarMensajesEntregados();

    await marcarMensajesLeidos();

    prepararInput();

    escucharMensajes();

    escucharTyping();

    escucharEstado();

    desplazarAbajo();


    console.log(
      "CONVERSACIÓN CARGADA CORRECTAMENTE"
    );

  } catch (error) {

    console.error(
      "Error al iniciar:",
      error
    );

    mostrarError(
      "Error al cargar la conversación: " +
      (error.message || error)
    );

  }

}


/* =========================
   PERFIL
========================= */

async function cargarPerfil() {

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nombre,edad,ciudad,descripcion,foto_url,intereses,online,last_seen"
      )
      .eq("id", otroUsuario)
      .maybeSingle();


  if (error) {

    console.error(
      "Error perfil:",
      error
    );

    throw error;
  }


  if (!data) {

    throw new Error(
      "No se encontró el perfil."
    );

  }


  console.log(
    "Perfil cargado:",
    data
  );


  const nombre =
    data.nombre ||
    "Usuario";


  document.getElementById(
    "nombrePerfil"
  ).textContent =
    data.edad
      ? nombre + ", " + data.edad
      : nombre;


  const foto =
    document.getElementById(
      "fotoPerfil"
    );


  if (data.foto_url) {

    foto.src =
      data.foto_url;

  } else {

    foto.src =
      "https://placehold.co/100x100?text=Foto";

  }


  mostrarEstado(data);

}


/* =========================
   ESTADO ONLINE
========================= */

function mostrarEstado(data) {

  const elemento =
    document.getElementById(
      "estadoPerfil"
    );


  if (data.online === true) {

    elemento.textContent =
      "🟢 En línea";

    elemento.classList.add(
      "online"
    );

    return;
  }


  elemento.classList.remove(
    "online"
  );


  if (data.last_seen) {

    const fecha =
      new Date(
        data.last_seen
      );


    elemento.textContent =
      "Última vez " +
      formatearUltimaConexion(
        fecha
      );

  } else {

    elemento.textContent =
      "Desconectado";

  }

}


function formatearUltimaConexion(fecha) {

  if (
    isNaN(
      fecha.getTime()
    )
  ) {

    return "hace un momento";

  }


  return fecha.toLocaleString(
    "es-AR",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =========================
   BUSCAR MATCH
========================= */

async function buscarMatch() {

  console.log(
    "Buscando match..."
  );


  let resultado =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id,created_at"
      )
      .eq(
        "user1_id",
        usuarioActual.id
      )
      .eq(
        "user2_id",
        otroUsuario
      )
      .maybeSingle();


  if (
    resultado.error
  ) {

    console.error(
      "Error buscando match 1:",
      resultado.error
    );

    throw resultado.error;

  }


  if (resultado.data) {

    matchActual =
      resultado.data;

    console.log(
      "Match encontrado:",
      matchActual
    );

    return;
  }


  resultado =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id,created_at"
      )
      .eq(
        "user1_id",
        otroUsuario
      )
      .eq(
        "user2_id",
        usuarioActual.id
      )
      .maybeSingle();


  if (
    resultado.error
  ) {

    console.error(
      "Error buscando match 2:",
      resultado.error
    );

    throw resultado.error;

  }


  if (resultado.data) {

    matchActual =
      resultado.data;

    console.log(
      "Match encontrado:",
      matchActual
    );

  }

}


/* =========================
   CARGAR MENSAJES
========================= */

async function cargarMensajes() {

  if (!matchActual) {
    return;
  }


  const { data, error } =
    await supabaseClient
      .from("messages")
      .select(
        "id,match_id,sender_id,content,created_at,delivered_at,read_at"
      )
      .eq(
        "match_id",
        matchActual.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Error cargando mensajes:",
      error
    );

    throw error;
  }


  console.log(
    "Mensajes cargados:",
    data
      ? data.length
      : 0
  );


  const contenedor =
    document.getElementById(
      "mensajes"
    );


  contenedor.innerHTML = "";


  if (
    !data ||
    data.length === 0
  ) {

    contenedor.innerHTML = `
      <div class="cargando">
        No hay mensajes todavía.<br>
        ¡Comenzá la conversación! 💬
      </div>
    `;

    return;
  }


  data.forEach(
    mostrarMensaje
  );


  desplazarAbajo();

}


/* =========================
   MOSTRAR MENSAJE
========================= */

function mostrarMensaje(mensaje) {

  const contenedor =
    document.getElementById(
      "mensajes"
    );


  const esMio =
    mensaje.sender_id ===
    usuarioActual.id;


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "mensaje " +
    (
      esMio
        ? "mio"
        : "otro"
    );


  const burbuja =
    document.createElement(
      "div"
    );


  burbuja.className =
    "burbuja";


  const texto =
    escapeHTML(
      mensaje.content
    );


  const hora =
    new Date(
      mensaje.created_at
    ).toLocaleTimeString(
      "es-AR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  let checks = "";


  if (esMio) {

    if (mensaje.read_at) {

      checks =
        `<span class="check leido">✓✓</span>`;

    } else if (
      mensaje.delivered_at
    ) {

      checks =
        `<span class="check">✓✓</span>`;

    } else {

      checks =
        `<span class="check">✓</span>`;

    }

  }


  burbuja.innerHTML = `
    ${texto}
    <span class="hora">
      ${hora}
      ${checks}
    </span>
  `;


  div.appendChild(
    burbuja
  );


  contenedor.appendChild(
    div
  );

}


/* =========================
   ENVIAR MENSAJE
========================= */

async function enviarMensaje() {

  const input =
    document.getElementById(
      "mensajeInput"
    );

  const boton =
    document.getElementById(
      "btnEnviar"
    );


  const contenido =
    input.value.trim();


  if (!contenido) {
    return;
  }


  if (!matchActual) {

    alert(
      "Todavía no se cargó el match."
    );

    return;
  }


  boton.disabled = true;


  try {

    const { data, error } =
      await supabaseClient
        .from("messages")
        .insert({
          match_id:
            matchActual.id,

          sender_id:
            usuarioActual.id,

          content:
            contenido
        })
        .select()
        .single();


    if (error) {

      console.error(
        "Error enviando:",
        error
      );

      throw error;
    }


    console.log(
      "Mensaje enviado:",
      data
    );


    input.value = "";


    await actualizarTyping(
      false
    );


    if (data) {

      const existente =
        document.querySelector(
          `[data-message-id="${data.id}"]`
        );


      if (!existente) {

        mostrarMensaje(data);

        desplazarAbajo();

      }

    }

  } catch (error) {

    console.error(
      error
    );

    alert(
      "No se pudo enviar el mensaje."
    );

  } finally {

    boton.disabled = false;

    input.focus();

  }

}


/* =========================
   MENSAJES ENTREGADOS
========================= */

async function marcarMensajesEntregados() {

  if (!matchActual) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("messages")
      .update({
        delivered_at:
          new Date().toISOString()
      })
      .eq(
        "match_id",
        matchActual.id
      )
      .eq(
        "sender_id",
        otroUsuario
      )
      .is(
        "delivered_at",
        null
      );


  if (error) {

    console.warn(
      "No se pudieron marcar como entregados:",
      error
    );

  }

}


/* =========================
   MENSAJES LEÍDOS
========================= */

async function marcarMensajesLeidos() {

  if (!matchActual) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("messages")
      .update({
        read_at:
          new Date().toISOString()
      })
      .eq(
        "match_id",
        matchActual.id
      )
      .eq(
        "sender_id",
        otroUsuario
      )
      .is(
        "read_at",
        null
      );


  if (error) {

    console.warn(
      "No se pudieron marcar como leídos:",
      error
    );

  }

}


/* =========================
   REALTIME MENSAJES
========================= */

function escucharMensajes() {

  if (!matchActual) {
    return;
  }


  canalMensajes =
    supabaseClient
      .channel(
        "mensajes-" +
        matchActual.id
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "messages",
          filter:
            "match_id=eq." +
            matchActual.id
        },
        async payload => {

          console.log(
            "Realtime mensaje:",
            payload
          );


          if (
            payload.eventType ===
            "INSERT"
          ) {

            const mensaje =
              payload.new;


            mostrarMensaje(
              mensaje
            );


            desplazarAbajo();


            if (
              mensaje.sender_id ===
              otroUsuario
            ) {

              await marcarMensajesEntregados();

              await marcarMensajesLeidos();

            }

          }


          if (
            payload.eventType ===
            "UPDATE"
          ) {

            await cargarMensajes();

          }

        }
      )
      .subscribe();

}


/* =========================
   INPUT
========================= */

function prepararInput() {

  const input =
    document.getElementById(
      "mensajeInput"
    );


  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        enviarMensaje();

      }

    }
  );


  input.addEventListener(
    "input",
    manejarEscritura
  );

}


/* =========================
   ESCRIBIENDO
========================= */

async function manejarEscritura() {

  const input =
    document.getElementById(
      "mensajeInput"
    );


  const escribiendo =
    input.value.length > 0;


  await actualizarTyping(
    escribiendo
  );


  clearTimeout(
    escribiendoTimer
  );


  escribiendoTimer =
    setTimeout(
      () => {
        actualizarTyping(
          false
        );
      },
      1500
    );

}


async function actualizarTyping(
  escribiendo
) {

  if (
    !matchActual ||
    !usuarioActual
  ) {

    return;

  }


  const { error } =
    await supabaseClient
      .from("typing_status")
      .upsert(
        {
          match_id:
            matchActual.id,

          user_id:
            usuarioActual.id,

          is_typing:
            escribiendo,

          updated_at:
            new Date().toISOString()
        },
        {
          onConflict:
            "match_id,user_id"
        }
      );


  if (error) {

    console.warn(
      "Error typing:",
      error
    );

  }

}


/* =========================
   REALTIME TYPING
========================= */

function escucharTyping() {

  if (!matchActual) {
    return;
  }


  canalTyping =
    supabaseClient
      .channel(
        "typing-" +
        matchActual.id
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "typing_status",
          filter:
            "match_id=eq." +
            matchActual.id
        },
        payload => {

          const datos =
            payload.new;


          if (
            !datos ||
            datos.user_id !==
            otroUsuario
          ) {

            return;

          }


          const elemento =
            document.getElementById(
              "escribiendo"
            );


          if (
            datos.is_typing ===
            true
          ) {

            elemento.textContent =
              "✍️ Está escribiendo...";

          } else {

            elemento.textContent =
              "";

          }

        }
      )
      .subscribe();

}


/* =========================
   REALTIME ESTADO
========================= */

function escucharEstado() {

  canalPerfil =
    supabaseClient
      .channel(
        "perfil-" +
        otroUsuario
      )
      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "profiles",
          filter:
            "id=eq." +
            otroUsuario
        },
        payload => {

          console.log(
            "Estado actualizado:",
            payload.new
          );


          mostrarEstado(
            payload.new
          );

        }
      )
      .subscribe();

}


/* =========================
   DESPLAZAR ABAJO
========================= */

function desplazarAbajo() {

  setTimeout(
    () => {

      const contenedor =
        document.getElementById(
          "mensajes"
        );


      contenedor.scrollTop =
        contenedor.scrollHeight;

    },
    100
  );

}


/* =========================
   ESCAPAR HTML
========================= */

function escapeHTML(texto) {

  const
