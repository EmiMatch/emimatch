<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Match</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      text-align: center;
    }

    .header {
      background: linear-gradient(135deg, #071a3d, #123b78);
      color: white;
      padding: 20px;
    }

    .caja {
      background: white;
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.1);
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

    .dato {
      margin-top: 20px;
      background: #f1f3f6;
      padding: 15px;
      border-radius: 10px;
      word-break: break-all;
      font-size: 13px;
    }

    button {
      margin-top: 20px;
      background: #123b78;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>💕 EmiMatch</h1>
  <div>Conversación</div>
</div>

<div class="caja">

  <h2>💕 Comprobando Match</h2>

  <p id="estado">
    🔄 Buscando Match...
  </p>

  <div id="datos" class="dato"></div>

  <button onclick="volver()">
    ← Volver a Matches
  </button>

</div>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function comprobarMatch() {

  const estado =
    document.getElementById("estado");

  const datos =
    document.getElementById("datos");


  try {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const otherUserId =
      params.get("user");


    if (!otherUserId) {

      throw new Error(
        "No se recibió el usuario del Match."
      );

    }


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (sessionError) {
      throw sessionError;
    }


    if (!sessionData.session) {

      throw new Error(
        "No hay una sesión activa."
      );

    }


    const currentUserId =
      sessionData.session.user.id;


    estado.textContent =
      "🔄 Buscando Match entre los dos usuarios...";


    /*
      PRIMERA POSIBILIDAD
      usuario actual → otro usuario
    */

    const {
      data: match1,
      error: error1
    } =
      await supabaseClient

        .from("matches")

        .select("*")

        .eq("user1_id", currentUserId)

        .eq("user2_id", otherUserId)

        .maybeSingle();


    if (error1) {
      throw error1;
    }


    if (match1) {

      mostrarMatch(
        match1,
        currentUserId,
        otherUserId
      );

      return;

    }


    /*
      SEGUNDA POSIBILIDAD
      otro usuario → usuario actual
    */

    const {
      data: match2,
      error: error2
    } =
      await supabaseClient

        .from("matches")

        .select("*")

        .eq("user1_id", otherUserId)

        .eq("user2_id", currentUserId)

        .maybeSingle();


    if (error2) {
      throw error2;
    }


    if (match2) {

      mostrarMatch(
        match2,
        currentUserId,
        otherUserId
      );

      return;

    }


    throw new Error(
      "No encontramos un Match entre estos usuarios."
    );


  } catch (error) {

    console.error(error);

    estado.textContent =
      "❌ " + error.message;

    estado.className =
      "error";

  }

}


function mostrarMatch(
  match,
  currentUserId,
  otherUserId
) {

  document.getElementById("estado")
    .textContent =
      "💕 ¡MATCH ENCONTRADO!";

  document.getElementById("estado")
    .className =
      "ok";


  document.getElementById("datos")
    .innerHTML =

      "<strong>ID del Match:</strong><br>" +
      match.id +

      "<br><br>" +

      "<strong>Tu usuario:</strong><br>" +
      currentUserId +

      "<br><br>" +

      "<strong>Otro usuario:</strong><br>" +
      otherUserId;

}


function volver() {

  window.location.href =
    "./chat.html";

}


comprobarMatch();

</script>

</body>
</html>
