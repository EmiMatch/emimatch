<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmiMatch - Conversación</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f9;
}

.app{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  background:white;
  display:flex;
  flex-direction:column;
}

.header{
  height:70px;
  background:#071b49;
  color:white;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
}

.back{
  border:0;
  background:none;
  color:white;
  font-size:32px;
  cursor:pointer;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.info{
  flex:1;
}

.name{
  font-size:18px;
  font-weight:bold;
}

.status{
  font-size:12px;
  margin-top:4px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px 12px 90px;
}

.loading{
  text-align:center;
  color:#777;
  padding:30px;
}

.error{
  margin:20px;
  padding:15px;
  background:#ffe5e5;
  color:#a00000;
  border-radius:10px;
}

.row{
  display:flex;
  margin:7px 0;
}

.mine{
  justify-content:flex-end;
}

.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:17px;
  word-wrap:break-word;
  white-space:pre-wrap;
}

.mine .bubble{
  background:#123b80;
  color:white;
  border-bottom-right-radius:5px;
}

.theirs .bubble{
  background:#eee;
  color:#222;
  border-bottom-left-radius:5px;
}

.time{
  font-size:9px;
  opacity:.7;
  text-align:right;
  margin-top:4px;
}

.read{
  color:#62d8ff;
}

.typing{
  height:25px;
  padding:0 15px;
  color:#777;
  font-size:12px;
  font-style:italic;
}

.input{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(700px,100%);
  background:white;
  border-top:1px solid #ddd;
  padding:9px;
  display:flex;
  gap:8px;
  z-index:10;
}

.input input{
  flex:1;
  border:1px solid #ccc;
  border-radius:25px;
  padding:12px 15px;
  font-size:15px;
  outline:none;
}

.input input:focus{
  border-color:#123b80;
}

.input button{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#123b80;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.input button:disabled{
  opacity:.5;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <button
      class="back"
      onclick="location.href='chat.html'">
      ‹
    </button>

    <img
      id="foto"
      class="avatar"
      src="https://via.placeholder.com/100">

    <div class="info">

      <div
        id="nombre"
        class="name">
        Cargando...
      </div>

      <div
        id="estado"
        class="status">
        Conectando...
      </div>

    </div>

  </div>


  <div
    id="mensajes"
    class="messages">

    <div class="loading">
      Cargando conversación...
    </div>

  </div>


  <div
    id="typing"
    class="typing">
  </div>


  <div class="input">

    <input
      id="texto"
      type="text"
      placeholder="Escribí un mensaje..."
      autocomplete="off">

    <button
      id="botonEnviar"
      onclick="enviar()">
      ➤
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let yo = null;
let otro = null;
let match = null;

let typingTimer = null;


const params =
new URLSearchParams(location.search);

otro = params.get("user");


function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function mostrarError(mensaje){

  document.getElementById("mensajes").innerHTML =
  `<div class="error">
    ⚠️ ${escapeHTML(mensaje)}
  </div>`;

}


async function iniciar(){

  try{

    if(!otro){

      mostrarError(
        "No se recibió el usuario."
      );

      return;
    }


    /* SESIÓN */

    const {
      data:sessionData,
      error:sessionError
    } =
    await supabaseClient.auth.getSession();


    if(sessionError){

      mostrarError(
        sessionError.message
      );

      return;
    }


    yo =
    sessionData.session?.user;


    if(!yo){

      mostrarError(
        "No hay una sesión iniciada."
      );

      return;
    }


    /* PERFIL DEL OTRO USUARIO */

    const {
      data:perfil,
      error:perfilError
    } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",otro)
      .maybeSingle();


    if(perfilError){

      mostrarError(
        "Error del perfil: " +
        perfilError.message
      );

      return;
    }


    if(!perfil){

      mostrarError(
        "No se encontró el perfil."
      );

      return;
    }


    document.getElementById("nombre")
      .textContent =
      perfil.nombre || "Usuario";


    if(perfil.foto_url){

      document.getElementById("foto").src =
      perfil.foto_url;

    }


    actualizarEstado(perfil);


    /* BUSCAR MATCH */

    const {
      data:matches,
      error:matchError
    } =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id"
      )
      .or(
        "and(user1_id.eq." +
        yo.id +
        ",user2_id.eq." +
        otro +
        "),and(user1_id.eq." +
        otro +
        ",user2_id.eq." +
        yo.id +
        ")"
      )
      .limit(1);


    if(matchError){

      mostrarError(
        "Error buscando match: " +
        matchError.message
      );

      return;
    }


    if(!matches || matches.length === 0){

      mostrarError(
        "No existe un match entre estas cuentas."
      );

      return;
    }


    match = matches[0];


    /* CARGAR MENSAJES */

    await cargar();


    /* CREAR ESTADO DE TYPING */

    await prepararTyping();


    /* TIEMPO REAL */

    iniciarRealtime();


  }catch(e){

    mostrarError(
      "Error inesperado: " +
      e.message
    );

  }

}


/* ESTADO DEL PERFIL */

function actualizarEstado(perfil){

  const estado =
  document.getElementById("estado");


  if(perfil.online){

    estado.textContent =
    "🟢 En línea";

  }else{

    if(perfil.last_seen){

      const fecha =
      new Date(perfil.last_seen);

      estado.textContent =
      "Última vez " +
      fecha.toLocaleString(
        "es-AR",
        {
          day:"2-digit",
          month:"2-digit",
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    }else{

      estado.textContent =
      "Desconectado";

    }

  }

}


/* CARGAR MENSAJES */

async function cargar(){

  if(!match || !yo) return;


  const {
    data,
    error:msgError
  } =
  await supabaseClient
    .from("messages")
    .select(
      "id,sender_id,content,created_at,read_at,delivered_at"
    )
    .eq(
      "match_id",
      match.id
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(msgError){

    mostrarError(
      "Error cargando mensajes: " +
      msgError.message
    );

    return;
  }


  const contenedor =
  document.getElementById("mensajes");


  contenedor.innerHTML = "";


  if(!data || data.length === 0){

    contenedor.innerHTML =
    `<div class="loading">
      💕 Todavía no hay mensajes.<br>
      ¡Empezá la conversación!
    </div>`;

    return;

  }


  data.forEach(m => {

    const mio =
    m.sender_id === yo.id;


    const row =
    document.createElement("div");

    row.className =
    "row " +
    (mio
      ? "mine"
      : "theirs");


    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble";


    const hora =
    new Date(
      m.created_at
    ).toLocaleTimeString(
      "es-AR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


    let estadoMensaje = "";


    if(mio){

      if(m.read_at){

        estadoMensaje =
        `<span class="read">✓✓</span>`;

      }else if(m.delivered_at){

        estadoMensaje =
        `<span>✓✓</span>`;

      }else{

        estadoMensaje =
        `<span>✓</span>`;

      }

    }


    bubble.innerHTML =
      escapeHTML(m.content) +
      `<div class="time">
        ${hora}
        ${estadoMensaje}
      </div>`;


    row.appendChild(bubble);

    contenedor.appendChild(row);

  });


  contenedor.scrollTop =
  contenedor.scrollHeight;


  /* MARCAR MENSAJES RECIBIDOS COMO ENTREGADOS */

  const recibidos =
  data.filter(
    m =>
    m.sender_id !== yo.id &&
    !m.delivered_at
  );


  for(const m of recibidos){

    await supabaseClient
      .from("messages")
      .update({
        delivered_at:
        new Date().toISOString()
      })
      .eq(
        "id",
        m.id
      );

  }


  /* MARCAR COMO LEÍDOS */

  const noLeidos =
  data.filter(
    m =>
    m.sender_id !== yo.id &&
    !m.read_at
  );


  for(const m of noLeidos){

    await supabaseClient
      .from("messages")
      .update({
        read_at:
        new Date().toISOString()
      })
      .eq(
        "id",
        m.id
      );

  }

}


/* ENVIAR MENSAJE */

async function enviar(){

  const input =
  document.getElementById("texto");

  const boton =
  document.getElementById("botonEnviar");


  const contenido =
  input.value.trim();


  if(!contenido) return;


  if(!match){

    alert(
      "El match todavía no está cargado."
    );

    return;
  }


  boton.disabled = true;


  const {
    error:sendError
  } =
  await supabaseClient
    .from("messages")
    .insert({

      match_id:
      match.id,

      sender_id:
      yo.id,

      content:
      contenido,

      delivered_at:
      new Date().toISOString()

    });


  boton.disabled = false;


  if(sendError){

    alert(
      "No se pudo enviar:\n\n" +
      sendError.message
    );

    return;
  }


  input.value = "";


  await actualizarTyping(false);

  await cargar();

}


/* TYPING */

async function prepararTyping(){

  if(!match || !yo) return;


  const {
    error
  } =
  await supabaseClient
    .from("typing_status")
    .upsert(
      {
        match_id:match.id,
        user_id:yo.id,
        is_typing:false,
        updated_at:
        new Date().toISOString()
      },
      {
        onConflict:
        "match_id,user_id"
      }
    );


  if(error){

    console.log(
      "Typing:",
      error.message
    );

  }

}


async function actualizarTyping(valor){

  if(!match || !yo) return;


  await supabaseClient
    .from("typing_status")
    .upsert(
      {
        match_id:match.id,
        user_id:yo.id,
        is_typing:valor,
        updated_at:
        new Date().toISOString()
      },
      {
        onConflict:
        "match_id,user_id"
      }
    );

}


async function comprobarTyping(){

  if(!match || !yo) return;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("typing_status")
    .select(
      "is_typing,updated_at"
    )
    .eq(
      "match_id",
      match.id
    )
    .eq(
      "user_id",
      otro
    )
    .maybeSingle();


  if(error) return;


  const elemento =
  document.getElementById("typing");


  if(
    data &&
    data.is_typing &&
    data.updated_at
  ){

    const diferencia =
    Date.now() -
    new Date(
      data.updated_at
    ).getTime();


    if(diferencia < 5000){

      elemento.textContent =
      "✍️ Está escribiendo...";

      return;

    }

  }


  elemento.textContent = "";

}


/* INPUT TYPING */

document
.getElementById("texto")
.addEventListener(
  "input",
  async function(){

    await actualizarTyping(
      this.value.trim().length > 0
    );


    clearTimeout(
      typingTimer
    );


    typingTimer =
    setTimeout(
      async function(){

        await actualizarTyping(false);

      },
      2500
    );

  }
);


/* ENTER */

document
.getElementById("texto")
.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      enviar();

    }

  }
);


/* REALTIME */

function iniciarRealtime(){

  supabaseClient
    .channel(
      "chat-" + match.id
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"messages",
        filter:
        "match_id=eq." +
        match.id
      },
      async function(){

        await cargar();

      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"typing_status",
        filter:
        "match_id=eq." +
        match.id
      },
      async function(){

        await comprobarTyping();

      }
    )

    .subscribe();


  /* RESPALDO POR CONSULTA */

  setInterval(
    async function(){

      await cargar();

      await comprobarTyping();

    },
    3000
  );

}


/* INICIO */

iniciar();

</script>

</body>
</html>
