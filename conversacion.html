<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EmiMatch - Conversación</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f7;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:70px;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  color:white;
  display:flex;
  align-items:center;
  padding:10px 15px;
  gap:12px;
}

.btn-volver{
  border:0;
  background:rgba(255,255,255,.2);
  color:white;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:22px;
  cursor:pointer;
}

.foto{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.info{
  flex:1;
}

.nombre{
  font-size:18px;
  font-weight:bold;
}

.estado{
  font-size:13px;
  opacity:.9;
  margin-top:3px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:18px 12px 90px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.mensaje{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  font-size:15px;
  line-height:1.4;
  word-wrap:break-word;
}

.mio{
  align-self:flex-end;
  background:#7c3aed;
  color:white;
  border-bottom-right-radius:5px;
}

.otro{
  align-self:flex-start;
  background:white;
  color:#222;
  border-bottom-left-radius:5px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.hora{
  font-size:10px;
  opacity:.65;
  margin-top:4px;
  text-align:right;
}

.check{
  margin-left:4px;
}

.escribiendo{
  position:fixed;
  bottom:65px;
  left:15px;
  font-size:13px;
  color:#777;
  display:none;
}

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px;
  display:flex;
  gap:8px;
  border-top:1px solid #ddd;
}

.input{
  flex:1;
  border:1px solid #ddd;
  border-radius:25px;
  padding:12px 16px;
  font-size:15px;
  outline:none;
}

.input:focus{
  border-color:#8b5cf6;
}

.enviar{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#7c3aed;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.vacio{
  text-align:center;
  color:#888;
  margin:auto;
}

.error{
  color:#dc2626;
  text-align:center;
  padding:20px;
}

</style>
</head>

<body>

<header>

<button class="btn-volver" onclick="history.back()">‹</button>

<img id="foto" class="foto"
     src="https://via.placeholder.com/100">

<div class="info">

<div id="nombre" class="nombre">
Cargando...
</div>

<div id="estado" class="estado">
Conectando...
</div>

</div>

</header>


<div id="chat" class="chat">

<div class="vacio">
Cargando conversación...
</div>

</div>


<div id="escribiendo" class="escribiendo">
Está escribiendo...
</div>


<div class="composer">

<input
 id="mensajeInput"
 class="input"
 type="text"
 placeholder="Escribí un mensaje..."
 autocomplete="off"
>

<button id="enviar" class="enviar">
➤
</button>

</div>


<script>

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentUser = null;
let otherUserId = null;
let matchId = null;
let canalMensajes = null;


const params =
new URLSearchParams(window.location.search);

otherUserId =
params.get("user");


async function iniciar(){

try{

if(!otherUserId){

mostrarError(
"No se encontró el usuario de la conversación."
);

return;

}


const {
data:{session},
error:sessionError
} =
await supabaseClient.auth.getSession();


if(sessionError)
throw sessionError;


if(!session){

mostrarError(
"La sesión expiró. Volvé a iniciar sesión."
);

return;

}


currentUser =
session.user;


await cargarPerfil();

await buscarMatch();

await cargarMensajes();

escucharMensajes();

marcarMensajesRecibidos();

document
.getElementById("mensajeInput")
.addEventListener(
"input",
manejarEscritura
);


document
.getElementById("mensajeInput")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

e.preventDefault();

enviarMensaje();

}

});


document
.getElementById("enviar")
.addEventListener(
"click",
enviarMensaje
);


}catch(error){

console.error(error);

mostrarError(
"Error: "+error.message
);

}

}


async function cargarPerfil(){

const {
data,
error
} =
await supabaseClient
.from("profiles")
.select(
"id,nombre,edad,ciudad,descripcion,foto_url,intereses"
)
.eq("id",otherUserId)
.maybeSingle();


if(error)
throw error;


if(!data)
throw new Error(
"No se encontró el perfil."
);


document
.getElementById("nombre")
.textContent =
data.nombre || "Usuario";


if(data.foto_url){

document
.getElementById("foto")
.src =
data.foto_url;

}

}


async function buscarMatch(){

let {data,error} =
await supabaseClient
.from("matches")
.select(
"id,user1_id,user2_id"
)
.eq("user1_id",currentUser.id)
.eq("user2_id",otherUserId)
.maybeSingle();


if(error)
throw error;


if(!data){

const resultado =
await supabaseClient
.from("matches")
.select(
"id,user1_id,user2_id"
)
.eq("user1_id",otherUserId)
.eq("user2_id",currentUser.id)
.maybeSingle();


if(resultado.error)
throw resultado.error;


data =
resultado.data;

}


if(!data)
throw new Error(
"No existe un match entre estos usuarios."
);


matchId =
data.id;

}


async function cargarMensajes(){

const {
data,
error
} =
await supabaseClient
.from("messages")
.select(
"id,match_id,sender_id,content,created_at,delivered_at,read_at"
)
.eq("match_id",matchId)
.order(
"created_at",
{ascending:true}
);


if(error)
throw error;


const chat =
document.getElementById("chat");


chat.innerHTML="";


if(!data || data.length===0){

chat.innerHTML=
'<div class="vacio">Todavía no hay mensajes 💬</div>';

return;

}


data.forEach(
mostrarMensaje
);


bajarChat();

}


function mostrarMensaje(mensaje){

const chat =
document.getElementById("chat");


const div =
document.createElement("div");


const mio =
mensaje.sender_id ===
currentUser.id;


div.className =
"mensaje "+
(mio ? "mio":"otro");


let hora =
new Date(
mensaje.created_at
).toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);


let checks="";


if(mio){

if(mensaje.read_at){

checks =
'<span class="check">✓✓</span>';

}else if(mensaje.delivered_at){

checks =
'<span class="check">✓✓</span>';

}else{

checks =
'<span class="check">✓</span>';

}

}


div.innerHTML =

`<div>${escapeHTML(mensaje.content)}</div>
<div class="hora">
${hora}${checks}
</div>`;


div.dataset.id =
mensaje.id;


chat.appendChild(div);

}


function escapeHTML(text){

const div =
document.createElement("div");

div.textContent =
text;

return div.innerHTML;

}


async function enviarMensaje(){

const input =
document.getElementById(
"mensajeInput"
);


const contenido =
input.value.trim();


if(!contenido)
return;


if(!matchId)
return;


input.value="";


const {
data,
error
} =
await supabaseClient
.from("messages")
.insert({

match_id:matchId,

sender_id:
currentUser.id,

content:contenido

})
.select()
.single();


if(error){

console.error(error);

input.value =
contenido;

alert(
"No se pudo enviar el mensaje."
);

return;

}


mostrarMensaje(data);

bajarChat();

}


async function marcarMensajesRecibidos(){

const {
data,
error
} =
await supabaseClient
.from("messages")
.select(
"id,sender_id,delivered_at"
)
.eq("match_id",matchId)
.neq("sender_id",currentUser.id)
.is("delivered_at",null);


if(error){

console.error(error);

return;

}


if(!data || data.length===0)
return;


for(const mensaje of data){

await supabaseClient
.from("messages")
.update({
delivered_at:new Date().toISOString()
})
.eq("id",mensaje.id);

}

}


function escucharMensajes(){

canalMensajes =
supabaseClient
.channel(
"chat-"+matchId
);


canalMensajes
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages",
filter:"match_id=eq."+matchId
},
payload=>{

const mensaje =
payload.new;


if(
mensaje.sender_id !==
currentUser.id
){

mostrarMensaje(
mensaje
);

bajarChat();

marcarMensajeRecibido(
mensaje.id
);

}

}
)
.subscribe();


}


async function marcarMensajeRecibido(id){

await supabaseClient
.from("messages")
.update({
delivered_at:
new Date().toISOString()
})
.eq("id",id);

}


function manejarEscritura(){

const texto =
document
.getElementById("mensajeInput")
.value
.trim();


const estado =
document
.getElementById("escribiendo");


if(texto){

estado.style.display =
"block";

estado.textContent =
"Escribiendo...";

}else{

estado.style.display =
"none";

}

}


function bajarChat(){

const chat =
document.getElementById("chat");

setTimeout(
()=>{
chat.scrollTop =
chat.scrollHeight;
},
50
);

}


function mostrarError(texto){

document
.getElementById("chat")
.innerHTML =
`<div class="error">${escapeHTML(texto)}</div>`;

}


iniciar();

</script>

</body>
  </html>
