<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Conversación</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 20px;
      text-align: center;
    }

    .caja {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 500px;
      margin: 30px auto;
      box-shadow: 0 3px 15px rgba(0,0,0,.1);
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

    .dato {
      background: #f0f2f5;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="caja">

  <h1>💕 EmiMatch</h1>

  <h2>Conversación</h2>

  <p id="estado">
    🔄 Conectando con Supabase...
  </p>

  <div id="usuario" class="dato"></div>

</div>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function probar() {

  const estado =
    document.getElementById("estado");

  const usuario =
    document.getElementById("usuario");


  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const otherUserId =
      params.get("user");


    if (!otherUserId) {

      throw new Error(
        "No se recibió el ID del usuario."
      );

    }


    usuario.textContent =
      "Usuario del Match: " +
      otherUserId;


    estado.textContent =
      "🔄 Comprobando sesión...";


    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {
      throw error;
    }


    if (!data.session) {

      throw new Error(
        "No hay una sesión iniciada en EmiMatch."
      );

    }


    estado.textContent =
      "✅ Supabase conectado y sesión activa.";

    estado.className =
      "ok";


    usuario.innerHTML +=
      "<br><br>Usuario actual:<br>" +
      data.session.user.id;


  } catch (error) {

    console.error(error);

    estado.textContent =
      "❌ " + error.message;

    estado.className =
      "error";

  }

}


probar();

</script>

</body>
</html>
