<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conversación · EmiMatch</title>

  <meta name="theme-color" content="#07152f">
  <meta name="description" content="Conversación privada de EmiMatch.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(124,58,237,.20), transparent 35%),
        linear-gradient(145deg, #07152f, #102b5c);
      color: #172033;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100dvh;
      min-height: 100vh;
      margin: auto;
      background: #f4f7fb;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .header {
      flex-shrink: 0;
      height: 70px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      background: linear-gradient(135deg, #07152f, #123b91 65%, #4c1d95);
      color: white;
      box-shadow: 0 5px 18px rgba(0,0,0,.22);
      z-index: 10;
    }

    .back,
    .block-btn {
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .18s ease;
    }

    .back {
      width: 42px;
      height: 42px;
      background: rgba(255,255,255,.10);
      font-size: 31px;
      line-height: 1;
    }

    .back:active,
    .block-btn:active {
      transform: scale(.92);
      background: rgba(255,255,255,.18);
    }

    .avatar-wrap {
      position: relative;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      background: #dbe2ed;
      border: 2px solid rgba(255,255,255,.75);
      display: block;
    }

    .online-dot {
      position: absolute;
      right: 0;
      bottom: 1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
      border: 2px solid #123b91;
      display: none;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info strong {
      display: block;
      font-size: 16px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      font-size: 11px;
      opacity: .88;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .block-btn {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,.08);
      font-size: 18px;
    }

    .block-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .messages {
      flex: 1;
      min-height: 0;
      padding: 18px 13px 12px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 7px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;

      background:
        radial-gradient(circle at 15% 10%, rgba(124,58,237,.05), transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(212,175,55,.05), transparent 25%),
        #f4f7fb;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .message {
      position: relative;
      max-width: 80%;
      padding: 10px 13px 8px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.42;
      word-break: break-word;
      overflow-wrap: anywhere;
      box-shadow: 0 3px 10px rgba(0,0,0,.07);
      animation: aparecer .18s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .mine {
      align-self: flex-end;
      background: linear-gradient(135deg, #123b91, #2563eb);
      color: white;
      border-bottom-right-radius: 5px;
      box-shadow: 0 4px 12px rgba(18,59,145,.20);
    }

    .theirs {
      align-self: flex-start;
      background: white;
      color: #172033;
      border-bottom-left-radius: 5px;
      border: 1px solid #e5eaf2;
    }

    .time {
      display: block;
      font-size: 9px;
      opacity: .72;
      margin-top: 5px;
      text-align: right;
      white-space: nowrap;
    }

    .checks {
      margin-left: 4px;
      font-size: 11px;
      letter-spacing: -2px;
    }

    .read {
      color: #5ee7ff;
    }

    .typing {
      flex-shrink: 0;
      min-height: 25px;
      padding: 3px 16px 5px;
      font-size: 11px;
      color: #64748b;
      font-style: italic;
      background: #f4f7fb;
    }

    .composer {
      flex-shrink: 0;
      width: 100%;
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.97);
      border-top: 1px solid #e1e6ef;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      z-index: 20;
      box-shadow: 0 -5px 18px rgba(0,0,0,.07);
    }

    .composer textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: 1px solid #d6dce7;
      border-radius: 21px;
      padding: 11px 14px;
      outline: none;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.35;
      min-height: 43px;
      max-height: 105px;
      background: #f8fafc;
      color: #172033;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .composer textarea:focus {
      border-color: #4c6fd8;
      box-shadow: 0 0 0 3px rgba(76,111,216,.10);
      background: white;
    }

    .composer textarea::placeholder {
      color: #94a3b8;
    }

    .send {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #123b91, #4c1d95);
      color: white;
      font-size: 19px;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(18,59,145,.25);
      transition: .18s ease;
    }

    .send:active {
      transform: scale(.92);
    }

    .send:disabled {
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .empty,
    .error {
      width: 100%;
      max-width: 320px;
      text-align: center;
      margin: auto;
      color: #64748b;
      padding: 30px 20px;
      line-height: 1.5;
    }

    .bloqueado-info {
      margin: 8px auto 4px;
      max-width: 330px;
      padding: 9px 14px;
      border-radius: 14px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 12px;
      text-align: center;
      border: 1px solid #fed7aa;
    }

    @media (min-width: 701px) {
      .app {
        box-shadow: 0 0 50px rgba(0,0,0,.30);
      }

      .header {
        height: 74px;
      }

      .messages {
        padding-left: 22px;
        padding-right: 22px;
      }

      .composer {
        padding-left: 18px;
        padding-right: 18px;
      }
    }

    @media (max-width: 380px) {
      .header {
        height: 64px;
        padding: 8px 9px;
        gap: 8px;
      }

      .back {
        width: 38px;
        height: 38px;
        font-size: 28px;
      }

      .avatar-wrap,
      .avatar {
        width: 42px;
        height: 42px;
      }

      .block-btn {
        width: 37px;
        height: 37px;
        font-size: 16px;
      }

      .header-info strong {
        font-size: 15px;
      }

      .status {
        font-size: 10px;
      }

      .messages {
        padding: 14px 9px 9px;
      }

      .message {
        max-width: 86%;
        font-size: 14px;
        padding: 9px 11px 7px;
      }

      .composer {
        padding: 7px;
      }

      .composer textarea {
        font-size: 14px;
        padding: 10px 12px;
      }

      .send {
        width: 42px;
        height: 42px;
        min-width: 42px;
      }
    }
  </style>

<body>

<div class="app">

  <header class="header">

    <button
      class="back"
      onclick="volver()"
      aria-label="Volver"
      type="button"
    >
      ‹
    </button>

    <div class="avatar-wrap">
      <img
        id="avatar"
        class="avatar"
        src="https://via.placeholder.com/100"
        alt="Foto de perfil"
      >

      <div
        id="onlineDot"
        class="online-dot"
      ></div>
    </div>

    <div class="header-info">
      <strong id="nombreUsuario">Cargando...</strong>

      <div
        id="estadoUsuario"
        class="status"
      >
        ⏳
      </div>
    </div>

    <button
      id="btnBloquear"
      class="block-btn"
      onclick="bloquearUsuario()"
      title="Bloquear"
      aria-label="Bloquear usuario"
      type="button"
    >
      🚫
    </button>

  </header>

  <main
    id="messages"
    class="messages"
  >
    <div class="empty">
      ⏳ Cargando conversación...
    </div>
  </main>

  <div
    id="typing"
    class="typing"
    aria-live="polite"
  ></div>

  <input
    id="inputFoto"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    hidden
  >

  <input id="inputArchivo" type="file" accept=".pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx" hidden>

  <div class="composer">

    <button
      id="btnAdjuntarFoto"
      class="attach-photo"
      type="button"
      aria-label="Adjuntar foto"
      title="Enviar foto"
      disabled
    >＋</button>

    <button id="btnAdjuntarArchivo" class="attach-photo" type="button" aria-label="Adjuntar archivo" title="Enviar archivo" disabled>📎</button>

    <button id="btnGrabarAudio" class="record-audio" type="button" aria-label="Grabar mensaje de voz" title="Grabar mensaje de voz" disabled>🎙️</button>

    <textarea
      id="inputMensaje"
      placeholder="Escribí un mensaje..."
      rows="1"
      maxlength="2000"
      disabled
      aria-label="Escribir mensaje"
    ></textarea>

    <button
      id="btnEnviar"
      class="send"
      onclick="enviarMensaje()"
      disabled
      aria-label="Enviar mensaje"
      type="button"
    >
      ➤
    </button>

  </div>

</div>

<script>
"use strict";

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let usuarioActual = null;
let usuarioDestino = null;
let matchActual = null;
let bloqueado = false;
let canalMensajes = null;

const params =
  new URLSearchParams(
    window.location.search
  );

const destinoId =
  params.get("user");

const messagesDiv =
  document.getElementById("messages");

const inputMensaje =
  document.getElementById("inputMensaje");

const btnEnviar =
  document.getElementById("btnEnviar");

const btnBloquear =
  document.getElementById("btnBloquear");

const btnAdjuntarFoto =
  document.getElementById("btnAdjuntarFoto");

const inputFoto =
  document.getElementById("inputFoto");

const inputArchivo = document.getElementById("inputArchivo");
const btnAdjuntarArchivo = document.getElementById("btnAdjuntarArchivo");

const btnGrabarAudio = document.getElementById("btnGrabarAudio");

const typingDiv =
  document.getElementById("typing");

async function iniciar() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    const session =
      data?.session;

    if (!session) {

      window.location.href =
        "index.html";

      return;
    }

    usuarioActual =
      session.user;

    if (!destinoId) {

      mostrarError(
        "No se encontró el usuario."
      );

      desactivarChat();

      return;
    }

    if (
      destinoId ===
      usuarioActual.id
    ) {

      mostrarError(
        "No podés abrir una conversación con tu propia cuenta."
      );

      desactivarChat();

      return;
    }

    await cargarUsuario();
    await cargarMatch();
    await comprobarBloqueo();
    await cargarMensajes();

    activarRealtimeMensajes();
    activarInputMensaje();

  } catch (error) {

    console.error(
      "Error al iniciar conversación:",
      error
    );

    mostrarError(
      "No se pudo cargar la conversación."
    );

    desactivarChat();
  }
}

async function cargarUsuario() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("id,nombre,foto_url")
      .eq("id", destinoId)
      .maybeSingle();

  if (error) {
    throw error;
  }

  if (!data) {

    throw new Error(
      "No se encontró el perfil."
    );
  }

  usuarioDestino =
    data;

  document.getElementById(
    "nombreUsuario"
  ).textContent =
    data.nombre ||
    "Usuario";

  document.getElementById(
    "avatar"
  ).src =
    data.foto_url ||
    "https://via.placeholder.com/100";

  actualizarEstadoUsuario();
}

function actualizarEstadoUsuario() {

  const estado =
    document.getElementById(
      "estadoUsuario"
    );

  const onlineDot =
    document.getElementById(
      "onlineDot"
    );

  if (bloqueado) {

async function cargarMatch() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id,created_at"
      )
      .or(

      )
      .limit(1);

  if (error) {
    throw error;
  }

  if (
    !data ||
    data.length === 0
  ) {

    throw new Error(
      "No existe un Match válido con este usuario."
    );

async function comprobarBloqueo() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_blocks")
      .select(
        "id,blocker_id,blocked_id"
      )

async function marcarMensajesRecibidosComoLeidos() {
  if (!matchActual || !usuarioActual || bloqueado) return;

  const { error } = await supabaseClient
    .from("messages")
    .update({ read_at: new Date().toISOString() })
    .eq("match_id", matchActual.id)
    .neq("sender_id", usuarioActual.id)
    .is("read_at", null);

  if (error) {
    console.warn("No se pudieron marcar los mensajes recibidos como leídos:", error);
  }
}

async function marcarMensajeRecibidoComoLeido(mensajeId) {
  if (!matchActual || !usuarioActual || bloqueado || !mensajeId) return null;

  const readAt = new Date().toISOString();
  const { data, error } = await supabaseClient
    .from("messages")
    .update({ read_at: readAt })
    .eq("id", mensajeId)
    .eq("match_id", matchActual.id)
    .neq("sender_id", usuarioActual.id)
    .is("read_at", null)
    .select("id,read_at")
    .maybeSingle();

  if (error) {
    console.warn("No se pudo marcar el mensaje recibido como leído:", error);
    return null;
  }

  return data?.read_at || null;
}

async function cargarMensajes() {

  if (!matchActual) {
    return;
  }

  // Al abrir la conversación, marcamos como leídos los mensajes recibidos.
  await marcarMensajesRecibidosComoLeidos();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(
        "id,match_id,sender_id,content,created_at,read_at,message_type,media_path,media_mime,media_name,media_size,is_view_once,opened_at"
      )
      .eq(
        "match_id",
        matchActual.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );

  if (error) {
    throw error;
  }

  messagesDiv.innerHTML =
    "";

  if (
    !data ||
    data.length === 0
  ) {

    messagesDiv.innerHTML = `
      <div class="empty">
        💬 Todavía no hay mensajes.<br>
        ¡Comenzá la conversación!
      </div>
    `;

  } else {

    for (
      const mensaje of data
    ) {

      mostrarMensaje(
        mensaje
      );
    }
  }

  if (!bloqueado) {

    inputMensaje.disabled = false;
    btnGrabarAudio.disabled = false;
    btnAdjuntarArchivo.disabled = false;
  }

  actualizarEstadoBotonEnviar();

  bajarAlFinal();
}

function mostrarMensaje(mensaje) {

  if (!mensaje?.id) {
    return;
  }

  const existente =
    messagesDiv.querySelector(
      `[data-message-id="${mensaje.id}"]`
    );

  if (existente) {
    return;
  }

  const vacio =
    messagesDiv.querySelector(
      ".empty"
    );

  if (vacio) {
    vacio.remove();
  }

  const mio =
    mensaje.sender_id ===
    usuarioActual.id;

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " +
    (
      mio
        ? "mine"
        : "theirs"
    );

  div.dataset.messageId =
    mensaje.id;

  const contenido =
    document.createElement(
      "div"
    );

  if (mensaje.message_type === "image" && mensaje.media_path) {
    renderizarFotoMensaje(mensaje, contenido);
  } else if (mensaje.message_type === "file" && mensaje.media_path) {
    renderizarArchivoMensaje(mensaje, contenido);
  } else if (mensaje.message_type === "audio" && mensaje.media_path) {
    renderizarAudioMensaje(mensaje, contenido);
  } else {
    contenido.textContent = mensaje.content || "";
  }

  const hora =
    document.createElement(
      "span"
    );

  hora.className =
    "time";

  const fecha =
    new Date(
      mensaje.created_at
    );

  hora.textContent =
    fecha.toLocaleTimeString(
      "es-AR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  if (mio) {

    const checks =
      document.createElement(
        "span"
      );

    checks.className =
      "checks";

    checks.textContent =
      "✓";

    hora.appendChild(
      checks
    );
  }

  div.appendChild(
    contenido
  );

  div.appendChild(
    hora
  );

  messagesDiv.appendChild(
    div
  );
}
  function activarRealtimeMensajes() {

  if (!matchActual) {
    return;
  }

  if (canalMensajes) {

    try {

      supabaseClient.removeChannel(
        canalMensajes
      );

    } catch (_) {}

    canalMensajes =
      null;
  }

  canalMensajes =
    supabaseClient
      .channel(
        "emimatch-messages-" +
        matchActual.id
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter:
            "match_id=eq." +
            matchActual.id
        },
        async (payload) => {

          const mensaje = payload?.new;
          if (!mensaje?.id) return;

          // Si el destinatario tiene este chat abierto, el mensaje se marca leído.
          if (mensaje.sender_id !== usuarioActual.id) {
            const readAt = await marcarMensajeRecibidoComoLeido(mensaje.id);
            if (readAt) mensaje.read_at = readAt;
          }

          mostrarMensaje(mensaje);
          bajarAlFinal();
        }
      )
      .subscribe(
        (status) => {

          console.log(
            "Realtime mensajes:",
            status
          );
        }
      );
}

const CHAT_MEDIA_BUCKET = "chat-media";

const CHAT_FILE_TYPES = ["application/pdf","text/plain","text/csv","application/msword","application/vnd.openxmlformats-officedocument.wordprocessingml.document","application/vnd.ms-excel","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/vnd.ms-powerpoint","application/vnd.openxmlformats-officedocument.presentationml.presentation"];

function abrirVistaPreviaFoto(archivo) {
  if (bloqueado || !matchActual || !usuarioActual) return;

  if (!CHAT_IMAGE_TYPES.includes(archivo.type)) {

  const objectUrl = URL.createObjectURL(archivo);
  const overlay = document.createElement("div");
  overlay.className = "em-photo-overlay";
  overlay.setAttribute("role", "dialog");
  overlay.setAttribute("aria-modal", "true");
  overlay.setAttribute("aria-label", "Vista previa de foto");

  const dialog = document.createElement("div");

async function enviarFotoSeleccionada(archivo, overlay, objectUrl, botonEnviarFoto, botonCancelar, verUnaVez = false) {
  if (bloqueado || !matchActual || !usuarioActual) return;

  botonEnviarFoto.disabled = true;
  botonCancelar.disabled = true;
  botonEnviarFoto.textContent = "Subiendo…";
  btnAdjuntarFoto.disabled = true;
  inputMensaje.disabled = true;

  const extension = ({
    "image/jpeg": "jpg",
    "image/png": "png",
    "image/webp": "webp"
  })[archivo.type];

  const nombreUnico = (typeof crypto !== "undefined" && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(16).slice(2);
  const ruta = matchActual.id + "/" + usuarioActual.id + "/" + nombreUnico + "." + extension;
  let subidaCompletada = false;

  try {
    const { error: errorSubida } = await supabaseClient
      .storage
      .from(CHAT_MEDIA_BUCKET)
      .upload(ruta, archivo, {
        cacheControl: "3600",
        contentType: archivo.type,
        upsert: false
      });

    if (errorSubida) throw errorSubida;
    subidaCompletada = true;

    const { data, error } = await supabaseClient
      .from("messages")
      .insert({
        match_id: matchActual.id,
        sender_id: usuarioActual.id,
        content: "📷 Foto",
        message_type: "image",
        media_path: ruta,
        media_mime: archivo.type,
        media_name: String(archivo.name || "foto").slice(0, 180),
        media_size: archivo.size,
        is_view_once: verUnaVez,
        opened_at: null
      })
      .select("id,match_id,sender_id,content,created_at,message_type,media_path,media_mime,media_name,media_size,is_view_once,opened_at")
      .single();

    if (error) throw error;

    mostrarMensaje(data);
    bajarAlFinal();
    URL.revokeObjectURL(objectUrl);
    overlay.remove();
  } catch (error) {
    console.error("Error enviando foto:", error);

    if (subidaCompletada) {
      const { error: errorBorrado } = await supabaseClient
        .storage
        .from(CHAT_MEDIA_BUCKET)
        .remove([ruta]);
      if (errorBorrado) console.warn("No se pudo limpiar la foto que no llegó a enviarse:", errorBorrado);
    }

    const textoError = [
      error?.message, error?.details, error?.hint, error?.code
    ].filter(Boolean).join(" ").toLowerCase();

    const esLimitePremium =
      textoError.includes("free_message_limit") ||
      textoError.includes("free message limit") ||
      textoError.includes("free-message-limit") ||
      textoError.includes("alcanzaste el límite") ||
      textoError.includes("mensajes gratuitos") ||
      error?.code === "P0001";

    if (esLimitePremium) {
      URL.revokeObjectURL(objectUrl);
      overlay.remove();
      mostrarPremiumLimitPrompt();
    } else {
      alert("No se pudo enviar la foto. " + (error?.message || "Revisá tu conexión e intentá nuevamente."));
      botonEnviarFoto.disabled = false;
      botonCancelar.disabled = false;
      botonEnviarFoto.textContent = "Reintentar envío";
    }
  } finally {
    if (!bloqueado) {
      inputMensaje.disabled = false;
      btnAdjuntarFoto.disabled = false;
    }
    actualizarEstadoBotonEnviar();
  }
}

function renderizarFotoMensaje(mensaje, contenedor) {
  const wrap = document.createElement("div");
  wrap.className = "chat-photo-wrap";
  if (mensaje.is_view_once) {
    const status = document.createElement("div");
    status.className = "chat-photo-loading";
    status.textContent = mensaje.opened_at ? "Foto de una sola vista: ya abierta" : (mensaje.sender_id === usuarioActual.id ? "Foto de una sola vista enviada" : "Foto para ver una sola vez");
    wrap.appendChild(status);
    if (!mensaje.opened_at && mensaje.sender_id !== usuarioActual.id) {
      const open = document.createElement("button");
      open.type = "button";
      open.textContent = "Abrir foto";
      open.addEventListener("click", () => abrirFotoUnaVez(mensaje, wrap, open));
      wrap.appendChild(open);
    }
    contenedor.appendChild(wrap);
    return;
  }
  const loading = document.createElement("div");
  loading.className = "chat-photo-loading";
  loading.textContent = "Cargando foto...";
  const imagen = document.createElement("img");
  imagen.className = "chat-photo";
  imagen.alt = "Foto compartida en EmiMatch";
  imagen.loading = "eager";
  imagen.decoding = "async";
  imagen.style.display = "block";
  imagen.style.visibility = "hidden";
  wrap.append(loading, imagen);
  contenedor.appendChild(wrap);
  imagen.addEventListener("load", () => { loading.remove(); imagen.style.visibility = "visible"; }, { once: true });
  imagen.addEventListener("error", () => { loading.textContent = "No se pudo cargar esta foto."; imagen.remove(); }, { once: true });
  imagen.addEventListener("click", () => abrirFotoAmpliada(imagen.src));
  (async () => {
    const { data, error } = await supabaseClient.storage.from(CHAT_MEDIA_BUCKET).createSignedUrl(mensaje.media_path, 600);
    if (error || !data || !data.signedUrl) { loading.textContent = "Foto privada no disponible."; return; }
    imagen.src = data.signedUrl;
  })().catch((error) => { console.warn("No se pudo preparar la foto del chat:", error); loading.textContent = "No se pudo cargar esta foto."; });
}

async function abrirFotoUnaVez(mensaje, wrap, boton) {
  if (bloqueado || !mensaje || !mensaje.is_view_once || mensaje.opened_at || mensaje.sender_id === usuarioActual.id) return;
  boton.disabled = true;
  boton.textContent = "Abriendo...";
  try {
    const { data: row, error: markError } = await supabaseClient.from("messages").update({ opened_at: new Date().toISOString() }).eq("id", mensaje.id).is("opened_at", null).select("id,opened_at").maybeSingle();
    if (markError) throw markError;
    if (!row) { wrap.textContent = "Esta foto ya fue abierta y no se puede volver a ver."; return; }
    mensaje.opened_at = row.opened_at;
    const { data, error } = await supabaseClient.storage.from(CHAT_MEDIA_BUCKET).createSignedUrl(mensaje.media_path, 120);
    if (error || !data || !data.signedUrl) throw error || new Error("No se pudo abrir la foto.");
    const overlay = document.createElement("div");
    overlay.className = "em-photo-overlay";
    overlay.setAttribute("role", "dialog");
    overlay.setAttribute("aria-modal", "true");
    const img = document.createElement("img");
    img.className = "em-photo-full";
    img.alt = "Foto de visualizacion unica";
    const close = document.createElement("button");
    close.type = "button";
    close.className = "em-photo-close";
    close.textContent = "x";
    let finished = false;
    const finish = async () => {
      if (finished) return;
      finished = true;
      overlay.remove();
      wrap.textContent = "Foto de una sola vista: ya abierta";
      const { error: removeError } = await supabaseClient.storage.from(CHAT_MEDIA_BUCKET).remove([mensaje.media_path]);
      if (removeError) console.warn("No se pudo borrar la foto vista una vez:", removeError);
    };
    close.addEventListener("click", finish);
    overlay.addEventListener("click", (event) => { if (event.target === overlay) finish(); });
    overlay.append(img, close);
    document.body.appendChild(overlay);
    img.src = data.signedUrl;
  } catch (error) {
    console.error("Error abriendo foto de una sola vista:", error);
    boton.disabled = false;
    boton.textContent = "Reintentar abrir";
    alert("No se pudo abrir la foto. " + (error && error.message ? error.message : "Intenta nuevamente."));
  }
}
async function enviarArchivoSeleccionado(archivo) {

  const extension = (nombre.includes(".") ? nombre.split(".").pop() : "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 10);
  const extensionesPermitidas = {
    pdf: ["application/pdf"], txt: ["text/plain"], csv: ["text/csv", "text/plain"],
    doc: ["application/msword"], docx: ["application/vnd.openxmlformats-officedocument.wordprocessingml.document"],
    xls: ["application/vnd.ms-excel"], xlsx: ["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"],
    ppt: ["application/vnd.ms-powerpoint"], pptx: ["application/vnd.openxmlformats-officedocument.presentationml.presentation"]
  };
  if (!CHAT_FILE_TYPES.includes(archivo.type) || !extensionesPermitidas[extension] || !extensionesPermitidas[extension].includes(archivo.type)) { alert("El formato del archivo no coincide con su extensión. Usá PDF, TXT, CSV, Word, Excel o PowerPoint con su extensión correcta."); return; }
  if (archivo.size < 1 || archivo.size > CHAT_FILE_MAX_BYTES) { alert("El archivo debe pesar como máximo 20 MB."); return; }
  btnAdjuntarArchivo.disabled = true; btnAdjuntarFoto.disabled = true; btnGrabarAudio.disabled = true; inputMensaje.disabled = true;
  const unique = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);
  const path = matchActual.id + "/" + usuarioActual.id + "/" + unique + "." + extension;
  let uploaded = false;
  try {
    const up = await supabaseClient.storage.from(CHAT_FILES_BUCKET).upload(path, archivo, { cacheControl: "3600", contentType: archivo.type, upsert: false });
    if (up.error) throw up.error;
    uploaded = true;
    const result = await supabaseClient.from("messages").insert({ match_id: matchActual.id, sender_id: usuarioActual.id, content: "📎 " + nombre, message_type: "file", media_path: path, media_mime: archivo.type, media_name: nombre, media_size: archivo.size }).select("id,match_id,sender_id,content,created_at,message_type,media_path,media_mime,media_name,media_size,is_view_once,opened_at").single();
    if (result.error) throw result.error;
    mostrarMensaje(result.data); bajarAlFinal();
  } catch (error) {
    console.error("Error enviando archivo:", error);
    if (uploaded) { const cleanup = await supabaseClient.storage.from(CHAT_FILES_BUCKET).remove([path]); if (cleanup.error) console.warn("No se pudo limpiar el archivo fallido:", cleanup.error); }
    const detail = [error && error.message, error && error.details, error && error.hint, error && error.code].filter(Boolean).join(" ").toLowerCase();
    if (detail.includes("free_message_limit") || detail.includes("free message limit") || detail.includes("mensajes gratuitos") || error.code === "P0001") mostrarPremiumLimitPrompt();
    else alert("No se pudo enviar el archivo. " + (error && error.message ? error.message : "Revisá tu conexión e intentá nuevamente."));
  } finally {
    if (!bloqueado) { btnAdjuntarArchivo.disabled = false; btnAdjuntarFoto.disabled = false; btnGrabarAudio.disabled = false; inputMensaje.disabled = false; }
    actualizarEstadoBotonEnviar();
  }
}

function formatearTamanoArchivo(bytes) {
  if (!Number.isFinite(bytes) || bytes < 0) return "";
  return bytes < 1048576 ? Math.max(1, Math.round(bytes / 1024)) + " KB" : (bytes / 1048576).toFixed(1) + " MB";
}

async function manejarBotonAudio() {
  if(bloqueado||!matchActual||!usuarioActual)return;
  if(grabacionActiva){detenerGrabacionAudio();return;}
  if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"){alert("Este navegador no permite grabar audio. Probá Chrome actualizado y autorizá el micrófono.");return;}
  try{
    streamAudio=await navigator.mediaDevices.getUserMedia({audio:true});
    const choices=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus","audio/ogg"];
    const chosen=choices.find(t=>MediaRecorder.isTypeSupported?.(t));
    grabadorAudio=new MediaRecorder(streamAudio,chosen?{mimeType:chosen}:{});
    chunksAudio=[];
    grabadorAudio.ondataavailable=e=>{if(e.data?.size)chunksAudio.push(e.data);};
    grabadorAudio.onerror=e=>{console.error(e.error);limpiarGrabacionAudio();alert("No se pudo grabar el audio.");};
    grabadorAudio.onstop=()=>{
      const raw=(chunksAudio[0]?.type||grabadorAudio?.mimeType||"audio/webm").split(";")[0].toLowerCase();
      const exts={"audio/webm":"webm","audio/mp4":"m4a","audio/ogg":"ogg","audio/mpeg":"mp3","audio/wav":"wav","audio/aac":"aac","audio/3gpp":"3gp"};
      const mime=CHAT_AUDIO_MIMES.includes(raw)?raw:"audio/webm";
      const blob=new Blob(chunksAudio,{type:mime}), duration=Date.now()-grabacionIniciada;
      limpiarGrabacionAudio();
      if(duration<500){alert("Grabá un poco más de tiempo.");return;}
      if(!blob.size||blob.size>CHAT_AUDIO_MAX_BYTES){alert("El audio debe pesar como máximo 12 MB.");return;}
      abrirVistaPreviaAudio(blob,mime,exts[mime]||"webm",duration);
    };
    grabacionIniciada=Date.now();grabacionActiva=true;grabadorAudio.start(250);
    btnGrabarAudio.classList.add("is-recording");btnGrabarAudio.textContent="■";btnGrabarAudio.title="Tocá para detener la grabación";
    btnAdjuntarFoto.disabled=true;inputMensaje.disabled=true;btnEnviar.disabled=true;
    temporizadorAudio=setTimeout(()=>{if(grabacionActiva)detenerGrabacionAudio();},120000);
  }catch(error){console.error(error);limpiarGrabacionAudio();alert("No se pudo acceder al micrófono. Revisá sus permisos.");}
}
function detenerGrabacionAudio(){if(temporizadorAudio)clearTimeout(temporizadorAudio);temporizadorAudio=null;if(grabadorAudio&&grabadorAudio.state!=="inactive")grabadorAudio.stop();else limpiarGrabacionAudio();}
function limpiarGrabacionAudio(){
  grabacionActiva=false;if(temporizadorAudio)clearTimeout(temporizadorAudio);temporizadorAudio=null;
  if(streamAudio){streamAudio.getTracks().forEach(t=>t.stop());streamAudio=null;}
  grabadorAudio=null;btnGrabarAudio.classList.remove("is-recording");btnGrabarAudio.textContent="🎙️";btnGrabarAudio.title="Grabar mensaje de voz";
  if(!bloqueado){btnAdjuntarFoto.disabled=false;inputMensaje.disabled=false;actualizarEstadoBotonEnviar();}
}
function abrirVistaPreviaAudio(blob,mime,extension,duracion){
  const url=URL.createObjectURL(blob),overlay=document.createElement("div");overlay.className="em-photo-overlay";overlay.setAttribute("role","dialog");overlay.setAttribute("aria-modal","true");
  const dialog=document.createElement("div");dialog.className="em-photo-dialog";
  const title=document.createElement("h2");title.textContent="Enviar mensaje de voz";
  const note=document.createElement("p");note.textContent="Escuchalo antes de compartirlo. Solo estará disponible en esta conversación.";
  const player=document.createElement("audio");player.className="em-audio-preview";player.controls=true;player.src=url;
  const timer=document.createElement("div");timer.className="em-audio-timer";timer.textContent="Duración aproximada: "+Math.round(duracion/1000)+" s";
  const actions=document.createElement("div");actions.className="em-photo-actions";
  const cancel=document.createElement("button");cancel.className="em-photo-cancel";cancel.type="button";cancel.textContent="Descartar";
  const send=document.createElement("button");send.className="em-photo-send";send.type="button";send.textContent="Enviar audio";
  actions.append(cancel,send);dialog.append(title,note,player,timer,actions);overlay.appendChild(dialog);document.body.appendChild(overlay);
  const close=()=>{player.pause();URL.revokeObjectURL(url);overlay.remove();};
  cancel.addEventListener("click",close);overlay.addEventListener("click",e=>{if(e.target===overlay&&!send.disabled)close();});
  send.addEventListener("click",()=>enviarAudioGrabado(blob,mime,extension,overlay,url,send,cancel));
}
async function enviarAudioGrabado(blob,mime,extension,overlay,url,send,cancel){
  if(bloqueado||!matchActual||!usuarioActual)return;
  send.disabled=true;cancel.disabled=true;send.textContent="Enviando…";btnGrabarAudio.disabled=true;btnAdjuntarFoto.disabled=true;inputMensaje.disabled=true;
  let path=null,uploaded=false;
  try{
    const uid=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
    path=matchActual.id+"/"+usuarioActual.id+"/"+uid+"."+extension;
    const up=await supabaseClient.storage.from(CHAT_AUDIO_BUCKET).upload(path,blob,{cacheControl:"3600",contentType:mime,upsert:false});if(up.error)throw up.error;uploaded=true;
    const res=await supabaseClient.from("messages").insert({match_id:matchActual.id,sender_id:usuarioActual.id,content:"🎙️ Mensaje de voz",message_type:"audio",media_path:path,media_mime:mime,media_name:"mensaje-de-voz."+extension,media_size:blob.size}).select("id,match_id,sender_id,content,created_at,message_type,media_path,media_mime,media_name,media_size,is_view_once,opened_at").single();
    if(res.error)throw res.error;mostrarMensaje(res.data);bajarAlFinal();URL.revokeObjectURL(url);overlay.remove();
  }catch(error){
    console.error("Error enviando audio:",error);
    if(uploaded&&path){const rm=await supabaseClient.storage.from(CHAT_AUDIO_BUCKET).remove([path]);if(rm.error)console.warn(rm.error);}
    alert("No se pudo enviar el audio. "+(error?.message||"Revisá tu conexión."));send.disabled=false;cancel.disabled=false;send.textContent="Reintentar envío";
  }finally{btnGrabarAudio.disabled=bloqueado;if(!bloqueado){btnAdjuntarFoto.disabled=false;inputMensaje.disabled=false;actualizarEstadoBotonEnviar();}}
}

/* =========================================================
   ENVIAR MENSAJE
   PREMIUM AISLADO
========================================================= */

async function enviarMensaje() {

  if (
    bloqueado ||
    !matchActual ||
    !usuarioActual
  ) {
    return;
  }

  const contenido =
    inputMensaje.value.trim();

  if (!contenido) {
    return;
  }

  if (
    contenido.length > 2000
  ) {

    alert(
      "El mensaje no puede superar los 2000 caracteres."
    );

    return;
  }

  btnEnviar.disabled =
    true;

  inputMensaje.disabled =
    true;

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({
          match_id:
            matchActual.id,

          sender_id:
            usuarioActual.id,

          content:
            contenido
        })
        .select(
          "id,match_id,sender_id,content,created_at,message_type,media_path,media_mime,media_name,media_size,is_view_once,opened_at"
        )
        .single();

    if (error) {
      throw error;
    }

    mostrarMensaje(
      data
    );

    inputMensaje.value =
      "";

    ajustarAlturaInput();

    actualizarEstadoBotonEnviar();

    bajarAlFinal();

  } catch (error) {

    console.error(
      "Error enviando mensaje:",
      error
    );

    /*
      Detectamos únicamente el error
      correspondiente al límite gratuito.
    */

    const textoError = [
      error?.message,
      error?.details,
      error?.hint,
      error?.code
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    const esLimitePremium =
      textoError.includes(
        "free_message_limit"
      ) ||
      textoError.includes(
        "free message limit"
      ) ||
      textoError.includes(
        "free-message-limit"
      ) ||
      textoError.includes(
        "alcanzaste el límite"
      ) ||
      textoError.includes(
        "mensajes gratuitos"
      ) ||
      error?.code === "P0001";

    if (esLimitePremium) {

      mostrarPremiumLimitPrompt();

      return;
    }

    alert(
      "No se pudo enviar el mensaje: " +
      (
        error?.message ||
        "Error desconocido"
      )
    );

  } finally {

    if (!bloqueado) {

      inputMensaje.disabled =
        false;
    }

    actualizarEstadoBotonEnviar();
  }
}

async function bloquearUsuario() {

  if (
    !usuarioActual ||
    !destinoId ||
    bloqueado
  ) {
    return;
  }

  const confirmar =
    window.confirm(
      "¿Querés bloquear a este usuario?"
    );

  if (!confirmar) {
    return;
  }

  btnBloquear.disabled =
    true;

  try {

    const {
      error
    } =
      await supabaseClient
        .from("user_blocks")
        .upsert(
          {
            blocker_id:
              usuarioActual.id,

            blocked_id:
              destinoId
          },
          {
            onConflict:
              "blocker_id,blocked_id"
          }
        );

    if (error) {
      throw error;
    }

    bloqueado =
      true;

    inputMensaje.disabled =
      true;

    btnEnviar.disabled =
      true;

    btnAdjuntarFoto.disabled =
      true;

    mostrarAvisoBloqueado();

    actualizarEstadoUsuario();

  } catch (error) {

    console.error(
      "Error bloqueando usuario:",
      error
    );

    alert(
      "No se pudo bloquear al usuario: " +
      (
        error?.message ||
        "Error desconocido"
      )
    );

    btnBloquear.disabled =
      false;
  }
}
