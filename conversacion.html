<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Conversación - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #07152f,
          #102b55
        );

      color: white;

      padding-bottom: 90px;
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    /* =========================
       CABECERA
    ========================= */

    .cabecera-chat {
      position: sticky;
      top: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 14px 15px;

      background:
        rgba(7,21,47,.97);

      border-bottom:
        1px solid
        rgba(255,255,255,.12);

      backdrop-filter: blur(12px);
    }

    .volver {
      width: 42px;
      height: 42px;

      border: none;
      border-radius: 50%;

      background:
        rgba(255,255,255,.10);

      color: white;

      font-size: 22px;

      cursor: pointer;
    }

    .foto-cabecera {
      width: 46px;
      height: 46px;

      min-width: 46px;

      border-radius: 50%;

      object-fit: cover;

      background: #e5e7eb;

      border:
        2px solid
        #d4af37;
    }

    .foto-cabecera-sin {
      width: 46px;
      height: 46px;

      min-width: 46px;

      border-radius: 50%;

      background: #e5e7eb;

      border:
        2px solid
        #d4af37;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;
    }

    .datos-cabecera {
      min-width: 0;
      flex: 1;
    }

    .nombre-cabecera {
      font-size: 18px;
      font-weight: bold;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .estado-cabecera {
      margin-top: 3px;

      font-size: 13px;

      color: #94a3b8;
    }

    .online {
      color: #4ade80;
    }

    .bloquear-btn {
      border: none;

      border-radius: 12px;

      padding: 9px 10px;

      background:
        rgba(239,68,68,.15);

      color: #fca5a5;

      cursor: pointer;

      font-size: 13px;
    }

    /* =========================
       MENSAJES
    ========================= */

    .mensajes {
      padding: 18px 12px;

      min-height:
        calc(100vh - 170px);

      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .estado-carga {
      text-align: center;

      padding: 35px 15px;

      color: #cbd5e1;
    }

    .mensaje-fila {
      display: flex;
      width: 100%;
    }

    .mensaje-fila.mio {
      justify-content: flex-end;
    }

    .mensaje-fila.otro {
      justify-content: flex-start;
    }

    .burbuja {
      max-width: 78%;

      padding: 10px 12px;

      border-radius: 18px;

      box-shadow:
        0 5px 15px
        rgba(0,0,0,.16);

      word-break: break-word;
    }

    .mio .burbuja {
      background:
        linear-gradient(
          135deg,
          #d4af37,
          #f0cf62
        );

      color: #07152f;

      border-bottom-right-radius: 5px;
    }

    .otro .burbuja {
      background: white;

      color: #172033;

      border-bottom-left-radius: 5px;
    }

    .texto-mensaje {
      font-size: 15px;
      line-height: 1.4;

      white-space: pre-wrap;
    }

    .hora {
      margin-top: 4px;

      display: flex;

      justify-content: flex-end;
      align-items: center;

      gap: 4px;

      font-size: 10px;

      opacity: .7;
    }

    .check {
      font-weight: bold;
      letter-spacing: -2px;
    }

    .check.leido {
      color: #2563eb;
    }

    /* =========================
       ESCRIBIENDO
    ========================= */

    .escribiendo {
      display: none;

      padding:
        0 15px
        8px;

      color: #cbd5e1;

      font-size: 13px;
    }

    .escribiendo.visible {
      display: block;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 500;

      background:
        rgba(7,21,47,.98);

      border-top:
        1px solid
        rgba(255,255,255,.12);

      padding:
        10px;

      backdrop-filter: blur(12px);
    }

    .composer-inner {
      max-width: 600px;
      margin: auto;

      display: flex;

      align-items: flex-end;

      gap: 8px;
    }

    #mensajeInput {
      flex: 1;

      min-height: 45px;
      max-height: 120px;

      resize: none;

      border: none;
      outline: none;

      border-radius: 18px;

      padding:
        12px 14px;

      font-size: 15px;

      background: white;
      color: #172033;
    }

    #enviarBtn {
      width: 46px;
      height: 46px;

      border: none;

      border-radius: 50%;

      background:
        #d4af37;

      color: #07152f;

      font-size: 20px;

      cursor: pointer;
    }

    #enviarBtn:disabled {
      opacity: .5;

      cursor: not-allowed;
    }

    /* =========================
       BLOQUEADO
    ========================= */

    .bloqueado-aviso {
      display: none;

      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 600;

      padding: 14px;

      background:
        #7f1d1d;

      color: white;

      text-align: center;

      font-size: 14px;
    }

    .bloqueado-aviso.visible {
      display: block;
    }

    /* =========================
       NAV INFERIOR
    ========================= */

    .bottom-nav {
      position: fixed;

      left: 10px;
      right: 10px;
      bottom: 80px;

      height: 66px;

      max-width: 600px;
      margin: auto;

      z-index: 450;

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      background:
        rgba(7,21,47,.96);

      border:
        1px solid
        rgba(255,255,255,.14);

      border-radius: 20px;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.40);

      backdrop-filter: blur(14px);
    }

    .nav-item {
      position: relative;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 2px;

      color: #cbd5e1;

      text-decoration: none;

      font-size: 10px;

      font-weight: bold;
    }

    .nav-item .icon {
      font-size: 20px;

      line-height: 21px;
    }

    .nav-item.activo {
      color: #d4af37;
    }

    .nav-badge {
      position: absolute;

      top: 3px;
      right: 17%;

      min-width: 18px;
      height: 18px;

      padding: 2px 5px;

      border-radius: 20px;

      background: #ef4444;

      color: white;

      font-size: 10px;

      display: none;

      align-items: center;
      justify-content: center;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      left: 50%;

      bottom: 155px;

      transform:
        translateX(-50%)
        translateY(20px);

      background:
        #111827;

      color: white;

      padding:
        12px 17px;

      border-radius: 14px;

      opacity: 0;

      pointer-events: none;

      transition: .25s ease;

      z-index: 2000;

      max-width: 90%;

      text-align: center;
    }

    .toast.mostrar {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    @media (max-width: 500px) {

      .bottom-nav {
        left: 6px;
        right: 6px;
      }

      .burbuja {
        max-width: 84%;
      }

      .bloquear-btn {
        font-size: 11px;
        padding: 8px;
      }

    }

  </style>

</head>

<script>


const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;

let otroUsuarioId = null;

let matchActual = null;

let canalMensajes = null;

let canalTyping = null;

let typingTimer = null;

let estaBloqueado = false;


/* =========================
   INICIO
========================= */

async function iniciar() {

  try {

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (!session) {

      window.location.href =
        "./index.html";

      return;
    }


    usuarioActual =
      session.user;


    const params =
      new URLSearchParams(
        window.location.search
      );


    otroUsuarioId =
      params.get(
        "user"
      );


    if (
      !otroUsuarioId
    ) {

      window.location.href =
        "./chat.html";

      return;

    }


    await comprobarBloqueo();

    await cargarPerfilOtro();

    await buscarMatch();

    await cargarMensajes();

    await marcarMensajesLeidos();

    await cargarNotificaciones();

    configurarRealtime();

    configurarTyping();

  }
  catch (error) {

    console.error(error);

    mostrarError(
      "No se pudo iniciar la conversación."
    );

  }

}


/* =========================
   COMPROBAR BLOQUEO
========================= */

async function comprobarBloqueo() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_blocks")
      .select(
        "blocker_id, blocked_id"
      )
      .or(
        `and(blocker_id.eq.${usuarioActual.id},blocked_id.eq.${otroUsuarioId}),and(blocker_id.eq.${otroUsuarioId},blocked_id.eq.${usuarioActual.id})`
      );


  if (error) {

    console.error(
      "Error comprobando bloqueo:",
      error
    );

    return;

  }


  estaBloqueado =
    !!(
      data &&
      data.length
    );


  actualizarEstadoBloqueo();

}


/* =========================
   ESTADO BLOQUEO
========================= */

function actualizarEstadoBloqueo() {

  const input =
    document.getElementById(
      "mensajeInput"
    );


  const boton =
    document.getElementById(
      "enviarBtn"
    );


  const aviso =
    document.getElementById(
      "bloqueadoAviso"
    );


  if (
    estaBloqueado
  ) {

    input.disabled =
      true;

    boton.disabled =
      true;

    input.placeholder =
      "Conversación bloqueada";

    aviso.classList.add(
      "visible"
    );

  }
  else {

    input.disabled =
      false;

    boton.disabled =
      false;

    input.placeholder =
      "Escribí un mensaje...";

    aviso.classList.remove(
      "visible"
    );

  }

}


/* =========================
   PERFIL
========================= */

async function cargarPerfilOtro() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        `
        id,
        nombre,
        edad,
        foto_url,
        online,
        last_seen
        `
      )
      .eq(
        "id",
        otroUsuarioId
      )
      .maybeSingle();


  if (error) {

    console.error(error);

    return;

  }


  if (!data) {

    return;

  }


  const nombre =
    escaparHTML(
      data.nombre ||
      "Usuario"
    );


  const edad =
    data.edad
      ? `, ${data.edad}`
      : "";


  document.getElementById(
    "nombreCabecera"
  ).textContent =
    `${nombre}${edad}`;


  const estado =
    document.getElementById(
      "estadoCabecera"
    );


  if (
    data.online
  ) {

    estado.innerHTML =
      `<span class="online">
        ● En línea
      </span>`;

  }
  else {

    estado.textContent =
      "Última conexión reciente";

  }


  const foto =
    document.getElementById(
      "fotoCabecera"
    );


  if (
    data.foto_url
  ) {

    foto.innerHTML = `

      <img
        class="foto-cabecera"
        src="${escaparHTML(
          data.foto_url
        )}"
        alt="Foto"
      >

    `;

  }

}


/* =========================
   BUSCAR MATCH
========================= */

async function buscarMatch() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        `
        id,
        user1_id,
        user2_id
        `
      )
      .or(
        `and(user1_id.eq.${usuarioActual.id},user2_id.eq.${otroUsuarioId}),and(user1_id.eq.${otroUsuarioId},user2_id.eq.${usuarioActual.id})`
      )
      .limit(1);


  if (error) {

    console.error(error);

    return;

  }


  if (
    data &&
    data.length
  ) {

    matchActual =
      data[0];

  }

}


/* =========================
   CARGAR MENSAJES
========================= */

async function cargarMensajes() {

  const contenedor =
    document.getElementById(
      "mensajes"
    );


  if (!matchActual) {

    contenedor.innerHTML = `

      <div class="estado-carga">

        💕 Esta conversación
        todavía no está disponible.

      </div>

    `;

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(
        `
        id,
        sender_id,
        content,
        created_at,
        read_at,
        delivered_at
        `
      )
      .eq(
        "match_id",
        matchActual.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    mostrarError(
      "No se pudieron cargar los mensajes."
    );

    return;

  }


  renderizarMensajes(
    data || []
  );

}


/* =========================
   RENDER MENSAJES
========================= */

function renderizarMensajes(
  mensajes
) {

  const contenedor =
    document.getElementById(
      "mensajes"
    );


  if (
    !mensajes.length
  ) {

    contenedor.innerHTML = `

      <div
        class="estado-carga"
      >
        💬 Comenzá la conversación
      </div>

    `;

    return;

  }


  let html = "";


  mensajes.forEach(
    mensaje => {

      const mio =
        mensaje.sender_id ===
        usuarioActual.id;


      const texto =
        escaparHTML(
          mensaje.content
        );


      const hora =
        new Date(
          mensaje.created_at
        )
          .toLocaleTimeString(
            "es-AR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );


      let checks = "";


      if (mio) {

        if (
          mensaje.read_at
        ) {

          checks = `
            <span
              class="check leido"
            >
              ✓✓
            </span>
          `;

        }
        else if (
          mensaje.delivered_at
        ) {

          checks = `
            <span class="check">
              ✓✓
            </span>
          `;

        }
        else {

          checks = `
            <span class="check">
              ✓
            </span>
          `;

        }

      }


      html += `

        <div
          class="
            mensaje-fila
            ${mio ? "mio" : "otro"}
          "
        >

          <div class="burbuja">

            <div class="texto-mensaje">
              ${texto}
            </div>

            <div class="hora">

              ${hora}

              ${checks}

            </div>

          </div>

        </div>

      `;

    }
  );


  contenedor.innerHTML =
    html;


  /*
    Bajar al último mensaje
  */

  requestAnimationFrame(
    () => {

      contenedor.scrollTop =
        contenedor.scrollHeight;

    }
  );

}


/* =========================
   MARCAR ENTREGADOS / LEÍDOS
========================= */

async function marcarMensajesLeidos() {

  if (
    !matchActual ||
    estaBloqueado
  ) {

    return;

  }


  const ahora =
    new Date().toISOString();


  /*
    Primero marcamos como
    entregados.
  */

  await supabaseClient
    .from("messages")
    .update({
      delivered_at:
        ahora
    })
    .eq(
      "match_id",
      matchActual.id
    )
    .neq(
      "sender_id",
      usuarioActual.id
    )
    .is(
      "delivered_at",
      null
    );


  /*
    Luego como leídos.
  */

  await supabaseClient
    .from("messages")
    .update({
      read_at:
        ahora,
      delivered_at:
        ahora
    })
    .eq(
      "match_id",
      matchActual.id
    )
    .neq(
      "sender_id",
      usuarioActual.id
    )
    .is(
      "read_at",
      null
    );


  await cargarNotificaciones();

}


/* =========================
   ENVIAR
========================= */

async function enviarMensaje() {

  if (
    estaBloqueado
  ) {

    return;

  }


  if (
    !matchActual
  ) {

    mostrarToast(
      "No hay un Match disponible."
    );

    return;

  }


  const input =
    document.getElementById(
      "mensajeInput"
    );


  const boton =
    document.getElementById(
      "enviarBtn"
    );


  const contenido =
    input.value.trim();


  if (!contenido) {

    return;

  }


  boton.disabled =
    true;


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .insert({

        match_id:
          matchActual.id,

        sender_id:
          usuarioActual.id,

        content:
          contenido

      });


  boton.disabled =
    false;


  if (error) {

    console.error(error);

    mostrarToast(
      "No se pudo enviar el mensaje."
    );

    return;

  }


  input.value =
    "";

  ajustarTextarea();

  actualizarTyping(
    fals
