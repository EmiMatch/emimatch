<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
    }

    header {
      height: 70px;
      background: linear-gradient(135deg, #071a3d, #123b78);
      color: white;
      display: flex;
      align-items: center;
      padding: 10px 15px;
      gap: 12px;
    }

    .volver {
      border: none;
      background: white;
      color: #123b78;
      border-radius: 8px;
      padding: 9px 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .perfil {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .foto {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .nombre {
      font-size: 17px;
      font-weight: bold;
    }

    .datos {
      font-size: 12px;
      opacity: .8;
    }

    #estado {
      text-align: center;
      padding: 15px;
      color: #666;
    }

    .error {
      color: #d32f2f !important;
      font-weight: bold;
    }

    #mensajes {
      height: calc(100vh - 135px);
      overflow-y: auto;
      padding: 15px;
      padding-bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mensaje {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 17px;
      word-wrap: break-word;
      font-size: 15px;
    }

    .mio {
      align-self: flex-end;
      background: #123b78;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .otro {
      align-self: flex-start;
      background: white;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }

    .hora {
      font-size: 10px;
      opacity: .65;
      text-align: right;
      margin-top: 4px;
    }

    .sin-mensajes {
      text-align: center;
      color: #777;
      margin-top: 50px;
    }

    .barra {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 10px;
      display: flex;
      gap: 8px;
      box-shadow: 0 -2px 8px rgba(0,0,0,.12);
    }

    #mensaje {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 22px;
      padding: 11px 15px;
      font-size: 15px;
      outline: none;
    }

    #enviar {
      border: none;
      background: #123b78;
      color: white;
      border-radius: 22px;
      padding: 0 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #enviar:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>

<header>

  <button class="volver" onclick="volver()">
    ←
  </button>

  <div class="perfil">

    <img
      id="foto"
      class="foto"
      src="https://via.placeholder.com/100"
      alt="Foto"
    >

    <div>

      <div
        id="nombre"
        class="nombre">
        Cargando...
      </div>

      <div
        id="datos"
        class="datos">
      </div>

    </div>

  </div>

</header>


<div id="estado">
  🔄 Cargando conversación...
</div>


<div id="mensajes"></div>


<div class="barra">

  <input
    id="mensaje"
    type="text"
    placeholder="Escribí un mensaje..."
    autocomplete="off"
  >

  <button
    id="enviar"
    onclick="enviarMensaje()">
    Enviar
  </button>

</div>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let otherUserId = null;
let matchId = null;


/* ==========================
   INICIAR
========================== */

async function iniciar() {

  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    otherUserId =
      params.get("user");


    if (!otherUserId) {

      throw new Error(
        "No se encontró el usuario del Match."
      );

    }


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (sessionError) {
      throw sessionError;
    }


    if (!sessionData.session) {

      throw new Error(
        "No hay una sesión activa."
      );

    }


    currentUser =
      sessionData.session.user;


    document.getElementById("estado")
      .textContent =
      "🔄 Cargando perfil...";


    await cargarPerfil();


    document.getElementById("estado")
      .textContent =
      "🔄 Buscando Match...";


    await buscarMatch();


    document.getElementById("estado")
      .textContent =
      "🔄 Cargando mensajes...";


    await cargarMensajes();


    document.getElementById("estado")
      .style.display = "none";


    activarTiempoReal();


  } catch (error) {

    console.error(error);

    mostrarError(
      error.message
    );

  }

}


/* ==========================
   PERFIL
========================== */

async function cargarPerfil() {

  const {
    data,
    error
  } =
    await supabaseClient

      .from("profiles")

      .select(
        "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
      )

      .eq("id", otherUserId)

      .maybeSingle();


  if (error) {
    throw error;
  }


  if (!data) {

    throw new Error(
      "No se encontró el perfil."
    );

  }


  document.getElementById("nombre")
    .textContent =
    data.nombre || "Usuario";


  let datos = "";


  if (data.edad) {

    datos +=
      data.edad + " años";

  }


  if (data.ciudad) {

    if (datos) {
      datos += " • ";
    }

    datos += data.ciudad;

  }


  document.getElementById("datos")
    .textContent =
    datos;


  if (data.foto_url) {

    document.getElementById("foto")
      .src =
      data.foto_url;

  }

}


/* ==========================
   BUSCAR MATCH
========================== */

async function buscarMatch() {

  const {
    data: match1,
    error: error1
  } =
    await supabaseClient

      .from("matches")

      .select("*")

      .eq("user1_id", currentUser.id)

      .eq("user2_id", otherUserId)

      .maybeSingle();


  if (error1) {
    throw error1;
  }


  if (match1) {

    matchId =
      match1.id;

    return;

  }


  const {
    data: match2,
    error: error2
  } =
    await supabaseClient

      .from("matches")

      .select("*")

      .eq("user1_id", otherUserId)

      .eq("user2_id", currentUser.id)

      .maybeSingle();


  if (error2) {
    throw error2;
  }


  if (match2) {

    matchId =
      match2.id;

    return;

  }


  throw new Error(
    "No existe un Match con esta persona."
  );

}


/* ==========================
   CARGAR MENSAJES
========================== */

async function cargarMensajes() {

  const {
    data,
    error
  } =
    await supabaseClient

      .from("messages")

      .select(
        "id,match_id,sender_id,content,created_at"
      )

      .eq("match_id", matchId)

      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {
    throw error;
  }


  mostrarMensajes(
    data || []
  );

}


/* ==========================
   MOSTRAR MENSAJES
========================== */

function mostrarMensajes(lista) {

  const contenedor =
    document.getElementById(
      "mensajes"
    );


  contenedor.innerHTML = "";


  if (!lista.length) {

    const div =
      document.createElement("div");


    div.className =
      "sin-mensajes";


    div.textContent =
      "💕 Todavía no hay mensajes. ¡Comenzá la conversación!";


    contenedor.appendChild(div);

    return;

  }


  lista.forEach(
    mensaje => {
      mostrarMensaje(mensaje);
    }
  );


  bajarChat();

}


/* ==========================
   MOSTRAR MENSAJE
========================== */

function mostrarMensaje(mensaje) {

  const contenedor =
    document.getElementById(
      "mensajes"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "mensaje " +
    (
      mensaje.sender_id === currentUser.id
        ? "mio"
        : "otro"
    );


  const texto =
    document.createElement(
      "div"
    );


  texto.textContent =
    mensaje.content;


  const hora =
    document.createElement(
      "div"
    );


  hora.className =
    "hora";


  const fecha =
    new Date(
      mensaje.created_at
    );


  hora.textContent =
    fecha.toLocaleTimeString(
      "es-AR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  div.appendChild(texto);

  div.appendChild(hora);

  contenedor.appendChild(div);

}


/* ==========================
   ENVIAR
========================== */

async function enviarMensaje() {

  const input =
    document.getElementById(
      "mensaje"
    );

  const boton =
    document.getElementById(
      "enviar"
    );


  const contenido =
    input.value.trim();


  if (!contenido) {
    return;
  }


  boton.disabled = true;


  const {
    data,
    error
  } =
    await supabaseClient

      .from("messages")

      .insert({

        match_id:
          matchId,

        sender_id:
          currentUser.id,

        content:
          contenido

      })

      .select()

      .single();


  boton.disabled = false;


  if (error) {

    console.error(error);

    alert(
      "❌ No se pudo enviar el mensaje:\n\n" +
      error.message
    );

    return;

  }


  input.value = "";


  /*
    Lo mostramos inmediatamente.
  */

  mostrarMensaje(data);

  bajarChat();

}


/* ==========================
   TIEMPO REAL
========================== */

function activarTiempoReal() {

  supabaseClient

    .channel(
      "chat-" + matchId
    )

    .on(

      "postgres_changes",

      {
        event: "INSERT",
        schema: "public",
        table: "messages",
        filter:
          "match_id=eq." + matchId
      },

      payload => {

        /*
          No duplicamos nuestros
          propios mensajes.
        */

        if (
          payload.new.sender_id !==
          currentUser.id
        ) {

          mostrarMensaje(
            payload.new
          );

          bajarChat();

        }

      }

    )

    .subscribe();

}


/* ==========================
   BAJAR CHAT
========================== */

function bajarChat() {

  const contenedor =
    document.getElementById(
      "mensajes"
    );


  contenedor.scrollTop =
    contenedor.scrollHeight;

}


/* ==========================
   ENTER
========================== */

document
  .getElementById("mensaje")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        enviarMensaje();

      }

    }
  );


/* ==========================
   VOLVER
========================== */

function volver() {

  window.location.href =
    "./chat.html";

}


/* ==========================
   ERROR
========================== */

function mostrarError(mensaje) {

  const estado =
    document.getElementById(
      "estado"
    );


  estado.style.display =
    "block";


  estado.className =
    "error";


  estado.textContent =
    "❌ " + mensaje;

}


/* ==========================
   INICIAR
========================== */

iniciar();

</script>

</body>
</html>
