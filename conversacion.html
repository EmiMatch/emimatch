<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmiMatch - Conversación</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f9;
}

.app{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  background:white;
  display:flex;
  flex-direction:column;
}

.header{
  height:70px;
  background:#071b49;
  color:white;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
}

.back{
  border:0;
  background:none;
  color:white;
  font-size:32px;
  cursor:pointer;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.info{
  flex:1;
}

.name{
  font-size:18px;
  font-weight:bold;
}

.status{
  font-size:12px;
  margin-top:4px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px 12px 85px;
}

.loading{
  text-align:center;
  color:#777;
  padding:30px;
}

.error{
  margin:20px;
  padding:15px;
  background:#ffe5e5;
  color:#a00000;
  border-radius:10px;
}

.row{
  display:flex;
  margin:7px 0;
}

.mine{
  justify-content:flex-end;
}

.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:17px;
  word-wrap:break-word;
  white-space:pre-wrap;
}

.mine .bubble{
  background:#123b80;
  color:white;
  border-bottom-right-radius:5px;
}

.theirs .bubble{
  background:#eee;
  color:#222;
  border-bottom-left-radius:5px;
}

.time{
  font-size:9px;
  opacity:.6;
  text-align:right;
  margin-top:4px;
}

.input{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(700px,100%);
  background:white;
  border-top:1px solid #ddd;
  padding:9px;
  display:flex;
  gap:8px;
}

.input input{
  flex:1;
  border:1px solid #ccc;
  border-radius:25px;
  padding:12px 15px;
  font-size:15px;
  outline:none;
}

.input button{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#123b80;
  color:white;
  font-size:20px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <button class="back" onclick="location.href='chat.html'">
      ‹
    </button>

    <img id="foto" class="avatar"
         src="https://via.placeholder.com/100">

    <div class="info">
      <div id="nombre" class="name">Cargando...</div>
      <div id="estado" class="status">Conectando...</div>
    </div>

  </div>

  <div id="mensajes" class="messages">
    <div class="loading">
      Cargando conversación...
    </div>
  </div>

  <div class="input">

    <input
      id="texto"
      type="text"
      placeholder="Escribí un mensaje..."
      autocomplete="off"
    >

    <button onclick="enviar()">
      ➤
    </button>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let yo = null;
let otro = null;
let match = null;

const params =
new URLSearchParams(location.search);

otro = params.get("user");


function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function error(mensaje){

  document.getElementById("mensajes").innerHTML =
  `<div class="error">
    ⚠️ ${escapeHTML(mensaje)}
  </div>`;
}


async function iniciar(){

  try{

    if(!otro){
      error("No se recibió el usuario.");
      return;
    }


    /* SESIÓN */

    const {
      data:sessionData,
      error:sessionError
    } =
    await supabaseClient.auth.getSession();

    if(sessionError){
      error(sessionError.message);
      return;
    }

    yo =
    sessionData.session?.user;

    if(!yo){
      error("No hay una sesión iniciada.");
      return;
    }


    /* PERFIL */

    const {
      data:perfil,
      error:perfilError
    } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",otro)
      .maybeSingle();

    if(perfilError){
      error(
        "Error del perfil: " +
        perfilError.message
      );
      return;
    }

    if(!perfil){
      error("No se encontró el perfil.");
      return;
    }

    document.getElementById("nombre")
      .textContent =
      perfil.nombre || "Usuario";

    if(perfil.foto_url){
      document.getElementById("foto").src =
      perfil.foto_url;
    }

    document.getElementById("estado")
      .textContent =
      perfil.online
      ? "🟢 En línea"
      : "Desconectado";


    /* MATCH */

    const {
      data:matches,
      error:matchError
    } =
    await supabaseClient
      .from("matches")
      .select("id,user1_id,user2_id")
      .or(
        "and(user1_id.eq." + yo.id +
        ",user2_id.eq." + otro +
        "),and(user1_id.eq." + otro +
        ",user2_id.eq." + yo.id + ")"
      )
      .limit(1);

    if(matchError){
      error(
        "Error buscando match: " +
        matchError.message
      );
      return;
    }

    if(!matches || matches.length===0){
      error("No existe un match entre estas cuentas.");
      return;
    }

    match = matches[0];


    /* MENSAJES */

    await cargar();


  }catch(e){

    error(
      "Error inesperado: " +
      e.message
    );

  }

}


async function cargar(){

  if(!match) return;


  const {
    data,
    error:msgError
  } =
  await supabaseClient
    .from("messages")
    .select(
      "id,sender_id,content,created_at,read_at"
    )
    .eq("match_id",match.id)
    .order(
      "created_at",
      {ascending:true}
    );


  if(msgError){

    error(
      "Error cargando mensajes: " +
      msgError.message
    );

    return;
  }


  const contenedor =
  document.getElementById("mensajes");

  contenedor.innerHTML = "";


  if(!data || data.length===0){

    contenedor.innerHTML =
    `<div class="loading">
      💕 Todavía no hay mensajes.<br>
      ¡Empezá la conversación!
    </div>`;

    return;
  }


  data.forEach(m => {

    const mio =
    m.sender_id === yo.id;

    const row =
    document.createElement("div");

    row.className =
    "row " +
    (mio ? "mine" : "theirs");


    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble";


    const hora =
    new Date(
      m.created_at
    ).toLocaleTimeString(
      "es-AR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


    bubble.innerHTML =
    escapeHTML(m.content) +
    `<div class="time">
      ${hora}
      ${mio ? (m.read_at ? " ✓✓" : " ✓") : ""}
    </div>`;


    row.appendChild(bubble);

    contenedor.appendChild(row);

  });


  contenedor.scrollTop =
  contenedor.scrollHeight;


  /* MARCAR COMO LEÍDOS */

  const recibidos =
  data.filter(
    m =>
    m.sender_id !== yo.id &&
    !m.read_at
  );


  for(const m of recibidos){

    await supabaseClient
      .from("messages")
      .update({
        read_at:
        new Date().toISOString()
      })
      .eq("id",m.id);

  }

}


async function enviar(){

  const input =
  document.getElementById("texto");

  const contenido =
  input.value.trim();


  if(!contenido) return;

  if(!match){
    alert("El match todavía no está cargado.");
    return;
  }


  input.disabled = true;


  const {
    data,
    error:sendError
  } =
  await supabaseClient
    .from("messages")
    .insert({
      match_id:match.id,
      sender_id:yo.id,
      content:contenido
    })
    .select()
    .single();


  input.disabled = false;


  if(sendError){

    alert(
      "No se pudo enviar:\n\n" +
      sendError.message
    );

    return;
  }


  input.value = "";

  await cargar();

}


/* ENTER */

document
.getElementById("texto")
.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      e.preventDefault();
      enviar();
    }

  }
);


/* ACTUALIZAR MENSAJES */

setInterval(
  cargar,
  3000
);


/* INICIO */

iniciar();

</script>

</body>
</html>
