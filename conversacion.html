<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conversación - EmiMatch</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #07152f, #102b55);
  color: white;
  padding-bottom: 150px;
}

.chat {
  max-width: 600px;
  margin: auto;
}

/* =========================
   CABECERA
========================= */

.head {
  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  gap: 10px;

  padding: 12px 14px;

  background: rgba(7,21,47,.98);

  border-bottom: 1px solid rgba(255,255,255,.12);
}

.back {
  width: 42px;
  height: 42px;

  border: none;
  border-radius: 50%;

  background: rgba(255,255,255,.10);

  color: white;

  font-size: 22px;

  cursor: pointer;
}

.avatar {
  width: 46px;
  height: 46px;

  min-width: 46px;

  border-radius: 50%;

  object-fit: cover;

  border: 2px solid #d4af37;

  background: #eeeeee;
}

.name {
  font-weight: bold;
  font-size: 17px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status {
  font-size: 12px;

  color: #94a3b8;

  margin-top: 3px;
}

.online {
  color: #4ade80;
}

.block {
  margin-left: auto;

  border: none;

  border-radius: 10px;

  padding: 9px;

  background: rgba(239,68,68,.15);

  color: #fca5a5;

  font-size: 14px;

  cursor: pointer;
}


/* =========================
   MENSAJES
========================= */

.msgs {
  padding: 18px 12px;

  min-height:
    calc(100vh - 170px);

  display: flex;

  flex-direction: column;

  gap: 8px;

  overflow-y: auto;
}

.loading {
  text-align: center;

  padding: 35px 10px;

  color: #cbd5e1;
}

.row {
  display: flex;

  width: 100%;
}

.mine {
  justify-content: flex-end;
}

.other {
  justify-content: flex-start;
}

.bubble {
  max-width: 82%;

  padding: 10px 12px;

  border-radius: 18px;

  word-break: break-word;

  box-shadow:
    0 5px 15px rgba(0,0,0,.16);
}

.mine .bubble {

  background:
    linear-gradient(
      135deg,
      #d4af37,
      #f0cf62
    );

  color: #07152f;

  border-bottom-right-radius: 5px;
}

.other .bubble {

  background: white;

  color: #172033;

  border-bottom-left-radius: 5px;
}

.text {

  white-space: pre-wrap;

  line-height: 1.4;

  font-size: 15px;
}

.time {

  text-align: right;

  font-size: 10px;

  opacity: .7;

  margin-top: 4px;
}

.blue {

  color: #2563eb;

  font-weight: bold;
}


/* =========================
   COMPOSER
========================= */

.composer {

  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 500;

  background:
    rgba(7,21,47,.98);

  border-top:
    1px solid
    rgba(255,255,255,.12);

  padding: 10px;
}

.compose {

  max-width: 600px;

  margin: auto;

  display: flex;

  gap: 8px;

  align-items: flex-end;
}

#input {

  flex: 1;

  min-height: 45px;

  max-height: 120px;

  resize: none;

  border: none;

  outline: none;

  border-radius: 18px;

  padding:
    12px 14px;

  font-size: 15px;

  background: white;

  color: #172033;
}

#send {

  width: 46px;

  height: 46px;

  border: none;

  border-radius: 50%;

  background: #d4af37;

  color: #07152f;

  font-size: 20px;

  cursor: pointer;
}

#send:disabled {

  opacity: .5;

  cursor: not-allowed;
}


/* =========================
   NAV
========================= */

.nav {

  position: fixed;

  left: 8px;
  right: 8px;

  bottom: 70px;

  height: 62px;

  max-width: 600px;

  margin: auto;

  z-index: 450;

  display: grid;

  grid-template-columns:
    repeat(5,1fr);

  background:
    rgba(7,21,47,.97);

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius: 20px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.4);
}

.nav a {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  color: #cbd5e1;

  text-decoration: none;

  font-size: 10px;

  font-weight: bold;

  gap: 2px;
}

.nav a.active {

  color: #d4af37;
}

.badge {

  position: absolute;

  top: 3px;

  right: 14%;

  min-width: 18px;

  height: 18px;

  padding: 2px 5px;

  border-radius: 20px;

  background: #ef4444;

  color: white;

  font-size: 10px;

  display: none;

  align-items: center;

  justify-content: center;
}


/* =========================
   BLOQUEADO
========================= */

.notice {

  display: none;

  position: fixed;

  left: 0;
  right: 0;

  bottom: 0;

  z-index: 600;

  padding: 14px;

  background: #7f1d1d;

  color: white;

  text-align: center;

  font-size: 14px;
}

.notice.show {

  display: block;
}


/* =========================
   TOAST
========================= */

.toast {

  position: fixed;

  left: 50%;

  bottom: 145px;

  transform:
    translateX(-50%);

  background: #111827;

  color: white;

  padding:
    12px 17px;

  border-radius: 14px;

  display: none;

  z-index: 2000;
}

.toast.show {

  display: block;
}

</style>

</head>


<body>


<div class="chat">


<!-- =========================
     CABECERA
========================= -->

<header class="head">

<button
  class="back"
  onclick="volverMatches()"
>
←
</button>


<div id="photo">

  <div
    class="avatar"
    style="
      display:flex;
      align-items:center;
      justify-content:center;
    "
  >
    👤
  </div>

</div>


<div
  style="
    flex:1;
    min-width:0;
  "
>

<div
  id="name"
  class="name"
>
Cargando...
</div>


<div
  id="status"
  class="status"
>
⏳
</div>

</div>


<button
  class="block"
  onclick="bloquear()"
>
🚫
</button>

</header>



<!-- =========================
     MENSAJES
========================= -->

<main
  id="msgs"
  class="msgs"
>

<div class="loading">

⏳ Cargando conversación...

</div>

</main>

</div>



<!-- =========================
     NAVEGACIÓN
========================= -->

<nav class="nav">


<a href="./perfil.html">

👤

<span>
Perfil
</span>

</a>


<a href="./descubrir.html">

🔎

<span>
Descubrir
</span>

</a>


<a href="./likes.html">

❤️

<span>
Me gustas
</span>

</a>


<a
  href="./chat.html"
  class="active"
>

💕 

<span>
Matches
</span>

</a>


<a
  href="./notificaciones.html"
  style="position:relative"
>

🔔

<span>
Notificaciones
</span>


<b
  id="badge"
  class="badge"
>
0
</b>

</a>

</nav>



<!-- =========================
     COMPOSER
========================= -->

<div class="composer">

<div class="compose">


<textarea
  id="input"
  placeholder="Escribí un mensaje..."
  maxlength="2000"
  rows="1"
></textarea>


<button
  id="send"
  onclick="enviar()"
>
➤
</button>


</div>

</div>



<!-- =========================
     BLOQUEADO
========================= -->

<div
  id="notice"
  class="notice"
>

🚫 Esta conversación está bloqueada.

</div>



<!-- =========================
     TOAST
========================= -->

<div
  id="toast"
  class="toast"
>
</div>



<script>


/* =========================
   SUPABASE
========================= */

const URL_SUPA =
"https://kngiadwaesdbmvwivdev.supabase.co";


const KEY_SUPA =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const sb =
supabase.createClient(
  URL_SUPA,
  KEY_SUPA
);



/* =========================
   VARIABLES
========================= */

let me = null;

let other = null;

let match = null;

let blocked = false;

let channel = null;



/* =========================
   INICIAR
========================= */

async function init() {

  try {

    const {
      data
    } =
      await sb.auth.getSession();


    if (
      !data.session
    ) {

      location.href =
        "./index.html";

      return;

    }


    me =
      data.session.user;


    const params =
      new URLSearchParams(
        location.search
      );


    other =
      params.get(
        "user"
      );


    if (!other) {

      location.href =
        "./chat.html";

      return;

    }


    await profile();


    await findMatch();


    if (!match) {

      show(
        "⚠️ No existe un Match entre estas cuentas."
      );

      return;

    }


    await checkBlock();


    await load();


    await read();


    await badge();


    realtime();

  }

  catch(error) {

    console.error(
      "ERROR:",
      error
    );

    show(
      "❌ Error al cargar la conversación."
    );

  }

}



/* =========================
   PERFIL
========================= */

async function profile() {

  const {
    data,
    error
  } =
    await sb
      .from("profiles")
      .select(
        "id,nombre,edad,foto_url,online"
      )
      .eq(
        "id",
        other
      )
      .maybeSingle();


  if (error) {

    console.error(
      "Error perfil:",
      error
    );

    return;

  }


  if (!data) {

    return;

  }


  document.getElementById(
    "name"
  ).textContent =

    (data.nombre ||
      "Usuario")

    +

    (
      data.edad
      ? ", " + data.edad
      : ""
    );


  const status =
    document.getElementById(
      "status"
    );


  if (
    data.online
  ) {

    status.innerHTML =
      '<span class="online">● En línea</span>';

  }

  else {

    status.textContent =
      "Última conexión reciente";

  }


  if (
    data.foto_url
  ) {

    const photo =
      document.getElementById(
        "photo"
      );


    photo.innerHTML = `

      <img
        class="avatar"
        src="${esc(data.foto_url)}"
        alt="Foto"
        onerror="
          this.style.display='none';
        "
      >

    `;

  }

}



/* =========================
   BUSCAR MATCH
========================= */

async function findMatch() {

  const {
    data,
    error
  } =
    await sb
      .from("matches")
      .select(
        "id,user1_id,user2_id"
      )
      .or(

        "and(user1_id.eq." +
        me.id +
        ",user2_id.eq." +
        other +
        "),and(user1_id.eq." +
        other +
        ",user2_id.eq." +
        me.id +
        ")"

      )
      .limit(1);


  if (error) {

    console.error(
      "Error buscando Match:",
      error
    );

    return;

  }


  if (
    data &&
    data.length
  ) {

    match =
      data[0];

  }

}



/* =========================
   CARGAR MENSAJES
========================= */

async function load() {

  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select(
        "id,sender_id,content,created_at,read_at,delivered_at"
      )
      .eq(
        "match_id",
        match.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Error mensajes:",
      error
    );

    show(
      "❌ No se pudieron cargar los mensajes."
    );

    return;

  }


  render(
    data || []
  );

}



/* =========================
   MOSTRAR MENSAJES
========================= */

function render(
  list
) {

  const box =
    document.getElementById(
      "msgs"
    );


  if (
    !list.length
  ) {

    box.innerHTML = `

      <div class="loading">

        💬 Comenzá la conversación

      </div>

    `;

    return;

  }


  box.innerHTML =
    "";


  list.forEach(
    message => {

      const mine =
        message.sender_id ===
        me.id;


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "row " +
        (
          mine
          ? "mine"
          : "other"
        );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      const text =
        document.createElement(
          "div"
        );


      text.className =
        "text";


      text.textContent =
        message.content;


      const time =
        document.createElement(
          "div"
        );


      time.className =
        "time";


      time.textContent =
        new Date(
          message.created_at
        )
        .toLocaleTimeString(
          "es-AR",
          {
            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );


      if (mine) {

        const check =
          document.createElement(
            "span"
          );


        if (
          message.read_at
        ) {

          check.textContent =
            "  ✓✓";

          check.className =
            "blue";

        }

        else if (
          message.delivered_at
        ) {

          check.textContent =
            "  ✓✓";

        }

        else {

          check.textContent =
            "  ✓";

        }


        time.appendChild(
          check
        );

      }


      bubble.appendChild(
        text
      );


      bubble.appendChild(
        time
      );


      row.appendChild(
        bubble
      );


      box.appendChild(
        row
      );

    }
  );


  box.scrollTop =
    box.scrollHeight;

}



/* =========================
   MARCAR LEÍDOS
========================= */

async function read() {

  if (!match) {

    return;

  }


  const now =
    new Date()
      .toISOString();


  await sb
    .from("messages")
    .update({

      delivered_at:
        now

    })
    .eq(
      "match_id",
      match.id
    )
    .neq(
      "sender_id",
      me.id
    )
    .is(
      "delivered_at",
      null
    );


  await sb
    .from("messages")
    .update({

      read_at:
        now,

      delivered_at:
        now

    })
    .eq(
      "match_id",
      match.id
    )
    .neq(
      "sender_id",
      me.id
    )
    .is(
      "read_at",
      null
    );

}



/* =========================
   ENVIAR MENSAJE
========================= */

async function enviar() {

  if (
    blocked ||
    !match
  ) {

    return;

  }


  const input =
    document.getElementById(
      "input"
    );


  const button =
    document.getElementById(
      "send"
    );


  const content =
    input.value.trim();


  if (!content) {

    return;

  }


  button.disabled =
    true;


  const {
    error
  } =
    await sb
      .from("messages")
      .insert({

        match_id:
          match.id,

        sender_id:
          me.id,

        content:
          content

      });


  button.disabled =
    false;


  if (error) {

    console.error(
      "Error enviando:",
      error
    );


    showToast(
      "❌ No se pudo enviar el mensaje."
    );


    return;

  }


  input.value =
    "";


  await load();


  await badge();

}



/* =========================
   ENTER
========================= */

document
  .getElementById(
    "input"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
          "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        enviar();

      }

    }
  );



/* =========================
   REALTIME
========================= */

function realtime() {

  if (!match) {

    return;

  }


  channel =
    sb
      .channel(
        "chat-" +
        match.id
      )


      .on(
        "postgres_changes",

        {
          event:
            "INSERT",

          schema:
            "public",

          table:
            "messages",

          filter:
            "match_id=eq." +
            match.id
        },

        async payload => {

          await load();


          if (
            payload.new.sender_id !==
            me.id
          ) {

            await read();

          }


          await badge();

        }

      )


      .on(
        "postgres_changes",

        {
          event:
            "UPDATE",

          schema:
            "public",

          table:
            "messages",

          filter:
            "match_id=eq." +
            match.id
        },

        async () => {

          await load();

        }

      )


      .subscribe();

}



/* =========================
   BLOQUEO
========================= */

async function checkBlock() {

  const {
    data,
    error
  } =
    await sb
      .from("user_blocks")
      .select(
        "blocker_id,blocked_id"
      )
      .or(

        "and(blocker_id.eq." +
        me.id +
        ",blocked_id.eq." +
        other +
        "),and(blocker_id.eq." +
        other +
        ",blocked_id.eq." +
        me.id +
        ")"

      );


  if (error) {

    console.error(
      "Error bloqueo:",
      error
    );

    return;

  }


  blocked =
    !!(
      data &&
      data.length
    );


  updateBlock();

}



/* =========================
   ACTUALIZAR BLOQUEO
========================= */

function updateBlock() {

  const input =
    document.getElementById(
      "input"
    );


  const button =
    document.getElementById(
      "send"
    );


  const notice =
    document.getElementById(
      "notice"
    );


  if (blocked) {

    input.disabled =
      true;

    button.disabled =
      true;

    input.placeholder =
      "Conversación bloqueada";

    notice.classList.add(
      "show"
    );

  }

  else {

    input.disabled =
      false;

    button.disabled =
      false;

    input.placeholder =
      "Escribí un mensaje...";

    notice.classList.remove(
      "show"
    );

  }

}



/* =========================
   BLOQUEAR USUARIO
========================= */

async function bloquear() {

  if (!other) {

    return;

  }


  const confirmar =
    confirm(
      "¿Querés bloquear a este usuario?"
    );


  if (!confirmar) {

    return;

  }


  const {
    error
  } =
    await sb
      .from("user_blocks")
      .insert({

        blocker_id:
          me.id,

        blocked_id:
          other

      });


  if (error) {

    console.error(
      "Error bloqueando:",
      error
    );


    showToast(
      "❌ No se pudo bloquear."
    );


    return;

  }


  blocked =
    true;


  updateBlock();


  showToast(
    "🚫 Usuario bloqueado"
  );

}



/* =========================
   BADGE
========================= */

async function badge() {

  const badgeElement =
    document.getElementById(
      "badge"
    );


  const {
    data,
    error
  } =
    await sb
      .from("messages")
      .select(
        "id"
      )
      .neq(
        "sender_id",
        me.id
      )
      .is(
        "read_at",
        null
      );


  if (error) {

    console.error(
      "Error badge:",
      error
    );

    return;

  }


  const cantidad =
    data
      ? data.length
      : 0;


  if (
    cantidad > 0
  ) {

    badgeElement.textContent =
      cantidad > 99
        ? "99+"
        : cantidad;


    badgeElement.style.display =
      "flex";

  }

  else {

    badgeElement.style.display =
      "none";

  }

}



/* =========================
   UTILIDADES
========================= */

function esc(
  value
) {

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function show(
  message
) {

  document.getElementById(
    "msgs"
  ).innerHTML = `

    <div class="loading">

      ${esc(message)}

    </div>

  `;

}


function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    function() {

      toast.classList.remove(
        "show"
      );

    },
    2500
  );

}


function volverMatches() {

  window.location.href =
    "./chat.html";

}



/* =========================
   ARRANCAR
========================= */

init();

</script>

</body>

  </html>
