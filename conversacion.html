<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conversación · EmiMatch</title>

  <meta name="theme-color" content="#07152f">
  <meta name="description" content="Conversación privada de EmiMatch.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(124,58,237,.20), transparent 35%),
        linear-gradient(145deg, #07152f, #102b5c);
      color: #172033;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100dvh;
      min-height: 100vh;
      margin: auto;
      background: #f4f7fb;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .header {
      flex-shrink: 0;
      height: 70px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      background: linear-gradient(135deg, #07152f, #123b91 65%, #4c1d95);
      color: white;
      box-shadow: 0 5px 18px rgba(0,0,0,.22);
      z-index: 10;
    }

    .back,
    .block-btn {
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .18s ease;
    }

    .back {
      width: 42px;
      height: 42px;
      background: rgba(255,255,255,.10);
      font-size: 31px;
      line-height: 1;
    }

    .back:active,
    .block-btn:active {
      transform: scale(.92);
      background: rgba(255,255,255,.18);
    }

    .avatar-wrap {
      position: relative;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      background: #dbe2ed;
      border: 2px solid rgba(255,255,255,.75);
      display: block;
    }

    .online-dot {
      position: absolute;
      right: 0;
      bottom: 1px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
      border: 2px solid #123b91;
      display: none;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info strong {
      display: block;
      font-size: 16px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      font-size: 11px;
      opacity: .88;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .block-btn {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,.08);
      font-size: 18px;
    }

    .block-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .messages {
      flex: 1;
      min-height: 0;
      padding: 18px 13px 12px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 7px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;

      background:
        radial-gradient(circle at 15% 10%, rgba(124,58,237,.05), transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(212,175,55,.05), transparent 25%),
        #f4f7fb;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .message {
      position: relative;
      max-width: 80%;
      padding: 10px 13px 8px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.42;
      word-break: break-word;
      overflow-wrap: anywhere;
      box-shadow: 0 3px 10px rgba(0,0,0,.07);
      animation: aparecer .18s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .mine {
      align-self: flex-end;
      background: linear-gradient(135deg, #123b91, #2563eb);
      color: white;
      border-bottom-right-radius: 5px;
      box-shadow: 0 4px 12px rgba(18,59,145,.20);
    }

    .theirs {
      align-self: flex-start;
      background: white;
      color: #172033;
      border-bottom-left-radius: 5px;
      border: 1px solid #e5eaf2;
    }

    .time {
      display: block;
      font-size: 9px;
      opacity: .72;
      margin-top: 5px;
      text-align: right;
      white-space: nowrap;
    }

    .checks {
      margin-left: 4px;
      font-size: 11px;
      letter-spacing: -2px;
    }

    .read {
      color: #5ee7ff;
    }

    .typing {
      flex-shrink: 0;
      min-height: 25px;
      padding: 3px 16px 5px;
      font-size: 11px;
      color: #64748b;
      font-style: italic;
      background: #f4f7fb;
    }

    .composer {
      flex-shrink: 0;
      width: 100%;
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.97);
      border-top: 1px solid #e1e6ef;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      z-index: 20;
      box-shadow: 0 -5px 18px rgba(0,0,0,.07);
    }

    .composer textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: 1px solid #d6dce7;
      border-radius: 21px;
      padding: 11px 14px;
      outline: none;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.35;
      min-height: 43px;
      max-height: 105px;
      background: #f8fafc;
      color: #172033;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .composer textarea:focus {
      border-color: #4c6fd8;
      box-shadow: 0 0 0 3px rgba(76,111,216,.10);
      background: white;
    }

    .composer textarea::placeholder {
      color: #94a3b8;
    }

    .send {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #123b91, #4c1d95);
      color: white;
      font-size: 19px;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(18,59,145,.25);
      transition: .18s ease;
    }

    .send:active {
      transform: scale(.92);
    }

    .send:disabled {
      opacity: .45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .empty,
    .error {
      width: 100%;
      max-width: 320px;
      text-align: center;
      margin: auto;
      color: #64748b;
      padding: 30px 20px;
      line-height: 1.5;
    }

    .bloqueado-info {
      margin: 8px auto 4px;
      max-width: 330px;
      padding: 9px 14px;
      border-radius: 14px;
      background: #fff7ed;
      color: #9a3412;
      font-size: 12px;
      text-align: center;
      border: 1px solid #fed7aa;
    }

    @media (min-width: 701px) {
      .app {
        box-shadow: 0 0 50px rgba(0,0,0,.30);
      }

      .header {
        height: 74px;
      }

      .messages {
        padding-left: 22px;
        padding-right: 22px;
      }

      .composer {
        padding-left: 18px;
        padding-right: 18px;
      }
    }

    @media (max-width: 380px) {
      .header {
        height: 64px;
        padding: 8px 9px;
        gap: 8px;
      }

      .back {
        width: 38px;
        height: 38px;
        font-size: 28px;
      }

      .avatar-wrap,
      .avatar {
        width: 42px;
        height: 42px;
      }

      .block-btn {
        width: 37px;
        height: 37px;
        font-size: 16px;
      }

      .header-info strong {
        font-size: 15px;
      }

      .status {
        font-size: 10px;
      }

      .messages {
        padding: 14px 9px 9px;
      }

      .message {
        max-width: 86%;
        font-size: 14px;
        padding: 9px 11px 7px;
      }

      .composer {
        padding: 7px;
      }

      .composer textarea {
        font-size: 14px;
        padding: 10px 12px;
      }

      .send {
        width: 42px;
        height: 42px;
        min-width: 42px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <button
      class="back"
      onclick="volver()"
      aria-label="Volver"
      type="button"
    >
      ‹
    </button>

    <div class="avatar-wrap">
      <img
        id="avatar"
        class="avatar"
        src="https://via.placeholder.com/100"
        alt="Foto de perfil"
      >

      <div
        id="onlineDot"
        class="online-dot"
      ></div>
    </div>

    <div class="header-info">
      <strong id="nombreUsuario">Cargando...</strong>

      <div
        id="estadoUsuario"
        class="status"
      >
        ⏳
      </div>
    </div>

    <button
      id="btnBloquear"
      class="block-btn"
      onclick="bloquearUsuario()"
      title="Bloquear"
      aria-label="Bloquear usuario"
      type="button"
    >
      🚫
    </button>

  </header>

  <main
    id="messages"
    class="messages"
  >
    <div class="empty">
      ⏳ Cargando conversación...
    </div>
  </main>

  <div
    id="typing"
    class="typing"
    aria-live="polite"
  ></div>

  <div class="composer">

    <textarea
      id="inputMensaje"
      placeholder="Escribí un mensaje..."
      rows="1"
      maxlength="2000"
      disabled
    ></textarea>

    <button
      id="btnEnviar"
      class="send"
      onclick="enviarMensaje()"
      disabled
      aria-label="Enviar mensaje"
      type="button"
    >
      ➤
    </button>

  </div>

</div>

<script>
"use strict";

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let usuarioActual = null;
let usuarioDestino = null;
let matchActual = null;
let bloqueado = false;
let canalMensajes = null;

const params =
  new URLSearchParams(
    window.location.search
  );

const destinoId =
  params.get("user");

const messagesDiv =
  document.getElementById("messages");

const inputMensaje =
  document.getElementById("inputMensaje");

const btnEnviar =
  document.getElementById("btnEnviar");

const btnBloquear =
  document.getElementById("btnBloquear");

const typingDiv =
  document.getElementById("typing");

async function iniciar() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    const session =
      data?.session;

    if (!session) {

      window.location.href =
        "index.html";

      return;
    }

    usuarioActual =
      session.user;

    if (!destinoId) {

      mostrarError(
        "No se encontró el usuario."
      );

      desactivarChat();

      return;
    }

    if (
      destinoId ===
      usuarioActual.id
    ) {

      mostrarError(
        "No podés abrir una conversación con tu propia cuenta."
      );

      desactivarChat();

      return;
    }

    await cargarUsuario();
    await cargarMatch();
    await comprobarBloqueo();
    await cargarMensajes();

    activarRealtimeMensajes();
    activarInputMensaje();

  } catch (error) {

    console.error(
      "Error al iniciar conversación:",
      error
    );

    mostrarError(
      "No se pudo cargar la conversación."
    );

    desactivarChat();
  }
}

async function cargarUsuario() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("id,nombre,foto_url")
      .eq("id", destinoId)
      .maybeSingle();

  if (error) {
    throw error;
  }

  if (!data) {

    throw new Error(
      "No se encontró el perfil."
    );
  }

  usuarioDestino =
    data;

  document.getElementById(
    "nombreUsuario"
  ).textContent =
    data.nombre ||
    "Usuario";

  document.getElementById(
    "avatar"
  ).src =
    data.foto_url ||
    "https://via.placeholder.com/100";

  actualizarEstadoUsuario();
}

function actualizarEstadoUsuario() {

  const estado =
    document.getElementById(
      "estadoUsuario"
    );

  const onlineDot =
    document.getElementById(
      "onlineDot"
    );

  if (bloqueado) {

    estado.textContent =
      "🚫 Usuario bloqueado";

    onlineDot.style.display =
      "none";

    return;
  }

  estado.textContent =
    "💬 Conversación";

  onlineDot.style.display =
    "none";
}

async function cargarMatch() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id,created_at"
      )
      .or(
        `and(user1_id.eq.${usuarioActual.id},user2_id.eq.${destinoId}),and(user1_id.eq.${destinoId},user2_id.eq.${usuarioActual.id})`
      )
      .limit(1);

  if (error) {
    throw error;
  }

  if (
    !data ||
    data.length === 0
  ) {

    throw new Error(
      "No existe un Match válido con este usuario."
    );
  }

  matchActual =
    data[0];
}

async function comprobarBloqueo() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_blocks")
      .select(
        "id,blocker_id,blocked_id"
      )
      .or(
        `and(blocker_id.eq.${usuarioActual.id},blocked_id.eq.${destinoId}),and(blocker_id.eq.${destinoId},blocked_id.eq.${usuarioActual.id})`
      );

  if (error) {

    console.warn(
      "No se pudo comprobar el bloqueo:",
      error
    );

    bloqueado = false;

  } else {

    bloqueado =
      Array.isArray(data) &&
      data.length > 0;
  }

  actualizarEstadoUsuario();

  if (bloqueado) {

    inputMensaje.disabled =
      true;

    btnEnviar.disabled =
      true;

    btnBloquear.disabled =
      true;

    mostrarAvisoBloqueado();

    return;
  }

  inputMensaje.disabled =
    false;

  btnEnviar.disabled =
    true;

  btnBloquear.disabled =
    false;
}

function mostrarAvisoBloqueado() {

  const existente =
    document.getElementById(
      "bloqueadoInfo"
    );

  if (existente) {
    return;
  }

  const aviso =
    document.createElement(
      "div"
    );

  aviso.id =
    "bloqueadoInfo";

  aviso.className =
    "bloqueado-info";

  aviso.textContent =
    "🚫 Esta conversación está bloqueada.";

  messagesDiv.parentNode.insertBefore(
    aviso,
    messagesDiv
  );
}

async function cargarMensajes() {

  if (!matchActual) {
    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(
        "id,match_id,sender_id,content,created_at"
      )
      .eq(
        "match_id",
        matchActual.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );

  if (error) {
    throw error;
  }

  messagesDiv.innerHTML =
    "";

  if (
    !data ||
    data.length === 0
  ) {

    messagesDiv.innerHTML = `
      <div class="empty">
        💬 Todavía no hay mensajes.<br>
        ¡Comenzá la conversación!
      </div>
    `;

  } else {

    for (
      const mensaje of data
    ) {

      mostrarMensaje(
        mensaje
      );
    }
  }

  if (!bloqueado) {

    inputMensaje.disabled =
      false;
  }

  actualizarEstadoBotonEnviar();

  bajarAlFinal();
}

function mostrarMensaje(mensaje) {

  if (!mensaje?.id) {
    return;
  }

  const existente =
    messagesDiv.querySelector(
      `[data-message-id="${mensaje.id}"]`
    );

  if (existente) {
    return;
  }

  const vacio =
    messagesDiv.querySelector(
      ".empty"
    );

  if (vacio) {
    vacio.remove();
  }

  const mio =
    mensaje.sender_id ===
    usuarioActual.id;

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " +
    (
      mio
        ? "mine"
        : "theirs"
    );

  div.dataset.messageId =
    mensaje.id;

  const contenido =
    document.createElement(
      "div"
    );

  contenido.textContent =
    mensaje.content || "";

  const hora =
    document.createElement(
      "span"
    );

  hora.className =
    "time";

  const fecha =
    new Date(
      mensaje.created_at
    );

  hora.textContent =
    fecha.toLocaleTimeString(
      "es-AR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  if (mio) {

    const checks =
      document.createElement(
        "span"
      );

    checks.className =
      "checks";

    checks.textContent =
      "✓";

    hora.appendChild(
      checks
    );
  }

  div.appendChild(
    contenido
  );

  div.appendChild(
    hora
  );

  messagesDiv.appendChild(
    div
  );
}
  function activarRealtimeMensajes() {

  if (!matchActual) {
    return;
  }

  if (canalMensajes) {

    try {

      supabaseClient.removeChannel(
        canalMensajes
      );

    } catch (_) {}

    canalMensajes =
      null;
  }

  canalMensajes =
    supabaseClient
      .channel(
        "emimatch-messages-" +
        matchActual.id
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter:
            "match_id=eq." +
            matchActual.id
        },
        (payload) => {

          const mensaje =
            payload?.new;

          if (!mensaje?.id) {
            return;
          }

          mostrarMensaje(
            mensaje
          );

          bajarAlFinal();
        }
      )
      .subscribe(
        (status) => {

          console.log(
            "Realtime mensajes:",
            status
          );
        }
      );
}


/* =========================================================
   INPUT
========================================================= */

function activarInputMensaje() {

  inputMensaje.addEventListener(
    "input",
    () => {

      ajustarAlturaInput();
      actualizarEstadoBotonEnviar();

    }
  );

  inputMensaje.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        enviarMensaje();
      }
    }
  );
}


/* =========================================================
   ALTURA DEL INPUT
========================================================= */

function ajustarAlturaInput() {

  inputMensaje.style.height =
    "auto";

  inputMensaje.style.height =
    Math.min(
      inputMensaje.scrollHeight,
      105
    ) + "px";
}


/* =========================================================
   BOTÓN ENVIAR
========================================================= */

function actualizarEstadoBotonEnviar() {

  const texto =
    inputMensaje.value.trim();

  btnEnviar.disabled =
    bloqueado ||
    !matchActual ||
    texto.length === 0;
}


/* =========================================================
   ENVIAR MENSAJE
   PREMIUM AISLADO
========================================================= */

async function enviarMensaje() {

  if (
    bloqueado ||
    !matchActual ||
    !usuarioActual
  ) {
    return;
  }

  const contenido =
    inputMensaje.value.trim();

  if (!contenido) {
    return;
  }

  if (
    contenido.length > 2000
  ) {

    alert(
      "El mensaje no puede superar los 2000 caracteres."
    );

    return;
  }

  btnEnviar.disabled =
    true;

  inputMensaje.disabled =
    true;

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({
          match_id:
            matchActual.id,

          sender_id:
            usuarioActual.id,

          content:
            contenido
        })
        .select(
          "id,match_id,sender_id,content,created_at"
        )
        .single();

    if (error) {
      throw error;
    }

    mostrarMensaje(
      data
    );

    inputMensaje.value =
      "";

    ajustarAlturaInput();

    actualizarEstadoBotonEnviar();

    bajarAlFinal();

  } catch (error) {

    console.error(
      "Error enviando mensaje:",
      error
    );

    /*
      Detectamos únicamente el error
      correspondiente al límite gratuito.
    */

    const textoError = [
      error?.message,
      error?.details,
      error?.hint,
      error?.code
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    const esLimitePremium =
      textoError.includes(
        "free_message_limit"
      ) ||
      textoError.includes(
        "free message limit"
      ) ||
      textoError.includes(
        "free-message-limit"
      ) ||
      textoError.includes(
        "alcanzaste el límite"
      ) ||
      textoError.includes(
        "mensajes gratuitos"
      ) ||
      error?.code === "P0001";

    if (esLimitePremium) {

      mostrarPremiumLimitPrompt();

      return;
    }

    alert(
      "No se pudo enviar el mensaje: " +
      (
        error?.message ||
        "Error desconocido"
      )
    );

  } finally {

    if (!bloqueado) {

      inputMensaje.disabled =
        false;
    }

    actualizarEstadoBotonEnviar();
  }

/* =========================================================
   BLOQUEAR USUARIO
========================================================= */

async function bloquearUsuario() {

  if (
    !usuarioActual ||
    !destinoId ||
    bloqueado
  ) {
    return;
  }

  const confirmar =
    window.confirm(
      "¿Querés bloquear a este usuario?"
    );

  if (!confirmar) {
    return;
  }

  btnBloquear.disabled =
    true;

  try {

    const {
      error
    } =
      await supabaseClient
        .from("user_blocks")
        .upsert(
          {
            blocker_id:
              usuarioActual.id,

            blocked_id:
              destinoId
          },
          {
            onConflict:
              "blocker_id,blocked_id"
          }
        );

    if (error) {
      throw error;
    }

    bloqueado =
      true;

    inputMensaje.disabled =
      true;

    btnEnviar.disabled =
      true;

    mostrarAvisoBloqueado();

    actualizarEstadoUsuario();

  } catch (error) {

    console.error(
      "Error bloqueando usuario:",
      error
    );

    alert(
      "No se pudo bloquear al usuario: " +
      (
        error?.message ||
        "Error desconocido"
      )
    );

    btnBloquear.disabled =
      false;
  }
}

   DESACTIVAR CHAT
========================================================= */

function desactivarChat() {

  inputMensaje.disabled =

  btnEnviar.disabled =

  btnBloquear.disabled =

}


/* =========================================================

========================================================= */

function mostrarError(
  mensaje
) {

  messagesDiv.innerHTML =
    "";

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "error";

  div.textContent =
    "⚠️ " +
    mensaje;

  messagesDiv.appendChild(
    div
  );
}


/* =========================================================
   BAJAR AL FINAL
========================================================= */

function bajarAlFinal() {

  requestAnimationFrame(
    () => {

      messagesDiv.scrollTop =
        messagesDiv.scrollHeight;
    }
  );
}


/* =========================================================
   VOLVER
========================================================= */

function volver() {

  if (
    document.referrer &&
    document.referrer.includes(
      "emimatch.github.io"
    )
  ) {

    history.back();

    return;
  }

  window.location.href =
    "matches.html";
}
