<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Conversación</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #071a3d, #123b78);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .volver {
      background: white;
      color: #123b78;
      border: none;
      border-radius: 8px;
      padding: 9px 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .perfil {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .foto {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .nombre {
      font-size: 18px;
      font-weight: bold;
    }

    .datos {
      font-size: 13px;
      opacity: .85;
      margin-top: 3px;
    }

    #estado {
      text-align: center;
      padding: 20px;
      color: #555;
    }

    #mensajes {
      height: calc(100vh - 160px);
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mensaje {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 15px;
      word-wrap: break-word;
      font-size: 15px;
    }

    .mio {
      align-self: flex-end;
      background: #123b78;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .otro {
      align-self: flex-start;
      background: white;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .hora {
      font-size: 10px;
      opacity: .65;
      margin-top: 4px;
      text-align: right;
    }

    .barra {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 10px;
      display: flex;
      gap: 8px;
      box-shadow: 0 -2px 8px rgba(0,0,0,.1);
    }

    #mensajeInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 22px;
      padding: 11px 15px;
      font-size: 15px;
      outline: none;
    }

    #enviar {
      background: #123b78;
      color: white;
      border: none;
      border-radius: 22px;
      padding: 0 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #enviar:disabled {
      opacity: .5;
    }

    .error {
      color: #c62828 !important;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>

  <button class="volver" onclick="volverMatches()">
    ←
  </button>

  <div class="perfil">

    <img id="fotoPerfil"
         class="foto"
         src=""
         alt="Foto">

    <div>
      <div id="nombrePerfil" class="nombre">
        Cargando...
      </div>

      <div id="datosPerfil" class="datos">
        Conectando...
      </div>
    </div>

  </div>

</header>

<div id="estado">
  Cargando conversación...
</div>

<div id="mensajes"></div>

<div class="barra">

  <input
    id="mensajeInput"
    type="text"
    placeholder="Escribí un mensaje..."
    autocomplete="off"
  >

  <button id="enviar" onclick="enviarMensaje()">
    Enviar
  </button>

</div>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;
let otherUserId = null;
let matchId = null;


/* =========================
   INICIAR
========================= */

async function iniciar() {

  try {

    mostrarEstado("🔄 Iniciando conversación...");

    const params =
      new URLSearchParams(window.location.search);

    otherUserId =
      params.get("user");

    if (!otherUserId) {

      throw new Error(
        "No se encontró el usuario del Match."
      );

    }

    mostrarEstado(
      "🔄 Usuario encontrado. Verificando sesión..."
    );

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();

    if (sessionError) {
      throw sessionError;
    }

    if (!sessionData.session) {

      throw new Error(
        "No hay una sesión activa. Volvé a iniciar sesión."
      );

    }

    currentUser =
      sessionData.session.user;

    mostrarEstado(
      "🔄 Cargando perfil..."
    );

    await cargarPerfil();

    mostrarEstado(
      "🔄 Buscando Match..."
    );

    await buscarMatch();

    mostrarEstado(
      "🔄 Cargando mensajes..."
    );

    await cargarMensajes();

    activarTiempoReal();

    document.getElementById("estado").style.display =
      "none";

  } catch (error) {

    console.error(error);

    mostrarError(
      error.message ||
      "Ocurrió un error al cargar la conversación."
    );

  }

}


/* =========================
   PERFIL
========================= */

async function cargarPerfil() {

  const {
    data,
    error
  } = await supabaseClient

    .from("profiles")

    .select(
      "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
    )

    .eq("id", otherUserId)

    .maybeSingle();


  if (error) {
    throw error;
  }


  if (!data) {

    throw new Error(
      "No se encontró el perfil de esta persona."
    );

  }


  document.getElementById("nombrePerfil")
    .textContent =
      data.nombre || "Usuario";


  let datos = "";

  if (data.edad) {
    datos += data.edad + " años";
  }

  if (data.ciudad) {

    if (datos) {
      datos += " • ";
    }

    datos += data.ciudad;

  }


  document.getElementById("datosPerfil")
    .textContent =
      datos || "EmiMatch";


  const foto =
    document.getElementById("fotoPerfil");


  if (data.foto_url) {

    foto.src = data.foto_url;

  } else {

    foto.src =
      "https://via.placeholder.com/100";

  }

}


/* =========================
   BUSCAR MATCH
========================= */

async function buscarMatch() {

  /* Primero buscamos:
     usuario actual → otro usuario
  */

  const {
    data: match1,
    error: error1
  } = await supabaseClient

    .from("matches")

    .select("*")

    .eq("user1_id", currentUser.id)

    .eq("user2_id", otherUserId)

    .maybeSingle();


  if (error1) {
    throw error1;
  }


  if (match1) {

    matchId = match1.id;

    return;

  }


  /* Si no está, buscamos:
     otro usuario → usuario actual
  */

  const {
    data: match2,
    error: error2
  } = await supabaseClient

    .from("matches")

    .select("*")

    .eq("user1_id", otherUserId)

    .eq("user2_id", currentUser.id)

    .maybeSingle();


  if (error2) {
    throw error2;
  }


  if (match2) {

    matchId = match2.id;

    return;

  }


  throw new Error(
    "No existe un Match válido con esta persona."
  );

}


/* =========================
   CARGAR MENSAJES
========================= */

async function cargarMensajes() {

  const {
    data,
    error
  } = await supabaseClient

    .from("messages")

    .select(
      "id,match_id,sender_id,content,created_at"
    )

    .eq("match_id", matchId)

    .order(
      "created_at",
      {
        ascending: true
      }
    );


  if (error) {
    throw error;
  }


  mostrarMensajes(data || []);

}


/* =========================
   MOSTRAR MENSAJES
========================= */

function mostrarMensajes(lista) {

  const contenedor =
    document.getElementById("mensajes");

  contenedor.innerHTML = "";


  if (!lista.length) {

    const aviso =
      document.createElement("div");

    aviso.style.textAlign = "center";
    aviso.style.color = "#777";
    aviso.style.marginTop = "30px";

    aviso.textContent =
      "💕 Todavía no hay mensajes. ¡Comenzá la conversación!";

    contenedor.appendChild(aviso);

    return;

  }


  lista.forEach(mensaje => {

    mostrarMensaje(mensaje);

  });


  contenedor.scrollTop =
    contenedor.scrollHeight;

}


/* =========================
   MOSTRAR UN MENSAJE
========================= */

function mostrarMensaje(mensaje) {

  const contenedor =
    document.getElementById("mensajes");


  const div =
    document.createElement("div");


  div.className =
    "mensaje " +
    (
      mensaje.sender_id === currentUser.id
        ? "mio"
        : "otro"
    );


  const texto =
    document.createElement("div");

  texto.textContent =
    mensaje.content;


  const hora =
    document.createElement("div");

  hora.className = "hora";


  const fecha =
    new Date(mensaje.created_at);


  hora.textContent =
    fecha.toLocaleTimeString(
      "es-AR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  div.appendChild(texto);
  div.appendChild(hora);

  contenedor.appendChild(div);

}


/* =========================
   ENVIAR MENSAJE
========================= */

async function enviarMensaje() {

  const input =
    document.getElementById("mensajeInput");

  const boton =
    document.getElementById("enviar");


  const contenido =
    input.value.trim();


  if (!contenido) {
    return;
  }


  if (!matchId) {

    alert(
      "Todavía no se cargó el Match."
    );

    return;

  }


  boton.disabled = true;


  const {
    data,
    error
  } = await supabaseClient

    .from("messages")

    .insert({

      match_id: matchId,

      sender_id: currentUser.id,

      content: contenido

    })

    .select()

    .single();


  boton.disabled = false;


  if (error) {

    console
