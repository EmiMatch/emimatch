<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EmiMatch - Conversación</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #eef1f6;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      height: 70px;
      background: #101b3c;
      color: white;
      display: flex;
      align-items: center;
      padding: 10px 12px;
      gap: 10px;
      flex-shrink: 0;
    }

    .volver {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      color: white;
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
    }

    .foto-header {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      border: 2px solid rgba(255,255,255,.5);
    }

    .datos-header {
      min-width: 0;
      flex: 1;
    }

    .nombre {
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .estado {
      margin-top: 4px;
      font-size: 12px;
      color: #c7ccda;
    }

    .estado.online {
      color: #4ee27f;
    }

    /* MENSAJES */

    #mensajes {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background:
        linear-gradient(
          rgba(238,241,247,.95),
          rgba(238,241,247,.95)
        );
    }

    .cargando {
      text-align: center;
      color: #777;
      padding: 35px 15px;
      line-height: 1.6;
    }

    .error {
      margin: 20px 5px;
      padding: 15px;
      border-radius: 12px;
      background: #fff0f0;
      color: #b42318;
      text-align: center;
      line-height: 1.5;
      word-break: break-word;
    }

    .mensaje {
      display: flex;
      margin-bottom: 10px;
    }

    .mensaje.mio {
      justify-content: flex-end;
    }

    .mensaje.otro {
      justify-content: flex-start;
    }

    .burbuja {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }

    .mio .burbuja {
      background: #101b3c;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .otro .burbuja {
      background: white;
      color: #222;
      border-bottom-left-radius: 5px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .hora {
      display: block;
      text-align: right;
      margin-top: 4px;
      font-size: 10px;
      opacity: .65;
    }

    .check {
      margin-left: 4px;
      font-size: 11px;
    }

    .check.leido {
      color: #55aaff;
    }

    /* TYPING */

    .escribiendo {
      min-height: 22px;
      padding: 0 15px 3px;
      background: #eef1f7;
      color: #777;
      font-size: 12px;
    }

    /* INPUT */

    .input-area {
      width: 100%;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
    }

    #mensajeInput {
      flex: 1;
      min-width: 0;
      border: 1px solid #ccd2df;
      border-radius: 24px;
      padding: 12px 16px;
      font-size: 15px;
      outline: none;
    }

    #mensajeInput:focus {
      border-color: #101b3c;
    }

    #btnEnviar {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: #101b3c;
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    #btnEnviar:disabled {
      opacity: .5;
    }

  </style>

</head>


<body>


<div class="app">


  <!-- HEADER -->

  <div class="header">

    <button
      class="volver"
      onclick="volver()"
      aria-label="Volver"
    >
      ‹
    </button>


    <img
      id="fotoPerfil"
      class="foto-header"
      src="https://placehold.co/100x100?text=Foto"
      alt="Foto"
    >


    <div class="datos-header">

      <div
        id="nombrePerfil"
        class="nombre"
      >
        Cargando...
      </div>


      <div
        id="estadoPerfil"
        class="estado"
      >
        Conectando...
      </div>

    </div>

  </div>


  <!-- MENSAJES -->

  <div id="mensajes">

    <div class="cargando">
      Cargando conversación...
    </div>

  </div>


  <!-- TYPING -->

  <div
    id="escribiendo"
    class="escribiendo"
  ></div>


  <!-- INPUT -->

  <div class="input-area">

    <input
      id="mensajeInput"
      type="text"
      placeholder="Escribí un mensaje..."
      autocomplete="off"
    >


    <button
      id="btnEnviar"
      onclick="enviarMensaje()"
    >
      ➤
    </button>

  </div>


</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */


const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */


let usuarioActual = null;

let otroUsuario = null;

let matchActual = null;

let canalMensajes = null;

let canalTyping = null;

let canalPerfil = null;

let typingTimer = null;


/* =====================================================
   ELEMENTOS
===================================================== */


const nombrePerfil =
  document.getElementById(
    "nombrePerfil"
  );


const estadoPerfil =
  document.getElementById(
    "estadoPerfil"
  );


const fotoPerfil =
  document.getElementById(
    "fotoPerfil"
  );


const mensajes =
  document.getElementById(
    "mensajes"
  );


const mensajeInput =
  document.getElementById(
    "mensajeInput"
  );


const btnEnviar =
  document.getElementById(
    "btnEnviar"
  );


const escribiendo =
  document.getElementById(
    "escribiendo"
  );


/* =====================================================
   INICIAR
===================================================== */


async function iniciar() {

  try {

    console.log(
      "=== EmiMatch conversación ==="
    );


    /*
      1. COMPROBAR SESIÓN
    */


    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient
        .auth
        .getSession();


    if (sessionError) {

      throw new Error(
        "Error de sesión: " +
        sessionError.message
      );

    }


    if (
      !sessionData ||
      !sessionData.session
    ) {

      window.location.href =
        "./index.html";

      return;

    }


    usuarioActual =
      sessionData.session.user;


    console.log(
      "Usuario actual:",
      usuarioActual.id
    );


    /*
      2. OBTENER USER DE LA URL
    */


    const params =
      new URLSearchParams(
        window.location.search
      );


    otroUsuario =
      params.get("user");


    console.log(
      "Usuario destino:",
      otroUsuario
    );


    if (!otroUsuario) {

      mostrarError(
        "Falta el usuario en la dirección de la conversación."
      );

      return;

    }


    if (
      otroUsuario ===
      usuarioActual.id
    ) {

      mostrarError(
        "La conversación no puede ser con tu propia cuenta."
      );

      return;

    }


    /*
      3. BUSCAR PERFIL
    */


    await cargarPerfil();


    /*
      4. BUSCAR MATCH
    */


    await buscarMatch();


    if (!matchActual) {

      mostrarError(
        "No se encontró el Match entre estas dos cuentas."
      );

      return;

    }


    /*
      5. CARGAR MENSAJES
    */


    await cargarMensajes();


    /*
      6. MARCAR MENSAJES
    */


    await marcarEntregados();

    await marcarLeidos();


    /*
      7. ACTIVAR INPUT
    */


    prepararInput();


    /*
      8. REALTIME
    */


    escucharMensajes();

    escucharTyping();

    escucharPerfil();


    desplazarAbajo();


    console.log(
      "=== CONVERSACIÓN LISTA ==="
    );

  }

  catch (error) {

    console.error(
      "ERROR GENERAL:",
      error
    );


    mostrarError(
      "No se pudo cargar la conversación.<br><br>" +
      escapeHTML(
        error.message ||
        String(error)
      )
    );

  }

}


/* =====================================================
   CARGAR PERFIL
===================================================== */


async function cargarPerfil() {

  console.log(
    "Buscando perfil..."
  );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nombre,edad,ciudad,descripcion,foto_url,intereses,online,last_seen"
      )
      .eq(
        "id",
        otroUsuario
      )
      .maybeSingle();


  if (error) {

    throw new Error(
      "Error cargando perfil: " +
      error.message
    );

  }


  if (!data) {

    throw new Error(
      "El usuario no tiene un perfil creado todavía."
    );

  }


  console.log(
    "Perfil encontrado:",
    data
  );


  nombrePerfil.textContent =
    data.edad
      ? (
          data.nombre ||
          "Usuario"
        ) +
        ", " +
        data.edad
      : (
          data.nombre ||
          "Usuario"
        );


  if (data.foto_url) {

    fotoPerfil.src =
      data.foto_url;

  }


  actualizarEstado(
    data
  );

}


/* =====================================================
   ESTADO
===================================================== */


function actualizarEstado(
  perfil
) {

  estadoPerfil.classList.remove(
    "online"
  );


  if (
    perfil.online === true
  ) {

    estadoPerfil.textContent =
      "🟢 En línea";

    estadoPerfil.classList.add(
      "online"
    );

    return;

  }


  if (
    perfil.last_seen
  ) {

    estadoPerfil.textContent =
      "Última vez " +
      formatearFecha(
        perfil.last_seen
      );

    return;

  }


  estadoPerfil.textContent =
    "Desconectado";

}


/* =====================================================
   FORMATEAR FECHA
===================================================== */


function formatearFecha(
  fecha
) {

  const d =
    new Date(
      fecha
    );


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return "hace un momento";

  }


  return d.toLocaleString(
    "es-AR",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =====================================================
   BUSCAR MATCH
===================================================== */


async function buscarMatch() {

  console.log(
    "Buscando Match..."
  );


  /*
    Buscamos las dos posibilidades
    sin usar maybeSingle().
  */


  const {
    data,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id,created_at"
      )
      .or(
        "and(user1_id.eq." +
        usuarioActual.id +
        ",user2_id.eq." +
        otroUsuario +
        "),and(user1_id.eq." +
        otroUsuario +
        ",user2_id.eq." +
        usuarioActual.id +
        ")"
      )
      .limit(1);


  if (error) {

    throw new Error(
      "Error buscando Match: " +
      error.message
    );

  }


  if (
    !data ||
    data.length === 0
  ) {

    console.warn(
      "No existe Match."
    );

    matchActual =
      null;

    return;

  }


  matchActual =
    data[0];


  console.log(
    "MATCH ENCONTRADO:",
    matchActual
  );

}


/* =====================================================
   CARGAR MENSAJES
===================================================== */


async function cargarMensajes() {

  console.log(
    "Cargando mensajes..."
  );


  if (!matchActual) {

    throw new Error(
      "No existe un Match válido."
    );

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(
        "id,match_id,sender_id,content,created_at,delivered_at,read_at"
      )
      .eq(
        "match_id",
        matchActual.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    throw new Error(
      "Error cargando mensajes: " +
      error.message
    );

  }


  mensajes.innerHTML =
    "";


  if (
    !data ||
    data.length === 0
  ) {

    mensajes.innerHTML = `
      <div class="cargando">
        No hay mensajes todavía.<br>
        ¡Comenzá la conversación! 💬
      </div>
    `;

    return;

  }


  data.forEach(
    mensaje => {

      mostrarMensaje(
        mensaje
      );

    }
  );


  desplazarAbajo();

}


/* =====================================================
   MOSTRAR MENSAJE
===================================================== */


function mostrarMensaje(
  mensaje
) {

  if (
    document.querySelector(
      '[data-message-id="' +
      mensaje.id +
      '"]'
    )
  ) {

    return;

  }


  const esMio =
    mensaje.sender_id ===
    usuarioActual.id;


  const contenedor =
    document.createElement(
      "div"
    );


  contenedor.className =
    "mensaje " +
    (
      esMio
        ? "mio"
        : "otro"
    );


  contenedor.dataset.messageId =
    mensaje.id;


  const burbuja =
    document.createElement(
      "div"
    );


  burbuja.className =
    "burbuja";


  let checks =
    "";


  if (esMio) {

    if (
      mensaje.read_at
    ) {

      checks =
        '<span class="check leido">✓✓</span>';

    }

    else if (
      mensaje.delivered_at
    ) {

      checks =
        '<span class="check">✓✓</span>';

    }

    else {

      checks =
        '<span class="check">✓</span>';

    }

  }


  const hora =
    new Date(
      mensaje.created_at
    ).toLocaleTimeString(
      "es-AR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  burbuja.innerHTML =
    escapeHTML(
      mensaje.content
    ) +
    `
      <span class="hora">
        ${hora}
        ${checks}
      </span>
    `;


  contenedor.appendChild(
    burbuja
  );


  mensajes.appendChild(
    contenedor
  );

}


/* =====================================================
   ENVIAR MENSAJE
===================================================== */


async function enviarMensaje() {

  const texto =
    mensajeInput.value.trim();


  if (!texto) {

    return;

  }


  if (!matchActual) {

    alert(
      "No hay un Match válido."
    );

    return;

  }


  btnEnviar.disabled =
    true;


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({
          match_id:
            matchActual.id,

          sender_id:
            usuarioActual.id,

          content:
            texto
        })
        .select()
        .single();


    if (error) {

      throw new Error(
        "Error enviando mensaje: " +
        error.message
      );

    }


    mensajeInput.value =
      "";


    await actualizarTyping(
      false
    );


    if (data) {

      mostrarMensaje(
        data
      );

      desplazarAbajo();

    }

  }

  catch (error) {

    console.error(
      error
    );


    alert(
      error.message ||
      "No se pudo enviar el mensaje."
    );

  }

  finally {

    btnEnviar.disabled =
      false;

    mensajeInput.focus();

  }

}


/* =====================================================
   ENTREGADOS
===================================================== */


async function marcarEntregados() {

  if (!matchActual) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .update({
        delivered_at:
          new Date().toISOString()
      })
      .eq(
        "match_id",
        matchActual.id
      )
      .eq(
        "sender_id",
        otroUsuario
      )
      .is(
        "delivered_at",
        null
      );


  if (error) {

    console.warn(
      "No se pudieron marcar entregados:",
      error
    );

  }

}


/* =====================================================
   LEÍDOS
===================================================== */


async function marcarLeidos() {

  if (!matchActual) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .update({
        read_at:
          new Date().toISOString()
      })
      .eq(
        "match_id",
        matchActual.id
      )
      .eq(
        "sender_id",
        otroUsuario
      )
      .is(
        "read_at",
        null
      );


  if (error) {

    console.warn(
      "No se pudieron marcar leídos:",
      error
    );

  }

}


/* =====================================================
   REALTIME MENSAJES
===================================================== */


function escucharMensajes() {

  if (!matchActual) {

    return;

  }


  canalMensajes =
    supabaseClient
      .channel(
        "messages-" +
        matchActual.id +
        "-" +
        usuarioActual.id
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter:
            "match_id=eq." +
            matchActual.id
        },
        async payload => {

          mostrarMensaje(
            payload.new
          );


          desplazarAbajo();


          if (
            payload.new.sender_id ===
            otroUsuario
          ) {

            await marcarEntregados();

            await marcarLeidos();

          }

        }
      )
      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "messages",
          filter:
            "match_id=eq." +
            matchActual.id
        },
        async () => {

          await cargarMensajes();

        }
      )
      .subscribe(
        status => {

          console.log(
            "Realtime messages:",
            status
          );

        }
      );

}


/* =====================================================
   INPUT
===================================================== */


function prepararInput() {

  mensajeInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        enviarMensaje();

      }

    }
  );


  mensajeInput.addEventListener(
    "input",
    manejarTyping
  );

}


/* =====================================================
   TYPING
===================================================== */


async function manejarTyping() {

  const activo =
    mensajeInput.value.length > 0;


  await actualizarTyping(
    activo
  );


  clearTimeout(
    typingTimer
  );


  typingTimer =
    setTimeout(
      () => {

        actualizarTyping(
          false
        );

      },
      1500
    );

}


/* =====================================================
   ACTUALIZAR TYPING
===================================================== */


async function actualizarTyping(
  activo
) {

  if (
    !matchActual ||
    !usuarioActual
  ) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("typing_status")
      .upsert(
        {
          match_id:
            matchActual.id,

          user_id:
            usuarioActual.id,

          is_typing:
            activo,

          updated_at:
            new Date().toISOString()
        },
        {
          onConflict:
            "match_id,user_id"
        }
      );


  if (error) {

    console.warn(
      "Typing:",
      error
    );

  }

}


/* =====================================================
