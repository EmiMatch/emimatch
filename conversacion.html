<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conversación · EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172033;
    }

    .app {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      background: linear-gradient(135deg, #071b49, #123b91);
      color: white;
    }

    .back {
      border: 0;
      background: transparent;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .header-info {
      flex: 1;
    }

    .header-info strong {
      display: block;
      font-size: 17px;
    }

    .status {
      font-size: 12px;
      opacity: .9;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      padding: 18px 12px 90px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .mine {
      align-self: flex-end;
      background: #123b91;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .theirs {
      align-self: flex-start;
      background: #e9edf5;
      color: #172033;
      border-bottom-left-radius: 5px;
    }

    .time {
      display: block;
      font-size: 10px;
      opacity: .7;
      margin-top: 4px;
      text-align: right;
    }

    .checks {
      margin-left: 4px;
      font-size: 11px;
    }

    .read {
      color: #5ec8ff;
    }

    .typing {
      padding: 0 15px 8px;
      font-size: 12px;
      color: #64748b;
      min-height: 20px;
    }

    .composer {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 700px;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 8px;
      z-index: 20;
    }

    .composer textarea {
      flex: 1;
      resize: none;
      border: 1px solid #ccd3df;
      border-radius: 20px;
      padding: 10px 14px;
      outline: none;
      font-family: inherit;
      min-height: 42px;
      max-height: 100px;
    }

    .send {
      width: 45px;
      height: 45px;
      border: 0;
      border-radius: 50%;
      background: #123b91;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .send:disabled {
      opacity: .5;
    }

    .empty,
    .error {
      text-align: center;
      margin: auto;
      color: #64748b;
      padding: 30px;
    }

    .block-btn {
      border: 0;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <button class="back" onclick="volver()">‹</button>

    <img id="avatar" class="avatar" src="" alt="Foto">

    <div class="header-info">
      <strong id="nombreUsuario">Cargando...</strong>
      <div id="estadoUsuario" class="status">⏳</div>
    </div>

    <button class="block-btn" onclick="bloquearUsuario()">🚫</button>
  </div>

  <div id="messages" class="messages">
    <div class="empty">⏳ Cargando conversación...</div>
  </div>

  <div id="typing" class="typing"></div>

  <div class="composer">
    <textarea
      id="inputMensaje"
      placeholder="Escribí un mensaje..."
      rows="1"
      disabled
    ></textarea>

    <button
      id="btnEnviar"
      class="send"
      onclick="enviarMensaje()"
      disabled
    >
      ➤
    </button>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let usuarioActual = null;
let usuarioDestino = null;
let matchActual = null;
let bloqueado = false;

const params = new URLSearchParams(window.location.search);
const destinoId = params.get("user");

const messagesDiv = document.getElementById("messages");
const inputMensaje = document.getElementById("inputMensaje");
const btnEnviar = document.getElementById("btnEnviar");

async function iniciar() {

  try {

    const {
      data: { session },
      error
    } = await supabaseClient.auth.getSession();

    if (error) throw error;

    if (!session) {
      window.location.href = "index.html";
      return;
    }

    usuarioActual = session.user;

    if (!destinoId) {
      mostrarError("No se encontró el usuario.");
      return;
    }

    await cargarUsuario();

    await cargarMatch();

    await comprobarBloqueo();

    await cargarMensajes();

    activarRealtime();

    activarTyping();

  } catch (error) {

    console.error(error);

    mostrarError(
      "No se pudo cargar la conversación."
    );
  }
}


async function cargarUsuario() {

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", destinoId)
      .single();

  if (error) throw error;

  usuarioDestino = data;

  document.getElementById("nombreUsuario").textContent =
    data.nombre || "Usuario";

  document.getElementById("avatar").src =
    data.foto_url ||
    "https://via.placeholder.com/100";

  document.getElementById("estadoUsuario").textContent =
    data.online
      ? "🟢 En línea"
      : "⚪ Desconectado";
}


async function cargarMatch() {

  const { data, error } =
    await supabaseClient
      .from("matches")
      .select("*")
      .or(
        `and(user1_id.eq.${usuarioActual.id},user2_id.eq.${destinoId}),and(user1_id.eq.${destinoId},user2_id.eq.${usuarioActual.id})`
      )
      .limit(1);

  if (error) throw error;

  if (!data || data.length === 0) {
    throw new Error("No existe un Match.");
  }

  matchActual = data[0];
}


async function comprobarBloqueo() {

  const { data, error } =
    await supabaseClient
      .from("user_blocks")
      .select("*")
      .or(
        `and(blocker_id.eq.${usuarioActual.id},blocked_id.eq.${destinoId}),and(blocker_id.eq.${destinoId},blocked_id.eq.${usuarioActual.id})`
      );

  if (error) throw error;

  bloqueado = data && data.length > 0;

  if (bloqueado) {

    inputMensaje.disabled = true;
    btnEnviar.disabled = true;

    document.getElementById("estadoUsuario").textContent =
      "🚫 Usuario bloqueado";
  }
}


async function cargarMensajes() {

  const { data, error } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq("match_id", matchActual.id)
      .order("created_at", { ascending: true });

  if (error) throw error;

  messagesDiv.innerHTML = "";

  if (!data || data.length === 0) {

    messagesDiv.innerHTML =
      `<div class="empty">
        💬 Todavía no hay mensajes.<br>
        ¡Comenzá la conversación!
      </div>`;

  } else {

    for (const mensaje of data) {

      await marcarMensajeComoLeido(mensaje);

      mostrarMensaje(mensaje);
    }
  }

  if (!bloqueado) {

    inputMensaje.disabled = false;
    btnEnviar.disabled = false;
  }

  bajarAlFinal();
}


function mostrarMensaje(mensaje) {

  const mio =
    mensaje.sender_id === usuarioActual.id;

  const div =
    document.createElement("div");

  div.className =
    "message " + (mio ? "mine" : "theirs");

  const fecha =
    new Date(mensaje.created_at);

  const hora =
    fecha.toLocaleTimeString("es-AR", {
      hour: "2-digit",
      minute: "2-digit"
    });

  let checks = "";

  if (mio) {

    if (mensaje.read_at) {

      checks =
        `<span class="checks read">✓✓</span>`;

    } else if (mensaje.delivered_at) {

      checks =
        `<span class="checks">✓✓</span>`;

    } else {

      checks =
        `<span class="checks">✓</span>`;
    }
  }

  div.innerHTML = `
    ${escapeHtml(mensaje.content)}
    <span class="time">
      ${hora}
      ${checks}
    </span>
  `;

  messagesDiv.appendChild(div);
}


async function marcarMensajeComoLeido(mensaje) {

  if (mensaje.sender_id === usuarioActual.id) {
    return;
  }

  if (!mensaje.delivered_at || !mensaje.read_at) {

    const ahora =
      new Date().toISOString();

    await supabaseClient
      .from("messages")
      .update({
        delivered_at:
          mensaje.delivered_at || ahora,

        read_at:
          ahora
      })
      .eq("id", mensaje.id)
      .eq("match_id", matchActual.id);
  }
}


async function enviarMensaje() {

  const texto =
    inputMensaje.value.trim();

  if (!texto || !matchActual || bloqueado) {
    return;
  }

  btnEnviar.disabled = true;

  const { data, error } =
    await supabaseClient
      .from("messages")
      .insert({
        match_id: matchActual.id,
        sender_id: usuarioActual.id,
        content: texto
      })
      .select()
      .single();

  if (error) {

    console.error(error);

    alert(
      "No se pudo enviar el mensaje."
    );

    btnEnviar.disabled = false;
    return;
  }

  inputMensaje.value = "";

  mostrarMensaje(data);

  bajarAlFinal();

  btnEnviar.disabled = false;
}


function activarRealtime() {

  supabaseClient
    .channel(
      "mensajes-" + matchActual.id
    )
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "messages",
        filter:
          `match_id=eq.${matchActual.id}`
      },
      async payload => {

        if (
          payload.eventType === "INSERT"
        ) {

          if (
            payload.new.sender_id !==
            usuarioActual.id
          ) {

            await marcarMensajeComoLeido(
              payload.new
            );
          }

          await cargarMensajes();

        }

        if (
          payload.eventType === "UPDATE"
        ) {

          await cargarMensajes();
        }

      }
    )
    .subscribe();
}


function activarTyping() {

  let timeout;

  inputMensaje.addEventListener(
    "input",
    async () => {

      clearTimeout(timeout);

      await actualizarTyping(true);

      timeout =
        setTimeout(
          () => actualizarTyping(false),
          1200
        );
    }
  );
}


async function actualizarTyping(valor) {

  if (!matchActual) return;

  await supabaseClient
    .from("typing_status")
    .upsert({
      match_id: matchActual.id,
      user_id: usuarioActual.id,
      is_typing: valor,
      updated_at:
        new Date().toISOString()
    });
}


async function bloquearUsuario() {

  if (!usuarioDestino) return;

  const confirmar =
    confirm(
      `¿Querés bloquear a ${usuarioDestino.nombre}?`
    );

  if (!confirmar) return;

  const { error } =
    await supabaseClient
      .from("user_blocks")
      .insert({
        blocker_id:
          usuarioActual.id,

        blocked_id:
          destinoId
      });

  if (error) {

    if (error.code === "23505") {

      alert("Este usuario ya está bloqueado.");

    } else {

      console.error(error);

      alert("No se pudo bloquear.");
    }

    return;
  }

  bloqueado = true;

  inputMensaje.disabled = true;
  btnEnviar.disabled = true;

  document.getElementById(
    "estadoUsuario"
  ).textContent =
    "🚫 Usuario bloqueado";

  alert("Usuario bloqueado.");
}


function bajarAlFinal() {

  setTimeout(() => {

    messagesDiv.scrollTop =
      messagesDiv.scrollHeight;

  }, 100);
}


function escapeHtml(texto) {

  return String(texto)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function mostrarError(texto) {

  messagesDiv.innerHTML =
    `<div class="error">
      ❌ ${escapeHtml(texto)}
    </div>`;
}


function volver() {

  window.location.href =
    "chat.html";
}


inputMensaje.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviarMensaje();
    }
  }
);


iniciar();

</script>

</body>
</html>
