<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico EmiMatch</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
}
.box{
  max-width:600px;
  margin:auto;
  background:#1f2937;
  padding:20px;
  border-radius:16px;
}
.ok{color:#22c55e}
.error{color:#ef4444}
.info{color:#60a5fa}
</style>
</head>

<body>

<div class="box">
  <h2>🔧 Diagnóstico EmiMatch</h2>
  <div id="estado">Iniciando...</div>
</div>

<script>

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

let supabaseClient;

function mostrar(texto, tipo="info"){
  document.getElementById("estado").innerHTML +=
    `<p class="${tipo}">${texto}</p>`;
}

async function iniciar(){

  try{

    mostrar("1️⃣ JavaScript funcionando","ok");

    if(!window.supabase){
      throw new Error("Supabase JS no cargó");
    }

    mostrar("2️⃣ Supabase cargado","ok");

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    mostrar("3️⃣ Cliente Supabase creado","ok");

    const params =
      new URLSearchParams(window.location.search);

    const otherUserId =
      params.get("user");

    if(!otherUserId){
      throw new Error(
        "No existe ?user= en la URL"
      );
    }

    mostrar(
      "4️⃣ Usuario de la conversación: " +
      otherUserId,
      "ok"
    );

    const {
      data: { session },
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if(sessionError){
      throw sessionError;
    }

    if(!session){
      throw new Error(
        "No hay una sesión iniciada"
      );
    }

    mostrar(
      "5️⃣ Sesión activa",
      "ok"
    );

    mostrar(
      "Tu usuario: " +
      session.user.id,
      "ok"
    );

    const { data: perfil, error: perfilError } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
        )
        .eq("id", otherUserId)
        .maybeSingle();

    if(perfilError){
      throw perfilError;
    }

    if(!perfil){
      throw new Error(
        "No se encontró el perfil del usuario"
      );
    }

    mostrar(
      "6️⃣ Perfil encontrado: " +
      (perfil.nombre || "Sin nombre"),
      "ok"
    );

    const { data: match1, error: error1 } =
      await supabaseClient
        .from("matches")
        .select("id,user1_id,user2_id")
        .eq("user1_id", session.user.id)
        .eq("user2_id", otherUserId)
        .maybeSingle();

    if(error1){
      throw error1;
    }

    let match = match1;

    if(!match){

      const { data: match2, error: error2 } =
        await supabaseClient
          .from("matches")
          .select("id,user1_id,user2_id")
          .eq("user1_id", otherUserId)
          .eq("user2_id", session.user.id)
          .maybeSingle();

      if(error2){
        throw error2;
      }

      match = match2;
    }

    if(!match){
      throw new Error(
        "No existe un match entre estos usuarios"
      );
    }

    mostrar(
      "7️⃣ MATCH ENCONTRADO",
      "ok"
    );

    mostrar(
      "Match ID: " + match.id,
      "ok"
    );

    const {
      data: mensajes,
      error: mensajesError
    } = await supabaseClient
      .from("messages")
      .select(
        "id,match_id,sender_id,content,created_at"
      )
      .eq("match_id", match.id)
      .order("created_at", { ascending:true });

    if(mensajesError){
      throw mensajesError;
    }

    mostrar(
      "8️⃣ Mensajes cargados: " +
      (mensajes?.length || 0),
      "ok"
    );

    mostrar(
      "✅ CONEXIÓN COMPLETA. El problema no está en Supabase.",
      "ok"
    );

  }catch(error){

    console.error(error);

    mostrar(
      "❌ ERROR: " +
      (error.message || error),
      "error"
    );

  }

}

iniciar();

</script>

</body>
</html>
