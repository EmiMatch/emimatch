<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EmiMatch - Conversación</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f7;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */

header{
  height:72px;
  flex-shrink:0;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  color:white;
  display:flex;
  align-items:center;
  padding:10px 14px;
  gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.btn-volver{
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:27px;
  cursor:pointer;
}

.foto-container{
  position:relative;
  width:48px;
  height:48px;
  flex-shrink:0;
}

.foto{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:white;
  border:2px solid rgba(255,255,255,.7);
}

.punto-online{
  position:absolute;
  right:0;
  bottom:1px;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#22c55e;
  border:2px solid white;
  display:none;
}

.info{
  flex:1;
  min-width:0;
}

.nombre{
  font-size:18px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.estado{
  font-size:13px;
  margin-top:4px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:15px 12px 85px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.mensaje{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  font-size:15px;
  line-height:1.4;
  word-wrap:break-word;
  overflow-wrap:anywhere;
}

.mio{
  align-self:flex-end;
  background:#7c3aed;
  color:white;
  border-bottom-right-radius:5px;
}

.otro{
  align-self:flex-start;
  background:white;
  color:#222;
  border-bottom-left-radius:5px;
  box-shadow:0 1px 4px rgba(0,0,0,.10);
}

.hora{
  font-size:10px;
  opacity:.72;
  margin-top:4px;
  text-align:right;
}

.check{
  margin-left:5px;
  font-weight:bold;
  letter-spacing:-2px;
}

.check.leido{
  color:#38bdf8;
}

/* ESCRIBIENDO */

.escribiendo{
  position:fixed;
  left:14px;
  bottom:69px;
  display:none;
  background:white;
  color:#777;
  padding:5px 10px;
  border-radius:13px;
  font-size:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.12);
  z-index:10;
}

/* INPUT */

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  padding:8px 10px;
  display:flex;
  gap:8px;
  border-top:1px solid #ddd;
  z-index:20;
}

.input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:25px;
  padding:11px 16px;
  font-size:15px;
  outline:none;
  background:#fafafa;
}

.input:focus{
  border-color:#8b5cf6;
  background:white;
}

.enviar{
  width:48px;
  height:48px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  background:#7c3aed;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.enviar:disabled{
  opacity:.6;
}

.vacio,
.cargando,
.error{
  text-align:center;
  margin:auto;
}

.vacio,
.cargando{
  color:#777;
}

.error{
  color:#dc2626;
  padding:20px;
}
</style>
</head>

<body>

<header>

<button class="btn-volver" onclick="volver()">‹</button>

<div class="foto-container">

<img
  id="foto"
  class="foto"
  src="https://via.placeholder.com/100"
  alt="Foto">

<div id="puntoOnline" class="punto-online"></div>

</div>

<div class="info">

<div id="nombre" class="nombre">
Cargando...
</div>

<div id="estado" class="estado">
Conectando...
</div>

</div>

</header>


<div id="chat" class="chat">

<div class="cargando">
Cargando conversación...
</div>

</div>


<div id="escribiendo" class="escribiendo">
✍️ Está escribiendo...
</div>


<div class="composer">

<input
  id="mensajeInput"
  class="input"
  type="text"
  placeholder="Escribí un mensaje..."
  autocomplete="off">

<button
  id="enviar"
  class="enviar">
➤
</button>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==========================================
   VARIABLES
========================================== */

let currentUser = null;
let otherUserId = null;
let matchId = null;

let canalMensajes = null;
let canalTyping = null;
let canalEstado = null;

let typingTimer = null;


/* ==========================================
   USUARIO DE LA URL
========================================== */

const params =
new URLSearchParams(
  window.location.search
);

otherUserId =
params.get("user");


/* ==========================================
   INICIAR
========================================== */

async function iniciar(){

  try{

    if(!otherUserId){

      mostrarError(
        "No se encontró el usuario de la conversación."
      );

      return;
    }

    const {
      data:{session},
      error:sessionError
    } =
    await supabaseClient.auth.getSession();

    if(sessionError)
      throw sessionError;

    if(!session){

      mostrarError(
        "La sesión expiró. Volvé a iniciar sesión."
      );

      return;
    }

    currentUser =
    session.user;

    await cargarPerfil();

    await buscarMatch();

    await cargarMensajes();

    await marcarMensajesEntregados();

    await marcarMensajesLeidos();

    prepararInput();

    escucharMensajes();

    escucharTyping();

    escucharEstado();

    actualizarEstado();

  }

  catch(error){

    console.error(
      "ERROR INICIAR:",
      error
    );

    mostrarError(
      "Error: " +
      error.message
    );

  }

}


/* ==========================================
   PERFIL
========================================== */

async function cargarPerfil(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,nombre,edad,ciudad,descripcion,foto_url,intereses,online,last_seen"
    )
    .eq(
      "id",
      otherUserId
    )
    .maybeSingle();

  if(error)
    throw error;

  if(!data){

    throw new Error(
      "No se encontró el perfil."
    );

  }

  document
    .getElementById("nombre")
    .textContent =
    data.nombre || "Usuario";

  if(data.foto_url){

    document
      .getElementById("foto")
      .src =
      data.foto_url;

  }

  mostrarEstado(data);
}


/* ==========================================
   ESTADO ONLINE
========================================== */

function mostrarEstado(data){

  const estado =
  document.getElementById("estado");

  const punto =
  document.getElementById("puntoOnline");

  if(data.online === true){

    estado.textContent =
      "🟢 En línea";

    punto.style.display =
      "block";

    return;
  }

  punto.style.display =
    "none";

  if(data.last_seen){

    estado.textContent =
      "Última vez " +
      formatearUltimaConexion(
        data.last_seen
      );

  }
  else{

    estado.textContent =
      "Desconectado";

  }
}


function formatearUltimaConexion(fecha){

  const ahora =
  new Date();

  const ultima =
  new Date(fecha);

  const diferencia =
  Math.floor(
    (ahora - ultima) / 1000
  );

  if(diferencia < 60)
    return "hace unos segundos";

  const minutos =
  Math.floor(
    diferencia / 60
  );

  if(minutos < 60)
    return "hace " + minutos + " min.";

  const horas =
  Math.floor(
    minutos / 60
  );

  if(horas < 24)
    return "hace " + horas + " h.";

  return ultima.toLocaleString(
    [],
    {
      day:"2-digit",
      month:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


async function actualizarEstado(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "online,last_seen"
    )
    .eq(
      "id",
      otherUserId
    )
    .maybeSingle();

  if(error){

    console.error(
      "Error estado:",
      error
    );

    return;
  }

  if(data)
    mostrarEstado(data);
}


/* ==========================================
   BUSCAR MATCH
========================================== */

async function buscarMatch(){

  let resultado =
  await supabaseClient
    .from("matches")
    .select(
      "id,user1_id,user2_id"
    )
    .eq(
      "user1_id",
      currentUser.id
    )
    .eq(
      "user2_id",
      otherUserId
    )
    .maybeSingle();

  if(resultado.error)
    throw resultado.error;

  let data =
  resultado.data;

  if(!data){

    resultado =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id"
      )
      .eq(
        "user1_id",
        otherUserId
      )
      .eq(
        "user2_id",
        currentUser.id
      )
      .maybeSingle();

    if(resultado.error)
      throw resultado.error;

    data =
    resultado.data;
  }

  if(!data){

    throw new Error(
      "No existe un match entre estos usuarios."
    );

  }

  matchId =
  data.id;
}


/* ==========================================
   CARGAR MENSAJES
========================================== */

async function cargarMensajes(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select(
      "id,match_id,sender_id,content,created_at,delivered_at,read_at"
    )
    .eq(
      "match_id",
      matchId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );

  if(error)
    throw error;

  const chat =
  document.getElementById("chat");

  chat.innerHTML = "";

  if(!data || data.length === 0){

    chat.innerHTML =
      '<div class="vacio">Todavía no hay mensajes 💬</div>';

    return;
  }

  data.forEach(
    mensaje => mostrarMensaje(mensaje)
  );

  bajarChat();
}


/* ==========================================
   MOSTRAR MENSAJE
========================================== */

function mostrarMensaje(mensaje){

  const chat =
  document.getElementById("chat");

  const existente =
  chat.querySelector(
    `[data-id="${mensaje.id}"]`
  );

  if(existente){

    actualizarMensajeVisual(
      mensaje
    );

    return;
  }

  const div =
  document.createElement("div");

  const mio =
  mensaje.sender_id ===
  currentUser.id;

  div.className =
    "mensaje " +
    (mio ? "mio" : "otro");

  div.dataset.id =
    mensaje.id;

  const hora =
  new Date(
    mensaje.created_at
  ).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

  let checks = "";

  if(mio){

    if(mensaje.read_at){

      checks =
        '<span class="check leido">✓✓</span>';

    }
    else if(mensaje.delivered_at){

      checks =
        '<span class="check">✓✓</span>';

    }
    else{

      checks =
        '<span class="check">✓</span>';

    }
  }

  div.innerHTML = `
    <div>${escapeHTML(mensaje.content)}</div>
    <div class="hora">
      ${hora}${checks}
    </div>
  `;

  chat.appendChild(div);
}


/* ==========================================
   ACTUALIZAR CHECKS
========================================== */

function actualizarMensajeVisual(mensaje){

  const elemento =
  document.querySelector(
    `[data-id="${mensaje.id}"]`
  );

  if(!elemento)
    return;

  if(
    mensaje.sender_id !==
    currentUser.id
  )
    return;

  let checks = "";

  if(mensaje.read_at){

    checks =
      '<span class="check leido">✓✓</span>';

  }
  else if(mensaje.delivered_at){

    checks =
      '<span class="check">✓✓</span>';

  }
  else{

    checks =
      '<span class="check">✓</span>';

  }

  const hora =
  new Date(
    mensaje.created_at
  ).toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

  const horaDiv =
  elemento.querySelector(".hora");

  if(horaDiv)
    horaDiv.innerHTML =
      hora + checks;
}


/* ==========================================
   ENVIAR MENSAJE
========================================== */

async function enviarMensaje(){

  const input =
  document.getElementById(
    "mensajeInput"
  );

  const contenido =
  input.value.trim();

  if(!contenido)
    return;

  if(!matchId)
    return;

  const boton =
  document.getElementById(
    "enviar"
  );

  boton.disabled = true;

  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .insert({
      match_id:matchId,
      sender_id:currentUser.id,
      content:contenido
    })
    .select(
      "id,match_id,sender_id,content,created_at,delivered_at,read_at"
    )
    .single();

  boton.disabled = false;

  if(error){

    console.error(
      "Error enviando:",
      error
    );

    alert(
      "No se pudo enviar el mensaje."
    );

    return;
  }

  input.value = "";

  mostrarMensaje(data);

  bajarChat();
}


/* ==========================================
   ENTREGADOS
========================================== */

async function marcarMensajesEntregados(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select("id")
    .eq(
      "match_id",
      matchId
    )
    .neq(
      "sender_id",
      currentUser.id
    )
    .is(
      "delivered_at",
      null
    );

  if(error){

    console.error(
      "Error entregados:",
      error
    );

    return;
  }

  if(!data || data.length === 0)
    return;

  const ahora =
  new Date().toISOString();

  for(const mensaje of data){

    await supabaseClient
      .from("messages")
      .update({
        delivered_at:ahora
      })
      .eq(
        "id",
        mensaje.id
      );
  }
}


/* ==========================================
   LEÍDOS
========================================== */

async function marcarMensajesLeidos(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select("id")
    .eq(
      "match_id",
      matchId
    )
    .neq(
      "sender_id",
      currentUser.id
    )
    .is(
      "read_at",
      null
    );

  if(error){

    console.error(
      "Error buscando mensajes:",
      error
    );

    return;
  }

  if(!data || data.length === 0)
    return;

  const ahora =
  new Date().toISOString();

  for(const mensaje of data){

    await supabaseClient
      .from("messages")
      .update({
        delivered_at:ahora,
        read_at:ahora
      })
      .eq(
        "id",
        mensaje.id
      );
  }
}


/* ==========================================
   REALTIME MENSAJES
========================================== */

function escucharMensajes(){

  canalMensajes =
  supabaseClient
    .channel(
      "mensajes-" + matchId
    );

  canalMensajes
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages",
        filter:
          "match_id=eq." + matchId
      },
      async payload => {

        const mensaje =
        payload.new;

        mostrarMensaje(mensaje);

        bajarChat();

        if(
          mensaje.sender_id !==
          currentUser.id
        ){

          const ahora =
          new Date().toISOString();

          await supabaseClient
            .from("messages")
            .update({
              delivered_at:ahora,
              read_at:ahora
            })
            .eq(
              "id",
              mensaje.id
            );
        }
      }
    )
    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"messages",
        filter:
          "match_id=eq." + matchId
      },
      payload => {

        actualizarMensajeVisual(
          payload.new
        );
      }
    )
    .subscribe();
}


/* ==========================================
   INPUT
========================================== */

function prepararInput(){

  const input =
  document.getElementById(
    "mensajeInput"
  );

  input.addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        event.preventDefault();

        enviarMensaje();
      }
    }
  );

  input.addEventListener(
    "input",
    manejarEscritura
  );

  document
    .getElementById("enviar")
    .addEventListener(
      "click",
      enviarMensaje
    );
}


/* ==========================================
   TYPING
========================================== */

async function manejarEscritura(){

  const input =
  document.getElementById(
    "mensajeInput"
  );

  const escribiendo =
  input.value.trim().length > 0;

  const indicador =
  document.getElementById(
    "escribiendo"
  );

  if(escribiendo){

    indicador.style.display =
      "block";

    clearTimeout(
      typingTimer
    );

    await actualizarTyping(true);

    typingTimer =
      setTimeout(
        () => actualizarTyping(false),
        1800
      );

  }
  else{

    indicador.style.display =
      "none";

    await actualizarTyping(false);
  }
}


async function actualizarTyping(escribiendo){

  if(!matchId || !currentUser)
    return;

  const {
    error
  } =
  await supabaseClient
    .from("typing_status")
    .upsert(
      {
        match_id:matchId,
        user_id:currentUser.id,
        is_typing:escribiendo,
        updated_at:new Date().toISOString()
      },
      {
        onConflict:"match_id,user_id"
      }
    );

  if(error)
    console.error(
      "Error typing:",
      error
    );
}


/* ==========================================
   ESCUCHAR TYPING
========================================== */

function escucharTyping(){

  canalTyping =
  supabaseClient
    .channel(
      "typing-" + matchId
    );

  canalTyping
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"typing_status",
        filter:
          "match_id=eq." + matchId
      },
      payload => {

        mostrarTyping(payload.new);
      }
    )
    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"typing_status",
        filter:
          "match_id=eq." + matchId
      },
      payload => {

        mostrarTyping(payload.new);
      }
    )
    .subscribe();
}


function mostrarTyping(data){

  if(
    data.user_id ===
    currentUser.id
  )
    return;

  const indicador =
  document.getElementById(
    "escribiendo"
  );

  if(data.is_typing){

    indicador.style.display =
      "block";

  }
  else{

    indicador.style.display =
      "none";
  }
}


/* ==========================================
   REALTIME ESTADO ONLINE
========================================== */

function escucharEstado(){

  canalEstado =
  supabaseClient
    .channel(
      "estado-" + otherUserId
    );

  canalEstado
    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"profiles",
        filter:
          "id=eq." + otherUserId
      },
      payload => {

        mostrarEstado(
          payload.new
        );
      }
    )
    .subscribe();
}


/* ==========================================
   UTILIDADES
========================================== */

function bajarChat(){

  const chat =
  document.getElementById("chat");

  setTimeout(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    },
    50
  );
}


function escapeHTML(text){

  const div =
  document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;
}


function mostrarError(mensaje){

  document
    .getElementById("chat")
    .innerHTML =
    `<div class="error">${escapeHTML(mensaje)}</div>`;
}


function volver(){

  window.location.href =
    "./chat.html";
}


/* ==========================================
   IMPORTANTE:
   INICIAR LA APLICACIÓN
========================================== */

iniciar();

</script>

</body>
</html>
