<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="description" content="EmiMatch Lab: demo experimental aislada, con datos ficticios.">
<title>EmiMatch Lab · Demo v0.3.0</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#151515;--panel2:#201b10;--gold:#f0cf70;--text:#f8f4e9;--muted:#b9b3a5;--line:#403720;--green:#9ed6aa;--rose:#f1a8b5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:84px}button{font:inherit;cursor:pointer}header{position:sticky;top:0;z-index:5;background:#090909ed;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{display:block;color:var(--gold);letter-spacing:.04em}small,.muted{color:var(--muted)}.version{font-size:12px}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--gold);font-size:11px;letter-spacing:.08em}.wrap{max-width:760px;margin:auto;padding:18px 15px}.hero,.card{background:linear-gradient(145deg,var(--panel),#101010);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:13px}.hero{background:radial-gradient(ellipse at top right,#342a12 0%,#17140e 38%,#111 78%)}h1{font-size:clamp(28px,7vw,40px);line-height:1.08;margin:10px 0}h2{font-size:21px;margin:0 0 8px}h3{font-size:17px;margin:0 0 5px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.14em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#0d0d0d;border:1px solid var(--line);border-radius:13px;padding:12px}.stat b{display:block;color:var(--gold);font-size:21px}.chapter{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:#111;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--text);margin:8px 0}.chapter .symbol{font-size:24px;color:var(--gold)}.chapter em{display:block;color:var(--muted);font-size:12px;font-style:normal;margin-top:4px}.btn{background:var(--gold);color:#17130a;border:0;border-radius:12px;padding:10px 13px;font-weight:750}.btn.secondary{background:#1b1b1b;color:var(--text);border:1px solid var(--line)}.btn.danger{color:var(--rose)}.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 12px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#151515;color:var(--text);border-radius:99px;padding:8px 12px}.tabs button.active{background:var(--gold);color:#17130a;border-color:var(--gold)}.posthead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#342a12;color:var(--gold);font-size:23px}.postbody{padding:13px;border-radius:12px;background:#0d0d0d;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{border:1px solid #594a25;border-radius:13px;padding:12px;color:#e6d8ac;font-size:13px;margin-top:15px}.bottom{position:fixed;z-index:6;bottom:0;left:0;right:0;background:#0b0b0bf5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(6px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}.bottom button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:5px 1px}.bottom button span{display:block;font-size:20px;line-height:1.2;margin-bottom:3px}.bottom button.active{color:var(--gold)}.empty{text-align:center;padding:25px 12px;color:var(--muted)}#toast{position:fixed;z-index:10;left:15px;right:15px;bottom:90px;background:#252015;border:1px solid var(--gold);padding:12px;border-radius:12px;display:none}.hidden{display:none!important}@media(min-width:560px){.grid.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div><strong>🫰 EmiMatch Lab</strong><div class="version">Demo experimental · Datos ficticios · v0.3.0</div></div><span class="pill">LAB · DEMO</span></header>
<main id="screen" class="wrap" aria-live="polite"></main>
<nav class="bottom" aria-label="Navegación principal">
<button data-page="inicio" class="active"><span>⌂</span>Inicio</button>
<button data-page="citas"><span>♡</span>Citas</button>
<button data-page="social"><span>◉</span>Social</button>
<button data-page="mensajes"><span>▤</span>Mensajes</button>
<button data-page="perfil"><span>♙</span>Perfil</button>
</nav>
<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
const screen=document.getElementById('screen');
const toastBox=document.getElementById('toast');
let page='inicio',socialTab='publicaciones',saved=new Set(),friends=[],incomingRequests=[{id:1,name:'Lucía ✨',detail:'Le gustaría conectar contigo'},{id:2,name:'Tomás 🎸',detail:'Solicitud de amistad de ejemplo'}],outgoing=[];
const people=[{name:'Camila 🌻',age:27,city:'Buenos Aires',bio:'Un día para disfrutar las pequeñas cosas ✨'},{name:'Lucía ✨',age:29,city:'San Isidro',bio:'Café, música y nuevos lugares.'},{name:'Tomás 🎸',age:31,city:'Vicente López',bio:'Música, paseos y charlas largas.'}];
const posts=[{id:1,name:'Camila 🌻',text:'Un día para disfrutar las pequeñas cosas ✨',tag:'Publicación ficticia'},{id:2,name:'Lucía ✨',text:'Hoy es un buen día para empezar algo nuevo ☀️',tag:'Publicación ficticia'}];
function toast(s){toastBox.textContent=s;toastBox.style.display='block';setTimeout(()=>toastBox.style.display='none',2300)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){page=p;render()}
function button(label,action,cls='secondary',attrs=''){return '<button class="btn '+cls+'" data-action="'+action+'" '+attrs+'>'+label+'</button>'}
function postCard(p){return '<article class="card"><div class="posthead"><div class="avatar">🫰</div><div><b>'+esc(p.name)+'</b><div class="muted" style="font-size:12px">Hace un momento · Demo</div></div></div><div class="postbody">'+esc(p.text)+'</div><div class="muted" style="font-size:12px;margin-bottom:10px">'+esc(p.tag)+'</div><div class="actions">'+button(saved.has(p.id)?'★ Guardado':'☆ Guardar','save-'+p.id,'secondary')+button('♡ Me gusta','like-'+p.id,'secondary')+'</div></article>'}
function home(){return '<section class="hero"><div class="eyebrow">UNA COMUNIDAD · CUATRO ESPACIOS</div><h1>Todo tu mundo,<br>en EmiMatch.</h1><p>Elegí cómo querés conectar hoy.</p><p>¡Bienvenido a EmiMatch Lab! Esta es una demo visual para probar ideas sin acceder a cuentas ni pagos reales.</p><div class="grid"><div class="stat"><b>7</b><small>Matches de ejemplo</small></div><div class="stat"><b>2/6</b><small>Fotos de ejemplo</small></div><div class="stat"><b>Demo</b><small>Modo seguro</small></div><div class="stat"><b>0</b><small>Datos reales</small></div></div></section><h2>Elegí tu capítulo</h2><p class="muted">Explorá la demo</p><div class="grid chapters"><button class="chapter" data-page="citas"><span class="symbol">♡</span><span><b>EmiMatch Citas</b><em>Perfiles, likes, matches y Premium.</em><em>Base existente</em></span></button><button class="chapter" data-page="social"><span class="symbol">◉</span><span><b>EmiMatch Social</b><em>Publicaciones, fotos y comunidad.</em><em>Demo interactiva</em></span></button><button class="chapter" data-page="live"><span class="symbol">◉</span><span><b>EmiMatch Live</b><em>Vivos, audiencia y regalos virtuales.</em><em>Concepto futuro</em></span></button><button class="chapter" data-page="contenidos"><span class="symbol">▣</span><span><b>EmiMatch Contenidos</b><em>Creadores, membresías y contenido exclusivo +18.</em><em>Concepto futuro</em></span></button></div><section class="card"><h2>Accesos rápidos</h2><div class="actions">'+button('♡ Me gusta','likes')+button('▤ Chat','mensajes')+button('♙ Perfil','perfil')+button('✦ Premium','premium')+'</div></section><div class="notice">🔒 DEMO SEGURA: la información es ficticia. No se realizan registros, cobros ni publicaciones reales.</div>'}
function social(){let tabs=[['publicaciones','Publicaciones'],['personas','Personas'],['solicitudes','Solicitudes'],['amigos','Amigos'],['guardados','Guardados']];let html='<section class="hero"><div class="eyebrow">EMIMATCH LAB · DEMO</div><h1>EmiMatch Social</h1><p>Publicaciones y comunidad de prueba.</p></section><h2>Tu comunidad</h2><p class="muted">Publicaciones, personas, solicitudes, amigos y guardados.</p><div class="tabs">'+tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(socialTab===t[0]?'active':'')+'">'+t[1]+'</button>').join('')+'</div><div id="social-content">';
if(socialTab==='publicaciones'){html+=posts.map(postCard).join('')}
if(socialTab==='personas'){html+=people.map((p,i)=>'<article class="card"><div class="posthead"><div class="avatar">'+['🌻','✨','🎸'][i]+'</div><div><h3>'+esc(p.name)+', '+p.age+'</h3><small>'+esc(p.city)+'</small></div></div><p>'+esc(p.bio)+'</p><div class="actions">'+button(outgoing.includes(p.name)?'Solicitud enviada':'＋ Agregar amigo','request-'+i,outgoing.includes(p.name)?'secondary':'')+'</div></article>').join('')}
if(socialTab==='solicitudes'){html+=incomingRequests.length?incomingRequests.map(r=>'<article class="card"><div class="posthead"><div class="avatar">♙</div><div><b>'+esc(r.name)+'</b><div class="muted">'+esc(r.detail)+'</div></div></div><div class="actions">'+button('Aceptar','accept-'+r.id,'')+button('Rechazar','reject-'+r.id,'secondary danger')+'</div></article>').join(''):'<div class="card empty">No tenés solicitudes pendientes de ejemplo.</div>'}
if(socialTab==='amigos'){html+=friends.length?friends.map(n=>'<article class="card"><b>♡ '+esc(n)+'</b><p class="muted">Amistad de ejemplo</p>'+button('Quitar amigo','remove-'+encodeURIComponent(n),'secondary danger')+'</article>').join(''):'<div class="card empty">Todavía no hay amigos en esta demo. Probá aceptar una solicitud.</div>'}
if(socialTab==='guardados'){let list=posts.filter(p=>saved.has(p.id));html+=list.length?list.map(postCard).join(''):'<div class="card empty">Todavía no guardaste publicaciones. Volvé a Publicaciones y tocá ☆ Guardar.</div>'}
return html+'</div><div class="notice">🔒 Demo segura: datos ficticios. Esta sección no se conecta a cuentas ni pagos reales.</div>'}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';
if(page==='inicio')html=home();
else if(page==='social')html=social();
else if(page==='citas')html='<section class="hero"><div class="eyebrow">LAB · DEMO</div><h1>EmiMatch Citas</h1><p>Perfiles de ejemplo, likes y conexiones.</p></section>'+people.map((p,i)=>'<article class="card"><div class="posthead"><div class="avatar">♡</div><div><h3>'+esc(p.name)+', '+p.age+'</h3><small>'+esc(p.city)+'</small></div></div><p>'+esc(p.bio)+'</p>'+button('♡ Me gusta','date-like-'+i,'')+'</article>').join('')+'<div class="notice">Solo perfiles ficticios. No se contacta a personas reales.</div>';
else if(page==='mensajes')html='<section class="hero"><div class="eyebrow">LAB · DEMO</div><h1>Mensajes</h1><p>Conversaciones de muestra; no se envían mensajes reales.</p></section><article class="card"><b>Camila 🌻</b><p>¡Hola! ¿Cómo va tu día? ✨</p>'+button('Responder en demo','reply','')+'</article>';
else if(page==='perfil')html='<section class="hero"><div class="eyebrow">LAB · DEMO</div><h1>Mi perfil</h1><p>Perfil ficticio para explorar el diseño.</p></section><article class="card"><div class="posthead"><div class="avatar">🫰</div><div><h2>Tu perfil de ejemplo</h2><small>Buenos Aires · Cuenta demo</small></div></div><p>Fotos de ejemplo: 2 de 6</p>'+button('Editar perfil (demo)','edit-profile')+'</article>';
else if(page==='likes')html='<section class="hero"><h1>Me gusta</h1><p>Actividad de ejemplo.</p></section><div class="card">Tenés likes ficticios para explorar el concepto.</div>';
else if(page==='premium')html='<section class="hero"><h1>EmiMatch Premium</h1><p>Vista conceptual; no hay compras ni cobros en esta demo.</p></section><div class="card"><h3>Beneficios de ejemplo</h3><p>Más likes, filtros y opciones de perfil.</p>'+button('Ver beneficios','benefits')+'</div>';
else if(page==='live')html='<section class="hero"><h1>EmiMatch Live</h1><p>Concepto futuro de transmisiones en vivo.</p></section><div class="card">Esta función es conceptual. No hay transmisión ni regalos reales.</div>';
else if(page==='contenidos')html='<section class="hero"><h1>EmiMatch Contenidos</h1><p>Concepto futuro para creadores y contenido exclusivo.</p></section><div class="card">Esta función es conceptual. No hay membresías ni pagos reales.</div>';
screen.innerHTML=html}
document.addEventListener('click',async e=>{const p=e.target.closest('[data-page]');if(p){go(p.dataset.page);return}const tab=e.target.closest('[data-tab]');if(tab){socialTab=tab.dataset.tab;render();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a.startsWith('accept-')){const id=Number(a.slice(7)),r=incomingRequests.find(x=>x.id===id);if(r){friends.push(r.name);incomingRequests=incomingRequests.filter(x=>x.id!==id);toast('Solicitud aceptada en la demo');render()}}
else if(a.startsWith('reject-')){const id=Number(a.slice(7));incomingRequests=incomingRequests.filter(x=>x.id!==id);toast('Solicitud rechazada en la demo');render()}
else if(a.startsWith('request-')){const p=people[Number(a.slice(8))];if(p&&!outgoing.includes(p.name)){outgoing.push(p.name);toast('Solicitud ficticia enviada');render()}}
else if(a.startsWith('remove-')){const n=decodeURIComponent(a.slice(7));friends=friends.filter(x=>x!==n);toast('Amigo quitado de la demo');render()}
else if(a.startsWith('save-')){const id=Number(a.slice(5));saved.has(id)?saved.delete(id):saved.add(id);toast(saved.has(id)?'Publicación guardada':'Publicación quitada de guardados');render()}
else if(a.startsWith('like-'))toast('Me gusta registrado solo en la demo');
else if(a.startsWith('date-like-'))toast('Like ficticio registrado');
else if(a==='mensajes')go('mensajes');else if(a==='perfil')go('perfil');else if(a==='premium')go('premium');else if(a==='likes')go('likes');else if(a==='reply')toast('Respuesta de muestra: ¡Hola! 😊');else if(a==='edit-profile')toast('La edición de perfil es una idea de demo');else if(a==='benefits')toast('Beneficios conceptuales, sin compras reales');
});
document.querySelector('[data-page="inicio"]').addEventListener('click',()=>go('inicio'));
/* Compatibilidad de validación del flujo de compilación: la demo solo consulta el HTML de su propia rama para el control manual de versión. */
async function checkLabUpdate(){const urls=['https://api.github.com/repos/EmiMatch/emimatch/contents/lab/index.html?ref=lab-desarrollo','https://raw.githubusercontent.com/EmiMatch/emimatch/lab-desarrollo/lab/index.html'];for(const url of urls){try{const res=await fetch(url,{cache:'no-store'});if(res.ok){toast('La demo local está funcionando. Para actualizar el APK, instalá el nuevo artefacto de Lab.');return}}catch(_){}}toast('No se pudo consultar la versión remota. La demo local sigue disponible.')}
window.checkLabUpdate=checkLabUpdate;
render();
})();
</script>
</body>
</html>
