<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="description" content="EmiMatch Lab: demo experimental de la plataforma EmiMatch.">
<title>EmiMatch Lab · Demo</title>
<style>
:root{--bg:#090909;--panel:#151515;--panel2:#1c1a16;--gold:#e3c36a;--gold2:#b99743;--text:#f7f3e9;--muted:#aaa69c;--line:#403722;--rose:#e7a2b2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#352b16 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:88px}.top{display:flex;align-items:center;gap:12px;padding:18px 18px 12px;border-bottom:1px solid #28241b;position:sticky;top:0;background:#090909ed;backdrop-filter:blur(16px);z-index:5}
.mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#f0d98e,#a78030);display:grid;place-items:center;color:#17120a;font-size:23px;box-shadow:0 7px 25px #d4af3733}.brand{font-weight:850;letter-spacing:.2px;font-size:20px}.sub{font-size:11px;color:var(--muted)}.lab{margin-left:auto;border:1px solid #66552d;color:var(--gold);border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800;letter-spacing:.8px}
main{padding:18px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:1.8px;font-size:10px;font-weight:800}.hero h1{font-size:29px;line-height:1.13;margin:8px 0 7px;letter-spacing:-.7px}.hero p{color:var(--muted);margin:0 0 18px}.welcome{border:1px solid var(--line);background:linear-gradient(135deg,#211d13,#121212 75%);border-radius:22px;padding:19px;position:relative;overflow:hidden}.welcome:after{content:"🫰";position:absolute;right:15px;top:18px;font-size:32px;opacity:.85}.welcome h2{font-size:18px;margin:0 0 4px}.welcome p{color:#c2bba9;margin:0;font-size:13px;max-width:80%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#ffffff08;border:1px solid #ffffff0c;border-radius:13px;padding:10px}.stat strong{display:block;color:var(--gold);font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:25px 0 12px}.section-title h2{font-size:18px;margin:0}.section-title small{color:var(--muted);font-size:11px}
.chapters{display:grid;grid-template-columns:1fr 1fr;gap:11px}.chapter{min-height:160px;text-align:left;border:1px solid var(--line);border-radius:19px;padding:15px;color:var(--text);background:linear-gradient(145deg,#1c1a16,#111);position:relative;overflow:hidden;transition:transform .15s,border-color .15s}.chapter:active{transform:scale(.985)}.chapter:hover{border-color:var(--gold2)}.chapter .symbol{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#e3c36a15;color:var(--gold);font-size:22px;margin-bottom:12px}.chapter h3{margin:0 0 3px;font-size:15px}.chapter p{margin:0;color:var(--muted);font-size:11px;line-height:1.4}.state{display:inline-block;margin-top:10px;border:1px solid #5d4b27;color:var(--gold);font-size:9px;letter-spacing:.5px;text-transform:uppercase;border-radius:99px;padding:3px 7px}.state.live{color:#c2d3ff;border-color:#384b74}.state.future{color:#c5bfcf;border-color:#4c4655}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{background:#171717;border:1px solid #2d2b27;border-radius:14px;color:#ddd;padding:12px 4px;font-size:11px}.quick b{display:block;font-size:20px;margin-bottom:4px;color:var(--gold)}
.notice{border:1px dashed #66552d;background:#17140d;border-radius:14px;padding:12px;color:#d8c99f;font-size:11px;margin-top:16px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0b0b0bf2;border-top:1px solid #302a1c;backdrop-filter:blur(18px);z-index:10}.bottom button{border:0;background:transparent;color:#8f8b82;font-size:10px;padding:7px 1px}.bottom button .ico{display:block;font-size:19px;line-height:1.2;margin-bottom:3px}.bottom button.active{color:var(--gold)}
.page-head{margin-bottom:16px}.page-head h1{margin:5px 0;font-size:27px}.page-head p{margin:0;color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid #302b21;border-radius:18px;padding:15px;margin-bottom:12px}.row{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#73513d,#d5a5a2);font-size:19px;flex-shrink:0}.avatar.gold{background:linear-gradient(135deg,#775f2d,#e3c36a);color:#18130a}.grow{flex:1;min-width:0}.muted{color:var(--muted);font-size:12px}.pill{font-size:10px;border:1px solid #514323;color:var(--gold);border-radius:99px;padding:4px 8px}.post-photo{height:155px;border-radius:13px;background:linear-gradient(135deg,#44382a,#171313 60%,#5a3542);display:grid;place-items:center;font-size:46px;margin:12px 0}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:1px solid #4a3d21;border-radius:12px;background:#211d13;color:var(--gold);padding:10px 13px;font-weight:700;font-size:12px}.btn.primary{background:linear-gradient(135deg,#e6cb78,#b38b35);color:#171208;border:0}.btn.full{width:100%}.person{display:flex;align-items:center;gap:12px}.person .face{height:126px;width:100%;border-radius:14px;background:linear-gradient(145deg,#48352b,#8d5b60,#1c1717);display:grid;place-items:center;font-size:46px;margin-bottom:10px}.people{display:grid;grid-template-columns:1fr 1fr;gap:11px}.person-card{background:#171717;border:1px solid #342c20;border-radius:17px;padding:10px}.person-card h3{margin:0;font-size:14px}.person-card p{margin:0;color:var(--muted);font-size:11px}.premium{background:linear-gradient(135deg,#292111,#15120c);border:1px solid #826a32;border-radius:17px;padding:16px;margin-top:14px}.premium h3{margin:0;color:var(--gold)}.premium p{color:#c8bea5;font-size:12px;margin:5px 0 12px}.empty{padding:24px 15px;text-align:center;border:1px dashed #514323;border-radius:17px}.empty .big{font-size:36px}.empty h2{margin:8px 0 5px;font-size:18px}.empty p{color:var(--muted);font-size:12px;margin:0 0 14px}
@media(max-width:390px){main{padding:14px}.top{padding:14px}.hero h1{font-size:26px}.chapter{padding:12px;min-height:154px}.chapter h3{font-size:14px}.stats{gap:5px}.stat{padding:8px}.quick{gap:5px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="mark">🫰</div><div><div class="brand">EmiMatch</div><div class="sub">Conexiones que empiezan de verdad</div></div><span class="lab">LAB · DEMO</span></header>
<main id="screen"></main>
<nav class="bottom" aria-label="Navegación principal">
<button data-screen="inicio" class="active"><span class="ico">⌂</span>Inicio</button>
<button data-screen="citas"><span class="ico">♡</span>Citas</button>
<button data-screen="social"><span class="ico">◉</span>Social</button>
<button data-screen="mensajes"><span class="ico">▤</span>Mensajes</button>
<button data-screen="perfil"><span class="ico">♙</span>Perfil</button>
</nav>
</div>
<script>
const screen=document.getElementById('screen');
const titles={inicio:'Inicio',citas:'EmiMatch Citas',social:'EmiMatch Social',live:'EmiMatch Live',contenidos:'EmiMatch Contenidos',mensajes:'Mensajes',perfil:'Mi perfil'};
function header(k,desc){return '<div class="page-head"><div class="eyebrow">EMIMATCH · '+(k==='inicio'?'TU PLATAFORMA':titles[k].toUpperCase())+'</div><h1>'+titles[k]+'</h1><p>'+desc+'</p></div>'}
function home(){return '<section class="hero"><div class="eyebrow">UNA COMUNIDAD · CUATRO ESPACIOS</div><h1>Todo tu mundo,<br><span style="color:var(--gold)">en EmiMatch.</span></h1><p>Elegí cómo querés conectar hoy.</p></section><section class="welcome"><h2>¡Bienvenido a EmiMatch Lab!</h2><p>Esta es una demo visual para probar ideas sin acceder a cuentas ni pagos reales.</p><div class="stats"><div class="stat"><strong>7</strong><span>Matches de ejemplo</span></div><div class="stat"><strong>2/6</strong><span>Fotos de ejemplo</span></div><div class="stat"><strong>Demo</strong><span>Modo seguro</span></div></div></section><div class="section-title"><h2>Elegí tu capítulo</h2><small>Explorá la demo</small></div><div class="chapters"><button class="chapter" data-go="citas"><div class="symbol">♡</div><h3>EmiMatch Citas</h3><p>Perfiles, likes, matches y Premium.</p><span class="state">Base existente</span></button><button class="chapter" data-go="social"><div class="symbol">◉</div><h3>EmiMatch Social</h3><p>Publicaciones, fotos y comunidad.</p><span class="state">Demo interactiva</span></button><button class="chapter" data-go="live"><div class="symbol">◉</div><h3>EmiMatch Live</h3><p>Vivos, audiencia y regalos virtuales.</p><span class="state live">Concepto futuro</span></button><button class="chapter" data-go="contenidos"><div class="symbol">▣</div><h3>EmiMatch Contenidos</h3><p>Creadores, membresías y contenido exclusivo +18.</p><span class="state future">Concepto futuro</span></button></div><div class="section-title"><h2>Accesos rápidos</h2></div><div class="quick"><button data-go="citas"><b>♡</b>Me gusta</button><button data-go="mensajes"><b>▤</b>Chat</button><button data-go="perfil"><b>♙</b>Perfil</button><button data-go="citas"><b>✦</b>Premium</button></div><div class="notice">🔒 DEMO SEGURA: la información es ficticia. No se realizan registros, cobros ni publicaciones reales.</div>'}
function citas(){return header('citas','Conocé personas y encontrá conexiones reales.')+'<div class="people"><article class="person-card"><div class="face">🌷</div><h3>Lucía, 28</h3><p>Buenos Aires · Música y viajes</p><div class="actions"><button class="btn" data-toast="Like de prueba enviado">♡ Me gusta</button><button class="btn primary" data-toast="Perfil de ejemplo">Ver perfil</button></div></article><article class="person-card"><div class="face" style="background:linear-gradient(145deg,#2c3a36,#a78b69,#292018)">🌿</div><h3>Valentina, 31</h3><p>La Plata · Arte y naturaleza</p><div class="actions"><button class="btn" data-toast="Like de prueba enviado">♡ Me gusta</button><button class="btn primary" data-toast="Perfil de ejemplo">Ver perfil</button></div></article></div><div class="premium"><h3>✦ EmiMatch Premium</h3><p>Tu membresía para ampliar las posibilidades de conocer personas. Los beneficios y pagos reales no están conectados en esta demo.</p><button class="btn primary" data-toast="Vista previa: Premium no realiza cobros en Lab">Ver beneficios</button></div><div class="section-title"><h2>Lo que ya ofrece EmiMatch</h2></div><div class="card">♡ Likes y matches<br>▤ Chat y mensajes<br>♙ Perfiles y álbum de fotos<br>◉ Notificaciones y visitas al perfil<br>✦ Membresía Premium</div>'}
function social(){return header('social','Compartí momentos y descubrí a tu comunidad.')+'<div class="card"><div class="row"><div class="avatar gold">M</div><div class="grow"><strong>Tu publicación</strong><div class="muted">Demo privada · solo vista previa</div></div></div><div style="margin-top:12px;color:#ddd">¿Qué querés compartir hoy?</div><div class="actions"><button class="btn" data-toast="En la versión funcional podrás adjuntar fotos">＋ Foto</button><button class="btn" data-toast="Publicación simulada; no se envió nada">Vista previa</button></div></div><article class="card"><div class="row"><div class="avatar">🌻</div><div class="grow"><strong>Camila</strong><div class="muted">Hace 12 min · Publicación de ejemplo</div></div><span class="pill">Social</span></div><p>Un día para disfrutar las pequeñas cosas ✨</p><div class="post-photo">🌅</div><div class="muted">♡ 24 reacciones · 6 comentarios ficticios</div><div class="actions"><button class="btn" data-toast="Reacción de prueba">♡ Me gusta</button><button class="btn" data-toast="Comentarios de ejemplo">▤ Comentar</button><button class="btn" data-toast="Guardado solo en la demo">☆ Guardar</button></div></article><article class="card"><div class="row"><div class="avatar">🎨</div><div class="grow"><strong>Julián</strong><div class="muted">Ayer · Publicación de ejemplo</div></div></div><p>Terminando un proyecto nuevo. ¿Qué les parece?</p><div class="actions"><button class="btn" data-toast="Reacción de prueba">♡ Me gusta</button><button class="btn" data-toast="Comentarios de ejemplo">▤ Comentar</button></div></article><div class="notice">Próximas funciones a desarrollar: seguidores, amigos, solicitudes, privacidad por publicación, comentarios y reportes.</div>'}
function live(){return header('live','Un espacio futuro para transmitir y conectar en directo.')+'<div class="empty"><div class="big">◉</div><h2>EmiMatch Live</h2><p>La idea: transmisiones en vivo, chat en tiempo real, audiencia, regalos virtuales, flores y monedas para creadores.</p><span class="state live">Próxima etapa</span></div><div class="section-title"><h2>Diseñado para el futuro</h2></div><div class="card">▹ Crear una transmisión<br>▹ Ver vivos y seguir creadores<br>▹ Enviar regalos virtuales<br>▹ Herramientas de seguridad y moderación</div><div class="notice">No hay cámara, transmisión, monedas ni pagos activos en esta demo.</div>'}
function contenidos(){return header('contenidos','Un futuro espacio para creadores y contenido exclusivo.')+'<div class="empty"><div class="big">▣</div><h2>EmiMatch Contenidos</h2><p>Modelo de membresías para que creadores adultos verificados puedan ofrecer publicaciones exclusivas a sus suscriptores, con condiciones claras y herramientas de protección.</p><span class="state future">Planificación</span></div><div class="section-title"><h2>Antes de habilitarlo</h2></div><div class="card">✓ Verificación de mayoría de edad<br>✓ Consentimiento y derechos sobre el contenido<br>✓ Suscripciones y pagos seguros<br>✓ Denuncias, moderación y privacidad<br>✓ Revisión de requisitos legales y de distribución</div><div class="notice">Esta pantalla no muestra contenido explícito ni permite vender o comprar. La función requiere evaluación legal, de pagos y de las políticas de cada tienda.</div>'}
function mensajes(){return header('mensajes','Tus conversaciones, en un solo lugar.')+'<article class="card"><div class="row"><div class="avatar">🌷</div><div class="grow"><strong>Lucía</strong><div class="muted">¡Hola! ¿Cómo estuvo tu día?</div></div><span class="pill">Ejemplo</span></div></article><article class="card"><div class="row"><div class="avatar">🌿</div><div class="grow"><strong>Valentina</strong><div class="muted">Me encantó esa canción 🎵</div></div><span class="pill">Ejemplo</span></div></article><div class="notice">Los chats son ficticios. Esta demo no envía ni recibe mensajes reales.</div>'}
function perfil(){return header('perfil','Una vista previa del perfil y sus opciones.')+'<div class="card" style="text-align:center"><div class="avatar gold" style="width:78px;height:78px;margin:0 auto 12px;font-size:28px">M</div><h2 style="margin:0">Mati · Perfil de prueba</h2><p class="muted">Buenos Aires · Cuenta demo</p><div class="stats"><div class="stat"><strong>7</strong><span>Matches</span></div><div class="stat"><strong>2/6</strong><span>Fotos</span></div><div class="stat"><strong>Activa</strong><span>Estado demo</span></div></div><div class="actions" style="justify-content:center"><button class="btn" data-toast="Edición de perfil aún simulada">Editar perfil</button><button class="btn" data-toast="Configuración de ejemplo">Privacidad</button></div></div><div class="card">♡ Mi perfil de Citas<br>◉ Mi perfil Social<br>🔒 Privacidad y seguridad<br>⚙ Configuración<br>✉ Centro de ayuda</div><div class="notice">No se accede a tu cuenta real. Los datos de esta pantalla son ficticios.</div>'}
const renderers={inicio:home,citas,social,live,contenidos,mensajes,perfil};
function go(key){if(!renderers[key])return;screen.innerHTML=renderers[key]();document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.screen===key||(key==='live'||key==='contenidos')&&b.dataset.screen==='social'));window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const s=e.target.closest('[data-screen]');if(s){go(s.dataset.screen);return}const t=e.target.closest('[data-toast]');if(t){let old=document.getElementById('toast');if(old)old.remove();let el=document.createElement('div');el.id='toast';el.textContent=t.dataset.toast;el.style.cssText='position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#e3c36a;color:#15110a;padding:11px 16px;border-radius:13px;box-shadow:0 8px 30px #0009;z-index:30;font-size:12px;font-weight:700;width:max-content;max-width:90vw;text-align:center';document.body.appendChild(el);setTimeout(()=>el.remove(),2300)}});
go('inicio');
</script>
</body>
</html>
