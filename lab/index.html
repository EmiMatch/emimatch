function home(){return '<section class="hero"><div class="eyebrow">UNA COMUNIDAD · CUATRO ESPACIOS</div><h1>Todo tu mundo,<br>en EmiMatch.</h1><p>Elegí cómo querés conectar hoy.</p><div class="grid"><div class="stat"><b>7</b><small>Matches de ejemplo</small></div><div class="stat"><b>'+state.posts.length+'</b><small>Publicaciones demo</small></div><div class="stat"><b>'+state.people.filter(p=>p.friend).length+'</b><small>Amigos en esta sesión</small></div><div class="stat"><b>0</b><small>Datos reales</small></div></div></section><section class="card"><h2>Elegí tu capítulo</h2><div class="grid chapters"><button class="chapter" data-page="citas"><span class="symbol">♡</span><span><b>EmiMatch Citas</b><em>Perfiles, likes y matches.</em></span></button><button class="chapter" data-page="social"><span class="symbol">◉</span><span><b>EmiMatch Social</b><em>Publicaciones, historias y comunidad.</em></span></button><button class="chapter" data-page="live"><span class="symbol">◉</span><span><b>EmiMatch Live</b><em>Concepto futuro: vivos y regalos.</em></span></button><button class="chapter" data-page="contenidos"><span class="symbol">▣</span><span><b>EmiMatch Contenidos</b><em>Concepto futuro: creadores y membresías.</em></span></button></div></section><section class="card"><h2>Accesos rápidos</h2><div class="actions">'+btn('＋ Crear publicación','compose','')+btn('♙ Mi perfil','profile-me')+btn('♧ Solicitudes','requests')+btn('♧ Notificaciones ('+unread()+')','notifications')+'</div></section>'+note('DEMO SEGURA: todos los perfiles y las interacciones son ficticios. Los cambios solo viven en esta sesión y no se publican en internet.') }

function postCard(p){const own=p.owner===state.myName;const liked=p.likes.includes(state.myName);const nLikes=p.likes.length;const comments=p.comments.length;return '<article class="card" id="post-'+p.id+'"><div class="posthead">'+avatar(p.owner===state.myName?'🫰':(state.people.find(u=>u.name===p.owner)||{}).emoji||'♙')+'<div class="grow"><b>'+esc(p.owner)+'</b><div class="muted tiny">'+esc(p.created)+' · '+(p.privacy==='publico'?'🌐 Público':'♧ Amigos')+' · '+esc(p.topic)+'</div></div><button class="btn ghost" data-action="post-menu-'+p.id+'" aria-label="Opciones de publicación">•••</button></div><div class="postbody">'+esc(p.text)+'</div>'+(p.image?'<img class="postimage" alt="Imagen adjunta a una publicación de demo" src="'+p.image+'">':'')+'<div class="reactionline"><span>❤️ '+nLikes+' Me gusta</span><span>💬 '+comments+' comentarios</span>'+(p.shared?' <span>↗ '+p.shared+' compartidos</span>':'')+'</div><div class="actions">'+btn(liked?'♥ Te gusta':'♡ Me gusta','like-'+p.id,'secondary')+btn('💬 Comentar','comment-'+p.id,'secondary')+btn(p.saved?'★ Guardado':'☆ Guardar','save-'+p.id,'secondary')+btn('↗ Compartir','share-'+p.id,'secondary')+'</div><div class="actions" style="margin-top:7px">'+['❤️','😂','😮','✨'].map(e=>'<button class="btn ghost" data-action="react-'+p.id+'-'+e+'">'+e+'</button>').join('')+'</div>'+(comments?'<div style="margin-top:9px">'+p.comments.slice(-2).map(c=>'<div class="comment"><b>'+esc(c.name)+'</b><p>'+esc(c.text)+'</p></div>').join('')+'</div>':'')+'</article>'}

async function checkLiveUpdate(){
  const button=document.querySelector('[data-action="check-live-update"]');
  if(button){button.disabled=true;button.textContent='Buscando…';}
  const restore=()=>{if(button){button.disabled=false;button.textContent='↻ Actualizar';}};
  try{
    const url='https://raw.githubusercontent.com/EmiMatch/emimatch/lab-desarrollo/lab/index.html?ts='+Date.now();
    const response=await fetch(url,{cache:'no-store',mode:'cors'});
    if(!response.ok) throw new Error('No se pudo consultar la versión publicada.');
    const remote=await response.text();
    if(!remote.includes('name="lab-live-source" content="trusted"')||!remote.includes('EMIMATCH_LAB_LIVE_UPDATE_V1')||!remote.includes('EmiMatch Lab')) throw new Error('La versión descargada no pasó la verificación básica.');
    const getVersion=s=>{const m=s.match(/<meta name="lab-version" content="([^"]+)"/);return m?m[1]:null;};
    const current=getVersion(document.documentElement.outerHTML)||'0.0.0';
    const latest=getVersion(remote);
    if(!latest) throw new Error('La versión remota no declara su número.');
    if(latest===current){toast('EmiMatch Lab ya está actualizado (v'+current+').');return;}
    if(!confirm('Hay una actualización de EmiMatch Lab: v'+current+' → v'+latest+'. Se guardará en este dispositivo y se abrirá la nueva versión. ¿Actualizar ahora?')) return;
    localStorage.setItem('emimatchLabLiveHtml',remote);
    localStorage.setItem('emimatchLabLiveVersion',latest);
    sessionStorage.setItem('emimatchLabLiveBoot','1');
    document.open();document.write(remote);document.close();
  }catch(err){
    toast((navigator.onLine?'No se pudo actualizar: ':'Estás sin conexión. ')+(err&&err.message?err.message:'revisá tu conexión e intentá de nuevo.'));
  }finally{restore();}
}

if(a.startsWith('save-edit-post-')){id=Number(a.slice(15));p=state.posts.find(x=>x.id===id);if(p){p.text=$('#edit-post-text')?.value||p.text;modalroot.innerHTML='';render();toast('Publicación editada en demo.')}return}
if(a.startsWith('privacy-post-')){id=Number(a.slice(13));p=state.posts.find(x=>x.id===id);if(p)modal('Privacidad de publicación','<p>Elegí quién puede verla.</p><select id="new-post-privacy" class="field"><option value="publico" '+(p.privacy==='publico'?'selected':'')+'>Público</option><option value="amigos" '+(p.privacy==='amigos'?'selected':'')+'>Solo amigos</option><option value="privado" '+(p.privacy==='privado'?'selected':'')+'>Solo yo</option></select>'+btn('Guardar privacidad','save-privacy-'+id,'') );return}
if(a.startsWith('save-privacy-')){id=Number(a.slice(13));p=state.posts.find(x=>x.id===id);if(p){p.privacy=$('#new-post-privacy')?.value||p.privacy;modalroot.innerHTML='';render();toast('Privacidad actualizada en demo.')}return}
if(a.startsWith('delete-post-')){id=Number(a.slice(12));state.posts=state.posts.filter(x=>x.id!==id);modalroot.innerHTML='';render();toast('Publicación eliminada de la demo.');return}
if(a.startsWith('report-post-')){id=Number(a.slice(11));p=state.posts.find(x=>x.id===id);if(p)report('publicación',p.owner,'post:'+id);return}
if(a.startsWith('hide-post-')){id=Number(a.slice(10));p=state.posts.find(x=>x.id===id);if(p&&!state.blocked.includes(p.owner))state.blocked.push(p.owner);modalroot.innerHTML='';render();toast('Autor ocultado en esta demo.');return}
if(a.startsWith('follow-')){id=Number(a.slice(7));p=personById(id);if(p){p.following=!p.following;toast(p.following?'Ahora seguís a '+p.name+' (demo).':'Dejaste de seguir a '+p.name+'.');render()}return}
if(a.startsWith('friend-')){id=Number(a.slice(7));p=personById(id);if(p){if(p.friend){toast('Ya son amigos en esta demo.')}else if(p.requestIn){state.tab='solicitudes';state.page='social';render()}else if(p.requestOut){toast('La solicitud ya está pendiente.')}else if(state.allowRequests==='nadie'){toast('Tu configuración de demo no acepta solicitudes.')}else{p.requestOut=true;addNotif('friend','Enviaste una solicitud ficticia a '+p.name+'.',p.id);toast('Solicitud enviada solo en la demo.');render()}}return}
if(a.startsWith('accept-')){id=Number(a.slice(7));p=personById(id);if(p){p.friend=true;p.following=true;p.requestIn=false;addNotif('friend','Ahora sos amigo de '+p.name+'.',p.id);render();toast('Amistad aceptada en demo.')}return}
if(a.startsWith('reject-')){id=Number(a.slice(7));p=personById(id);if(p){p.requestIn=false;render();toast('Solicitud rechazada en demo.')}return}
if(a.startsWith('cancel-')){id=Number(a.slice(7));p=personById(id);if(p){p.requestOut=false;render();toast('Solicitud cancelada en demo.')}return}
if(a.startsWith('unfriend-')){id=Number(a.slice(9));p=personById(id);if(p){p.friend=false;render();toast('Amistad quitada en demo.')}return}
if(a.startsWith('view-person-')){id=Number(a.slice(12));p=personById(id);if(p){state.profilePerson=p;state.page='perfil-persona';render()}return}
if(a.startsWith('person-menu-')){id=Number(a.slice(12));p=personById(id);if(p)modal('Opciones de '+p.name,btn('⚑ Denunciar perfil','report-person-'+id,'secondary danger')+btn('🚫 Bloquear perfil','block-person-'+id,'secondary danger')+btn('Cancelar','close-modal','ghost'));return}
if(a.startsWith('report-person-')){id=Number(a.slice(13));p=personById(id);if(p)report('perfil',p.name,'person:'+id);return}
if(a.startsWith('block-person-')){id=Number(a.slice(13));p=personById(id);if(p&&!state.blocked.includes(p.name))state.blocked.push(p.name);modalroot.innerHTML='';go('social');toast('Perfil bloqueado solo en esta demo.');return}
if(a.startsWith('unblock-')){const n=decodeURIComponent(a.slice(8));state.blocked=state.blocked.filter(x=>x!==n);modalroot.innerHTML='';render();toast('Perfil desbloqueado en demo.');return}
if(a.startsWith('group-')){id=Number(a.slice(6));p=state.groups.find(x=>x.id===id);if(p){p.joined=!p.joined;p.members+=p.joined?1:-1;render();toast(p.joined?'Te uniste al grupo en demo.':'Saliste del grupo en demo.')}return}
if(a.startsWith('open-chat-')){id=Number(a.slice(10));p=personById(id);if(p){m=state.messages.find(x=>x.name===p.name);if(!m){m={id:Date.now(),name:p.name,emoji:p.emoji,preview:'Nueva conversación',time:'Ahora',unread:0,request:false,thread:[]};state.messages.unshift(m)}chat(m)}return}
if(a.startsWith('message-')){id=Number(a.slice(8));m=state.messages.find(x=>x.id===id);if(m){if(m.request){chat(m)}else{m.unread=0;chat(m)}}return}
if(a.startsWith('accept-message-')){id=Number(a.slice(15));m=state.messages.find(x=>x.id===id);if(m){m.request=false;toast('Solicitud aceptada en demo.');chat(m)}return}
if(a.startsWith('reject-message-')){id=Number(a.slice(15));state.messages=state.messages.filter(x=>x.id!==id);modalroot.innerHTML='';render();toast('Solicitud rechazada en demo.');return}
if(a.startsWith('date-like-')){toast('Like ficticio registrado.');return}
}
function report(kind,owner,target){modal('Denunciar '+kind,'<p>Seleccioná el motivo. Esta denuncia solo se registra dentro de la demo.</p><select id="report-reason" class="field"><option>Spam o publicidad engañosa</option><option>Acoso o comportamiento abusivo</option><option>Contenido inapropiado</option><option>Suplantación de identidad</option><option>Otro motivo</option></select><textarea id="report-detail" class="field" maxlength="300" placeholder="Detalles opcionales"></textarea>'+btn('Enviar denuncia de demo','send-report-'+encodeURIComponent(target)+'-'+encodeURIComponent(owner)+'-'+encodeURIComponent(kind),'')+btn('Cancelar','close-modal','secondary'))}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){go(nav.dataset.page);return}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return}const feed=e.target.closest('[data-feed]');if(feed){state.feed=feed.dataset.feed;render();return}const nf=e.target.closest('[data-notif-filter]');if(nf){state.noticeFilter=nf.dataset.notifFilter;render();return}const mf=e.target.closest('[data-msg-filter]');if(mf){state.msgFilter=mf.dataset.msgFilter;render();return}const b=e.target.closest('[data-action]');if(b){const a=b.dataset.action;if(a.startsWith('send-report-')){const parts=a.slice(12).split('-');state.reports.push({target:decodeURIComponent(parts[0]),owner:decodeURIComponent(parts[1]),kind:decodeURIComponent(parts[2]),reason:$('#report-reason')?.value||'Otro motivo',detail:$('#report-detail')?.value||''});modalroot.innerHTML='';toast('Denuncia guardada en el panel ficticio de la demo.');return}handleAction(a);return}if(e.target.classList.contains('modalback')){modalroot.innerHTML='';state.modal=null}});
document.addEventListener('input',e=>{if(e.target.id==='social-search'){const pos=e.target.selectionStart;state.search=e.target.value;const y=window.scrollY;render();const input=$('#social-search');if(input){input.focus();input.setSelectionRange(pos,pos)}window.scrollTo(0,y)}});
document.addEventListener('change',e=>{if(e.target.id==='profile-privacy'){state.profilePrivacy=e.target.value;toast('Preferencia de perfil guardada en esta sesión.')}if(e.target.id==='allow-requests'){state.allowRequests=e.target.value;toast('Preferencia guardada en esta sesión.')}if(e.target.id==='compose-image'||e.target.id==='quick-image'){imageToData(e.target.files&&e.target.files[0],data=>{if(e.target.id==='compose-image'){state.draftImage=data;const prev=$('#compose-preview');if(prev)prev.innerHTML='<img class="postimage" alt="Vista previa local" src="'+data+'">'}else{state.localPreview=data;const prev=$('#quick-preview');if(prev)prev.innerHTML='<img class="postimage" alt="Vista previa local" src="'+data+'">'}})}});
document.addEventListener('submit',e=>{if(e.target.id==='comment-form'){e.preventDefault();const p=state.posts.find(x=>x.id===Number(e.target.dataset.post)),text=$('#comment-input')?.value.trim();if(p&&text){p.comments.push({name:state.myName,text});if(p.owner!==state.myName)addNotif('comment','Comentaste una publicación de '+p.owner+'.');modalroot.innerHTML='';render();toast('Comentario añadido solo en demo.')}return}if(e.target.id==='profile-form'){e.preventDefault();state.myName=$('#edit-name').value.trim()||'Tu perfil demo';state.myBio=$('#edit-bio').value.trim();state.myCity=$('#edit-city').value.trim();modalroot.innerHTML='';render();toast('Perfil actualizado en esta sesión.');return}if(e.target.id==='chat-form'){e.preventDefault();const m=state.messages.find(x=>x.id===state.activeChat),text=$('#chat-input')?.value.trim();if(m&&text){m.thread.push({from:state.myName,text});m.preview=text;m.time='Ahora';modalroot.innerHTML='';chat(m);toast('Mensaje añadido solo a la conversación demo.')}return}});
render();
})();
</script>
</body>
</html>
