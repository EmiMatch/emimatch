<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909"><meta name="description" content="EmiMatch Lab: demo experimental aislada de EmiMatch.">
<title>EmiMatch Lab · Demo</title>
<style>
:root{--bg:#090909;--panel:#151515;--panel2:#211c11;--gold:#e3c36a;--gold2:#b99743;--text:#f7f3e9;--muted:#aaa69c;--line:#403722;--green:#9bc9a4;--rose:#e7a2b2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#352b16 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:88px}.top{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;border-bottom:1px solid #28241b;position:sticky;top:0;background:#090909ed;backdrop-filter:blur(16px);z-index:5}.mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#f0d98e,#a78030);display:grid;place-items:center;color:#17120a;font-size:23px;box-shadow:0 7px 25px #d4af3733}.brand{font-weight:850;font-size:20px}.sub{font-size:11px;color:var(--muted)}.lab{margin-left:auto;border:1px solid #66552d;color:var(--gold);border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800;letter-spacing:.8px}main{padding:18px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:1.6px;font-size:10px;font-weight:800}.hero h1{font-size:29px;line-height:1.13;margin:8px 0 7px;letter-spacing:-.7px}.hero p,.page-head p{color:var(--muted);margin:0 0 18px}.welcome{border:1px solid var(--line);background:linear-gradient(135deg,#211d13,#121212 75%);border-radius:22px;padding:19px;position:relative;overflow:hidden}.welcome:after{content:"🫰";position:absolute;right:15px;top:18px;font-size:32px}.welcome h2{font-size:18px;margin:0 0 4px}.welcome p{color:#c2bba9;margin:0;font-size:13px;max-width:80%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#ffffff08;border:1px solid #ffffff0c;border-radius:13px;padding:10px}.stat strong{display:block;color:var(--gold);font-size:18px}.stat span{font-size:10px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:end;margin:24px 0 12px}.section-title h2{font-size:18px;margin:0}.section-title small{color:var(--muted);font-size:11px}.chapters{display:grid;grid-template-columns:1fr 1fr;gap:11px}.chapter{min-height:155px;text-align:left;border:1px solid var(--line);border-radius:19px;padding:14px;color:var(--text);background:linear-gradient(145deg,#1c1a16,#111);position:relative;overflow:hidden}.chapter:active{transform:scale(.985)}.chapter:hover{border-color:var(--gold2)}.symbol{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#e3c36a15;color:var(--gold);font-size:22px;margin-bottom:10px}.chapter h3{margin:0 0 3px;font-size:15px}.chapter p{margin:0;color:var(--muted);font-size:11px;line-height:1.4}.state{display:inline-block;margin-top:9px;border:1px solid #5d4b27;color:var(--gold);font-size:9px;letter-spacing:.5px;text-transform:uppercase;border-radius:99px;padding:3px 7px}.state.live{color:var(--green);border-color:#34523c}.state.future{color:#c5bfcf;border-color:#4c4655}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{background:#171717;border:1px solid #2d2b27;border-radius:14px;color:#ddd;padding:12px 4px;font-size:11px}.quick b{display:block;font-size:20px;margin-bottom:4px;color:var(--gold)}.notice{border:1px dashed #66552d;background:#17140d;border-radius:14px;padding:12px;color:#d8c99f;font-size:11px;margin-top:16px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0b0b0bf2;border-top:1px solid #302a1c;backdrop-filter:blur(18px);z-index:10}.bottom button{border:0;background:transparent;color:#8f8b82;font-size:10px;padding:7px 1px}.bottom .ico{display:block;font-size:19px;line-height:1.2;margin-bottom:3px}.bottom button.active{color:var(--gold)}.page-head{margin-bottom:16px}.page-head h1{margin:5px 0;font-size:27px}.page-head p{margin:0;color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid #302b21;border-radius:18px;padding:15px;margin-bottom:12px}.row{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#73513d,#d5a5a2);font-size:19px;flex-shrink:0}.avatar.gold{background:linear-gradient(135deg,#775f2d,#e3c36a);color:#18130a}.grow{flex:1;min-width:0}.muted{color:var(--muted);font-size:12px}.pill{font-size:10px;border:1px solid #514323;color:var(--gold);border-radius:99px;padding:4px 8px;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #4a3d21;border-radius:12px;background:#211d13;color:var(--gold);padding:10px 13px;font-weight:700;font-size:12px}.btn.primary{background:linear-gradient(135deg,#e6cb78,#b38b35);color:#171208;border:0}.btn.soft{background:#191919;border-color:#38342a;color:#ddd}.btn:disabled{opacity:.5}.people{display:grid;grid-template-columns:1fr 1fr;gap:11px}.person-card{background:#171717;border:1px solid #342c20;border-radius:17px;padding:10px;min-width:0}.face{height:126px;width:100%;border-radius:14px;background:linear-gradient(145deg,#48352b,#8d5b60,#1c1717);display:grid;place-items:center;font-size:46px;margin-bottom:10px}.person-card h3{margin:0;font-size:14px}.person-card p{margin:0;color:var(--muted);font-size:11px}.premium{background:linear-gradient(135deg,#292111,#15120c);border:1px solid #826a32;border-radius:17px;padding:16px;margin-top:14px}.premium h3{margin:0;color:var(--gold)}.premium p{color:#c8bea5;font-size:12px;margin:5px 0 12px}.empty{padding:24px 15px;text-align:center;border:1px dashed #514323;border-radius:17px}.empty .big{font-size:36px}.empty h2{margin:8px 0 5px;font-size:18px}.empty p{color:var(--muted);font-size:12px;margin:0 0 14px}.post-photo{height:155px;border-radius:13px;background:linear-gradient(135deg,#44382a,#171313 60%,#5a3542);display:grid;place-items:center;font-size:46px;margin:12px 0}.input,.textarea,.select{width:100%;background:#0f0f0f;border:1px solid #49402d;border-radius:12px;padding:11px;color:var(--text);font-size:13px}.textarea{resize:vertical;min-height:82px}.field-label{display:block;font-size:11px;color:var(--muted);margin:9px 0 5px}.separator{border:0;border-top:1px solid #302b21;margin:14px 0}.list-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #29251e}.list-row:last-child{border-bottom:0}.list-row .grow{font-size:13px}.bubble{background:#292317;border:1px solid #504126;padding:10px 12px;border-radius:14px;font-size:13px;margin:9px 0;max-width:88%}.bubble.mine{margin-left:auto;background:#47391d;color:#fff1bf}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--gold);color:#15110a;padding:11px 16px;border-radius:13px;box-shadow:0 8px 30px #0009;z-index:40;font-size:12px;font-weight:750;width:max-content;max-width:90vw;text-align:center}.modal-wrap{position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}.modal{width:min(620px,100%);max-height:88vh;overflow:auto;background:#121212;border:1px solid #65512b;border-radius:22px;padding:18px;box-shadow:0 20px 70px #000b}.modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-top h2{font-size:19px;margin:0}.close{border:1px solid #514323;border-radius:10px;background:#211d13;color:var(--gold);padding:5px 10px}.tag-list{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tag{border:1px solid #514323;border-radius:99px;padding:5px 9px;color:#dfcf9f;font-size:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:390px){main{padding:14px}.top{padding:14px}.hero h1{font-size:26px}.chapter{padding:11px;min-height:150px}.chapter h3{font-size:14px}.stats{gap:5px}.stat{padding:8px}.quick{gap:5px}.btn{padding:9px 10px}}
</style></head>
<body><div class="app">
<header class="top"><div class="mark">🫰</div><div><div class="brand">EmiMatch</div><div class="sub">Conexiones que empiezan de verdad</div></div><button class="close" data-check-update aria-label="Buscar actualizaciones" style="margin-left:auto;white-space:nowrap">↻ Actualizar</button><span class="lab">LAB · DEMO</span></header>
<main id="screen" aria-live="polite"></main>
<nav class="bottom" aria-label="Navegación principal"><button data-screen="inicio" class="active"><span class="ico">⌂</span>Inicio</button><button data-screen="citas"><span class="ico">♡</span>Citas</button><button data-screen="social"><span class="ico">◉</span>Social</button><button data-screen="mensajes"><span class="ico">▤</span>Mensajes</button><button data-screen="perfil"><span class="ico">♙</span>Perfil</button></nav></div>
<div id="overlay"></div>
<script>
const screen=document.getElementById('screen'),overlay=document.getElementById('overlay');
const titles={inicio:'Inicio',citas:'EmiMatch Citas',social:'EmiMatch Social',live:'EmiMatch Live',contenidos:'EmiMatch Contenidos',mensajes:'Mensajes',perfil:'Mi perfil'};
const state={likes:new Set(),saved:new Set(),following:new Set(),friends:new Set(),comments:{1:[],2:[]},posts:[],chats:[],messages:{lucia:[{mine:false,text:'¡Hola! ¿Cómo estuvo tu día?'}],valentina:[{mine:false,text:'Me encantó esa canción 🎵'}]},activeChat:'lucia',profileName:'Mati',bio:'Me gusta conocer personas, la música y los buenos momentos.',privacy:'Amigos',premiumTab:'beneficios',liveTab:'explorar',contentTab:'creadores',socialTab:'feed',friendRequests:new Set(),incomingRequests:new Set(['lucia']),reports:[]};
const people=[{id:'lucia',name:'Lucía',age:28,city:'Buenos Aires',interests:'Música y viajes',emoji:'🌷',bio:'Disfruto descubrir lugares nuevos, escuchar música y compartir charlas largas.',tags:['Música','Viajes','Cafés']},{id:'valentina',name:'Valentina',age:31,city:'La Plata',interests:'Arte y naturaleza',emoji:'🌿',bio:'Me encantan el arte, las caminatas y los planes tranquilos al aire libre.',tags:['Arte','Naturaleza','Fotografía']}];
const feed=[{id:1,name:'Camila',emoji:'🌻',time:'Hace 12 min',text:'Un día para disfrutar las pequeñas cosas ✨',photo:'🌅',likes:24,comments:6},{id:2,name:'Julián',emoji:'🎨',time:'Ayer',text:'Terminando un proyecto nuevo. ¿Qué les parece?',photo:'🎨',likes:12,comments:3}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function header(k,desc){return '<div class="page-head"><div class="eyebrow">EMIMATCH · '+(k==='inicio'?'TU PLATAFORMA':titles[k].toUpperCase())+'</div><h1>'+titles[k]+'</h1><p>'+desc+'</p></div>'}
function home(){return '<section class="hero"><div class="eyebrow">UNA COMUNIDAD · CUATRO ESPACIOS</div><h1>Todo tu mundo,<br><span style="color:var(--gold)">en EmiMatch.</span></h1><p>Elegí cómo querés conectar hoy.</p></section><section class="welcome"><h2>¡Bienvenido a EmiMatch Lab!</h2><p>Una demo interactiva para probar ideas sin acceder a cuentas ni pagos reales.</p><div class="stats"><div class="stat"><strong>7</strong><span>Matches de ejemplo</span></div><div class="stat"><strong>2/6</strong><span>Fotos de ejemplo</span></div><div class="stat"><strong>Demo</strong><span>Modo seguro</span></div></div></section><div class="section-title"><h2>Elegí tu capítulo</h2><small>Explorá la demo</small></div><div class="chapters"><button class="chapter" data-go="citas"><div class="symbol">♡</div><h3>EmiMatch Citas</h3><p>Perfiles, likes, matches y Premium.</p><span class="state">Base existente</span></button><button class="chapter" data-go="social"><div class="symbol">◉</div><h3>EmiMatch Social</h3><p>Publicaciones, fotos y comunidad.</p><span class="state">Demo interactiva</span></button><button class="chapter" data-go="live"><div class="symbol">◉</div><h3>EmiMatch Live</h3><p>Vivos, audiencia y regalos virtuales.</p><span class="state live">Concepto futuro</span></button><button class="chapter" data-go="contenidos"><div class="symbol">▣</div><h3>EmiMatch Contenidos</h3><p>Creadores, membresías y contenido exclusivo +18.</p><span class="state future">Concepto futuro</span></button></div><div class="section-title"><h2>Accesos rápidos</h2></div><div class="quick"><button data-go="citas"><b>♡</b>Me gusta</button><button data-go="mensajes"><b>▤</b>Chat</button><button data-go="perfil"><b>♙</b>Perfil</button><button data-go="premium"><b>✦</b>Premium</button></div><div class="notice">🔒 DEMO SEGURA: todos los datos son ficticios. Las acciones se guardan solo en la memoria temporal de esta demo.</div>'}
function citas(){return header('citas','Conocé personas y encontrá conexiones reales.')+'<div class="people">'+people.map(p=>'<article class="person-card"><div class="face">'+p.emoji+'</div><h3>'+p.name+', '+p.age+'</h3><p>'+p.city+' · '+p.interests+'</p><div class="actions"><button class="btn '+(state.likes.has(p.id)?'primary':'')+'" data-like="'+p.id+'">'+(state.likes.has(p.id)?'♥ Te gusta':'♡ Me gusta')+'</button><button class="btn soft" data-profile="'+p.id+'">Ver perfil</button></div></article>').join('')+'</div><div class="premium"><h3>✦ EmiMatch Premium</h3><p>Más posibilidades de conocer personas, con una experiencia ampliada. Esta demo no realiza cobros.</p><button class="btn primary" data-go="premium">Ver beneficios</button></div><div class="section-title"><h2>Lo que ya ofrece EmiMatch</h2></div><div class="card">♡ Likes y matches<br>▤ Chat y mensajes<br>♙ Perfiles y álbum de fotos<br>◉ Notificaciones y visitas al perfil<br>✦ Membresía Premium</div>'}
function social(){
 const posts=[...state.posts,...feed];
 const community='<div class="card"><div class="section-title" style="margin-top:0"><h2>Tu comunidad</h2><span class="pill">Vista previa</span></div><div class="actions"><button class="btn '+(state.socialTab==='feed'?'primary':'soft')+'" data-social-tab="feed">Publicaciones</button><button class="btn '+(state.socialTab==='personas'?'primary':'soft')+'" data-social-tab="personas">Personas</button><button class="btn '+(state.socialTab==='solicitudes'?'primary':'soft')+'" data-social-tab="solicitudes">Solicitudes ('+state.friendRequests.size+')</button><button class="btn '+(state.socialTab==='guardados'?'primary':'soft')+'" data-social-tab="amigos">Amigos</button><button class="btn soft" data-social-tab="guardados">Guardados</button></div></div>';
 const composer='<div class="card"><div class="row"><div class="avatar gold">M</div><div class="grow"><strong>'+esc(state.profileName)+'</strong><div class="muted">Crear publicación · Demo privada</div></div></div><label class="field-label" for="postText">¿Qué querés compartir hoy?</label><textarea class="textarea" id="postText" maxlength="300" placeholder="Escribí algo para tu comunidad..."></textarea><label class="field-label" for="postPrivacy">¿Quién puede ver esta publicación?</label><select class="select" id="postPrivacy"><option>Amigos</option><option>Seguidores</option><option>Público</option><option>Solo yo</option></select><div class="actions"><button class="btn soft" data-toast="La carga de fotos reales se habilitará en una etapa posterior">＋ Foto (vista previa)</button><button class="btn primary" data-action="publish">Publicar en demo</button></div><div class="muted" style="margin-top:8px">Solo se guarda en esta demo y se pierde al cerrarla.</div></div>';
 const feedHtml=posts.map(p=>'<article class="card"><div class="row"><div class="avatar">'+(p.emoji||'M')+'</div><div class="grow"><strong>'+esc(p.name)+'</strong><div class="muted">'+esc(p.time||'Ahora · Tu publicación')+' · '+esc(p.privacy||'Público')+'</div></div><button class="close" data-report="'+p.id+'" aria-label="Reportar publicación">⚑</button></div><p>'+esc(p.text)+'</p>'+(p.photo?'<div class="post-photo">'+p.photo+'</div>':'')+'<div class="muted">♡ '+(p.likes+(state.comments[p.id]||[]).length+(state.likes.has('post'+p.id)?1:0))+' reacciones · '+(p.comments+(state.comments[p.id]||[]).length)+' comentarios</div><div class="actions"><button class="btn '+(state.likes.has('post'+p.id)?'primary':'soft')+'" data-post-like="'+p.id+'">'+(state.likes.has('post'+p.id)?'♥ Me gusta':'♡ Me gusta')+'</button><button class="btn soft" data-comments="'+p.id+'">▤ Comentar</button><button class="btn soft" data-save="'+p.id+'">'+(state.saved.has(p.id)?'★ Guardado':'☆ Guardar')+'</button></div>'+(state.comments[p.id]||[]).map(x=>'<div class="bubble">'+esc(x)+'</div>').join('')+'</article>').join('');
 const persons='<div class="section-title"><h2>Personas para conocer</h2><small>Perfiles ficticios</small></div>'+people.map(p=>'<article class="card"><div class="row"><div class="avatar">'+p.emoji+'</div><div class="grow"><strong>'+p.name+'</strong><div class="muted">'+p.city+' · '+p.interests+'</div></div></div><p>'+p.bio+'</p><div class="actions"><button class="btn '+(state.following.has(p.id)?'primary':'soft')+'" data-follow="'+p.id+'">'+(state.following.has(p.id)?'✓ Siguiendo':'＋ Seguir')+'</button><button class="btn '+(state.friendRequests.has(p.id)?'primary':'soft')+'" data-friend="'+p.id+'">'+(state.friendRequests.has(p.id)?'✓ Solicitud enviada':'♙ Agregar amigo')+'</button><button class="btn soft" data-profile="'+p.id+'">Ver perfil</button></div></article>').join('');
 const requests=state.socialTab==='solicitudes'?'<div class="card"><h3>Solicitudes recibidas</h3>'+(state.incomingRequests.size?[...state.incomingRequests].map(id=>{const p=people.find(x=>x.id===id);return p?'<div class="list-row"><div class="avatar">'+p.emoji+'</div><div class="grow"><strong>'+p.name+'</strong><div class="muted">Quiere conectar contigo · demo</div></div><button class="btn primary" data-accept-friend="'+id+'">Aceptar</button><button class="btn soft" data-reject-friend="'+id+'">Rechazar</button></div>':''}).join(''):'<p class="muted">No tenés solicitudes recibidas pendientes.</p>')+'</div><div class="card"><h3>Solicitudes enviadas</h3>'+(state.friendRequests.size?[...state.friendRequests].map(id=>{const p=people.find(x=>x.id===id);return p?'<div class="list-row"><div class="avatar">'+p.emoji+'</div><div class="grow"><strong>'+p.name+'</strong><div class="muted">Solicitud de prueba enviada</div></div><button class="btn soft" data-friend="'+id+'">Cancelar</button></div>':''}).join(''):'<p class="muted">No enviaste solicitudes. Visitá Personas para conectar.</p>')+'</div>':'';
 const friends=state.socialTab==='amigos'?'<div class="section-title"><h2>Tus amigos</h2><small>Conexiones de prueba</small></div>'+[...state.friends].map(id=>{const p=people.find(x=>x.id===id);return p?'<div class="card"><div class="row"><div class="avatar">'+p.emoji+'</div><div class="grow"><strong>'+p.name+'</strong><div class="muted">'+p.city+' · Amistad de demo</div></div><button class="btn soft" data-chat="'+p.id+'">Mensaje</button><button class="btn soft" data-remove-friend="'+p.id+'">Quitar</button></div></div>':''}).join('')+(state.friends.size?'':'<div class="empty"><div class="big">♙</div><h2>Tu lista empieza acá</h2><p>Aceptá una solicitud o enviá una desde Personas para probar esta sección.</p><button class="btn primary" data-social-tab="personas">Buscar personas</button></div>'):'';

 const saved=state.socialTab==='guardados'?'<div class="section-title"><h2>Tus publicaciones guardadas</h2></div>'+posts.filter(p=>state.saved.has(p.id)).map(p=>'<div class="card"><strong>'+esc(p.name)+'</strong><p>'+esc(p.text)+'</p><button class="btn soft" data-save="'+p.id+'">Quitar de guardados</button></div>').join('')+(posts.some(p=>state.saved.has(p.id))?'':'<div class="empty"><div class="big">☆</div><h2>No hay publicaciones guardadas</h2><p>Usá “Guardar” en una publicación para verla aquí.</p></div>'):'';
 return header('social','Un muro para compartir momentos, conocer personas y construir tu comunidad.')+community+(state.socialTab==='feed'?composer+feedHtml:state.socialTab==='personas'?persons:state.socialTab==='solicitudes'?requests:state.socialTab==='amigos'?friends:saved)+'<div class="notice">Demo segura: los datos son ficticios y temporales. Las funciones reales de seguidores, amigos, privacidad, fotos y reportes deberán conectarse a una base de datos con permisos y moderación antes de publicar.</div>'
}

 const friend=e.target.closest('[data-friend]');if(friend){const id=friend.dataset.friend;if(state.friendRequests.has(id))state.friendRequests.delete(id);else state.friendRequests.add(id);state.socialTab='personas';go('social');toast(state.friendRequests.has(id)?'Solicitud de amistad simulada enviada':'Solicitud de prueba cancelada');return}

async function checkLabUpdate(){
 const btn=document.querySelector('[data-check-update]');
 if(btn){btn.disabled=true;btn.textContent='Buscando…'}
 try{
  const url='https://raw.githubusercontent.com/EmiMatch/emimatch/lab-desarrollo/lab/index.html?refresh='+Date.now();
  const response=await fetch(url,{method:'GET',cache:'no-store',headers:{'Accept':'text/plain, text/html;q=0.9,*/*;q=0.8'}});
  if(!response.ok)throw new Error('No se pudo consultar la versión publicada');
  const latest=await response.text();
  const required=['LAB · DEMO','data-check-update','incomingRequests','data-social-tab="personas"','data-social-tab="solicitudes"','data-social-tab="amigos"','data-social-tab="guardados"','data-accept-friend','data-reject-friend'];
  if(latest.length<10000||required.some(part=>!latest.includes(part)))throw new Error('La versión remota no contiene todas las pantallas de Social');
  const version='social-tabs-2026-10-20-v2';
  const updated=latest.replace('</head>','<meta name="emimatch-lab-ui-version" content="'+version+'"></head>');
  // No confiar en localStorage para decidir si actualizar: puede quedar guardado
  // un HTML nuevo aunque una carga anterior no haya terminado.
  document.open();
  document.write(updated);
  document.close();
 }catch(err){
  console.error('EmiMatch Lab update failed:',err);
  toast('No se pudo actualizar. Revisá tu conexión y volvé a tocar Actualizar.');
  if(btn){btn.disabled=false;btn.textContent='↻ Actualizar'}
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-check-update]');if(b){e.preventDefault();checkLabUpdate()}});
go('inicio');
</script></body></html>
