<!-- =====================================================
     EMI MATCH — MI ÁLBUM DE FOTOS
     ===================================================== -->

<section id="albumSection" class="album-section">

  <div class="album-header">

    <div>
      <h2>📸 Mi álbum</h2>

      <p>
        Agregá fotos para mostrar más de vos.
      </p>
    </div>

    <span id="albumCount">
      0 fotos
    </span>

  </div>

  <!-- Selector de fotos -->

  <label
    for="albumInput"
    class="album-upload-button"
  >
    ➕ Agregar fotos
  </label>

  <input
    id="albumInput"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    multiple
    hidden
  >

  <!-- Estado de carga -->

  <div
    id="albumStatus"
    class="album-status"
    aria-live="polite"
  ></div>

  <!-- Galería -->

  <div
    id="albumGrid"
    class="album-grid"
  >

    <div
      id="albumEmpty"
      class="album-empty"
    >
      <div class="album-empty-icon">
        🖼️
      </div>

      <strong>
        Tu álbum está vacío
      </strong>

      <span>
        Agregá algunas fotos para completar tu perfil.
      </span>
    </div>

  </div>

</section>


<style>

  .album-section {
    margin-top: 28px;
    padding: 20px;

    border-radius: 22px;

    background:
      rgba(255,255,255,.06);

    border:
      1px solid rgba(255,255,255,.10);

    box-shadow:
      0 15px 45px rgba(0,0,0,.18);
  }


  .album-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 16px;

    margin-bottom: 16px;
  }


  .album-header h2 {
    margin: 0;

    font-size: 20px;
    font-weight: 800;
  }


  .album-header p {
    margin: 6px 0 0;

    color:
      rgba(255,255,255,.65);

    font-size: 13px;
  }


  #albumCount {
    flex-shrink: 0;

    padding:
      7px 10px;

    border-radius: 999px;

    background:
      rgba(255,255,255,.08);

    color:
      rgba(255,255,255,.75);

    font-size: 12px;

    font-weight: 700;
  }


  .album-upload-button {
    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 48px;

    padding:
      12px 16px;

    border-radius: 15px;

    cursor: pointer;

    color: #fff;

    font-weight: 800;

    background:
      linear-gradient(
        135deg,
        #7654d8,
        #a14fbc
      );

    box-shadow:
      0 10px 25px rgba(118,84,216,.20);

    transition:
      transform .15s ease,
      opacity .15s ease;
  }


  .album-upload-button:active {
    transform: scale(.98);
  }


  .album-status {
    min-height: 22px;

    margin:
      12px 2px;

    text-align: center;

    color:
      rgba(255,255,255,.72);

    font-size: 13px;
  }


  .album-grid {
    display: grid;

    grid-template-columns:
      repeat(3, minmax(0, 1fr));

    gap: 9px;

    margin-top: 14px;
  }


  .album-item {
    position: relative;

    overflow: hidden;

    aspect-ratio: 1 / 1;

    border-radius: 15px;

    background:
      rgba(255,255,255,.06);

    border:
      1px solid rgba(255,255,255,.08);
  }


  .album-item img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
  }


  .album-primary {
    position: absolute;

    left: 7px;
    top: 7px;

    padding:
      5px 7px;

    border-radius: 999px;

    background:
      rgba(0,0,0,.68);

    color: #fff;

    font-size: 10px;

    font-weight: 800;
  }


  .album-delete {
    position: absolute;

    right: 7px;
    bottom: 7px;

    width: 34px;
    height: 34px;

    border: 0;

    border-radius: 50%;

    cursor: pointer;

    background:
      rgba(0,0,0,.72);

    color: #fff;

    font-size: 15px;
  }


  .album-empty {
    grid-column: 1 / -1;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 7px;

    min-height: 150px;

    text-align: center;

    color:
      rgba(255,255,255,.65);
  }


  .album-empty-icon {
    font-size: 38px;

    margin-bottom: 3px;
  }


  .album-empty strong {
    color: #fff;

    font-size: 14px;
  }


  .album-empty span {
    max-width: 280px;

    font-size: 12px;

    line-height: 1.5;
  }


  @media (max-width: 420px) {

    .album-section {
      padding: 16px;
    }

    .album-grid {
      gap: 7px;
    }

  }

    </style>
