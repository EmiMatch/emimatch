<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mi Perfil - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #222;
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .tarjeta {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,.16);
    }

    h1 {
      text-align: center;
      color: #764ba2;
      margin: 0 0 5px;
    }

    .subtitulo {
      text-align: center;
      color: #888;
      margin-bottom: 20px;
    }

    /* FOTO */

    .foto-contenedor {
      text-align: center;
      margin-bottom: 20px;
    }

    .foto-perfil {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #764ba2;
      background: #eee;
    }

    .estado {
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #159447;
    }

    /* CAMPOS */

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #764ba2;
    }

    input[type="file"] {
      background: #fafafa;
    }

    /* BOTÓN GUARDAR */

    .guardar {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      margin-top: 22px;
      background: linear-gradient(
        135deg,
        #667eea,
        #764ba2
      );
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .guardar:active {
      transform: scale(.98);
    }

    /* BOTONES */

    .botones {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    .boton {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      background: white;
      color: #764ba2;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,.10);
    }

    /* NOTIFICACIONES */

    .notificaciones {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .notificaciones-izq {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .campana {
      font-size: 24px;
    }

    .badge {
      background: #ff3040;
      color: white;
      min-width: 25px;
      height: 25px;
      padding: 0 7px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    /* MENSAJES */

    #mensaje {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      min-height: 20px;
    }

    .exito {
      color: #159447;
    }

    .error {
      color: #c62828;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <div class="tarjeta">

    <h1>Mi perfil</h1>

    <div class="subtitulo">
      Completá tu información
    </div>


    <!-- FOTO -->

    <div class="foto-contenedor">

      <img
        id="fotoPerfil"
        class="foto-perfil"
        src="https://via.placeholder.com/300?text=💕"
        alt="Foto de perfil"
      >

      <div
        id="estadoOnline"
        class="estado"
      >
        🟢 En línea
      </div>

    </div>


    <!-- ARCHIVO -->

    <label>
      Foto de perfil
    </label>

    <input
      type="file"
      id="fotoArchivo"
      accept="image/*"
    >


    <!-- NOMBRE -->

    <label for="nombre">
      Nombre
    </label>

    <input
      type="text"
      id="nombre"
      placeholder="Tu nombre"
    >


    <!-- EDAD -->

    <label for="edad">
      Edad
    </label>

    <input
      type="number"
      id="edad"
      placeholder="Tu edad"
      min="18"
      max="100"
    >


    <!-- CIUDAD -->

    <label for="ciudad">
      Ciudad
    </label>

    <input
      type="text"
      id="ciudad"
      placeholder="Tu ciudad"
    >


    <!-- DESCRIPCIÓN -->

    <label for="descripcion">
      Sobre mí
    </label>

    <textarea
      id="descripcion"
      placeholder="Contanos un poco sobre vos..."
    ></textarea>


    <!-- INTERESES -->

    <label for="intereses">
      Intereses
    </label>

    <input
      type="text"
      id="intereses"
      placeholder="Música, fútbol, viajes..."
    >


    <!-- GUARDAR -->

    <button
      class="guardar"
      onclick="guardarPerfil()"
    >
      💾 Guardar perfil
    </button>


    <div id="mensaje"></div>

  </div>


  <!-- BOTONES -->

  <div class="botones">


    <!-- NOTIFICACIONES -->

    <button
      class="boton notificaciones"
      onclick="abrirNotificaciones()"
    >

      <div class="notificaciones-izq">

        <span class="campana">
          🔔
        </span>

        <span>
          Notificaciones
        </span>

      </div>

      <div
        id="badgeNotificaciones"
        class="badge"
        style="display:none"
      >
        0
      </div>

    </button>


    <!-- MATCHES -->

    <button
      class="boton"
      onclick="irMatches()"
    >
      💕 Mis Matches
    </button>


    <!-- DESCUBRIR -->

    <button
      class="boton"
      onclick="irDescubrir()"
    >
      🔎 Descubrir
    </button>

  </div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;


/* ==========================================
   INICIO
========================================== */

async function iniciar() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (
    error ||
    !data.session
  ) {

    window.location.href =
      "./index.html";

    return;
  }


  usuarioActual =
    data.session.user;


  await cargarPerfil();

  await actualizarEstado();

  await actualizarNotificaciones();

  escucharNotificaciones();

}


/* ==========================================
   CARGAR PERFIL
========================================== */

async function cargarPerfil() {

  const {
    data: perfil,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nombre,edad,ciudad,descripcion,foto_url,intereses,online,last_seen"
      )
      .eq(
        "id",
        usuarioActual.id
      )
      .maybeSingle();


  if (
    error
  ) {

    console.error(error);

    mostrarMensaje(
      "Error cargando perfil",
      true
    );

    return;
  }


  if (!perfil) {
    return;
  }


  document.getElementById(
    "nombre"
  ).value =
    perfil.nombre || "";


  document.getElementById(
    "edad"
  ).value =
    perfil.edad || "";


  document.getElementById(
    "ciudad"
  ).value =
    perfil.ciudad || "";


  document.getElementById(
    "descripcion"
  ).value =
    perfil.descripcion || "";


  document.getElementById(
    "intereses"
  ).value =
    perfil.intereses || "";


  if (
    perfil.foto_url
  ) {

    document.getElementById(
      "fotoPerfil"
    ).src =
      perfil.foto_url;

  }

}


/* ==========================================
   GUARDAR PERFIL
========================================== */

async function guardarPerfil() {

  const nombre =
    document.getElementById(
      "nombre"
    ).value.trim();


  const edad =
    document.getElementById(
      "edad"
    ).value;


  const ciudad =
    document.getElementById(
      "ciudad"
    ).value.trim();


  const descripcion =
    document.getElementById(
      "descripcion"
    ).value.trim();


  const intereses =
    document.getElementById(
      "intereses"
    ).value.trim();


  if (!nombre) {

    mostrarMensaje(
      "Ingresá tu nombre",
      true
    );

    return;
  }


  const archivo =
    document.getElementById(
      "fotoArchivo"
    ).files[0];


  let fotoUrl = null;


  /* SUBIR FOTO */

  if (archivo) {

    mostrarMensaje(
      "Subiendo foto..."
    );


    const extension =
      archivo.name
        .split(".")
        .pop()
        .toLowerCase();


    const nombreArchivo =
      usuarioActual.id +
      "_" +
      Date.now() +
      "." +
      extension;


    const ruta =
      nombreArchivo;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("avatars")
        .upload(
          ruta,
          archivo,
          {
            upsert: true
          }
        );


    if (uploadError) {

      console.error(
        uploadError
      );

      mostrarMensaje(
        "No se pudo subir la foto: " +
        uploadError.message,
        true
      );

      return;
    }


    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from("avatars")
        .getPublicUrl(
          ruta
        );


    fotoUrl =
      publicData.publicUrl;

  }


  /* DATOS PERFIL */

  const datos = {

    nombre:
      nombre,

    edad:
      edad
        ? Number(edad)
        : null,

    ciudad:
      ciudad,

    descripcion:
      descripcion,

    intereses:
      intereses,

    online:
      true

  };


  if (fotoUrl) {

    datos.foto_url =
      fotoUrl;

  }


  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .upsert(
        {
          id:
            usuarioActual.id,

          ...datos

        },
        {
          onConflict:
            "id"
        }
      );


  if (error) {

    console.error(error);

    mostrarMensaje(
      "Error guardando perfil: " +
      error.message,
      true
    );

    return;
  }


  if (fotoUrl) {

    document.getElementById(
      "fotoPerfil"
    ).src =
      fotoUrl;

  }


  mostrarMensaje(
    "✅ Perfil guardado correctamente"
  );

}


/* ==========================================
   ESTADO ONLINE
========================================== */

async function actualizarEstado() {

  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .update({
        online: true,
        last_seen: new Date()
      })
      .eq(
        "id",
        usuarioActual.id
      );


  if (error) {

    console.error(
      "Estado:",
      error
    );

  }

}


/* ==========================================
   CONTADOR NOTIFICACIONES
========================================== */

async function actualizarNotificaciones() {

  const {
    data: matches,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id"
      )
      .or(
        `user1_id.eq.${usuarioActual.id},user2_id.eq.${usuarioActual.id}`
      );


  if (
    error ||
    !matches
  ) {

    return;
  }


  let total =
    0;


  for (
    const match of matches
  ) {

    const otroUsuario =
      match.user1_id ===
      usuarioActual.id
        ? match.user2_id
        : match.user1_id;


    const {
      count
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id",
          {
            count:
              "exact",
            head:
              true
          }
        )
        .eq(
          "match_id",
          match.id
        )
        .eq(
          "sender_id",
          otroUsuario
        )
        .is(
          "read_at",
          null
        );


    if (count) {

      total +=
        count;

    }

  }


  const badge =
    document.getElementById(
      "badgeNotificaciones"
    );


  if (
    total > 0
  ) {

    badge.style.display =
      "flex";

    badge.textContent =
      total > 99
        ? "99+"
        : total;

  } else {

    badge.style.display =
      "none";

  }

}


/* ==========================================
   REALTIME
========================================== */

function escucharNotificaciones() {

  supabaseClient

    .channel(
      "perfil-notificaciones"
    )

    .on(
      "postgres_changes",
      {
        event:
          "INSERT",
        schema:
          "public",
        table:
          "messages"
      },
      async payload => {

        if (
          payload.new.sender_id !==
          usuarioActual.id
        ) {

          await actualizarNotificaciones();

        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:
          "UPDATE",
        schema:
          "public",
        table:
          "messages"
      },
      async () => {

        await actualizarNotificaciones();

      }
    )

    .subscribe();

}


/* ==========================================
   MENSAJES
========================================== */

function mostrarMensaje(
  texto,
  error = false
) {

  const elemento =
    document.getElementById(
      "mensaje"
    );


  elemento.textContent =
    texto;


  elemento.className =
    error
      ? "error"
      : "exito";


  setTimeout(
    () => {

      elemento.textContent =
        "";

      elemento.className =
        "";

    },
    4000
  );

}


/* ==========================================
   NAVEGACIÓN
========================================== */

function abrirNotificaciones() {

  window.location.href =
    "./notificaciones.html";

}


function irMatches() {

  window.location.href =
    "./chat.html";

}


function irDescubrir() {

  window.location.href =
    "./descubrir.html";

}


/* ==========================================
   INICIAR
========================================== */

iniciar();

</script>

</body>
</html>
