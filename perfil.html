<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1020, #172554);
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 22px 15px;
      background: rgba(0,0,0,.25);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header span {
      color: #ff4f9a;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card,
    .discover-card,
    .match-box {
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,.3);
    }

    .foto-container {
      text-align: center;
      margin-bottom: 20px;
    }

    #previewFoto {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff4f9a;
      background: #222;
      display: block;
      margin: 0 auto 15px;
    }

    #photoInput {
      display: none;
    }

    .photo-button {
      display: inline-block;
      padding: 12px 20px;
      background: #ff4f9a;
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,.12);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(255,255,255,.55);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .guardar {
      background: #ff4f9a;
      color: white;
    }

    .matches {
      background: #22c55e;
      color: white;
    }

    .descubrir {
      background: #3b82f6;
      color: white;
    }

    .mensaje {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      min-height: 25px;
    }

    .discover-card {
      margin-top: 25px;
      text-align: center;
      display: none;
    }

    #discoverFoto {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ff4f9a;
    }

    .acciones {
      display: flex;
      gap: 10px;
    }

    .acciones button {
      margin-top: 15px;
    }

    .pasar {
      background: #ef4444;
      color: white;
    }

    .like {
      background: #22c55e;
      color: white;
    }

    .match-box {
      display: none;
      margin-top: 20px;
      text-align: center;
      background: linear-gradient(135deg,#ec4899,#8b5cf6);
    }

    .chat-button {
      background: white;
      color: #8b5cf6;
    }
  </style>
</head>

<body>

<header>
  <h1>💕 Emi<span>Match</span></h1>
</header>

<div class="container">

  <!-- PERFIL -->

  <div class="card">

    <h2 style="text-align:center;">
      Mi perfil
    </h2>

    <div class="foto-container">

      <img
        id="previewFoto"
        src="https://via.placeholder.com/150?text=Foto"
        alt="Foto de perfil"
      >

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

      <button
        type="button"
        class="photo-button"
        id="btnFoto"
      >
        📷 Elegir foto
      </button>

    </div>

    <label for="nombre">
      Nombre
    </label>

    <input
      type="text"
      id="nombre"
      placeholder="Tu nombre"
    >

    <label for="edad">
      Edad
    </label>

    <input
      type="number"
      id="edad"
      placeholder="Tu edad"
      min="18"
      max="100"
    >

    <label for="ciudad">
      Ciudad
    </label>

    <input
      type="text"
      id="ciudad"
      placeholder="Tu ciudad"
    >

    <label for="descripcion">
      Sobre mí
    </label>

    <textarea
      id="descripcion"
      placeholder="Contanos un poco sobre vos..."
    ></textarea>

    <label for="intereses">
      Intereses
    </label>

    <input
      type="text"
      id="intereses"
      placeholder="Música, fútbol, viajes..."
    >

    <button
      class="guardar"
      id="btnGuardar"
    >
      💾 Guardar perfil
    </button>

    <button
      class="matches"
      id="btnMatches"
    >
      💕 Mis Matches
    </button>

    <button
      class="descubrir"
      id="btnDescubrir"
    >
      🔎 Descubrir
    </button>

    <div
      class="mensaje"
      id="mensaje"
    ></div>

  </div>


  <!-- DESCUBRIR -->

  <div
    class="discover-card"
    id="discoverCard"
  >

    <img
      id="discoverFoto"
      src="https://via.placeholder.com/180?text=Foto"
      alt="Perfil"
    >

    <h2 id="discoverNombre"></h2>

    <p id="discoverDatos"></p>

    <p id="discoverDescripcion"></p>

    <p id="discoverIntereses"></p>

    <div class="acciones">

      <button
        class="pasar"
        id="btnPasar"
      >
        ❌ Pasar
      </button>

      <button
