<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil — EmiMatch</title>

  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(91, 67, 160, .28), transparent 45%),
        #090b18;
      color: #fff;
    }

    .profile-page {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 24px 16px 110px;
      box-sizing: border-box;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .profile-header h1 {
      margin: 0;
      font-size: 28px;
    }

    .profile-header p {
      margin: 7px 0 0;
      opacity: .72;
      font-size: 14px;
    }

    .profile-card {
      overflow: hidden;
      border-radius: 26px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }

    .profile-photo-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 520px;
      background: rgba(255,255,255,.04);
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      font-size: 60px;
      background:
        linear-gradient(145deg, rgba(91,67,160,.45), rgba(20,24,55,.8));
    }

    .photo-placeholder span {
      font-size: 14px;
      opacity: .65;
    }

    .profile-info {
      padding: 22px;
    }

    .profile-name {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
    }

    .profile-meta {
      margin-top: 8px;
      color: rgba(255,255,255,.72);
      font-size: 15px;
    }

    .profile-description {
      margin: 18px 0 0;
      line-height: 1.6;
      color: rgba(255,255,255,.86);
      white-space: pre-wrap;
    }

    .profile-actions {
      display: grid;
      gap: 11px;
      margin-top: 22px;
    }

    .profile-actions a,
    .profile-actions button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 15px;
      padding: 13px 16px;
      box-sizing: border-box;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      text-align: center;
      color: #fff;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.10);
    }

    .profile-actions .primary {
      background: linear-gradient(135deg, #7654d8, #9a5bcf);
    }

    .profile-actions .discover {
      background: linear-gradient(135deg, #6b4ac9, #b34e9d);
    }

    .profile-actions .danger {
      color: #ffb8c4;
      background: rgba(190,45,75,.12);
      border-color: rgba(255,100,130,.18);
    }

    .status {
      min-height: 22px;
      margin: 14px 4px;
      text-align: center;
      font-size: 14px;
      opacity: .82;
    }

    .loading {
      padding: 60px 20px;
      text-align: center;
      opacity: .7;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="profile-page">

    <header class="profile-header">
      <h1>Mi perfil 💜</h1>
      <p>Tu espacio en EmiMatch</p>
    </header>

    <section id="loadingState" class="profile-card">
      <div class="loading">
        Preparando tu perfil...
      </div>
    </section>

    <section id="profileContent" class="profile-card hidden">

      <div class="profile-photo-wrap">

        <img
          id="profilePhoto"
          class="profile-photo hidden"
          alt="Foto de perfil"
        >

        <div id="photoPlaceholder" class="photo-placeholder">
          💕
          <span>Agregá una foto a tu perfil</span>
        </div>

      </div>

      <div class="profile-info">

        <h2 id="profileName" class="profile-name">
          Mi perfil
        </h2>

        <div id="profileMeta" class="profile-meta"></div>

        <p id="profileDescription" class="profile-description"></p>

        <div class="profile-actions">

          <a
            class="primary"
            href="editar-perfil.html"
          >
            ✏️ Editar perfil
          </a>

          <a
            class="discover"
            href="descubrir.html"
          >
            💜 Seguir descubriendo
          </a>

          <a href="matches.html">
            ❤️ Mis matches
          </a>

          <a href="notificaciones.html">
            🔔 Notificaciones
          </a>

          <a href="configuracion.html">
            ⚙️ Configuración
          </a>

          <button
            id="deleteAccountButton"
            class="danger"
            type="button"
          >
            🗑️ Eliminar cuenta
          </button>

        </div>

        <div
          id="deleteStatus"
          class="status"
          aria-live="polite"
        ></div>

      </div>

    </section>

    <section
      id="errorState"
      class="profile-card hidden"
    >
      <div class="loading">
        <strong>No pudimos cargar tu perfil.</strong>
        <br><br>
        <a href="index.html">Volver al inicio</a>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>

  <script>
    "use strict";

    const config = window.EMIMATCH_CONFIG;

    if (!config || !config.supabaseUrl || !config.supabaseKey) {
      throw new Error("Configuración de Supabase incompleta.");
    }

    const supabase = window.supabase.createClient(
      config.supabaseUrl,
      config.supabaseKey
    );

    const loadingState =
      document.getElementById("loadingState");

    const profileContent =
      document.getElementById("profileContent");

    const errorState =
      document.getElementById("errorState");

    const profilePhoto =
      document.getElementById("profilePhoto");

    const photoPlaceholder =
      document.getElementById("photoPlaceholder");

    const profileName =
      document.getElementById("profileName");

    const profileMeta =
      document.getElementById("profileMeta");

    const profileDescription =
      document.getElementById("profileDescription");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showError() {
      loadingState.classList.add("hidden");
      profileContent.classList.add("hidden");
      errorState.classList.remove("hidden");
    }

    function showProfile() {
      loadingState.classList.add("hidden");
      errorState.classList.add("hidden");
      profileContent.classList.remove("hidden");
    }

    async function loadProfile() {

      const {
        data: { user },
        error: userError
      } = await supabase.auth.getUser();

      if (userError || !user) {
        window.location.href = "index.html";
        return;
      }

      const {
        data: profile,
        error: profileError
      } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

      if (profileError) {
        console.error(
          "Error cargando perfil:",
          profileError
        );

        showError();
        return;
      }

      const name =
        profile?.nombre ||
        profile?.name ||
        "Mi perfil";

      const age =
        profile?.edad ??
        profile?.age ??
        "";

      const city =
        profile?.ciudad ||
        profile?.city ||
        "";

      const description =
        profile?.descripcion ||
        profile?.description ||
        "";

      const photoUrl =
        profile?.foto_url ||
        profile?.photo_url ||
        "";

      profileName.textContent = name;

      const metaParts = [];

      if (age !== "") {
        metaParts.push(`${age} años`);
      }

      if (city) {
        metaParts.push(city);
      }

      profileMeta.textContent =
        metaParts.join(" · ");

      profileDescription.textContent =
        description ||
        "Todavía no agregaste una descripción.";

      if (photoUrl) {
        profilePhoto.src = photoUrl;
        profilePhoto.classList.remove("hidden");
        photoPlaceholder.classList.add("hidden");

        profilePhoto.onerror = () => {
          profilePhoto.classList.add("hidden");
          photoPlaceholder.classList.remove("hidden");
        };
      }

      showProfile();
    }

    loadProfile();
  </script>
</body>
            </html>
