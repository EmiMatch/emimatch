<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(145deg, #07152f, #102d59);
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 20px 0;
    }

    .header h1 {
      color: #d9ad45;
      font-size: 34px;
    }

    .card {
      background: white;
      color: #15233d;
      border-radius: 24px;
      padding: 25px 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .avatar {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #d9ad45;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #d5dbe5;
      border-radius: 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: #d9ad45;
      color: #101d34;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .logout {
      background: #102d59;
      color: white;
      margin-top: 12px;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>EmiMatch ❤️</h1>
  </div>

  <div class="card">

    <div class="avatar" id="avatar">?</div>

    <h2>Mi perfil</h2>

    <label for="nombre">Nombre</label>
    <input id="nombre" type="text" placeholder="Tu nombre">

    <label for="edad">Edad</label>
    <input id="edad" type="number" min="18" placeholder="Tu edad">

    <label for="ciudad">Ciudad</label>
    <input id="ciudad" type="text" placeholder="Tu ciudad">

    <label for="descripcion">Sobre mí</label>
    <textarea id="descripcion" placeholder="Contanos un poco sobre vos"></textarea>

    <label for="intereses">Intereses</label>
    <input id="intereses" type="text" placeholder="Ej: fútbol, música, viajes">

    <button id="guardar">
      💾 Guardar perfil
    </button>

    <button class="logout" id="logout">
      Cerrar sesión
    </button>

    <div class="message" id="message"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let usuarioActual = null;

async function cargarPerfil() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();

  if (error || !user) {
    window.location.href = "index.html";
    return;
  }

  usuarioActual = user;

  const {
    data: perfil,
    error: perfilError
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if (perfilError) {
  console.error("ERROR PERFIL:", perfilError);

  mostrarMensaje(
    "Error: " + perfilError.message,
    true
  );

  return;
  }
  

  if (perfil) {

    document.getElementById("nombre").value =
      perfil.nombre || "";

    document.getElementById("edad").value =
      perfil.edad || "";

    document.getElementById("ciudad").value =
      perfil.ciudad || "";

    document.getElementById("descripcion").value =
      perfil.descripcion || "";

    document.getElementById("intereses").value =
      perfil.intereses || "";

    actualizarAvatar(
      perfil.nombre || "U"
    );

  } else {

    const nombre =
      user.user_metadata?.full_name ||
      "Usuario";

    document.getElementById("nombre").value =
      nombre;

    actualizarAvatar(nombre);
  }
}

function actualizarAvatar(nombre) {

  document.getElementById("avatar").textContent =
    nombre.trim().charAt(0).toUpperCase() || "?";
}

function mostrarMensaje(texto, error = false) {

  const elemento =
    document.getElementById("message");

  elemento.textContent = texto;

  elemento.style.color =
    error ? "#b42318" : "#16803c";
}

document.getElementById("guardar").onclick =
async () => {

  if (!usuarioActual) {
    return;
  }

  const nombre =
    document.getElementById("nombre").value.trim();

  const edad =
    document.getElementById("edad").value;

  const ciudad =
    document.getElementById("ciudad").value.trim();

  const descripcion =
    document.getElementById("descripcion").value.trim();

  const intereses =
    document.getElementById("intereses").value.trim();

  if (!nombre) {
    mostrarMensaje(
      "Ingresá tu nombre.",
      true
    );
    return;
  }

  mostrarMensaje("Guardando perfil...");

  const {
    error
  } = await supabaseClient
    .from("profiles")
    .upsert({
      id: usuarioActual.id,
      nombre: nombre,
      edad: edad ? parseInt(edad) : null,
      ciudad: ciudad,
      descripcion: descripcion,
      intereses: intereses
    });

  if (error) {

    console.error(error);

  
    mostrarMensaje(
  "Error: " + error.message,
  true
);
    );

    return;
  }

  actualizarAvatar(nombre);

  mostrarMensaje(
    "✅ Perfil guardado correctamente."
  );
};

document.getElementById("logout").onclick =
async () => {

  await supabaseClient.auth.signOut();

  window.location.href =
    "index.html";
};

cargarPerfil();

</script>

</body>
</html>
