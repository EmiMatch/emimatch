<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil - EmiMatch</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0b1020,#172554);
  color:#fff;
  min-height:100vh;
}

header{
  text-align:center;
  padding:22px 15px;
  background:rgba(0,0,0,.25);
}

header h1{margin:0;font-size:28px}
header span{color:#ff4f9a}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card,.discover-card,.match-box{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  border-radius:22px;
  padding:25px;
  box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.foto-container{
  text-align:center;
  margin-bottom:20px;
}

#previewFoto{
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #ff4f9a;
  background:#222;
  display:block;
  margin:0 auto 15px;
}

#photoInput{display:none}

.photo-button{
  display:inline-block;
  padding:12px 20px;
  background:#ff4f9a;
  border:0;
  border-radius:25px;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  font-weight:bold;
}

input,textarea{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.12);
  color:#fff;
  outline:none;
  font-size:15px;
}

input::placeholder,
textarea::placeholder{
  color:rgba(255,255,255,.55);
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.guardar{
  background:#ff4f9a;
  color:#fff;
}

.matches{
  background:#22c55e;
  color:#fff;
}

.descubrir{
  background:#3b82f6;
  color:#fff;
}

.mensaje{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
  min-height:25px;
}

.discover-card{
  margin-top:25px;
  text-align:center;
  display:none;
}

#discoverFoto{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #ff4f9a;
}

.acciones{
  display:flex;
  gap:10px;
}

.acciones button{
  margin-top:15px;
}

.pasar{
  background:#ef4444;
  color:#fff;
}

.like{
  background:#22c55e;
  color:#fff;
}

.match-box{
  display:none;
  margin-top:20px;
  text-align:center;
  background:linear-gradient(135deg,#ec4899,#8b5cf6);
}

.chat-button{
  background:#fff;
  color:#8b5cf6;
}
</style>
</head>

<body>

<header>
  <h1>💕 Emi<span>Match</span></h1>
</header>

<div class="container">

<div class="card">

<h2 style="text-align:center">Mi perfil</h2>

<div class="foto-container">

<img
  id="previewFoto"
  src="https://via.placeholder.com/150?text=Foto"
  alt="Foto de perfil"
>

<input
  type="file"
  id="photoInput"
  accept="image/*"
>

<button
  type="button"
  class="photo-button"
  id="btnFoto"
>
📷 Elegir foto
</button>

</div>

<label for="nombre">Nombre</label>
<input
  type="text"
  id="nombre"
  placeholder="Tu nombre"
>

<label for="edad">Edad</label>
<input
  type="number"
  id="edad"
  placeholder="Tu edad"
  min="18"
  max="100"
>

<label for="ciudad">Ciudad</label>
<input
  type="text"
  id="ciudad"
  placeholder="Tu ciudad"
>

<label for="descripcion">Sobre mí</label>
<textarea
  id="descripcion"
  placeholder="Contanos un poco sobre vos..."
></textarea>

<label for="intereses">Intereses</label>
<input
  type="text"
  id="intereses"
  placeholder="Música, fútbol, viajes..."
>

<button
  class="guardar"
  id="btnGuardar"
>
💾 Guardar perfil
</button>

<button
  class="matches"
  id="btnMatches"
>
💕 Mis Matches
</button>

<button
  class="descubrir"
  id="btnDescubrir"
>
🔎 Descubrir
</button>

<div
  class="mensaje"
  id="mensaje"
></div>

</div>

<!-- DESCUBRIR -->

<div
  class="discover-card"
  id="discoverCard"
>

<img
  id="discoverFoto"
  src="https://via.placeholder.com/180?text=Foto"
  alt="Perfil"
>

<h2 id="discoverNombre"></h2>

<p id="discoverDatos"></p>

<p id="discoverDescripcion"></p>

<p id="discoverIntereses"></p>

<div class="acciones">

<button
  class="pasar"
  id="btnPasar"
>
❌ Pasar
</button>

<button
  class="like"
  id="btnLike"
>
❤️ Me gusta
</button>

</div>

</div>

<!-- MATCH -->

<div
  class="match-box"
  id="matchBox"
>

<h2>💕 ¡Es un Match!</h2>

<p>
Los dos se gustan. Ya pueden comenzar a hablar.
</p>

<button
  class="chat-button"
  id="btnChat"
>
💬 Abrir chat
</button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let selectedPhoto = null;
let personas = [];
let indicePersona = 0;
let personaActual = null;
let ultimoMatchUserId = null;

const $ = id => document.getElementById(id);

const mensaje = $("mensaje");

function mostrarMensaje(texto,error=false){

  mensaje.textContent = texto;

  mensaje.style.color =
    error ? "#fca5a5" : "#86efac";

}


/* =========================
   INICIAR
========================= */

async function iniciar(){

  const {data,error} =
    await supabaseClient.auth.getUser();

  if(error || !data.user){

    window.location.href = "index.html";

    return;
  }

  currentUser = data.user;

  await cargarPerfil();

}


/* =========================
   CARGAR PERFIL
========================= */

async function cargarPerfil(){

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
      )
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){

    console.error(error);

    mostrarMensaje(
      "Error al cargar el perfil: " +
      error.message,
      true
    );

    return;
  }

  if(!data) return;

  $("nombre").value =
    data.nombre || "";

  $("edad").value =
    data.edad || "";

  $("ciudad").value =
    data.ciudad || "";

  $("descripcion").value =
    data.descripcion || "";

  $("intereses").value =
    data.intereses || "";

  if(data.foto_url){

    $("previewFoto").src =
      data.foto_url;

  }

}


/* =========================
   SUBIR FOTO
========================= */

async function subirFoto(){

  if(!selectedPhoto)
    return null;

  const extension =
    selectedPhoto.name
      .split(".")
      .pop()
      .toLowerCase() || "jpg";

  const nombreArchivo =
    currentUser.id +
    "_" +
    Date.now() +
    "." +
    extension;

  const ruta =
    "profiles/" +
    nombreArchivo;

  const {error} =
    await supabaseClient
      .storage
      .from("avatars")
      .upload(
        ruta,
        selectedPhoto,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:selectedPhoto.type
        }
      );

  if(error)
    throw error;

  const {data} =
    supabaseClient
      .storage
      .from("avatars")
      .getPublicUrl(ruta);

  return data.publicUrl;

}


/* =========================
   GUARDAR PERFIL
========================= */

async function guardarPerfil(){

  try{

    const nombre =
      $("nombre").value.trim();

    const edadTexto =
      $("edad").value.trim();

    const ciudad =
      $("ciudad").value.trim();

    const descripcion =
      $("descripcion").value.trim();

    const intereses =
      $("intereses").value.trim();

    if(!nombre){

      mostrarMensaje(
        "Ingresá tu nombre.",
        true
      );

      return;
    }

    if(
      !edadTexto ||
      Number(edadTexto) < 18
    ){

      mostrarMensaje(
        "Ingresá una edad válida (18+).",
        true
      );

      return;
    }

    mostrarMensaje(
      "Guardando perfil..."
    );

    let fotoUrl =
      $("previewFoto").src;

    if(
      !fotoUrl.includes("/storage/") &&
      !selectedPhoto
    ){

      fotoUrl = null;

    }

    if(selectedPhoto){

      fotoUrl =
        await subirFoto();

    }

    const datos = {

      id: currentUser.id,

      nombre: nombre,

      edad:
        parseInt(
          edadTexto,
          10
        ),

      ciudad: ciudad,

      descripcion: descripcion,

      foto_url: fotoUrl,

      intereses: intereses

    };

    const {error} =
      await supabaseClient
        .from("profiles")
        .upsert(
          datos,
          {
            onConflict:"id"
          }
        );

    if(error)
      throw error;

    selectedPhoto = null;

    $("photoInput").value = "";

    mostrarMensaje(
      "✅ Perfil guardado correctamente."
    );

  }
  catch(error){

    console.error(error);

    mostrarMensaje(
      "❌ No se pudo guardar: " +
      error.message,
      true
    );

  }

}


/* =========================
   DESCUBRIR
========================= */

async function cargarDescubrimiento(){

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
      )
      .neq(
        "id",
        currentUser.id
      )
      .limit(50);

  if(error){

    console.error(error);

    mostrarMensaje(
      "Error al descubrir perfiles: " +
      error.message,
      true
    );

    return;
  }

  personas = data || [];

  indicePersona = 0;

  mostrarPersona();

}


/* =========================
   MOSTRAR PERSONA
========================= */

function mostrarPersona(){

  const card =
    $("discoverCard");

  $("matchBox").style.display =
    "none";

  if(
    !personas.length ||
    indicePersona >= personas.length
  ){

    card.style.display =
      "block";

    $("discoverFoto").src =
      "https://via.placeholder.com/180?text=Sin+perfiles";

    $("discoverNombre").textContent =
      "No hay más perfiles";

    $("discoverDatos").textContent =
      "";

    $("discoverDescripcion").textContent =
      "Volvé a intentar más tarde.";

    $("discoverIntereses").textContent =
      "";

    personaActual = null;

    return;
  }

  personaActual =
    personas[indicePersona];

  card.style.display =
    "block";

  $("discoverFoto").src =
    personaActual.foto_url ||
    "https://via.placeholder.com/180?text=Foto";

  $("discoverNombre").textContent =
    personaActual.nombre ||
    "Sin nombre";

  $("discoverDatos").textContent =
    [
      personaActual.edad,
      personaActual.ciudad
    ]
    .filter(Boolean)
    .join(" • ");

  $("discoverDescripcion").textContent =
    personaActual.descripcion || "";

  $("discoverIntereses").textContent =
    personaActual.intereses
      ? "❤️ " +
        personaActual.intereses
      : "";

}


/* =========================
   PASAR
========================= */

function pasar(){

  indicePersona++;

  mostrarPersona();

}


/* =========================
   LIKE
========================= */

async function darLike(){

  if(!personaActual)
    return;

  try{

    mostrarMensaje(
      "Registrando ❤️..."
    );

    const {data:existente,error:errorExistente} =
      await supabaseClient
        .from("matches")
        .select(
          "id,user1_id,user2_id"
        )
        .or(
          "and(user1_id.eq." +
          currentUser.id +
          ",user2_id.eq." +
          personaActual.id +
          "),and(user1_id.eq." +
          personaActual.id +
          ",user2_id.eq." +
          currentUser.id +
          ")"
        )
        .maybeSingle();

    if(errorExistente)
      throw errorExistente;

    if(existente){

      ultimoMatchUserId =
        personaActual.id;

      $("matchBox").style.display =
        "block";

      mostrarMensaje(
        "💕 Ya existe un match con esta persona."
      );

      return;
    }

    const {error} =
      await supabaseClient
        .from("matches")
        .insert({

          user1_id:
            currentUser.id,

          user2_id:
            personaActual.id

        });

    if(error)
      throw error;

    ultimoMatchUserId =
      personaActual.id;

    $("matchBox").style.display =
      "block";

    mostrarMensaje(
      "💕 ¡Match creado!"
    );

  }
  catch(error){

    console.error(error);

    mostrarMensaje(
      "No se pudo crear el match: " +
      error.message,
      true
    );

  }

}


/* =========================
   FOTO
========================= */

$("btnFoto").addEventListener(
  "click",
  () =>
    $("photoInput").click()
);

$("photoInput").addEventListener(
  "change",
  event => {

    const archivo =
      event.target.files[0];

    if(!archivo)
      return;

    if(
      !archivo.type.startsWith(
        "image/"
      )
    ){

      mostrarMensaje(
        "Seleccioná una imagen válida.",
        true
      );

      $("photoInput").value = "";

      return;
    }

    if(
      archivo.size >
      5 * 1024 * 1024
    ){

      mostrarMensaje(
        "La foto no puede superar los 5 MB.",
        true
      );

      $("photoInput").value = "";

      return;
    }

    selectedPhoto =
      archivo;

    $("previewFoto").src =
      URL.createObjectURL(
        archivo
      );

    mostrarMensaje(
      "Foto seleccionada. Tocá Guardar perfil."
    );

  }
);


/* =========================
   BOTONES
========================= */

$("btnGuardar")
  .addEventListener(
    "click",
    guardarPerfil
  );

$("btnDescubrir")
  .addEventListener(
    "click",
    cargarDescubrimiento
  );

$("btnPasar")
  .addEventListener(
    "click",
    pasar
  );

$("btnLike")
  .addEventListener(
    "click",
    darLike
  );

$("btnMatches")
  .addEventListener(
    "click",
    () =>
      window.location.href =
        "chat.html"
  );

$("btnChat")
  .addEventListener(
    "click",
    () => {

      if(ultimoMatchUserId){

        window.location.href =
          "chat.html?user=" +
          encodeURIComponent(
            ultimoMatchUserId
          );

      }

    }
  );


/* INICIAR */

iniciar();

</script>

</body>
</html>
