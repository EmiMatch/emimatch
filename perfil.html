<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil - EmiMatch</title>

  <meta name="theme-color" content="#111827">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(124,58,237,.35), transparent 35%),
        linear-gradient(145deg, #07152f 0%, #101b38 48%, #1e1b4b 100%);
      color: white;
      padding: 18px;
      padding-bottom: 115px;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    /* =========================
       CABECERA
    ========================= */

    .cabecera {
      text-align: center;
      margin: 8px 0 22px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      box-shadow: 0 12px 30px rgba(0,0,0,.30);
    }

    .cabecera h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .cabecera p {
      margin: 7px 0 0;
      color: #cbd5e1;
      font-size: 15px;
    }

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(34,197,94,.13);
      border: 1px solid rgba(74,222,128,.20);
      color: #86efac;
      font-size: 13px;
      font-weight: bold;
    }

    /* =========================
       TARJETA
    ========================= */

    .card {
      background: rgba(255,255,255,.97);
      color: #172033;
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow:
        0 20px 50px rgba(0,0,0,.30),
        0 2px 8px rgba(0,0,0,.10);
    }

    .seccion-titulo {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 800;
      color: #111827;
    }

    /* =========================
       FOTO
    ========================= */

    .foto-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .foto-marco {
      display: inline-block;
      padding: 5px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4af37, #f5d76e, #d4af37);
      box-shadow: 0 10px 25px rgba(0,0,0,.18);
    }

    .foto-preview,
    .sin-foto {
      width: 155px;
      height: 155px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .foto-preview {
      object-fit: cover;
      background: #e5e7eb;
      border: 3px solid white;
    }

    .sin-foto {
      background:
        linear-gradient(135deg, #e5e7eb, #cbd5e1);
      font-size: 65px;
      border: 3px solid white;
    }

    .foto-ayuda {
      margin-top: 12px;
      color: #64748b;
      font-size: 13px;
    }

    .foto-input {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      font-size: 14px;
    }

    /* =========================
       CAMPOS
    ========================= */

    .campo {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 800;
      color: #334155;
    }

    .campo-icono {
      margin-right: 5px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #dbe1ea;
      border-radius: 14px;
      padding: 14px;
      background: #f8fafc;
      color: #172033;
      font-size: 16px;
      outline: none;
      transition: .2s;
    }

    input::placeholder,
    textarea::placeholder {
      color: #94a3b8;
    }

    input:focus,
    textarea:focus {
      border-color: #7c3aed;
      background: white;
      box-shadow: 0 0 0 4px rgba(124,58,237,.10);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    /* =========================
       BOTÓN GUARDAR
    ========================= */

    .guardar {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 16px;
      margin-top: 4px;
      background: linear-gradient(135deg, #d4af37, #f0c84b);
      color: #111827;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(212,175,55,.25);
      transition: transform .15s, box-shadow .15s;
    }

    .guardar:active {
      transform: scale(.98);
    }

    .guardar:hover {
      box-shadow: 0 10px 25px rgba(212,175,55,.35);
    }

    .guardar:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .mensaje {
      min-height: 22px;
      margin-top: 13px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    /* =========================
       CERRAR SESIÓN
    ========================= */

    .cerrar {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 15px;
      background: rgba(255,255,255,.07);
      color: #cbd5e1;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .cerrar:hover {
      background: rgba(255,255,255,.12);
      color: white;
    }

    /* =========================
       BARRA INFERIOR
    ========================= */

    .barra-inferior {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 70px;

      background: rgba(255,255,255,.97);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: space-around;

      box-shadow:
        0 10px 35px rgba(0,0,0,.35);

      z-index: 9999;

      max-width: 600px;
      margin: auto;
      border: 1px solid rgba(255,255,255,.7);
    }

    .nav-item {
      position: relative;
      flex: 1;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-decoration: none;
      color: #64748b;

      font-size: 10px;
      font-weight: 800;

      transition: .2s;
    }

    .nav-icon {
      font-size: 22px;
      line-height: 25px;
      margin-bottom: 3px;
      transition: .2s;
    }

    .nav-item.activo {
      color: #6d28d9;
    }

    .nav-item.activo .nav-icon {
      transform: scale(1.15);
    }

    .nav-item:active .nav-icon {
      transform: scale(.92);
    }

    .badge {
      position: absolute;
      top: 6px;
      right: 16%;

      min-width: 19px;
      height: 19px;

      padding: 2px 5px;

      border-radius: 20px;

      background: #ef4444;
      color: white;

      font-size: 10px;
      font-weight: 800;

      display: none;
      align-items: center;
      justify-content: center;

      border: 2px solid white;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (min-width: 700px) {
      body {
        padding-top: 35px;
      }

      .barra-inferior {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: 600px;
      }
    }

    @media (max-width: 380px) {
      body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .card {
        padding: 20px 15px;
      }

      .cabecera h1 {
        font-size: 27px;
      }

      .foto-preview,
      .sin-foto {
        width: 140px;
        height: 140px;
      }

      .nav-item {
        font-size: 8px;
      }

      .nav-icon {
        font-size: 20px;
      }

      .badge {
        right: 8%;
      }
    }
  </style>
</head>

<body>

<div class="contenedor">

  <div class="cabecera">

    <div class="logo">
      💕
    </div>

    <h1>Mi perfil</h1>

    <p>
      Completá tu información para que te conozcan mejor
    </p>

    <div class="estado">
      🟢 En línea
    </div>

  </div>


  <div class="card">

    <h2 class="seccion-titulo">
      👤 Información personal
    </h2>


    <div class="foto-container">

      <div class="foto-marco">

        <div
          id="sinFoto"
          class="sin-foto">
          👤
        </div>

        <img
          id="fotoPreview"
          class="foto-preview"
          style="display:none;"
          alt="Foto de perfil"
        >

      </div>

      <div class="foto-ayuda">
        📸 Elegí una foto de perfil
      </div>

      <input
        type="file"
        id="foto"
        class="foto-input"
        accept="image/*"
      >

    </div>


    <div class="campo">

      <label for="nombre">
        <span class="campo-icono">👤</span>
        Nombre
      </label>

      <input
        type="text"
        id="nombre"
        placeholder="Tu nombre"
      >

    </div>


    <div class="campo">

      <label for="edad">
        <span class="campo-icono">🎂</span>
        Edad
      </label>

      <input
        type="number"
        id="edad"
        min="18"
        max="100"
        placeholder="Tu edad"
      >

    </div>


    <div class="campo">

      <label for="ciudad">
        <span class="campo-icono">📍</span>
        Ciudad
      </label>

      <input
        type="text"
        id="ciudad"
        placeholder="Tu ciudad"
      >

    </div>


    <div class="campo">

      <label for="descripcion">
        <span class="campo-icono">💬</span>
        Sobre mí
      </label>

      <textarea
        id="descripcion"
        maxlength="500"
        placeholder="Contanos un poco sobre vos..."
      ></textarea>

    </div>


    <div class="campo">

      <label for="intereses">
        <span class="campo-icono">✨</span>
        Intereses
      </label>

      <input
        type="text"
        id="intereses"
        placeholder="Música, fútbol, viajes..."
      >

    </div>


    <button
      class="guardar"
      id="guardarBtn"
      onclick="guardarPerfil()">

      💾 Guardar perfil

    </button>


    <div
      id="mensaje"
      class="mensaje">
    </div>

  </div>


  <button
    class="cerrar"
    onclick="cerrarSesion()">

    🚪 Cerrar sesión

  </button>

</div>


<nav class="barra-inferior">

  <a
    href="./perfil.html"
    class="nav-item activo">

    <span class="nav-icon">
      👤
    </span>

    Perfil

  </a>


  <a
    href="./descubrir.html"
    class="nav-item">

    <span class="nav-icon">
      🔎
    </span>

    Descubrir

  </a>


  <a
    href="./likes.html"
    class="nav-item">

    <span class="nav-icon">
      ❤️
    </span>

    Me gustas

  </a>


  <a
    href="./chat.html"
    class="nav-item">

    <span class="nav-icon">
      💕
    </span>

    Matches

  </a>


  <a
    href="./notificaciones.html"
    class="nav-item">

    <span class="nav-icon">
      🔔
    </span>

    Notificaciones

    <span
      id="badgeNotificaciones"
      class="badge">
      0
    </span>

  </a>

</nav>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;

let fotoSeleccionada = null;


/* =========================
   INICIAR
========================= */

async function iniciar() {

  const {
    data: { session },
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !session
  ) {

    window.location.replace(
      "./index.html"
    );

    return;

  }


  usuarioActual =
    session.user;


  await cargarPerfil();

  await cargarNotificaciones();

}


/* =========================
   CARGAR PERFIL
========================= */

async function cargarPerfil() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        usuarioActual.id
      )
      .maybeSingle();


  if (error) {

    console.error(error);

    return;

  }


  if (!data) return;


  document.getElementById(
    "nombre"
  ).value =
    data.nombre || "";


  document.getElementById(
    "edad"
  ).value =
    data.edad || "";


  document.getElementById(
    "ciudad"
  ).value =
    data.ciudad || "";


  document.getElementById(
    "descripcion"
  ).value =
    data.descripcion || "";


  document.getElementById(
    "intereses"
  ).value =
    data.intereses || "";


  if (data.foto_url) {

    mostrarFoto(
      data.foto_url
    );

  }

}


/* =========================
   MOSTRAR FOTO
========================= */

function mostrarFoto(url) {

  const img =
    document.getElementById(
      "fotoPreview"
    );

  const sinFoto =
    document.getElementById(
      "sinFoto"
    );


  img.src = url;

  img.style.display =
    "block";

  sinFoto.style.display =
    "none";

}


/* =========================
   SELECCIONAR FOTO
========================= */

document
  .getElementById("foto")
  .addEventListener(
    "change",
    function(event) {

      const archivo =
        event.target.files[0];


      if (!archivo) return;


      fotoSeleccionada =
        archivo;


      const url =
        URL.createObjectURL(
          archivo
        );


      mostrarFoto(url);

    }
  );


/* =========================
   GUARDAR PERFIL
========================= */

async function guardarPerfil() {

  const boton =
    document.getElementById(
      "guardarBtn"
    );


  const mensaje =
    document.getElementById(
      "mensaje"
    );


  boton.disabled =
    true;


  mensaje.textContent =
    "Guardando...";


  try {

    let fotoUrl = null;


    if (fotoSeleccionada) {

      const extension =
        fotoSeleccionada.name
          .split(".")
          .pop()
          .toLowerCase();


      const nombreArchivo =
        usuarioActual.id +
        "_" +
        Date.now() +
        "." +
        extension;


      const ruta =
        nombreArchivo;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("avatars")
          .upload(
            ruta,
            fotoSeleccionada,
            {
              upsert: true
            }
          );


      if (uploadError) {

        throw uploadError;

      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("avatars")
          .getPublicUrl(
            ruta
          );


      fotoUrl =
        publicData.publicUrl;

    }


    const datos = {

      id:
        usuarioActual.id,

      nombre:
        document
          .getElementById(
            "nombre"
          )
          .value
          .trim(),

      edad:
        document
          .getElementById(
            "edad"
          )
          .value
          ? Number(
              document
                .getElementById(
                  "edad"
                )
                .value
            )
          : null,

      ciudad:
        document
          .getElementById(
            "ciudad"
          )
          .value
          .trim(),

      descripcion:
        document
          .getElementById(
            "descripcion"
          )
          .value
          .trim(),

      intereses:
        document
          .getElementById(
            "intereses"
          )
          .value
          .trim(),

      online: true,

      last_seen:
        new Date()
          .toISOString()

    };


    if (fotoUrl) {

      datos.foto_url =
        fotoUrl;

    }


    const {
      error
    } =
      await supabaseClient
        .from("profiles")
        .upsert(
          datos,
          {
            onConflict:
              "id"
          }
        );


    if (error) {

      throw error;

    }


    fotoSeleccionada =
      null;


    mensaje.textContent =
      "✅ Perfil guardado correctamente";


    mensaje.style.color =
      "#16a34a";


    setTimeout(
      () => {

        mensaje.textContent =
          "";

      },
      3000
    );


  } catch (error) {

    console.error(error);


    mensaje.textContent =
      "❌ No se pudo guardar el perfil";


    mensaje.style.color =
      "#dc2626";


  } finally {

    boton.disabled =
      false;

  }

}


/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  const badge =
    document.getElementById(
      "badgeNotificaciones"
    );


  const {
    data: { session }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (!session) return;


  const usuario =
    session.user.id;


  const {
    data: matches
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id"
      )
      .or(
        `user1_id.eq.${usuario},user2_id.eq.${usuario}`
      );


  if (
    !matches ||
    matches.length === 0
  ) {

    badge.style.display =
      "none";

    return;

  }


  let totalNoLeidos =
    0;


  for (
    const match of matches
  ) {

    const {
      data: mensajes
    } =
      await supabaseClient
        .from("messages")
        .select("id")
        .eq(
          "match_id",
          match.id
        )
        .neq(
          "sender_id",
          usuario
        )
        .is(
          "read_at",
          null
        );


    totalNoLeidos +=
      mensajes?.length || 0;

  }


  if (
    totalNoLeidos > 0
  ) {

    badge.textContent =
      totalNoLeidos > 99
        ? "99+"
        : totalNoLeidos;


    badge.style.display =
      "flex";

  } else {

    badge.style.display =
      "none";

  }

}


/* =========================
   CERRAR SESIÓN
========================= */

async function cerrarSesion() {

  const confirmar =
    confirm(
      "¿Querés cerrar sesión?"
    );


  if (!confirmar) return;


  await supabaseClient
    .auth
    .signOut();


  window.location.replace(
    "./index.html"
  );

}


/* =========================
   INICIAR
========================= */

iniciar();

</script>

</body>
</html>
