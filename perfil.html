<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Mi perfil</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #111827, #7c3aed);
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #111827;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save {
      background: #7c3aed;
      color: white;
    }

    .logout {
      background: #ef4444;
      color: white;
    }

    .discover {
      text-align: center;
    }

    .profile-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    .profile-photo {
      width: 100%;
      height: 320px;
      object-fit: cover;
      background: #e5e7eb;
      display: block;
    }

    .no-photo {
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ddd6fe, #ede9fe);
      font-size: 70px;
    }

    .profile-info {
      padding: 20px;
    }

    .profile-info h3 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .profile-info p {
      color: #555;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 12px;
      padding: 0 20px 20px;
    }

    .actions button {
      margin: 0;
    }

    .pass {
      background: #e5e7eb;
      color: #333;
    }

    .like {
      background: #ec4899;
      color: white;
    }

    .message {
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      margin-top: 12px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .email {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>💕 EmiMatch</h1>
  <p>Conocé personas y encontrá tu Match</p>
</header>

<div class="container">

  <!-- MI PERFIL -->
  <div class="card">
    <h2>👤 Mi perfil</h2>

    <div class="email" id="emailUsuario">
      Cargando...
    </div>

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Tu nombre">

    <label for="edad">Edad</label>
    <input type="number" id="edad" placeholder="Tu edad">

    <label for="ciudad">Ciudad</label>
    <input type="text" id="ciudad" placeholder="Tu ciudad">

    <label for="descripcion">Sobre mí</label>
    <textarea id="descripcion" placeholder="Contanos un poco sobre vos"></textarea>

    <label for="intereses">Intereses</label>
    <input type="text" id="intereses" placeholder="Ej: fútbol, música, viajes">

    <button class="save" onclick="guardarPerfil()">
      💾 Guardar perfil
    </button>

    <div id="mensajePerfil" class="message"></div>

    <button class="logout" onclick="cerrarSesion()">
      🚪 Cerrar sesión
    </button>
  </div>


  <!-- DESCUBRIR PERSONAS -->
  <div class="card discover">
    <h2>❤️ Descubrir personas</h2>

    <div id="cargandoPerfiles">
      Buscando personas...
    </div>

    <div id="perfilDescubrir"></div>

    <div id="mensajeDescubrir" class="message"></div>
  </div>

</div>


<script>

  // ==============================
  // SUPABASE
  // ==============================

  const SUPABASE_URL =
    "https://kngiadwaesdbmvwivdev.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // VARIABLES
  // ==============================

  let usuarioActual = null;
  let perfiles = [];
  let indicePerfil = 0;


  // ==============================
  // INICIAR
  // ==============================

  async function iniciar() {

    const {
      data: { session },
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      console.error(error);
      window.location.href = "index.html";
      return;
    }

    if (!session) {
      window.location.href = "index.html";
      return;
    }

    usuarioActual = session.user;

    document.getElementById("emailUsuario").textContent =
      usuarioActual.email;

    await cargarMiPerfil();
    await cargarPerfiles();

  }


  // ==============================
  // CARGAR MI PERFIL
  // ==============================

  async function cargarMiPerfil() {

    const {
      data,
      error
    } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", usuarioActual.id)
      .maybeSingle();

    if (error) {

      console.error(error);

      mostrarMensaje(
        "mensajePerfil",
        "Error al cargar el perfil: " + error.message,
        "error"
      );

      return;
    }

    if (!data) {
      return;
    }

    document.getElementById("nombre").value =
      data.name || "";

    document.getElementById("edad").value =
      data.age || "";

    document.getElementById("ciudad").value =
      data.city || "";

    document.getElementById("descripcion").value =
      data.description || "";

    document.getElementById("intereses").value =
      data.interests || "";
  }


  // ==============================
  // GUARDAR PERFIL
  // ==============================

  async function guardarPerfil() {

    const nombre =
      document.getElementById("nombre").value.trim();

    const edad =
      document.getElementById("edad").value;

    const ciudad =
      document.getElementById("ciudad").value.trim();

    const descripcion =
      document.getElementById("descripcion").value.trim();

    const intereses =
      document.getElementById("intereses").value.trim();


    if (!nombre) {

      mostrarMensaje(
        "mensajePerfil",
        "Escribí tu nombre.",
        "error"
      );

      return;
    }


    const perfil = {

      id: usuarioActual.id,

      name: nombre,

      age: edad
        ? parseInt(edad)
        : null,

      city: ciudad,

      description: descripcion,

      interests: intereses

    };


    const {
      error
    } = await supabaseClient
      .from("profiles")
      .upsert(
        perfil,
        {
          onConflict: "id"
        }
      );


    if (error) {

      console.error(error);

      mostrarMensaje(
        "mensajePerfil",
        "Error al guardar: " + error.message,
        "error"
      );

      return;
    }


    mostrarMensaje(
      "mensajePerfil",
      "✅ Perfil guardado correctamente.",
      "success"
    );


    await cargarPerfiles();
  }


  // ==============================
  // CARGAR PERSONAS
  // ==============================

  async function cargarPerfiles() {

    const contenedor =
      document.getElementById("perfilDescubrir");

    const cargando =
      document.getElementById("cargandoPerfiles");


    contenedor.innerHTML = "";

    cargando.style.display = "block";


    const {
      data,
      error
    } = await supabaseClient
      .from("profiles")
      .select("*")
      .neq("id", usuarioActual.id);


    cargando.style.display = "none";


    if (error) {

      console.error(error);

      contenedor.innerHTML =
        "<p>Error al cargar perfiles.</p>";

      mostrarMensaje(
        "mensajeDescubrir",
        error.message,
        "error"
      );

      return;
    }


    perfiles = data || [];

    indicePerfil = 0;

    mostrarSiguientePerfil();
  }


  // ==============================
  // MOSTRAR PERFIL
  // ==============================

  function mostrarSiguientePerfil() {

    const contenedor =
      document.getElementById("perfilDescubrir");


    if (
      indicePerfil >= perfiles.length
    ) {

      contenedor.innerHTML = `
        <div class="empty">
          <h3>🎉 No hay más perfiles</h3>
          <p>Volvé más tarde para conocer nuevas personas.</p>
        </div>
      `;

      return;
    }


    const perfil =
      perfiles[indicePerfil];


    const nombre =
      perfil.name || "Usuario";


    const edad =
      perfil.age
        ? ", " + perfil.age
        : "";


    const ciudad =
      perfil.city
        ? "📍 " + perfil.city
        : "";


    const descripcion =
      perfil.description ||
      "Todavía no agregó una descripción.";


    const intereses =
      perfil.interests
        ? "❤️ " + perfil.interests
        : "";


    contenedor.innerHTML = `

      <div class="profile-card">

        <div class="no-photo">
          👤
        </div>

        <div class="profile-info">

          <h3>
            ${escapeHTML(nombre)}${edad}
          </h3>

          <p>
            ${escapeHTML(ciudad)}
          </p>

          <p>
            ${escapeHTML(descripcion)}
          </p>

          <p>
            ${escapeHTML(intereses)}
          </p>

        </div>

        <div class="actions">

          <button
            class="pass"
            onclick="pasarPerfil()">
            ❌ Pasar
          </button>

          <button
            class="like"
            onclick="darLike()">
            ❤️ Me gusta
          </button>

        </div>

      </div>
    `;
  }


  // ==============================
  // ❤️ DAR LIKE
  // ==============================

  async function darLike() {

    if (
      indicePerfil >= perfiles.length
    ) {
      return;
    }


    const perfil =
      perfiles[indicePerfil];


    const {
      error
    } = await supabaseClient
      .from("swipes")
      .insert({

        user_id:
          usuarioActual.id,

        target_user_id:
          perfil.id,

        action:
          "like"

      });


    if (error) {

      console.error(error);

      mostrarMensaje(
        "mensajeDescubrir",
        "No se pudo registrar el Like: " +
        error.message,
        "error"
      );

      return;
    }


    mostrarMensaje(
      "mensajeDescubrir",
      "❤️ ¡Like enviado!",
      "success"
    );


    indicePerfil++;

    setTimeout(() => {

      mostrarSiguientePerfil();

    }, 500);
  }


  // ==============================
  // ❌ PASAR
  // ==============================

  async function pasarPerfil() {

    if (
      indicePerfil >= perfiles.length
    ) {
      return;
    }


    const perfil =
      perfiles[indicePerfil];


    const {
      error
    } = await supabaseClient
      .from("swipes")
      .insert({

        user_id:
          usuarioActual.id,

        target_user_id:
          perfil.id,

        action:
          "pass"

      });


    if (error) {

      console.error(error);

      mostrarMensaje(
        "mensajeDescubrir",
        "No se pudo registrar: " +
        error.message,
        "error"
      );

      return;
    }


    indicePerfil++;

    mostrarSiguientePerfil();
  }


  // ==============================
  // CERRAR SESIÓN
  // ==============================

  async function cerrarSesion() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "index.html";
  }


  // ==============================
  // MENSAJES
  // ==============================

  function mostrarMensaje(
    id,
    texto,
    tipo
  ) {

    const elemento =
      document.getElementById(id);

    elemento.textContent =
      texto;

    elemento.className =
      "message " + tipo;

    elemento.style.display =
      "block";


    setTimeout(() => {

      elemento.style.display =
        "none";

    }, 3500);
  }


  // ==============================
  // SEGURIDAD HTML
  // ==============================

  function escapeHTML(texto) {

    return String(texto || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // ==============================
  // ARRANCAR
  // ==============================

  iniciar();

</script>

</body>
</html>
