<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7f8ff, #eef1ff);
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #6c2bd9, #9b4dff);
      color: white;
      padding: 22px 15px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      opacity: .9;
    }

    .container {
      width: 94%;
      max-width: 650px;
      margin: 20px auto 40px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      color: #6c2bd9;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #7b35e8;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #6c2bd9;
      color: white;
    }

    .btn-primary:hover {
      background: #5720b8;
    }

    .btn-secondary {
      background: #eee;
      color: #333;
    }

    .profile-photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 10px auto 15px;
      border: 5px solid #eee;
      background: #f2f2f2;
    }

    .online {
      text-align: center;
      color: #16a34a;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .discover-card {
      text-align: center;
      padding: 20px;
      border: 1px solid #eee;
      border-radius: 18px;
      margin-top: 15px;
    }

    .discover-photo {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #f1f1f1;
    }

    .discover-name {
      font-size: 25px;
      font-weight: bold;
      margin-top: 12px;
    }

    .discover-info {
      color: #666;
      margin: 7px 0;
    }

    .like-btn {
      background: #ff3b7a;
      color: white;
      font-size: 18px;
    }

    .chat-btn {
      background: #25d366;
      color: white;
    }

    .message {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .nav-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .nav-buttons button {
      margin-top: 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>💕 EmiMatch</h1>
  <p>Conectá con personas y encontrá tu Match</p>
</header>

<div class="container">

  <!-- PERFIL -->
  <div class="card">

    <h2>👤 Mi perfil</h2>

    <img
      id="fotoPreview"
      class="profile-photo"
      src="https://via.placeholder.com/140"
      alt="Foto de perfil"
    >

    <div id="onlineStatus" class="online">
      🟢 En línea
    </div>

    <label>Foto de perfil</label>

    <input
      type="file"
      id="fotoInput"
      accept="image/*"
    >

    <label>Nombre</label>

    <input
      type="text"
      id="nombre"
      placeholder="Tu nombre"
    >

    <label>Edad</label>

    <input
      type="number"
      id="edad"
      placeholder="Tu edad"
      min="18"
      max="100"
    >

    <label>Ciudad</label>

    <input
      type="text"
      id="ciudad"
      placeholder="Tu ciudad"
    >

    <label>Sobre mí</label>

    <textarea
      id="descripcion"
      placeholder="Contanos un poco sobre vos..."
    ></textarea>

    <label>Intereses</label>

    <input
      type="text"
      id="intereses"
      placeholder="Música, fútbol, viajes..."
    >

    <button
      class="btn-primary"
      onclick="guardarPerfil()"
    >
      💾 Guardar perfil
    </button>

    <div
      id="mensajePerfil"
      class="message"
    ></div>

  </div>


  <!-- NAVEGACIÓN -->
  <div class="card">

    <h2>💕 EmiMatch</h2>

    <div class="nav-buttons">

      <button
        class="btn-primary"
        onclick="window.location.href='chat.html'"
      >
        💕 Mis Matches
      </button>

      <button
        class="btn-secondary"
        onclick="mostrarDescubrir()"
      >
        🔎 Descubrir
      </button>

    </div>

  </div>


  <!-- DESCUBRIR -->
  <div
    id="descubrirSection"
    class="card hidden"
  >

    <h2>🔎 Descubrir personas</h2>

    <div id="descubrirContenido">
      Buscando personas...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let fotoSeleccionada = null;


/* =========================================
   INICIAR
========================================= */

async function iniciar() {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();

  if (!session) {

    window.location.href = "index.html";

    return;
  }

  currentUser = session.user;

  await marcarOnline();

  await cargarPerfil();

}


/* =========================================
   MARCAR USUARIO EN LÍNEA
========================================= */

async function marcarOnline() {

  if (!currentUser) return;

  const { error } =
    await supabaseClient
      .from("profiles")
      .update({
        online: true,
        last_seen: new Date().toISOString()
      })
      .eq("id", currentUser.id);

  if (error) {

    console.log(
      "Error actualizando estado:",
      error.message
    );

  }

}


/* =========================================
   MARCAR OFFLINE AL SALIR
========================================= */

window.addEventListener(
  "beforeunload",
  async () => {

    if (!currentUser) return;

    await supabaseClient
      .from("profiles")
      .update({
        online: false,
        last_seen: new Date().toISOString()
      })
      .eq("id", currentUser.id);

  }
);


/* =========================================
   CARGAR PERFIL
========================================= */

async function cargarPerfil() {

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select(
      "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
    )
    .eq("id", currentUser.id)
    .maybeSingle();


  if (error) {

    console.error(error);

    mostrarMensaje(
      "Error cargando el perfil.",
      true
    );

    return;
  }


  if (!data) {

    return;
  }


  document.getElementById("nombre").value =
    data.nombre || "";

  document.getElementById("edad").value =
    data.edad || "";

  document.getElementById("ciudad").value =
    data.ciudad || "";

  document.getElementById("descripcion").value =
    data.descripcion || "";

  document.getElementById("intereses").value =
    data.intereses || "";


  if (data.foto_url) {

    document.getElementById(
      "fotoPreview"
    ).src = data.foto_url;

  }

}


/* =========================================
   SELECCIONAR FOTO
========================================= */

document
  .getElementById("fotoInput")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];

      if (!file) return;

      fotoSeleccionada = file;

      const reader =
        new FileReader();

      reader.onload =
        function(e) {

          document.getElementById(
            "fotoPreview"
          ).src = e.target.result;

        };

      reader.readAsDataURL(file);

    }
  );


/* =========================================
   SUBIR FOTO
========================================= */

async function subirFoto() {

  if (!fotoSeleccionada) {

    return null;

  }


  const extension =
    fotoSeleccionada.name
      .split(".")
      .pop();


  const nombreArchivo =
    currentUser.id +
    "_" +
    Date.now() +
    "." +
    extension;


  const ruta =
    nombreArchivo;


  const {
    error
  } =
    await supabaseClient
      .storage
      .from("avatars")
      .upload(
        ruta,
        fotoSeleccionada,
        {
          upsert: true
        }
      );


  if (error) {

    console.error(
      "Error subiendo foto:",
      error
    );

    throw error;

  }


  const {
    data
  } =
    supabaseClient
      .storage
      .from("avatars")
      .getPublicUrl(ruta);


  return data.publicUrl;

}


/* =========================================
   GUARDAR PERFIL
========================================= */

async function guardarPerfil() {

  try {

    const nombre =
      document
        .getElementById("nombre")
        .value
        .trim();

    const edad =
      document
        .getElementById("edad")
        .value;

    const ciudad =
      document
        .getElementById("ciudad")
        .value
        .trim();

    const descripcion =
      document
        .getElementById("descripcion")
        .value
        .trim();

    const intereses =
      document
        .getElementById("intereses")
        .value
        .trim();


    if (!nombre) {

      mostrarMensaje(
        "Ingresá tu nombre.",
        true
      );

      return;
    }


    let foto_url = null;


    if (fotoSeleccionada) {

      foto_url =
        await subirFoto();

    }


    const datos = {

      id: currentUser.id,

      nombre: nombre,

      edad:
        edad
          ? Number(edad)
          : null,

      ciudad: ciudad,

      descripcion: descripcion,

      intereses: intereses,

      online: true,

      last_seen:
        new Date().toISOString()

    };


    if (foto_url) {

      datos.foto_url =
        foto_url;

    }


    const {
      error
    } =
      await supabaseClient
        .from("profiles")
        .upsert(
          datos
        );


    if (error) {

      console.error(error);

      mostrarMensaje(
        "Error: " +
        error.message,
        true
      );

      return;
    }


    fotoSeleccionada = null;


    mostrarMensaje(
      "✅ Perfil guardado correctamente",
      false
    );


  } catch (error) {

    console.error(error);

    mostrarMensaje(
      "Error guardando el perfil.",
      true
    );

  }

}


/* =========================================
   DESCUBRIR
========================================= */

async function mostrarDescubrir() {

  const section =
    document.getElementById(
      "descubrirSection"
    );

  section.classList.remove(
    "hidden"
  );


  const contenido =
    document.getElementById(
      "descubrirContenido"
    );


  contenido.innerHTML =
    "🔎 Buscando personas...";


  const {
    data: perfiles,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nombre,edad,ciudad,descripcion,foto_url,intereses,online,last_seen"
      )
      .neq(
        "id",
        currentUser.id
      )
      .limit(20);


  if (error) {

    console.error(error);

    contenido.innerHTML =
      "❌ Error buscando perfiles.";

    return;
  }


  if (!perfiles || perfiles.length === 0) {

    contenido.innerHTML =
      "😔 No encontramos otros perfiles todavía.";

    return;
  }


  contenido.innerHTML = "";


  perfiles.forEach(
    perfil => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "discover-card";


      const foto =
        perfil.foto_url ||
        "https://via.placeholder.com/180";


      const estado =
        perfil.online
          ? "🟢 En línea"
          : "⚪ Última vez activo: " +
            calcularUltimaConexion(
              perfil.last_seen
            );


      card.innerHTML = `

        <img
          class="discover-photo"
          src="${foto}"
          alt="Foto de ${perfil.nombre || "usuario"}"
        >

        <div class="discover-name">
          ${perfil.nombre || "Usuario"}
          ${perfil.edad ? ", " + perfil.edad : ""}
        </div>

        <div class="online">
          ${estado}
        </div>

        <div class="discover-info">
          📍 ${perfil.ciudad || "Sin ciudad"}
        </div>

        <div class="discover-info">
          ${perfil.descripcion || "Sin descripción"}
        </div>

        <div class="discover-info">
          ❤️ ${perfil.intereses || "Sin intereses"}
        </div>

        <button
          class="like-btn"
          onclick="darLike('${perfil.id}')"
        >
          ❤️ Me gusta
        </button>

      `;


      contenido.appendChild(
        card
      );

    }
  );

}


/* =========================================
   DAR LIKE
========================================= */

async function darLike(
  otherUserId
) {

  try {

    /*
      Esta parte utiliza la tabla "likes".
      Si tu tabla ya funciona con esta estructura,
      se mantiene el sistema actual.
    */

    const {
      error
    } =
      await supabaseClient
        .from("likes")
        .insert({
          from_user_id:
            currentUser.id,

          to_user_id:
            otherUserId
        });


    if (error) {

      /*
        Si ya existe el like,
        comprobamos si existe match.
      */

      console.log(
        "Like:",
        error.message
      );

    }


    const {
      data: match1
    } =
      await supabaseClient
        .from("matches")
        .select("*")
        .eq(
          "user1_id",
          currentUser.id
        )
        .eq(
          "user2_id",
          otherUserId
        )
        .maybeSingle();


    const {
      data: match2
    } =
      await supabaseClient
        .from("matches")
        .select("*")
        .eq(
          "user1_id",
          otherUserId
        )
        .eq(
          "user2_id",
          currentUser.id
        )
        .maybeSingle();


    if (match1 || match2) {

      alert(
        "💕 Ya existe un match con esta persona"
      );

      return;

    }


    /*
      Buscamos si la otra persona
      también nos dio like.
    */

    const {
      data: likeRecibido
    } =
      await supabaseClient
        .from("likes")
        .select("*")
        .eq(
          "from_user_id",
          otherUserId
        )
        .eq(
          "to_user_id",
          currentUser.id
        )
        .maybeSingle();


    if (likeRecibido) {

      const {
        error: matchError
      } =
        await supabaseClient
          .from("matches")
          .insert({

            user1_id:
              currentUser.id,

            user2_id:
              otherUserId

          });


      if (matchError) {

        console.error(
          matchError
        );

        alert(
          "💕 Ya existe un match con esta persona"
        );

        return;

      }


      alert(
        "🎉 ¡Es un MATCH! 💕"
      );

    } else {

      alert(
        "❤️ ¡Like enviado!"
      );

    }


  } catch (error) {

    console.error(error);

    alert(
      "Ocurrió un error."
    );

  }

}


/* =========================================
   ÚLTIMA CONEXIÓN
========================================= */

function calcularUltimaConexion(
  fecha
) {

  if (!fecha) {

    return "sin información";

  }


  const ahora =
    new Date();

  const ultima =
    new Date(fecha);

  const segundos =
    Math.floor(
      (
        ahora - ultima
      ) / 1000
    );


  if (segundos < 60) {

    return "hace unos segundos";

  }


  const minutos =
    Math.floor(
      segundos / 60
    );


  if (minutos < 60) {

    return (
      "hace " +
      minutos +
      " min"
    );

  }


  const horas =
    Math.floor(
      minutos / 60
    );


  if (horas < 24) {

    return (
      "hace " +
      horas +
      " h"
    );

  }


  const dias =
    Math.floor(
      horas / 24
    );


  return (
    "hace " +
    dias +
    " día" +
    (dias === 1 ? "" : "s")
  );

}


/* =========================================
   MENSAJES
========================================= */

function mostrarMensaje(
  texto,
  error
) {

  const elemento =
    document.getElementById(
      "mensajePerfil"
    );


  elemento.textContent =
    texto;


  elemento.className =
    "message " +
    (
      error
        ? "error"
        : "success"
    );


  elemento.style.display =
    "block";


  setTimeout(
    () => {

      elemento.style.display =
        "none";

    },
    4000
  );

}


/* =========================================
   INICIAR APP
========================================= */

iniciar();


/* =========================================
   ACTUALIZAR ESTADO CADA 60 SEGUNDOS
========================================= */

setInterval(
  marcarOnline,
  60000
);

</script>

</body>
</html>
