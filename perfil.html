<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1020, #172554);
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 22px 15px;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header span {
      color: #ff4f9a;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    }

    .foto-container {
      text-align: center;
      margin-bottom: 20px;
    }

    #previewFoto {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff4f9a;
      background: #222;
      display: block;
      margin: 0 auto 15px;
    }

    .photo-button {
      display: inline-block;
      padding: 12px 20px;
      background: #ff4f9a;
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .photo-button:hover {
      opacity: 0.9;
    }

    #photoInput {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(255,255,255,0.55);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .guardar {
      background: #ff4f9a;
      color: white;
    }

    .matches {
      background: #22c55e;
      color: white;
    }

    .descubrir {
      background: #3b82f6;
      color: white;
    }

    .mensaje {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      min-height: 25px;
    }

    .discover-card {
      margin-top: 25px;
      padding: 20px;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      text-align: center;
      display: none;
    }

    #discoverFoto {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ff4f9a;
    }

    .discover-card h2 {
      margin-bottom: 5px;
    }

    .discover-card p {
      color: rgba(255,255,255,0.8);
    }

    .acciones {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .acciones button {
      margin-top: 0;
    }

    .pasar {
      background: #ef4444;
      color: white;
    }

    .like {
      background: #22c55e;
      color: white;
    }

    .match-box {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border-radius: 20px;
      text-align: center;
    }

    .match-box h2 {
      margin-top: 0;
    }

    .chat-button {
      background: white;
      color: #8b5cf6;
    }
  </style>
</head>

<body>

<header>
  <h1>💕 Emi<span>Match</span></h1>
</header>

<div class="container">

  <div class="card">

    <h2 style="text-align:center;">Mi perfil</h2>

    <div class="foto-container">

      <img
        id="previewFoto"
        src="https://via.placeholder.com/150?text=Foto"
        alt="Foto de perfil"
      >

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

      <button
        type="button"
        class="photo-button"
        id="btnFoto"
      >
        📷 Elegir foto
      </button>

    </div>

    <label for="nombre">Nombre</label>
    <input
      type="text"
      id="nombre"
      placeholder="Tu nombre"
    >

    <label for="edad">Edad</label>
    <input
      type="number"
      id="edad"
      placeholder="Tu edad"
      min="18"
      max="100"
    >

    <label for="ciudad">Ciudad</label>
    <input
      type="text"
      id="ciudad"
      placeholder="Tu ciudad"
    >

    <label for="descripcion">Sobre mí</label>
    <textarea
      id="descripcion"
      placeholder="Contanos un poco sobre vos..."
    ></textarea>

    <label for="intereses">Intereses</label>
    <input
      type="text"
      id="intereses"
      placeholder="Música, fútbol, viajes..."
    >

    <button
      class="guardar"
      id="btnGuardar"
    >
      💾 Guardar perfil
    </button>

    <button
      class="matches"
      onclick="window.location.href='chat.html'"
    >
      💕 Mis Matches
    </button>

    <button
      class="descubrir"
      id="btnDescubrir"
    >
      🔎 Descubrir
    </button>

    <div
      class="mensaje"
      id="mensaje"
    ></div>

  </div>

  <div
    class="discover-card"
    id="discoverCard"
  >

    <img
      id="discoverFoto"
      src="https://via.placeholder.com/180?text=Foto"
      alt="Perfil"
    >

    <h2 id="discoverNombre"></h2>

    <p id="discoverDatos"></p>

    <p id="discoverDescripcion"></p>

    <p id="discoverIntereses"></p>

    <div class="acciones">

      <button
        class="pasar"
        id="btnPasar"
      >
        ❌ Pasar
      </button>

      <button
        class="like"
        id="btnLike"
      >
        ❤️ Me gusta
      </button>

    </div>

  </div>

  <div
    class="match-box"
    id="matchBox"
  >

    <h2>💕 ¡Es un Match!</h2>

    <p>
      A los dos les gustaron sus perfiles.
    </p>

    <button
      class="chat-button"
      id="btnChatMatch"
    >
      💬 Comenzar a chatear
    </button>

  </div>

</div>

<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://kngiadwaesdbmvwivdev.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     VARIABLES
  ========================= */

  let currentUser = null;
  let selectedPhoto = null;
  let personaActual = null;


  /* =========================
     ELEMENTOS
  ========================= */

  const photoInput =
    document.getElementById("photoInput");

  const btnFoto =
    document.getElementById("btnFoto");

  const previewFoto =
    document.getElementById("previewFoto");

  const btnGuardar =
    document.getElementById("btnGuardar");

  const btnDescubrir =
    document.getElementById("btnDescubrir");

  const discoverCard =
    document.getElementById("discoverCard");

  const matchBox =
    document.getElementById("matchBox");


  /* =========================
     MENSAJE
  ========================= */

  function mostrarMensaje(texto, error = false) {

    const mensaje =
      document.getElementById("mensaje");

    mensaje.textContent = texto;

    mensaje.style.color =
      error ? "#ff6b6b" : "#4ade80";
  }


  /* =========================
     ELEGIR FOTO
  ========================= */

  btnFoto.addEventListener("click", function () {

    photoInput.click();

  });


  photoInput.addEventListener("change", function (event) {

    const files = event.target.files;

    if (!files || !files.length) {
      return;
    }

    const archivo = files[0];

    if (!archivo.type.startsWith("image/")) {

      alert("Seleccioná una imagen válida.");

      photoInput.value = "";

      return;
    }

    if (archivo.size > 5 * 1024 * 1024) {

      alert("La foto no puede superar los 5 MB.");

      photoInput.value = "";

      return;
    }

    selectedPhoto = archivo;

    const objectUrl =
      URL.createObjectURL(archivo);

    previewFoto.src = objectUrl;

  });


  /* =========================
     INICIAR
  ========================= */

  async function iniciar() {

    try {

      const {
        data: {
          user
        },
        error
      } =
        await supabaseClient.auth.getUser();

      if (error) {
        throw error;
      }

      if (!user) {

        window.location.href = "index.html";

        return;
      }

      currentUser = user;

      await cargarPerfil();

    } catch (error) {

      console.error(error);

      mostrarMensaje(
        "❌ Error al iniciar: " + error.message,
        true
      );

    }

  }


  /* =========================
     CARGAR PERFIL
  ========================= */

  async function cargarPerfil() {

    try {

      mostrarMensaje("⏳ Cargando perfil...");

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,Nombre,Edad,Ciudad,Descripción,Foto_url,Intereses"
          )
          .eq(
            "id",
            currentUser.id
          )
          .maybeSingle();

      if (error) {
        throw error;
      }

      if (!data) {

        mostrarMensaje(
          "👋 Completá tu perfil."
        );

        return;
      }

      document.getElementById("nombre").value =
        data.Nombre || "";

      document.getElementById("edad").value =
        data.Edad || "";

      document.getElementById("ciudad").value =
        data.Ciudad || "";

      document.getElementById("descripcion").value =
        data.Descripción || "";

      document.getElementById("intereses").value =
        data.Intereses || "";

      if (data.Foto_url) {

        previewFoto.src =
          data.Foto_url;

      }

      mostrarMensaje("");

    } catch (error) {

      console.error(
        "ERROR CARGANDO PERFIL:",
        error
      );

      mostrarMensaje(
        "❌ Error: " + error.message,
        true
      );

    }

  }


  /* =========================
     SUBIR FOTO
  ========================= */

  async function subirFoto() {

    if (!selectedPhoto) {
      return null;
    }

    const extension =
      selectedPhoto.name
        .split(".")
        .pop()
        .toLowerCase();

    const nombreArchivo =
      currentUser.id +
      "_" +
      Date.now() +
      "." +
      extension;

    const ruta =
      "profiles/" +
      nombreArchivo;

    const {
      error
    } =
      await supabaseClient
        .storage
        .from("avatars")
        .upload(
          ruta,
          selectedPhoto,
          {
            cacheControl: "3600",
            upsert: false,
            contentType: selectedPhoto.type
          }
        );

    if (error) {
      throw error;
    }

    const {
      data
    } =
      supabaseClient
        .storage
        .from("avatars")
        .getPublicUrl(ruta);

    return data.publicUrl;

  }


  /* =========================
     GUARDAR PERFIL
  ========================= */

  async function guardarPerfil() {

    try {

      mostrarMensaje(
        "⏳ Guardando..."
      );

      const nombre =
        document
          .getElementById("nombre")
          .value
          .trim();

      const edad =
        document
          .getElementById("edad")
          .value;

      const ciudad =
        document
          .getElementById("ciudad")
          .value
          .trim();

      const descripcion =
        document
          .getElementById("descripcion")
          .value
          .trim();

      const intereses =
        document
          .getElementById("intereses")
          .value
          .trim();


      if (!nombre) {

        alert(
          "Ingresá tu nombre."
        );

        return;
      }


      let fotoUrl = null;


      /* FOTO NUEVA */

      if (selectedPhoto) {

        fotoUrl =
          await subirFoto();

      } else {

        /* CONSERVAR FOTO EXISTENTE */

        const {
          data,
          error
        } =
          await supabaseClient
            .from("profiles")
            .select("Foto_url")
            .eq(
              "id",
              currentUser.id
            )
            .maybeSingle();

        if (error) {
          throw error;
        }

        fotoUrl =
          data?.Foto_url || null;

      }


      /* DATOS */

      const datos = {

        id: currentUser.id,

        Nombre: nombre,

        Edad:
          edad
            ? parseInt(edad)
            : null,

        Ciudad: ciudad,

        Descripción:
          descripcion,

        Foto_url:
          fotoUrl,

        Intereses:
          intereses

      };


      /* GUARDAR */

      const {
        error
      } =
        await supabaseClient
          .from("profiles")
          .upsert(
            datos,
            {
              onConflict: "id"
            }
          );

      if (error) {
        throw error;
      }


      selectedPhoto = null;

      mostrarMensaje(
        "✅ Perfil guardado correctamente."
      );


    } catch (error) {

      console.error(
        "ERROR GUARDANDO PERFIL:",
        error
      );

      mostrarMensaje(
        "❌ Error: " +
        error.message,
        true
      );

    }

  }


  btnGuardar.addEventListener(
    "click",
    guardarPerfil
  );


  /* =========================
     DESCUBRIR
  ========================= */

  async function descubrir() {

    try {

      mostrarMensaje(
        "🔎 Buscando perfiles..."
      );

      matchBox.style.display =
        "none";

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,Nombre,Edad,Ciudad,Descripción,Foto_url,Intereses"
          )
          .neq(
            "id",
            currentUser.id
          )
          .limit(20);

      if (error) {
        throw error;
      }

      if (!data || data.length === 0) {

        discoverCard.style.display =
          "block";

        discoverCard.innerHTML = `
          <h2>😔 No hay perfiles disponibles</h2>
          <p>Volvé a intentarlo más tarde.</p>
        `;

        mostrarMensaje("");

        return;
      }

      /* Guardamos perfiles */

      window.perfilesDisponibles =
        data;

      window.indicePerfil = 0;

      mostrarPersona();

      mostrarMensaje("");

    } catch (error) {

      console.error(
        "ERROR DESCUBRIENDO:",
        error
      );

      mostrarMensaje(
        "❌ Error: " +
        error.message,
        true
      );

    }

  }


  /* =========================
     MOSTRAR PERSONA
  ========================= */

  function mostrarPersona() {

    const perfiles =
      window.perfilesDisponibles || [];

    const indice =
      window.indicePerfil || 0;


    if (indice >= perfiles.length) {

      discoverCard.style.display =
        "block";

      discoverCard.innerHTML = `
        <h2>🎉 No hay más perfiles</h2>
        <p>Ya viste todos los perfiles disponibles.</p>
      `;

      return;
    }


    personaActual =
      perfiles[indice];


    discoverCard.innerHTML = `

      <img
        id="discoverFoto"
        src="${
          personaActual.Foto_url ||
          "https://via.placeholder.com/180?text=Foto"
        }"
        alt="Foto"
      >

      <h2>
        ${
          personaActual.Nombre ||
          "Sin nombre"
        }
      </h2>

      <p>
        ${
          personaActual.Edad ||
          ""
        }
        ${
          personaActual.Ciudad
            ? " · " + personaActual.Ciudad
            : ""
        }
      </p>

      <p>
        ${
          personaActual.Descripción ||
          ""
        }
      </p>

      <p>
        ❤️ ${
          personaActual.Intereses ||
          "Sin intereses indicados"
        }
      </p>

      <div class="acciones">

        <button
          class="pasar"
          onclick="pasarPersona()"
        >
          ❌ Pasar
        </button>

        <button
          class="like"
          onclick="darLike()"
        >
          ❤️ Me gusta
        </button>

      </div>

    `;

    discoverCard.style.display =
      "block";

  }


  /* =========================
     PASAR
  ========================= */

  function pasarPersona() {

    window.indicePerfil++;

    mostrarPersona();

  }


  /* =========================
     LIKE
  ========================= */

  async function darLike() {

    if (!personaActual) {
      return;
    }

    try {

      mostrarMensaje(
        "❤️ Guardando..."
      );


      /* Buscar si la otra persona
         ya dio like */

      const {
        data: likeExistente,
        error: errorBusqueda
      } =
        await supabaseClient
          .from("likes")
          .select("id")
          .eq(
            "from_user_id",
            personaActual.id
          )
          .eq(
            "to_user_id",
            currentUser.id
          )
          .maybeSingle();


      if (errorBusqueda) {

        throw errorBusqueda;

      }


      /* MATCH */

      if (likeExistente) {

        await crearMatch(
          personaActual.id
        );

        mostrarMatch(
          personaActual
        );

        return;

      }


      /* CREAR LIKE */

      const {
        error
      } =
        await supabaseClient
          .from("likes")
          .insert({

            from_user_id:
              currentUser.id,

            to_user_id:
              personaActual.id

          });


      if (error) {

        /* Si ya existe,
           continuamos */

        if (
          !error.message
            .toLowerCase()
            .includes("duplicate")
        ) {

          throw error;

        }

      }


      mostrarMensaje(
        "❤️ ¡Like enviado!"
      );

      window.indicePerfil++;

      mostrarPersona();


    } catch (error) {

      console.error(
        "ERROR LIKE:",
        error
      );

      mostrarMensaje(
        "❌ Error: " +
        error.message,
        true
      );

    }

  }


  /* =========================
     CREAR MATCH
  ========================= */

  async function crearMatch(
    otroUsuarioId
  ) {

    const usuarios = [
      currentUser.id,
      otroUsuarioId
    ].sort();


    const user1_id =
      usuarios[0];

    const user2_id =
      usuarios[1];


    const {
      data: existente,
      error: errorBusqueda
    } =
      await supabaseClient
        .from("matches")
        .select("id")
        .eq(
          "user1_id",
          user1_id
        )
        .eq(
          "user2_id",
          user2_id
        )
        .maybeSingle();


    if (errorBusqueda) {
      throw errorBusqueda;
    }


    if (existente) {
      return existente.id;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("matches")
        .insert({

          user1_id:
            user1_id,

          user2_id:
            user2_id

        })
        .select("id")
        .single();


    if (error) {
      throw error;
    }


    return data.id;

  }


  /* =========================
     MOSTRAR MATCH
  ========================= */

  function mostrarMatch(
    persona
  ) {

    matchBox.style.display =
      "block";

    matchBox.innerHTML = `

      <h2>💕 ¡Es un Match!</h2>

      <p>
        A vos y a ${
          persona.Nombre ||
          "esta persona"
        }
        les gustaron sus perfiles.
      </p>

      <button
        class="chat-button"
        onclick="abrirC
