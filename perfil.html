const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let usuarioActual = null;
let fotoSeleccionada = null;


/* =========================
   INICIAR
========================= */

async function iniciar() {

  try {

    const {
      data: { session },
      error
    } =
      await supabaseClient
        .auth
        .getSession();

    if (
      error ||
      !session
    ) {

      window.location.replace(
        "./index.html"
      );

      return;
    }

    usuarioActual =
      session.user;

    await cargarPerfil();

    await cargarNotificaciones();

  } catch (error) {

    console.error(
      "Error al iniciar:",
      error
    );

    window.location.replace(
      "./index.html"
    );

  }

}


/* =========================
   CARGAR PERFIL
========================= */

async function cargarPerfil() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,nombre,edad,ciudad,descripcion,foto_url,intereses,created_at,online,last_seen"
      )
      .eq(
        "id",
        usuarioActual.id
      )
      .maybeSingle();

  if (error) {

    console.error(
      "Error cargando perfil:",
      error
    );

    mostrarMensaje(
      "No se pudo cargar tu perfil.",
      "error"
    );

    return;
  }

  if (!data) return;

  document.getElementById("nombre").value =
    data.nombre || "";

  document.getElementById("edad").value =
    data.edad || "";

  document.getElementById("ciudad").value =
    data.ciudad || "";

  document.getElementById("descripcion").value =
    data.descripcion || "";

  document.getElementById("intereses").value =
    data.intereses || "";

  actualizarContador();

  if (data.foto_url) {

    mostrarFoto(
      data.foto_url
    );

  }

}


/* =========================
   MOSTRAR FOTO
========================= */

function mostrarFoto(url) {

  const img =
    document.getElementById(
      "fotoPreview"
    );

  const sinFoto =
    document.getElementById(
      "sinFoto"
    );

  img.src = url;

  img.style.display =
    "block";

  sinFoto.style.display =
    "none";

}


/* =========================
   FOTO SELECCIONADA
========================= */

document
  .getElementById("foto")
  .addEventListener(
    "change",
    function(event) {

      const archivo =
        event.target.files[0];

      if (!archivo) return;

      const tiposPermitidos = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      if (
        !tiposPermitidos.includes(
          archivo.type
        )
      ) {

        alert(
          "Solo podés subir imágenes JPG, PNG o WEBP."
        );

        event.target.value = "";
        fotoSeleccionada = null;

        return;
      }

      const maximoMB = 5;

      const maximoBytes =
        maximoMB * 1024 * 1024;

      if (
        archivo.size >
        maximoBytes
      ) {

        alert(
          "La foto no puede superar los 5 MB."
        );

        event.target.value = "";
        fotoSeleccionada = null;

        return;
      }

      fotoSeleccionada =
        archivo;

      const url =
        URL.createObjectURL(
          archivo
        );

      mostrarFoto(url);

    }
  );


/* =========================
   CONTADOR DESCRIPCIÓN
========================= */

const descripcion =
  document.getElementById(
    "descripcion"
  );

descripcion.addEventListener(
  "input",
  actualizarContador
);

function actualizarContador() {

  const contador =
    document.getElementById(
      "contadorDescripcion"
    );

  const cantidad =
    descripcion.value.length;

  contador.textContent =
    cantidad + "/500";

}


/* =========================
   MENSAJES
========================= */

function mostrarMensaje(
  texto,
  tipo
) {

  const mensaje =
    document.getElementById(
      "mensaje"
    );

  mensaje.textContent =
    texto;

  if (tipo === "success") {

    mensaje.style.color =
      "#16a34a";

  } else {

    mensaje.style.color =
      "#dc2626";

  }

}


/* =========================
   GUARDAR PERFIL
========================= */

async function guardarPerfil() {

  if (!usuarioActual) {

    mostrarMensaje(
      "Tu sesión expiró. Volvé a iniciar sesión.",
      "error"
    );

    return;
  }

  const boton =
    document.getElementById(
      "guardarBtn"
    );

  boton.disabled =
    true;

  boton.textContent =
    "Guardando...";

  mostrarMensaje(
    "Guardando...",
    "success"
  );

  try {

    const nombre =
      document
        .getElementById("nombre")
        .value
        .trim();

    const edadTexto =
      document
        .getElementById("edad")
        .value
        .trim();

    const ciudad =
      document
        .getElementById("ciudad")
        .value
        .trim();

    const descripcionTexto =
      document
        .getElementById("descripcion")
        .value
        .trim();

    const intereses =
      document
        .getElementById("intereses")
        .value
        .trim();


    /* =========================
       VALIDACIONES
    ========================= */

    if (
      nombre.length < 2
    ) {

      throw new Error(
        "El nombre debe tener al menos 2 caracteres."
      );

    }

    let edad = null;

    if (edadTexto) {

      edad =
        Number(
          edadTexto
        );

      if (
        !Number.isInteger(edad) ||
        edad < 18 ||
        edad > 100
      ) {

        throw new Error(
          "La edad debe estar entre 18 y 100 años."
        );

      }

    }

    if (
      nombre.length > 60
    ) {

      throw new Error(
        "El nombre es demasiado largo."
      );

    }

    if (
      ciudad.length > 100
    ) {

      throw new Error(
        "La ciudad es demasiado larga."
      );

    }

    if (
      descripcionTexto.length > 500
    ) {

      throw new Error(
        "La descripción no puede superar los 500 caracteres."
      );

    }

    if (
      intereses.length > 300
    ) {

      throw new Error(
        "Los intereses son demasiado largos."
      );

    }


    /* =========================
       FOTO
    ========================= */

    let fotoUrl = null;

    if (fotoSeleccionada) {

      const extension =
        fotoSeleccionada.name
          .split(".")
          .pop()
          .toLowerCase();

      const nombreArchivo =
        usuarioActual.id +
        "_" +
        Date.now() +
        "." +
        extension;

      const ruta =
        nombreArchivo;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("avatars")
          .upload(
            ruta,
            fotoSeleccionada,
            {
              upsert: false,
              contentType:
                fotoSeleccionada.type,
              cacheControl:
                "3600"
            }
          );


      if (uploadError) {

        throw uploadError;

      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("avatars")
          .getPublicUrl(
            ruta
          );


      fotoUrl =
        publicData.publicUrl;

    }


    /* =========================
       DATOS DEL PERFIL
    ========================= */

    const datos = {

      id:
        usuarioActual.id,

      nombre:
        nombre,

      edad:
        edad,

      ciudad:
        ciudad,

      descripcion:
        descripcionTexto,

      intereses:
        intereses,

      online:
        true,

      last_seen:
        new Date()
          .toISOString()

    };


    if (fotoUrl) {

      datos.foto_url =
        fotoUrl;

    }


    /* =========================
       GUARDAR
    ========================= */

    const {
      error
    } =
      await supabaseClient
        .from("profiles")
        .upsert(
          datos,
          {
            onConflict:
              "id"
          }
        );


    if (error) {

      throw error;

    }


    fotoSeleccionada =
      null;

    document.getElementById(
      "foto"
    ).value = "";


    mostrarMensaje(
      "✅ Perfil guardado correctamente",
      "success"
    );


    setTimeout(
      function() {

        document.getElementById(
          "mensaje"
        ).textContent = "";

      },
      3000
    );


  } catch (error) {

    console.error(
      "Error guardando perfil:",
      error
    );

    mostrarMensaje(
      "❌ " +
      (
        error.message ||
        "No se pudo guardar el perfil."
      ),
      "error"
    );

  } finally {

    boton.disabled =
      false;

    boton.textContent =
      "💾 Guardar perfil";

  }

}


/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  const badge =
    document.getElementById(
      "badgeNotificaciones"
    );

  try {

    const {
      data: { session }
    } =
      await supabaseClient
        .auth
        .getSession();

    if (!session) return;

    const usuario =
      session.user.id;


    const {
      data: matches,
      error: matchesError
    } =
      await supabaseClient
        .from("matches")
        .select(
           "id,user1_id,user2_id"
        )
        .or(
          `user1_id.eq.${usuario},user2_id.eq.${usuario}`
        );


    if (matchesError) {

      console.error(
        "Error cargando matches:",
        matchesError
      );

      return;
    }


    if (
      !matches ||
      matches.length === 0
    ) {

      badge.style.display =
        "none";

      return;
    }


    let totalNoLeidos =
      0;


    for (
      const match of matches
    ) {

      const {
        data: mensajes,
        error: mensajesError
      } =
        await supabaseClient
          .from("messages")
          .select("id")
          .eq(
            "match_id",
            match.id
          )
          .neq(
            "sender_id",
            usuario
          )
          .is(
            "read_at",
            null
          );


      if (mensajesError) {

        console.error(
          "Error cargando mensajes:",
          mensajesError
        );

        continue;
      }


      totalNoLeidos +=
        mensajes?.length || 0;

    }


    if (
      totalNoLeidos > 0
    ) {

      badge.textContent =
        totalNoLeidos > 99
          ? "99+"
          : totalNoLeidos;

      badge.style.display =
        "flex";

    } else {

      badge.style.display =
        "none";

    }

  } catch (error) {

    console.error(
      "Error en notificaciones:",
      error
    );

  }

}


/* =========================
   CERRAR SESIÓN
========================= */

async function cerrarSesion() {

  const confirmar =
    confirm(
      "¿Querés cerrar sesión?"
    );

  if (!confirmar) return;


  try {

    await supabaseClient
      .auth
      .signOut();

  } catch (error) {

    console.error(
      "Error cerrando sesión:",
      error
    );

  }


  window.location.replace(
    "./index.html"
  );

}


/* =========================
   INICIAR APP
========================= */

iniciar();

</script>
