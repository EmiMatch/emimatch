<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#10152f">
  <meta
    name="description"
    content="Editar perfil de EmiMatch"
  >

  <title>Editar perfil — EmiMatch</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    :root {
      --bg: #0b1024;
      --card: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.12);
      --text: #f7f8ff;
      --muted: #aeb5d0;
      --primary: #5865f2;
      --primary-2: #7459e8;
      --gold: #d9b45b;
      --danger: #ff5c72;
      --success: #9ee6bd;
      --error: #ffadb8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px 14px 40px;
      background:
        radial-gradient(
          circle at top left,
          rgba(88,101,242,.22),
          transparent 35%
        ),
        radial-gradient(
          circle at top right,
          rgba(217,180,91,.13),
          transparent 30%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .page {
      width: min(100%, 680px);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .back {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }

    .intro {
      margin-bottom: 22px;
    }

    .intro h2 {
      margin: 0 0 7px;
      font-size: 22px;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 15px;
      outline: none;
      padding: 13px 14px;
      background: rgba(255,255,255,.06);
      color: var(--text);
      font: inherit;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(88,101,242,.8);
      box-shadow: 0 0 0 3px rgba(88,101,242,.14);
    }

    input::placeholder,
    textarea::placeholder {
      color: #858dab;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.5;
    }

    input[type="file"] {
      padding: 11px;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      border: 0;
      border-radius: 10px;
      padding: 9px 12px;
      margin-right: 10px;
      background: rgba(88,101,242,.85);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .photo-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .photo-preview {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 4px solid rgba(217,180,91,.55);
      background: #1b2143;
      box-shadow: 0 12px 35px rgba(0,0,0,.25);
    }

    .photo-placeholder {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          rgba(88,101,242,.8),
          rgba(116,89,232,.8)
        );
      border: 4px solid rgba(217,180,91,.55);
      color: #fff;
      font-size: 42px;
      font-weight: 800;
      box-shadow: 0 12px 35px rgba(0,0,0,.25);
    }

    .photo-name {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      word-break: break-word;
    }

    .help {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    button,
    .button-link {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 16px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .save {
      color: white;
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-2)
        );
    }

    .save:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .cancel {
      color: var(--text);
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
    }

    .status {
      min-height: 24px;
      margin-top: 15px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--error);
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 45px 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .card {
        padding: 18px;
        border-radius: 22px;
      }

      .topbar h1 {
        font-size: 21px;
      }

      .photo-preview,
      .photo-placeholder {
        width: 135px;
        height: 135px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="topbar">
      <h1>Editar perfil</h1>

      <a
        class="back"
        href="perfil.html"
      >
        ← Volver
      </a>
    </header>

    <section id="loading" class="card loading">
      Cargando tu perfil...
    </section>

    <section id="editor" class="card hidden">

      <div class="intro">
        <h2>Personalizá tu perfil</h2>

        <p>
          Actualizá tu información y agregá una foto
          para que tu perfil se vea más completo.
        </p>
      </div>

      <form id="profileForm">

        <!-- FOTO DE PERFIL -->

        <div class="field">

          <label for="fotoPerfil">
            📸 Foto de perfil
          </label>

          <div class="photo-box">

            <img
              id="fotoPreview"
              class="photo-preview hidden"
              src=""
              alt="Vista previa de tu foto"
            >

            <div
              id="fotoPlaceholder"
              class="photo-placeholder"
              aria-hidden="true"
            >
              EM
            </div>

            <div
              id="fotoName"
              class="photo-name"
            >
              No seleccionaste una foto nueva.
            </div>

          </div>

          <input
            id="fotoPerfil"
            name="fotoPerfil"
            type="file"
            accept="image/jpeg,image/png,image/webp"
          >

          <div class="help">
            JPG, PNG o WebP. Tamaño máximo: 5 MB.
          </div>

        </div>

        <!-- NOMBRE -->

        <div class="field">

          <label for="nombre">
            Nombre
          </label>

          <input
            id="nombre"
            name="nombre"
            type="text"
            maxlength="80"
            autocomplete="name"
            placeholder="Tu nombre"
          >

        </div>

        <!-- CIUDAD -->

        <div class="field">

          <label for="ciudad">
            Ciudad
          </label>

          <input
            id="ciudad"
            name="ciudad"
            type="text"
            maxlength="100"
            autocomplete="address-level2"
            placeholder="Buenos Aires"
          >

        </div>

        <!-- EDAD -->

        <div class="field">

          <label for="edad">
            Edad
          </label>

          <input
            id="edad"
            name="edad"
            type="number"
            min="18"
            max="100"
            inputmode="numeric"
            placeholder="31"
          >

          <div class="help">
            La edad debe estar entre 18 y 100 años.
          </div>

        </div>

        <!-- DESCRIPCIÓN -->

        <div class="field">

          <label for="descripcion">
            Descripción
          </label>

          <textarea
            id="descripcion"
            name="descripcion"
            maxlength="500"
            placeholder="Contá algo sobre vos..."
          ></textarea>

          <div class="help">
            Máximo 500 caracteres.
          </div>

        </div>

        <!-- ACCIONES -->

        <div class="actions">

          <button
            id="saveButton"
            class="save"
            type="submit"
          >
            Guardar cambios
          </button>

          <a
            class="button-link cancel"
            href="perfil.html"
          >
            Cancelar
          </a>

        </div>

        <div
          id="status"
          class="status"
          aria-live="polite"
        ></div>

      </form>

    </section>

  </main>

  <script src="assets/js/config.js"></script>

  <script type="module">

    const loading =
      document.getElementById("loading");

    const editor =
      document.getElementById("editor");

    const form =
      document.getElementById("profileForm");

    const saveButton =
      document.getElementById("saveButton");

    const nombreInput =
      document.getElementById("nombre");

    const ciudadInput =
      document.getElementById("ciudad");

    const edadInput =
      document.getElementById("edad");

    const descripcionInput =
      document.getElementById("descripcion");

    const fotoInput =
      document.getElementById("fotoPerfil");

    const fotoPreview =
      document.getElementById("fotoPreview");

    const fotoPlaceholder =
      document.getElementById("fotoPlaceholder");

    const fotoName =
      document.getElementById("fotoName");

    const statusElement =
      document.getElementById("status");

    let client = null;
    let currentUser = null;
    let currentPhotoUrl = "";

    const MAX_FILE_SIZE =
      5 * 1024 * 1024;

    const ALLOWED_TYPES = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];

    function setStatus(message, type = "") {

      statusElement.textContent =
        message || "";

      statusElement.className =
        `status ${type}`;

    }

    function getConfig() {

      const config =
        window.EMIMATCH_CONFIG || {};

      if (
        !config.supabaseUrl ||
        !config.supabaseAnonKey
      ) {
        throw new Error(
          "Configuración de Supabase incompleta."
        );
      }

      return config;
    }

    async function createSupabaseClient() {

      const config =
        getConfig();

      const module =
        await import(
          "https://esm.sh/@supabase/supabase-js@2"
        );

      return module.createClient(
        config.supabaseUrl,
        config.supabaseAnonKey
      );
    }

    function getInitials(name) {

      return String(name || "EM")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(
          word =>
            word.charAt(0)
        )
        .join("")
        .toUpperCase() || "EM";

    }

    function showPhoto(url, name) {

      if (url) {

        fotoPreview.src = url;
        fotoPreview.alt =
          `Foto de ${name || "perfil"}`;

        fotoPreview.classList.remove(
          "hidden"
        );

        fotoPlaceholder.classList.add(
          "hidden"
        );

        fotoPreview.onerror = () => {

          fotoPreview.classList.add(
            "hidden"
          );

          fotoPlaceholder.classList.remove(
            "hidden"
          );

        };

        return;
      }

      fotoPreview.classList.add(
        "hidden"
      );

      fotoPlaceholder.classList.remove(
        "hidden"
      );

      fotoPlaceholder.textContent =
        getInitials(name);

    }

    function getFileExtension(file) {

      const type =
        String(file?.type || "")
          .toLowerCase();

      if (type === "image/png") {
        return "png";
      }

      if (type === "image/webp") {
        return "webp";
      }

      return "jpg";
    }

    async function uploadProfilePhoto(file) {

      if (!file) {
        return currentPhotoUrl;
      }

      if (!ALLOWED_TYPES.includes(file.type)) {

        throw new Error(
          "La foto debe ser JPG, PNG o WebP."
        );

      }

      if (file.size > MAX_FILE_SIZE) {

        throw new Error(
          "La foto no puede superar los 5 MB."
        );

      }

      const extension =
        getFileExtension(file);

      const fileName =
        `${currentUser.id}_${Date.now()}.${extension}`;

      const filePath =
        fileName;

      setStatus(
        "Subiendo tu foto..."
      );

      const {
        error: uploadError
      } = await client.storage
        .from("avatars")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          }
        );

      if (uploadError) {
        throw uploadError;
      }

      const {
        data: publicData
      } = client.storage
        .from("avatars")
        .getPublicUrl(
          filePath
        );

      const publicUrl =
        publicData?.publicUrl || "";

      if (!publicUrl) {

        throw new Error(
          "No pudimos obtener la URL de la foto."
        );

      }

      return publicUrl;
    }

    async function loadProfile() {

      try {

        client =
          await createSupabaseClient();

        const {
          data: {
            user
          },
          error: userError
        } = await client.auth.getUser();

        if (userError) {
          throw userError;
        }

        if (!user) {

          window.location.href =
            "index.html";

          return;
        }

        currentUser = user;

        const {
          data: profile,
          error: profileError
        } = await client
          .from("profiles")
          .select("*")
          .eq("id", user.id)
          .maybeSingle();

        if (profileError) {
          throw profileError;
        }

        if (!profile) {

          throw new Error(
            "No encontramos tu perfil."
          );

        }

        nombreInput.value =
          profile.nombre ||
          profile.name ||
          user.user_metadata?.nombre ||
          "";

        ciudadInput.value =
          profile.ciudad ||
          profile.city ||
          "";

        const age =
          profile.edad ??
          profile.age ??
          "";

        edadInput.value =
          age === null ||
          age === undefined
            ? ""
            : String(age);

        descripcionInput.value =
          profile.descripcion ||
          profile.bio ||
          "";

        currentPhotoUrl =
          profile.foto_url ||
          profile.photo_url ||
          "";

        showPhoto(
          currentPhotoUrl,
          nombreInput.value
        );

        loading.classList.add(
          "hidden"
        );

        editor.classList.remove(
          "hidden"
        );

      } catch (error) {

        console.error(
          "Error cargando editor:",
          error
        );

        loading.innerHTML = `
          <strong>
            No pudimos cargar tu perfil.
          </strong>
          <br><br>
          ${escapeHtml(
            error?.message ||
            "Error desconocido"
          )}
          <br><br>
          <a
            href="perfil.html"
            style="color:#fff;"
          >
            Volver al perfil
          </a>
        `;

      }

    }

    fotoInput.addEventListener(
      "change",
      () => {

        const file =
          fotoInput.files?.[0];

        if (!file) {

          fotoName.textContent =
            "No seleccionaste una foto nueva.";

          showPhoto(
            currentPhotoUrl,
            nombreInput.value
          );

          return;
        }

        if (
          !ALLOWED_TYPES.includes(
            file.type
          )
        ) {

          fotoInput.value = "";

          setStatus(
            "Elegí una imagen JPG, PNG o WebP.",
            "error"
          );

          return;
        }

        if (
          file.size > MAX_FILE_SIZE
        ) {

          fotoInput.value = "";

          setStatus(
            "La foto no puede superar los 5 MB.",
            "error"
          );

          return;
        }

        fotoName.textContent =
          file.name;

        const previewUrl =
          URL.createObjectURL(file);

        fotoPreview.src =
          previewUrl;

        fotoPreview.alt =
          "Vista previa de la nueva foto";

        fotoPreview.classList.remove(
          "hidden"
        );

        fotoPlaceholder.classList.add(
          "hidden"
        );

        setStatus("");

      }
    );

    async function saveProfile(event) {

      event.preventDefault();

      if (!client || !currentUser) {

        setStatus(
          "La sesión todavía no está disponible.",
          "error"
        );

        return;
      }

      const nombre =
        nombreInput.value.trim();

      const ciudad =
        ciudadInput.value.trim();

      const descripcion =
        descripcionInput.value.trim();

      const edadTexto =
        edadInput.value.trim();

      if (!nombre) {

        setStatus(
          "Ingresá tu nombre.",
          "error"
        );

        nombreInput.focus();

        return;
      }

      let edad = null;

      if (edadTexto) {

        edad =
          Number(edadTexto);

        if (
          !Number.isInteger(edad) ||
          edad < 18 ||
          edad > 100
        ) {

          setStatus(
            "La edad debe estar entre 18 y 100 años.",
            "error"
          );

          edadInput.focus();

          return;
        }

      }

      saveButton.disabled = true;

      saveButton.textContent =
        "Guardando...";

      setStatus("");

      try {

        let photoUrl =
          currentPhotoUrl;

        const selectedFile =
          fotoInput.files?.[0];

        if (selectedFile) {

          photoUrl =
            await uploadProfilePhoto(
              selectedFile
            );

        }

        setStatus(
          "Guardando perfil..."
        );

        const updateData = {
          nombre,
          ciudad,
          edad,
          descripcion,
          foto_url: photoUrl || null
        };

        const {
          error
        } = await client
          .from("profiles")
          .update(updateData)
          .eq(
            "id",
            currentUser.id
          );

        if (error) {
          throw error;
        }

        currentPhotoUrl =
          photoUrl;

        setStatus(
          "Perfil actualizado correctamente.",
          "success"
        );

        setTimeout(() => {

          window.location.href =
            "perfil.html";

        }, 700);

      } catch (error) {

        console.error(
          "Error guardando perfil:",
          error
        );

        setStatus(
          error?.message ||
          "No pudimos guardar los cambios.",
          "error"
        );

        saveButton.disabled =
          false;

      saveButton. textContent =
        "Guardar cambios";

      }

   }

    function escapeHtml(value) {

      return String( value )
        .replaceAll(
          "&",
        )
        .repla
