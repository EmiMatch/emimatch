<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mi perfil | EmiMatch</title>

  <meta
    name="description"
    content="Personalizá tu perfil y compartí tus mejores momentos en EmiMatch."
  >

  <meta
    name="theme-color"
    content="#0b1228"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Sistema central -->
  <link
    rel="stylesheet"
    href="assets/css/app.css"
  >

  <style>

    /* =====================================================
       EmiMatch — Perfil Premium
       Update 10-E8
    ===================================================== */

    :root {
      --profile-bg: #070d1f;
      --profile-bg-2: #111a35;
      --profile-card: rgba(255,255,255,.065);
      --profile-border: rgba(255,255,255,.11);

      --profile-gold: #d9ad45;
      --profile-gold-light: #f1cf78;

      --profile-purple: #7c3aed;
      --profile-purple-light: #a855f7;

      --profile-text: #ffffff;
      --profile-muted: #94a3b8;

      --profile-success: #22c55e;
      --profile-danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      margin: 0;

      color: var(--profile-text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 10% 5%,
          rgba(124,58,237,.24),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(217,173,69,.13),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #050a18 0%,
          #0b1733 48%,
          #251044 100%
        );
    }

    body,
    button,
    input,
    textarea {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .profile-header {
      position: sticky;
      top: 0;
      z-index: 100;

      width: 100%;

      background:
        rgba(7,13,31,.90);

      border-bottom:
        1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .profile-header-inner {
      width: 100%;
      max-width: 1120px;

      margin: 0 auto;
      padding: 14px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .profile-logo {
      font-size: 24px;
      font-weight: 900;

      letter-spacing: -.8px;
    }

    .profile-logo span {
      color: var(--profile-gold);
    }

    .logout-btn {
      border:
        1px solid rgba(255,255,255,.13);

      background:
        rgba(255,255,255,.06);

      color: white;

      padding: 9px 15px;

      border-radius: 999px;

      cursor: pointer;

      transition: .2s;
    }

    .logout-btn:hover {
      background:
        rgba(255,255,255,.13);
    }

    /* =====================================================
       MAIN
    ===================================================== */

    .profile-main {
      width: 100%;
      max-width: 1120px;

      margin: 0 auto;

      padding:
        35px 20px 70px;
    }

    .welcome {
      text-align: center;

      margin-bottom: 30px;
    }

    .welcome h1 {
      margin: 0 0 10px;

      font-size:
        clamp(28px, 5vw, 42px);

      line-height: 1.15;
    }

    .welcome h1 span {
      color: var(--profile-gold);
    }

    .welcome p {
      max-width: 650px;

      margin: 0 auto;

      color: #cbd5e1;

      font-size: 15px;

      line-height: 1.6;
    }

    /* =====================================================
       STATUS
    ===================================================== */

    .status-message {
      display: none;

      width: 100%;

      margin-bottom: 20px;

      padding: 13px 16px;

      border-radius: 13px;

      font-size: 13px;

      line-height: 1.5;
    }

    .status-message.show {
      display: block;
    }

    .status-message.success {
      color: #bbf7d0;

      background:
        rgba(34,197,94,.12);

      border:
        1px solid rgba(34,197,94,.25);
    }

    .status-message.error {
      color: #fecaca;

      background:
        rgba(239,68,68,.12);

      border:
        1px solid rgba(239,68,68,.25);
    }

    .status-message.info {
      color: #bfdbfe;

      background:
        rgba(59,130,246,.12);

      border:
        1px solid rgba(59,130,246,.25);
    }

    /* =====================================================
       PAGE GRID
    ===================================================== */

    .profile-layout {
      display: grid;

      grid-template-columns:
        minmax(0,.9fr)
        minmax(0,1.1fr);

      gap: 24px;

      align-items: start;
    }

    /* =====================================================
       CARD
    ===================================================== */

    .profile-card-shell {
      padding: 25px;

      border-radius: 24px;

      background:
        var(--profile-card);

      border:
        1px solid var(--profile-border);

      box-shadow:
        0 20px 55px rgba(0,0,0,.22);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .card-title {
      margin: 0 0 7px;

      font-size: 21px;
    }

    .card-subtitle {
      margin: 0 0 22px;

      color: var(--profile-muted);

      font-size: 14px;

      line-height: 1.5;
    }

    /* =====================================================
       PHOTO
    ===================================================== */

    .photo-section {
      margin-bottom: 30px;
    }

    .section-label {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 14px;
    }

    .section-label h3 {
      margin: 0;

      font-size: 16px;
    }

    .section-label span {
      color: var(--profile-muted);

      font-size: 11px;
    }

    .main-photo {
      width: 190px;
      height: 190px;

      margin: 0 auto 16px;

      position: relative;

      overflow: hidden;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #312e81,
          #7c3aed
        );

      border:
        4px solid rgba(217,173,69,.75);

      box-shadow:
        0 15px 40px rgba(0,0,0,.32);
    }

    .main-photo img {
      width: 100%;
      height: 100%;

      display: none;

      object-fit: cover;
    }

    .main-photo-placeholder {
      font-size: 62px;
    }

    .photo-upload {
      width: 100%;

      position: relative;
    }

    .photo-upload input,
    .album-add input {
      position: absolute;

      width: 1px;
      height: 1px;

      opacity: 0;

      pointer-events: none;
    }

    .upload-btn {
      width: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 9px;

      padding: 13px;

      border-radius: 13px;

      border:
        1px solid rgba(255,255,255,.12);

      background:
        rgba(255,255,255,.07);

      color: white;

      cursor: pointer;

      font-weight: 700;

      transition: .2s;
    }

    .upload-btn:hover {
      background:
        rgba(255,255,255,.13);

      transform: translateY(-1px);
    }

    .upload-help {
      margin-top: 9px;

      text-align: center;

      color: #64748b;

      font-size: 11px;
    }

    /* =====================================================
       ALBUM
    ===================================================== */

    .album-section {
      margin-bottom: 28px;
    }

    .album-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 14px;
    }

    .album-header h3 {
      margin: 0;

      font-size: 17px;
    }

    .album-header p {
      margin: 3px 0 0;

      color: var(--profile-muted);

      font-size: 11px;
    }

    .album-add {
      position: relative;
    }

    .album-add-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      border:
        1px solid rgba(217,173,69,.3);

      background:
        rgba(217,173,69,.1);

      color:
        var(--profile-gold-light);

      padding: 9px 12px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 12px;
      font-weight: 700;
    }

    .album-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;
    }

    .album-item {
      aspect-ratio: 1 / 1;

      position: relative;

      overflow: hidden;

      border-radius: 14px;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid rgba(255,255,255,.09);
    }

    .album-item img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .album-empty {
      grid-column: 1 / -1;

      padding: 28px 15px;

      text-align: center;

      border-radius: 15px;

      border:
        1px dashed rgba(255,255,255,.14);

      color: var(--profile-muted);

      font-size: 12px;

      line-height: 1.5;
    }

    .album-delete {
      position: absolute;

      top: 7px;
      right: 7px;

      width: 29px;
      height: 29px;

      border: 0;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: white;

      background:
        rgba(0,0,0,.65);

      cursor: pointer;
    }

    .album-main {
      position: absolute;

      left: 7px;
      bottom: 7px;

      padding: 5px 7px;

      border-radius: 7px;

      color: #111827;

      background:
        var(--profile-gold-light);

      font-size: 9px;

      font-weight: 900;
    }

    /* =====================================================
       FORM
    ===================================================== */

    .form-row {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 14px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-label {
      display: block;

      margin-bottom: 7px;

      color: #e2e8f0;

      font-size: 13px;

      font-weight: 650;
    }

    .profile-input,
    .profile-textarea {
      width: 100%;

      border:
        1px solid rgba(255,255,255,.11);

      border-radius: 13px;

      padding: 13px 14px;

      outline: none;

      color: white;

      background:
        rgba(15,23,42,.75);

      transition: .2s;
    }

    .profile-input {
      height: 50px;
    }

    .profile-textarea {
      min-height: 125px;

      resize: vertical;

      line-height: 1.5;
    }

    .profile-input:focus,
    .profile-textarea:focus {
      border-color:
        rgba(217,173,69,.8);

      box-shadow:
        0 0 0 3px rgba(217,173,69,.1);
    }

    .profile-input::placeholder,
    .profile-textarea::placeholder {
      color: #64748b;
    }

    .counter {
      margin-top: 5px;

      text-align: right;

      color: #64748b;

      font-size: 11px;
    }

    .save-btn {
      width: 100%;

      border: 0;

      border-radius: 14px;

      padding: 15px;

      color: #111827;

      background:
        linear-gradient(
          135deg,
          var(--profile-gold),
          var(--profile-gold-light)
        );

      font-weight: 850;

      cursor: pointer;

      box-shadow:
        0 10px 28px rgba(217,173,69,.18);

      transition: .2s;
    }

    .save-btn:hover {
      transform: translateY(-2px);
    }

    .save-btn:disabled {
      opacity: .55;

      cursor: wait;

      transform: none;
    }

    /* =====================================================
       MATCHES CARD
    ===================================================== */

    .matches-card {
      margin-bottom: 24px;

      background:
        linear-gradient(
          135deg,
          rgba(124,58,237,.25),
          rgba(217,173,69,.1)
        );
    }

    .matches-content {
      display: flex;

      align-items: center;

      gap: 17px;
    }

    .matches-icon {
      width: 55px;
      height: 55px;

      min-width: 55px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 17px;

      background:
        rgba(255,255,255,.09);

      font-size: 26px;
    }

    .matches-text {
      flex: 1;
    }

    .matches-text h2 {
      margin: 0 0 5px;

      font-size: 20px;
    }

    .matches-text p {
      margin: 0;

      color: #cbd5e1;

      font-size: 13px;

      line-height: 1.5;
    }

    .matches-link {
      white-space: nowrap;

      padding: 11px 17px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.1);

      border:
        1px solid rgba(255,255,255,.13);

      font-size: 13px;

      font-weight: 700;

      transition: .2s;
    }

    .matches-link:hover {
      background:
        rgba(255,255,255,.18);
    }

    /* =====================================================
       DISCOVERY
    ===================================================== */

    .discovery-header {
      margin-bottom: 18px;
    }

    .discovery-header h2 {
      margin: 0;

      font-size: 22px;
    }

    .discovery-header p {
      margin: 4px 0 0;

      color: var(--profile-muted);

      font-size: 13px;
    }

    .profile-discovery-card {
      overflow: hidden;

      border-radius: 24px;

      background:
        rgba(255,255,255,.07);

      border:
        1px solid rgba(255,255,255,.1);

      box-shadow:
        0 20px 55px rgba(0,0,0,.22);
    }

    .discovery-photo {
      width: 100%;
      height: 390px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #312e81,
          #7c3aed
        );
    }

    .discovery-photo img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .discovery-photo-placeholder {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 80px;
    }

    .discovery-info {
      padding: 21px;
    }

    .discovery-name {
      margin: 0 0 5px;

      font-size: 25px;

      font-weight: 850;
    }

    .discovery-city {
      margin-bottom: 15px;

      color: var(--profile-gold);

      font-size: 14px;
    }

    .discovery-description {
      margin-bottom: 16px;

      color: #cbd5e1;

      font-size: 14px;

      line-height: 1.6;
    }

    .interests {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom: 20px;
    }

    .interest {
      padding: 6px 10px;

      border-radius: 999px;

      background:
        rgba(124,58,237,.18);

      color: #ddd6fe;

      font-size: 12px;
    }

    .discovery-actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 11px;
    }

    .action-btn {
      border: 0;

      padding: 13px;

      border-radius: 14px;

      cursor: pointer;

      font-weight: 800;

      transition: .2s;
    }

    .pass-btn {
      color: white;

      background:
        rgba(255,255,255,.09);

      border:
        1px solid rgba(255,255,255,.12);
    }

    .like-btn {
      color: white;

      background:
        linear-gradient(
          135deg,
          var(--profile-purple),
          var(--profile-purple-light)
        );
    }

    .action-btn:hover {
      transform: translateY(-2px);
    }

    .empty-state {
      padding: 45px 20px;

      text-align: center;

      color: var(--profile-muted);
    }

    .empty-state .emoji {
      margin-bottom: 12px;

      font-size: 45px;
    }

    .empty-state h3 {
      margin: 0 0 7px;

      color: white;
    }

    .empty-state p {
      margin: 0;

      font-size: 14px;

      line-height: 1.5;
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 820px) {

      .profile-layout {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 520px) {

      .profile-header-inner {
        padding: 13px 15px;
      }

      .profile-logo {
        font-size: 21px;
      }

      .logout-btn {
        padding: 8px 12px;

        font-size: 12px;
      }

      .profile-main {
        padding:
          24px 13px 50px;
      }

      .profile-card-shell {
        padding: 18px;

        border-radius: 20px;
      }

      .form-row {
        grid-template-columns: 1fr;

        gap: 0;
      }

      .main-photo {
        width: 160px;
        height: 160px;
      }

      .matches-content {
        align-items: flex-start;

        flex-direction: column;
      }

      .matches-link {
        width: 100%;

        text-align: center;
      }

      .discovery-photo {
        height: 350px;
      }

      .discovery-actions {
        grid-template-columns: 1fr;
      }

    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }

    }

  </style>

</head>

              /* =====================================================
   FOTOS — CONFIGURACIÓN
===================================================== */

const PHOTO_BUCKET =
  "profile-photos";

const MAX_PHOTO_SIZE =
  5 * 1024 * 1024;

const MAX_ALBUM_PHOTOS =
  6;

const ALLOWED_IMAGE_TYPES = [
  "image/jpeg",
  "image/png",
  "image/webp"
];


/* =====================================================
   VALIDAR ARCHIVO
===================================================== */

function validateImageFile(file) {

  if (!file) {

    return {
      valid: false,
      message: "No se seleccionó ninguna imagen."
    };
  }


  if (
    !ALLOWED_IMAGE_TYPES.includes(
      file.type
    )
  ) {

    return {
      valid: false,
      message:
        "Solo se permiten imágenes JPG, PNG o WebP."
    };
  }


  if (
    file.size > MAX_PHOTO_SIZE
  ) {

    return {
      valid: false,
      message:
        "Cada imagen puede pesar como máximo 5 MB."
    };
  }


  return {
    valid: true
  };
}


/* =====================================================
   EXTENSIÓN SEGURA
===================================================== */

function getFileExtension(file) {

  const typeMap = {
    "image/jpeg": "jpg",
    "image/png": "png",
    "image/webp": "webp"
  };

  return (
    typeMap[file.type] ||
    "jpg"
  );
}


/* =====================================================
   GENERAR RUTA STORAGE
===================================================== */

function createStoragePath(file) {

  const extension =
    getFileExtension(file);

  return (
    `${currentUser.id}/` +
    `${crypto.randomUUID()}.` +
    extension
  );
}


/* =====================================================
   OBTENER URL PÚBLICA
===================================================== */

function getPublicPhotoUrl(
  storagePath
) {

  const {
    data
  } = supabaseClient
    .storage
    .from(PHOTO_BUCKET)
    .getPublicUrl(
      storagePath
    );

  return data?.publicUrl || "";
}

     }

     const blockedIds =
       new Set(
         (blockedUsers || [])
           .map(
             block =>
               block.blocked_user_id
           )
       );


     /* -----------------------------------------------
        PERFILES
     ----------------------------------------------- */

     const {
       data: profiles,
       error: profilesError
     } = await supabaseClient
       .from("profiles")
       .select(`
         id,
         nombre,
         edad,
         ciudad,
         descripcion,
         foto_url,
         intereses,
         created_at
       `)
       .neq(
         "id",
         currentUser.id
       )
       .order(
         "created_at",
         {
           ascending: false
         }
       );

     if (profilesError) {
       throw profilesError;
     }


     /* -----------------------------------------------
        SWIPES YA REALIZADOS
     ----------------------------------------------- */

     const {
       data: swipes,
       error: swipesError
     } = await supabaseClient
       .from("swipes")
       .select(
         "target_user_id"
       )
       .eq(
         "user_id",
         currentUser.id
       );

     if (swipesError) {
       throw swipesError;
     }


     const seenIds =
       new Set(
         (swipes || [])
           .map(
             swipe =>
               swipe.target_user_id
           )
       );


     /* -----------------------------------------------
        FILTRO FINAL
     ----------------------------------------------- */

     discoveryProfiles =
       (profiles || [])
         .filter(
           profile => {

             const isBlocked =
               blockedIds.has(
                 profile.id
               );

             const alreadySeen =
               seenIds.has(
                 profile.id
               );

             return (
               !isBlocked &&
               !alreadySeen
             );
           }
         );


     currentProfileIndex = 0;


     if (
       analytics &&
       typeof analytics.trackDiscovery ===
         "function"
     ) {
       analytics.trackDiscovery();
     }


     renderDiscovery();


   } catch (error) {

     console.error(
       "Error descubriendo perfiles:",
       error
     );


     discoveryContainer.innerHTML = `
       <div class="discovery-empty">
         <div class="empty-icon">⚠️</div>
         <h3>No pudimos cargar perfiles</h3>
         <p>
           Ocurrió un problema al cargar
           los perfiles.
         </p>

         <button
           type="button"
           id="retryDiscoveryButton"
           class="primary-button"
         >
           Intentar nuevamente
         </button>
       </div>
     `;


     const retryButton =
       document.getElementById(
         "retryDiscoveryButton"
       );


     if (retryButton) {

       retryButton.addEventListener(
         "click",
         loadDiscoveryProfiles
       );
     }
   }
 }


 /* =====================================================
    RENDERIZAR DESCUBRIR
 ===================================================== */

 function renderDiscovery() {

   if (!discoveryContainer) {
     return;
   }


   if (
     currentProfileIndex >=
     discoveryProfiles.length
   ) {

     discoveryContainer.innerHTML = `
       <div class="discovery-empty">
         <div class="empty-icon">💫</div>

         <h3>
           No hay más perfiles por ahora
         </h3>

         <p>
           Volvé más tarde para descubrir
           nuevas personas.
         </p>

         <button
           type="button"
           id="reloadDiscoveryButton"
           class="primary-button"
         >
           Buscar nuevamente
         </button>
       </div>
     `;


     const reloadButton =
       document.getElementById(
         "reloadDiscoveryButton"
       );


     if (reloadButton) {

       reloadButton.addEventListener(
         "click",
         loadDiscoveryProfiles
       );
     }


     return;
   }


   const profile =
     discoveryProfiles[
       currentProfileIndex
     ];


   if (!profile) {

     renderDiscovery();

     return;
   }


   const safeName =
     escapeHTML(
       profile.nombre ||
       "Usuario"
     );


   const safeAge =
     profile.edad
       ? escapeHTML(
           profile.edad
         )
       : "";


   const safeCity =
     escapeHTML(
       profile.ciudad ||
       "Ciudad no indicada"
     );


   const safeDescription =
     escapeHTML(
       profile.descripcion ||
       "Sin descripción."
     );


   const safeInterests =
     escapeHTML(
       profile.intereses ||
       "Todavía no agregó intereses."
     );


   const photoUrl =
     profile.foto_url ||
     "https://placehold.co/600x600/111827/FFFFFF?text=EmiMatch";


   discoveryContainer.innerHTML = `

     <article
       class="discovery-card"
       data-profile-id="${escapeHTML(profile.id)}"
     >

       <div class="discovery-photo-wrapper">

         <img
           class="discovery-photo"
           src="${escapeHTML(photoUrl)}"
           alt="Foto de ${safeName}"
           loading="eager"
         >

         <div class="discovery-photo-overlay"></div>

         <div class="discovery-profile-info">

           <h3>
             ${safeName}
             ${
               safeAge
                 ? `, ${safeAge}`
                 : ""
             }
           </h3>

           <p>
             📍 ${safeCity}
           </p>

         </div>

       </div>


       <div class="discovery-content">

         <div class="discovery-section">

           <span class="discovery-label">
             Sobre mí
           </span>

           <p class="discovery-description">
             ${safeDescription}
           </p>

         </div>


         <div class="discovery-section">

           <span class="discovery-label">
             Intereses
           </span>

           <p class="discovery-interests">
             ${safeInterests}
           </p>

         </div>


         <div
           id="matchSuccessBox"
           class="match-success-box"
           hidden
         >
           <div class="match-success-icon">
             💕
           </div>

           <h3>
             ¡Hicieron Match!
           </h3>

           <p>
             Los dos se dieron Like.
           </p>

           <a
             href="matches.html"
             class="primary-button match-link"
           >
             Ver mis Matches
           </a>
         </div>


         <div
           id="discoveryActions"
           class="discovery-actions"
         >

           <button
             type="button"
             id="passButton"
             class="discovery-button pass-button"
             aria-label="Pasar este perfil"
           >
             ✕
           </button>

           <button
             type="button"
             id="likeButton"
             class="discovery-button like-button"
             aria-label="Dar Like a este perfil"
           >
             ❤️
           </button>

         </div>

       </div>

     </article>
   `;


   const discoveryPhoto =
     discoveryContainer.querySelector(
       ".discovery-photo"
     );


   if (discoveryPhoto) {

     discoveryPhoto.addEventListener(
       "error",
       () => {

         discoveryPhoto.onerror =
           null;

         discoveryPhoto.src =
           "https://placehold.co/600x600/111827/FFFFFF?text=EmiMatch";
       }
     );
   }


   const passButton =
     document.getElementById(
       "passButton"
     );


   const likeButton =
     document.getElementById(
       "likeButton"
     );


   if (passButton) {

     passButton.addEventListener(
       "click",
       () => {

         handleSwipe(
           profile,
           "pass"
         );
       }
     );
   }


   if (likeButton) {

     likeButton.addEventListener(
       "click",
       () => {

         handleSwipe(
           profile,
           "like"
         );
       }
     );
   }
 }


 /* =====================================================
    REGISTRAR SWIPE
 ===================================================== */

 async function handleSwipe(
   profile,
   action
 ) {

   if (
     !profile ||
     !profile.id ||
     !currentUser
   ) {
     return;
   }


   const targetId =
     profile.id;


   const passButton =
     document.getElementById(
       "passButton"
     );


   const likeButton =
     document.getElementById(
       "likeButton"
     );


   if (passButton) {
     passButton.disabled = true;
   }


   if (likeButton) {
     likeButton.disabled = true;
   }


   try {

     const {
       error: swipeError
     } = await supabaseClient
       .from("swipes")
       .insert({
         user_id:
           currentUser.id,

         target_user_id:
           targetId,

         action
       });


     if (swipeError) {
       throw swipeError;
     }


     /* -----------------------------------------------
        LIKE
     ----------------------------------------------- */

     if (action === "like") {

       if (
         analytics &&
         typeof analytics.trackLike ===
           "function"
       ) {

         analytics.trackLike();
       }


       const {
         data: reverseLike,
         error: reverseError
       } = await supabaseClient
         .from("swipes")
         .select("id")
         .eq(
           "user_id",
           targetId
         )
         .eq(
           "target_user_id",
           currentUser.id
         )
         .eq(
           "action",
           "like"
         )
         .maybeSingle();


       if (reverseError) {
         throw reverseError;
       }


       /* ---------------------------------------------
          MATCH MUTUO
       --------------------------------------------- */

       if (reverseLike) {

         const [
           user1_id,
           user2_id
         ] = [
           currentUser.id,
           targetId
         ].sort();


         const {
           error: matchError
         } = await supabaseClient
           .from("matches")
           .upsert(
             {
               user1_id,
               user2_id
             },
             {
               onConflict:
                 "user1_id,user2_id"
             }
           );


         if (matchError) {
           throw matchError;
         }


         if (
           analytics &&
           typeof analytics.trackMatch ===
             "function"
         ) {

           analytics.trackMatch();
         }


         showMatchSuccess();

         return;
       }
     }


     /* -----------------------------------------------
        SIGUIENTE PERFIL
     ----------------------------------------------- */

     currentProfileIndex += 1;

     renderDiscovery();


   } catch (error) {

     console.error(
       "Error registrando swipe:",
       error
     );


     showStatus(
       "No pudimos registrar esta acción. Intentá nuevamente.",
       "error"
     );


     if (passButton) {
       passButton.disabled = false;
     }


     if (likeButton) {
       likeButton.disabled = false;
     }
   }
 }


 /* =====================================================
    MOSTRAR MATCH
 ===================================================== */

 function showMatchSuccess() {

   const successBox =
     document.getElementById(
       "matchSuccessBox"
     );


   const actions =
     document.getElementById(
       "discoveryActions"
     );


   if (successBox) {
     successBox.hidden = false;
   }


   if (actions) {
     actions.hidden = true;
   }


   showStatus(
     "¡Hicieron Match! 💕",
     "success"
   );
 }


 /* =====================================================
    INICIAR DESCUBRIR
 ===================================================== */

 async function initializeDiscovery() {

   await loadDiscoveryProfiles();
 }
              /* =====================================================
   INICIALIZACIÓN COMPLETA
===================================================== */

async function initializeProfilePage() {

  try {

    /* -------------------------------------------------
       Verificar sesión
    ------------------------------------------------- */

    const authenticated =
      await initializeSession();

    if (!authenticated) {
      return;
    }


    /* -------------------------------------------------
       Analytics — visita de página
    ------------------------------------------------- */

    if (
      analytics &&
      typeof analytics.trackPage ===
        "function"
    ) {
      analytics.trackPage();
    }


    /* -------------------------------------------------
       Cargar perfil
    ------------------------------------------------- */

    await loadProfile();


    /* -------------------------------------------------
       Contadores
    ------------------------------------------------- */

    updateCounters();


    /* -------------------------------------------------
       Cargar álbum
    ------------------------------------------------- */

    await initializeAlbum();


    /* -------------------------------------------------
       Cargar descubrimiento
    ------------------------------------------------- */

    await initializeDiscovery();


    console.info(
      "EmiMatch: perfil inicializado correctamente."
    );


  } catch (error) {

    console.error(
      "Error inicializando perfil:",
      error
    );


    showStatus(
      "Ocurrió un problema al iniciar tu perfil.",
      "error"
    );
  }
}


/* =====================================================
   INICIO DE LA APLICACIÓN
===================================================== */

initializeProfilePage();

})();
</script>
