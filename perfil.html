<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Mi perfil</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 520px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    #guardar {
      background: #2563eb;
      color: white;
    }

    #logout {
      background: #ef4444;
      color: white;
    }

    .email {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      word-break: break-word;
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .descubrir {
      text-align: center;
    }

    .persona {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    #personaNombre {
      font-size: 25px;
      margin: 10px 0;
    }

    #personaEdad,
    #personaCiudad {
      font-size: 17px;
      margin: 8px 0;
    }

    .acciones {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .acciones button {
      flex: 1;
      margin-top: 0;
    }

    #pasar {
      background: #ef4444;
      color: white;
    }

    #like {
      background: #ec4899;
      color: white;
    }

    #mensajeSwipe {
      min-height: 24px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>💕 EmiMatch</h1>
</header>

<div class="container">

  <!-- MI PERFIL -->

  <div class="card">

    <h2>Mi perfil</h2>

    <div class="email">
      <strong>Email:</strong>
      <span id="email"></span>
    </div>

    <label for="nombre">Nombre</label>

    <input
      type="text"
      id="nombre"
      placeholder="Tu nombre"
    >

    <label for="edad">Edad</label>

    <input
      type="number"
      id="edad"
      placeholder="Tu edad"
      min="18"
      max="100"
    >

    <label for="ciudad">Ciudad</label>

    <input
      type="text"
      id="ciudad"
      placeholder="Tu ciudad"
    >

    <button id="guardar">
      💾 Guardar perfil
    </button>

    <div id="mensaje"></div>

    <button id="logout">
      🚪 Cerrar sesión
    </button>

  </div>


  <!-- DESCUBRIR PERSONAS -->

  <div class="card descubrir">

    <h2>💕 Descubrir personas</h2>

    <div class="persona">

      <h3 id="personaNombre">
        Buscando personas...
      </h3>

      <p id="personaEdad"></p>

      <p id="personaCiudad"></p>

      <div class="acciones">

        <button id="pasar">
          ❌ Pasar
        </button>

        <button id="like">
          ❤️ Like
        </button>

      </div>

    </div>

    <p id="mensajeSwipe"></p>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;

let perfilesDisponibles = [];

let perfilActual = 0;


// =====================================
// VERIFICAR SESIÓN
// =====================================

async function verificarSesion() {

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if (error) {

    console.error(error);

    window.location.href = "index.html";

    return;
  }

  if (!data.session) {

    window.location.href = "index.html";

    return;
  }

  usuarioActual = data.session.user;

  document.getElementById("email").textContent =
    usuarioActual.email || "";

  await cargarPerfil();

  await cargarPersonas();
}


// =====================================
// CARGAR MI PERFIL
// =====================================

async function cargarPerfil() {

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("id,nombre,edad,ciudad")
    .eq("id", usuarioActual.id)
    .maybeSingle();


  if (error) {

    console.error(error);

    document.getElementById("mensaje").textContent =
      "❌ Error al cargar el perfil: " +
      error.message;

    return;
  }


  if (!data) {

    return;
  }


  document.getElementById("nombre").value =
    data.nombre || "";

  document.getElementById("edad").value =
    data.edad || "";

  document.getElementById("ciudad").value =
    data.ciudad || "";
}


// =====================================
// GUARDAR MI PERFIL
// =====================================

document
  .getElementById("guardar")
  .addEventListener("click", guardarPerfil);


async function guardarPerfil() {

  const mensaje =
    document.getElementById("mensaje");

  const nombre =
    document.getElementById("nombre")
      .value
      .trim();

  const edad =
    document.getElementById("edad")
      .value;

  const ciudad =
    document.getElementById("ciudad")
      .value
      .trim();


  if (!nombre) {

    mensaje.textContent =
      "⚠️ Escribí tu nombre.";

    return;
  }


  if (!edad) {

    mensaje.textContent =
      "⚠️ Escribí tu edad.";

    return;
  }


  if (!ciudad) {

    mensaje.textContent =
      "⚠️ Escribí tu ciudad.";

    return;
  }


  mensaje.textContent =
    "Guardando...";


  try {

    const {
      error
    } = await supabaseClient
      .from("profiles")
      .upsert(
        {
          id: usuarioActual.id,
          nombre: nombre,
          edad: parseInt(edad, 10),
          ciudad: ciudad
        },
        {
          onConflict: "id"
        }
      );


    if (error) {

      console.error(error);

      mensaje.textContent =
        "❌ Error: " + error.message;

      return;
    }


    mensaje.textContent =
      "✅ Perfil guardado correctamente.";


    // Actualizar perfiles después de guardar

    await cargarPersonas();

  } catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error inesperado: " +
      error.message;
  }
}


// =====================================
// CARGAR OTROS PERFILES
// =====================================

async function cargarPersonas() {

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("id,nombre,edad,ciudad")
    .neq("id", usuarioActual.id)
    .order("id", {
      ascending: true
    });


  if (error) {

    console.error(error);

    document.getElementById("personaNombre")
      .textContent =
      "❌ Error al cargar personas.";

    document.getElementById("mensajeSwipe")
      .textContent =
      error.message;

    return;
  }


  perfilesDisponibles =
    data || [];

  perfilActual = 0;


  await mostrarPersona();
}


// =====================================
// MOSTRAR PERSONA
// =====================================

async function mostrarPersona() {

  const nombre =
    document.getElementById("personaNombre");

  const edad =
    document.getElementById("personaEdad");

  const ciudad =
    document.getElementById("personaCiudad");

  const botonLike =
    document.getElementById("like");

  const botonPasar =
    document.getElementById("pasar");


  if (
    !perfilesDisponibles.length ||
    perfilActual >= perfilesDisponibles.length
  ) {

    nombre.textContent =
      "💕 No hay más perfiles por ahora.";

    edad.textContent = "";

    ciudad.textContent = "";

    botonLike.style.display = "none";

    botonPasar.style.display = "none";

    return;
  }


  botonLike.style.display = "block";

  botonPasar.style.display = "block";


  const persona =
    perfilesDisponibles[perfilActual];


  nombre.textContent =
    persona.nombre ||
    "Sin nombre";


  edad.textContent =
    persona.edad
      ? "🎂 " + persona.edad + " años"
      : "";


  ciudad.textContent =
    persona.ciudad
      ? "📍 " + persona.ciudad
      : "";
}


// =====================================
// LIKE / PASS
// =====================================

async function registrarSwipe(accion) {

  if (
    !usuarioActual ||
    perfilActual >= perfilesDisponibles.length
  ) {
    return;
  }


  const persona =
    perfilesDisponibles[perfilActual];


  const mensaje =
    document.getElementById("mensajeSwipe");


  mensaje.textContent =
    "Guardando...";


  const {
    error
  } = await supabaseClient
    .from("swipes")
    .insert(
      {
        user_id: usuarioActual.id,
        target_user_id: persona.id,
        action: accion
      }
    );


  if (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error: " +
      error.message;

    return;
  }


  if (accion === "like") {

    mensaje.textContent =
      "❤️ ¡Like enviado!";

  } else {

    mensaje.textContent =
      "❌ Perfil pasado.";
  }


  perfilActual++;


  setTimeout(() => {

    mensaje.textContent = "";

    mostrarPersona();

  }, 600);
}


// =====================================
// BOTÓN LIKE
// =====================================

document
  .getElementById("like")
  .addEventListener("click", () => {

    registrarSwipe("like");

  });


// =====================================
// BOTÓN PASAR
// =====================================

document
  .getElementById("pasar")
  .addEventListener("click", () => {

    registrarSwipe("pass");

  });


// =====================================
// CERRAR SESIÓN
// =====================================

document
  .getElementById("logout")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    window.location.href =
      "index.html";

  });


// =====================================
// INICIAR
// =====================================

verificarSesion();

</script>

</body>
</html>
