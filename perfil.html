<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #guardar {
      background: #2563eb;
      color: white;
    }

    #logout {
      background: #ef4444;
      color: white;
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .email {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<header>
  <h1>💕 EmiMatch</h1>
</header>

<div class="container">

  <div class="card">

    <h2>Mi perfil</h2>

    <div class="email">
      <strong>Email:</strong>
      <span id="email"></span>
    </div>

    <label for="nombre">Nombre</label>
    <input
      type="text"
      id="nombre"
      placeholder="Tu nombre"
    >

    <label for="edad">Edad</label>
    <input
      type="number"
      id="edad"
      placeholder="Tu edad"
      min="18"
      max="100"
    >

    <label for="ciudad">Ciudad</label>
    <input
      type="text"
      id="ciudad"
      placeholder="Tu ciudad"
    >

    <button id="guardar">
      💾 Guardar perfil
    </button>

    <div id="mensaje"></div>

    <button id="logout">
      🚪 Cerrar sesión
    </button>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;


// ============================
// VERIFICAR SESIÓN
// ============================

async function verificarSesion() {

  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error || !data.session) {

    window.location.href = "index.html";

    return;
  }

  usuarioActual = data.session.user;

  document.getElementById("email").textContent =
    usuarioActual.email;

  cargarPerfil();
}


// ============================
// CARGAR PERFIL
// ============================

async function cargarPerfil() {

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("id,nombre,edad,ciudad")
      .eq("id", usuarioActual.id)
      .maybeSingle();

  if (error) {

    console.error(error);

    document.getElementById("mensaje").textContent =
      "❌ Error al cargar el perfil.";

    return;
  }

  if (!data) {
    return;
  }

  document.getElementById("nombre").value =
    data.nombre || "";

  document.getElementById("edad").value =
    data.edad || "";

  document.getElementById("ciudad").value =
    data.ciudad || "";
}


// ============================
// GUARDAR PERFIL
// ============================

document
  .getElementById("guardar")
  .addEventListener("click", async () => {

    const nombre =
      document.getElementById("nombre").value.trim();

    const edad =
      document.getElementById("edad").value;

    const ciudad =
      document.getElementById("ciudad").value.trim();

    const mensaje =
      document.getElementById("mensaje");


    if (!nombre) {

      mensaje.textContent =
        "⚠️ Escribí tu nombre.";

      return;
    }


    if (!edad) {

      mensaje.textContent =
        "⚠️ Escribí tu edad.";

      return;
    }


    if (!ciudad) {

      mensaje.textContent =
        "⚠️ Escribí tu ciudad.";

      return;
    }


    mensaje.textContent =
      "Guardando...";


    const { error } =
      await supabaseClient
        .from("profiles")
        .upsert({

          id: usuarioActual.id,

          nombre: nombre,

          edad: parseInt(edad),

          ciudad: ciudad

        });


    if (error) {

      console.error(error);

      mensaje.textContent =
        "❌ Error: " + error.message;

      return;
    }


    mensaje.textContent =
      "✅ Perfil guardado correctamente.";

  });


// ============================
// CERRAR SESIÓN
// ============================

document
  .getElementById("logout")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    window.location.href = "index.html";

  });


// INICIAR

verificarSesion();

</script>

</body>
</html>
