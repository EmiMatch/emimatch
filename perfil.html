<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil — EmiMatch</title>

  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(91, 67, 160, .28), transparent 45%),
        #090b18;
      color: #fff;
    }

    .profile-page {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 24px 16px 110px;
      box-sizing: border-box;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .profile-header h1 {
      margin: 0;
      font-size: 28px;
    }

    .profile-header p {
      margin: 7px 0 0;
      opacity: .72;
      font-size: 14px;
    }

    .profile-card {
      overflow: hidden;
      border-radius: 26px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }

    .profile-photo-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 520px;
      background: rgba(255,255,255,.04);
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      font-size: 60px;
      background:
        linear-gradient(145deg, rgba(91,67,160,.45), rgba(20,24,55,.8));
    }

    .photo-placeholder span {
      font-size: 14px;
      opacity: .65;
    }

    .profile-info {
      padding: 22px;
    }

    .profile-name {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
    }

    .profile-meta {
      margin-top: 8px;
      color: rgba(255,255,255,.72);
      font-size: 15px;
    }

    .profile-description {
      margin: 18px 0 0;
      line-height: 1.6;
      color: rgba(255,255,255,.86);
      white-space: pre-wrap;
    }

    .profile-actions {
      display: grid;
      gap: 11px;
      margin-top: 22px;
    }

    .profile-actions a,
    .profile-actions button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 15px;
      padding: 13px 16px;
      box-sizing: border-box;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      text-align: center;
      color: #fff;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.10);
    }

    .profile-actions .primary {
      background: linear-gradient(135deg, #7654d8, #9a5bcf);
    }

    .profile-actions .discover {
      background: linear-gradient(135deg, #6b4ac9, #b34e9d);
    }

    .profile-actions .danger {
      color: #ffb8c4;
      background: rgba(190,45,75,.12);
      border-color: rgba(255,100,130,.18);
    }

    .profile-actions button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .status {
      min-height: 22px;
      margin: 14px 4px;
      text-align: center;
      font-size: 14px;
      opacity: .82;
    }

    .loading {
      padding: 60px 20px;
      text-align: center;
      opacity: .7;
    }

    .hidden {
      display: none !important;
    }

    .error-message {
      color: #ffb8c4;
      line-height: 1.5;
    }

    .error-message a {
      color: #fff;
    }
  </style>
</head>

<body>

  <main class="profile-page">

    <header class="profile-header">
      <h1>Mi perfil 💜</h1>
      <p>Tu espacio en EmiMatch</p>
    </header>

    <section id="loadingState" class="profile-card">
      <div class="loading">
        Preparando tu perfil...
      </div>
    </section>

    <section id="profileContent" class="profile-card hidden">

      <div class="profile-photo-wrap">

        <img
          id="profilePhoto"
          class="profile-photo hidden"
          alt="Foto de perfil"
        >

        <div id="photoPlaceholder" class="photo-placeholder">
          💕
          <span>Agregá una foto a tu perfil</span>
        </div>

      </div>

      <div class="profile-info">

        <h2 id="profileName" class="profile-name">
          Mi perfil
        </h2>

        <div id="profileMeta" class="profile-meta"></div>

        <p id="profileDescription" class="profile-description"></p>

        <div class="profile-actions">

          <a
            class="primary"
            href="editar-perfil.html"
          >
            ✏️ Editar perfil
          </a>

          <a
            class="discover"
            href="descubrir.html"
          >
            💜 Seguir descubriendo
          </a>

          <a href="matches.html">
            ❤️ Mis matches
          </a>

          <a href="notificaciones.html">
            🔔 Notificaciones
          </a>

          <a href="configuracion.html">
            ⚙️ Configuración
          </a>

          <button
            id="deleteAccountButton"
            class="danger"
            type="button"
          >
            🗑️ Eliminar cuenta
          </button>

        </div>

        <div
          id="deleteStatus"
          class="status"
          aria-live="polite"
        ></div>

      </div>

    </section>

    <section
      id="errorState"
      class="profile-card hidden"
    >
      <div class="loading error-message">

        <strong>No pudimos cargar tu perfil.</strong>

        <br><br>

        <span id="errorDetails">
          Revisá tu sesión e intentá nuevamente.
        </span>

        <br><br>

        <a href="index.html">
          Volver al inicio
        </a>

      </div>
    </section>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuración EmiMatch -->
  <script src="assets/js/config.js"></script>

  <script>
    "use strict";

    (async function () {

      const loadingState =
        document.getElementById("loadingState");

      const profileContent =
        document.getElementById("profileContent");

      const errorState =
        document.getElementById("errorState");

      const errorDetails =
        document.getElementById("errorDetails");

      const profilePhoto =
        document.getElementById("profilePhoto");

      const photoPlaceholder =
        document.getElementById("photoPlaceholder");

      const profileName =
        document.getElementById("profileName");

      const profileMeta =
        document.getElementById("profileMeta");

      const profileDescription =
        document.getElementById("profileDescription");

      const deleteButton =
        document.getElementById("deleteAccountButton");

      const deleteStatus =
        document.getElementById("deleteStatus");

      function showError(message) {

        console.error(
          "EmiMatch — Error de perfil:",
          message
        );

        loadingState.classList.add("hidden");
        profileContent.classList.add("hidden");
        errorState.classList.remove("hidden");

        if (errorDetails && message) {
          errorDetails.textContent = message;
        }
      }

      function showProfile() {

        loadingState.classList.add("hidden");
        errorState.classList.add("hidden");
        profileContent.classList.remove("hidden");
      }

      try {

        /* =========================
           CONFIGURACIÓN
        ========================= */

        const config =
          window.EMIMATCH_CONFIG;

        if (
          !config ||
          !config.supabaseUrl ||
          !config.supabaseKey
        ) {
          showError(
            "Configuración de Supabase incompleta."
          );
          return;
        }

        if (
          !window.supabase ||
          typeof window.supabase.createClient !== "function"
        ) {
          showError(
            "No se pudo cargar el cliente de Supabase."
          );
          return;
        }

        const supabase =
          window.supabase.createClient(
            config.supabaseUrl,
            config.supabaseKey
          );

        /* =========================
           SESIÓN
        ========================= */

        const {
          data: sessionData,
          error: sessionError
        } = await supabase.auth.getSession();

        if (sessionError) {

          console.error(
            "Error obteniendo sesión:",
            sessionError
          );

          showError(
            "No se pudo verificar tu sesión."
          );

          return;
        }

        const session =
          sessionData?.session;

        if (!session?.user?.id) {

          window.location.replace(
            "index.html"
          );

          return;
        }

        const userId =
          session.user.id;

        console.log(
          "EmiMatch — sesión válida:",
          userId
        );

        /* =========================
           PERFIL
        ========================= */

        const {
          data: profile,
          error: profileError
        } = await supabase
          .from("profiles")
          .select(
            "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
          )
          .eq("id", userId)
          .maybeSingle();

        if (profileError) {

          console.error(
            "Error cargando profiles:",
            profileError
          );

          showError(
            "No pudimos cargar los datos de tu perfil."
          );

          return;
        }

        if (!profile) {

          showError(
            "Tu cuenta no tiene un perfil creado todavía."
          );

          return;
        }

        /* =========================
           DATOS
        ========================= */

        const name =
          profile.nombre ||
          "Mi perfil";

        const age =
          profile.edad ?? "";

        const city =
          profile.ciudad ||
          "";

        const description =
          profile.descripcion ||
          "";

        const photoUrl =
          profile.foto_url ||
          "";

        profileName.textContent =
          name;

        const metaParts = [];

        if (age !== "") {
          metaParts.push(
            `${age} años`
          );
        }

        if (city) {
          metaParts.push(city);
        }

        profileMeta.textContent =
          metaParts.join(" · ");

        profileDescription.textContent =
          description ||
          "Todavía no agregaste una descripción.";

        /* =========================
           FOTO
        ========================= */

        if (photoUrl) {

          profilePhoto.src =
            photoUrl;

          profilePhoto.classList.remove(
            "hidden"
          );

          photoPlaceholder.classList.add(
            "hidden"
          );

          profilePhoto.onerror = function () {

            profilePhoto.classList.add(
              "hidden"
            );

            photoPlaceholder.classList.remove(
              "hidden"
            );
          };

        } else {

          profilePhoto.classList.add(
            "hidden"
          );

          photoPlaceholder.classList.remove(
            "hidden"
          );
        }

        showProfile();

        /* =========================
           ELIMINAR CUENTA
        ========================= */

        if (deleteButton) {

          deleteButton.addEventListener(
            "click",
            async function () {

              const firstConfirmation =
                window.confirm(
                  "¿Seguro que querés eliminar tu cuenta de EmiMatch?\n\n" +
                  "Esta acción eliminará tu cuenta y sus datos."
                );

              if (!firstConfirmation) {
                return;
              }

              const finalConfirmation =
                window.confirm(
                  "ÚLTIMA CONFIRMACIÓN\n\n" +
                  "La eliminación de la cuenta es permanente.\n\n" +
                  "¿Querés continuar?"
                );

              if (!finalConfirmation) {
                return;
              }

              deleteButton.disabled = true;

              deleteStatus.textContent =
                "Eliminando tu cuenta...";

              try {

                const {
                  data: currentSessionData,
                  error: currentSessionError
                } = await supabase.auth.getSession();

                if (
                  currentSessionError ||
                  !currentSessionData?.session
                ) {

                  throw new Error(
                    "Tu sesión expiró. Volvé a iniciar sesión."
                  );
                }

                const {
                  data,
                  error
                } = await supabase.functions.invoke(
                  "delete-account",
                  {
                    method: "POST",
                    body: {}
                  }
                );

                if (error) {

                  console.error(
                    "Error Edge Function:",
                    error
                  );

                  throw new Error(
                    error.message ||
                    "No se pudo eliminar la cuenta."
                  );
                }

                if (
                  data &&
                  data.success === false
                ) {

                  throw new Error(
                    data.error ||
                    "No se pudo eliminar la cuenta."
                  );
                }

                deleteStatus.textContent =
                  "Cuenta eliminada correctamente.";

                await supabase.auth.signOut();

                setTimeout(
                  function () {
                    window.location.replace(
                      "index.html"
                    );
                  },
                  1200
                );

              } catch (deleteError) {

                console.error(
                  "Eliminación de cuenta:",
                  deleteError
                );

                deleteStatus.textContent =
                  deleteError.message ||
                  "No se pudo eliminar la cuenta.";

                deleteButton.disabled = false;
              }
            }
          );
        }

      } catch (error) {

        console.error(
          "EmiMatch — error inesperado:",
          error
        );

        showError(
          error.message ||
          "Ocurrió un error inesperado."
        );
      }

    })();
  </script>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/components.js"></script>

</body>
      </html>
