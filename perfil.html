<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #102b55);
      color: white;
      padding: 20px;
      padding-bottom: 105px;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
    }

    .cabecera {
      text-align: center;
      margin-bottom: 20px;
    }

    .cabecera h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .cabecera p {
      margin: 0;
      color: #cbd5e1;
    }

    .estado {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 13px;
      border-radius: 20px;
      background: rgba(34,197,94,.15);
      color: #4ade80;
      font-size: 14px;
    }

    .card {
      background: white;
      color: #172033;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 15px 35px rgba(0,0,0,.3);
    }

    .foto-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .foto-preview {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #d4af37;
      background: #e5e7eb;
    }

    .sin-foto {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 65px;
      border: 5px solid #d4af37;
    }

    .campo {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #d4af37;
    }

    .guardar {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      background: #d4af37;
      color: #07152f;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .guardar:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .mensaje {
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
      font-size: 14px;
    }

    .cerrar {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: rgba(255,255,255,.1);
      color: #cbd5e1;
      cursor: pointer;
    }

    /* =========================
       BARRA INFERIOR
    ========================= */

    .barra-inferior {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;

      height: 70px;

      background: rgba(255,255,255,.97);

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: space-around;

      box-shadow:
        0 8px 30px rgba(0,0,0,.35);

      z-index: 9999;

      max-width: 600px;
      margin: auto;
    }

    .nav-item {
      position: relative;

      flex: 1;

      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-decoration: none;

      color: #777;

      font-size: 11px;

      font-weight: bold;

      transition: .2s;
    }

    .nav-icon {
      font-size: 23px;
      line-height: 25px;
      margin-bottom: 3px;
    }

    .nav-item.activo {
      color: #123b78;
    }

    .nav-item.activo .nav-icon {
      transform: scale(1.12);
    }

    .badge {
      position: absolute;

      top: 7px;
      right: 18%;

      min-width: 19px;
      height: 19px;

      padding: 2px 5px;

      border-radius: 20px;

      background: #ef4444;

      color: white;

      font-size: 10px;

      display: none;

      align-items: center;
      justify-content: center;

      border: 2px solid white;
    }

    @media (min-width: 700px) {

      .barra-inferior {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: 600px;
      }

    }

    @media (max-width: 380px) {

      .nav-item {
        font-size: 9px;
      }

      .nav-icon {
        font-size: 21px;
      }

      .badge {
        right: 10%;
      }

    }
  </style>
</head>

<body>

<div class="contenedor">

  <div class="cabecera">

    <h1>👤 Mi perfil</h1>

    <p>
      Completá tu información
    </p>

    <div class="estado">
      🟢 En línea
    </div>

  </div>


  <div class="card">

    <div class="foto-container">

      <div
        id="sinFoto"
        class="sin-foto">
        👤
      </div>

      <img
        id="fotoPreview"
        class="foto-preview"
        style="display:none;"
        alt="Foto de perfil"
      >

      <div style="margin-top:12px;">

        <label for="foto">
          📸 Foto de perfil
        </label>

        <input
          type="file"
          id="foto"
          accept="image/*"
        >

      </div>

    </div>


    <div class="campo">

      <label for="nombre">
        Nombre
      </label>

      <input
        type="text"
        id="nombre"
        placeholder="Tu nombre"
      >

    </div>


    <div class="campo">

      <label for="edad">
        Edad
      </label>

      <input
        type="number"
        id="edad"
        min="18"
        max="100"
        placeholder="Tu edad"
      >

    </div>


    <div class="campo">

      <label for="ciudad">
        Ciudad
      </label>

      <input
        type="text"
        id="ciudad"
        placeholder="Tu ciudad"
      >

    </div>


    <div class="campo">

      <label for="descripcion">
        Sobre mí
      </label>

      <textarea
        id="descripcion"
        placeholder="Contanos un poco sobre vos..."
      ></textarea>

    </div>


    <div class="campo">

      <label for="intereses">
        Intereses
      </label>

      <input
        type="text"
        id="intereses"
        placeholder="Música, fútbol, viajes..."
      >

    </div>


    <button
      class="guardar"
      id="guardarBtn"
      onclick="guardarPerfil()">

      💾 Guardar perfil

    </button>


    <div
      id="mensaje"
      class="mensaje">
    </div>

  </div>


  <button
    class="cerrar"
    onclick="cerrarSesion()">

    🚪 Cerrar sesión

  </button>

</div>


<!-- =========================
     NAVEGACIÓN INFERIOR
========================= -->

<nav class="barra-inferior">

  <a
    href="./perfil.html"
    class="nav-item activo">

    <span class="nav-icon">
      👤
    </span>

    Perfil

  </a>


  <a
    href="./descubrir.html"
    class="nav-item">

    <span class="nav-icon">
      🔎
    </span>

    Descubrir

  </a>


  <a
    href="./likes.html"
    class="nav-item">

    <span class="nav-icon">
      ❤️
    </span>

    Me gustas

  </a>


  <a
    href="./chat.html"
    class="nav-item">

    <span class="nav-icon">
      💕
    </span>

    Matches

  </a>


  <a
    href="./notificaciones.html"
    class="nav-item">

    <span class="nav-icon">
      🔔
    </span>

    Notificaciones

    <span
      id="badgeNotificaciones"
      class="badge">
      0
    </span>

  </a>

</nav>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;

let fotoSeleccionada = null;


/* =========================
   INICIAR
========================= */

async function iniciar() {

  const {
    data: { session },
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !session
  ) {

    window.location.replace(
      "./index.html"
    );

    return;

  }


  usuarioActual =
    session.user;


  await cargarPerfil();

  await cargarNotificaciones();

}


/* =========================
   CARGAR PERFIL
========================= */

async function cargarPerfil() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        usuarioActual.id
      )
      .maybeSingle();


  if (error) {

    console.error(error);

    return;

  }


  if (!data) return;


  document.getElementById(
    "nombre"
  ).value =
    data.nombre || "";


  document.getElementById(
    "edad"
  ).value =
    data.edad || "";


  document.getElementById(
    "ciudad"
  ).value =
    data.ciudad || "";


  document.getElementById(
    "descripcion"
  ).value =
    data.descripcion || "";


  document.getElementById(
    "intereses"
  ).value =
    data.intereses || "";


  if (data.foto_url) {

    mostrarFoto(
      data.foto_url
    );

  }

}


/* =========================
   MOSTRAR FOTO
========================= */

function mostrarFoto(url) {

  const img =
    document.getElementById(
      "fotoPreview"
    );

  const sinFoto =
    document.getElementById(
      "sinFoto"
    );


  img.src = url;

  img.style.display =
    "block";

  sinFoto.style.display =
    "none";

}


/* =========================
   SELECCIONAR FOTO
========================= */

document
  .getElementById("foto")
  .addEventListener(
    "change",
    function(event) {

      const archivo =
        event.target.files[0];


      if (!archivo) return;


      fotoSeleccionada =
        archivo;


      const url =
        URL.createObjectURL(
          archivo
        );


      mostrarFoto(url);

    }
  );


/* =========================
   GUARDAR PERFIL
========================= */

async function guardarPerfil() {

  const boton =
    document.getElementById(
      "guardarBtn"
    );


  const mensaje =
    document.getElementById(
      "mensaje"
    );


  boton.disabled =
    true;


  mensaje.textContent =
    "Guardando...";


  try {

    let fotoUrl = null;


    /* FOTO */

    if (fotoSeleccionada) {

      const extension =
        fotoSeleccionada.name
          .split(".")
          .pop()
          .toLowerCase();


      const nombreArchivo =
        usuarioActual.id +
        "_" +
        Date.now() +
        "." +
        extension;


      const ruta =
        nombreArchivo;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("avatars")
          .upload(
            ruta,
            fotoSeleccionada,
            {
              upsert: true
            }
          );


      if (uploadError) {

        throw uploadError;

      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("avatars")
          .getPublicUrl(
            ruta
          );


      fotoUrl =
        publicData.publicUrl;

    }


    /* DATOS */

    const datos = {

      id:
        usuarioActual.id,

      nombre:
        document
          .getElementById(
            "nombre"
          )
          .value
          .trim(),

      edad:
        document
          .getElementById(
            "edad"
          )
          .value
          ? Number(
              document
                .getElementById(
                  "edad"
                )
                .value
            )
          : null,

      ciudad:
        document
          .getElementById(
            "ciudad"
          )
          .value
          .trim(),

      descripcion:
        document
          .getElementById(
            "descripcion"
          )
          .value
          .trim(),

      intereses:
        document
          .getElementById(
            "intereses"
          )
          .value
          .trim(),

      online: true,

      last_seen:
        new Date()
          .toISOString()

    };


    if (fotoUrl) {

      datos.foto_url =
        fotoUrl;

    }


    const {
      error
    } =
      await supabaseClient
        .from("profiles")
        .upsert(
          datos,
          {
            onConflict:
              "id"
          }
        );


    if (error) {

      throw error;

    }


    fotoSeleccionada =
      null;


    mensaje.textContent =
      "✅ Perfil guardado correctamente";


    mensaje.style.color =
      "#16a34a";


    setTimeout(
      () => {

        mensaje.textContent =
          "";

      },
      3000
    );


  } catch (error) {

    console.error(error);


    mensaje.textContent =
      "❌ No se pudo guardar el perfil";


    mensaje.style.color =
      "#dc2626";


  } finally {

    boton.disabled =
      false;

  }

}


/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones() {

  const badge =
    document.getElementById(
      "badgeNotificaciones"
    );


  const {
    data: { session }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (!session) return;


  const usuario =
    session.user.id;


  const {
    data: matches
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,user1_id,user2_id"
      )
      .or(
        `user1_id.eq.${usuario},user2_id.eq.${usuario}`
      );


  if (
    !matches ||
    matches.length === 0
  ) {

    badge.style.display =
      "none";

    return;

  }


  let totalNoLeidos =
    0;


  for (
    const match of matches
  ) {

    const {
      data: mensajes
    } =
      await supabaseClient
        .from("messages")
        .select("id")
        .eq(
          "match_id",
          match.id
        )
        .neq(
          "sender_id",
          usuario
        )
        .is(
          "read_at",
          null
        );


    totalNoLeidos +=
      mensajes?.length || 0;

  }


  if (
    totalNoLeidos > 0
  ) {

    badge.textContent =
      totalNoLeidos > 99
        ? "99+"
        : totalNoLeidos;


    badge.style.display =
      "flex";

  } else {

    badge.style.display =
      "none";

  }

}


/* =========================
   CERRAR SESIÓN
========================= */

async function cerrarSesion() {

  const confirmar =
    confirm(
      "¿Querés cerrar sesión?"
    );


  if (!confirmar) return;


  await supabaseClient
    .auth
    .signOut();


  window.location.replace(
    "./index.html"
  );

}


/* =========================
   INICIAR
========================= */

iniciar();

</script>

</body>
</html>
