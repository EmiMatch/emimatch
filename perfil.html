<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080b18">
  <meta name="description" content="Mi perfil en EmiMatch">

  <title>Mi perfil — EmiMatch</title>

  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    :root {
      --premium-gold: #f5d58a;
      --premium-gold-soft: #d9b96f;
      --premium-purple: #8d6cff;
      --premium-purple-2: #b36cff;
      --premium-bg: #070a16;
      --premium-card: rgba(18, 21, 43, .78);
      --premium-border: rgba(255,255,255,.11);
      --premium-text: #ffffff;
      --premium-muted: rgba(255,255,255,.68);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--premium-text);
      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(126, 92, 255, .24),
          transparent 34%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(218, 177, 91, .13),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(93, 57, 170, .18),
          transparent 38%
        ),
        var(--premium-bg);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .profile-page {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 28px 16px 110px;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .profile-header h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 34px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.6px;
      background:
        linear-gradient(
          135deg,
          #ffffff 10%,
          #f5d58a 48%,
          #b995ff 100%
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .profile-header p {
      margin: 9px 0 0;
      color: var(--premium-muted);
      font-size: 14px;
      letter-spacing: .2px;
    }

    .profile-card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background:
        linear-gradient(
          145deg,
          rgba(28, 30, 58, .86),
          rgba(10, 13, 29, .88)
        );
      border: 1px solid var(--premium-border);
      box-shadow:
        0 28px 80px rgba(0,0,0,.40),
        0 0 50px rgba(105,75,200,.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .profile-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.06),
          transparent 30%
        );
    }

    .profile-photo-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 540px;
      overflow: hidden;
      background:
        linear-gradient(
          145deg,
          #161936,
          #0c1024
        );
    }

    .profile-photo-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to top,
          rgba(5,7,17,.48),
          transparent 32%
        );
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .35s ease;
    }

    .profile-photo:hover {
      transform: scale(1.015);
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-size: 68px;
      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(145,107,255,.30),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #171a3d,
          #090d20
        );
    }

    .photo-placeholder span {
      padding: 8px 14px;
      border-radius: 999px;
      color: rgba(255,255,255,.68);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 13px;
      letter-spacing: .1px;
    }

    .profile-info {
      position: relative;
      padding: 25px 22px 24px;
    }

    .profile-name {
      margin: 0;
      font-size: clamp(27px, 7vw, 34px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .profile-meta {
      display: inline-flex;
      margin-top: 10px;
      padding: 7px 11px;
      border-radius: 999px;
      color: rgba(255,255,255,.76);
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 14px;
    }

    .profile-description {
      margin: 19px 0 0;
      line-height: 1.65;
      color: rgba(255,255,255,.84);
      white-space: pre-wrap;
      font-size: 15px;
    }

    .profile-actions {
      display: grid;
      gap: 11px;
      margin-top: 25px;
    }

    .profile-actions a,
    .profile-actions button {
      position: relative;
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,.10);
      box-sizing: border-box;
      font-size: 15px;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
      text-align: center;
      color: #fff;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.095),
          rgba(255,255,255,.045)
        );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05);
      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }

    .profile-actions a:hover,
    .profile-actions button:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.17);
      box-shadow:
        0 10px 26px rgba(0,0,0,.18);
    }

    .profile-actions a:active,
    .profile-actions button:active {
      transform: translateY(0);
    }

    .profile-actions .primary {
      color: #0c0d16;
      border-color: rgba(245,213,138,.42);
      background:
        linear-gradient(
          135deg,
          #f5d58a,
          #d8ae61
        );
      box-shadow:
        0 10px 30px rgba(218,177,91,.16);
    }

    .profile-actions .discover {
      border-color: rgba(143,108,255,.30);
      background:
        linear-gradient(
          135deg,
          rgba(111,82,218,.86),
          rgba(151,89,218,.80)
        );
      box-shadow:
        0 10px 30px rgba(105,76,210,.16);
    }

    .profile-actions .danger {
      color: #ffbdc9;
      background:
        linear-gradient(
          145deg,
          rgba(190,45,75,.13),
          rgba(110,24,48,.10)
        );
      border-color: rgba(255,100,130,.20);
    }

    .profile-actions button:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    .status {
      min-height: 22px;
      margin: 15px 4px 2px;
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,.72);
    }

    .loading {
      padding: 70px 22px;
      text-align: center;
      color: rgba(255,255,255,.70);
    }

    .hidden {
      display: none !important;
    }

    .error-message {
      color: #ffb8c4;
      line-height: 1.55;
    }

    .error-message a {
      color: #f5d58a;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 480px) {

      .profile-page {
        padding:
          22px
          12px
          90px;
      }

      .profile-card {
        border-radius: 23px;
      }

      .profile-info {
        padding: 22px 17px 20px;
      }

      .profile-header {
        margin-bottom: 19px;
      }

      .profile-photo-wrap {
        max-height: none;
      }

      .profile-actions {
        gap: 10px;
      }

      .profile-actions a,
      .profile-actions button {
        min-height: 51px;
      }
    }
  </style>
</head>

<body>

  <main class="profile-page">

    <header class="profile-header">
      <h1>Mi perfil 🫰</h1>
      <p>Tu espacio en EmiMatch</p>
    </header>

    <section id="loadingState" class="profile-card">
      <div class="loading">
        Preparando tu perfil...
      </div>
    </section>

    <section id="profileContent" class="profile-card hidden">

      <div class="profile-photo-wrap">

        <img
          id="profilePhoto"
          class="profile-photo hidden"
          alt="Foto de perfil"
        >

        <div id="photoPlaceholder" class="photo-placeholder">
          🫰
          <span>Agregá una foto a tu perfil</span>
        </div>

      </div>

      <div class="profile-info">

        <h2 id="profileName" class="profile-name">
          Mi perfil
        </h2>

        <div id="profileMeta" class="profile-meta"></div>

        <p id="profileDescription" class="profile-description"></p>

        <div class="profile-actions">

          <a
            class="primary"
            href="editar-perfil.html"
          >
            ✏️ Editar perfil
          </a>

          <a
            class="discover"
            href="descubrir.html"
          >
            🫰 Seguir descubriendo
          </a>

          <a href="matches.html">
            🫰 Mis matches
          </a>

          <a href="notificaciones.html">
            🔔 Notificaciones
          </a>

          <a href="configuracion.html">
            ⚙️ Configuración
          </a>

          <button
            id="deleteAccountButton"
            class="danger"
            type="button"
          >
            🗑️ Eliminar cuenta
          </button>

        </div>

        <div
          id="deleteStatus"
          class="status"
          aria-live="polite"
        ></div>

      </div>

    </section>

    <section
      id="errorState"
      class="profile-card hidden"
    >
      <div class="loading error-message">

        <strong>No pudimos cargar tu perfil.</strong>

        <br><br>

        <span id="errorDetails">
          Revisá tu sesión e intentá nuevamente.
        </span>

        <br><br>

        <a href="index.html">
          Volver al inicio
        </a>

      </div>
    </section>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuración EmiMatch -->
  <script src="assets/js/config.js"></script>

  <script>
    "use strict";

    (async function () {

      const loadingState =
        document.getElementById("loadingState");

      const profileContent =
        document.getElementById("profileContent");

      const errorState =
        document.getElementById("errorState");

      const errorDetails =
        document.getElementById("errorDetails");

      const profilePhoto =
        document.getElementById("profilePhoto");

      const photoPlaceholder =
        document.getElementById("photoPlaceholder");

      const profileName =
        document.getElementById("profileName");

      const profileMeta =
        document.getElementById("profileMeta");

      const profileDescription =
        document.getElementById("profileDescription");

      const deleteButton =
        document.getElementById("deleteAccountButton");

      const deleteStatus =
        document.getElementById("deleteStatus");

      function showError(message) {

        console.error(
          "EmiMatch — Error de perfil:",
          message
        );

        loadingState.classList.add("hidden");
        profileContent.classList.add("hidden");
        errorState.classList.remove("hidden");

        if (errorDetails && message) {
          errorDetails.textContent = message;
        }
      }

      function showProfile() {

        loadingState.classList.add("hidden");
        errorState.classList.add("hidden");
        profileContent.classList.remove("hidden");
      }

      try {

        /* =========================
           CONFIGURACIÓN
        ========================= */

        const config =
          window.EMIMATCH_CONFIG;

        if (
          !config ||
          !config.supabaseUrl ||
          !config.supabaseKey
        ) {
          showError(
            "Configuración de Supabase incompleta."
          );
          return;
        }

        if (
          !window.supabase ||
          typeof window.supabase.createClient !== "function"
        ) {
          showError(
            "No se pudo cargar el cliente de Supabase."
          );
          return;
        }

        const supabase =
          window.supabase.createClient(
            config.supabaseUrl,
            config.supabaseKey
          );

        /* =========================
           SESIÓN
        ========================= */

        const {
          data: sessionData,
          error: sessionError
        } = await supabase.auth.getSession();

        if (sessionError) {

          console.error(
            "Error obteniendo sesión:",
            sessionError
          );

          showError(
            "No se pudo verificar tu sesión."
          );

          return;
        }

        const session =
          sessionData?.session;

        if (!session?.user?.id) {

          window.location.replace(
            "index.html"
          );

          return;
        }

        const userId =
          session.user.id;

        console.log(
          "EmiMatch — sesión válida:",
          userId
        );

        /* =========================
           PERFIL
        ========================= */

        const {
          data: profile,
          error: profileError
        } = await supabase
          .from("profiles")
          .select(
            "id,nombre,edad,ciudad,descripcion,foto_url,intereses"
          )
          .eq("id", userId)
          .maybeSingle();

        if (profileError) {

          console.error(
            "Error cargando profiles:",
            profileError
          );

          showError(
            "No pudimos cargar los datos de tu perfil."
          );

          return;
        }

        if (!profile) {

          showError(
            "Tu cuenta no tiene un perfil creado todavía."
          );

          return;
        }

        /* =========================
           DATOS
        ========================= */

        const name =
          profile.nombre ||
          "Mi perfil";

        const age =
          profile.edad ?? "";

        const city =
          profile.ciudad ||
          "";

        const description =
          profile.descripcion ||
          "";

        const photoUrl =
          profile.foto_url ||
          "";

        profileName.textContent =
          name;

        const metaParts = [];

        if (age !== "") {
          metaParts.push(
            `${age} años`
          );
        }

        if (city) {
          metaParts.push(city);
        }

        profileMeta.textContent =
          metaParts.join(" · ");

        profileDescription.textContent =
          description ||
          "Todavía no agregaste una descripción.";

        /* =========================
           FOTO
        ========================= */

        if (photoUrl) {

          profilePhoto.src =
            photoUrl;

          profilePhoto.classList.remove(
            "hidden"
          );

          photoPlaceholder.classList.add(
            "hidden"
          );

          profilePhoto.onerror = function () {

            profilePhoto.classList.add(
              "hidden"
            );

            photoPlaceholder.classList.remove(
              "hidden"
            );
          };

        } else {

          profilePhoto.classList.add(
            "hidden"
          );

          photoPlaceholder.classList.remove(
            "hidden"
          );
        }

        showProfile();

        /* =========================
           ELIMINAR CUENTA
        ========================= */

        if (deleteButton) {

          deleteButton.addEventListener(
            "click",
            async function () {

              const firstConfirmation =
                window.confirm(
                  "¿Seguro que querés eliminar tu cuenta de EmiMatch?\n\n" +
                  "Esta acción eliminará tu cuenta y sus datos."
                );

              if (!firstConfirmation) {
                return;
              }

              const finalConfirmation =
                window.confirm(
                  "ÚLTIMA CONFIRMACIÓN\n\n" +
                  "La eliminación de la cuenta es permanente.\n\n" +
                  "¿Querés continuar?"
                );

              if (!finalConfirmation) {
                return;
              }

              deleteButton.disabled = true;

              deleteStatus.textContent =
                "Eliminando tu cuenta...";

              try {

                const {
                  data: currentSessionData,
                  error: currentSessionError
                } = await supabase.auth.getSession();

                if (
                  currentSessionError ||
                  !currentSessionData?.session
                ) {

                  throw new Error(
                    "Tu sesión expiró. Volvé a iniciar sesión."
                  );
                }

                const {
                  data,
                  error
                } = await supabase.functions.invoke(
                  "delete-account",
                  {
                    method: "POST",
                    body: {}
                  }
                );

                if (error) {

                  console.error(
                    "Error Edge Function:",
                    error
                  );

                  throw new Error(
                    error.message ||
                    "No se pudo eliminar la cuenta."
                  );
                }

                if (
                  data &&
                  data.success === false
                ) {

                  throw new Error(
                    data.error ||
                    "No se pudo eliminar la cuenta."
                  );
                }

                deleteStatus.textContent =
                  "Cuenta eliminada correctamente.";

                await supabase.auth.signOut();

                setTimeout(
                  function () {
                    window.location.replace(
                      "index.html"
                    );
                  },
                  1200
                );

              } catch (deleteError) {

                console.error(
                  "Eliminación de cuenta:",
                  deleteError
                );

                deleteStatus.textContent =
                  deleteError.message ||
                  "No se pudo eliminar la cuenta.";

                deleteButton.disabled = false;
              }
            }
          );
        }

      } catch (error) {

        console.error(
          "EmiMatch — error inesperado:",
          error
        );

        showError(
          error.message ||
          "Ocurrió un error inesperado."
        );
      }

    })();
  </script>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/components.js"></script>

</body>
</html>
