<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a3d, #102b5c);
      color: white;
      min-height: 100vh;
    }

    header {
      background: rgba(0,0,0,0.25);
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .contenedor {
      width: 95%;
      max-width: 900px;
      margin: 25px auto;
    }

    .tarjeta {
      background: white;
      color: #222;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h2 {
      color: #102b5c;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 0 2px rgba(212,175,55,0.2);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-guardar {
      background: #d4af37;
      color: #071a3d;
      width: 100%;
    }

    .btn-salir {
      background: #dc3545;
      color: white;
      width: 100%;
    }

    .foto-preview {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 15px auto;
      border: 5px solid #d4af37;
      background: #eee;
    }

    .email {
      background: #f1f3f5;
      padding: 12px;
      border-radius: 10px;
      color: #555;
      margin-bottom: 15px;
      word-break: break-word;
    }

    .mensaje {
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      display: none;
      text-align: center;
      font-weight: bold;
    }

    .exito {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    .cargando {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .persona {
      text-align: center;
    }

    .persona img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #d4af37;
      background: #eee;
    }

    .persona h3 {
      font-size: 25px;
      color: #102b5c;
      margin-bottom: 5px;
    }

    .persona p {
      color: #555;
      line-height: 1.5;
    }

    .intereses {
      display: inline-block;
      background: #102b5c;
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      margin-top: 5px;
    }

    .acciones {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn-pasar {
      background: #dc3545;
      color: white;
      flex: 1;
    }

    .btn-like {
      background: #28a745;
      color: white;
      flex: 1;
    }

    .sin-personas {
      text-align: center;
      color: #666;
      padding: 30px 10px;
    }

    .match {
      display: none;
      background: linear-gradient(135deg, #d4af37, #f7df8b);
      color: #071a3d;
      text-align: center;
      padding: 25px;
      border-radius: 18px;
      margin-top: 20px;
    }

    .match h2 {
      color: #071a3d;
      font-size: 30px;
    }

    @media (max-width: 600px) {
      .contenedor {
        width: 92%;
      }

      .tarjeta {
        padding: 20px;
      }

      .acciones {
        flex-direction: column;
      }

      .persona img {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>💕 EmiMatch</h1>
</header>

<div class="contenedor">

  <!-- PERFIL -->
  <div class="tarjeta">

    <h2>Mi perfil</h2>

    <div id="emailUsuario" class="email">
      Cargando usuario...
    </div>

    <label for="fotoURL">Foto de perfil</label>

    <img
      id="fotoPreview"
      class="foto-preview"
      src="https://via.placeholder.com/150"
      alt="Foto de perfil"
    >

    <input
      type="url"
      id="fotoURL"
      placeholder="Pegá aquí la URL de tu foto"
    >

    <label for="nombre">Nombre</label>

    <input
      type="text"
      id="nombre"
      placeholder="Tu nombre"
    >

    <label for="edad">Edad</label>

    <input
      type="number"
      id="edad"
      min="18"
      max="100"
      placeholder="Tu edad"
    >

    <label for="ciudad">Ciudad</label>

    <input
      type="text"
      id="ciudad"
      placeholder="Ej: Pilar"
    >

    <label for="descripcion">Descripción</label>

    <textarea
      id="descripcion"
      placeholder="Contanos un poco sobre vos..."
    ></textarea>

    <label for="intereses">Intereses</label>

    <input
      type="text"
      id="intereses"
      placeholder="Ej: fútbol, música, viajes"
    >

    <button
      id="guardarButton"
      class="btn-guardar"
    >
      💾 Guardar perfil
    </button>

    <div
      id="mensaje"
      class="mensaje"
    ></div>

    <button
      id="salirButton"
      class="btn-salir"
    >
      🚪 Cerrar sesión
    </button>

  </div>


  <!-- DESCUBRIR PERSONAS -->
  <div class="tarjeta">

    <h2>💕 Descubrir personas</h2>

    <div
      id="cargandoPersonas"
      class="cargando"
    >
      Buscando personas...
    </div>

    <div
      id="persona"
      class="persona"
      style="display:none;"
    >

      <img
        id="personaFoto"
        src="https://via.placeholder.com/180"
        alt="Foto"
      >

      <h3 id="personaNombre">
        -
      </h3>

      <p id="personaCiudad">
        -
      </p>

      <p id="personaDescripcion">
        -
      </p>

      <div
        id="personaIntereses"
        class="intereses"
      >
        -
      </div>

      <div class="acciones">

        <button
          id="pasarButton"
          class="btn-pasar"
        >
          ❌ Pasar
        </button>

        <button
          id="likeButton"
          class="btn-like"
        >
          ❤️ Me gusta
        </button>

      </div>

    </div>

    <div
      id="sinPersonas"
      class="sin-personas"
      style="display:none;"
    >
      <h3>No hay más perfiles por ahora.</h3>
      <p>Volvé más tarde para descubrir nuevas personas.</p>
    </div>


    <div
      id="match"
      class="match"
    >

      <h2>🎉 ¡Es un Match!</h2>

      <p>
        ¡A ambos les gustaron sus perfiles!
      </p>

      <p>
        Pronto podremos agregar el chat de EmiMatch.
      </p>

    </div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://kngiadwaesdbmvwivdev.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* =========================
     VARIABLES
  ========================= */

  let usuarioActual = null;
  let personaActual = null;


  /* =========================
     ELEMENTOS
  ========================= */

  const emailUsuario =
    document.getElementById("emailUsuario");

  const fotoURL =
    document.getElementById("fotoURL");

  const fotoPreview =
    document.getElementById("fotoPreview");

  const nombre =
    document.getElementById("nombre");

  const edad =
    document.getElementById("edad");

  const ciudad =
    document.getElementById("ciudad");

  const descripcion =
    document.getElementById("descripcion");

  const intereses =
    document.getElementById("intereses");

  const guardarButton =
    document.getElementById("guardarButton");

  const salirButton =
    document.getElementById("salirButton");

  const mensaje =
    document.getElementById("mensaje");

  const cargandoPersonas =
    document.getElementById("cargandoPersonas");

  const persona =
    document.getElementById("persona");

  const sinPersonas =
    document.getElementById("sinPersonas");

  const personaFoto =
    document.getElementById("personaFoto");

  const personaNombre =
    document.getElementById("personaNombre");

  const personaCiudad =
    document.getElementById("personaCiudad");

  const personaDescripcion =
    document.getElementById("personaDescripcion");

  const personaIntereses =
    document.getElementById("personaIntereses");

  const pasarButton =
    document.getElementById("pasarButton");

  const likeButton =
    document.getElementById("likeButton");

  const match =
    document.getElementById("match");


  /* =========================
     MENSAJES
  ========================= */

  function mostrarMensaje(texto, esError = false) {

    mensaje.textContent = texto;

    mensaje.className =
      "mensaje " +
      (esError ? "error" : "exito");

    mensaje.style.display = "block";

  }


  /* =========================
     SESIÓN
  ========================= */

  async function verificarSesion() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if (error) {

      console.error(error);

      mostrarMensaje(
        "Error al verificar la sesión.",
        true
      );

      return;

    }

    if (!data.session) {

      window.location.href =
        "index.html";

      return;

    }

    usuarioActual =
      data.session.user;

    emailUsuario.textContent =
      "📧 " + usuarioActual.email;

    await cargarPerfil();

    await cargarPersonas();

  }


  /* =========================
     CARGAR PERFIL
  ========================= */

  async function cargarPerfil() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,nombre,edad,ciudad,descripcion,foto_url,intereses,created_at"
        )
        .eq(
          "id",
          usuarioActual.id
        )
        .maybeSingle();


    if (error) {

      console.error(
        "Error al cargar el perfil:",
        error
      );

      mostrarMensaje(
        "❌ Error al cargar el perfil: " +
        error.message,
        true
      );

      return;

    }


    if (!data) {

      return;

    }


    nombre.value =
      data.nombre || "";

    edad.value =
      data.edad || "";

    ciudad.value =
      data.ciudad || "";

    descripcion.value =
      data.descripcion || "";

    intereses.value =
      data.intereses || "";

    fotoURL.value =
      data.foto_url || "";


    if (data.foto_url) {

      fotoPreview.src =
        data.foto_url;

    }

  }


  /* =========================
     PREVISUALIZAR FOTO
  ========================= */

  fotoURL.addEventListener(
    "input",
    () => {

      const url =
        fotoURL.value.trim();

      if (url) {

        fotoPreview.src = url;

      } else {

        fotoPreview.src =
          "https://via.placeholder.com/150";

      }

    }
  );


  /* =========================
     GUARDAR PERFIL
  ========================= */

  guardarButton.onclick =
    async () => {

      if (!usuarioActual) {

        mostrarMensaje(
          "No hay una sesión activa.",
          true
        );

        return;

      }


      const nombreValor =
        nombre.value.trim();

      const edadValor =
        edad.value.trim();

      const ciudadValor =
        ciudad.value.trim();

      const descripcionValor =
        descripcion.value.trim();

      const interesesValor =
        intereses.value.trim();

      const fotoURLValor =
        fotoURL.value.trim();


      if (!nombreValor) {

        mostrarMensaje(
          "Completá tu nombre.",
          true
        );

        return;

      }


      if (!edadValor) {

        mostrarMensaje(
          "Completá tu edad.",
          true
        );

        return;

      }


      const edadNumero =
        Number(edadValor);


      if (
        edadNumero < 18 ||
        edadNumero > 100
      ) {

        mostrarMensaje(
          "La edad debe estar entre 18 y 100 años.",
          true
        );

        return;

      }


      guardarButton.disabled = true;

      guardarButton.textContent =
        "Guardando...";


      const {
        error
      } =
        await supabaseClient
          .from("profiles")
          .upsert(
            {
              id: usuarioActual.id,

              nombre: nombreValor,

              edad: edadNumero,

              ciudad: ciudadValor,

              descripcion:
                descripcionValor,

              foto_url:
                fotoURLValor || null,

              intereses:
                interesesValor || null

            },
            {
              onConflict: "id"
            }
          );


      guardarButton.disabled = false;

      guardarButton.textContent =
        "💾 Guardar perfil";


      if (error) {

        console.error(
          "Error al guardar:",
          error
        );

        mostrarMensaje(
          "❌ Error al guardar: " +
          error.message,
          true
        );

        return;

      }


      mostrarMensaje(
        "✅ Perfil guardado correctamente."
      );


      await cargarPersonas();

    };


  /* =========================
     CARGAR PERSONAS
  ========================= */

  async function cargarPersonas() {

    cargandoPersonas.style.display =
      "block";

    persona.style.display =
      "none";

    sinPersonas.style.display =
      "none";

    match.style.display =
      "none";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,nombre,edad,ciudad,descripcion,foto_url,intereses,created_at"
        )
        .neq(
          "id",
          usuarioActual.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    cargandoPersonas.style.display =
      "none";


    if (error) {

      console.error(
        "Error al cargar personas:",
        error
      );

      sinPersonas.style.display =
        "block";

      sinPersonas.innerHTML =
        "<h3>❌ Error</h3>" +
        "<p>" +
        error.message +
        "</p>";

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      sinPersonas.style.display =
        "block";

      return;

    }


    mostrarPersona(data[0]);

  }


  /* =========================
     MOSTRAR PERSONA
  ========================= */

  function mostrarPersona(personaData) {

    personaActual =
      personaData;


    persona.style.display =
      "block";

    sinPersonas.style.display =
      "none";


    if (personaData.foto_url) {

      personaFoto.src =
        personaData.foto_url;

    } else {

      personaFoto.src =
        "https://via.placeholder.com/180";

    }


    personaNombre.textContent =
      (
        personaData.nombre ||
        "Usuario"
      ) +
      (
        personaData.edad
          ? ", " + personaData.edad
          : ""
      );


    personaCiudad.textContent =
      personaData.ciudad
        ? "📍 " + personaData.ciudad
        : "";


    personaDescripcion.textContent =
      personaData.descripcion ||
      "Sin descripción todavía.";


    personaIntereses.textContent =
      personaData.intereses
        ? "❤️ " + personaData.intereses
        : "Sin intereses indicados.";

  }


  /* =========================
     REGISTRAR SWIPE
  ========================= */

  async function registrarSwipe(
    accion
  ) {

    if (!personaActual) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("swipes")
        .insert(
          {
            user_id:
              usuarioActual.id,

            target_user_id:
              personaActual.id,

            action:
              accion

          }
        );


    if (error) {

      console.error(
        "Error al registrar swipe:",
        error
      );

      mostrarMensaje(
        "❌ Error: " +
        error.message,
        true
      );

      return;

    }


    if (accion === "like") {

      await comprobarMatch();

    }


    persona.style.display =
      "none";


    mostrarMensaje(
      accion === "like"
        ? "❤️ ¡Me gusta enviado!"
        : "❌ Perfil pasado."
    );

  }


  /* =========================
     COMPROBAR MATCH
  ========================= */

  async function comprobarMatch() {

    if (!personaActual) {

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("swipes")
        .select("id")
        .eq(
          "user_id",
          personaActual.id
        )
        .eq(
          "target_user_id",
          usuarioActual.id
        )
        .eq(
          "action",
          "like"
        )
        .maybeSingle();


    if (error) {

      console.error(
        "Error al comprobar match:",
        error
      );

      return;

    }


    if (data) {

      match.style.display =
        "block";

      match.scrollIntoView({
        behavior: "smooth"
      });

    }

  }


  /* =========================
     BOTONES
  ========================= */

  pasarButton.onclick =
    async () => {

      await registrarSwipe(
        "pass"
      );

      setTimeout(
        cargarPersonas,
        500
      );

    };


  likeButton.onclick =
    async () => {

      await registrarSwipe(
        "like"
      );

      setTimeout(
        cargarPersonas,
        500
      );

    };


  /* =========================
     CERRAR SESIÓN
  ========================= */

  salirButton.onclick =
    async () => {

      await supabaseClient.auth.signOut();

      window.location.href =
        "index.html";

    };


  /* =========================
     INICIAR
  ========================= */

  verificarSesion();

</script>

</body>
</html>
