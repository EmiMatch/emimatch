<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch - Mi perfil</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    .container {
      max-width: 560px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    #guardar {
      background: #2563eb;
      color: white;
    }

    #logout {
      background: #ef4444;
      color: white;
    }

    .email {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      word-break: break-word;
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      min-height: 22px;
    }

    .foto-preview {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e5e7eb;
      overflow: hidden;
      border: 4px solid #e5e7eb;
    }

    .foto-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .foto-placeholder {
      font-size: 55px;
    }

    .descubrir {
      text-align: center;
    }

    .persona {
      background: #f9fafb;
      padding: 20px;
      border-radius: 18px;
      border: 1px solid #eee;
    }

    .persona-foto {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      margin: 0 auto 15px;
      overflow: hidden;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #e5e7eb;
    }

    .persona-foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .persona-foto-placeholder {
      font-size: 65px;
    }

    #personaNombre {
      font-size: 27px;
      margin: 10px 0;
    }

    #personaEdad,
    #personaCiudad,
    #personaIntereses {
      font-size: 17px;
      margin: 9px 0;
    }

    #personaDescripcion {
      font-size: 16px;
      line-height: 1.5;
      color: #555;
      margin: 15px 0;
    }

    .acciones {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .acciones button {
      flex: 1;
      margin-top: 0;
    }

    #pasar {
      background: #ef4444;
      color: white;
    }

    #like {
      background: #ec4899;
      color: white;
    }

    #mensajeSwipe {
      min-height: 24px;
      font-weight: bold;
      margin-top: 15px;
    }

    .match {
      display: none;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      margin-top: 20px;
    }

    .match h2 {
      margin-bottom: 10px;
    }

    .match-icon {
      font-size: 55px;
    }

    .sin-perfiles {
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>💕 EmiMatch</h1>
  <p>Conocé personas y encontrá tu Match</p>
</header>

<div class="container">

  <!-- ========================= -->
  <!-- MI PERFIL -->
  <!-- ========================= -->

  <div class="card">

    <h2>Mi perfil</h2>

    <div class="email">
      <strong>Email:</strong>
      <span id="email"></span>
    </div>

    <div class="foto-preview" id="miFotoPreview">
      <div class="foto-placeholder">👤</div>
    </div>

    <label for="foto_url">URL de foto</label>

    <input
      type="url"
      id="foto_url"
      placeholder="https://..."
    >

    <label for="nombre">Nombre</label>

    <input
      type="text"
      id="nombre"
      placeholder="Tu nombre"
    >

    <label for="edad">Edad</label>

    <input
      type="number"
      id="edad"
      placeholder="Tu edad"
      min="18"
      max="100"
    >

    <label for="ciudad">Ciudad</label>

    <input
      type="text"
      id="ciudad"
      placeholder="Tu ciudad"
    >

    <label for="descripcion">Descripción</label>

    <textarea
      id="descripcion"
      placeholder="Contá un poco sobre vos..."
    ></textarea>

    <label for="intereses">Intereses</label>

    <input
      type="text"
      id="intereses"
      placeholder="Ej: fútbol, música, viajes..."
    >

    <button id="guardar">
      💾 Guardar perfil
    </button>

    <div id="mensaje"></div>

    <button id="logout">
      🚪 Cerrar sesión
    </button>

  </div>


  <!-- ========================= -->
  <!-- DESCUBRIR PERSONAS -->
  <!-- ========================= -->

  <div class="card descubrir">

    <h2>💕 Descubrir personas</h2>

    <div class="persona">

      <div class="persona-foto" id="personaFoto">
        <div class="persona-foto-placeholder">👤</div>
      </div>

      <h3 id="personaNombre">
        Buscando personas...
      </h3>

      <p id="personaEdad"></p>

      <p id="personaCiudad"></p>

      <p id="personaIntereses"></p>

      <p id="personaDescripcion"></p>

      <div class="acciones">

        <button id="pasar">
          ❌ Pasar
        </button>

        <button id="like">
          ❤️ Like
        </button>

      </div>

    </div>

    <p id="mensajeSwipe"></p>

    <!-- MATCH -->

    <div class="match" id="match">

      <div class="match-icon">💕</div>

      <h2>¡Es un Match!</h2>

      <p>
        Los dos se dieron Like.
      </p>

      <p>
        Próximamente podrán comenzar a chatear.
      </p>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let usuarioActual = null;

let perfilesDisponibles = [];

let perfilActual = 0;


// =====================================
// VERIFICAR SESIÓN
// =====================================

async function verificarSesion() {

  try {

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error) {

      console.error(error);

      window.location.href = "index.html";

      return;
    }

    if (!data.session) {

      window.location.href = "index.html";

      return;
    }

    usuarioActual = data.session.user;

    document.getElementById("email").textContent =
      usuarioActual.email || "";

    await cargarPerfil();

    await cargarPersonas();

  } catch (error) {

    console.error(error);

    document.getElementById("mensaje").textContent =
      "❌ Error al iniciar el perfil: " +
      error.message;
  }
}


// =====================================
// CARGAR MI PERFIL
// =====================================

async function cargarPerfil() {

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select(
      'id,nombre,edad,ciudad,"descripción",foto_url,intereses,created_at'
    )
    .eq("id", usuarioActual.id)
    .maybeSingle();


  if (error) {

    console.error(error);

    document.getElementById("mensaje").textContent =
      "❌ Error al cargar el perfil: " +
      error.message;

    return;
  }


  if (!data) {

    return;
  }


  document.getElementById("nombre").value =
    data.nombre || "";

  document.getElementById("edad").value =
    data.edad || "";

  document.getElementById("ciudad").value =
    data.ciudad || "";

  document.getElementById("descripcion").value =
    data["descripción"] || "";

  document.getElementById("foto_url").value =
    data.foto_url || "";

  document.getElementById("intereses").value =
    data.intereses || "";


  actualizarMiFoto(data.foto_url);
}


// =====================================
// FOTO DE MI PERFIL
// =====================================

function actualizarMiFoto(url) {

  const contenedor =
    document.getElementById("miFotoPreview");


  if (!url) {

    contenedor.innerHTML =
      '<div class="foto-placeholder">👤</div>';

    return;
  }


  contenedor.innerHTML =
    '<img src="' +
    escaparHTML(url) +
    '" alt="Mi foto" onerror="this.parentElement.innerHTML=\'<div class=&quot;foto-placeholder&quot;>👤</div>\'">';
}


// =====================================
// ESCAPAR HTML
// =====================================

function escaparHTML(texto) {

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


// =====================================
// GUARDAR MI PERFIL
// =====================================

document
  .getElementById("guardar")
  .addEventListener(
    "click",
    guardarPerfil
  );


async function guardarPerfil() {

  const mensaje =
    document.getElementById("mensaje");


  const nombre =
    document.getElementById("nombre")
      .value
      .trim();


  const edad =
    document.getElementById("edad")
      .value;


  const ciudad =
    document.getElementById("ciudad")
      .value
      .trim();


  const descripcion =
    document.getElementById("descripcion")
      .value
      .trim();


  const fotoURL =
    document.getElementById("foto_url")
      .value
      .trim();


  const intereses =
    document.getElementById("intereses")
      .value
      .trim();


  if (!nombre) {

    mensaje.textContent =
      "⚠️ Escribí tu nombre.";

    return;
  }


  if (!edad) {

    mensaje.textContent =
      "⚠️ Escribí tu edad.";

    return;
  }


  const edadNumero =
    parseInt(edad, 10);


  if (
    isNaN(edadNumero) ||
    edadNumero < 18 ||
    edadNumero > 100
  ) {

    mensaje.textContent =
      "⚠️ La edad debe estar entre 18 y 100 años.";

    return;
  }


  if (!ciudad) {

    mensaje.textContent =
      "⚠️ Escribí tu ciudad.";

    return;
  }


  mensaje.textContent =
    "Guardando...";


  try {

    const {
      error
    } = await supabaseClient
      .from("profiles")
      .upsert(
        {
          id: usuarioActual.id,
          nombre: nombre,
          edad: edadNumero,
          ciudad: ciudad,
          "descripción": descripcion,
          foto_url: fotoURL || null,
          intereses: intereses || null
        },
        {
          onConflict: "id"
        }
      );


    if (error) {

      console.error(error);

      mensaje.textContent =
        "❌ Error: " +
        error.message;

      return;
    }


    actualizarMiFoto(fotoURL);

    mensaje.textContent =
      "✅ Perfil guardado correctamente.";


    await cargarPersonas();

  } catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error inesperado: " +
      error.message;
  }
}


// =====================================
// CARGAR OTROS PERFILES
// =====================================

async function cargarPersonas() {

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select(
      'id,nombre,edad,ciudad,"descripción",foto_url,intereses'
    )
    .neq(
      "id",
      usuarioActual.id
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);

    document.getElementById("personaNombre")
      .textContent =
      "❌ Error al cargar personas.";

    document.getElementById("mensajeSwipe")
      .textContent =
      error.message;

    return;
  }


  perfilesDisponibles =
    data || [];

  perfilActual = 0;


  mostrarPersona();
}


// =====================================
// MOSTRAR PERSONA
// =====================================

function mostrarPersona() {

  const nombre =
    document.getElementById("personaNombre");

  const edad =
    document.getElementById("personaEdad");

  const ciudad =
    document.getElementById("personaCiudad");

  const descripcion =
    document.getElementById("personaDescripcion");

  const intereses =
    document.getElementById("personaIntereses");

  const foto =
    document.getElementById("personaFoto");

  const botonLike =
    document.getElementById("like");

  const botonPasar =
    document.getElementById("pasar");


  if (
    !perfilesDisponibles.length ||
    perfilActual >= perfilesDisponibles.length
  ) {

    nombre.textContent =
      "💕 No hay más perfiles por ahora.";

    edad.textContent = "";

    ciudad.textContent = "";

    descripcion.textContent = "";

    intereses.textContent = "";

    foto.innerHTML =
      '<div class="persona-foto-placeholder">👤</div>';

    botonLike.style.display =
      "none";

    botonPasar.style.display =
      "none";

    return;
  }


  botonLike.style.display =
    "block";

  botonPasar.style.display =
    "block";


  const persona =
    perfilesDisponibles[perfilActual];


  nombre.textContent =
    persona.nombre ||
    "Sin nombre";


  edad.textContent =
    persona.edad
      ? "🎂 " + persona.edad + " años"
      : "";


  ciudad.textContent =
    persona.ciudad
      ? "📍 " + persona.ciudad
      : "";


  intereses.textContent =
    persona.intereses
      ? "❤️ " + persona.intereses
      : "";


  descripcion.textContent =
    persona["descripción"] || "";


  if (persona.foto_url) {

    foto.innerHTML =
      '<img src="' +
      escaparHTML(persona.foto_url) +
      '" alt="Foto de perfil" onerror="this.parentElement.innerHTML=\'<div class=&quot;persona-foto-placeholder&quot;>👤</div>\'">';

  } else {

    foto.innerHTML =
      '<div class="persona-foto-placeholder">👤</div>';
  }
}


// =====================================
// REGISTRAR LIKE / PASS
// =====================================

async function registrarSwipe(accion) {

  if (
    !usuarioActual ||
    perfilActual >= perfilesDisponibles.length
  ) {

    return;
  }


  const persona =
    perfilesDisponibles[perfilActual];


  const mensaje =
    document.getElementById("mensajeSwipe");


  const botonLike =
    document.getElementById("like");

  const botonPasar =
    document.getElementById("pasar");


  mensaje.textContent =
    "Guardando...";


  botonLike.disabled = true;

  botonPasar.disabled = true;


  try {

    const {
      error
    } = await supabaseClient
      .from("swipes")
      .insert(
        {
          user_id: usuarioActual.id,
          target_user_id: persona.id,
          action: accion
        }
      );


    if (error) {

      console.error(error);

      mensaje.textContent =
        "❌ Error: " +
        error.message;

      botonLike.disabled = false;

      botonPasar.disabled = false;

      return;
    }


    if (accion === "like") {

      mensaje.textContent =
        "❤️ ¡Like enviado!";

      /*
       * Comprobamos si existe un Like
       * de la otra persona.
       *
       * Esto funcionará cuando la tabla
       * swipes permita SELECT para usuarios
       * autenticados.
       */

      const {
        data: matchData,
        error: matchError
      } = await supabaseClient
        .from("swipes")
        .select("id")
        .eq("user_id", persona.id)
        .eq("target_user_id", usuarioActual.id)
        .eq("action", "like")
        .maybeSingle();


      if (!matchError && matchData) {

        document.getElementById("match")
          .style.display =
          "block";

        mensaje.textContent =
          "💕 ¡Es un Match!";

      }

    } else {

      mensaje.textContent =
        "❌ Perfil pasado.";
    }


    perfilActual++;


    setTimeout(() => {

      mensaje.textContent = "";

      botonLike.disabled = false;

      botonPasar.disabled = false;

      mostrarPersona();

    }, 900);


  } catch (error) {

    console.error(error);

    mensaje.textContent =
      "❌ Error inesperado: " +
      error.message;

    botonLike.disabled = false;

    botonPasar.disabled = false;
  }
}


// =====================================
// BOTÓN LIKE
// =====================================

document
  .getElementById("like")
  .addEventListener(
    "click",
    () => {

      registrarSwipe("like");

    }
  );


// =====================================
// BOTÓN PASAR
// =====================================

document
  .getElementById("pasar")
  .addEventListener(
    "click",
    () => {

      registrarSwipe("pass");

    }
  );


// =====================================
// CERRAR SESIÓN
// =====================================

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient
        .auth
        .signOut();

      window.location.href =
        "index.html";

    }
  );


// =====================================
// INICIAR
// =====================================

verificarSesion();

</script>

</body>
</html>
