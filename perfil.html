<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EmiMatch - Mi Perfil</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          135deg,
          #f5f7ff,
          #ffffff
        );
      color: #222;
    }

    .header {
      background: #111b3a;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: .85;
    }

    .container {
      width: 94%;
      max-width: 700px;
      margin: 25px auto 40px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;

      box-shadow:
        0 6px 25px
        rgba(0, 0, 0, .08);
    }

    .profile-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-title h2 {
      margin: 0 0 6px;
      color: #111b3a;
    }

    .profile-title p {
      margin: 0;
      color: #777;
    }

    /* FOTO */

    .photo-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .photo-label {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #111b3a;
    }

    .photo-preview {
      width: 150px;
      height: 150px;
      margin: 0 auto 15px;

      border-radius: 50%;
      overflow: hidden;

      border: 5px solid #111b3a;

      background: #eef0f6;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-button {
      display: inline-block;

      background: #111b3a;
      color: white;

      padding: 12px 20px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: bold;
    }

    .photo-button:hover {
      opacity: .9;
    }

    #photoInput {
      display: none;
    }

    /* FORMULARIO */

    label {
      display: block;

      font-weight: bold;

      margin-top: 16px;
      margin-bottom: 7px;

      color: #333;
    }

    input,
    textarea {
      width: 100%;

      padding: 13px;

      border: 1px solid #ddd;

      border-radius: 10px;

      font-size: 15px;

      outline: none;

      background: #fafafa;
    }

    input:focus,
    textarea:focus {
      border-color: #111b3a;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .intereses-help {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    /* BOTONES */

    .btn {
      display: block;

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 11px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      text-decoration: none;

      text-align: center;

      margin-top: 15px;
    }

    .btn-save {
      background: #111b3a;
      color: white;
    }

    .btn-save:hover {
      opacity: .9;
    }

    .btn-matches {
      background: #d4af37;
      color: #111;
    }

    .btn-matches:hover {
      opacity: .9;
    }

    .btn-discover {
      background: #eee;
      color: #111b3a;
    }

    .message {
      display: none;

      padding: 13px;

      border-radius: 10px;

      margin-top: 15px;

      text-align: center;

      font-weight: bold;
    }

    .success {
      display: block;

      background: #e5f8eb;

      color: #176b32;
    }

    .error {
      display: block;

      background: #ffe8e8;

      color: #a00000;
    }

    /* DESCUBRIR */

    #discoverSection {
      display: none;
    }

    .person-card {
      text-align: center;
    }

    .person-card img {
      width: 160px;
      height: 160px;

      object-fit: cover;

      border-radius: 50%;

      border: 5px solid #111b3a;

      margin-bottom: 10px;
    }

    .person-card h3 {
      margin: 5px 0;
      color: #111b3a;
    }

    .person-card p {
      color: #666;
    }

    .discover-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .like-btn,
    .skip-btn {
      flex: 1;

      padding: 14px;

      border: none;

      border-radius: 10px;

      font-size: 18px;

      cursor: pointer;
    }

    .like-btn {
      background: #d4af37;
      color: #111;
    }

    .skip-btn {
      background: #eee;
      color: #333;
    }

    .match-box {
      display: none;

      background:
        linear-gradient(
          135deg,
          #111b3a,
          #1e2c60
        );

      color: white;

      text-align: center;

      padding: 25px;

      border-radius: 18px;

      margin-top: 20px;
    }

    .match-box h2 {
      margin-top: 0;
    }

  </style>

</head>


<body>

  <div class="header">

    <h1>💕 EmiMatch</h1>

    <p>Conectá con personas compatibles</p>

  </div>


  <div class="container">


    <!-- ============================ -->
    <!-- PERFIL -->
    <!-- ============================ -->

    <div class="card">

      <div class="profile-title">

        <h2>Mi Perfil</h2>

        <p>
          Completá tu información para que otros puedan conocerte.
        </p>

      </div>


      <!-- FOTO -->

      <div class="photo-section">

        <span class="photo-label">
          📷 Foto de perfil
        </span>


        <div class="photo-preview">

          <img
            id="photoPreview"
            src="https://via.placeholder.com/300"
            alt="Foto de perfil"
          >

        </div>


        <label
          for="photoInput"
          class="photo-button"
        >
          📷 Elegir foto
        </label>


        <input
          type="file"
          id="photoInput"
          accept="image/*"
        >

      </div>


      <!-- FORMULARIO -->

      <label for="name">
        👤 Nombre
      </label>

      <input
        type="text"
        id="name"
        placeholder="Tu nombre"
      >


      <label for="age">
        🎂 Edad
      </label>

      <input
        type="number"
        id="age"
        placeholder="Tu edad"
        min="18"
        max="100"
      >


      <label for="city">
        📍 Ciudad
      </label>

      <input
        type="text"
        id="city"
        placeholder="Tu ciudad"
      >


      <label for="description">
        📝 Sobre mí
      </label>

      <textarea
        id="description"
        placeholder="Contanos un poco sobre vos..."
      ></textarea>


      <label for="interests">
        ❤️ Intereses
      </label>

      <input
        type="text"
        id="interests"
        placeholder="Música, fútbol, viajes..."
      >

      <div class="intereses-help">
        Separá tus intereses con comas.
      </div>


      <button
        id="saveButton"
        class="btn btn-save"
      >
        💾 Guardar perfil
      </button>


      <div
        id="message"
        class="message"
      ></div>


      <!-- MATCHES -->

      <a
        href="chat.html"
        class="btn btn-matches"
      >
        💕 Ver mis Matches
      </a>


      <!-- DESCUBRIR -->

      <button
        id="discoverButton"
        class="btn btn-discover"
      >
        🔎 Descubrir personas
      </button>

    </div>


    <!-- ============================ -->
    <!-- DESCUBRIR -->
    <!-- ============================ -->

    <div
      id="discoverSection"
      class="card"
    >

      <h2 style="text-align:center;">
        🔎 Descubrir
      </h2>


      <div
        id="personCard"
        class="person-card"
      >

        <div class="loading">
          Cargando...
        </div>

      </div>


      <div
        id="matchBox"
        class="match-box"
      >

        <h2>
          🎉 ¡Hicieron Match!
        </h2>

        <p>
          Ahora pueden comenzar a conversar.
        </p>

        <a
          id="chatButton"
          href="#"
          class="btn"
          style="
            background:white;
            color:#111b3a;
          "
        >
          💬 Comenzar Chat
        </a>

      </div>

    </div>

  </div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://kngiadwaesdbmvwivdev.supabase.co";


  const SUPABASE_ANON_KEY =
    "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  let currentUser = null;

  let perfiles = [];

  let indiceActual = 0;

  let personaActual = null;

  let selectedPhoto = null;


  // ==========================================
  // INICIO
  // ==========================================

  document.addEventListener(
    "DOMContentLoaded",
    iniciar
  );


  async function iniciar() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      window.location.href =
        "index.html";

      return;

    }


    currentUser =
      session.user;


    await cargarPerfil();

  }


  // ==========================================
  // CARGAR PERFIL
  // ==========================================

  async function cargarPerfil() {

    const {
      data: profile,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if (error) {

      console.error(error);

      mostrarMensaje(
        "No se pudo cargar tu perfil.",
        "error"
      );

      return;

    }


    if (!profile) {

      return;

    }


    document.getElementById(
      "name"
    ).value =
      profile.Nombre || "";


    document.getElementById(
      "age"
    ).value =
      profile.Edad || "";


    document.getElementById(
      "city"
    ).value =
      profile.Ciudad || "";


    document.getElementById(
      "description"
    ).value =
      profile.Descripción || "";


    document.getElementById(
      "interests"
    ).value =
      profile.Intereses || "";


    if (profile.Foto_url) {

      document.getElementById(
        "photoPreview"
      ).src =
        profile.Foto_url;

    }

  }


  // ==========================================
  // FOTO
  // ==========================================

  document.getElementById(
    "photoInput"
  ).addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];


      if (!file) {

        return;

      }


      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        alert(
          "Seleccioná una imagen."
        );

        return;

      }


      selectedPhoto =
        file;


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          document.getElementById(
            "photoPreview"
          ).src =
            e.target.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );


  // ==========================================
  // GUARDAR PERFIL
  // ==========================================

  document.getElementById(
    "saveButton"
  ).addEventListener(
    "click",
    guardarPerfil
  );


  async function guardarPerfil() {

    const nombre =
      document.getElementById(
        "name"
      ).value.trim();


    const edad =
      document.getElementById(
        "age"
      ).value;


    const ciudad =
      document.getElementById(
        "city"
      ).value.trim();


    const descripcion =
      document.getElementById(
        "description"
      ).value.trim();


    const intereses =
      document.getElementById(
        "interests"
      ).value.trim();


    if (!nombre) {

      mostrarMensaje(
        "Ingresá tu nombre.",
        "error"
      );

      return;

    }


    if (!edad) {

      mostrarMensaje(
        "Ingresá tu edad.",
        "error"
      );

      return;

    }


    let fotoUrl =
      document.getElementById(
        "photoPreview"
      ).src;


    /*
      Por ahora la foto seleccionada
      se guarda como Data URL.

      Más adelante configuraremos
      Supabase Storage para que quede
      guardada permanentemente.
    */

    if (selectedPhoto) {

      fotoUrl =
        await convertirImagen(
          selectedPhoto
        );

    }


    const datos = {

      id:
        currentUser.id,

      Nombre:
        nombre,

      Edad:
        parseInt(edad),

      Ciudad:
        ciudad,

      Descripción:
        descripcion,

      Foto_url:
        fotoUrl,

      Intereses:
        intereses

    };


    const {
      error
    } =
      await supabaseClient
        .from("profiles")
        .upsert(
          datos
        );


    if (error) {

      console.error(error);

      mostrarMensaje(
        "Error al guardar: " +
        error.message,
        "error"
      );

      return;

    }


    mostrarMensaje(
      "✅ Perfil guardado correctamente.",
      "success"
    );


    selectedPhoto = null;

  }


  // ==========================================
  // CONVERTIR FOTO
  // ==========================================

  function convertirImagen(
    file
  ) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();


        reader.onload =
          function() {

            resolve(
              reader.result
            );

          };


        reader.onerror =
          reject;


        reader.readAsDataURL(
          file
        );

      }
    );

  }


  // ==========================================
  // DESCUBRIR
  // ==========================================

  document.getElementById(
    "discoverButton"
  ).addEventListener(
    "click",
    iniciarDescubrimiento
  );


  async function iniciarDescubrimiento() {

    document.getElementById(
      "discoverSection"
    ).style.display =
      "block";


    await cargarPersonas();


    document.getElementById(
      "discoverSection"
    ).scrollIntoView({
      behavior: "smooth"
    });

  }


  async function cargarPersonas() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .neq(
          "id",
          currentUser.id
        );


    if (error) {

      console.error(error);

      document.getElementById(
        "personCard"
      ).innerHTML =
        '<div class="error">No se pudieron cargar personas.</div>';

      return;

    }


    perfiles =
      data || [];


    indiceActual = 0;


    await mostrarSiguientePersona();

  }


  // ==========================================
  // MOSTRAR PERSONA
  // ==========================================

  async function mostrarSiguientePersona() {

    const card =
      document.getElementById(
        "personCard"
      );


    document.getElementById(
      "matchBox"
    ).style.display =
      "none";


    if (
      indiceActual >=
      perfiles.length
    ) {

      card.innerHTML =
        '<div class="empty">💕 No hay más personas para mostrar por ahora.</div>';

      return;

    }


    personaActual =
      perfiles[
        indiceActual
      ];


    const foto =
      personaActual.Foto_url ||
      "https://via.placeholder.com/300";


    card.innerHTML = `

      <img
        src="${escapeHtml(foto)}"
        alt="Foto"
      >

      <h3>
        ${escapeHtml(
          personaActual.Nombre ||
          "Usuario"
        )}
        ${
          personaActual.Edad
            ? ", " +
              personaActual.Edad
            : ""
        }
      </h3>

      <p>
        📍
        ${escapeHtml(
          personaActual.Ciudad ||
          "Sin ciudad"
        )}
      </p>

      <p>
        ${escapeHtml(
          personaActual.Descripción ||
          ""
        )}
      </p>

      <p>
        ❤️
        ${escapeHtml(
          personaActual.Intereses ||
          ""
        )}
      </p>

      <div class="discover-buttons">

        <button
          class="skip-btn"
          onclick="registrarSwipe(false)"
        >
          ❌ Pasar
        </button>

        <button
          class="like-btn"
          onclick="registrarSwipe(true)"
        >
          ❤️ Me gusta
        </button>

      </div>

    `;

  }


  // ==========================================
  // SWIPE
  // ==========================================

  async function registrarSwipe(
    liked
  ) {

    if (!personaActual) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("swipes")
        .insert({

          swiper_id:
            currentUser.id,

          swiped_id:
            personaActual.id,

          liked:
            liked

        });


    if (error) {

      console.error(error);

      mostrarMensaje(
        "No se pudo registrar la acción: " +
        error.message,
        "error"
      );

      return;

    }


    if (liked) {

      await comprobarMatch();

    }


    indiceActual++;

    await mostrarSiguientePersona();

  }


  // ==========================================
  // COMPROBAR MATCH
  // ==========================================

  async function comprobarMatch() {

    const {
      data: swipe
    } =
      await supabaseClient
        .from("swipes")
        .select("*")
        .eq(
          "swiper_id",
          personaActual.id
        )
        .eq(
          "swiped_id",
          currentUser.id
        )
        .eq(
          "liked",
          true
        )
        .maybeSingle();


    if (!swipe) {

      return;

    }


    const user1 =
      currentUser.id <
      personaActual.id
        ? currentUser.id
        : personaActual.id;


    const user2 =
      currentUser.id <
      personaActual.id
        ? personaActual.id
        : currentUser.id;


    const {
      data: matchExistente
    } =
      await supabaseClient
        .from("matches")
        .select("id")
        .eq(
          "user1_id",
          user1
        )
        .eq(
          "user2_id",
          user2
        )
        .maybeSingle();


    let match =
      matchExistente;


    if (!match) {

      const {
        data: nuevoMatch,
        error
      } =
        await supabaseClient
          .from("matches")
          .insert({

            user1_id:
              user1,

            user2_id:
              user2

          })
          .select()
          .single();


      if (error) {

        console.error(error);

        return;

      }


      match =
        nuevoMatch;

    }


    if (match) {

      const matchBox =
        document.getElementById(
          "matchBox"
        );


      matchBox.style.display =
        "block";


      document.getElementById(
        "chatButton"
      ).href =
        "chat.html?user=" +
        encodeURIComponent(
          personaActual.id
        );

    }

  }


  // ==========================================
  // MENSAJES
  // ==========================================

  function mostrarMensaje(
    texto,
    tipo
  ) {

    const box =
      document.getElementById(
        "message"
      );


    box.textContent =
      texto;


    box.className =
      "message " +
      tipo;


    setTimeout(
      function() {

        box.style.display =
          "none";

      },
      4000
    );

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(
    texto
  ) {

    if (
      texto === null ||
      texto === undefined
    ) {

      return "";

    }


    return String(texto)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
