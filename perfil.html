<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi perfil - EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a3d, #0d2f68);
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: #06142f;
      padding: 18px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #ffd700;
      box-shadow: 0 2px 10px rgba(0,0,0,.3);
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: rgba(255,255,255,.97);
      color: #222;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    h2 {
      text-align: center;
      color: #0b2b61;
      margin-top: 0;
    }

    .photo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    #previewFoto {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ffd700;
      background: #eee;
      display: block;
      margin: 0 auto 15px;
    }

    .photo-button {
      display: inline-block;
      background: #0b2b61;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .photo-button:hover {
      background: #174a96;
    }

    #photoInput {
      display: none;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
      color: #0b2b61;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 14px;
      margin-top: 20px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .guardar {
      background: #ffd700;
      color: #071a3d;
    }

    .matches {
      background: #e91e63;
      color: white;
    }

    .descubrir {
      background: #0b2b61;
      color: white;
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .persona {
      margin-top: 25px;
      background: #f5f5f5;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      display: none;
    }

    .persona img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffd700;
    }

    .acciones {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .accion {
      flex: 1;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
    }

    .pasar {
      background: #ddd;
    }

    .like {
      background: #e91e63;
      color: white;
    }

    #matchBox {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, #e91e63, #ff4f81);
      color: white;
      text-align: center;
    }

    #matchBox button {
      background: white;
      color: #e91e63;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>💕 EmiMatch</header>

<div class="container">

  <div class="card">

    <h2>Mi perfil</h2>

    <div class="photo-container">

      <img
        id="previewFoto"
        src="https://via.placeholder.com/150?text=Foto"
        alt="Foto de perfil"
      >

      <label for="photoInput" class
