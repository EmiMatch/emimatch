name: EmiMatch Lab - APK experimental

on:
  push:
    branches: [lab-desarrollo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lab-apk:
    name: Compilar APK de demo aislada
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar rama experimental
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK requerido
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar únicamente la demo local aislada
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          # No copiar páginas ni configuración de producción: Lab usa solo datos ficticios.
          cp lab/index.html www/index.html
          test -s www/index.html

      - name: Validar JavaScript y aislamiento de la demo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("lab/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Se esperaba un único script local; encontrados: {len(scripts)}")
          Path("/tmp/emimatch-lab.js").write_text(scripts[0], encoding="utf-8")
          lowered = html.lower()
          for forbidden in ("supabase", "mercadopago", "fetch("):
              if forbidden in lowered:
                  raise SystemExit(f"La demo no debe conectarse a servicios reales: {forbidden}")
          for required in ("incomingRequests", "data-accept-friend", "data-reject-friend", "data-remove-friend"):
              if required not in html:
                  raise SystemExit(f"Falta una función de Social esperada: {required}")
          PY
          node --check /tmp/emimatch-lab.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Verificar identidad independiente
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId "com.emimatch.lab"' android/app/build.gradle
          grep -q '"appId": "com.emimatch.lab"' capacitor.config.json
          grep -q '"appName": "EmiMatch Lab"' capacitor.config.json
          test -s android/app/src/main/AndroidManifest.xml

      - name: Compilar APK experimental
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK Lab como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: EmiMatch-Lab-APK-Demo
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
