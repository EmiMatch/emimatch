name: EmiMatch Lab - APK experimental

on:
  push:
    branches: [lab-desarrollo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lab-apk:
    name: Compilar APK de demo aislada
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar rama experimental
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK requerido
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar únicamente la demo local aislada
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          # No copiar páginas ni configuración de producción: Lab usa solo datos ficticios.
          cp lab/index.html www/index.html
          test -s www/index.html

      - name: Validar JavaScript y aislamiento de la demo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("lab/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if len(scripts) < 1:
              raise SystemExit("No se encontró JavaScript local para validar")
          Path("/tmp/emimatch-lab.js").write_text("\n".join(scripts), encoding="utf-8")
          lowered = html.lower()
          for forbidden in ("supabase.co", "mercadopago.com", "api.mercadopago"):
              if forbidden in lowered:
                  raise SystemExit(f"La demo no debe conectarse a servicios reales: {forbidden}")
          if html.count("fetch(") < 1 or "https://raw.githubusercontent.com/EmiMatch/emimatch/lab-desarrollo/lab/index.html" not in html or "https://api.github.com/repos/EmiMatch/emimatch/contents/lab/index.html" not in html:
              raise SystemExit("La actualización remota debe usar únicamente el HTML de la rama Lab autorizada")
          for required in ("incomingRequests", "data-accept-friend", "data-reject-friend", "data-remove-friend", "data-check-update"):
              if required not in html:
                  raise SystemExit(f"Falta una función de Social esperada: {required}")
          PY
          node --check /tmp/emimatch-lab.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Verificar identidad independiente
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId "com.emimatch.lab"' android/app/build.gradle
          grep -q '"appId": "com.emimatch.lab"' capacitor.config.json
          grep -q '"appName": "EmiMatch Lab"' capacitor.config.json
          test -s android/app/src/main/AndroidManifest.xml

      - name: Compilar APK experimental
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar firma persistente para actualizaciones de EmiMatch Lab
        id: lab-signing
        shell: bash
        env:
          EMIMATCH_KEYSTORE_BASE64: ${{ secrets.EMIMATCH_KEYSTORE_BASE64 }}
          EMIMATCH_KEYSTORE_PASSWORD: ${{ secrets.EMIMATCH_KEYSTORE_PASSWORD }}
          EMIMATCH_KEY_ALIAS_OVERRIDE: ${{ secrets.EMIMATCH_KEY_ALIAS }}
          EMIMATCH_KEY_PASSWORD_SECRET: ${{ secrets.EMIMATCH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "release_ready=false" >> "$GITHUB_OUTPUT"
          if [[ -z "${EMIMATCH_KEYSTORE_BASE64:-}" || -z "${EMIMATCH_KEYSTORE_PASSWORD:-}" ]]; then
            echo "No se configuró la firma persistente; se conserva el APK debug de diagnóstico."
            exit 0
          fi
          printf '%s' "$EMIMATCH_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/emimatch-lab-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/emimatch-lab-release.jks" -storepass "$EMIMATCH_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/lab-keytool-list.txt"
          if [[ -n "${EMIMATCH_KEY_ALIAS_OVERRIDE:-}" ]]; then
            KEY_ALIAS="$EMIMATCH_KEY_ALIAS_OVERRIDE"
          else
            mapfile -t KEY_ALIASES < <(awk -F': ' '/^Alias name: / { alias=$2 } /^Entry type: PrivateKeyEntry/ { if (alias != "") print alias; alias="" }' "$RUNNER_TEMP/lab-keytool-list.txt")
            if [[ "${#KEY_ALIASES[@]}" -ne 1 ]]; then
              echo "::error::No se pudo elegir un único alias para firmar EmiMatch Lab."
              exit 1
            fi
            KEY_ALIAS="${KEY_ALIASES[0]}"
          fi
          keytool -list -keystore "$RUNNER_TEMP/emimatch-lab-release.jks" -storepass "$EMIMATCH_KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "release_ready=true" >> "$GITHUB_OUTPUT"
          echo "EMIMATCH_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Compilar APK Lab firmado para futuras actualizaciones
        if: ${{ steps.lab-signing.outputs.release_ready == 'true' }}
        shell: bash
        env:
          EMIMATCH_KEYSTORE_PATH: ${{ runner.temp }}/emimatch-lab-release.jks
          EMIMATCH_KEYSTORE_PASSWORD: ${{ secrets.EMIMATCH_KEYSTORE_PASSWORD }}
          EMIMATCH_KEY_ALIAS: ${{ steps.lab-signing.outputs.EMIMATCH_KEY_ALIAS }}
          EMIMATCH_KEY_PASSWORD_SECRET: ${{ secrets.EMIMATCH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export EMIMATCH_KEY_PASSWORD="${EMIMATCH_KEY_PASSWORD_SECRET:-$EMIMATCH_KEYSTORE_PASSWORD}"
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK Lab firmado
        if: ${{ steps.lab-signing.outputs.release_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: EmiMatch-Lab-APK-Actualizable
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK Lab debug de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: EmiMatch-Lab-APK-Demo
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
