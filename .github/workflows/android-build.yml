name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar EmiMatch APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar SDK Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Verificar proyecto EmiMatch
        run: |
          echo "=== Archivos principales ==="
          ls -la
          echo "=== Android ==="
          ls -la android
          echo "=== Web ==="
          ls -la www
          test -f package.json
          test -f package-lock.json
          test -f capacitor.config.json
          test -f android/gradlew
          test -d www
          echo "Proyecto EmiMatch encontrado correctamente."

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar Gradle
        run: chmod +x android/gradlew

      - name: Compilar EmiMatch APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK generado correctamente:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: EmiMatch-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
