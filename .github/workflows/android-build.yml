name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar EmiMatch APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Descargar el repositorio
      # ---------------------------------------------------------
      - name: Descargar código
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node.js
      # ---------------------------------------------------------
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ---------------------------------------------------------
      # 3. Java
      # ---------------------------------------------------------
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ---------------------------------------------------------
      # 4. Android SDK
      # ---------------------------------------------------------
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # ---------------------------------------------------------
      # 5. Instalar dependencias
      # ---------------------------------------------------------
      - name: Instalar dependencias Node
        run: npm ci

      # ---------------------------------------------------------
      # 6. Comprobar Capacitor
      # ---------------------------------------------------------
      - name: Comprobar Capacitor
        run: |
          npx cap --version
          node --version
          npm --version
          java -version

      # ---------------------------------------------------------
      # 7. Crear configuración de Capacitor si no existe
      # ---------------------------------------------------------
      - name: Preparar configuración de Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.emimatch.app",
            "appName": "EmiMatch",
            "webDir": "www"
          }
          EOF
          fi

          echo "Configuración actual:"
          cat capacitor.config.json

      # ---------------------------------------------------------
      # 8. Crear carpeta web de EmiMatch
      # ---------------------------------------------------------
      - name: Preparar archivos web
        run: |
          rm -rf www
          mkdir -p www

          find . -maxdepth 1 -type f -name "*.html" -exec cp {} www/ \;

          if [ -d assets ]; then
            cp -r assets www/
          fi

          if [ -f favicon.svg ]; then
            cp favicon.svg www/
          fi

          if [ -f robots.txt ]; then
            cp robots.txt www/
          fi

          if [ -f sitemap.xml ]; then
            cp sitemap.xml www/
          fi

          echo "Contenido de www:"
          find www -maxdepth 2 -type f | sort

          test -f www/index.html

      # ---------------------------------------------------------
      # 9. Crear Android si todavía no existe
      # ---------------------------------------------------------
      - name: Preparar plataforma Android
        run: |
          if [ ! -d android ]; then
            echo "La carpeta android no existe."
            echo "Creando plataforma Android con Capacitor..."
            npx cap add android
          else
            echo "La carpeta android ya existe."
          fi

      # ---------------------------------------------------------
      # 10. Sincronizar Capacitor
      # ---------------------------------------------------------
      - name: Sincronizar EmiMatch con Android
        run: npx cap sync android

      # ---------------------------------------------------------
      # 11. Preparar Gradle
      # ---------------------------------------------------------
      - name: Preparar Gradle
        run: |
          chmod +x android/gradlew
          test -f android/gradlew

      # ---------------------------------------------------------
      # 12. Compilar APK
      # ---------------------------------------------------------
      - name: Compilar EmiMatch APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ---------------------------------------------------------
      # 13. Comprobar APK
      # ---------------------------------------------------------
      - name: Verificar APK generado
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontró el APK."
            echo "Contenido de build:"
            find android/app/build -type f | sort | tail -100 || true
            exit 1
          fi

          echo "======================================"
          echo "      EMI MATCH APK GENERADO"
          echo "======================================"
          ls -lh "$APK"
          file "$APK"

      # ---------------------------------------------------------
      # 14. Subir APK
      # ---------------------------------------------------------
      - name: Subir APK de EmiMatch
        uses: actions/upload-artifact@v4
        with:
          name: EmiMatch-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
