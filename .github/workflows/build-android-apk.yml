name: EmiMatch - APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Auditar y compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar paquetes Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar auditoría del proyecto
        run: npm test

      - name: Preparar archivos web actuales para Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          cp -a ./*.html www/
          cp -a assets www/
          for item in images img icons fonts manifest.json manifest.webmanifest service-worker.js sw.js favicon.ico; do
            if [ -e "$item" ]; then
              cp -a "$item" www/
            fi
          done
          test -s www/index.html
          test -s www/assets/js/app.js
          test -s www/assets/js/components.js
          test -s www/assets/js/config.js

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Verificar configuración Android
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId "com.emimatch.app"' android/app/build.gradle
          grep -q 'versionCode 2' android/app/build.gradle
          grep -q 'versionName "1.1.0"' android/app/build.gradle
          test -s android/app/src/main/AndroidManifest.xml

      - name: Preparar firma privada de publicación si está configurada
        id: prepare-signing
        shell: bash
        env:
          EMIMATCH_KEYSTORE_BASE64: ${{ secrets.EMIMATCH_KEYSTORE_BASE64 }}
          EMIMATCH_KEYSTORE_PASSWORD: ${{ secrets.EMIMATCH_KEYSTORE_PASSWORD }}
          EMIMATCH_KEY_ALIAS_OVERRIDE: ${{ secrets.EMIMATCH_KEY_ALIAS }}
          EMIMATCH_KEY_PASSWORD_SECRET: ${{ secrets.EMIMATCH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "release_ready=false" >> "$GITHUB_OUTPUT"
          if [[ -z "${EMIMATCH_KEYSTORE_BASE64:-}" || -z "${EMIMATCH_KEYSTORE_PASSWORD:-}" ]]; then
            echo "No se configuró la clave privada completa; se generará el APK debug."
            exit 0
          fi

          if ! printf '%s' "$EMIMATCH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/emimatch-release.jks" 2>/dev/null || ! test -s "$RUNNER_TEMP/emimatch-release.jks"; then
            echo "::error::EMIMATCH_KEYSTORE_BASE64 no se pudo decodificar. Volvé a guardar el Base64 del archivo .jks completo."
            exit 0
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/emimatch-release.jks" -storepass "$EMIMATCH_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::El archivo .jks se decodificó, pero la contraseña EMIMATCH_KEYSTORE_PASSWORD no permite abrirlo. Revisá ese secreto; no compartas la contraseña en el chat."
            exit 0
          fi

          if [[ -n "${EMIMATCH_KEY_ALIAS_OVERRIDE:-}" ]]; then
            KEY_ALIAS="$EMIMATCH_KEY_ALIAS_OVERRIDE"
          else
            # Detecta automáticamente el alias si el almacén contiene una sola clave privada.
            keytool -list -v -keystore "$RUNNER_TEMP/emimatch-release.jks" -storepass "$EMIMATCH_KEYSTORE_PASSWORD" 2>/dev/null > "$RUNNER_TEMP/emimatch-keytool-list.txt"
            mapfile -t KEY_ALIASES < <(awk -F': ' '/^Alias name: / { alias=$2 } /^Entry type: PrivateKeyEntry/ { if (alias != "") print alias; alias="" }' "$RUNNER_TEMP/emimatch-keytool-list.txt")
            if [[ "${#KEY_ALIASES[@]}" -ne 1 ]]; then
              echo "::error::El almacén se abre correctamente, pero no se pudo elegir un único alias de clave privada. Agregá el secreto EMIMATCH_KEY_ALIAS con el alias correcto."
              exit 0
            fi
            KEY_ALIAS="${KEY_ALIASES[0]}"
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/emimatch-release.jks" -storepass "$EMIMATCH_KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::La contraseña del almacén es correcta, pero el alias configurado no existe. Revisá EMIMATCH_KEY_ALIAS."
            exit 0
          fi

          KEY_PASSWORD="${EMIMATCH_KEY_PASSWORD_SECRET:-$EMIMATCH_KEYSTORE_PASSWORD}"
          echo "release_ready=true" >> "$GITHUB_OUTPUT"
          echo "EMIMATCH_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "La contraseña del almacén y el alias fueron validados. Se intentará compilar el APK release firmado."

      - name: Compilar APK Android
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleDebug

      - name: Compilar APK release firmado
        if: ${{ steps.prepare-signing.outputs.release_ready == 'true' }}
        env:
          EMIMATCH_KEYSTORE_PATH: ${{ runner.temp }}/emimatch-release.jks
          EMIMATCH_KEYSTORE_PASSWORD: ${{ secrets.EMIMATCH_KEYSTORE_PASSWORD }}
          EMIMATCH_KEY_ALIAS: ${{ steps.prepare-signing.outputs.EMIMATCH_KEY_ALIAS }}
          EMIMATCH_KEY_PASSWORD_SECRET: ${{ secrets.EMIMATCH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export EMIMATCH_KEY_PASSWORD="${EMIMATCH_KEY_PASSWORD_SECRET:-$EMIMATCH_KEYSTORE_PASSWORD}"
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK Android
        uses: actions/upload-artifact@v4
        with:
          name: EmiMatch-APK-Android-v1.1.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK release firmado
        if: ${{ steps.prepare-signing.outputs.release_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: EmiMatch-APK-Android-v1.1.0-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
