name: EmiMatch - APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Auditar y compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar paquetes Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar auditoría del proyecto
        run: npm test

      - name: Preparar archivos web actuales para Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          cp -a ./*.html www/
          cp -a assets www/
          for item in images img icons fonts manifest.json manifest.webmanifest service-worker.js sw.js favicon.ico; do
            if [ -e "$item" ]; then
              cp -a "$item" www/
            fi
          done
          test -s www/index.html
          test -s www/assets/js/app.js
          test -s www/assets/js/components.js
          test -s www/assets/js/config.js

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Verificar configuración Android
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId "com.emimatch.app"' android/app/build.gradle
          grep -q 'versionCode 2' android/app/build.gradle
          grep -q 'versionName "1.1.0"' android/app/build.gradle
          test -s android/app/src/main/AndroidManifest.xml

      - name: Preparar firma privada de publicación si está configurada
        id: prepare-signing
        shell: bash
        env:
          EMIMATCH_KEYSTORE_BASE64: ${{ secrets.EMIMATCH_KEYSTORE_BASE64 }}
          EMIMATCH_KEYSTORE_PASSWORD: ${{ secrets.EMIMATCH_KEYSTORE_PASSWORD }}
          EMIMATCH_KEY_ALIAS: emimatch
          EMIMATCH_KEY_PASSWORD: ${{ secrets.EMIMATCH_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${EMIMATCH_KEYSTORE_BASE64:-}" && -n "${EMIMATCH_KEYSTORE_PASSWORD:-}" ]]; then
            if printf '%s' "$EMIMATCH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/emimatch-release.jks" 2>/dev/null && test -s "$RUNNER_TEMP/emimatch-release.jks"; then
              if keytool -list -keystore "$RUNNER_TEMP/emimatch-release.jks" -storepass "$EMIMATCH_KEYSTORE_PASSWORD" -alias "$EMIMATCH_KEY_ALIAS" >/dev/null 2>&1; then
                echo "release_ready=true" >> "$GITHUB_OUTPUT"
                echo "Clave privada validada; se generará también el APK release firmado."
              else
                echo "release_ready=false" >> "$GITHUB_OUTPUT"
                echo "::warning::No se pudo validar la clave de publicación (contraseña o alias incorrectos). Se continuará con el APK debug."
              fi
            else
              echo "release_ready=false" >> "$GITHUB_OUTPUT"
              echo "::warning::La clave guardada no es Base64 válido o está incompleta. Se continuará con el APK debug."
            fi
          else
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "No se configuró una clave privada de publicación; se generará el APK debug y se omitirá release."
          fi

      - name: Compilar APK Android
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon clean assembleDebug

      - name: Compilar APK release firmado
        if: ${{ steps.prepare-signing.outputs.release_ready == 'true' }}
        env:
          EMIMATCH_KEYSTORE_PATH: ${{ runner.temp }}/emimatch-release.jks
          EMIMATCH_KEYSTORE_PASSWORD: ${{ secrets.EMIMATCH_KEYSTORE_PASSWORD }}
          EMIMATCH_KEY_ALIAS: emimatch
          EMIMATCH_KEY_PASSWORD: ${{ secrets.EMIMATCH_KEYSTORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK Android
        uses: actions/upload-artifact@v4
        with:
          name: EmiMatch-APK-Android-v1.1.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK release firmado
        if: ${{ steps.prepare-signing.outputs.release_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: EmiMatch-APK-Android-v1.1.0-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
