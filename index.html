<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #102d59);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #d9ad45;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      color: #102d59;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d9ad45;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #102d59;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #07152f;
    }

    .secondary {
      background: #d9ad45;
      color: #07152f;
    }

    .secondary:hover {
      background: #c49b35;
    }

    .forgot {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #102d59;
      text-decoration: none;
      font-weight: bold;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .terms {
      margin-top: 18px;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
      flex-shrink: 0;
    }

    .terms a {
      color: #102d59;
      font-weight: bold;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      display: none;
      font-size: 14px;
    }

    .success {
      background: #e8f7ed;
      color: #176b35;
    }

    .error {
      background: #fdeaea;
      color: #a32121;
    }

    .divider {
      text-align: center;
      margin: 25px 0 10px;
      color: #888;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">💕 EmiMatch</div>

      <div class="subtitle">
        Conocé personas, hacé Match y conectá.
      </div>

      <!-- LOGIN -->

      <div id="loginSection">

        <h2>Iniciar sesión</h2>

        <label for="loginEmail">Email</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="Tu email"
          autocomplete="email"
        >

        <label for="loginPassword">Contraseña</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="Tu contraseña"
          autocomplete="current-password"
        >

        <button id="loginButton">
          Iniciar sesión
        </button>

        <a
          class="forgot"
          href="recuperar.html"
        >
          ¿Olvidaste tu contraseña?
        </a>

        <div class="divider">
          ¿Todavía no tenés una cuenta?
        </div>

        <button
          id="showRegisterButton"
          class="secondary"
        >
          Crear cuenta
        </button>

      </div>

      <!-- REGISTRO -->

      <div id="registerSection" class="hidden">

        <h2>Crear cuenta</h2>

        <label for="registerEmail">Email</label>
        <input
          type="email"
          id="registerEmail"
          placeholder="Tu email"
          autocomplete="email"
        >

        <label for="registerPassword">Contraseña</label>
        <input
          type="password"
          id="registerPassword"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
        >

        <label for="registerPassword2">Confirmar contraseña</label>
        <input
          type="password"
          id="registerPassword2"
          placeholder="Repetí tu contraseña"
          autocomplete="new-password"
        >

        <label class="terms">

          <input
            type="checkbox"
            id="acceptTerms"
          >

          <span>
            Acepto los
            <a
              href="terminos.html"
              target="_blank"
            >
              Términos y Condiciones
            </a>
            y la
            <a
              href="privacidad.html"
              target="_blank"
            >
              Política de Privacidad
            </a>
            de EmiMatch.
          </span>

        </label>

        <button id="registerButton">
          Crear cuenta
        </button>

        <button
          id="backLoginButton"
          class="secondary"
        >
          Ya tengo una cuenta
        </button>

      </div>

      <div
        id="message"
        class="message"
      ></div>

    </div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://kngiadwaesdbmvwivdev.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const loginSection =
      document.getElementById("loginSection");

    const registerSection =
      document.getElementById("registerSection");

    const message =
      document.getElementById("message");

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";
    }

    function clearMessage() {

      message.textContent = "";

      message.className =
        "message";

      message.style.display = "none";
    }

    document
      .getElementById("showRegisterButton")
      .addEventListener("click", () => {

        clearMessage();

        loginSection.classList.add("hidden");

        registerSection.classList.remove("hidden");

      });

    document
      .getElementById("backLoginButton")
      .addEventListener("click", () => {

        clearMessage();

        registerSection.classList.add("hidden");

        loginSection.classList.remove("hidden");

      });

    // =========================
    // LOGIN
    // =========================

    document
      .getElementById("loginButton")
      .addEventListener("click", async () => {

        clearMessage();

        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("loginPassword")
            .value;

        if (!email || !password) {

          showMessage(
            "Completá email y contraseña.",
            "error"
          );

          return;
        }

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {

          showMessage(
            error.message,
            "error"
          );

          return;
        }

        if (data.session) {

          window.location.href =
            "perfil.html";

        }

      });

    // =========================
    // REGISTRO
    // =========================

    document
      .getElementById("registerButton")
      .addEventListener("click", async () => {

        clearMessage();

        const email =
          document
            .getElementById("registerEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("registerPassword")
            .value;

        const password2 =
          document
            .getElementById("registerPassword2")
            .value;

        const accepted =
          document
            .getElementById("acceptTerms")
            .checked;

        if (!email || !password || !password2) {

          showMessage(
            "Completá todos los campos.",
            "error"
          );

          return;
        }

        if (password.length < 6) {

          showMessage(
            "La contraseña debe tener al menos 6 caracteres.",
            "error"
          );

          return;
        }

        if (password !== password2) {

          showMessage(
            "Las contraseñas no coinciden.",
            "error"
          );

          return;
        }

        if (!accepted) {

          showMessage(
            "Debés aceptar los Términos y Condiciones y la Política de Privacidad.",
            "error"
          );

          return;
        }

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({
            email,
            password
          });

        if (error) {

          showMessage(
            error.message,
            "error"
          );

          return;
        }

        if (data.session) {

          showMessage(
            "Cuenta creada correctamente.",
            "success"
          );

          setTimeout(() => {

            window.location.href =
              "perfil.html";

          }, 1200);

        } else {

          showMessage(
            "Cuenta creada. Revisá tu email para confirmar tu cuenta.",
            "success"
          );

        }

      });

    // =========================
    // SESIÓN EXISTENTE
    // =========================

    async function comprobarSesion() {

      const {
        data
      } =
        await supabaseClient.auth.getSession();

      if (data.session) {

        window.location.href =
          "perfil.html";

      }

    }

    comprobarSesion();

  </script>

</body>
</html>
