<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(145deg, #07152f, #102d59);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #d9ad45;
      font-size: 42px;
    }

    .logo p {
      color: white;
      margin-top: 8px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    h2 {
      text-align: center;
      color: #15233d;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #15233d;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dbe5;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d9ad45;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: #d9ad45;
      color: #101d34;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .secondary {
      background: #102d59;
      color: white;
      margin-top: 12px;
    }

    .message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>EmiMatch ❤️</h1>
    <p>Conectá. Conocé. Hacé Match.</p>
  </div>

  <div class="card">

    <h2>Bienvenido</h2>

    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      placeholder="tu@email.com"
      autocomplete="email"
    >

    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      placeholder="Tu contraseña"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Iniciar sesión
    </button>

    <button class="secondary" id="registerButton">
      Crear cuenta
    </button>

    <div class="message" id="message"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const message =
document.getElementById("message");

function mostrarMensaje(texto, error = false) {
  message.textContent = texto;
  message.style.color = error ? "#b42318" : "#16803c";
}

document.getElementById("registerButton").onclick =
async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    mostrarMensaje(
      "Completá email y contraseña.",
      true
    );
    return;
  }

  if (password.length < 6) {
    mostrarMensaje(
      "La contraseña debe tener al menos 6 caracteres.",
      true
    );
    return;
  }

  mostrarMensaje("Creando cuenta...");

  const {
    data,
    error
  } = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    mostrarMensaje(error.message, true);
    return;
  }

  if (data.session) {
  window.location.replace(
    "https://emimatch.github.io/emimatch/perfil.html"
  );
  }

  mostrarMensaje(
    "Cuenta creada. Revisá tu email para confirmar la cuenta."
  );
};

document.getElementById("loginButton").onclick =
async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    mostrarMensaje(
      "Completá email y contraseña.",
      true
    );
    return;
  }

  mostrarMensaje("Iniciando sesión...");

  const {
    data,
    error
  } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    mostrarMensaje(
      error.message,
      true
    );
    return;
  }

  if (data.session) {
    window.location.href = "perfil.html";
  }
};

async function comprobarSesion() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {
    window.location.replace(
      "https://emimatch.github.io/emimatch/perfil.html"
    );
  }
}

comprobarSesion();

</script>

</body>
</html>
