<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmiMatch</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(145deg, #07152f, #102d59);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 42px;
      color: #d9ad45;
    }

    .logo p {
      color: #dbe5f5;
      margin-top: 8px;
    }

    .card {
      background: white;
      color: #15233d;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      background: #edf1f7;
      border-radius: 12px;
      padding: 4px;
    }

    .tab {
      width: 50%;
      border: none;
      padding: 12px;
      border-radius: 9px;
      background: transparent;
      font-weight: bold;
      cursor: pointer;
      color: #526078;
    }

    .tab.active {
      background: #0b2a55;
      color: white;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dce7;
      border-radius: 11px;
      font-size: 15px;
    }

    .main-button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: #d9ad45;
      color: #101d34;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      text-align: center;
    }

    .success {
      background: #dff6e8;
      color: #176b39;
    }

    .error {
      background: #ffe2e2;
      color: #9d2222;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>EmiMatch</h1>
    <p>Conectá. Conocé. Encontrá tu match.</p>
  </div>

  <div class="card">

    <div class="tabs">
      <button id="loginTab" class="tab active">
        Iniciar sesión
      </button>

      <button id="registerTab" class="tab">
        Crear cuenta
      </button>
    </div>

    <form id="authForm">

      <div class="field" id="nameField" style="display:none;">
        <label>Nombre</label>
        <input id="name" type="text" placeholder="Tu nombre">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="tuemail@gmail.com" required>
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input id="password" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>

      <button class="main-button" type="submit" id="submitButton">
        Iniciar sesión
      </button>

    </form>

    <div id="message" class="message"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://kngiadwaesdbmvwivdev.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const loginTab =
document.getElementById("loginTab");

const registerTab =
document.getElementById("registerTab");

const nameField =
document.getElementById("nameField");

const nameInput =
document.getElementById("name");

const authForm =
document.getElementById("authForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const submitButton =
document.getElementById("submitButton");

const message =
document.getElementById("message");

let registerMode = false;

loginTab.onclick = () => {

  registerMode = false;

  loginTab.classList.add("active");
  registerTab.classList.remove("active");

  nameField.style.display = "none";

  submitButton.textContent =
  "Iniciar sesión";

};

registerTab.onclick = () => {

  registerMode = true;

  registerTab.classList.add("active");
  loginTab.classList.remove("active");

  nameField.style.display = "block";

  submitButton.textContent =
  "Crear cuenta";

};

authForm.onsubmit = async (event) => {

  event.preventDefault();

  message.style.display = "none";

  const email =
  emailInput.value.trim();

  const password =
  passwordInput.value;

  try {

    if (registerMode) {

      const name =
      nameInput.value.trim();

      const { error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {
          data: {
            full_name: name
          }
        }

      });

      if (error) throw error;

      message.textContent =
      "Cuenta creada. Revisá tu email para confirmar.";

      message.className =
      "message success";

      message.style.display = "block";

    } else {

      const { error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });

      if (error) throw error;

      message.textContent =
      "¡Inicio de sesión correcto!";

      message.className =
      "message success";

      message.style.display = "block";

    }

  } catch (error) {

    message.textContent =
    error.message;

    message.className =
    "message error";

    message.style.display = "block";

  }

};

</script>

</body>
</html>
