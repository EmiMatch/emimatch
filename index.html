  >

  <meta

    content="EmiMatch — Conocé personas, conectá y encontrá nuevas historias."
  >

  <meta
    name="theme-color"
    content="#07111f"
  >

  <title>EmiMatch — Conocé. Conectá. Compartí.</title>

  <!-- =====================================================
       ESTILOS CENTRALES

  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    :root {
      --home-bg: #050b16;
      --home-bg-2: #091426;
      --home-card: rgba(14, 25, 44, 0.88);
      --home-border: rgba(255, 255, 255, 0.09);
      --home-gold: #f5c451;
      --home-gold-light: #ffe39a;
      --home-text: #ffffff;
      --home-muted: #aab6c8;
      --home-purple: #8b5cf6;
      --home-pink: #ec4899;
      --home-success: #34d399;
      --home-danger: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--home-text);
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(139, 92, 246, 0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(236, 72, 153, 0.12),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          var(--home-bg),
          var(--home-bg-2)
        );
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    .home-page {
      min-height: 100vh;
      position: relative;
    }

    /* =====================================================
       FONDO DECORATIVO
    ====================================================== */

    .home-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
    }

    .home-orb.one {
      width: 260px;
      height: 260px;
      top: 80px;
      left: -120px;
      background: rgba(139, 92, 246, 0.18);
    }

    .home-orb.two {
      width: 300px;
      height: 300px;
      right: -140px;
      top: 380px;
      background: rgba(236, 72, 153, 0.13);
    }

    /* =====================================================
       HEADER
    ====================================================== */

    .home-header {
      width: 100%;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(5, 11, 22, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .home-header-inner {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .home-logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
    }

    .home-logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 13px;

      display: grid;
      place-items: center;

      color: #17100a;
      background:
        linear-gradient(
          145deg,
          var(--home-gold-light),
          var(--home-gold)
        );

      box-shadow:
        0 10px 30px rgba(245, 196, 81, 0.22);
      font-size: 1.15rem;
    }

    .home-logo-text {
      background:
        linear-gradient(
          90deg,
          #ffffff,
          var(--home-gold-light)
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .home-header-link {
      text-decoration: none;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;

      padding: 10px 17px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 999px;

      transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;
    }

    .home-header-link:hover {
      transform: translateY(-1px);
      border-color: rgba(245,196,81,0.45);
      background: rgba(245,196,81,0.08);
    }

    /* =====================================================
       MAIN
    ====================================================== */

    .home-main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .home-hero {
      min-height: calc(100vh - 77px);
      padding: 60px 0 70px;

      display: grid;
      grid-template-columns:
        minmax(0, 1.05fr)
        minmax(360px, 0.95fr);

      align-items: center;
      gap: 70px;
    }

    /* =====================================================
       HERO LEFT
    ====================================================== */

    .hero-content {
      max-width: 650px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 13px;
      border-radius: 999px;

      border: 1px solid rgba(245,196,81,0.22);
      background: rgba(245,196,81,0.07);

      color: var(--home-gold-light);
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .hero-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--home-success);
      box-shadow: 0 0 12px rgba(52,211,153,0.7);
    }

    .hero-title {
      margin: 0;

      font-size: clamp(
        3rem,
        6vw,
        5.7rem
      );

      line-height: 0.94;
      letter-spacing: -0.065em;
      font-weight: 950;
    }

    .hero-title-main {
      display: block;
      color: #fff;
    }

    .hero-title-gradient {
      display: block;

      background:
        linear-gradient(
          100deg,
          var(--home-gold-light),
          var(--home-gold),
          #ffffff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-description {
      max-width: 590px;
      margin: 25px 0 0;

      color: var(--home-muted);
      font-size: 1.08rem;
      line-height: 1.75;
    }
