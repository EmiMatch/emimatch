<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#07152f"
  >

  <meta
    name="color-scheme"
    content="dark"
  >

  <title>EmiMatch — Conocé personas y hacé Match</title>

  <meta
    name="description"
    content="EmiMatch: conocé personas, descubrí perfiles, hacé Match y comenzá nuevas conversaciones."
  >

  <meta
    name="author"
    content="EmiMatch"
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    rel="canonical"
    href="https://emimatch.github.io/emimatch/"
  >

  <link
    rel="icon"
    type="image/svg+xml"
    href="favicon.svg"
  >

  <!-- Open Graph -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="EmiMatch — Conocé personas y hacé Match"
  >

  <meta
    property="og:description"
    content="Descubrí perfiles, hacé Match y comenzá nuevas conversaciones."
  >

  <meta
    property="og:url"
    content="https://emimatch.github.io/emimatch/"
  >

  <meta
    property="og:site_name"
    content="EmiMatch"
  >

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 10% 5%,
          rgba(124, 58, 237, .32),
          transparent 32%
        ),

        radial-gradient(
          circle at 90% 15%,
          rgba(217, 173, 69, .16),
          transparent 30%
        ),

        radial-gradient(
          circle at 50% 100%,
          rgba(37, 99, 235, .16),
          transparent 35%
        ),

        linear-gradient(
          145deg,
          #030817 0%,
          #07152f 45%,
          #102d59 100%
        );

      display: flex;
      justify-content: center;
      align-items: center;

      padding:
        24px
        16px
        calc(
          24px +
          env(safe-area-inset-bottom)
        );

      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";

      position: fixed;

      border-radius: 50%;

      pointer-events: none;

      z-index: 0;
    }

    body::before {
      width: 300px;
      height: 300px;

      top: -150px;
      left: -120px;

      background:
        rgba(124, 58, 237, .12);

      filter: blur(50px);
    }

    body::after {
      width: 280px;
      height: 280px;

      right: -120px;
      bottom: -140px;

      background:
        rgba(217, 173, 69, .10);

      filter: blur(60px);
    }

    .app {
      position: relative;

      z-index: 2;

      width: 100%;
      max-width: 450px;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      text-align: center;

      margin-bottom: 20px;
    }

    .brand-icon {
      width: 82px;
      height: 82px;

      margin:
        0
        auto
        14px;

      border-radius: 26px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;

      background:
        linear-gradient(
          145deg,
          #d9ad45,
          #f4d681
        );

      box-shadow:
        0 18px 45px rgba(0,0,0,.38),
        0 0 35px rgba(217,173,69,.18);
    }

    .brand h1 {
      margin: 0;

      font-size: 38px;

      line-height: 1;

      letter-spacing: -1.2px;

      background:
        linear-gradient(
          90deg,
          #ffffff 10%,
          #f4d681 90%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .brand p {
      margin:
        9px
        0
        0;

      color: #b9c4d8;

      font-size: 14px;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      width: 100%;

      padding: 26px;

      border-radius: 26px;

      background:
        rgba(255,255,255,.97);

      color: #172033;

      box-shadow:
        0 28px 70px rgba(0,0,0,.40);

      border:
        1px solid rgba(255,255,255,.35);

      backdrop-filter: blur(18px);
    }

    /* =========================
       TABS
    ========================= */

    .tabs {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 4px;

      padding: 4px;

      margin-bottom: 25px;

      border-radius: 14px;

      background: #edf0f6;
    }

    .tab {
      min-height: 44px;

      border: 0;

      border-radius: 11px;

      background: transparent;

      color: #667085;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;
    }

    .tab.active {
      background: #ffffff;

      color: #102d59;

      box-shadow:
        0 3px 12px rgba(0,0,0,.08);
    }

    /* =========================
       TITLES
    ========================= */

    .section-title {
      text-align: center;

      margin-bottom: 21px;
    }

    .section-title h2 {
      margin: 0;

      color: #102d59;

      font-size: 24px;

      letter-spacing: -.3px;
    }

    .section-title p {
      margin:
        7px
        0
        0;

      color: #788196;

      font-size: 13px;

      line-height: 1.45;
    }

    /* =========================
       FORM
    ========================= */

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      color: #344054;

      font-size: 13px;

      font-weight: 800;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;

      left: 14px;
      top: 50%;

      transform:
        translateY(-50%);

      font-size: 17px;

      pointer-events: none;

      z-index: 2;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;

      height: 52px;

      padding:
        0
        48px
        0
        44px;

      border:
        1px solid #d9deea;

      border-radius: 14px;

      outline: none;

      background: #f8fafc;

      color: #172033;

      font-size: 15px;

      transition:
        border-color .2s,
        box-shadow .2s,
        background .2s;
    }

    input:focus {
      border-color: #7c3aed;

      background: #ffffff;

      box-shadow:
        0 0 0 4px
        rgba(124,58,237,.10);
    }

    input::placeholder {
      color: #98a2b3;
    }

    .password-toggle {
      position: absolute;

      right: 7px;
      top: 50%;

      transform:
        translateY(-50%);

      width: 38px;
      height: 38px;

      border: 0;

      border-radius: 10px;

      background: transparent;

      color: #667085;

      font-size: 17px;

      cursor: pointer;
    }

    .password-toggle:active {
      background: #eef1f7;
    }

    /* =========================
       BUTTON
    ========================= */

    .main-button {
      width: 100%;

      min-height: 53px;

      margin-top: 3px;

      border: 0;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #5b21b6
        );

      color: #ffffff;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 10px 26px
        rgba(92,33,182,.25);

      transition:
        transform .15s,
        box-shadow .15s,
        opacity .15s;
    }

    .main-button:hover {
      transform:
        translateY(-1px);

      box-shadow:
        0 14px 30px
        rgba(92,33,182,.32);
    }

    .main-button:active {
      transform:
        scale(.985);
    }

    .main-button:disabled {
      cursor: wait;

      opacity: .65;

      transform: none;
    }

    .gold-button {
      background:
        linear-gradient(
          135deg,
          #d9ad45,
          #b88924
        );

      color: #07152f;

      box-shadow:
        0 10px 26px
        rgba(184,137,36,.24);
    }

    /* =========================
       FORGOT PASSWORD
    ========================= */

    .forgot {
      display: block;

      margin:
        17px
        0
        2px;

      text-align: center;

      color: #5b21b6;

      font-size: 13px;

      font-weight: 800;

      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    /* =========================
       TERMS
    ========================= */

    .terms {
      display: flex;

      align-items: flex-start;

      gap: 9px;

      margin:
        17px
        0;

      color: #667085;

      font-size: 12px;

      line-height: 1.55;
    }

    .terms input {
      width: 17px;
      height: 17px;

      margin:
        2px
        0
        0;

      flex-shrink: 0;

      accent-color: #7c3aed;

      cursor: pointer;
    }

    .terms a {
      color: #5b21b6;

      font-weight: 800;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;

      margin-top: 16px;

      padding:
        13px
        14px;

      border-radius: 13px;

      font-size: 13px;

      line-height: 1.5;

      text-align: center;

      word-break: break-word;
    }

    .message.success {
      display: block;

      background: #ecfdf3;

      color: #067647;

      border:
        1px solid #abefc6;
    }

    .message.error {
      display: block;

      background: #fef3f2;

      color: #b42318;

      border:
        1px solid #fecdca;
    }

    .message.info {
      display: block;

      background: #eff8ff;

      color: #175cd3;

      border:
        1px solid #b2ddff;
    }

    /* =========================
       RESEND
    ========================= */

    .resend-button {
      display: none;

      width: 100%;

      margin-top: 9px;

      padding: 9px;

      border: 0;

      background: transparent;

      color: #5b21b6;

      font-size: 12px;

      font-weight: 800;

      cursor: pointer;
    }

    .resend-button:hover {
      text-decoration: underline;
    }

    .resend-button:disabled {
      opacity: .5;

      cursor: wait;
    }

    /* =========================
       HIDDEN
    ========================= */

    .hidden {
      display: none !important;
    }

    /* =========================
       FEATURES
    ========================= */

    .features {
      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 8px;

      margin-top: 17px;
    }

    .feature {
      padding:
        7px
        3px;

      text-align: center;

      color: #b9c4d8;

      font-size: 11px;

      line-height: 1.35;
    }

    .feature-icon {
      display: block;

      margin-bottom: 5px;

      font-size: 19px;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer-links {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 15px;

      margin-top: 17px;

      font-size: 11px;
    }

    .footer-links a {
      color: #aebbd0;

      text-decoration: none;
    }

    .footer-links a:hover {
      color: #ffffff;

      text-decoration: underline;
    }

    .footer-dot {
      color: #667085;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      pointer-events: none;

      opacity: .65;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      body {
        align-items: flex-start;

        padding:
          20px
          14px
          calc(
            20px +
            env(safe-area-inset-bottom)
          );
      }

      .app {
        margin-top: 5px;
      }

      .brand-icon {
        width: 72px;
        height: 72px;

        font-size: 36px;
      }

      .brand h1 {
        font-size: 34px;
      }

      .brand p {
        font-size: 13px;
      }

      .card {
        padding:
          21px
          17px;

        border-radius: 23px;
      }

    }

  </style>

  <!-- SUPABASE -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

</head>

<body>

  <main class="app">

    <!-- =========================
         BRAND
    ========================== -->

    <header class="brand">

      <div class="brand-icon">
        💕
      </div>

      <h1>
        EmiMatch
      </h1>

      <p>
        Conocé personas. Hacé Match. Conectá.
      </p>

    </header>


    <!-- =========================
         CARD
    ========================== -->

    <section class="card">

      <!-- TABS -->

      <div class="tabs">

        <button
          id="loginTab"
          class="tab active"
          type="button"
        >
          Iniciar sesión
        </button>

        <button
          id="registerTab"
          class="tab"
          type="button"
        >
          Crear cuenta
        </button>

      </div>


      <!-- =========================
           LOGIN
      ========================== -->

      <div id="loginSection">

        <div class="section-title">

          <h2>
            Bienvenido/a
          </h2>

          <p>
            Entrá a tu cuenta para continuar.
          </p>

        </div>


        <!-- EMAIL -->

        <div class="field">

          <label
            for="loginEmail"
          >
            Email
          </label>

          <div class="input-wrapper">

            <span
              class="input-icon"
            >
              ✉️
            </span>

            <input
              type="email"
              id="loginEmail"
              placeholder="tuemail@ejemplo.com"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              inputmode="email"
            >

          </div>

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label
            for="loginPassword"
          >
            Contraseña
          </label>

          <div class="input-wrapper">

            <span
              class="input-icon"
            >
              🔒
            </span>

            <input
              type="password"
              id="loginPassword"
              placeholder="Tu contraseña"
              autocomplete="current-password"
            >

            <button
              type="button"
              class="password-toggle"
              data-target="loginPassword"
              aria-label="Mostrar contraseña"
            >
              👁️
            </button>

          </div>

        </div>


        <!-- LOGIN BUTTON -->

        <button
          id="loginButton"
          class="main-button"
          type="button"
        >
          Iniciar sesión
        </button>


        <!-- FORGOT -->

        <a
          class="forgot"
          href="recuperar.html"
        >
          ¿Olvidaste tu contraseña?
        </a>

      </div>


      <!-- =========================
           REGISTER
      ========================== -->

      <div
        id="registerSection"
        class="hidden"
      >

        <div class="section-title">

          <h2>
            Crear cuenta
          </h2>

          <p>
            Empezá a conocer nuevas personas.
          </p>

        </div>


        <!-- EMAIL -->

        <div class="field">

          <label
            for="registerEmail"
          >
            Email
          </label>

          <div class="input-wrapper">

            <span
              class="input-icon"
            >
              ✉️
            </span>

            <input
              type="email"
              id="registerEmail"
              placeholder="tuemail@ejemplo.com"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              inputmode="email"
            >

          </div>

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label
            for="registerPassword"
          >
            Contraseña
          </label>

          <div class="input-wrapper">

            <span
              class="input-icon"
            >
              🔒
            </span>

            <input
              type="password"
              id="registerPassword"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
            >

            <button
              type="button"
              class="password-toggle"
              data-target="registerPassword"
              aria-label="Mostrar contraseña"
            >
              👁️
            </button>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="field">

          <label
            for="registerPassword2"
          >
            Confirmar contraseña
          </label>

          <div class="input-wrapper">

            <span
              class="input-icon"
            >
              🔐
            </span>

            <input
              type="password"
              id="registerPassword2"
              placeholder="Repetí tu contraseña"
              autocomplete="new-password"
            >

            <button
              type="button"
              class="password-toggle"
              data-target="registerPassword2"
              aria-label="Mostrar contraseña"
            >
              👁️
            </button>

          </div>

        </div>


        <!-- TERMS -->

        <label class="terms">

          <input
            type="checkbox"
            id="acceptTerms"
          >

          <span>

            Acepto los

            <a
              href="terminos.html"
              target="_blank"
              rel="noopener noreferrer"
            >
              Términos y Condiciones
            </a>

            y la

            <a
              href="privacidad.html"
              target="_blank"
              rel="noopener noreferrer"
            >
              Política de Privacidad
            </a>

            de EmiMatch.

          </span>

        </label>


        <!-- REGISTER BUTTON -->

        <button
          id="registerButton"
          class="main-button gold-button"
          type="button"
        >
          Crear mi cuenta
        </button>

      </div>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- RESEND EMAIL -->

      <button
        id="resendButton"
        class="resend-button"
        type="button"
      >
        📧 Reenviar correo de confirmación
      </button>

    </section>


    <!-- =========================
         FEATURES
    ========================== -->

    <div class="features">

      <div class="feature">

        <span class="feature-icon">
          🔎
        </span>

        Descubrí perfiles

      </div>


      <div class="feature">

        <span class="feature-icon">
          💕
        </span>

        Hacé Match

      </div>


      <div class="feature">

        <span class="feature-icon">
          💬
        </span>

        Comenzá a hablar

      </div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <nav
      class="footer-links"
      aria-label="Enlaces legales"
    >

      <a
        href="terminos.html"
      >
        Términos
      </a>

      <span class="footer-dot">
        •
      </span>

      <a
        href="privacidad.html"
      >
        Privacidad
      </a>

    </nav>

  </main>

       JAVASCRIPT
  ========================== -->

    document.addEventListener(
