<script>
  const SUPABASE_URL =
    "https://kngiadwaesdbmvwivdev.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_TSCAMZ4gmB0mHF10DULT3Q_y25xBw1m";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  // ==============================
  // ELEMENTOS
  // ==============================

  const loginSection =
    document.getElementById("loginSection");

  const registerSection =
    document.getElementById("registerSection");

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  const message =
    document.getElementById("message");

  const loginButton =
    document.getElementById("loginButton");

  const registerButton =
    document.getElementById("registerButton");

  // ==============================
  // MENSAJES
  // ==============================

  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "message";
  }

  // ==============================
  // CAMBIAR ENTRE LOGIN / REGISTRO
  // ==============================

  function showLogin() {
    clearMessage();

    loginSection.classList.remove("hidden");
    registerSection.classList.add("hidden");

    loginTab.classList.add("active");
    registerTab.classList.remove("active");
  }

  function showRegister() {
    clearMessage();

    loginSection.classList.add("hidden");
    registerSection.classList.remove("hidden");

    loginTab.classList.remove("active");
    registerTab.classList.add("active");
  }

  loginTab.addEventListener("click", showLogin);
  registerTab.addEventListener("click", showRegister);

  // ==============================
  // MOSTRAR / OCULTAR CONTRASEÑA
  // ==============================

  document
    .querySelectorAll(".password-toggle")
    .forEach(button => {

      button.addEventListener("click", () => {

        const target =
          document.getElementById(
            button.dataset.target
          );

        if (!target) return;

        if (target.type === "password") {
          target.type = "text";
          button.textContent = "🙈";
          button.setAttribute(
            "aria-label",
            "Ocultar contraseña"
          );
        } else {
          target.type = "password";
          button.textContent = "👁️";
          button.setAttribute(
            "aria-label",
            "Mostrar contraseña"
          );
        }
      });
    });

  // ==============================
  // VALIDAR EMAIL
  // ==============================

  function isValidEmail(email) {

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(email);
  }

  // ==============================
  // LOGIN
  // ==============================

  loginButton.addEventListener(
    "click",
    async () => {

      clearMessage();

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim()
          .toLowerCase();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      if (!email) {
        showMessage(
          "Ingresá tu email.",
          "error"
        );
        return;
      }

      if (!isValidEmail(email)) {
        showMessage(
          "Ingresá un email válido.",
          "error"
        );
        return;
      }

      if (!password) {
        showMessage(
          "Ingresá tu contraseña.",
          "error"
        );
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Ingresando...";
      loginButton.classList.add("loading");

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({
              email,
              password
            });

        if (error) {
          console.error(
            "Error de login:",
            error
          );

          showMessage(
            traducirError(error),
            "error"
          );

          return;
        }

        if (data?.session) {

          showMessage(
            "¡Bienvenido/a a EmiMatch!",
            "success"
          );

          setTimeout(() => {
            window.location.href =
              "perfil.html";
          }, 500);

        } else {

          showMessage(
            "No se pudo iniciar la sesión. Intentá nuevamente.",
            "error"
          );

        }

      } catch (error) {

        console.error(error);

        showMessage(
          "Ocurrió un error de conexión. Revisá tu internet e intentá nuevamente.",
          "error"
        );

      } finally {

        loginButton.disabled = false;
        loginButton.textContent =
          "Iniciar sesión";

        loginButton.classList.remove(
          "loading"
        );
      }
    }
  );

  // ==============================
  // REGISTRO
  // ==============================

  registerButton.addEventListener(
    "click",
    async () => {

      clearMessage();

      const email =
        document
          .getElementById("registerEmail")
          .value
          .trim()
          .toLowerCase();

      const password =
        document
          .getElementById("registerPassword")
          .value;

      const password2 =
        document
          .getElementById("registerPassword2")
          .value;

      const accepted =
        document
          .getElementById("acceptTerms")
          .checked;

      // ------------------------------
      // VALIDACIONES
      // ------------------------------

      if (!email) {
        showMessage(
          "Ingresá tu email.",
          "error"
        );
        return;
      }

      if (!isValidEmail(email)) {
        showMessage(
          "Ingresá un email válido.",
          "error"
        );
        return;
      }

      if (!password) {
        showMessage(
          "Ingresá una contraseña.",
          "error"
        );
        return;
      }

      if (password.length < 6) {
        showMessage(
          "La contraseña debe tener al menos 6 caracteres.",
          "error"
        );
        return;
      }

      if (password !== password2) {
        showMessage(
          "Las contraseñas no coinciden.",
          "error"
        );
        return;
      }

      if (!accepted) {
        showMessage(
          "Debés aceptar los Términos y la Política de Privacidad.",
          "error"
        );
        return;
      }

      // ------------------------------
      // BLOQUEAR BOTÓN
      // ------------------------------

      registerButton.disabled = true;
      registerButton.textContent =
        "Creando cuenta...";
      registerButton.classList.add(
        "loading"
      );

      try {

        console.log(
          "Intentando registrar:",
          email
        );

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signUp({
              email,
              password,

              options: {
                emailRedirectTo:
                  "https://emimatch.github.io/emimatch/"
              }
            });

        console.log(
          "Respuesta Supabase:",
          data,
          error
        );

        // ------------------------------
        // ERROR
        // ------------------------------

        if (error) {

          console.error(
            "Error de registro:",
            error
          );

          showMessage(
            traducirError(error),
            "error"
          );

          return;
        }

        // ------------------------------
        // REGISTRO EXITOSO
        // ------------------------------

        if (data?.user) {

          /*
           * Si Supabase requiere confirmación
           * por email, normalmente session será null.
           */

          if (!data.session) {

            showMessage(
              "✅ Cuenta creada correctamente. Revisá tu email para confirmar la cuenta antes de iniciar sesión.",
              "success"
            );

            document
              .getElementById(
                "registerEmail"
              )
              .value = "";

            document
              .getElementById(
                "registerPassword"
              )
              .value = "";

            document
              .getElementById(
                "registerPassword2"
              )
              .value = "";

            document
              .getElementById(
                "acceptTerms"
              )
              .checked = false;

          } else {

            showMessage(
              "✅ Cuenta creada correctamente. Entrando a tu perfil...",
              "success"
            );

            setTimeout(() => {

              window.location.href =
                "perfil.html";

            }, 700);
          }

        } else {

          showMessage(
            "La cuenta no pudo crearse. Intentá nuevamente.",
            "error"
          );
        }

      } catch (error) {

        console.error(
          "Error inesperado:",
          error
        );

        showMessage(
          "No se pudo conectar con el servidor. Revisá tu conexión e intentá nuevamente.",
          "error"
        );

      } finally {

        registerButton.disabled = false;

        registerButton.textContent =
          "Crear mi cuenta";

        registerButton.classList.remove(
          "loading"
        );
      }
    }
  );

  // ==============================
  // TRADUCIR ERRORES DE SUPABASE
  // ==============================

  function traducirError(error) {

    const message =
      String(
        error?.message || ""
      ).toLowerCase();

    if (
      message.includes(
        "user already registered"
      ) ||
      message.includes(
        "already registered"
      )
    ) {
      return "Este email ya está registrado. Intentá iniciar sesión.";
    }

    if (
      message.includes(
        "invalid login credentials"
      )
    ) {
      return "El email o la contraseña son incorrectos.";
    }

    if (
      message.includes(
        "email not confirmed"
      )
    ) {
      return "Tu email todavía no fue confirmado. Revisá tu bandeja de entrada.";
    }

    if (
      message.includes(
        "password"
      ) &&
      message.includes(
        "6"
      )
    ) {
      return "La contraseña debe tener al menos 6 caracteres.";
    }

    if (
      message.includes(
        "rate limit"
      ) ||
      message.includes(
        "too many requests"
      )
    ) {
      return "Demasiados intentos. Esperá unos minutos y probá nuevamente.";
    }

    if (
      message.includes(
        "email"
      ) &&
      message.includes(
        "invalid"
      )
    ) {
      return "El email ingresado no es válido.";
    }

    return (
      error?.message ||
      "Ocurrió un error. Intentá nuevamente."
    );
  }

  // ==============================
  // COMPROBAR SESIÓN EXISTENTE
  // ==============================

  async function comprobarSesion() {

    try {

      const {
        data
      } =
        await supabaseClient.auth
          .getSession();

      if (data?.session) {

        /*
         * Si ya está logueado y entra al index,
         * lo enviamos directamente al perfil.
         */

        window.location.href =
          "perfil.html";
      }

    } catch (error) {

      console.error(
        "Error comprobando sesión:",
        error
      );
    }
  }

  comprobarSesion();

      </script>
