<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmiMatch — Conectá con alguien especial</title>

  <meta
    name="description"
    content="EmiMatch: conocé personas, descubrí nuevas conexiones y encontrá tu match."
  >

  <meta name="theme-color" content="#07152f">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.28), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(217, 173, 69, 0.15), transparent 30%),
        linear-gradient(135deg, #050b1c, #07152f 45%, #102d59);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    .background-glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
    }

    .glow-one {
      background: #7c3aed;
      top: -100px;
      left: -100px;
    }

    .glow-two {
      background: #d9ad45;
      bottom: -120px;
      right: -100px;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: rgba(10, 20, 43, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 34px 26px 28px;
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-icon {
      font-size: 42px;
      display: block;
      margin-bottom: 6px;
    }

    .logo h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #d9ad45;
      text-shadow: 0 4px 20px rgba(217, 173, 69, 0.22);
    }

    .subtitle {
      text-align: center;
      color: #c8d1e3;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 auto 28px;
      max-width: 330px;
    }

    .form-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 18px;
      text-align: center;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      color: #d9e1ef;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      height: 52px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      outline: none;
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
      padding: 0 15px;
      font-size: 15px;
      transition: 0.2s ease;
    }

    .field input::placeholder {
      color: #7f8ba3;
    }

    .field input:focus {
      border-color: #a78bfa;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.16);
    }

    .buttons {
      display: grid;
      gap: 11px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    #loginButton {
      color: #ffffff;
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      box-shadow: 0 10px 28px rgba(124, 58, 237, 0.24);
    }

    #registerButton {
      color: #111827;
      background: linear-gradient(135deg, #f0cf72, #d9ad45);
      box-shadow: 0 10px 28px rgba(217, 173, 69, 0.18);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #68758d;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.10);
    }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.success {
      color: #d1fae5;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .message.error {
      color: #fecaca;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #71809b;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer strong {
      color: #d9ad45;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07152f;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-box {
      text-align: center;
    }

    .loader-heart {
      font-size: 42px;
      animation: pulse 1.2s infinite;
    }

    .loader-text {
      margin-top: 10px;
      color: #d9ad45;
      font-weight: 700;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 30px 20px 24px;
        border-radius: 24px;
      }

      .logo h1 {
        font-size: 32px;
      }

      .logo-icon {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>

  <!-- Pantalla de carga -->
  <div class="loading" id="loadingScreen">
    <div class="loader-box">
      <div class="loader-heart">💕</div>
      <div class="loader-text">EmiMatch</div>
    </div>
  </div>

  <main class="container">

    <section class="card">

      <div class="logo">
        <span class="logo-icon">💕</span>
        <h1>EmiMatch</h1>
      </div>

      <p class="subtitle">
        Conocé personas, descubrí nuevas conexiones
        y encontrá alguien especial.
      </p>

      <h2 class="form-title">Bienvenido/a</h2>

      <form id="authForm">

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="current-password"
            minlength="6"
            required
          >
        </div>

        <div class="buttons">
          <button type="button" id="loginButton">
            Iniciar sesión
          </button>

          <button type="button" id="registerButton">
            Crear mi cuenta
          </button>
        </div>

      </form>

      <div class="divider">
        <span>EmiMatch</span>
      </div>

      <div id="message" class="message"></div>

      <div class="footer">
        Tu próxima conexión puede estar a un match de distancia.<br>
        <strong>💕 EmiMatch</strong>
      </div>

    </section>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /*
      IMPORTANTE:
      Pegá acá EXACTAMENTE las mismas credenciales
      de Supabase que ya utilizás en tu EmiMatch actual.
    */

    const SUPABASE_URL = "PEGÁ_ACÁ_TU_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "PEGÁ_ACÁ_TU_SUPABASE_ANON_KEY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const loadingScreen = document.getElementById("loadingScreen");
    const loginButton = document.getElementById("loginButton");
    const registerButton = document.getElementById("registerButton");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const messageBox = document.getElementById("message");

    function hideLoading() {
      loadingScreen.classList.add("hidden");
    }

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = "message show " + type;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function getCredentials() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email) {
        showMessage("Ingresá tu correo electrónico.");
        emailInput.focus();
        return null;
      }

      if (!password || password.length < 6) {
        showMessage("La contraseña debe tener al menos 6 caracteres.");
        passwordInput.focus();
        return null;
      }

      return { email, password };
    }

    async function checkExistingSession() {
      try {
        const {
          data: { session },
          error
        } = await supabaseClient.auth.getSession();

        if (error) {
          console.error(error);
          hideLoading();
          return;
        }

        if (session) {
          window.location.href = "perfil.html";
          return;
        }

        hideLoading();

      } catch (error) {
        console.error(error);
        hideLoading();
      }
    }

    loginButton.addEventListener("click", async () => {
      clearMessage();

      const credentials = getCredentials();

      if (!credentials) {
        return;
      }

      loginButton.disabled = true;
      registerButton.disabled = true;
      loginButton.textContent = "Ingresando...";

      try {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: credentials.email,
          password: credentials.password
        });

        if (error) {
          console.error(error);

          if (
            error.message.toLowerCase().includes("invalid login credentials")
          ) {
            showMessage("El correo o la contraseña son incorrectos.");
          } else {
            showMessage(error.message);
          }

          loginButton.disabled = false;
          registerButton.disabled = false;
          loginButton.textContent = "Iniciar sesión";
          return;
        }

        showMessage("Inicio de sesión correcto. Entrando...", "success");

        setTimeout(() => {
          window.location.href = "perfil.html";
        }, 500);

      } catch (error) {
        console.error(error);
        showMessage("No se pudo iniciar sesión. Intentá nuevamente.");

        loginButton.disabled = false;
        registerButton.disabled = false;
        loginButton.textContent = "Iniciar sesión";
      }
    });

    registerButton.addEventListener("click", async () => {
      clearMessage();

      const credentials = getCredentials();

      if (!credentials) {
        return;
      }

      loginButton.disabled = true;
      registerButton.disabled = true;
      registerButton.textContent = "Creando cuenta...";

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email: credentials.email,
          password: credentials.password
        });

        if (error) {
          console.error(error);

          showMessage(error.message);

          loginButton.disabled = false;
          registerButton.disabled = false;
          registerButton.textContent = "Crear mi cuenta";
          return;
        }

        /*
          Si Supabase devuelve una sesión,
          podemos entrar directamente al perfil.
        */
        if (data.session) {
          showMessage(
            "Cuenta creada correctamente. Entrando a tu perfil...",
            "success"
          );

          setTimeout(() => {
            window.location.href = "perfil.html";
          }, 600);

          return;
        }

        /*
          Si la confirmación por email está activada,
          Supabase no devuelve sesión inmediatamente.
        */
        showMessage(
          "Cuenta creada. Revisá tu correo electrónico para confirmar la cuenta.",
          "success"
        );

        loginButton.disabled = false;
        registerButton.disabled = false;
        registerButton.textContent = "Crear mi cuenta";

      } catch (error) {
        console.error(error);

        showMessage("No se pudo crear la cuenta. Intentá nuevamente.");

        loginButton.disabled = false;
        registerButton.disabled = false;
        registerButton.textContent = "Crear mi cuenta";
      }
    });

    /*
      Permite presionar Enter dentro del formulario
      para iniciar sesión.
    */
    document.getElementById("authForm").addEventListener("submit", (event) => {
      event.preventDefault();
      loginButton.click();
    });

    /*
      Control de sesión al cargar.
    */
    checkExistingSession();
  </script>

</body>
      </html>
